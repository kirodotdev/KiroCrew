<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
  <rect width="480" height="270" fill="#1a1a2e"/>
  <!-- Node 1 -->
  <rect x="140" y="115" width="50" height="30" rx="8" fill="#818cf8"/>
  <rect x="152" y="125" width="26" height="4" rx="2" fill="#312e81"/>
  <rect x="152" y="133" width="18" height="3" rx="1.5" fill="#3730a3"/>
  <!-- Arrow 1->2 -->
  <line x1="190" y1="130" x2="220" y2="160" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <polygon points="218,155 224,162 215,161" fill="#475569"/>
  <!-- Node 2 -->
  <rect x="220" y="150" width="50" height="30" rx="8" fill="#60a5fa"/>
  <rect x="232" y="160" width="26" height="4" rx="2" fill="#1e3a5f"/>
  <rect x="232" y="168" width="18" height="3" rx="1.5" fill="#1e40af"/>
  <!-- Arrow 2->3 -->
  <line x1="270" y1="165" x2="300" y2="165" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <polygon points="298,160 306,165 298,170" fill="#475569"/>
  <!-- Node 3 -->
  <rect x="305" y="150" width="50" height="30" rx="8" fill="#34d399"/>
  <rect x="317" y="160" width="26" height="4" rx="2" fill="#064e3b"/>
  <rect x="317" y="168" width="18" height="3" rx="1.5" fill="#065f46"/>
  <!-- Branch from node 1 -->
  <line x1="190" y1="130" x2="220" y2="105" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/>
  <!-- Small parallel node -->
  <rect x="220" y="90" width="40" height="24" rx="6" fill="#fbbf24" opacity="0.8"/>
  <rect x="230" y="98" width="20" height="3" rx="1.5" fill="#78350f"/>
  <rect x="230" y="104" width="14" height="3" rx="1.5" fill="#92400e"/>
</svg>
