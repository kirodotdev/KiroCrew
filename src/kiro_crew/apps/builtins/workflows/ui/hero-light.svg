<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
  <rect width="480" height="270" fill="#f8f9fa"/>
  <!-- Node 1 (purple) -->
  <rect x="140" y="115" width="50" height="30" rx="8" fill="#6366f1"/>
  <rect x="152" y="125" width="26" height="4" rx="2" fill="#c7d2fe"/>
  <rect x="152" y="133" width="18" height="3" rx="1.5" fill="#a5b4fc"/>
  <!-- Arrow 1->2 -->
  <line x1="190" y1="130" x2="220" y2="160" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <polygon points="218,155 224,162 215,161" fill="#94a3b8"/>
  <!-- Node 2 (blue) -->
  <rect x="220" y="150" width="50" height="30" rx="8" fill="#3b82f6"/>
  <rect x="232" y="160" width="26" height="4" rx="2" fill="#bfdbfe"/>
  <rect x="232" y="168" width="18" height="3" rx="1.5" fill="#93c5fd"/>
  <!-- Arrow 2->3 -->
  <line x1="270" y1="165" x2="300" y2="165" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <polygon points="298,160 306,165 298,170" fill="#94a3b8"/>
  <!-- Node 3 (green) -->
  <rect x="305" y="150" width="50" height="30" rx="8" fill="#10b981"/>
  <rect x="317" y="160" width="26" height="4" rx="2" fill="#a7f3d0"/>
  <rect x="317" y="168" width="18" height="3" rx="1.5" fill="#6ee7b7"/>
  <!-- Dashed branch from node 1 (parallel) -->
  <line x1="190" y1="130" x2="220" y2="105" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/>
  <!-- Small parallel node (amber) -->
  <rect x="220" y="90" width="40" height="24" rx="6" fill="#f59e0b" opacity="0.8"/>
  <rect x="230" y="98" width="20" height="3" rx="1.5" fill="#fef3c7"/>
  <rect x="230" y="104" width="14" height="3" rx="1.5" fill="#fde68a"/>
</svg>
