schema-version: 2026-04-28
fixture-name: apps-installed
description: |
  Seven locally installed apps with manifests and persisted metadata, plus
  app-scoped data for fixture-notes. Every record is enabled with origin=local,
  resources=gateway, and lifecycle=gateway so app-manager consumers have
  non-builtin subjects. Each manifest declares one ui.pages route and no UI
  bundle, so each app is a row in the dashboard's Apps rail; seven local rows
  is more than the rail's six-row fold (APPS_NAV_LIMIT in
  website/src/shell/appShell.tsx), so its "N more" toggle renders from this seed
  without counting any builtin app.
  It also seeds the builtin workflows record enabled: that app ships with
  defaultEnabled false, and registration keeps an existing record's enabled state.
