schema-version: 2026-04-28
fixture-name: rich
description: |
  Superset of the ``minimal`` fixture that layers extra chat sessions,
  folder metadata, and an archived session on top of the same skeleton
  (two workspaces, preferences/projects/semantic/history, crons, hook).
  Mirrors the shape of a heavily-used user $KIROCREW_HOME so the
  dashboard looks populated on first boot — useful for UX screenshots,
  demos, and e2e tests that exercise folder grouping, History panel,
  and archive retention paths.

  Shipped sessions:
    - dashboard_starter         : pinned, default agent, 4 msg (welcome)
    - dashboard_coder-demo      : pinned, kirocrew agent, folder=demos, 8 msg
    - dashboard_triage-demo     : default agent, folder=demos, 6 msg
    - dashboard_research-notes  : closed, default agent, 12 msg (History + search)
    - archive/research-notes.<ts>.jsonl : synthesized archive slice

  SQLite stores (memory.db, memory_index.db) are intentionally omitted —
  vector-backed semantic memory and the event log bootstrap themselves
  empty on first gateway start. Text-only content (markdown, JSON,
  JSONL) gives deterministic byte-for-byte comparison in tests; SQLite
  binaries would require a reproducible builder script to be diffable.
