<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- LCARS logo: delta on a black rounded square, orange accent.
       Designed to read at favicon size (16x16) and avatar size (28x28). -->
  <rect width="64" height="64" rx="12" ry="12" fill="#000000"/>
  <!-- Top accent pill -->
  <rect x="6" y="6" width="22" height="6" rx="3" fill="#FF9900"/>
  <!-- Bottom accent pill -->
  <rect x="36" y="52" width="22" height="6" rx="3" fill="#FFCC66"/>
  <!-- Delta (simplified arrowhead) -->
  <path d="M 32 14 L 50 50 L 32 42 L 14 50 Z" fill="#FF9900" stroke="#FFCC66" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Inner highlight to give the delta dimension -->
  <path d="M 32 22 L 42 44 L 32 40 L 22 44 Z" fill="#FFCC66" opacity="0.55"/>
</svg>
