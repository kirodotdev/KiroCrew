AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  KiroCrew self-hosted gateway on a single EC2 instance in the user's own AWS
  account. Reached over SSM Session Manager (no inbound ports, no SSH key).
  Managed by `kirocrew cloud`. Delete this stack to remove all resources.

# ---------------------------------------------------------------------------
# Parameters — all defaulted; `kirocrew cloud launch` overrides via
# --parameter-overrides. The wizard resolves VpcId/SubnetId from the account's
# default VPC and passes them, so the user never picks networking by hand.
# ---------------------------------------------------------------------------
Parameters:
  InstanceType:
    Type: String
    Default: m7g.2xlarge
    Description: EC2 instance type (from the chosen size tier; default = Development).
  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]
    Description: CPU architecture; selects the matching Amazon Linux 2023 AMI.
  VolumeSizeGb:
    Type: Number
    Default: 60
    MinValue: 20
    MaxValue: 1000
    Description: gp3 root volume size in GiB.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to launch into (the wizard passes the default VPC).
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet to launch into (a public subnet in the chosen VPC).
  StackTag:
    Type: String
    Default: kirocrew
    # Cap at 51 (not 63) to mirror the CLI's _TAG_RE: the IAM role /
    # instance-profile is named "kirocrew-ec2-${StackTag}" and IAM role names
    # max at 64 (13 + 51 = 64). A 52-63 char tag would pass template validation
    # here but then fail opaquely at AWS::IAM::Role creation on a direct
    # `aws cloudformation deploy`; failing early in validation is clearer.
    AllowedPattern: "[a-zA-Z0-9-]{1,51}"
    Description: Discovery tag value written as kirocrew:instance.
  PermissionsBoundaryArn:
    Type: String
    # The launcher fills this with the deterministic ARN of the SHARED, PRE-CREATED
    # immutable instance permissions boundary (arn:aws:iam::<account>:policy/
    # kirocrew-ec2-boundary). It is created ONCE by launcher code
    # (source.ensure_instance_boundary), NOT per-launch here, so a leaked launcher
    # credential can't author a permissive boundary (see cloud/iam.py). The
    # AllowedPattern mirrors the other ARN params: an IAM policy ARN naming exactly
    # the boundary. InstanceRole references this by ARN — the CEILING on what the
    # role can EVER do, regardless of inline/attached policies.
    AllowedPattern: "^arn:aws:iam::[0-9]{12}:policy/kirocrew-ec2-boundary$"
    Description: >-
      ARN of the pre-created shared instance permissions boundary
      (arn:aws:iam::<account>:policy/kirocrew-ec2-boundary). The launcher creates
      it once and passes it here; the InstanceRole is capped by it.
  # NB: the AllowedPatterns below mirror the launcher CLI's FieldSpec charsets
  # (cloud/ec2.py). These values flow into the root user-data script, so the
  # template itself must reject shell metacharacters even when someone deploys
  # it directly with `aws cloudformation deploy`, bypassing the CLI validation.
  SourceBucket:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9.-]{3,63}$"
    Description: >-
      S3 bucket holding the KiroCrew source tarball uploaded by the launcher.
      When set, the instance downloads the source from S3 (using its IAM role);
      no GitHub access needed. Empty = fall back to a public git clone.
  SourceKey:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[A-Za-z0-9_./-]{1,255}$"
    Description: S3 key of the source tarball (kirocrew-src.tar.gz) within SourceBucket.
  KirocrewRepo:
    Type: String
    Default: https://github.com/kirodotdev/KiroCrew.git
    AllowedPattern: "^[A-Za-z0-9_.:/@+-]{1,255}$"
    Description: Git repo to clone when SourceBucket is not set (public-repo fallback).
  KirocrewRef:
    Type: String
    Default: main
    AllowedPattern: "^[A-Za-z0-9_./-]{1,128}$"
    Description: Git ref (branch/tag) to install when cloning.
  AllowSshCidr:
    Type: String
    Default: ""
    # Valid IPv4 octets (0-255) and mask /16-/32 only — mirrors the CLI's
    # _validate_cidr (which hard-refuses anything wider than /16), so a
    # direct-to-CloudFormation deploy fails at validation with a clear message
    # instead of opaquely at security-group creation. SSM needs no inbound at all.
    AllowedPattern: "^$|^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/(3[0-2]|2[0-9]|1[6-9])$"
    Description: >-
      Advanced/optional. If set (e.g. 1.2.3.4/32), opens inbound TCP 22 from that
      CIDR. The stack provisions NO key pair, so this only yields a usable login
      when combined with EC2 Instance Connect (which pushes an ephemeral key over
      the AWS API). Empty (default, recommended) = SSM-only: no inbound ports and
      no key material - use `kirocrew cloud connect` (SSM port-forward) instead.

# The AMI is resolved at deploy time from the public SSM Parameter Store alias —
# never a hardcoded per-region AMI id. Latest Amazon Linux 2023 for the arch.
# Mapping keys must be alphanumeric (no underscores), so x86_64 -> "x8664".
Mappings:
  ArchToAmiParam:
    arm64:
      Param: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    x8664:
      Param: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Conditions:
  HasSshCidr: !Not [!Equals [!Ref AllowSshCidr, ""]]
  IsArm: !Equals [!Ref Architecture, arm64]
  HasS3Source: !Not [!Equals [!Ref SourceBucket, ""]]

Resources:
  # --- IAM: instance role trusts EC2 and gets SSM core (enables Session Manager
  #     with zero inbound ports). Role name is prefixed so the launcher IAM
  #     policy can scope PassRole to it.
  #
  #     PermissionsBoundary references the SHARED, PRE-CREATED, IMMUTABLE boundary
  #     (kirocrew-ec2-boundary) by ARN via the PermissionsBoundaryArn parameter —
  #     it is NOT created per-launch here anymore. That boundary is the CEILING on
  #     what the role can EVER do, regardless of inline/attached policies: even if
  #     a holder of the launcher policy inlined an admin policy onto this role and
  #     passed it to EC2, the effective permissions are capped to exactly SSM
  #     Session Manager + the launcher-bucket source read. Because the boundary is
  #     created once by launcher code (not authored per-launch by whoever holds
  #     the launcher policy) and can't be re-versioned, the ceiling holds even
  #     against a leaked launcher credential. The launcher IAM policy requires this
  #     boundary on iam:CreateRole (see cloud/iam.py), so a created kirocrew-ec2-*
  #     role MUST carry it.
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "kirocrew-ec2-${StackTag}"
      PermissionsBoundary: !Ref PermissionsBoundaryArn
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      # Read-only access to just this launch's source object (when S3-sourced).
      # ARN derived from the deterministic launcher path, NOT SourceBucket/
      # SourceKey params (see the boundary statement above for why).
      Policies: !If
        - HasS3Source
        - - PolicyName: SourceObjectRead
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: s3:GetObject
                  Resource: !Sub "arn:aws:s3:::kirocrew-src-${AWS::AccountId}-${AWS::Region}/${StackTag}/kirocrew-src.tar.gz"
        - !Ref AWS::NoValue
      Tags:
        - { Key: "kirocrew:managed", Value: "true" }
        - { Key: "kirocrew:instance", Value: !Ref StackTag }

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "kirocrew-ec2-${StackTag}"
      Roles: [!Ref InstanceRole]

  # --- Security group: no ingress by default (SSM is outbound-only). Egress all
  #     so the box can pull packages, reach SSM, and the kiro-cli/LLM endpoints.
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "KiroCrew ${StackTag} - SSM-only (no inbound by default)"
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound
      Tags:
        - { Key: "kirocrew:managed", Value: "true" }
        - { Key: "kirocrew:instance", Value: !Ref StackTag }

  # Optional SSH ingress — only created when AllowSshCidr is non-empty.
  SshIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasSshCidr
    Properties:
      GroupId: !Ref InstanceSecurityGroup
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      CidrIp: !Ref AllowSshCidr
      Description: SSH fallback from the user's CIDR

  # --- The instance. UserData installs KiroCrew + kiro-cli + the systemd service
  #     and signals the WaitCondition when the gateway is healthy (or fails it
  #     with the tail of the setup log, so the stack rolls back cleanly).
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Sub
        - "{{resolve:ssm:${Param}}}"
        - Param: !If
            - IsArm
            - !FindInMap [ArchToAmiParam, arm64, Param]
            - !FindInMap [ArchToAmiParam, x8664, Param]
      IamInstanceProfile: !Ref InstanceProfile
      # Attach the ENI explicitly so we can force a public IP. discover_network
      # prefers a NAT subnet, but when only an internet-gateway subnet is
      # available a public IP is REQUIRED for egress — and the subnet's
      # MapPublicIpOnLaunch may be false. AssociatePublicIpAddress overrides that
      # at the instance level so bootstrap (dnf/npm/pip + SSM) can't silently hang
      # to the WaitCondition timeout. Harmless in a NAT/private subnet (the extra
      # public IP is simply unused). SubnetId/SecurityGroupIds move here because
      # they're mutually exclusive with the top-level forms.
      NetworkInterfaces:
        - DeviceIndex: 0
          # ── Documented accepted tradeoff (CWE-1188) ──
          # A public IP widens attack surface, but is REQUIRED for egress when
          # only an IGW subnet is available (bootstrap would otherwise hang). It
          # is accepted, not an oversight, because it is defense-in-depth capped:
          #   * InstanceSecurityGroup has NO default inbound ingress (SSM-only,
          #     egress-only); optional SSH is gated behind HasSshCidr with a
          #     validated CIDR (rejects ranges wider than /16).
          #   * IMDSv2 enforced (HttpTokens: required, HopLimit: 1) below.
          #   * EBS root encrypted.
          # Preferred posture is still a private subnet + NAT (discover_network
          # picks that first); this only forces the public IP on IGW-only subnets.
          AssociatePublicIpAddress: true
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref InstanceSecurityGroup]
      # Enforce IMDSv2 (token-required) and a hop limit of 1. KiroCrew runs a
      # prompt-injectable agent that executes arbitrary tools, so an SSRF or
      # injection that reaches 169.254.169.254 must NOT be able to read the
      # instance role's STS credentials via unauthenticated IMDSv1.
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref VolumeSizeGb
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - { Key: "Name", Value: !Sub "kirocrew-${StackTag}" }
        - { Key: "kirocrew:managed", Value: "true" }
        - { Key: "kirocrew:instance", Value: !Ref StackTag }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # KiroCrew EC2 bootstrap. Runs as root via cloud-init on first boot.
          # Logs to /var/log/kirocrew-setup.log and signals the CloudFormation
          # WaitCondition at the end (success or failure).
          #
          # NB: log via a plain file redirect (NOT `tee` via process substitution)
          # and do NOT set `pipefail` — install.sh's progress spinner writes a lot
          # of \r updates through a pipe, and a `tee`+pipefail combination turns a
          # harmless SIGPIPE on that pipe into a fatal SIGTERM mid-install.
          set -u
          exec >>/var/log/kirocrew-setup.log 2>&1
          echo "=== KiroCrew bootstrap starting $(date -u) ==="

          HANDLE="${WaitHandle}"
          LOG=/var/log/kirocrew-setup.log
          fail() {
            echo "BOOTSTRAP FAILED: $1"
            # CloudFormation terminates the instance the instant we signal
            # FAILURE, destroying this log — so fold the last log lines INTO the
            # signal reason (CFN allows ~1KB) so the real error survives in the
            # stack event and `kirocrew cloud launch` can surface it.
            # Strip quotes/backslashes: the fallback curl below embeds $reason
            # in hand-built JSON, and an unescaped quote would malform the body
            # (the WaitCondition would then hang to timeout instead of failing).
            tail_ctx=$(tail -n 25 "$LOG" 2>/dev/null | tr -d '\r"\\' \
              | grep -aviE 'Installing (npm|kirocrew and) depend|building React app' \
              | tr '\n' '|' | tail -c 900)
            # NB: the ${!tail_ctx} below is a CloudFormation !Sub literal escape,
            # NOT bash indirect expansion. !Sub turns the "!"-escaped form into a
            # literal dollar-brace tail_ctx, so at runtime it's an ordinary bash
            # variable expansion of tail_ctx. Without the "!" escape, !Sub would
            # try to resolve tail_ctx as a template parameter and fail to deploy.
            reason="$(echo "$1" | tr -d '"\\') :: ...${!tail_ctx}"
            /opt/aws/bin/cfn-signal -e 1 -r "$(echo "$reason" | head -c 1000)" "$HANDLE" || \
              curl -s -X PUT -H 'Content-Type:' --data-binary \
                "{\"Status\":\"FAILURE\",\"Reason\":\"$(echo "$reason" | head -c 1000)\",\"UniqueId\":\"kirocrew\",\"Data\":\"fail\"}" "$HANDLE" || true
            exit 1
          }

          # Suppress the Amazon Linux 2023 first-boot SELinux reboot. AL2023 ships
          # /etc/cloud/cloud.cfg.d/40_selinux-reboot.cfg, a cloud-init power_state
          # drop-in that runs `shutdown -r now` (to apply an SELinux kernel
          # commandline) whenever /run/cloud-init-selinux-reboot exists. That
          # reboot fires ~60-90s into first boot - i.e. straight through our long
          # dnf + npm build - SIGTERM-killing the in-flight `install.sh` build
          # (seen as "Terminated" mid-vite, then WaitCondition FAILURE). It is NOT
          # OOM and NOT the build itself (both re-run clean on the warm box); it is
          # this stock reboot racing our bootstrap. We run SELinux Permissive (the
          # kernel-cmdline tweak is cosmetic for us), so cancel the pending reboot
          # by removing the trigger flag AND neutering the drop-in before the heavy
          # work. Best-effort: never fail the bootstrap on this.
          echo "--- suppressing AL2023 first-boot SELinux reboot ---"
          rm -f /run/cloud-init-selinux-reboot 2>/dev/null || true
          rm -f /etc/cloud/cloud.cfg.d/40_selinux-reboot.cfg 2>/dev/null || true
          # cloud-init's power_state module may already have SCHEDULED the reboot
          # (observed: "The system will reboot at ..." ~60s out) in parallel with
          # this script, and removing the flag won't cancel an in-flight schedule.
          # `shutdown -c` cancels a pending timed shutdown; harmless if none is set.
          shutdown -c 2>/dev/null || true

          # Run the whole install as a non-root user; KiroCrew and kiro-cli are
          # per-user tools and the systemd unit runs as this user.
          RUN_USER=ec2-user
          RUN_HOME=/home/$RUN_USER

          # Provision swap BEFORE install.sh as defense-in-depth headroom. The
          # frontend build (`tsc -b && vite build` over ~900 npm packages) runs
          # alongside dnf + a fresh `npm ci` during first boot and peaks ~3.4 GB
          # (measured). The smallest tier is now 16 GB (8 GB was retired), so this
          # is NOT the primary bring-up fix (that was the SELinux reboot suppressed
          # above) - it is cheap insurance so first boot degrades to swap instead
          # of a kill under a transient spike. Unused headroom on every tier
          # (harmless). Best-effort: never fail on swap.
          echo "--- provisioning swap (headroom for the vite build) ---"
          if [ ! -e /swapfile ] && [ "$(free -m | awk '/^Swap:/ {print $2}')" = "0" ]; then
            ( fallocate -l 4G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=4096 ) 2>/dev/null \
              && chmod 600 /swapfile && mkswap /swapfile >/dev/null 2>&1 && swapon /swapfile \
              && echo '/swapfile none swap sw 0 0' >> /etc/fstab \
              && echo "swap on: $(free -m | awk '/^Swap:/ {print $2}') MB" \
              || echo "swap provisioning skipped (non-fatal)"
          else
            echo "swap already present or /swapfile exists - skipping"
          fi

          echo "--- installing system packages ---"
          # Essentials must succeed. AL2023 provides these in the default repo.
          # KiroCrew's install.sh needs Python >= 3.10; AL2023's default python3
          # is 3.9, so install python3.11 explicitly (install.sh's _find_python
          # prefers python3.12/3.11/3.10 over the bare python3).
          dnf install -y git tmux python3.11 python3.11-pip python3 python3-pip \
            unzip tar gzip which \
            || fail "essential package install failed (git/python3.11/unzip)"
          # ripgrep is optional — don't fail the bootstrap if it isn't available.
          dnf install -y ripgrep || echo "ripgrep unavailable (optional), continuing"

          echo "--- installing Node.js ---"
          # AL2023 ships a recent-enough nodejs (>=18) in its default AppStream,
          # which is what the vite build needs — this is the reliable primary path
          # (validated on AL2023, no external repo). The NodeSource fallback does
          # NOT pipe a remote script into bash (a supply-chain risk if NodeSource
          # is MITM'd/compromised); instead it imports NodeSource's GPG key over
          # pinned TLS and writes a signed dnf repo with gpgcheck=1, so every RPM
          # is signature-verified before install.
          if ! command -v node >/dev/null 2>&1; then
            if ! dnf install -y nodejs npm; then
              # A transient dnf cache/mirror race can drop a dependency RPM
              # mid-transaction ("No such file: .../libbrotli-...rpm"); clean the
              # cache and retry once before falling back to the NodeSource repo.
              echo "nodejs install failed - cleaning dnf cache and retrying"
              dnf clean packages || true
              dnf makecache || true
            fi
            if ! command -v node >/dev/null 2>&1 && ! dnf install -y nodejs npm; then
              echo "AppStream nodejs unavailable - trying signed NodeSource repo"
              # NodeSource rotated its GPG key URL; the old nodesource-repo.gpg.key
              # now 404s (caused BOOTSTRAP FAILED). Current: ns-operations-public.key.
              NS_KEY=https://rpm.nodesource.com/gpgkey/ns-operations-public.key
              rpm --import "$NS_KEY" || fail "could not import NodeSource GPG key"
              # Write the repo file line-by-line (kept indented so the YAML |
              # block stays well-formed; a column-1 heredoc body would break it).
              # gpgcheck=1 makes dnf verify every RPM signature against the key
              # imported above — no unverified curl|bash of a remote script.
              {
                printf '%s\n' '[nodesource-nodejs]'
                printf '%s\n' 'name=Node.js Packages'
                printf '%s\n' 'baseurl=https://rpm.nodesource.com/pub_20.x/nodistro/nodejs/$basearch'
                printf '%s\n' 'enabled=1'
                printf '%s\n' 'gpgcheck=1'
                printf '%s\n' "gpgkey=$NS_KEY"
              } >/etc/yum.repos.d/nodesource.repo
              dnf install -y nodejs || fail "Node.js install failed (signed NodeSource repo)"
            fi
          fi
          echo "node: $(command -v node) $(node --version 2>/dev/null || echo missing)"
          echo "npm:  $(command -v npm) $(npm --version 2>/dev/null || echo missing)"

          echo "--- installing kiro-cli ---"
          # Amazon Linux 2023 ships glibc 2.34; the standard kiro-cli build needs
          # glibc 2.39+, so we MUST use the musl build here (validated on AL2023).
          ARCH=$(uname -m)
          if [ "$ARCH" = "aarch64" ]; then KIRO_URL="https://desktop-release.q.us-east-1.amazonaws.com/latest/kirocli-aarch64-linux-musl.zip"; else KIRO_URL="https://desktop-release.q.us-east-1.amazonaws.com/latest/kirocli-x86_64-linux-musl.zip"; fi
          sudo -u $RUN_USER bash -lc "
            set -e
            cd \$HOME
            curl --proto '=https' --tlsv1.2 -sSf '$KIRO_URL' -o kirocli.zip
            unzip -o -q kirocli.zip
            ./kirocli/install.sh --no-confirm || yes | ./kirocli/install.sh || true
          " || echo 'kiro-cli install returned nonzero (verifying the binary below)'
          # The install step tolerates a nonzero exit (the two installer
          # invocations + `|| true`), so VERIFY the binary actually landed —
          # otherwise the gateway would serve HTTP but every chat would error
          # (no ACP backend). Fail the WaitCondition so the stack rolls back
          # cleanly instead of handing the user a broken box.
          sudo -u $RUN_USER bash -lc 'command -v kiro-cli >/dev/null 2>&1 || [ -x "$HOME/.local/bin/kiro-cli" ] || [ -x /usr/local/bin/kiro-cli ]' \
            || fail "kiro-cli did not install (the chat backend would not work)"

          echo "--- fetching + installing KiroCrew ---"
          # Prefer the S3 source tarball the launcher uploaded (works for a
          # private repo, using the instance role). Fall back to a public git
          # clone when no S3 source was provided.
          #
          # We write a script file with the CloudFormation values inlined
          # (via !Sub) and run it as the target user. This avoids passing env
          # through `sudo` (env_reset strips VAR=value assignments by default,
          # which silently emptied SourceBucket and took the git-clone branch).
          cat > /tmp/kcfetch.sh <<KCFETCH
          #!/bin/bash
          set -e
          cd "$RUN_HOME"
          rm -rf kirocrew && mkdir kirocrew
          if [ -n "${SourceBucket}" ]; then
            echo "downloading source from s3://${SourceBucket}/${SourceKey}"
            aws s3 cp "s3://${SourceBucket}/${SourceKey}" /tmp/kirocrew-src.tar.gz
            tar -xzf /tmp/kirocrew-src.tar.gz -C kirocrew
          else
            echo "cloning ${KirocrewRepo}@${KirocrewRef}"
            rm -rf kirocrew
            # `--` ends option parsing: defense-in-depth so a repo/ref value
            # can't be interpreted as a git flag (they're already charset- +
            # AllowedPattern-validated, but the separator costs nothing).
            git clone --depth 1 --branch "${KirocrewRef}" -- "${KirocrewRepo}" kirocrew
          fi
          cd kirocrew
          # Retry install.sh once on a cold first boot. Observed on the light tier:
          # the very first run can be signal-killed mid-build (no clean error, no
          # kernel OOM) under first-boot contention (cloud-init + SSM registration
          # + dnf + kiro-cli install + a fresh `npm ci` all compressed together);
          # a retry on the now-warm box (primed caches, node_modules present)
          # reliably reaches "installed successfully". `set -e` is relaxed only for
          # the first attempt (the `if` guard); a failed retry still exits nonzero
          # so the outer `|| fail` signals the WaitCondition.
          if ! bash install.sh; then
            echo "install.sh failed on first attempt - settling then retrying once"
            sleep 20
            bash install.sh
          fi
          KCFETCH
          chmod +x /tmp/kcfetch.sh
          chown $RUN_USER /tmp/kcfetch.sh
          sudo -u $RUN_USER bash /tmp/kcfetch.sh || fail "kirocrew install.sh failed"

          echo "--- installing the systemd service ---"
          sudo -u $RUN_USER bash -lc "
            export PATH=\$HOME/.local/bin:\$PATH
            kirocrew setup --agent-only || true
          " || true

          # System-level unit so the gateway survives reboots and runs as ec2-user.
          KIROCREW_BIN=$(sudo -u $RUN_USER bash -lc 'command -v kirocrew || echo $HOME/.local/bin/kirocrew')
          cat > /etc/systemd/system/kirocrew.service <<UNIT
          [Unit]
          Description=KiroCrew AI Agent Gateway
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=$RUN_USER
          ExecStart=$KIROCREW_BIN gateway
          Restart=on-failure
          RestartSec=10
          WorkingDirectory=$RUN_HOME
          Environment=HOME=$RUN_HOME
          Environment=PATH=$RUN_HOME/.local/bin:/usr/local/bin:/usr/bin:/bin

          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl enable --now kirocrew.service || fail "could not start kirocrew.service"

          echo "--- waiting for the gateway to answer on 127.0.0.1:5476 ---"
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:5476/ 2>/dev/null; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = "1" ] || fail "gateway did not become healthy within 5 minutes"

          echo "=== KiroCrew bootstrap complete $(date -u) ==="
          /opt/aws/bin/cfn-signal -e 0 -r "kirocrew healthy" "$HANDLE" || \
            curl -s -X PUT -H 'Content-Type:' --data-binary \
              "{\"Status\":\"SUCCESS\",\"Reason\":\"kirocrew healthy\",\"UniqueId\":\"kirocrew\",\"Data\":\"ok\"}" "$HANDLE" || true

  # --- WaitCondition: `aws cloudformation deploy` blocks until the box is
  #     actually serving. cfn-signal in UserData reports success/failure.
  WaitHandle:
    Type: AWS::CloudFormation::WaitConditionHandle

  WaitCondition:
    Type: AWS::CloudFormation::WaitCondition
    DependsOn: Instance
    Properties:
      Handle: !Ref WaitHandle
      # 25 min: cold boot + dnf + NodeSource + npm build (vite) + pip install.
      Timeout: "1500"
      Count: 1

Outputs:
  InstanceId:
    Description: EC2 instance id (SSM target).
    Value: !Ref Instance
  Region:
    Description: Region the stack was deployed to.
    Value: !Ref AWS::Region
  PublicDnsName:
    Description: Public DNS (diagnostics only - access is via SSM, never direct).
    Value: !GetAtt Instance.PublicDnsName
  StackTag:
    Description: The kirocrew:instance discovery tag value.
    Value: !Ref StackTag
