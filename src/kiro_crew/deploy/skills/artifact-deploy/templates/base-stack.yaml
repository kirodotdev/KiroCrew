AWSTemplateFormatVersion: '2010-09-09'
Description: >
  KiroCrew One-Click Deploy - shared per-account base stack. One PRIVATE S3
  bucket (origin) + one global CloudFront distribution that serves many demos
  under /<slug>/ prefixes. Created once per account; individual deploys are just
  S3 uploads under a slug prefix + an invalidation.

Parameters:
  PriceClass:
    Type: String
    Default: PriceClass_All
    AllowedValues: [PriceClass_All, PriceClass_200, PriceClass_100]
    Description: >
      CloudFront edge coverage. PriceClass_All = maximum global reach
      (Vercel-like). Lower tiers are cheaper but use fewer edge locations.
  # CWE-770: optional WAFv2 WebACL for CloudFront rate limiting / request
  # filtering. REGION CONSTRAINT: CloudFront only accepts a WAFv2 WebACL whose
  # Scope is CLOUDFRONT, and such a WebACL MUST be created in us-east-1. This
  # base stack is deployed in the deploy profile's region (see deploy.sh /
  # handlers.py — default us-west-2, NOT pinned to us-east-1), so an INLINE
  # AWS::WAFv2::WebACL (Scope: CLOUDFRONT) declared here would FAIL to create in
  # any non-us-east-1 deployment. Rather than ship a resource that breaks the
  # stack, we expose the WebACL ARN as an opt-in parameter: create a
  # CLOUDFRONT-scoped, rate-based WebACL separately in us-east-1 and pass its
  # ARN here to attach it. Empty (default) leaves the distribution unchanged.
  WafWebAclArn:
    Type: String
    Default: ''
    Description: >
      Optional ARN of a WAFv2 WebACL (Scope: CLOUDFRONT, created in us-east-1)
      to attach to the shared distribution for rate limiting (CWE-770). Empty =
      no WAF attached. Example rule to put in the WebACL: a RateBasedStatement
      with Limit 2000 per 5 min, AggregateKeyType IP, plus the AWS managed
      AWSManagedRulesCommonRuleSet.

Conditions:
  # Only wire WebACLId when a WebACL ARN was supplied — an empty string is not a
  # valid WebACLId and would fail the distribution create.
  HasWafWebAcl: !Not [!Equals [!Ref WafWebAclArn, '']]

Resources:

  # Private origin bucket. Retained on stack delete so a teardown never nukes
  # live demos by accident.
  OriginBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    # The server-access-log target bucket policy must exist before S3 will
    # accept this bucket's LoggingConfiguration (PutBucketLogging validates
    # write permission to the target). LogBucketPolicy references OriginBucket
    # only by its computed ARN (not !GetAtt), so there is no dependency cycle.
    DependsOn: LogBucketPolicy
    Properties:
      BucketName: !Sub 'kirocrew-deploy-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # Versioning + lifecycle give a recovery path for the retained content
      # bucket: the deploy engine syncs with --delete and overwrites in place,
      # so an accidental/erroneous sync or object delete would otherwise be
      # unrecoverable (CWE-1188). Noncurrent versions are bounded (30d / 3
      # kept) so recovery does not grow storage without limit.
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          # S3 rejects a lifecycle rule without a filter; an empty rule-level
          # Prefix applies the rule to all objects (cfn-lint's S3 Rule schema
          # uses Prefix, not Filter).
          - Id: expire-noncurrent-versions
            Status: Enabled
            Prefix: ''
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
              NewerNoncurrentVersions: 3
          - Id: abort-incomplete-multipart
            Status: Enabled
            Prefix: ''
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      # CWE-778 (SAX-05): server access logging to a dedicated log bucket so
      # reads/writes of deploy artifacts served through the shared distribution
      # are auditable (detect insider misuse, unauthorized reads, tampering).
      LoggingConfiguration:
        DestinationBucketName: !Ref LogBucket
        LogFilePrefix: s3-access/
      Tags:
        - { Key: 'kirocrew:managed', Value: 'true' }

  # Dedicated log target for OriginBucket's S3 server access logs (prefix
  # s3-access/) and the CloudTrail S3 data-event trail (prefix AWSLogs/). It is
  # itself private + encrypted, and does NOT enable its own server access
  # logging (a log bucket logging to itself would recurse without bound). Logs
  # are expired after 365 days so audit retention does not grow storage forever.
  LogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'kirocrew-deploy-logs-${AWS::AccountId}-${AWS::Region}'
      # BucketOwnerEnforced disables ACLs; log delivery is authorized via the
      # bucket policy's service-principal grants below (the modern, ACL-free way
      # to receive both S3 server access logs and CloudTrail logs).
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # Versioning makes the audit trail tamper-evident and recoverable: an
      # overwrite or delete of a CloudTrail data-event or S3 access-log object
      # leaves the prior version behind rather than being unrecoverable
      # (CWE-1188, SAX-05/06/08 — audit buckets MUST enable versioning).
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        # Three coordinated rules give ~365-day retention with tamper-evidence
        # on a VERSIONED bucket, where a Days expiration inserts a delete marker
        # rather than erasing data:
        #  - expire-logs: after 365 days the current log object is replaced by a
        #    delete marker and its version becomes noncurrent — the declared
        #    audit-retention window.
        #  - expire-noncurrent-logs: a noncurrent version (an overwritten/tampered
        #    object, or one just superseded by its own expiry) is removed 30 days
        #    later — a short recovery window matching OriginBucket. This bounds the
        #    retention tail at ~365+30d instead of ~730d (NoncurrentDays counts
        #    from the moment a version goes noncurrent, not from object creation).
        #  - expire-delete-markers: reaps the leftover delete marker once nothing
        #    remains beneath it, so markers do not accumulate unbounded.
        #    ExpiredObjectDeleteMarker must be its own rule — S3 rejects it in the
        #    same rule as a Days/Date expiration.
        Rules:
          - Id: expire-logs
            Status: Enabled
            Prefix: ''
            ExpirationInDays: 365
          - Id: expire-noncurrent-logs
            Status: Enabled
            Prefix: ''
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
          - Id: expire-delete-markers
            Status: Enabled
            Prefix: ''
            ExpiredObjectDeleteMarker: true
          - Id: abort-incomplete-multipart
            Status: Enabled
            Prefix: ''
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - { Key: 'kirocrew:managed', Value: 'true' }

  # Authorizes the two log-delivery service principals to write into LogBucket.
  # OriginBucket and DeployTrail are referenced by their COMPUTED ARNs (via
  # !Sub, not !GetAtt/!Ref) so this policy has no dependency on either resource
  # — that is what lets OriginBucket DependsOn this policy, and DeployTrail
  # DependsOn this policy, without a CloudFormation cycle.
  LogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LogBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Deny non-HTTPS access (SAX-05 / CWE-319).
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt LogBucket.Arn
              - !Sub '${LogBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'
          # S3 server access log delivery for OriginBucket (SAX-05).
          - Sid: S3ServerAccessLogsWrite
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${LogBucket.Arn}/s3-access/*'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
              ArnLike:
                'aws:SourceArn': !Sub 'arn:aws:s3:::kirocrew-deploy-${AWS::AccountId}-${AWS::Region}'
          # CloudTrail bucket-ACL check + log delivery for the S3 data-event
          # trail (SAX-06). SourceArn pins the specific trail by its computed
          # ARN so no other trail can write here.
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt LogBucket.Arn
            Condition:
              StringEquals:
                'aws:SourceArn': !Sub 'arn:aws:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/kirocrew-deploy-trail-${AWS::AccountId}-${AWS::Region}'
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${LogBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              StringEquals:
                's3:x-amz-acl': bucket-owner-full-control
                'aws:SourceArn': !Sub 'arn:aws:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/kirocrew-deploy-trail-${AWS::AccountId}-${AWS::Region}'

  # OAC lets CloudFront read the private bucket without making it public.
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'kirocrew-deploy-oac-${AWS::AccountId}-${AWS::Region}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Append index.html for directory-style URIs so /<slug>/ resolves.
  IndexRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub 'kirocrew-deploy-index-rewrite-${AWS::AccountId}-${AWS::Region}'
      AutoPublish: true
      FunctionConfig:
        Comment: Append index.html for directory-style URIs.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else if (!uri.split('/').pop().includes('.')) {
            request.uri = uri + '/index.html';
          }
          return request;
        }

  # security headers on every response.
  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub 'kirocrew-deploy-secheaders-${AWS::AccountId}-${AWS::Region}'
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          # No FrameOptions block: X-Frame-Options cannot express an allowlist
          # (ALLOW-FROM is dead) and is superseded by CSP frame-ancestors below.
          # Emitting both would re-block the dashboard preview whenever a UA
          # honors XFO over frame-ancestors.
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
          # Permissive by design: demos are arbitrary user apps that need inline
          # scripts to run. Override:false lets an app set its own stricter CSP.
          # frame-ancestors: 'self' plus loopback origins so the KiroCrew
          # dashboard (localhost gateway / Electron) can embed the deployed
          # site as a live preview. Public-web clickjacking surface is
          # unchanged — an attacker page cannot be served from the victim's
          # loopback.
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:; frame-ancestors 'self' http://localhost:* http://127.0.0.1:* http://kirocrew.localhost:*"
            Override: false

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: KiroCrew One-Click Deploy shared distribution
        # CWE-770: attach an optional WAFv2 WebACL (rate limiting / request
        # filtering) when one is supplied. Must be a CLOUDFRONT-scoped WebACL in
        # us-east-1 (see WafWebAclArn parameter). AWS::NoValue keeps the property
        # absent when unset, preserving current behavior.
        WebACLId: !If [HasWafWebAcl, !Ref WafWebAclArn, !Ref 'AWS::NoValue']
        PriceClass: !Ref PriceClass
        HttpVersion: http2and3
        IPV6Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: s3origin
            DomainName: !GetAtt OriginBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: s3origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # Managed-CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt IndexRewriteFunction.FunctionMetadata.FunctionARN
      Tags:
        - { Key: 'kirocrew:managed', Value: 'true' }

  # Grant only THIS distribution read access to the private bucket.
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref OriginBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Deny non-HTTPS access (SAX-05 / CWE-319).
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt OriginBucket.Arn
              - !Sub '${OriginBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${OriginBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution.Id}'
          # R40 F2: deny CloudFront the per-slug control manifests and the
          # quarantine prefix — without this Deny every deploy's
          # .kirocrew-deploy.json is world-readable through the shared
          # distribution (leaks local username + infra ids). The reaper reads
          # manifests via the S3 API (IAM role), unaffected by this
          # service-principal Deny.
          - Sid: DenyCloudFrontControlManifests
            Effect: Deny
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource:
              - !Sub '${OriginBucket.Arn}/*/.kirocrew-deploy.json'
              - !Sub '${OriginBucket.Arn}/_quarantine/*'

  # CWE-778 (SAX-06): CloudTrail S3 data events for OriginBucket, so object-level
  # reads/writes of deploy artifacts are traceable beyond aggregate access logs.
  # Scoped to DATA events for THIS bucket only — IncludeManagementEvents:false —
  # so it does not duplicate an account/org management trail and keeps cost
  # proportional to deploy object activity (typically low). Single-region: the
  # bucket is regional, so a region-local trail covers it.
  DeployTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn: LogBucketPolicy
    Properties:
      TrailName: !Sub 'kirocrew-deploy-trail-${AWS::AccountId}-${AWS::Region}'
      S3BucketName: !Ref LogBucket
      IsLogging: true
      IsMultiRegionTrail: false
      IncludeGlobalServiceEvents: false
      EnableLogFileValidation: true
      EventSelectors:
        - ReadWriteType: All
          IncludeManagementEvents: false
          DataResources:
            - Type: AWS::S3::Object
              Values:
                - !Sub '${OriginBucket.Arn}/'
      Tags:
        - { Key: 'kirocrew:managed', Value: 'true' }

Outputs:
  BucketName:
    Description: Origin bucket for all deploys.
    Value: !Ref OriginBucket
  DistributionId:
    Description: Shared CloudFront distribution id.
    Value: !Ref Distribution
  DistributionDomainName:
    Description: Public CloudFront domain (link base).
    Value: !GetAtt Distribution.DomainName
