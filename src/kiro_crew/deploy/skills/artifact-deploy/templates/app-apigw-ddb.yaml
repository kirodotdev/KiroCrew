AWSTemplateFormatVersion: '2010-09-09'
Description: >
  KiroCrew One-Click Deploy - per-app STATEFUL backend (API Gateway HTTP API ->
  Lambda -> DynamoDB). Guardrail-safe (Lambda invoked only by API Gateway; no
  world-accessible Function URL). The Lambda role is least-privilege: CloudWatch
  Logs + CRUD on ONLY its own table. One stack per slug.

Parameters:
  Slug:
    Type: String
  CodeBucket:
    Type: String
  CodeKey:
    Type: String
  Runtime:
    Type: String
    Default: python3.12
  Handler:
    Type: String
    Default: index.handler
  # CWE-770: per-app request-rate guardrails on the $default stage. Parameterized
  # (with sane defaults) so a deployer can tune per app, matching the existing
  # Runtime/Handler parameter convention.
  ApiThrottlingRateLimit:
    Type: Number
    Default: 50
    Description: >
      Steady-state request rate cap (requests/second) applied to every route on
      the $default stage. Bounds Lambda invocation volume / cost (CWE-770).
  ApiThrottlingBurstLimit:
    Type: Number
    Default: 100
    Description: >
      Burst (token-bucket) request cap for the $default stage (CWE-770).
  OriginVerifySecret:
    Type: String
    Default: ''
    NoEcho: true
    Description: >
      Random secret shared between CloudFront and API Gateway for origin verification.

Conditions:
  HasOriginVerify: !Not [!Equals [!Ref OriginVerifySecret, '']]

Resources:

  Table:
    Type: AWS::DynamoDB::Table
    # Persistence protection (CWE-693/1188): the table can be promoted to
    # persistent/production (persist.sh clears its TTL), and the reaper role
    # holds cloudformation:DeleteStack + dynamodb:DeleteTable on
    # kirocrew-deploy-app-*, so a TTL/tag misconfig must not irrecoverably
    # erase data. PITR (below) gives 35-day recovery of accidental item
    # overwrites/deletes while the table lives. We deliberately do NOT set
    # DeletionPolicy:Retain or DeletionProtectionEnabled — those would orphan
    # the table on every ephemeral reap (the reaper deletes the whole stack),
    # regressing the clean-teardown / $0-idle story. Persistent data isn't
    # reaper-exposed anyway: the reaper only reaps expired-TTL deploys and
    # persist.sh clears the TTL so persisted deploys are SKIPPED.
    Properties:
      TableName: !Sub 'kirocrew-deploy-app-${Slug}'
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
      SSESpecification:
        SSEEnabled: true
      Tags:
        - { Key: 'kirocrew:managed', Value: 'true' }
        - { Key: 'kirocrew:slug', Value: !Ref Slug }

  ExecRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'kirocrew-deploy-app-${Slug}-exec'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      # R23 F1: mandatory permissions boundary — the deploy principal's
      # iam:CreateRole is conditioned on this boundary being attached.
      PermissionsBoundary: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/kirocrew-deploy-app-boundary'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      # Least privilege: CRUD scoped to THIS table's ARN only.
      Policies:
        - PolicyName: own-table-crud
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchWriteItem
                  - dynamodb:BatchGetItem
                Resource: !GetAtt Table.Arn
      Tags:
        - { Key: 'kirocrew:managed', Value: 'true' }
        - { Key: 'kirocrew:slug', Value: !Ref Slug }

  Fn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'kirocrew-deploy-app-${Slug}'
      Runtime: !Ref Runtime
      Handler: !Ref Handler
      Role: !GetAtt ExecRole.Arn
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Tags:
        - { Key: 'kirocrew:managed', Value: 'true' }
        - { Key: 'kirocrew:slug', Value: !Ref Slug }

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub 'kirocrew-deploy-app-${Slug}'
      ProtocolType: HTTP
      # ApiGatewayV2 Tags is a map (not a Key/Value list). The managed tag lets
      # the reaper role constrain apigateway:DELETE via aws:ResourceTag.
      Tags:
        'kirocrew:managed': 'true'

  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt Fn.Arn
      IntegrationMethod: POST
      PayloadFormatVersion: '2.0'
      # R13 F3: strip the origin-verify secret before the request reaches
      # untrusted application code — an app that echoes request headers would
      # otherwise disclose the secret, enabling direct API Gateway access
      # that bypasses CloudFront. The authorizer sees the header (it runs
      # before integration); the Lambda never does.
      RequestParameters:
        'remove:header.x-kirocrew-origin-verify': "''"

  # F7c (R9): Only expose the route when origin-verify is configured.
  DefaultRouteProtected:
    Type: AWS::ApiGatewayV2::Route
    Condition: HasOriginVerify
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: '$default'
      Target: !Sub 'integrations/${Integration}'
      AuthorizerId: !Ref OriginVerifyAuthorizer
      AuthorizationType: CUSTOM

  # CWE-778: access-log destination for the HTTP API stage so requests to the
  # deployed app are auditable (who / when / status). 14-day retention.
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/kirocrew-deploy-app/${Slug}/apigw-ddb-access'
      RetentionInDays: 14

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true
      # CWE-778: emit structured access logs to CloudWatch Logs for auditability.
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength","integrationError":"$context.integrationErrorMessage"}'
      # CWE-770: throttle the $default stage so a per-app deploy cannot be driven
      # into unbounded request/Lambda-invocation volume. DefaultRouteSettings
      # applies to every route on the stage.
      DefaultRouteSettings:
        DetailedMetricsEnabled: true
        ThrottlingRateLimit: !Ref ApiThrottlingRateLimit
        ThrottlingBurstLimit: !Ref ApiThrottlingBurstLimit

  InvokePerm:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Fn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

  # --- Origin-verify authorizer (optional) ---

  OriginVerifyRole:
    Type: AWS::IAM::Role
    Condition: HasOriginVerify
    Properties:
      RoleName: !Sub 'kirocrew-deploy-app-${Slug}-authz'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      # R23 F1: mandatory permissions boundary — the deploy principal's
      # iam:CreateRole is conditioned on this boundary being attached.
      PermissionsBoundary: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/kirocrew-deploy-app-boundary'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Tags:
        - { Key: 'kirocrew:managed', Value: 'true' }
        - { Key: 'kirocrew:slug', Value: !Ref Slug }

  OriginVerifyFn:
    Type: AWS::Lambda::Function
    Condition: HasOriginVerify
    Properties:
      FunctionName: !Sub 'kirocrew-deploy-app-${Slug}-authz'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt OriginVerifyRole.Arn
      Timeout: 3
      MemorySize: 128
      Environment:
        Variables:
          EXPECTED_SECRET: !Ref OriginVerifySecret
      Code:
        ZipFile: |
          import hmac
          import os
          def handler(event, context):
              expected = os.environ["EXPECTED_SECRET"]
              headers = event.get("headers") or {}
              actual = headers.get("x-kirocrew-origin-verify", "")
              if hmac.compare_digest(actual, expected):
                  return {"isAuthorized": True}
              return {"isAuthorized": False}
      Tags:
        - { Key: 'kirocrew:managed', Value: 'true' }
        - { Key: 'kirocrew:slug', Value: !Ref Slug }

  OriginVerifyInvokePerm:
    Type: AWS::Lambda::Permission
    Condition: HasOriginVerify
    Properties:
      FunctionName: !Ref OriginVerifyFn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

  OriginVerifyAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Condition: HasOriginVerify
    Properties:
      ApiId: !Ref HttpApi
      AuthorizerType: REQUEST
      AuthorizerUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OriginVerifyFn.Arn}/invocations'
      AuthorizerPayloadFormatVersion: '2.0'
      EnableSimpleResponses: true
      IdentitySource:
        - $request.header.x-kirocrew-origin-verify
      Name: !Sub 'kirocrew-origin-verify-${Slug}'

Outputs:
  FunctionName:
    Value: !Ref Fn
  TableName:
    Value: !Ref Table
  ApiEndpoint:
    Value: !GetAtt HttpApi.ApiEndpoint
  ApiDomain:
    Value: !Select [2, !Split ['/', !GetAtt HttpApi.ApiEndpoint]]
