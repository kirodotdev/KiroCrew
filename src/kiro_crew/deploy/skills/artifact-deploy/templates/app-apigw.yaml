AWSTemplateFormatVersion: '2010-09-09'
Description: >
  KiroCrew One-Click Deploy - per-app backend (API Gateway HTTP API -> Lambda).
  Palisade-safe: the Lambda is invoked ONLY by API Gateway (scoped
  apigateway.amazonaws.com permission), NOT via a world-accessible Function URL,
  so the Lambda-world-accessible detector never fires. The public entry is the
  shared CloudFront distribution at /<slug>/api/*. One stack per slug.

Parameters:
  Slug:
    Type: String
  CodeBucket:
    Type: String
  CodeKey:
    Type: String
  Runtime:
    Type: String
    Default: python3.12
  Handler:
    Type: String
    Default: index.handler
  OriginVerifySecret:
    Type: String
    Default: ''
    NoEcho: true
    Description: >
      Random secret shared between CloudFront and API Gateway for origin verification.
      When non-empty, a REQUEST Lambda authorizer rejects requests missing the
      x-kirocrew-origin-verify header with this value — preventing direct API access
      that bypasses CloudFront.

Conditions:
  HasOriginVerify: !Not [!Equals [!Ref OriginVerifySecret, '']]

Resources:

  ExecRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'kirocrew-deploy-app-${Slug}-exec'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      # Least privilege (BSC6): CloudWatch Logs only.
      # R23 F1: mandatory permissions boundary — the deploy principal's
      # iam:CreateRole is conditioned on this boundary being attached.
      PermissionsBoundary: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/kirocrew-deploy-app-boundary'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Tags:
        - { Key: 'kirocrew:managed', Value: 'true' }
        - { Key: 'kirocrew:slug', Value: !Ref Slug }

  Fn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'kirocrew-deploy-app-${Slug}'
      Runtime: !Ref Runtime
      Handler: !Ref Handler
      Role: !GetAtt ExecRole.Arn
      Timeout: 10
      MemorySize: 256
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Tags:
        - { Key: 'kirocrew:managed', Value: 'true' }
        - { Key: 'kirocrew:slug', Value: !Ref Slug }

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub 'kirocrew-deploy-app-${Slug}'
      ProtocolType: HTTP
      # ApiGatewayV2 Tags is a map (not a Key/Value list). The managed tag lets
      # the reaper role constrain apigateway:DELETE via aws:ResourceTag.
      Tags:
        'kirocrew:managed': 'true'

  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt Fn.Arn
      IntegrationMethod: POST
      PayloadFormatVersion: '2.0'
      # R13 F3: strip the origin-verify secret before the request reaches
      # untrusted application code — an app that echoes request headers would
      # otherwise disclose the secret, enabling direct API Gateway access
      # that bypasses CloudFront. The authorizer sees the header (it runs
      # before integration); the Lambda never does.
      RequestParameters:
        'remove:header.x-kirocrew-origin-verify': "''"

  # F7c (R9): Only expose the route when origin-verify is configured. Without a
  # secret, the API has no route = 404 on direct access. The intended access path
  # is always via CloudFront which injects the origin-verify header. Deploying
  # without a secret is a misconfiguration that should fail visibly rather than
  # silently exposing an unprotected endpoint.
  DefaultRouteProtected:
    Type: AWS::ApiGatewayV2::Route
    Condition: HasOriginVerify
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: '$default'
      Target: !Sub 'integrations/${Integration}'
      AuthorizerId: !Ref OriginVerifyAuthorizer
      AuthorizationType: CUSTOM

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true

  # Only this API may invoke the Lambda (scoped, not world-accessible).
  InvokePerm:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Fn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

  # --- Origin-verify authorizer (optional, enabled when OriginVerifySecret is set) ---

  OriginVerifyRole:
    Type: AWS::IAM::Role
    Condition: HasOriginVerify
    Properties:
      RoleName: !Sub 'kirocrew-deploy-app-${Slug}-authz'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      # R23 F1: mandatory permissions boundary — the deploy principal's
      # iam:CreateRole is conditioned on this boundary being attached.
      PermissionsBoundary: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/kirocrew-deploy-app-boundary'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Tags:
        - { Key: 'kirocrew:managed', Value: 'true' }
        - { Key: 'kirocrew:slug', Value: !Ref Slug }

  OriginVerifyFn:
    Type: AWS::Lambda::Function
    Condition: HasOriginVerify
    Properties:
      FunctionName: !Sub 'kirocrew-deploy-app-${Slug}-authz'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt OriginVerifyRole.Arn
      Timeout: 3
      MemorySize: 128
      Environment:
        Variables:
          EXPECTED_SECRET: !Ref OriginVerifySecret
      Code:
        ZipFile: |
          import hmac
          import os
          def handler(event, context):
              expected = os.environ["EXPECTED_SECRET"]
              headers = event.get("headers") or {}
              actual = headers.get("x-kirocrew-origin-verify", "")
              if hmac.compare_digest(actual, expected):
                  return {"isAuthorized": True}
              return {"isAuthorized": False}
      Tags:
        - { Key: 'kirocrew:managed', Value: 'true' }
        - { Key: 'kirocrew:slug', Value: !Ref Slug }

  OriginVerifyInvokePerm:
    Type: AWS::Lambda::Permission
    Condition: HasOriginVerify
    Properties:
      FunctionName: !Ref OriginVerifyFn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

  OriginVerifyAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Condition: HasOriginVerify
    Properties:
      ApiId: !Ref HttpApi
      AuthorizerType: REQUEST
      AuthorizerUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OriginVerifyFn.Arn}/invocations'
      AuthorizerPayloadFormatVersion: '2.0'
      EnableSimpleResponses: true
      IdentitySource:
        - $request.header.x-kirocrew-origin-verify
      Name: !Sub 'kirocrew-origin-verify-${Slug}'

Outputs:
  FunctionName:
    Value: !Ref Fn
  ApiEndpoint:
    Description: Public HTTP API endpoint URL.
    Value: !GetAtt HttpApi.ApiEndpoint
  ApiDomain:
    Description: Host part of the API endpoint (used as the CloudFront origin domain).
    Value: !Select [2, !Split ['/', !GetAtt HttpApi.ApiEndpoint]]
