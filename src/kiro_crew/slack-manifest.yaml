# Slack App Manifest for KiroCrew
# Import via https://api.slack.com/apps → Create New App → From a manifest
#
# After import you still need to:
#   1. Socket Mode: toggle OFF then back ON to trigger token generation dialog
#      → add scope connections:write → Generate → copy the xapp-... token
#   2. Install the app to your workspace and copy the Bot Token (xoxb-...)
#   3. Run `kirocrew setup` and paste both tokens
#
# See docs/guides/slack-setup.md for the full walkthrough.

display_information:
  name: KiroCrew-{{ALIAS}}
  description: AI agent management layer with persistent memory, scheduled jobs, and multi-session orchestration
  background_color: "#1a1a2e"

features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  # Declares the app as a Slack Agent: adds it to the Agents sidebar, the
  # top-bar quick access and split view, and enables the agent-session lifecycle
  # (status, title, stop button) the gateway drives via agents.sessions.*.
  # Enabling it is what makes assistant:write valid. agent_view supersedes the
  # deprecated assistant_view.
  agent_view:
    agent_description: Your personal AI agent. Chat, run multi-step tasks unattended, schedule jobs, and keep memory across sessions.
  bot_user:
    display_name: KiroCrew-{{ALIAS}}
    always_online: true
  slash_commands:
    - command: /kirocrew
      description: Dashboard access, allowlist, and channel tracking
      usage_hint: "dashboard [duration] | @user | #channel"
      should_escape: true

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      # Required by the agent_view feature above; grants agents.sessions.* so the
      # gateway can set session status/title and show a native stop button.
      - assistant:write
      - channels:history
      - channels:read
      - chat:write
      - commands
      - files:read
      - files:write
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - reactions:write
      - users:read
      # Optional: uncomment for custom workspace emojis in Secretary emoji picker
      # - emoji:read
    user:
      - channels:history
      - channels:read
      - groups:history
      - groups:read
      - im:history
      - im:read
      - mpim:history
      - mpim:read
      - search:read
      - users:read

settings:
  event_subscriptions:
    bot_events:
      - message.im
      - message.channels
      - message.groups
      - app_mention
      - app_home_opened
      # Agent-session events (agent_view): app_context_changed reports what the
      # user is viewing; agent_session_stopped fires when the user clicks the
      # native stop button; agent_session_title_changed fires when a user
      # renames a session. The gateway handles stop and title-change.
      # app_context_changed is in Slack's list of events an agent_view app
      # subscribes to, so it stays subscribed; the gateway does not act on it.
      - app_context_changed
      - agent_session_stopped
      - agent_session_title_changed
      - file_change
      - member_joined_channel
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
