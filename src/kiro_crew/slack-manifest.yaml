# Slack App Manifest for KiroCrew
# Import via https://api.slack.com/apps → Create New App → From a manifest
#
# After import you still need to:
#   1. Install the app to your workspace and copy the Bot Token (xoxb-...)
#   2. Basic Information → App-Level Tokens → Generate Token and Scopes
#      → add scope connections:write → Generate → copy the xapp-... token
#   3. Paste both tokens in Settings → Messaging channels → Slack (its setup
#      wizard walks every step), or run `kirocrew setup --slack`
#
## Template notes (never rendered): a line ending in "#@<feature>" is rendered
## only when that Slack Code switch (slack.<feature>, registered in
## slack_manifest.FEATURES) is on; "#@a|b" means either one, and "#@!a" means
## only while a is off.
## `kirocrew manifest` and Settings → Slack render this file for the
## switches you have on.
#
# See docs/guides/slack-setup.md for the full walkthrough.

display_information:
  name: KiroCrew-{{ALIAS}}
  description: AI agent management layer with persistent memory, scheduled jobs, and multi-session orchestration
  background_color: "#1a1a2e"

features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  # Declares the app a Slack agent: threads become agent sessions with a live  #@agent_sessions
  # status, a title and Slack's native Stop button. Slack cannot switch an app  #@agent_sessions
  # back from agent_view to assistant_view once this is saved.  #@agent_sessions
  agent_view:  #@agent_sessions
    agent_description: Your personal AI agent. Chat, run multi-step tasks unattended, schedule jobs, and keep memory across sessions.  #@agent_sessions
  # Code channels: one channel per coding task, with a context bar, a diff tab  #@code_channels
  # and channel commands. Socket Mode delivers the commands, so no            #@code_channels
  # slash_command_url is set (Kiro Crew has no HTTP events endpoint).         #@code_channels
  code_channels:  #@code_channels
    enabled: true  #@code_channels
  bot_user:
    display_name: KiroCrew-{{ALIAS}}
    always_online: true
  slash_commands:
    - command: /{{COMMAND}}
      description: Dashboard access and channel tracking
      usage_hint: "dashboard [duration] | #channel"
      should_escape: true

oauth_config:
  # Slack MCP: the sign-in address the Slack card under Connections listens on,  #@slack_mcp
  # and PKCE, which Slack MCP sign-ins need. Slack cannot turn PKCE off again  #@slack_mcp
  # once this is saved (only Slack support can).  #@slack_mcp
  redirect_urls:  #@slack_mcp
    - http://localhost:48106/callback  #@slack_mcp
  pkce_enabled: true  #@slack_mcp
  scopes:
    bot:
      - app_mentions:read
      # agents.sessions.* (status, title, Stop) for the agent_view feature.  #@agent_sessions
      - assistant:write  #@agent_sessions
      # agents.conversations.* (create, context bar, views, commands, archive);  #@code_channels
      # the invite scopes let the agent add people to the channel it opens.  #@code_channels
      - canvases:write  #@code_channels
      - channels:history
      - channels:read
      - channels:write.invites  #@code_channels
      - chat:write
      - chat:write.customize  #@code_channels
      - code_channels:manage  #@code_channels
      - commands
      - files:read
      - files:write
      - groups:history
      - groups:read
      - groups:write.invites  #@code_channels
      - im:history
      - im:read
      - im:write
      # pins.add: the work board pins itself in its code channel.  #@code_channels
      - pins:write  #@code_channels
      - reactions:write
      - users:read
      # Optional: uncomment for custom workspace emojis in Secretary emoji picker
      # - emoji:read
    # Slack MCP: with it on, the user scopes are exactly the read-only set the  #@slack_mcp
    # Slack MCP server needs, for each person's own Slack sign-in. They replace  #@slack_mcp
    # the older list (search:read is dropped). The gateway uses no user token.  #@slack_mcp
    user:
      - canvases:read  #@slack_mcp
      - channels:history
      - channels:read
      - files:read  #@slack_mcp
      - groups:history
      - groups:read
      - im:history
      - im:read
      - lists:read  #@slack_mcp
      - mpim:history
      - mpim:read
      - search:read  #@!slack_mcp
      - search:read.files  #@slack_mcp
      - search:read.im  #@slack_mcp
      - search:read.mpim  #@slack_mcp
      - search:read.private  #@slack_mcp
      - search:read.public  #@slack_mcp
      - search:read.users  #@slack_mcp
      - users:read

settings:
  event_subscriptions:
    bot_events:
      - message.im
      - message.channels
      - message.groups
      - app_mention
      - app_home_opened
      # Slack's native Stop button on an agent session (shown only while it is  #@agent_sessions|code_channels
      # processing), and a user's rename of a thread session.  #@agent_sessions|code_channels
      - agent_session_stopped  #@agent_sessions|code_channels
      - agent_session_title_changed  #@agent_sessions
      # A code channel's archive state and name, shown on its dashboard badge.  #@code_channels
      - channel_archive  #@code_channels
      - channel_rename  #@code_channels
      - channel_unarchive  #@code_channels
      - group_archive  #@code_channels
      - group_rename  #@code_channels
      - group_unarchive  #@code_channels
      - file_change
      - member_joined_channel
  interactivity:
    is_enabled: true
  # Slack MCP: this app also serves Slack's MCP server (https://mcp.slack.com/mcp).  #@slack_mcp
  # Slack refuses MCP for an app that is publicly distributed but not listed in  #@slack_mcp
  # the Slack Marketplace, so keep the app internal.  #@slack_mcp
  is_mcp_enabled: true  #@slack_mcp
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
