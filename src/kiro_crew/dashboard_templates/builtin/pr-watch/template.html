<div class="prw">
  <style>
    .prw { font: 12px/1.45 system-ui, sans-serif; color: var(--text, #e6e6e6); padding: 10px; }
    .prw h2 { font-size: 12px; font-weight: 600; margin: 0 0 6px; color: var(--text-strong, #fff); }
    .prw .goal { font-size: 13px; font-weight: 600; color: var(--text-strong, #fff); }
    .prw .meta { display: flex; flex-wrap: wrap; gap: 10px; font-size: 10.5px; color: var(--muted, #9aa); margin-top: 4px; }
    .prw .sub { font-size: 10px; color: var(--muted, #9aa); }
    .prw .wrote { font-size: 9.5px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--muted-strong, #778); border: 1px solid var(--border, #333); border-radius: 8px; padding: 0 5px; }

    .verdict { display: flex; align-items: baseline; gap: 8px; margin: 10px 0 2px; padding: 9px 11px; border-radius: 12px; border: 1px solid var(--border, #333); background: color-mix(in oklab, #ff5c5c 7%, var(--card, #181818)); }
    .verdict .word { font-size: 13px; font-weight: 700; color: var(--text-strong, #fff); }
    .verdict .say { font-size: 11.5px; color: var(--muted-strong, #889); }

    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 7px; margin-top: 9px; }
    .kpi { border: 1px solid var(--border, #333); border-radius: 14px; padding: 8px 10px; background: var(--card, #181818); }
    .kpi .lab { font-size: 10px; color: var(--muted, #9aa); }
    .kpi .val { font-size: 21px; font-weight: 700; line-height: 1.15; color: var(--text-strong, #fff); }
    .kpi .val u { font-size: 10.5px; font-weight: 600; text-decoration: none; color: var(--muted, #9aa); margin-left: 3px; }

    .lane { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border, #333); border-left-width: 3px; border-radius: 8px; padding: 6px 9px; margin-top: 5px; background: var(--card, #181818); }
    .lane .nm { flex: 1 1 auto; font-weight: 600; color: var(--text-strong, #fff); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lane .st { font-size: 10px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; }
    .lane .own { font-size: 10px; padding: 1px 7px; border-radius: 9px; background: var(--bg-hover, #222); color: var(--muted-strong, #889); }
    .lane .pr { font-size: 10px; color: var(--info, #6aa9ff); font-weight: 600; }

    .item { border: 1px solid var(--border, #333); border-radius: 10px; padding: 8px 9px; margin-top: 6px; background: var(--card, #181818); }
    .item .t { font-weight: 600; color: var(--text-strong, #fff); }
    .item .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
    .chip { font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 9px; background: var(--bg-hover, #222); }
    .ask { font-size: 10.5px; color: var(--muted-strong, #889); margin-top: 4px; }
  </style>

  <h2 data-i18n="title">PR watch</h2>
  <div class="goal" data-dashboard-field="goal">-</div>
  <div class="meta">
    <span><span data-i18n="round">round</span> <span data-dashboard-field="round">-</span></span>
    <span><span data-i18n="session">session</span> <span data-dashboard-field="lifecycle">-</span></span>
    <span><span data-i18n="last_write">last write</span> <span data-dashboard-field="last_entry_at">-</span></span>
  </div>

  <div class="verdict">
    <span class="word" id="vword">-</span>
    <span class="say" id="vsay"></span>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="meta" style="margin-top: 11px;">
    <span style="font-weight: 600; color: var(--text-strong, #fff);" data-i18n="still_in_way">Still in the way</span>
    <span class="wrote" id="wrote"></span>
  </div>
  <div id="lanes"></div>
  <div class="sub" style="margin-top: 5px;">
    <span data-dashboard-field="lanes">-</span> <span data-i18n="lanes_note">lane(s) read in all; green ones are not listed.</span>
  </div>

  <div class="meta" style="margin-top: 11px;">
    <span style="font-weight: 600; color: var(--text-strong, #fff);" data-i18n="waiting_person">Waiting on a person</span>
    <span><span data-i18n="pending">pending</span> <span data-dashboard-field="approvals_pending">-</span></span>
    <span><span data-i18n="asked">asked</span> <span data-dashboard-field="approvals_requested">-</span></span>
  </div>
  <div id="asks"></div>
  <div class="sub"><span data-dashboard-field="pending_requests">-</span> <span data-i18n="requests_named">request(s) named.</span></div>

  <div class="meta" style="margin-top: 11px;">
    <span style="font-weight: 600; color: var(--text-strong, #fff);" data-i18n="items_carrying_pr">Items carrying a PR</span>
  </div>
  <div id="items"></div>
  <div class="sub" style="margin-top: 7px;">
    <span data-dashboard-field="items">-</span> <span data-i18n="on_board">on the board,</span>
    <span data-dashboard-field="omitted">-</span> <span data-i18n="not_shown">not shown (list truncated)</span>
  </div>

  <script>
    (function () {
      var DASH = '\u2014';

      // The page's own words, one table per UI language. A key a language lacks falls
      // back to English. Values the record or a crewmate wrote are never looked up
      // here. The zh-CN strings are \u-escaped so the source stays ASCII.
      var I18N = {
        en: {
          title: 'PR watch', round: 'round', session: 'session', last_write: 'last write',
          still_in_way: 'Still in the way', lanes_note: 'lane(s) read in all; green ones are not listed.',
          waiting_person: 'Waiting on a person', pending: 'pending', asked: 'asked',
          requests_named: 'request(s) named.', items_carrying_pr: 'Items carrying a PR',
          on_board: 'on the board,', not_shown: 'not shown (list truncated)',
          lane_fail: 'red', lane_skipped: 'did not run', lane_running: 'running', lane_pass: 'green',
          owner_not_said: 'owner not said',
          lanes_all_green: 'Every lane the crewmate read came back green.',
          lanes_none: 'No lane reading yet. The crewmate has not written one.',
          asks_none: 'Nothing is waiting on a person right now.',
          no_lane_read: 'no lane read', items_no_pr: 'No item on this board carries a PR number.',
          v_no_word: 'No word yet', v_still_red: 'Still red', v_needs_you: 'Needs you',
          v_checks_green: 'Checks green',
          v_say_none: 'The crewmate has not written a lane reading, so this page cannot say.',
          v_say_red: '{n} lane(s) in the way', v_say_red_asks: ', and {n} ask(s) waiting on a person.',
          v_say_needs: 'Every lane is green; {n} ask(s) are waiting on a person.',
          v_say_green: 'Every lane the crewmate read came back green. Green is not merged.',
          kpi_waiting: 'waiting on you', unit_lanes: 'lane(s)', unit_asks: 'ask(s)',
          wrote: 'crewmate wrote this',
          state_open: 'open', state_accepted: 'accepted', state_rejected: 'rejected',
          state_blocked: 'blocked', state_abandoned: 'abandoned', state_unknown: 'unknown'
        },
        'zh-CN': {
          title: 'PR \u76d1\u770b', round: '\u8f6e\u6b21', session: '\u4f1a\u8bdd', last_write: '\u6700\u540e\u5199\u5165',
          still_in_way: '\u4ecd\u5728\u963b\u6321', lanes_note: '\u6761\u68c0\u67e5\u5df2\u8bfb\u53d6\uff1b\u7eff\u8272\u7684\u672a\u5217\u51fa\u3002',
          waiting_person: '\u7b49\u5f85\u4eba\u5de5\u5904\u7406', pending: '\u5f85\u5904\u7406', asked: '\u5df2\u8bf7\u6c42',
          requests_named: '\u4e2a\u8bf7\u6c42\u5df2\u5217\u51fa\u3002', items_carrying_pr: '\u5e26 PR \u7684\u4e8b\u9879',
          on_board: '\u9879\u5728\u770b\u677f\u4e0a\uff0c', not_shown: '\u9879\u672a\u663e\u793a\uff08\u5217\u8868\u5df2\u622a\u65ad\uff09',
          lane_fail: '\u7ea2\u706f', lane_skipped: '\u672a\u8fd0\u884c', lane_running: '\u8fd0\u884c\u4e2d', lane_pass: '\u7eff\u706f',
          owner_not_said: '\u672a\u6ce8\u660e\u8d1f\u8d23\u4eba',
          lanes_all_green: '\u961f\u53cb\u8bfb\u53d6\u7684\u6bcf\u4e00\u6761\u68c0\u67e5\u90fd\u662f\u7eff\u706f\u3002',
          lanes_none: '\u8fd8\u6ca1\u6709\u68c0\u67e5\u8bfb\u6570\u3002\u961f\u53cb\u5c1a\u672a\u5199\u5165\u3002',
          asks_none: '\u76ee\u524d\u6ca1\u6709\u9700\u8981\u4eba\u5de5\u5904\u7406\u7684\u4e8b\u9879\u3002',
          no_lane_read: '\u65e0\u68c0\u67e5\u8bfb\u6570', items_no_pr: '\u6b64\u770b\u677f\u4e0a\u6ca1\u6709\u4e8b\u9879\u5e26 PR \u7f16\u53f7\u3002',
          v_no_word: '\u5c1a\u65e0\u7ed3\u8bba', v_still_red: '\u4ecd\u4e3a\u7ea2\u706f', v_needs_you: '\u9700\u8981\u4f60',
          v_checks_green: '\u68c0\u67e5\u901a\u8fc7',
          v_say_none: '\u961f\u53cb\u5c1a\u672a\u5199\u5165\u68c0\u67e5\u8bfb\u6570\uff0c\u672c\u9875\u65e0\u6cd5\u5224\u65ad\u3002',
          v_say_red: '{n} \u6761\u68c0\u67e5\u4ecd\u5728\u963b\u6321', v_say_red_asks: '\uff0c\u8fd8\u6709 {n} \u4e2a\u8bf7\u6c42\u7b49\u5f85\u4eba\u5de5\u5904\u7406\u3002',
          v_say_needs: '\u6bcf\u4e00\u6761\u68c0\u67e5\u90fd\u662f\u7eff\u706f\uff1b{n} \u4e2a\u8bf7\u6c42\u6b63\u5728\u7b49\u5f85\u4eba\u5de5\u5904\u7406\u3002',
          v_say_green: '\u961f\u53cb\u8bfb\u53d6\u7684\u6bcf\u4e00\u6761\u68c0\u67e5\u90fd\u662f\u7eff\u706f\u3002\u7eff\u706f\u4e0d\u7b49\u4e8e\u5df2\u5408\u5e76\u3002',
          kpi_waiting: '\u7b49\u5f85\u4f60', unit_lanes: '\u6761', unit_asks: '\u4e2a\u8bf7\u6c42',
          wrote: '\u961f\u53cb\u5199\u5165',
          state_open: '\u8fdb\u884c\u4e2d', state_accepted: '\u5df2\u63a5\u53d7', state_rejected: '\u5df2\u62d2\u7edd',
          state_blocked: '\u53d7\u963b', state_abandoned: '\u5df2\u653e\u5f03', state_unknown: '\u672a\u77e5'
        }
      };
      function locale() {
        var l = (window.kirocrew || {}).locale;
        return typeof l === 'string' && Object.prototype.hasOwnProperty.call(I18N, l) ? l : 'en';
      }
      function has(key) {
        return Object.prototype.hasOwnProperty.call(I18N.en, key);
      }
      function i18n(key, vars) {
        var table = I18N[locale()];
        var s = Object.prototype.hasOwnProperty.call(table, key) ? table[key] : I18N.en[key];
        if (s === undefined) s = key;
        if (vars) {
          s = s.replace(/\{(\w+)\}/g, function (m, k) {
            return Object.prototype.hasOwnProperty.call(vars, k) ? String(vars[k]) : m;
          });
        }
        return s;
      }
      // A state the ledger stamps is shown in the reader's language when this page
      // knows it, and as recorded when it does not.
      function stateLabel(state) {
        return has('state_' + state) ? i18n('state_' + state) : state;
      }
      // A lane reading's own word, in the reader's language when known and as the raw
      // reading otherwise, so an unknown lane state still names itself.
      function laneLabel(state) {
        return has('lane_' + state) ? i18n('lane_' + state) : state;
      }
      function applyStatic() {
        var nodes = document.querySelectorAll('[data-i18n]');
        for (var i = 0; i < nodes.length; i++) nodes[i].textContent = i18n(nodes[i].getAttribute('data-i18n'));
      }

      // The four lane readings this page knows, and the ONE distinction it exists for:
      // `fail` is a check that ran and returned a finding; `skipped` is a check that
      // never started. Printing one red dot for both is worse than printing nothing,
      // because a lane that never ran needs a re-run and a lane that failed needs a fix.
      var LANE_STATES = [
        ['fail', 'red', 'var(--danger, #ff5c5c)', true],
        ['skipped', 'did not run', 'var(--warn, #ffd230)', true],
        ['running', 'running', 'var(--info, #6aa9ff)', true],
        ['pass', 'green', 'var(--ok, #35d07f)', false]
      ];

      function text(v) { return typeof v === 'string' && v.trim() ? v.trim() : null; }
      function num(v) { return typeof v === 'number' && isFinite(v) ? v : null; }
      function bag() { return window.kirocrew || {}; }
      function fields() { return bag().fields || {}; }
      function arr(name) {
        var v = fields()[name];
        return Array.isArray(v) ? v.filter(function (e) { return e && typeof e === 'object'; }) : [];
      }
      function laneRow(state) {
        for (var i = 0; i < LANE_STATES.length; i++) if (LANE_STATES[i][0] === state) return LANE_STATES[i];
        // A reading this page has no row for is shown as itself rather than dropped:
        // an unknown lane state hidden from the strip reads as a clear board.
        return [state, state, 'var(--muted-strong, #778)', true];
      }
      function chip(label, colour) {
        var el = document.createElement('span');
        el.className = 'chip';
        el.textContent = label;
        if (colour) el.style.color = colour;
        return el;
      }
      function kpi(label, value, unit, colour) {
        var card = document.createElement('div');
        card.className = 'kpi';
        var lab = document.createElement('div');
        lab.className = 'lab';
        lab.textContent = label;
        var val = document.createElement('div');
        val.className = 'val';
        val.textContent = value === null ? DASH : String(value);
        if (colour && value) val.style.color = colour;
        if (unit) {
          var u = document.createElement('u');
          u.textContent = unit;
          val.appendChild(u);
        }
        card.appendChild(lab);
        card.appendChild(val);
        return card;
      }

      function drawLanes(lanes) {
        var host = document.getElementById('lanes');
        if (!host) return;
        host.textContent = '';
        var shown = [];
        for (var i = 0; i < lanes.length; i++) {
          var row = laneRow(text(lanes[i].state) || 'unknown');
          if (row[3]) shown.push([lanes[i], row]);
        }
        // Red before never-ran before running: a finding is the thing a reader acts on
        // first, and a strip sorted by name buries it under whatever is alphabetically
        // ahead of it.
        shown.sort(function (a, b) {
          function rank(r) { return r[0] === 'fail' ? 0 : r[0] === 'skipped' ? 1 : r[0] === 'running' ? 2 : 3; }
          return rank(a[1]) - rank(b[1]);
        });
        for (var j = 0; j < shown.length; j++) {
          var lane = shown[j][0];
          var meta = shown[j][1];
          var el = document.createElement('div');
          el.className = 'lane';
          el.style.borderLeftColor = meta[2];
          var nm = document.createElement('span');
          nm.className = 'nm';
          nm.textContent = text(lane.name) || DASH;
          el.appendChild(nm);
          var st = document.createElement('span');
          st.className = 'st';
          st.style.color = meta[2];
          st.textContent = laneLabel(meta[0]);
          el.appendChild(st);
          // WHO clears it. A red lane nobody can name an owner for is the one a reader
          // stares at, so an absent owner says so rather than being left blank.
          var own = document.createElement('span');
          own.className = 'own';
          own.textContent = text(lane.owner) || i18n('owner_not_said');
          el.appendChild(own);
          var pr = num(lane.pr);
          if (pr) {
            var prl = document.createElement('span');
            prl.className = 'pr';
            prl.textContent = 'PR ' + pr;
            el.appendChild(prl);
          }
          host.appendChild(el);
        }
        if (!shown.length) {
          var ok = document.createElement('div');
          ok.className = 'ask';
          ok.textContent = lanes.length
            ? i18n('lanes_all_green')
            : i18n('lanes_none');
          host.appendChild(ok);
        }
        return shown.length;
      }

      function drawAsks(requests) {
        var host = document.getElementById('asks');
        if (!host) return;
        host.textContent = '';
        for (var i = 0; i < requests.length; i++) {
          var r = requests[i];
          var el = document.createElement('div');
          el.className = 'ask';
          var who = text(r.tool) || text(r.kind) || text(r.approval_id) || DASH;
          var why = text(r.cause) || text(r.reason) || '';
          el.textContent = why ? who + ' \u00b7 ' + why : who;
          host.appendChild(el);
        }
        if (!requests.length) {
          var none = document.createElement('div');
          none.className = 'ask';
          none.textContent = i18n('asks_none');
          host.appendChild(none);
        }
      }

      function drawItems(items, lanes) {
        var host = document.getElementById('items');
        if (!host) return;
        host.textContent = '';
        var worst = {};
        for (var l = 0; l < lanes.length; l++) {
          var p = num(lanes[l].pr);
          if (!p) continue;
          var s = text(lanes[l].state) || 'unknown';
          // One PR's worst lane decides its chip: a PR with nine greens and one red is
          // red, and reporting the majority would call it green.
          if (s === 'fail' || worst[p] === undefined || (worst[p] === 'pass' && s !== 'pass')) {
            if (worst[p] !== 'fail') worst[p] = s;
          }
        }
        var drawn = 0;
        for (var i = 0; i < items.length; i++) {
          var it = items[i];
          var pr = num(it.pr);
          if (!pr) continue;
          drawn += 1;
          var card = document.createElement('div');
          card.className = 'item';
          var t = document.createElement('div');
          t.className = 't';
          t.textContent = text(it.title) || text(it.item_id) || DASH;
          card.appendChild(t);
          var chips = document.createElement('div');
          chips.className = 'chips';
          var meta = laneRow(worst[pr] || 'unknown');
          chips.appendChild(chip('PR ' + pr, 'var(--info, #6aa9ff)'));
          chips.appendChild(chip(worst[pr] ? laneLabel(worst[pr]) : i18n('no_lane_read'), worst[pr] ? meta[2] : 'var(--muted-strong, #778)'));
          var state = text(it.state);
          if (state) chips.appendChild(chip(stateLabel(state), null));
          var verdict = text(it.verdict);
          // The acceptance verdict is NOT a CI result and the two are kept apart: a
          // green board with a failed acceptance is the case a reader must see.
          if (verdict) chips.appendChild(chip('acceptance ' + verdict, null));
          card.appendChild(chips);
          host.appendChild(card);
        }
        if (!drawn) {
          var none = document.createElement('div');
          none.className = 'ask';
          none.textContent = i18n('items_no_pr');
          host.appendChild(none);
        }
      }

      function drawVerdict(lanes, reds, pendingApprovals) {
        var word = document.getElementById('vword');
        var say = document.getElementById('vsay');
        if (!word || !say) return;
        var host = word.parentNode;
        var colour, label, sentence;
        if (!lanes.length) {
          // The honest fourth value. A verdict with no silence state becomes a stale
          // lie the moment the crewmate stops writing, and that is the normal case.
          colour = '#9aa'; label = i18n('v_no_word');
          sentence = i18n('v_say_none');
        } else if (reds) {
          colour = '#ff5c5c'; label = i18n('v_still_red');
          sentence = i18n('v_say_red', { n: reds }) + (pendingApprovals ? i18n('v_say_red_asks', { n: pendingApprovals }) : '.');
        } else if (pendingApprovals) {
          colour = '#ffd230'; label = i18n('v_needs_you');
          sentence = i18n('v_say_needs', { n: pendingApprovals });
        } else {
          colour = '#35d07f'; label = i18n('v_checks_green');
          sentence = i18n('v_say_green');
        }
        word.textContent = label;
        word.style.color = colour;
        say.textContent = sentence;
        if (host && host.style) host.style.background = 'color-mix(in oklab, ' + colour + ' 7%, var(--card, #181818))';
      }

      // A bound ISO stamp reaches its cell verbatim, and a full offset-bearing
      // timestamp in a meta row is three times the width of the fact it carries. The
      // cell is reformatted rather than the value replaced, so an unparseable stamp is
      // left exactly as the record wrote it instead of becoming an invalid date.
      function shortenStamps(names) {
        for (var i = 0; i < names.length; i++) {
          var cell = document.querySelector('[data-dashboard-field="' + names[i] + '"]');
          if (!cell) continue;
          var raw = (cell.textContent || '').trim();
          if (!raw || raw === DASH) continue;
          var t = Date.parse(raw);
          if (!isFinite(t)) continue;
          var d = new Date(t);
          cell.textContent =
            ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + d.getUTCDate()).slice(-2) +
            ' ' + ('0' + d.getUTCHours()).slice(-2) + ':' + ('0' + d.getUTCMinutes()).slice(-2) +
            ' UTC';
        }
      }

      function render() {
        var f = fields();
        applyStatic();
        var cells = document.body.querySelectorAll('[data-dashboard-field]');
        for (var c = 0; c < cells.length; c++) {
          if (!cells[c].textContent.trim()) cells[c].textContent = DASH;
        }
        shortenStamps(['last_entry_at']);
        var lanes = arr('lanes');
        var items = arr('items');
        var requests = arr('pending_requests');
        var pending = num(f.approvals_pending) || 0;

        var reds = 0, never = 0, green = 0;
        for (var i = 0; i < lanes.length; i++) {
          var s = text(lanes[i].state);
          if (s === 'fail') reds += 1;
          else if (s === 'skipped') never += 1;
          else if (s === 'pass') green += 1;
        }

        var kpis = document.getElementById('kpis');
        if (kpis) {
          kpis.textContent = '';
          kpis.appendChild(kpi(i18n('lane_fail'), lanes.length ? reds : null, i18n('unit_lanes'), 'var(--danger, #ff5c5c)'));
          kpis.appendChild(kpi(i18n('lane_skipped'), lanes.length ? never : null, i18n('unit_lanes'), 'var(--warn, #ffd230)'));
          kpis.appendChild(kpi(i18n('lane_pass'), lanes.length ? green : null, i18n('unit_lanes'), 'var(--ok, #35d07f)'));
          kpis.appendChild(kpi(i18n('kpi_waiting'), pending || (num(f.approvals_pending) === 0 ? 0 : null), i18n('unit_asks'), 'var(--warn, #ffd230)'));
        }

        var shown = drawLanes(lanes);
        drawAsks(requests);
        drawItems(items, lanes);
        drawVerdict(lanes, reds + never, pending);

        // The host marks an agentic field, and this page draws the tag only from that
        // mark: a value arriving some other way must not borrow the label. The mark is
        // the host's own ARRAY of names (dashboard_frame.read_payload sorts a list into
        // `agentic`), so it is read by membership -- asking an array for a property
        // named 'lanes' answers no on every render and the tag would never appear.
        var wrote = document.getElementById('wrote');
        if (wrote) {
          var agentic = bag().agentic;
          var marked = Array.isArray(agentic) && agentic.indexOf('lanes') !== -1;
          wrote.textContent = marked ? i18n('wrote') : '';
        }

        // Each array cell gets a count: the host binds by textContent, so left alone
        // it reads as dumped JSON.
        var counts = { lanes: lanes.length, items: items.length, pending_requests: requests.length };
        for (var key in counts) {
          if (!Object.prototype.hasOwnProperty.call(counts, key)) continue;
          var cell = document.querySelector('[data-dashboard-field="' + key + '"]');
          if (cell) cell.textContent = String(counts[key]);
        }
        if (shown === undefined) return;
      }

      render();
      window.addEventListener('load', render);
      window.addEventListener('message', function () { setTimeout(render, 0); });
    }());
  </script>
</div>
