      //: the fold adds owner/action, only `row.owner` has to change.
      //: The owner line is drawn only when the fold names one. A warning printed on
      //: EVERY blocked card (that no owner was named) said nothing a reader could act on and
      //: was read as noise, so its absence is now silent; the class stays for the day
      //: the fold carries an owner.
      if (row.kind === 'Blocked' && row.owner) {
        x.appendChild(el('div', 'pr-todo-owner',
          'Waiting on ' + row.owner + (row.action ? ': ' + row.action : '')));
      }
      //: WHY NOW: ONE short line, never the worker's report. The card used to print
      //: up to 280 characters of the worker's own words, which on a real board is
      //: shell talk ("Verified read-only: workspace root holds ONLY docs, .kiro ...")
      //: and buried the one thing to do. The headline is the first sentence, capped;
      //: the rest is one click away behind "worker's words", never on the card face.
      if (row.brief && row.brief.length) {
        var br = el('dl', 'pr-todo-brief');
        row.brief.forEach(function (b) {
          br.appendChild(el('dt', null, b[0]));
          br.appendChild(el('dd', null, b[1]));
        });
        x.appendChild(br);
      }
      if (row.why) {
        var head = headline(row.why);
        x.appendChild(el('div', 'pr-todo-why', head));
        if (head.length < row.why.length) {
          var more = el('details', 'pr-todo-more');
          more.appendChild(el('summary', null, W('words')));
          more.appendChild(el('div', 'pr-todo-raw', row.why));
          x.appendChild(more);
        }
      }
      var meta = el('span');
      if (row.where) meta.textContent = row.where;
      x.appendChild(meta);
      if (row.agent && forYouIsAgentic()) {
        x.appendChild(document.createTextNode(' '));
        x.appendChild(el('span', 'pr-agent', 'crewmate wrote this'));
      }
      //: The next step, on its own line and never folded into the meta line: the meta
      //: line is where the task came from, which a reader skims, and the step is the
      //: one thing on the row they are meant to act on.
      //: The choices replace the "do this in chat" line: the card itself is
      //: where you answer. Picking one fills the chat box and folds the card.
      if (row.choices && row.choices.length) {
        var opts = el('div', 'pr-todo-opts');
        row.choices.forEach(function (c) {
          var b = el('button', 'pr-todo-opt' + (c.rec ? ' pr-rec' : '') + (c.own ? ' pr-own' : ''),
            c.label);
          b.type = 'button';
          b.title = c.say;
          b.addEventListener('click', function () {
            act(c.say);
            deskPicked[row.key] = c.own ? W('own') : c.label;
            it.classList.add('pr-going');
            //: Redraw, so the other cards close the gap this one leaves; the picked
            //: card moves to the one-line strip under the desk.
            setTimeout(render, 160);
          });
          opts.appendChild(b);
        });
        x.appendChild(opts);
      } else if (row.step) {
        x.appendChild(el('div', 'pr-todo-s', row.step));
      }
      it.appendChild(x);
      return it;
    }
    //: A picked card, folded: what was picked, and that it waits in the chat box.
    //: "Undo" only unfolds the card; text already in the chat box is the person's.
    function sentLine(row) {
      var s = el('div', 'pr-todo-sent');
      s.appendChild(el('b', null, row.text));
      s.appendChild(el('span', null, '\u2192 ' + deskPicked[row.key]));
      var u = el('button', null, W('undo'));
      u.type = 'button';
      u.addEventListener('click', function () {
        delete deskPicked[row.key];
        render();
      });
      s.appendChild(u);
      return s;
    }

    //: Build a bundle-header index: for each (boardId, spender) pair that appears more
    //: than once in a shelf, record the total count and an ordinal (first new spender
    //: seen = 1, second = 2, …) so the header can read "Session 2 asked 3 things"
    //: without printing the raw session key.
    function bundleIndex(shelfRows) {
      var counts = {}, spenderOrd = {}, ord = 1, k2;
      for (k2 = 0; k2 < shelfRows.length; k2++) {
        var r2 = shelfRows[k2];
        if (!r2.spender || !r2.boardId) continue;
        var bk = r2.boardId + '\u0000' + r2.spender;
        counts[bk] = (counts[bk] || 0) + 1;
        if (!spenderOrd[r2.spender]) spenderOrd[r2.spender] = ord++;
      }
      return { counts: counts, spenderOrd: spenderOrd };
    }

    function drawShelf(shelfRows, label) {
      if (!shelfRows.length) return null;
      var shelf = el('div');
      if (label) shelf.appendChild(el('div', 'pr-shelf-h', label));
      var box = el('div', 'pr-todo');
      var idx = bundleIndex(shelfRows);
      var seen = {}, k3;
      for (k3 = 0; k3 < shelfRows.length; k3++) {
        var row = shelfRows[k3];
        if (row.spender && row.boardId) {
          var bk2 = row.boardId + '\u0000' + row.spender;
          if (idx.counts[bk2] >= 2 && !seen[bk2]) {
            seen[bk2] = true;
            var n2 = idx.counts[bk2];
            var sn = idx.spenderOrd[row.spender];
            box.appendChild(el('div', 'pr-bundle-h',
              'Session ' + sn + ' asked ' + plural(n2, 'thing', 'things')));
          }
        }
        box.appendChild(todoRow(row));
      }
      shelf.appendChild(box);
      return shelf;
    }

    //: Picked cards leave the shelves, so the cards still open sit side by side
    //: with no holes; the picked ones stack as single lines under the desk.
    var picked = rows.filter(function (r) { return r.key && deskPicked[r.key]; });
    var open = rows.filter(function (r) { return !(r.key && deskPicked[r.key]); });
    var newRows = open.filter(function (r) { return r.isNew; });
    var oldRows = open.filter(function (r) { return !r.isNew; });

    var desk = el('div', 'pr-desk');
    var ns = drawShelf(newRows, 'New since you looked');
    if (ns) desk.appendChild(ns);
    //: Older items and items already answered are FOLDED, one line each when
    //: closed: they are still true, but they are not what a reader acts on now.
    function fold(label, n, body) {
      var d = el('details', 'pr-fold');
      d.appendChild(el('summary', null, label + ' \u00b7 ' + n));
      d.appendChild(body);
      return d;
    }
    var os = drawShelf(oldRows, '');
    if (os) desk.appendChild(fold(W('earlier'), oldRows.length, os));
    if (picked.length) {
      var ps = el('div', 'pr-picked');
      picked.forEach(function (r) { ps.appendChild(sentLine(r)); });
      desk.appendChild(fold(W('answered'), picked.length, ps));
    }
    if (!open.length && picked.length) {
      desk.insertBefore(el('div', 'pr-empty', 'Nothing left to pick.'), desk.firstChild);
    }
    card.appendChild(desk);

    if (need.total > rows.length) {
      //: The record counts more than the retained tasks can show, so the difference is
      //: NAMED. Drawing only the rows would under-report what is waiting; printing only
      //: the count would send the reader looking for lines that are not on the page.
      var held = el('div', 'pr-held',
        (need.total - rows.length) + ' more not shown (list truncated)');
      card.appendChild(held);
    }
    return card;
  }

  //: THE EPIC TREE, and the page's one board. Four levels of the record -- a board's
  //: goal, a round of it, a work item, an item on a board that item's worker runs --
  //: with the sunburst of the same money beside it.
  //:
  //: `scope` is null for every workstream, where the rings are epic inside and story
  //: outside, or one board, where the tree has a single root and the rings move down
  //: with it to story inside and task outside. The rings are always the two levels
  //: UNDER the tree's root, which is what keeps "inside" and "outside" meaning the
  //: same thing in both views: a share of the root, and a share of that share.
  //: `nodes` is the forest, already built: the one-workstream header reports the same
  //: roll-up as the root row, so the view builds it ONCE and hands it to both. Two
  //: builds would be two chances to disagree about the number the page states twice.
  //: `one` is a BOOLEAN -- whether this is the one-workstream view -- and not the
  //: board, so there is nothing here to pass the wrong object to.
  function sectionTree(nodes, one) {
    var card = el('div', 'pr-card');
    var h = el('div', 'pr-card-h');
    h.appendChild(el('div', 'pr-card-t', one ? 'This epic' : 'Every epic'));
    h.appendChild(el('div', 'pr-card-c', one
      ? 'story \u00b7 task \u00b7 subtask, with what each cost in credits'
      : 'epic \u00b7 story \u00b7 task \u00b7 subtask, with what each cost in credits'));
    card.appendChild(h);

    if (!treeInit && nodes.length) {
      treeInit = true;
      seedOpen(nodes);
    }
    if (!nodes.length) {
      card.appendChild(el('div', 'pr-empty', 'No workstream yet.'));
      return card;
    }

    var wrap = el('div', 'pr-tree-wrap');
    var tree = el('div', 'pr-tree');
    for (var i = 0; i < nodes.length; i++) tree.appendChild(treeRow(nodes[i]));
    wrap.appendChild(tree);
    var inner = one ? ['story', 'stories'] : ['epic', 'epics'];
    var outer = one ? ['task', 'tasks'] : ['story', 'stories'];
    wrap.appendChild(sunburst(
      spendGroups(one ? nodes[0].kids : nodes), inner, outer));
    card.appendChild(wrap);
    return card;
  }

  // ---------------------------------------------------------------- views

  //: One pill per EPIC, not per board. A nested board is a subtask list reached by
  //: opening its parent task, so a pill of its own would be a second door to the same
  //: rows -- and would make the `All` count disagree with the number of epics the
  //: tree beside it draws, which is the one thing a count next to a tree must not do.
  function renderPills(list) {
    var host = document.getElementById('pr-pills');
    clear(host);
    function pill(id, label, count) {
      var b = el('button', 'pr-pill');
      b.setAttribute('type', 'button');
      b.setAttribute('aria-current', view === id ? 'true' : 'false');
      b.appendChild(document.createTextNode(label));
      if (count !== null && count !== undefined) {
        b.appendChild(el('span', 'pr-pill-n', String(count)));
      }
      b.addEventListener('click', function () { view = id; render(); });
      return b;
    }
    var roots = rootBoards(list);
    host.appendChild(pill(ALL, 'All', roots.length));
    for (var i = 0; i < roots.length; i++) {
      var s = roots[i];
      host.appendChild(pill(txt(s.id) || String(i), txt(s.goal) || String(i),
        num(s.open)));
    }
  }

  function sentenceAll(list) {
    var open = 0, cr = null, i;
    for (i = 0; i < list.length; i++) {
      open += num(list[i].open) || 0;
      var c = credits(list[i]);
      if (c !== null) cr = (cr || 0) + c;
    }
    var need = needsYou(list, null).total;
    var host = document.getElementById('pr-sentence');
    clear(host);
    function bit(strong, after) {
      host.appendChild(el('b', null, strong));
      host.appendChild(document.createTextNode(after));
    }
    bit(String(open), ' in flight, spent ');
    bit(fmtCr(cr), ' credits, ');
    bit(String(need), need === 1 ? ' needs you' : ' need you');
  }

  //: WHO IS WORKING, AND ON WHAT (Paperclip's Latest Run card, team/REPORT.md #7).
  //:
  //: The tree answers "what is the work"; nothing on the page answered "what is each
  //: worker doing right now". One row per worker (`spender`, the fold's own name for
  //: who ran a task) with a task still OPEN: its state in one word, the task, the
  //: last thing it said, cleaned, and how long it has been quiet. A worker on two open
  //: tasks shows the one it reported on last and says how many more it holds.
  //:
  //: The state word comes from the worker's own status and nothing else, except one
  //: case: `progress` that has been quiet past QUIET_MS reads "gone quiet", because a
  //: worker that died and one still thinking otherwise share a word. Paperclip makes
  //: the same split (characterStateForAgent: running vs error).
  var CREW_STATES = {
    blocked: ['blocked', 'var(--pr-s1)', 0],
    question: ['asks you', 'var(--pr-s2)', 1],
    quiet: ['gone quiet', 'var(--pr-accent)', 2],
    progress: ['working', 'var(--pr-s3)', 3],
    done: ['awaiting review', 'var(--muted, #7f7f88)', 4],
    none: ['no report yet', 'var(--muted, #7f7f88)', 5]
  };
  var CREW_CAP = 12;

  function crewState(t) {
    var st = txt(t.status);
    if (st === 'progress') {
      var ms = sinceMs(t.last_report_at);
      return ms !== null && ms >= QUIET_MS ? 'quiet' : 'progress';
    }
    return CREW_STATES[st] ? st : 'none';
  }

  //: What the worker last said: its summary (the drawer's "what the worker last
  //: said"), else the newest report event's text. Cleaned either way.
  function crewSaid(t) {
    var s = cleanSummary(txt(t.summary) || '');
    if (s) return s;
    var ev = Array.isArray(t.events) ? t.events : [];
    for (var k = 0; k < ev.length; k++) {
      if (ev[k] && ev[k].kind === 'report' && txt(ev[k].text)) return cleanSummary(ev[k].text);
    }
    return '';
  }

  function sectionCrew(list) {
    var by = {}, order = [], unbound = 0, i, j;
    for (i = 0; i < list.length; i++) {
      var ts = tasksOf(list[i]);
      for (j = 0; j < ts.length; j++) {
        var t = ts[j];
        if (txt(t.state) !== 'open') continue;
        var who = txt(t.spender);
        if (!who) { unbound++; continue; }
        var at = sinceMs(t.last_report_at);
        var cur = by[who];
        if (!cur) {
          by[who] = { who: who, t: t, boardId: txt(list[i].id) || '', n: 1, at: at };
          order.push(who);
        } else {
          cur.n++;
          if (at !== null && (cur.at === null || at < cur.at)) {
            cur.t = t; cur.boardId = txt(list[i].id) || ''; cur.at = at;
          }
        }
      }
    }
    var rows = order.map(function (w) { return by[w]; });
    rows.sort(function (a, b) {
      var d = CREW_STATES[crewState(a.t)][2] - CREW_STATES[crewState(b.t)][2];
      if (d) return d;
      return (a.at === null ? 1e15 : a.at) - (b.at === null ? 1e15 : b.at);
    });

    var card = el('div', 'pr-card');
    var h = el('div', 'pr-card-h');
    h.appendChild(el('span', 'pr-card-t', 'Who is working'));
    h.appendChild(el('span', 'pr-card-c', rows.length
      ? plural(rows.length, 'worker', 'workers') + ' with work open, the stuck ones first'
      : 'each worker, what it is on, and what it last said'));
    card.appendChild(h);
    if (!rows.length) {
      card.appendChild(el('div', 'pr-empty', unbound
        ? 'No worker is bound yet. ' + plural(unbound, 'open task waits', 'open tasks wait')
          + ' for one.'
        : 'No worker has open work.'));
      return card;
    }
    var box = el('div', 'pr-crew');
    var shown = crewShowAll ? rows.length : Math.min(rows.length, CREW_CAP);
    for (i = 0; i < shown; i++) box.appendChild(crewRow(rows[i]));
    card.appendChild(box);
    if (rows.length > shown) {
      var more = el('button', 'pr-cost-b', 'show ' + (rows.length - shown) + ' more');
      more.type = 'button';
      more.addEventListener('click', function () { crewShowAll = true; render(); });
      card.appendChild(more);
    }
    if (unbound) {
      card.appendChild(el('div', 'pr-crew-more',
        plural(unbound, 'open task has', 'open tasks have') + ' no worker bound yet.'));
    }
    return card;
  }
  var crewShowAll = false;

  function crewRow(r) {
    var key = crewState(r.t);
    var spec = CREW_STATES[key];
    var row = el('div', 'pr-crew-r');
    row.style.setProperty('--pr-crew-c', spec[1]);
    row.tabIndex = 0;
    row.setAttribute('role', 'button');
    row.setAttribute('data-crew-state', key);
    row.appendChild(el('i', 'pr-crew-dot'));
    row.appendChild(el('span', 'pr-crew-who', 'worker ' + r.who));
    var main = el('div', 'pr-crew-main');
    var title = txt(r.t.title) || DASH;
    main.appendChild(el('div', 'pr-crew-t',
      r.n > 1 ? title + '  \u00b7 +' + (r.n - 1) + ' more' : title));
    //: One line, as on the needs-you cards; the row opens the drawer for the rest.
    var said = headline(crewSaid(r.t));
    main.appendChild(el('div', 'pr-crew-said', said || 'nothing said yet'));
    row.appendChild(main);
    var side = el('div', 'pr-crew-side');
    side.appendChild(el('span', 'pr-crew-st', spec[0]));
    var q = quietChip(r.t);
    if (q) side.appendChild(q);
    row.appendChild(side);
    var open = function () {
      drawerAt = taskKey(r.boardId, r.t);
      renderDrawer();
    };
    row.addEventListener('click', open);
    row.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
    });
    return row;
  }

  function renderGlobal(list) {
    document.getElementById('pr-title').textContent = 'Project report';
    sentenceAll(list);
    var host = document.getElementById('pr-view');
    clear(host);
    if (!list.length) {
      //: AN EMPTY BOARD IS ONE FACT ABOUT ONE RECORD, and this branch used to speak for
      //: three. `items` is the conductor's board; `for_you` is written straight by the
      //: crewmate through an agentic field; the hourly `series` is the crew log's own
      //: rollup. Neither of the last two is silenced by the first being empty, so
      //: returning here hid them -- and the header, which counts `for_you`, went on
      //: saying "1 needs you" over a body saying "Nothing needs you". Of those two the
      //: reader can only act on the one that was wrong.
      //:
      //: It is also the exact state a crewmate is in before it is ever given a goal:
      //: answer one turn and it has written `for_you` and spent credits, with no board.
      var need = needsYou(list, null);
      var pts = seriesOf(fields());
      var spent = false, k;
      for (k = 0; k < pts.length; k++) {
        if ((num(pts[k].credits) || 0) > 0) { spent = true; break; }
      }
      //: THE FIRST THING a new crewmate shows, so it says what will appear here
      //: rather than only that nothing has. A bare "No workstream yet." leaves a
      //: reader unsure whether the page is empty or broken. Kept for the case it is
      //: actually about: nothing, from any of the three records.
      if (!need.total && !spent) {
        var card = el('div', 'pr-card');
        card.appendChild(el('div', 'pr-empty',
          'No workstream yet. Nothing needs you, and nothing has been spent.'));
        card.appendChild(el('div', 'pr-empty',
          'Give this crewmate a goal in the chat, and its work shows up here: what '
          + 'is in flight, what it cost, and anything waiting on you.'));
        host.appendChild(card);
        //: The accounting line counts things that do not exist yet, so every clause
        //: would read "0". Hidden rather than reworded: a row of zeroes is not a
        //: smaller version of the sentence, it is noise over the one card that matters.
        var note = document.getElementById('pr-note');
        if (note) note.hidden = true;
        return;
      }
      var box = el('div');
      box.style.display = 'grid';
      box.style.gap = '12px';
      //: Said first and plainly, because the tree is the page's spine and a reader who
      //: cannot see it needs to know it is EMPTY rather than broken. What follows is
      //: then introduced as having come from somewhere else.
      var lead = el('div', 'pr-card');
      lead.appendChild(el('div', 'pr-empty',
        'No workstream yet, so there is no tree to show. What is below was not '
        + 'raised by a board.'));
      box.appendChild(lead);
      if (need.total) box.appendChild(todoCard(list, null));
      if (spent) box.appendChild(sectionCost(list, pts, 'every hour on record'));
      host.appendChild(box);
      var note2 = document.getElementById('pr-note');
      if (note2) note2.hidden = false;
      return;
    }
    var note = document.getElementById('pr-note');
    if (note) note.hidden = false;
    var points = seriesOf(fields());
    var box = el('div');
    box.style.display = 'grid';
    box.style.gap = '12px';
    for (var i = 0; i < LAYOUT.length; i++) {
      if (LAYOUT[i] === 'kpi') box.appendChild(sectionKpi(list, points));
      else if (LAYOUT[i] === 'hero') {
        box.appendChild(sectionCost(list, points, 'every workstream together'));
      } else if (LAYOUT[i] === 'todo') box.appendChild(todoCard(list, null));
      else if (LAYOUT[i] === 'crew') box.appendChild(sectionCrew(list));
      else if (LAYOUT[i] === 'tree') {
        box.appendChild(sectionTree(buildTree(list, null), false));
      }
    }
    host.appendChild(box);
  }

  //: *list* comes in beside *s* because a nested board is a SIBLING row of the fold's
  //: flat list, not a child of `s` -- so the tree of one epic still needs the whole
  //: list to find the boards hanging under this one's tasks.
  function renderStream(s, list) {
    var goal = txt(s.goal) || txt(s.id) || DASH;
    document.getElementById('pr-title').textContent = goal;
    var scope = { id: txt(s.id) || '', goal: txt(s.goal) || '' };
    //: ONE build, and the header reads the root of it. The board row's own `accepted`,
    //: `total` and `credits` count that board ALONE, so on an epic with a nested board
    //: they are smaller than the epic row directly below them -- the same two numbers,
    //: stated twice, disagreeing. The roll-up is the honest one here: the subtasks are
    //: on the page, under this epic, and their cost was spent getting this epic done.
    var nodes = buildTree(list, s);
    var root = nodes.length ? nodes[0] : null;
    var acc = root ? root.done : (num(s.accepted) || 0);
    var tot = root ? root.total : (num(s.total) || 0);
    var cr = root ? billTotal(root.bill) : credits(s);
    var need = needsYou([s], scope).total;
    var host = document.getElementById('pr-sentence');
    clear(host);
    host.appendChild(document.createTextNode('done '));
    host.appendChild(el('b', null, acc + ' / ' + tot));
    host.appendChild(document.createTextNode(', spent '));
    host.appendChild(el('b', null, fmtCr(cr)));
    host.appendChild(document.createTextNode(' credits, '));
    host.appendChild(el('b', null, String(need)));
    host.appendChild(document.createTextNode(need === 1 ? ' needs you' : ' need you'));

    var box = el('div');
    box.style.display = 'grid';
    box.style.gap = '12px';

    box.appendChild(todoCard([s], scope));
    box.appendChild(sectionCrew([s]));
    //: ONE EPIC ONLY. The pipeline answers "where does the work stop", which is a
    //: question about one workstream: across every workstream at once the three
    //: stages would mix boards whose gates are different conductors', and the
    //: progress bar would count a number nobody is responsible for.
    box.appendChild(pipelineCard(s));
    //: The tree of this one epic REPLACES the flat task list that was here. The list
    //: drew one row per task with its cost and result; a task row of the tree draws
    //: the same three things and also says which round it belongs to and what its own
    //: worker's board did under it, which the flat list had no room for.
    box.appendChild(sectionTree(nodes, true));
    //: One board's own hours, behind the same toggle: a reader who collapsed cost on
    //: the global view and then opened an epic did not ask to see it again.
    box.appendChild(sectionCost([s], seriesOf(s), 'this workstream only'));

    var host2 = document.getElementById('pr-view');
    clear(host2);
    host2.appendChild(box);
  }

  // ---------------------------------------------------------------- render

  function render() {
    var list = streams();
    plots = [];
    var found = null;
    if (view !== ALL) {
      for (var j = 0; j < list.length; j++) {
        if ((txt(list[j].id) || String(j)) === view) { found = list[j]; break; }
      }
      if (!found) view = ALL;   // the fold dropped the board this pill named
    }
    renderPills(list);
    //: The bound cells are filled by the host with the raw JSON of an array, which is
    //: unreadable in a sentence, so each one is overwritten with its count here.
    put('items', plural(list.length, 'workstream', 'workstreams'));
    put('omitted', num(fields().omitted));
    put('series', plural(seriesOf(fields()).length, 'hour', 'hours'));
    put('for_you', forYou().length);
    var vd = verdict();
    put('verdict', vd ? VERDICTS[vd.state][0] : null);
    var board = ciBoard();
    //: THE NOUN SURVIVES THE ABSENT CASE. `ci` is the only slot here that is both
    //: conditional and carries its own noun, so passing null left the line reading
    //: "..., —, last entry 34m ago" -- a dash governing nothing. The other conditional
    //: slot, `verdict`, keeps its noun in the markup and so reads "— verdict" already.
    put('ci', board
      ? plural(redLanes(board).length, 'red lane', 'red lanes')
      : DASH + ' red lanes');
    //: ELAPSED, not the stamp's hour. `hourLabel` buckets to the hour, which would
    //: print "17:00" for an entry at 17:09 -- and this line's reader is asking how
    //: old the page is, which an hour bucket cannot answer to within an hour.
    var since = sinceMs(fields().last_entry_at);
    put('last_entry_at', since === null ? null : fmtAgo(since));
    //: ABOVE the view, in the order a reader needs them: whether these numbers are
    //: still being produced, then the lead's word on them, then the lanes in the way.
    renderStale();
    renderVerdict(vd);
    renderLanes(board);
    renderLive();
    //: BEFORE the tree is built, because a row cannot ask whether it changed while
    //: it is being built -- and after this, `rowWas` already holds the new state, so
    //: a second render with no new read marks nothing.
    flashes = flashed();
    if (found) renderStream(found, list); else renderGlobal(list);
    //: AFTER the view, and from the new read. `drawerAt` survives the render, which
    //: is what makes a refresh update an open drawer rather than close it.
    renderDrawer();
    //: Only now does a card have a width, so only now can a chart be drawn to one.
    drawPlots();
  }

  //: Only the lanes a reader has to do something about. A green lane in a strip
  //: titled by its reds is noise, and there are usually ninety of them.
  function redLanes(board) {
    return board.lanes.filter(function (l) {
      var s = txt(l.state);
      return s === 'fail' || s === 'did_not_run';
    });
  }

  function renderVerdict(vd) {
    var host = document.getElementById('pr-verdict-host');
    if (!host) return;
    clear(host);
    if (!vd) return;
    var pair = VERDICTS[vd.state];
    var card = el('div', 'pr-vd');
    card.style.setProperty('--pr-vd-c', pair[1]);
    var left = el('div');
    left.appendChild(el('div', 'pr-vd-state', pair[0]));
    if (vd.state === 'no_word') {
      //: THE HONEST SILENCE. Two different ways to arrive here and a reader needs to
      //: know which: nobody has posted at all, or somebody posted and the board has
      //: moved since. The second is the dangerous one, so it names what it is
      //: downgrading rather than quietly hiding the lead's own word.
      left.appendChild(el('div', 'pr-vd-head', vd.superseded
        ? 'The crewmate has not posted since the log last advanced.'
        : 'The crewmate has not posted a verdict yet.'));
      if (vd.superseded && vd.headline) {
        left.appendChild(el('div', 'pr-vd-block',
          'Its last word was "' + vd.headline + '". Read it as a past reading.'));
      }
    } else {
      if (vd.headline) left.appendChild(el('div', 'pr-vd-head', vd.headline));
      if (vd.blocker) {
        var b = el('div', 'pr-vd-block');
        b.appendChild(el('b', null, 'The one in the way: '));
        b.appendChild(document.createTextNode(vd.blocker));
        left.appendChild(b);
      }
    }
    card.appendChild(left);
    var meta = el('div', 'pr-vd-meta');
    //: Marked as the crewmate's own, the same way an agentic cell is marked
    //: elsewhere: a reader deciding whether to act on a judgment is entitled to know
    //: it is a judgment. Only when the host says this cell IS agentic, so a page
    //: rendered from a manifest that changed does not claim it on the host's behalf.
    if (agenticNames().indexOf('verdict') !== -1) {
      meta.appendChild(el('span', 'pr-chip', 'crewmate wrote this'));
    }
    var age = sinceMs(vd.wroteAt);
    if (age !== null) meta.appendChild(el('span', null, fmtAgo(age)));
    if (meta.firstChild) card.appendChild(meta);
    host.appendChild(card);
  }

  function renderLanes(board) {
    var host = document.getElementById('pr-lanes-host');
    if (!host) return;
    clear(host);
    if (!board) return;
    var reds = redLanes(board);
    if (!reds.length) return;
    var failed = reds.filter(function (l) { return txt(l.state) === 'fail'; }).length;
    var never = reds.length - failed;
    var card = el('div', 'pr-lanes');
    var head = el('div', 'pr-lanes-h');
    var words = [];
    if (failed) words.push(plural(failed, 'red', 'red'));
    if (never) words.push(never + ' did not run');
    head.appendChild(el('b', null, words.join(', ')));
    var where = [];
    if (board.pr) where.push(/^\d+$/.test(board.pr) ? 'PR #' + board.pr : board.pr);
    if (board.head) where.push('head ' + board.head);
    if (where.length) head.appendChild(el('span', null, where.join(' \u00b7 ')));
    card.appendChild(head);
    for (var i = 0; i < reds.length; i++) {
      var l = reds[i];
      var never_ran = txt(l.state) === 'did_not_run';
      var row = el('div', 'pr-lane');
      //: The mark carries the distinction too, not only the colour: this page is
      //: read on a light canvas and in a screenshot, and a hue alone is not a word.
      var mark = el('div', 'pr-lane-m', never_ran ? '\u25cb' : '\u2717');
      mark.style.color = never_ran ? 'var(--muted, #7f7f88)' : 'var(--pr-s1)';
      row.appendChild(mark);
      row.appendChild(el('div', 'pr-lane-n', txt(l.name)));
      row.appendChild(el('div', 'pr-lane-w', never_ran
        ? (txt(l.why) || 'lane never started \u2014 not a finding')
        : (txt(l.why) || '')));
      //: WHO CAN CLEAR IT, which is what decides whether the reader can act at all.
      //: A lane that never started is neither party's finding, so it is tagged with
      //: the act instead: somebody has to re-run it.
      var owner = txt(l.owner);
      var tag = never_ran ? 'rerun it' : (owner === 'maintainer' ? 'maintainer' : 'yours');
      row.appendChild(el('span', 'pr-chip', tag));
      card.appendChild(row);
    }
    host.appendChild(card);
  }

  //: The band that says these numbers have stopped being produced.
  //:
  //: Distinct from the frame's own stale band, which says a FIELD did not resolve.
  //: Here every field resolved and the log behind them has gone quiet, which is the
  //: difference between "nothing is happening" and "nothing is reaching me" -- and
  //: the second is what a restarted gateway leaves behind, with every number on the
  //: page intact and correct as of a time nothing else on it names.
  function renderStale() {
    var host = document.getElementById('pr-stale-host');
    if (!host) return;
    clear(host);
    var at = txt(fields().last_entry_at);
    var ms = sinceMs(at);
    if (ms === null || ms < QUIET_MS) return;
    var band = el('div', 'pr-stale');
    band.appendChild(el('b', null, 'No new entry for ' + fmtSince(ms) + '.'));
    band.appendChild(document.createTextNode(
      'Every number below is a last-known reading.'));
    var seq = num((window.kirocrew || {}).seq);
    if (seq !== null) band.appendChild(el('i', null, 'fold seq ' + seq));
    host.appendChild(band);
  }

  // --------------------------------------------------------------- the drawer

  //: One task's own record, beside the page.
  //:
  //: Everything it shows is already in the document: the frame it is minted into has
  //: `connect-src 'none'`, so a drawer that wanted to go and fetch an item's detail
  //: could not. That is why the fold carries a bounded tail per task rather than the
  //: page asking for one.
  //:
  //: Re-rendered on every refresh from the NEW read, with `drawerAt` kept across it,
  //: so an advancing fold updates what is open instead of closing it.
  function renderDrawer() {
    var host = document.getElementById('pr-drawer-host');
    if (!host) return;
    clear(host);
    if (!drawerAt) return;
    var found = taskAt(drawerAt);
    if (!found) {
      // The fold dropped the task this drawer named -- past the task cap, or its
      // board rebuilt. Closed rather than left on a stale copy: a drawer showing an
      // item the page no longer lists is the one thing worse than no drawer.
      drawerAt = null;
      return;
    }
    var t = found.task;
    var back = el('div', 'pr-dr-back');
    back.addEventListener('click', function () { drawerAt = null; renderDrawer(); });
    var panel = el('div', 'pr-dr');
    panel.setAttribute('role', 'dialog');
    panel.setAttribute('aria-modal', 'false');
    panel.setAttribute('aria-label', txt(t.title) || 'task');

    var head = el('div', 'pr-dr-h');
    var titles = el('div');
    titles.appendChild(el('div', 'pr-dr-t', txt(t.title) || DASH));
    titles.appendChild(el('div', 'pr-dr-s',
      (txt(found.board.goal) || txt(found.board.id) || DASH)
      + ' \u00b7 round ' + (num(found.board.round) || 0)));
    head.appendChild(titles);
    var shut = el('button', 'pr-dr-x', '\u2715');
    shut.setAttribute('aria-label', 'Close');
    shut.addEventListener('click', function () { drawerAt = null; renderDrawer(); });
    head.appendChild(shut);
    panel.appendChild(head);

    var body = el('div', 'pr-dr-b');
    //: STATE FIRST, as chips, because the three words a reader came for -- where it
    //: is, what the lead ruled, how long it has been quiet -- fit on one row.
    var chips = el('div', 'pr-dr-chips');
    var pill = verdictPill(t);
    if (pill) chips.appendChild(pill);
    var prc = prChip(t);
    if (prc) chips.appendChild(prc);
    var quiet = quietChip(t);
    if (quiet) chips.appendChild(quiet);
    var ran = fmtDur(t.duration_ms);
    if (ran !== DASH) chips.appendChild(el('span', 'pr-chip', ran));
    chips.appendChild(el('span', 'pr-chip pr-chip-cr', fmtCr(credits(t))));
    if (chips.firstChild) body.appendChild(chips);

    body.appendChild(section('What the worker last said', txt(t.summary),
      'The worker has not reported on this task yet.'));
    body.appendChild(section('What the conductor decided', txt(t.decision),
      'No ruling on this task. Nothing was asked of the conductor, or nothing has '
      + 'been answered yet.'));
    body.appendChild(section('Verdict', txt(t.verdict),
      'Not adjudicated. A verdict appears once the conductor has run the acceptance '
      + 'check over this task\u2019s own bar.'));

    //: THE RESULT BLOCK, and its empty text is the point of it. A reader opening a
    //: finished task wants the thing it produced; a blank area there reads as a
    //: page that failed rather than as work that has not landed.
    var out = [];
    if (txt(t.pr)) out.push('Pull request ' + txt(t.pr));
    if (txt(t.state) === 'accepted') out.push('Accepted by the conductor.');
    body.appendChild(section('Result / handoff', out.join(' \u00b7 '),
      'No output yet. A pull request, a branch or a handoff summary appears here when '
      + 'the task produces one.'));

    body.appendChild(lanesSection(t));
    body.appendChild(eventsSection(t));
    panel.appendChild(body);
    host.appendChild(back);
    host.appendChild(panel);
  }

  //: Open *n*'s drawer when it is a task, and say whether it did.
  //:
  //: ONE site for both gestures. The click and the Enter handler were the same two
  //: lines twice, which is the shape where a keyboard reader quietly loses a
  //: behaviour a pointer reader has.
  function openDrawerFor(n) {
    if (!n.task) return false;
    drawerAt = taskKey(n.boardId, n.task);
    renderDrawer();
    return true;
  }

  //: One titled block, with the sentence to show when there is nothing in it.
  function section(label, value, empty) {
    var sec = el('div', 'pr-dr-sec');
    sec.appendChild(el('div', 'pr-dr-k', label));
    sec.appendChild(value ? el('div', 'pr-dr-v', value) : el('div', 'pr-dr-none', empty));
    return sec;
  }

  //: This task's lanes, from the `ci` value. Only the ones that are red, like the
  //: strip above the page: a drawer listing ninety green lanes buries the two rows
  //: that brought the reader here.
  function lanesSection(t) {
    var sec = el('div', 'pr-dr-sec');
    sec.appendChild(el('div', 'pr-dr-k', 'Lanes'));
    var board = ciBoard();
    var mine = board && txt(board.pr) && txt(board.pr) === txt(t.pr) ? redLanes(board) : [];
    if (!mine.length) {
      var c = checksOf(t);
      sec.appendChild(el('div', 'pr-dr-none', c && c.fail === 0 && c.pass > 0
        ? 'Every lane green on the last board the crewmate read.'
        : 'No lane board for this task. The crewmate writes one when it reads a '
          + 'pull request\u2019s checks.'));
      return sec;
    }
    for (var i = 0; i < mine.length; i++) {
      var l = mine[i];
      var never = txt(l.state) === 'did_not_run';
      var row = el('div', 'pr-dr-e');
      row.appendChild(el('div', 'pr-dr-e-m', never ? '\u25cb' : '\u2717'));
      var x = el('div', 'pr-dr-e-t', txt(l.name));
      var why = txt(l.why) || (never ? 'lane never started \u2014 not a finding' : '');
      if (why) x.appendChild(el('div', 'pr-dr-e-k', why));
      row.appendChild(x);
      sec.appendChild(row);
    }
    return sec;
  }

  //: The item's own narrative, newest first.
  //:
  //: The HEADING carries the count, because "20 of 34" and "no events recorded" are
  //: different facts and a tail alone cannot tell them apart: the fold spends one
  //: bounded ring across every task, so a quiet task's older lines are dropped
  //: while its own count is kept exactly for this.
  function eventsSection(t) {
    var sec = el('div', 'pr-dr-sec');
    var rows = Array.isArray(t.events)
      ? t.events.filter(function (r) { return r && typeof r === 'object'; }) : [];
    var seen = num(t.events_seen) || 0;
    sec.appendChild(el('div', 'pr-dr-k', rows.length < seen
      ? 'Events \u00b7 ' + rows.length + ' of ' + seen
      : 'Events' + (seen ? ' \u00b7 ' + seen : '')));
    if (!rows.length) {
      sec.appendChild(el('div', 'pr-dr-none', seen
        ? 'This task recorded ' + plural(seen, 'event', 'events')
          + ', and the page is no longer carrying their text.'
        : 'No events recorded against this task yet.'));
      return sec;
    }
    var list = el('div', 'pr-dr-ev');
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var row = el('div', 'pr-dr-e');
      row.appendChild(el('div', 'pr-dr-e-m', hourLabel(r.at) || DASH));
      var x = el('div', 'pr-dr-e-t', txt(r.text) || DASH);
      var mark = [txt(r.kind), txt(r.status)].filter(Boolean).join(' \u00b7 ');
      if (mark) x.appendChild(el('div', 'pr-dr-e-k', mark));
      row.appendChild(x);
      list.appendChild(row);
    }
    sec.appendChild(list);
    return sec;
  }

  // ------------------------------------------------------- the per-epic pipeline

  //: One epic's work as the three stages it moves through: a worker runs a task, the
  //: conductor's acceptance check rules on it, the lead accepts it.
  //:
  //: Drawn as the stages rather than as a status column, because the question it
  //: answers is "where does the work stop" -- and the gate between two stages is
  //: named, so a reader does not have to infer what has to happen next.
  //:
  //: Every number here is the fold's own: a task's `spender` is who ran it, its
  //: `verdict` is what the check said, and `accepted` is the lead's own state.
  function pipelineCard(board) {
    var tasks = tasksOf(board);
    var card = el('div', 'pr-card');
    var h = el('div', 'pr-card-h');
    h.appendChild(el('div', 'pr-card-t', 'How the work moves'));
    h.appendChild(el('div', 'pr-card-c',
      'worker \u00b7 acceptance check \u00b7 the lead accepts'));
    card.appendChild(h);
    if (!tasks.length) {
      card.appendChild(el('div', 'pr-empty', 'No task on this workstream yet.'));
      return card;
    }

    //: A PARTITION: each task sits in the FURTHEST stage it has reached, and never
    //: in two. Overlapping sets read as a double count -- an accepted task has a
    //: verdict too, so it would appear in both and the rows would add to more than
    //: the board has. The three counts below sum to the total, which is the property
    //: that makes the progress bar and the stages one statement.
    var accepted = [], ruled = [], running = [];
    for (var k = 0; k < tasks.length; k++) {
      var row = tasks[k];
      if (txt(row.state) === 'accepted') accepted.push(row);
      else if (txt(row.verdict)) ruled.push(row);
      else running.push(row);
    }

    var pipe = el('div', 'pr-pipe');
    var head = el('div', 'pr-pipe-h');
    head.appendChild(el('b', null, accepted.length === tasks.length
      ? 'Every task accepted' : 'In progress'));
    head.appendChild(el('span', null, accepted.length + ' / ' + tasks.length + ' accepted'));
    pipe.appendChild(head);
    var bar = el('div', 'pr-pipe-bar');
    var fill = el('i');
    fill.style.width = ((accepted.length / tasks.length) * 100).toFixed(1) + '%';
    bar.appendChild(fill);
    pipe.appendChild(bar);

    stage(pipe, 'With a worker', running,
      'Nothing in flight. Every task has reached the acceptance check.');
    pipe.appendChild(el('div', 'pr-pipe-gate', '\u2193 when the worker reports done'));
    stage(pipe, 'Ruled, not yet accepted', ruled,
      'Nothing waiting on the lead.');
    pipe.appendChild(el('div', 'pr-pipe-gate', '\u2193 when the lead takes the verdict'));
    stage(pipe, 'Accepted', accepted,
      'Nothing accepted yet.');
    card.appendChild(pipe);
    return card;
  }

  function stage(host, label, rows, empty) {
    host.appendChild(el('div', 'pr-pipe-stage', label + (rows.length ? ' \u00b7 ' + rows.length : '')));
    if (!rows.length) {
      host.appendChild(el('div', 'pr-dr-none', empty));
      return;
    }
    for (var i = 0; i < rows.length && i < 8; i++) {
      var t = rows[i];
      var row = el('div', 'pr-pipe-row');
      var x = el('div');
      x.appendChild(el('div', 'pr-pipe-t', txt(t.title) || DASH));
      //: The worker is named by its per-render ALIAS, never its session key: this
      //: page is a document, and the conductor ledger's rule is that no reader but
      //: the conductor sees a key. The alias keeps the only property a reader needs,
      //: which is that two rows run by one worker carry one token.
      var who = txt(t.spender);
      x.appendChild(el('div', 'pr-pipe-w', who ? 'worker ' + who : 'no worker bound'));
      row.appendChild(x);
      var v = verdictPill(t);
      row.appendChild(v || el('span', 'pr-chip', txt(t.status) || txt(t.state) || DASH));
      row.appendChild(el('div', 'pr-n-cr', fmtCr(credits(t))));
      host.appendChild(row);
    }
    if (rows.length > 8) {
      host.appendChild(el('div', 'pr-held',
        plural(rows.length - 8, 'task', 'tasks') + ' not shown'));
    }
  }

  function put(name, value) {
    var node = document.querySelector('[data-dashboard-field="' + name + '"]');
    if (!node) return;
    node.textContent = (value === null || value === undefined || value === '')
      ? DASH : String(value);
  }

  //: On load AND on every push: the order of the host's first fill against this script
  //: is not the page's to assume, and a refill carries new values for the same page.
  render();
  window.addEventListener('message', function () { render(); });
  //: AND AGAIN ONCE THE DOCUMENT IS PARSED, because the host's FIRST fill is deferred
  //: to `DOMContentLoaded` while this script runs during parsing. The host writes every
  //: bound element from the raw value -- an array as `JSON.stringify` -- so without
  //: this the accounting line ended up reading as a wall of raw JSON on the real
  //: gateway, under a page that was otherwise correct.
  //:
  //: ON `window`, NOT ON `document`, and that distinction is the whole fix. The event
  //: is dispatched at `document` and BUBBLES to `window`, so every document-level
  //: listener runs before any window-level one -- and the host's is on `window`. A
  //: listener on `document` here therefore ran BEFORE the host's fill and was clobbered
  //: by it, which is exactly what the first attempt at this did. Same target as the
  //: host, registered later: window listeners run in registration order, the host's
  //: bootstrap is injected ahead of this page, so its fill goes first and the page's
  //: own text wins.
  //:
  //: Registered unconditionally: when the document is ALREADY parsed the host filled
  //: synchronously before this script, the `render()` above is therefore the later
  //: write, and this listener simply never fires. That is also why the evidence
  //: renderer never saw the bug -- it runs the script after the fill, the one order in
  //: which the page was right.
  window.addEventListener('DOMContentLoaded', function () { render(); });
  //: The host's own refill beacon, which it dispatches after a fill it was pushed.
  window.addEventListener('kirocrew-dashboard', function () { render(); });
  //: Escape closes the drawer, which is the gesture a reader tries first. Only the
  //: drawer: this page has no other overlay, and swallowing the key when nothing is
  //: open would take it from whatever the host put around the frame.
  window.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape' || !drawerAt) return;
    drawerAt = null;
    renderDrawer();
  });
  var timer = null;
  window.addEventListener('resize', function () {
    if (timer) window.clearTimeout(timer);
    timer = window.setTimeout(render, 120);
  });
}());
</script>
