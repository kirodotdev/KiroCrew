<div class="cb">
  <style>
    .cb {
      --c-card: var(--bg-elevated, #15151c); --c-ink: var(--text, #ececf1); --c-strong: var(--text-strong, #ffffff);
      --c-mute: var(--muted, #9a9aa8); --c-edge: var(--border, #2a2a35); --c-acc: var(--accent, #818cf8);
      --c-ok: var(--ok, #4ade80); --c-warn: var(--warn, #fbbf24); --c-bad: var(--danger, #f87171); --c-info: var(--info, #60a5fa);
      display: flex; flex-direction: column; gap: 10px; color: var(--c-ink);
      font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; font-variant-numeric: tabular-nums;
    }
    @media (prefers-color-scheme: light) {
      .cb {
        --c-card: var(--bg-elevated, #ffffff); --c-ink: var(--text, #111827); --c-strong: var(--text-strong, #030712);
        --c-mute: var(--muted, #6b7280); --c-edge: var(--border, #e5e7eb); --c-acc: var(--accent, #4f46e5);
        --c-ok: var(--ok, #15803d); --c-warn: var(--warn, #b45309); --c-bad: var(--danger, #b91c1c); --c-info: var(--info, #1d4ed8);
      }
    }
    .cb * { box-sizing: border-box; }
    .cb .band { border: 1px solid var(--c-warn); border-left-width: 4px; border-radius: 10px; padding: 9px 10px;
      background: var(--warn-subtle, rgba(251, 191, 36, .12)); animation: cb-glow 2.6s ease-in-out 3; }
    .cb .band-head { display: flex; align-items: baseline; gap: 6px; }
    .cb .k { color: var(--c-warn); font-size: 11px; font-weight: 750; text-transform: uppercase; letter-spacing: .06em; }
    .cb .tag { font-size: 10px; font-weight: 600; color: var(--c-mute); }
    .cb .ask { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; padding-top: 7px; }
    .cb .ask + .ask { margin-top: 7px; border-top: 1px solid var(--c-edge); }
    .cb .ask-copy { min-width: min(100%, 160px); flex: 1; }
    .cb .v { margin: 0; font-weight: 600; color: var(--c-strong); overflow-wrap: anywhere; }
    .cb .why { color: var(--c-mute); font-size: 11px; white-space: nowrap; }
    .cb .calm { margin: 0; color: var(--c-mute); font-size: 12px; }
    .cb .calm::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--c-ok);
      margin-right: 6px; vertical-align: 1px; }
    .cb .overview { padding: 10px 12px; border: 1px solid var(--c-edge); border-radius: 12px; background: var(--c-card); }
    .cb .eyebrow { margin: 0; color: var(--c-acc); font-size: 10px; font-weight: 750; text-transform: uppercase; letter-spacing: .06em; }
    .cb h1 { margin: 2px 0 9px; font-size: 16px; line-height: 1.3; font-weight: 680; color: var(--c-strong); overflow-wrap: anywhere; }
    .cb .meter { display: flex; flex-direction: column; gap: 6px; }
    .cb .row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 5px 10px; font-size: 11px; color: var(--c-mute); }
    .cb .row b { color: var(--c-strong); font-weight: 650; }
    .cb .track { height: 6px; border-radius: 999px; background: var(--c-edge); overflow: hidden; }
    .cb .fill { height: 100%; width: 0; border-radius: 999px; background: var(--c-ok); transition: width .7s ease-out; }
    .cb details { border: 1px solid var(--c-edge); border-radius: 10px; background: var(--c-card); overflow: hidden; }
    .cb summary { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 10px; cursor: pointer;
      color: var(--c-strong); font-weight: 650; list-style: none; }
    .cb summary::-webkit-details-marker { display: none; }
    .cb summary::after { content: '\203a'; color: var(--c-mute); font-size: 18px; line-height: 1; transition: transform .2s ease; }
    .cb details[open] summary { border-bottom: 1px solid var(--c-edge); }
    .cb details[open] summary::after { transform: rotate(90deg); }
    .cb summary:focus-visible, .cb button:focus-visible { outline: 2px solid var(--c-acc); outline-offset: -2px; }
    .cb .count { margin-left: auto; color: var(--c-mute); font-size: 11px; font-weight: 500; }
    .cb .inside { display: flex; flex-direction: column; gap: 8px; padding: 9px 10px 10px; }
    .cb .meta { display: flex; flex-wrap: wrap; gap: 5px 12px; color: var(--c-mute); font-size: 11px; }
    .cb .grid { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); }
    .cb .card { min-width: 0; display: flex; align-items: flex-start; flex-wrap: wrap; gap: 5px 8px; padding: 7px 8px;
      border-left: 3px solid var(--tone); border-radius: 7px; background: var(--bg, transparent); }
    .cb .card.pop { animation: cb-pop .3s ease-out both; }
    .cb .t { min-width: min(100%, 150px); flex: 1; margin: 0; font-size: 12px; font-weight: 600; color: var(--c-strong); overflow-wrap: anywhere; }
    .cb .pill { flex: none; border-radius: 999px; padding: 1px 7px; font-size: 10px; font-weight: 650; color: var(--tone);
      border: 1px solid var(--tone); white-space: nowrap; }
    .cb .sub { width: 100%; color: var(--c-mute); font-size: 11px; overflow-wrap: anywhere; }
    .cb .ask .sub { display: -webkit-box; margin: 0; overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .cb .help { margin: 5px 0 0; color: var(--c-mute); font-size: 11px; }
    .cb .tone-ok { --tone: var(--c-ok); } .cb .tone-run { --tone: var(--c-info); }
    .cb .tone-test { --tone: var(--c-acc); }
    .cb .tone-wait, .cb .tone-other { --tone: var(--c-mute); }
    .cb .tone-you { --tone: var(--c-warn); } .cb .tone-bad { --tone: var(--c-bad); }
    .cb .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--tone); animation: cb-blink 1.1s ease-in-out 6; }
    .cb button.reply { min-height: 40px; flex: none; font: inherit; font-size: 11px; padding: 3px 10px; border-radius: 6px; cursor: pointer;
      border: 1px solid var(--c-warn); background: var(--c-card); color: var(--c-strong); font-weight: 650; }
    .cb #cb-more { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; color: var(--c-mute); font-size: 11px; }
    .cb #cb-more[hidden] { display: none; }
    .cb #cb-more button.reply { border-color: var(--c-edge); }
    .cb .empty { margin: 0; color: var(--c-mute); font-size: 12px; }
    @keyframes cb-pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes cb-blink { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
    @keyframes cb-glow { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 50% { box-shadow: 0 0 0 3px var(--warn-subtle, rgba(251, 191, 36, .22)); } }
    @media (prefers-reduced-motion: reduce) {
      .cb *, .cb *::before, .cb *::after { animation: none !important; transition: none !important; }
    }
  </style>

  <section id="cb-you" aria-live="polite" data-i18n-aria="needs_you"></section>
  <section class="overview" aria-labelledby="cb-goal-label">
    <p class="eyebrow" id="cb-goal-label" data-i18n="goal">Goal</p>
    <h1 data-dashboard-field="goal">-</h1>
    <div class="meter" id="cb-meter"></div>
  </section>
  <details id="cb-details">
    <summary><span class="count" id="cb-details-label"></span></summary>
    <div class="inside">
      <div class="meta">
        <span id="cb-round"><span data-i18n="round">Round</span> <span data-dashboard-field="round">-</span></span>
        <span id="cb-updated"><span data-i18n="updated">Updated</span> <span data-dashboard-field="last_entry_at">-</span></span>
      </div>
      <ul class="grid" id="cb-tasks" data-i18n-aria="tasks"></ul>
      <div id="cb-more"><span data-dashboard-field="omitted">-</span> <span data-i18n="hidden">hidden</span></div>
    </div>
  </details>
  <span data-dashboard-field="items" hidden></span>
  <span data-dashboard-field="forgotten" hidden></span>
  <span data-dashboard-field="needs_you" hidden></span>
  <span data-dashboard-field="note" hidden></span>
  <span data-dashboard-field="note_at" hidden></span>

  <script>

          needs_you: 'Needs you', calm: 'No action needed', how: 'Adds a reply draft to chat. Nothing is sent until you send it.',
          accepted: '{d} of {n} accepted by the conductor', active: '{n} working', review: '{n} conductor checking',
          empty: 'No tasks yet', untitled: 'Untitled task',
          t_done: 'Accepted', t_working: 'Working', t_reported: 'Conductor checking', t_you: 'Needs you',
          t_waiting: 'Not started', t_rejected: 'Rejected', t_abandoned: 'Abandoned', action_above: 'Action above',
          answer_needed: 'Needs your answer', approval_needed: 'Approval needed', help_needed: 'Help needed', wrote: 'From · Your crewmate', from_record: 'From · Work record',
          pr: 'PR #{n}', reply: '\u270e Reply in chat', reply_title: 'Fills chat. You choose when to send.',
          about: 'About "{t}": ', no_goal: 'No goal yet. Give this crewmate one in chat.'

        'zh-CN': {
          goal: '\u76ee\u6807', round: '\u6307\u6325\u8f6e\u6b21', updated: '\u66f4\u65b0', tasks: '\u4efb\u52a1', hidden: '\u6761\u8f83\u65e9\u66f4\u65b0\u53ef\u5728\u804a\u5929\u4e2d\u67e5\u770b',
          show_tasks: '\u663e\u793a\u4efb\u52a1', hide_tasks: '\u6536\u8d77\u4efb\u52a1', ask_older: '\u5728\u804a\u5929\u4e2d\u8be2\u95ee', ask_older_say: '\u8bf7\u663e\u793a\u6b64\u770b\u677f\u7701\u7565\u7684\u8f83\u65e9\u66f4\u65b0\u3002',

          accepted: '{d} / {n} \u5df2\u7531\u6307\u6325\u63a5\u53d7', active: '{n} \u5de5\u4f5c\u4e2d', review: '{n} \u6307\u6325\u6b63\u5728\u68c0\u67e5',
          empty: '\u8fd8\u6ca1\u6709\u4efb\u52a1', untitled: '\u672a\u547d\u540d\u4efb\u52a1',
          t_done: '\u5df2\u63a5\u53d7', t_working: '\u5de5\u4f5c\u4e2d', t_reported: '\u6307\u6325\u6b63\u5728\u68c0\u67e5', t_you: '\u9700\u8981\u4f60',
          t_waiting: '\u5c1a\u672a\u5f00\u59cb', t_rejected: '\u5df2\u62d2\u7edd', t_abandoned: '\u5df2\u653e\u5f03', action_above: '\u64cd\u4f5c\u89c1\u4e0a\u65b9',
          answer_needed: '\u9700\u8981\u4f60\u56de\u7b54', approval_needed: '\u9700\u8981\u6279\u51c6', help_needed: '\u9700\u8981\u5e2e\u52a9', wrote: '\u6765\u81ea \u00b7 \u4f60\u7684\u961f\u53cb', from_record: '\u6765\u81ea \u00b7 \u5de5\u4f5c\u8bb0\u5f55',
          pr: 'PR #{n}', reply: '\u270e \u5728\u804a\u5929\u91cc\u56de\u590d', reply_title: '\u586b\u5165\u804a\u5929\u6846\uff0c\u7531\u4f60\u53d1\u9001\u3002',
          about: '\u5173\u4e8e\u201c{t}\u201d\uff1a', no_goal: '\u8fd8\u6ca1\u6709\u76ee\u6807\u3002\u8bf7\u5728\u804a\u5929\u91cc\u7ed9\u8fd9\u4f4d\u961f\u53cb\u4e00\u4e2a\u3002'
        }
      };
      function locale() {
        var l = (window.kirocrew || {}).locale;
        return typeof l === 'string' && Object.prototype.hasOwnProperty.call(I18N, l) ? l : 'en';
      }
      function has(key) { return Object.prototype.hasOwnProperty.call(I18N.en, key); }
      function display(value) {

      }
      function i18n(key, vars) {
        var table = I18N[locale()];
        var s = Object.prototype.hasOwnProperty.call(table, key) ? table[key] : I18N.en[key];

      }
      function applyStatic() {
        var nodes = document.querySelectorAll('[data-i18n]');
        for (var i = 0; i < nodes.length; i++) nodes[i].textContent = i18n(nodes[i].getAttribute('data-i18n'));
        var labels = document.querySelectorAll('[data-i18n-aria]');
        for (var j = 0; j < labels.length; j++) labels[j].setAttribute('aria-label', i18n(labels[j].getAttribute('data-i18n-aria')));
      }
      function text(v) { return typeof v === 'string' && v.trim() ? v.trim() : null; }
      function num(v) { return typeof v === 'number' && isFinite(v) ? v : null; }
      function el(tag, cls, words) {
        var n = document.createElement(tag); if (cls) n.className = cls; if (words) n.textContent = words; return n;
      }
      function bag() { return (window.kirocrew || {}).fields || {}; }
      function act(say) {
        try { parent.postMessage({ type: 'kirocrew-dashboard:act', text: say }, '*'); } catch (e) { /* no host */ }
      }
      function when(v) {
        var t = text(v), ms = t ? Date.parse(t) : NaN;
        if (!isFinite(ms)) return t || DASH;
        try { return new Date(ms).toLocaleString(locale(), { dateStyle: 'medium', timeStyle: 'short' }); } catch (e) { return t; }
      }
      function written(name) {
        var a = (window.kirocrew || {}).agentic; return Array.isArray(a) && a.indexOf(name) !== -1;
      }
      function items() {
        var f = bag(); return Array.isArray(f.items) ? f.items.filter(function (i) { return i && typeof i === 'object'; }) : [];
      }
      // A worker's done report is still only a claim; accepted is the conductor's ruling.
      function tone(it) {
        var state = text(it.state);
        if (state === 'accepted') return ['ok', 't_done'];
        if (state === 'rejected') return ['bad', 't_rejected'];
        if (state === 'abandoned') return ['other', 't_abandoned'];
        if (state !== 'open') return ['other', state || 'unknown'];
        if (it.status === 'question' || it.status === 'blocked') return ['you', 't_you'];
        if (it.status === 'progress') return ['run', 't_working'];
        if (it.status === 'done') return ['test', 't_reported'];
        return ['wait', 't_waiting'];
      }
      function label(key) { return has(key) ? i18n(key) : key; }
      function replyFor(subject) {
        var b = el('button', 'reply', i18n('reply'));
        b.type = 'button'; b.title = i18n('reply_title');
        var say = i18n('about', { t: subject.length > 80 ? subject.slice(0, 79) + '\u2026' : subject });
        b.addEventListener('click', function () { act(say); }); return b;
      }
      function requestNeed(item) {
        if (item.status === 'question') return i18n('answer_needed');
        if (item.reason === 'approval') return i18n('approval_needed');
        return i18n('help_needed');
      }
      function drawYou(list) {
        var host = document.getElementById('cb-you'); if (!host) return; host.textContent = '';
        var said = Array.isArray(bag().needs_you) ? bag().needs_you.filter(function (x) { return !!text(x); }) : [];
        var asking = list.filter(function (it) {
          if (tone(it)[0] !== 'you') return false;
          var title = text(it.title); return !(title && said.some(function (s) { return s.indexOf(title) !== -1; }));
        });
        if (!said.length && !asking.length) { host.appendChild(el('p', 'calm', i18n('calm'))); return; }
        var band = el('div', 'band'), head = el('div', 'band-head');
        head.appendChild(el('span', 'k', i18n('needs_you'))); band.appendChild(head);
        band.appendChild(el('p', 'help', i18n('how')));
        for (var i = 0; i < said.length && i < 12; i++) {
          var own = el('div', 'ask'), ownCopy = el('div', 'ask-copy');
          ownCopy.appendChild(el('p', 'v', text(said[i]))); own.appendChild(ownCopy);
          own.appendChild(el('span', 'why', written('needs_you') ? i18n('wrote') : i18n('answer_needed')));
          own.appendChild(replyFor(text(said[i]))); band.appendChild(own);
        }
        for (var j = 0; j < asking.length; j++) {
          var it = asking[j], row = el('div', 'ask'), copy = el('div', 'ask-copy');
          copy.appendChild(el('p', 'v', text(it.title) || text(it.item_id) || DASH));
          var summary = text(it.summary); if (summary) copy.appendChild(el('p', 'sub', summary));
          row.appendChild(copy); row.appendChild(el('span', 'why', i18n('from_record') + ' · ' + requestNeed(it)));
          row.appendChild(replyFor(text(it.title) || text(it.item_id) || DASH)); band.appendChild(row);
        }
        host.appendChild(band);
      }
      // Closed tasks outside the fold window still count toward honest progress totals.
      function forgotten() {
        var f = bag().forgotten, g = f && typeof f === 'object' && !Array.isArray(f) ? f : {};
        function n(k) { var v = num(g[k]); return v && v > 0 ? Math.floor(v) : 0; }
        return { items: n('items'), accepted: n('accepted') };

      function drawMeter(list) {
        var host = document.getElementById('cb-meter'); if (!host) return; host.textContent = '';
        var done = 0, run = 0, review = 0;
        for (var i = 0; i < list.length; i++) {
          var t = tone(list[i])[0]; if (t === 'ok') done += 1; if (t === 'run') run += 1; if (t === 'test') review += 1;
        }
        var gone = forgotten(); done += gone.accepted;
        var total = list.length + gone.items, row = el('div', 'row');
        row.appendChild(el('b', null, i18n('accepted', { d: done, n: total })));
        var moving = i18n('active', { n: run }); if (review) moving += ' \u00b7 ' + i18n('review', { n: review });
        row.appendChild(el('span', null, moving)); host.appendChild(row);
        if (!total) return;
        var track = el('div', 'track'); track.setAttribute('role', 'progressbar');
        track.setAttribute('aria-label', i18n('accepted', { d: done, n: total })); track.setAttribute('aria-valuemin', '0');
        track.setAttribute('aria-valuemax', String(total)); track.setAttribute('aria-valuenow', String(done));

      }
      var seen = {};
      function drawTasks(list) {
        var host = document.getElementById('cb-tasks'); if (!host) return; host.textContent = '';
        list = list.filter(function (it) { return tone(it)[0] === 'you'; })
          .concat(list.filter(function (it) { return tone(it)[0] !== 'you'; }));
        for (var i = 0; i < list.length; i++) {
          var it = list[i], id = text(it.item_id) || String(i), reading = tone(it);
          var card = el('li', 'card tone-' + reading[0] + (seen[id] ? '' : ' pop'));
          if (!seen[id]) card.style.animationDelay = (Math.min(i, 12) * 35) + 'ms'; seen[id] = true;
          card.appendChild(el('p', 't', text(it.title) || i18n('untitled')));
          var pill = el('span', 'pill');
          if (reading[0] === 'run') { var dot = el('span', 'dot'); dot.setAttribute('aria-hidden', 'true'); pill.appendChild(dot); }

          var summary = text(it.summary); if (reading[0] === 'bad' && summary) card.appendChild(el('span', 'sub', summary));
          host.appendChild(card);
        }
        if (!list.length) host.appendChild(el('li', 'empty', i18n('empty')));
      }
      function drawDetailsLabel() {
        var details = document.getElementById('cb-details'), label = document.getElementById('cb-details-label');
        if (!details || !label) return;
        label.textContent = details.open ? i18n('hide_tasks') : i18n('show_tasks');
      }
      function render() {
        var list = items(); applyStatic();
        var cells = document.body.querySelectorAll('[data-dashboard-field]');
        for (var c = 0; c < cells.length; c++) if (!cells[c].textContent.trim()) cells[c].textContent = DASH;
        var round = document.getElementById('cb-round'); if (round) round.hidden = !(num(bag().round) > 0 && list.length > 0);
        var updated = document.getElementById('cb-updated'); if (updated) updated.hidden = !text(bag().last_entry_at);
        var goal = document.querySelector('[data-dashboard-field="goal"]'); if (goal && !text(bag().goal)) goal.textContent = i18n('no_goal');
        var stamp = document.querySelector('[data-dashboard-field="last_entry_at"]');
        if (stamp && text(bag().last_entry_at)) stamp.textContent = when(bag().last_entry_at);
        drawYou(list); drawMeter(list); drawTasks(list); drawDetailsLabel();
        // Omitted counts dropped work-log updates, never missing task rows.
        var more = document.getElementById('cb-more');
        if (more) {
          more.hidden = !(num(bag().omitted) > 0);
          var old = more.querySelectorAll('button.reply, .hint');
          for (var o = 0; o < old.length; o++) old[o].remove();
          if (!more.hidden) {
            var askOlder = el('button', 'reply', i18n('ask_older'));
            askOlder.type = 'button'; askOlder.title = i18n('reply_title');
            askOlder.addEventListener('click', function () { act(i18n('ask_older_say')); });
            more.appendChild(askOlder);
            more.appendChild(el('span', 'sub hint', i18n('how')));
          }
        }
      }
      render(); window.addEventListener('load', render);
      var details = document.getElementById('cb-details');
      if (details) details.addEventListener('toggle', function () { drawDetailsLabel(); });
      window.addEventListener('message', function () { setTimeout(render, 0); });
    }());
  </script>
