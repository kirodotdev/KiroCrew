<div class="oc">
  <style>
  .oc {
    /* THE SAME PALETTE AS `timeline`, deliberately: the two pages are read one after
       the other, and a colour that meant "needs a person" there must mean it here. */
    --oc-run: #7fd1b9;
    --oc-idle: #e0b964;
    /* Its own hue, not `idle` dimmed -- see the note on `--tl-cold` in `timeline`. */
    --oc-cold: #b8822c;
    --oc-need: #ef9a85;
    --oc-done: #8fa8de;
    /* Clearly darker than `--oc-need`: a rejected run and a run waiting on a person
       are the two a reader must not confuse. */
    --oc-bad: #a8453c;
    --oc-gone: #7e8289;
    --oc-line: color-mix(in oklab, var(--border, #2a2d36) 86%, var(--text, #e4e4e7));
    --oc-card: var(--card, #181b22);

    font: 12px/1.45 system-ui, -apple-system, sans-serif;
    color: var(--text, #e4e4e7);
    padding: 11px 12px 14px;
  }
  .oc h2 { font-size: 12.5px; font-weight: 650; margin: 0; letter-spacing: .01em;
    color: var(--text-strong, #fafafa); }
  .oc .oc-sub { font-size: 10.5px; color: var(--muted, #7f7f88); margin-top: 3px; }
  .oc .oc-head { display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; flex-wrap: wrap; }
  .oc-sect { font-size: 10px; letter-spacing: .07em; text-transform: uppercase;
    color: var(--muted-strong, #52525b); margin: 15px 0 5px; font-weight: 650; }

  /* ------------------------------------------------------------------ *
   * the graph: an indented tree with real connectors                   *
   * ------------------------------------------------------------------ */
  .oc-node { position: relative; padding: 3px 0 3px 0; }
  /* oc-kids is a grid container so grid-template-rows can animate smoothly.
     The inner oc-kids-body carries the visual border/indent and its children
     the connector pseudo-elements: this lets the outer grid row collapse without
     destroying the absolutely-positioned elbow lines. */
  .oc-kids { display: grid; grid-template-rows: 1fr; overflow: hidden;
    /* minmax(0, 1fr), not auto: an auto column grows to the longest unwrapped line
       inside, and this box clips, so a long row pushed its Hide button out of reach. */
    grid-template-columns: minmax(0, 1fr);
    transition: grid-template-rows 0.2s ease; }
  .oc-kids.oc-kids-closed { grid-template-rows: 0fr; }
  /* Cut to the end state for users who prefer no motion. */
  @media (prefers-reduced-motion: reduce) { .oc-kids { transition: none; } }
  /* Inner body: carries the indent, border-left and elbow lines. It does not clip:
     the last child's mask sits on this border column, outside the padding box, so a
     clip here would cut the mask off and leave the rail running past the last elbow.
     min-height: 0 lets the closing grid row shrink it; the outer .oc-kids clips. */
  .oc-kids-body { min-height: 0;
    margin-left: 13px; padding-left: 11px; position: relative;
    border-left: 1px solid color-mix(in oklab, var(--oc-line) 70%, transparent); }
  /* The elbow into each child, so the line is a connector and not a margin. */
  .oc-kids-body > .oc-node:before { content: ''; position: absolute; left: -11px; top: 13px;
    width: 9px; height: 1px; background: color-mix(in oklab, var(--oc-line) 70%, transparent); }
  /* The last child's rail stops at its own elbow instead of running past it. */
  .oc-kids-body > .oc-node:last-child:after { content: ''; position: absolute; left: -12px;
    top: 14px; bottom: 0; width: 1px; background: var(--oc-card); }

  .oc-chip { display: inline-flex; align-items: center; gap: 7px; max-width: 100%;
    padding: 4px 9px 4px 7px; border-radius: 7px; box-sizing: border-box;
    border: 1px solid color-mix(in oklab, var(--oc-line) 62%, transparent);
    background: color-mix(in oklab, var(--oc-card) 92%, var(--oc-line) 8%); }
  .oc-chip.oc-is-lead { border-color: color-mix(in oklab, var(--oc-done) 46%, var(--oc-line));
    background: color-mix(in oklab, var(--oc-card) 88%, var(--oc-done) 12%); }
  .oc-chip.oc-is-sub { border-color: color-mix(in oklab, var(--oc-done) 32%, var(--oc-line)); }
  /* Toggle button on lead and sub-lead chips: chevron + visible text label so the
     control reads as "show/hide" rather than a bare play-button glyph. The icon
     rotates when collapsed; the button itself does not. Both states rest on the same
     faint pill in full colour, so Hide and Show read as one control: :hover only
     strengthens the pill, and :focus-visible adds a keyboard ring. */
  .oc-fold { all: unset; cursor: pointer; flex: 0 0 auto; display: inline-flex;
    align-items: center; gap: 4px; padding: 2px 6px 2px 4px;
    border-radius: 4px; font-size: 11px; line-height: 1;
    color: var(--oc-done);
    background: color-mix(in oklab, var(--oc-done) 10%, transparent);
    transition: color 0.1s, background 0.1s; }
  .oc-fold:hover { background: color-mix(in oklab, var(--oc-done) 22%, transparent); }
  /* Keyboard focus ring; :focus-visible does not fire on mouse clicks (pointer heuristic). */
  .oc-fold:focus-visible {
    outline: 2px solid color-mix(in oklab, var(--oc-done) 55%, transparent);
    outline-offset: 1px; }
  .oc-fold-icon { flex: 0 0 auto; transition: transform 0.15s; }
  .oc-fold[aria-expanded="false"] .oc-fold-icon { transform: rotate(-90deg); }
  .oc-fold-text { font-weight: 600; letter-spacing: .02em; }
  .oc-role { font-size: 8.5px; letter-spacing: .08em; text-transform: uppercase;
    font-weight: 700; padding: 1px 5px; border-radius: 3px; flex: 0 0 auto;
    background: color-mix(in oklab, var(--oc-line) 55%, transparent);
    color: var(--text, #e4e4e7); }
  .oc-chip.oc-is-lead .oc-role { background: var(--oc-done); color: #10121a; }
  .oc-chip.oc-is-sub .oc-role { background: color-mix(in oklab, var(--oc-done) 62%, transparent);
    color: var(--text-strong, #fafafa); }
  .oc-name { min-width: 0; }
  .oc-name b { display: block; font-size: 11px; font-weight: 600; color: var(--text-strong, #fafafa);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .oc-name span { display: block; font-size: 9.5px; color: var(--muted, #7f7f88);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .oc-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  /* A RING, not a dot, for a worker that has never reported: the other grey on this
     page is `abandoned`, and an absent report must not read as a given-up one. */
  .oc-dot.oc-dot-mute { background: none !important; box-sizing: border-box;
    border: 1.5px solid var(--oc-gone); }
  .oc-stat.oc-stat-mute { border-style: dashed; }
  .oc-none-line { font-size: 10px; color: var(--muted-strong, #52525b); padding-left: 2px; }

  /* ------------------------------------------------------------------ *
   * the latest-run cards                                               *
   * ------------------------------------------------------------------ */
  .oc-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(238px, 1fr));
    gap: 7px; }
  .oc-card { border-radius: 8px; padding: 8px 10px 9px; box-sizing: border-box;
    border: 1px solid color-mix(in oklab, var(--oc-line) 58%, transparent);
    background: color-mix(in oklab, var(--oc-card) 94%, var(--oc-line) 6%);
    border-left-width: 3px; border-left-style: solid; min-width: 0; }
  .oc-card-top { display: flex; align-items: center; gap: 6px; }
  .oc-card-top b { font-size: 11px; font-weight: 650; color: var(--text-strong, #fafafa);
    flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .oc-stat { font-size: 9px; letter-spacing: .05em; text-transform: uppercase;
    font-weight: 700; padding: 1px 6px; border-radius: 9px; flex: 0 0 auto;
    border: 1px solid currentColor; }
  /* THE LINE THE OLD CHIP COULD NOT CARRY: what the worker actually last said,
     cleaned to one line. Two lines of room, then an ellipsis. */
  .oc-said { font-size: 10.5px; color: var(--text, #e4e4e7); margin-top: 5px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; }
  .oc-said.oc-none { color: var(--muted, #7f7f88); font-style: italic; }
  .oc-facts { display: flex; flex-wrap: wrap; gap: 3px 10px; margin-top: 6px;
    font-size: 9.5px; color: var(--muted, #7f7f88); }
  .oc-facts b { font-weight: 600; color: var(--text, #e4e4e7); }
  .oc-facts .oc-warn { color: var(--oc-need); font-weight: 600; }
  .oc-facts .oc-wait { color: var(--oc-idle); }
  .oc-keys { margin-top: 6px; padding-top: 5px; font-size: 9px;
    color: var(--muted-strong, #52525b);
    border-top: 1px solid color-mix(in oklab, var(--oc-line) 45%, transparent);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .oc-keys code { font: 9px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--muted, #7f7f88); }

  .oc-foot { font-size: 9.5px; color: var(--muted, #7f7f88); margin-top: 12px;
    padding-top: 9px; border-top: 1px solid color-mix(in oklab, var(--oc-line) 55%, transparent); }
  .oc-foot p { margin: 0 0 3px; }
  .oc-empty { font-size: 11px; color: var(--muted, #7f7f88); padding: 16px 0; }

  /* The Open / Closed / All filter. Real buttons; the pressed one is also marked by a
     check, a heavier weight and a stronger border, so colour is never the only carrier. */
  .oc-filter { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .oc-filter[hidden] { display: none; }
  .oc-flabel { align-self: center; font-size: 11px; color: var(--muted, #7f7f88); }
  /* A row kept only because a task under it matches: dashed, and it says so in words. */
  .oc-chip.oc-ctx { border-style: dashed; }
  .oc-fbtn { font: inherit; font-size: 11px; line-height: 1; cursor: pointer;
    min-height: 26px; padding: 5px 10px; border-radius: 999px; box-sizing: border-box;
    color: var(--muted, #7f7f88);
    border: 1px solid color-mix(in oklab, var(--oc-line) 62%, transparent);
    background: color-mix(in oklab, var(--oc-card) 92%, var(--oc-line) 8%); }
  .oc-fbtn:hover { color: var(--text, #e4e4e7); }
  .oc-fbtn:focus-visible {
    outline: 2px solid color-mix(in oklab, var(--oc-done) 55%, transparent);
    outline-offset: 1px; }
  .oc-fbtn[aria-pressed="true"] { color: var(--text-strong, #fafafa); font-weight: 650;
    border-color: color-mix(in oklab, var(--oc-done) 62%, var(--oc-line));
    background: color-mix(in oklab, var(--oc-card) 80%, var(--oc-done) 20%); }
  .oc-fbtn[aria-pressed="true"]:before { content: '\2713'; margin-right: 4px; }
  .oc-fn { margin-left: 5px; font-variant-numeric: tabular-nums; opacity: .8; }

  @media (max-width: 520px) {
    .oc { padding: 10px 10px 13px; }
    .oc-cards { grid-template-columns: 1fr; }
    .oc-kids-body { margin-left: 7px; padding-left: 9px; }
    .oc-kids-body > .oc-node:before { left: -9px; width: 7px; }
    /* The mask follows the narrower padding, so it still lands on the rail. */
    .oc-kids-body > .oc-node:last-child:after { left: -10px; }
    /* The fact line under a chip wraps rather than truncating on a phone: on a wide
       screen the full line fits on one row, but at 320 px the ellipsis would hide the
       counts at the end ("1 acce…"), and there is no hover to recover them. Wrapping
       keeps every count on screen; the chip's own box still bounds the width. */
    .oc-name span { white-space: normal; overflow: visible; text-overflow: clip; }
  }
  </style>

        foot_alias: '\u5361\u7247\u643a\u5e26\u4e3b\u673a\u636e\u4ee5\u6253\u5f00\u4f1a\u8bdd\u7684\u770b\u677f\u4e0e\u6761\u76ee\u3002\u8bb0\u5f55\u672c\u8eab\u4e3a\u4f1a\u8bdd\u5bc6\u94a5\u8bbe\u7f6e\u4e86\u522b\u540d\uff0c\u6240\u4ee5\u8fd9\u91cc\u6ca1\u6709\u9875\u9762\u80fd\u6307\u51fa\u6267\u884c\u8005\u7684\u4f1a\u8bdd\u3002',
        fold_hide: '\u6536\u8d77',
        fold_show: '\u663e\u793a {n} \u9879',
        fold_show_one: '\u663e\u793a 1 \u9879',
        fold_hint: '\u53ea\u6536\u8d77\u5173\u7cfb\u56fe\u4e2d\u7684\u8fd9\u4e00\u7ec4\uff0c\u4e0b\u65b9\u7684\u5361\u7247\u4e0d\u53d8\u3002',
        filter_label: '\u6309\u72b6\u6001\u7b5b\u9009\u4efb\u52a1', filter_open: '\u8fdb\u884c\u4e2d',
        filter_closed: '\u5df2\u5173\u95ed', filter_all: '\u5168\u90e8',
        filter_prefix: '\u4efb\u52a1\uff1a', fact_shown_of: '{m} \u4e2d\u663e\u793a {n} \u4e2a', scope_filtered: '\u5df2\u7b5b\u9009', fact_context: '\u56e0\u5176\u4e0b\u7684\u4efb\u52a1\u800c\u4fdd\u7559',
        filter_none_open: '\u6ca1\u6709\u8fdb\u884c\u4e2d\u7684\u4efb\u52a1\u3002',
        filter_none_closed: '\u6ca1\u6709\u5df2\u5173\u95ed\u7684\u4efb\u52a1\u3002'
      }
    };
    function locale() {
      var l = (window.kirocrew || {}).locale;
      return typeof l === 'string' && Object.prototype.hasOwnProperty.call(I18N, l) ? l : 'en';
    }
    function has(key) {
      return Object.prototype.hasOwnProperty.call(I18N.en, key);
    }
    function i18n(key, vars) {
      var table = I18N[locale()];
      var s = Object.prototype.hasOwnProperty.call(table, key) ? table[key] : I18N.en[key];
      if (s === undefined) s = key;
      if (vars) {
        s = s.replace(/\{(\w+)\}/g, function (m, k) {
          return Object.prototype.hasOwnProperty.call(vars, k) ? String(vars[k]) : m;
        });
      }
      return s;
    }
    function applyStatic() {
      var nodes = document.querySelectorAll('[data-i18n]');
      for (var i = 0; i < nodes.length; i++) nodes[i].textContent = i18n(nodes[i].getAttribute('data-i18n'));
    }

    /* The project report's threshold, so the two pages do not disagree about the same
       worker. See the note in `timeline`. */
    var QUIET_MS = 20 * 60 * 1000;
    var COLD_MS = 2 * 60 * 60 * 1000;
    /* The cleaned summary's cut. Two rendered lines of room, so a value longer than
       this could not be read anyway, and an ellipsis says it was cut. */
    var SAID_CHARS = 150;

    /* A worker's SITUATION, in the same six words the timeline uses. Four of them are
       readings of an open task, and each needs its own word:
         - `blocked` / `question` -> a PERSON is the next move
         - reported inside the window -> producing
         - reported, silent since -> idle, with the length said out loud
         - never reported -> not a long silence, an absent one. */
    var SITU = {
      run:  ['situ_run', 'var(--oc-run)'],
      idle: ['situ_idle', 'var(--oc-idle)'],
      cold: ['situ_cold', 'var(--oc-cold)'],
      need: ['situ_need', 'var(--oc-need)'],
      mute: ['situ_mute', 'var(--oc-gone)'],
      done: ['situ_done', 'var(--oc-done)'],
      bad:  ['situ_bad', 'var(--oc-bad)'],
      gone: ['situ_gone', 'var(--oc-gone)']
    };

    function text(v) { return typeof v === 'string' && v.trim() ? v.trim() : null; }
    function num(v) { return typeof v === 'number' && isFinite(v) ? v : null; }
    function fields() { return (window.kirocrew || {}).fields || {}; }
    function el(tag, cls, body) {
      var n = document.createElement(tag);

    }
    function boards() {
      var v = fields().items;

      return v.filter(function (b) { return b && typeof b === 'object' && Array.isArray(b.tasks); });
    }
    function stamp(v) {
      var s = text(v);

    }
    function span(ms) {
      if (ms < 60000) return Math.max(0, Math.round(ms / 1000)) + 's';
      var m = Math.round(ms / 60000);

    function dayClock(ms) {

      return ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + d.getUTCDate()).slice(-2)
        + ' ' + ('0' + d.getUTCHours()).slice(-2) + ':' + ('0' + d.getUTCMinutes()).slice(-2);
    }

    /* ONE LINE, whatever the record wrote. A summary is free text a worker typed, so
       it arrives with newlines, tabs and runs of spaces in it; dropped into a card
       unchanged it either collapses to an unreadable smear or blows the card's height
       out. Cut with an ellipsis, so a reader can tell a short summary from a cut one. */
    function oneLine(value) {
      var s = text(value);
      if (!s) return null;
      s = s.replace(/\s+/g, ' ').trim();
      if (s.length <= SAID_CHARS) return s;
      return s.slice(0, SAID_CHARS - 1).replace(/[\s,;:.]+$/, '') + '\u2026';
    }

    function situation(task, now) {
      var state = text(task.state) || 'open';
      if (state === 'accepted') return 'done';
      if (state === 'rejected') return 'bad';
      if (state === 'abandoned') return 'gone';
      var status = text(task.status);
      if (status === 'blocked' || status === 'question') return 'need';
      var last = stamp(task.last_report_at);
      if (last === null) return 'mute';
      var quiet = now - last;
      if (quiet >= COLD_MS) return 'cold';
      if (quiet >= QUIET_MS) return 'idle';
      return 'run';
    }

    /* THE FILTER. A task is closed when it was accepted, rejected or abandoned, and
       open otherwise -- the same split `situation` makes, so a task the page draws as
       working, idle, silent or needing a person is open. */
    function isClosed(task) {
      var situ = situation(task, 0);
      return situ === 'done' || situ === 'bad' || situ === 'gone';
    }
    function matches(task, mode) {
      if (mode === 'open') return !isClosed(task);
      if (mode === 'closed') return isClosed(task);
      return true;
    }
    function isTask(task) { return !!task && typeof task === 'object'; }
    function countTasks(list) {
      var c = { open: 0, closed: 0, all: 0 };
      for (var b = 0; b < list.length; b++) {
        for (var t = 0; t < list[b].tasks.length; t++) {
          if (!isTask(list[b].tasks[t])) continue;
          c.all++;
          if (isClosed(list[b].tasks[t])) c.closed++; else c.open++;
        }
      }
      return c;
    }
    /* The boards with only the tasks the filter keeps. The cards read these, so a
       worker's card shows its latest run among the tasks the reader asked for. */
    function filterBoards(list, mode) {
      var out = [];
      for (var b = 0; b < list.length; b++) {
        var copy = {};
        for (var k in list[b]) if (Object.prototype.hasOwnProperty.call(list[b], k)) copy[k] = list[b][k];
        copy.tasks = list[b].tasks.filter(function (t) { return isTask(t) && matches(t, mode); });
        out.push(copy);
      }
      return out;
    }
    /* Keep a lead or sub-lead only while a matching task sits at or under it.
       A task stays when it matches itself or when the board its worker runs still
       holds a match; a sub-lead whose own board holds none is drawn as a plain
       worker row if its own task matches, and dropped if it does not. */
    function pruneNode(n, mode) {
      var kids = [];
      for (var i = 0; i < n.kids.length; i++) {
        var kid = n.kids[i];
        var sub = kid.sub ? pruneNode(kid.sub, mode) : null;
        var own = matches(kid.task, mode);
        if (!own && !sub) continue;
        kids.push({ task: kid.task, board: kid.board, sub: sub, context: !own });
      }
      if (!kids.length) return null;
      return { board: n.board, depth: n.depth, kids: kids };
    }
    function pruneRoots(roots, mode) {
      var out = [];
      for (var i = 0; i < roots.length; i++) {

      }

    }
    /* The rows of a node that match the filter themselves; a context row is kept
       only for the tasks under it, so it is not counted as shown. */
    function ownRows(n) {

      return c;
    }
    function countSubs(n) {
      var c = 0;
      for (var i = 0; i < n.kids.length; i++) {

      }

    }

    /* The reader's pick. It lives in the page only: the frame has no storage, so a

      box.hidden = !list.length;
      var counts = countTasks(list);
      var btns = box.querySelectorAll('[data-oc-filter]');
      for (var i = 0; i < btns.length; i++) {
        var mode = btns[i].getAttribute('data-oc-filter');
        btns[i].setAttribute('aria-pressed', mode === filterMode ? 'true' : 'false');

    }
    function wireFilter() {
      var btns = document.querySelectorAll('[data-oc-filter]');
      for (var i = 0; i < btns.length; i++) {
        btns[i].addEventListener('click', function (e) {
          var mode = e.currentTarget.getAttribute('data-oc-filter');
          if (mode !== 'open' && mode !== 'closed' && mode !== 'all') return;
          filterMode = mode;
          render();
        });
      }
    }

    /* ---------------------------------------------------------------- *
     * THE GRAPH                                                        *
     * ---------------------------------------------------------------- */
    /* Three roles, and the fold's own `parent` link is what separates them:
         lead      a board with no parent -- nobody dispatched it
         sub-lead  the WORKER of a task that another board hangs off. Its own board's
                   `parent` names that task, so the link is read off the record and
                   not guessed from how deep a node sits.
         worker    a task's bound worker with no board of its own
       Keeping sub-lead apart matters because it is the only role that both answers to
       someone and dispatches someone, and collapsing it into `worker` hides half the
       crew's structure. */
    function buildGraph(list) {
      var byId = {};
      for (var i = 0; i < list.length; i++) {
        var id = text(list[i].id);
        if (id) byId[id] = list[i];
      }
      /* task key -> the board that task's worker conducts. Keyed by board+item,
         because two boards can carry the same item id. */
      var subOf = {};
      for (var j = 0; j < list.length; j++) {
        var p = list[j].parent;
        if (!p || typeof p !== 'object') continue;
        var pb = text(p.board), pi = text(p.item_id);
        if (!pb || !pi) continue;
        subOf[pb + '\u0000' + pi] = list[j];

      function node(board, depth, guard) {
        var kids = [];
        var bid = text(board.id) || '';

          var task = board.tasks[t];
          if (!task || typeof task !== 'object') continue;
          var sub = guard < 8 ? subOf[bid + '\u0000' + (text(task.item_id) || '')] : null;
          kids.push({
            task: task,
            board: board,
            sub: sub ? node(sub, depth + 1, guard + 1) : null
          });
        }
        return { board: board, depth: depth, kids: kids };
      }
      var roots = [];
      for (var k = 0; k < list.length; k++) {
        var par = list[k].parent;
        var placed = par && typeof par === 'object' && byId[text(par.board)];
        if (!placed) roots.push(node(list[k], 0, 0));
      }
      return { roots: roots, subOf: subOf };
    }

    function chip(role, title, sub, cls, colour) {
      var c = el('div', 'oc-chip' + (cls ? ' ' + cls : ''));
      c.appendChild(el('span', 'oc-role', role));
      if (colour) {
        var dot = el('span', 'oc-dot' + (colour === SITU.mute[1] ? ' oc-dot-mute' : ''));
        dot.style.background = colour;
        c.appendChild(dot);
      }
      var name = el('div', 'oc-name');
      var b = el('b', null, title);
      b.title = title;
      name.appendChild(b);
      if (sub) {
        var s = el('span', null, sub);
        s.title = sub;
        name.appendChild(s);
      }
      c.appendChild(name);
      return c;
    }

    /* A board's own counts, for the line under its name. */
    /* `shownRows` is set only while a filter is on: the first fact then reads

       not contradict the rows and is shorter on a narrow line. Under All the plain
       "4 dispatched" fact stands as before. */
    function boardFacts(board, shownRows) {

      }

      var nd = num(board.needs_you);

    }

    /* One dispatch: a task, its worker, and -- when that worker runs a board of its
       own -- that board's workers nested UNDER it.
       ONE NODE CARRIES BOTH HALVES of a sub-lead's role, and it is the node for the
       task its parent dispatched: a worker that answers to someone and dispatches
       others is one agent, and splitting it into a board node plus a task node puts
       the same agent on the page twice in two places. The node's name is what it was
       asked to do, and the line under it is the board it is running to do it. */
    /* Shared helper: wire a fold toggle button onto a chip and a .oc-kids pair.
       chipEl     -- the chip the button is appended to
       kidsEl     -- the .oc-kids grid container (its id is set here)
       kidsBodyEl -- the .oc-kids-body inner wrapper (hidden after collapse)
       stateKey   -- foldState map key for this group
       countFn    -- function returning the current row count for "Show {n} items"

       callback so sub-group toggles keep the parent label accurate. */
    function foldControl(chipEl, kidsEl, kidsBodyEl, stateKey, countFn, onToggle) {
      if (!Object.prototype.hasOwnProperty.call(foldState, stateKey)) {
        foldState[stateKey] = true; /* default: expanded */
      }
      var expanded = foldState[stateKey];
      var kidsId = 'oc-kids-' + stateKey.replace(/\W/g, '-');
      kidsEl.id = kidsId;
      if (!expanded) kidsEl.classList.add('oc-kids-closed');
      if (!expanded) kidsBodyEl.hidden = true;

      var labelExpanded = i18n('fold_hide');
      var labelCollapsed = countFn() === 1 ? i18n('fold_show_one') : i18n('fold_show', {n: countFn()});
      var btn = document.createElement('button');

      btn.className = 'oc-fold';
      btn.setAttribute('aria-expanded', expanded ? 'true' : 'false');

      var icon = document.createElement('span');
      icon.className = 'oc-fold-icon';
      icon.textContent = '\u25be';
      btn.appendChild(icon);

      textSpan.className = 'oc-fold-text';
      textSpan.textContent = expanded ? labelExpanded : labelCollapsed;
      btn.setAttribute('aria-label', expanded ? labelExpanded : labelCollapsed);
      /* The cards section is drawn from every task whatever the graph shows, so the
         button says that folding leaves the cards in place. */
      btn.title = i18n('fold_hint');
      btn.appendChild(textSpan);
      chipEl.appendChild(btn);
      foldButtons[stateKey] = btn;

      /* Re-sync hidden with the AT after the CSS transition closes the group.
         grid-template-rows: 0fr clips visually but does not remove from the AT. */
      kidsEl.addEventListener('transitionend', function (e) {
        if (e.propertyName !== 'grid-template-rows') return;
        if (kidsEl.classList.contains('oc-kids-closed')) kidsBodyEl.hidden = true;
      });

      var prm = window.matchMedia
        ? window.matchMedia('(prefers-reduced-motion: reduce)').matches : false;

      btn.addEventListener('click', function (e) {
        e.stopPropagation();

        btn.setAttribute('aria-expanded', next ? 'true' : 'false');
        foldState[stateKey] = next;
        if (next) {

          if (prm) kidsEl.classList.remove('oc-kids-closed');
          else requestAnimationFrame(function () { kidsEl.classList.remove('oc-kids-closed'); });
        } else {
          kidsEl.classList.add('oc-kids-closed');
          if (prm) kidsBodyEl.hidden = true;
        }
        labelCollapsed = countFn() === 1 ? i18n('fold_show_one') : i18n('fold_show', {n: countFn()});
        var newLabel = next ? labelExpanded : labelCollapsed;
        textSpan.textContent = newLabel;
        btn.setAttribute('aria-label', newLabel);
        if (typeof onToggle === 'function') onToggle();
      });

      /* Return a function the child levels call when THEIR state changes so
         this level's row count label stays accurate. */
      return function refreshLabel() {
        labelCollapsed = countFn() === 1 ? i18n('fold_show_one') : i18n('fold_show', {n: countFn()});
        if (btn.getAttribute('aria-expanded') === 'false') {

          btn.setAttribute('aria-label', labelCollapsed);
        }
      };
    }

    function drawKid(kid, into, now, onSubToggle, parentGroupKey) {
      var task = kid.task;
      var who = text(task.spender);
      var situ = situation(task, now);
      var node = el('div', 'oc-node');
      var label = who === null ? i18n('role_unbound') : i18n('role_worker') + ' ' + who;
      var line = i18n(SITU[situ][0]);
      var last = stamp(task.last_report_at);
      if (last !== null) line += ' ' + MID + ' ' + i18n('last_word') + ' ' + span(Math.max(0, now - last)) + i18n('ago_suffix');
      /* The note leads the fact line: at a narrow width the ellipsis cuts the end. */
      var ctxNote = kid.context ? i18n('fact_context') + ' ' + MID + ' ' : '';

      if (kid.sub) {
        var sub = kid.sub.board;
        /* Stable foldState key for this sub-lead: parent group's key + task id. */
        var subKey = (parentGroupKey || text(kid.board.id) || '') + '\x00' + (text(task.item_id) || '');

        var subChip = chip(
          i18n('role_sublead'),
          text(task.title) || text(task.item_id) || DASH,
          ctxNote + label + ' ' + MID + ' ' + line,
          'oc-is-sub' + (kid.context ? ' oc-ctx' : ''),
          SITU[situ][1]
        );
        var subKids = el('div', 'oc-kids');
        var subKidsBody = el('div', 'oc-kids-body');

        /* Wire the fold button; +1 for the "its board" chip that is visible
           inside the sub-lead's group when expanded, hidden when collapsed. */
        var subRefresh = foldControl(
          subChip, subKids, subKidsBody, subKey,
          function () { return 1 + countVisibleRows(kid.sub, subKey); },
          onSubToggle
        );

        /* The board it runs, named once, above the workers it dispatched. */
        var own = el('div', 'oc-node');
        own.appendChild(chip(
          i18n('role_its_board'),
          text(sub.goal) || i18n('no_goal_recorded'),
          boardFacts(sub, filterMode === 'all' ? null : ownRows(kid.sub)),
          null,
          null
        ));
        subKidsBody.appendChild(own);
        /* When a deeper level toggles, update this sub-label AND tell the parent. */
        var subRefreshAndNotify = function () {
          subRefresh();
          if (typeof onSubToggle === 'function') onSubToggle();
        };
        drawKids(kid.sub, subKidsBody, now, subRefreshAndNotify, subKey);
        subKids.appendChild(subKidsBody);

        node.appendChild(subChip);
        node.appendChild(subKids);
        into.appendChild(node);
        return;
      }
      node.appendChild(chip(
        label,
        text(task.title) || text(task.item_id) || DASH,
        ctxNote + line,
        kid.context ? 'oc-ctx' : null,
        SITU[situ][1]
      ));
      into.appendChild(node);
    }

    /* Count how many rows become visible when a group is expanded, given the CURRENT
       foldState. A sub-lead whose group is collapsed contributes only its chip (1
       row); expanded, it contributes its chip + "its board" chip + sub-kids. A board
       with no task is one row, the "nothing dispatched" line drawKids draws for it.
       groupKey is the foldState key for the group whose children we are counting. */
    function countVisibleRows(n, groupKey) {
      if (!n.kids.length) return 1;
      var count = 0;
      for (var i = 0; i < n.kids.length; i++) {
        var k = n.kids[i];
        count++;
        if (k.sub) {
          var subKey = groupKey + '\x00' + (text(k.task.item_id) || '');
          if (!Object.prototype.hasOwnProperty.call(foldState, subKey) || foldState[subKey]) {
            count++; /* "its board" chip */
            count += countVisibleRows(k.sub, subKey);
          }
        }
      }
      return count;
    }

    function drawKids(n, into, now, onSubToggle, parentGroupKey) {
      if (!n.kids.length) {
        into.appendChild(el('div', 'oc-node oc-none-line',
          i18n('nothing_dispatched')));
        return;
      }
      for (var i = 0; i < n.kids.length; i++) drawKid(n.kids[i], into, now, onSubToggle, parentGroupKey);
    }

    function drawNode(n, into, now) {
      var board = n.board;
      var boardId = text(board.id) || '';
      var wrap = el('div', 'oc-node');
      var leadChip = chip(
        i18n('role_lead'),
        text(board.goal) || i18n('no_goal_recorded'),
        boardFacts(board, filterMode === 'all' ? null : ownRows(n)),
        'oc-is-lead',
        null
      );
      var kids = el('div', 'oc-kids');
      var kidsBody = el('div', 'oc-kids-body');

      /* Wire the fold toggle button. The returned callback is passed to drawKids
         so that sub-lead toggles refresh the lead count label automatically. */
      var refreshParentLabel = foldControl(
        leadChip, kids, kidsBody, boardId,
        function () { return countVisibleRows(n, boardId); },
        null /* top-level lead; no parent to notify */
      );
      drawKids(n, kidsBody, now, refreshParentLabel, boardId);
      kids.appendChild(kidsBody);

      wrap.appendChild(leadChip);
      wrap.appendChild(kids);
      into.appendChild(wrap);
    }

    /* ---------------------------------------------------------------- *
     * THE CARDS                                                        *
     * ---------------------------------------------------------------- */
    /* One per WORKER SESSION, not one per task: the `spender` alias is what says two
       task rows were billed to the same worker, so a session serving three tasks gets
       ONE card showing its latest run and is billed once.
       "Latest" is by `last_report_at`, the worker's own last word -- not by a close
       stamp, which is the conductor's move and not the worker's. A session none of
       whose tasks ever reported falls back to its newest-started task, so it still
       gets a card and the card says the report is absent. */
    function cards(list, now) {
      var byWorker = {};
      var order = [];
      for (var b = 0; b < list.length; b++) {
        var board = list[b];
        for (var t = 0; t < board.tasks.length; t++) {
          var task = board.tasks[t];
          if (!task || typeof task !== 'object') continue;
          var who = text(task.spender);
          var key = who === null ? '\u0000unbound' : who;
          var row = byWorker[key];
          if (!row) {
            row = byWorker[key] = { worker: who, tasks: [], credits: 0, reported: false, boards: [] };
            order.push(key);
          }
          row.tasks.push({ task: task, board: board });
          var goal = text(board.goal) || text(board.id) || i18n('no_goal_short');
          if (row.boards.indexOf(goal) < 0) row.boards.push(goal);
          /* ONE figure per session, taken rather than summed: the fold repeats a
             session's spend on each of its task rows, and adding them would multiply
             one bill by the tasks it served. */
          var c = num(task.credits);
          if (c !== null && c > row.credits) row.credits = c;
          if (task.credits_reported === true) row.reported = true;
        }
      }
      var out = order.map(function (k) {
        var row = byWorker[k];
        var best = null, bestAt = null, fallback = null, fallbackAt = null;
        for (var i = 0; i < row.tasks.length; i++) {
          var pair = row.tasks[i];
          var at = stamp(pair.task.last_report_at);
          if (at !== null && (bestAt === null || at > bestAt)) { best = pair; bestAt = at; }
          var start = stamp(pair.task.created_at);
          if (start !== null && (fallbackAt === null || start > fallbackAt)) {
            fallback = pair; fallbackAt = start;
          }
        }
        row.latest = best || fallback || row.tasks[0];
        row.latestAt = bestAt;
        return row;
      });
      /* Newest word first: the worker a reader needs to look at is the one that just
         spoke or the one that just stopped. A session that never reported sorts last,
         because there is nothing about it to read. */
      out.sort(function (a, b) {
        if (a.latestAt === null) return 1;
        if (b.latestAt === null) return -1;
        return b.latestAt - a.latestAt;
      });
      return out;
    }

    function drawCard(row, now) {
      var pair = row.latest;
      var task = pair.task;
      var situ = situation(task, now);
      var colour = SITU[situ][1];
      var card = el('div', 'oc-card');
      card.style.borderLeftColor = colour;

      var top = el('div', 'oc-card-top');
      top.appendChild(el('b', null, row.worker === null
        ? i18n('not_bound')
        : i18n('role_worker') + ' ' + row.worker));
      var stat = el('span', 'oc-stat' + (situ === 'mute' ? ' oc-stat-mute' : ''), i18n(SITU[situ][0]));
      stat.style.color = colour;
      top.appendChild(stat);
      card.appendChild(top);

      /* THE REPLACEMENT FOR `quiet 24h`: what the worker said, not how long it has
         been since it said something. The old chip could only ever carry the second,
         and a reader seeing it still had to open the session to learn the first. */
      var said = oneLine(task.summary);
      if (said) {
        var line = el('div', 'oc-said', said);
        line.title = text(task.summary) || '';
        card.appendChild(line);
      } else if (row.latestAt === null) {
        card.appendChild(el('div', 'oc-said oc-none',
          i18n('never_reported_prefix')
          + (text(task.title) || text(task.item_id) || DASH) + '.'));
      } else {
        card.appendChild(el('div', 'oc-said oc-none',
          i18n('reported_no_summary')));
      }

      var facts = el('div', 'oc-facts');
      var title = el('span');
      title.appendChild(el('b', null, text(task.title) || text(task.item_id) || DASH));
      facts.appendChild(title);

      if (row.latestAt !== null) {
        var ago = el('span', (situ === 'idle' || situ === 'cold') ? 'oc-wait' : null,
          span(Math.max(0, now - row.latestAt)) + i18n('ago_suffix'));
        ago.title = i18n('last_report_prefix') + dayClock(row.latestAt) + ' UTC';
        facts.appendChild(ago);
      } else {
        facts.appendChild(el('span', 'oc-wait', i18n('no_report_stamped')));
      }

      facts.appendChild(el('span', null, row.reported
        ? row.credits.toFixed(2) + i18n('fact_credits')
        : DASH + i18n('credits_nobody')));

      var dur = num(task.duration_ms);
      if (dur) facts.appendChild(el('span', null, span(dur) + i18n('worked_suffix')));

      if (row.tasks.length > 1) {
        var more = el('span', null, row.tasks.length + i18n('tasks_on_session'));
        more.title = row.boards.join(' \u00b7 ');
        facts.appendChild(more);
      }
      var pr = text(task.pr) || (num(task.pr) !== null ? String(task.pr) : null);
      if (pr) facts.appendChild(el('span', null, i18n('pr_prefix') + pr));
      var verdict = text(task.verdict);
      if (verdict) {
        facts.appendChild(el('span', verdict === 'fail' ? 'oc-warn' : null,
          i18n('acceptance_prefix') + verdict));
      }
      if (situ === 'need') {
        facts.appendChild(el('span', 'oc-warn', text(task.status) === 'blocked'
          ? i18n('blocked_waiting')
          : i18n('asking_conductor')));
      }
      card.appendChild(facts);

      /* THE TWO LOOKUP KEYS A HOST NEEDS, and not a session key.
         The fold aliases a worker's session key on purpose: this document is embedded
         in a page any dashboard caller can read, and the ledger's rule is that no
         reader but the conductor sees one. So the card names the board and the item --
         the same pair group A's action route takes, resolved server-side against the
         fold -- and a host that wants to open the session resolves it from those.
         Printing an alias as if it were a link would be a dead link; printing the key
         would be the leak the fold exists to prevent. */
      var keys = el('div', 'oc-keys');
      keys.appendChild(document.createTextNode(i18n('open_via')));
      keys.appendChild(el('code', null,
        (text(pair.board.id) || DASH) + ' / ' + (text(task.item_id) || DASH)));
      keys.title = i18n('keys_title');
      card.appendChild(keys);
      return card;
    }

    /* ---------------------------------------------------------------- */
    function render() {
      applyStatic();
      var cells = document.body.querySelectorAll('[data-dashboard-field]');
      for (var c = 0; c < cells.length; c++) {
        if (!cells[c].textContent.trim()) cells[c].textContent = DASH;
      }
      var stampCell = document.querySelector('[data-dashboard-field="last_entry_at"]');
      if (stampCell) {
        var raw = (stampCell.textContent || '').trim();
        var rt = Date.parse(raw);
        if (raw && raw !== DASH && isFinite(rt)) stampCell.textContent = dayClock(rt) + ' UTC';
      }

      var graph = document.getElementById('oc-graph');
      var holder = document.getElementById('oc-cards');
      var cardsTitle = document.getElementById('oc-cards-t');
      var foot = document.getElementById('oc-foot');
      var scope = document.getElementById('oc-scope');
      if (!graph || !holder || !cardsTitle || !foot || !scope) return;
      /* The rebuild below replaces every fold button, so a reader who toggled one
         from the keyboard would land on the page body at each host push. Note which
         group's button had focus, and give focus to its replacement. */
      var focusKey = null;
      for (var fk in foldButtons) {
        if (Object.prototype.hasOwnProperty.call(foldButtons, fk)
            && foldButtons[fk] === document.activeElement) focusKey = fk;
      }
      foldButtons = {};
      graph.textContent = '';
      holder.textContent = '';
      foot.textContent = '';

      var list = boards();
      var cell = document.querySelector('[data-dashboard-field="items"]');
      if (cell) cell.textContent = String(list.length);
      var now = Date.now();
      syncFilter(list);

      if (!list.length) {
        graph.appendChild(el('div', 'oc-empty', i18n('empty_no_board')));
        cardsTitle.hidden = true;
        scope.textContent = DASH;
        return;
      }
      cardsTitle.hidden = false;

      var g = buildGraph(list);
      var roots = g.roots;
      var shown = list;
      if (filterMode !== 'all') {
        roots = pruneRoots(g.roots, filterMode);
        shown = filterBoards(list, filterMode);
      }
      var rows = cards(shown, now);
      /* Under a filter the empty line and the cards title go only when neither the
         graph nor the cards have a row: a filter can leave cards with no graph root
         to hang them on (a board whose parent task was cut from the fold). */
      if (filterMode !== 'all' && !roots.length && !rows.length) {
        graph.appendChild(el('div', 'oc-empty', i18n('filter_none_' + filterMode)));
        cardsTitle.hidden = true;
      }
      for (var i = 0; i < roots.length; i++) drawNode(roots[i], graph, now);
      if (focusKey !== null && Object.prototype.hasOwnProperty.call(foldButtons, focusKey)) {
        foldButtons[focusKey].focus({ preventScroll: true });
      }

      for (var j = 0; j < rows.length; j++) holder.appendChild(drawCard(rows[j], now));

      var subs = 0;
      if (filterMode === 'all') {
        for (var s in g.subOf) if (Object.prototype.hasOwnProperty.call(g.subOf, s)) subs++;
      } else {
        for (var r = 0; r < roots.length; r++) subs += countSubs(roots[r]);
        /* The footer counts the boards on the page, so it follows the filter. */
        if (cell) cell.textContent = String(roots.length + subs);
      }
      scope.textContent = roots.length + i18n('scope_leads') + MID + ' ' + subs + i18n('scope_subleads')
        + MID + ' ' + rows.length + i18n('scope_sessions')
        + (filterMode === 'all' ? '' : ' ' + MID + ' ' + i18n('scope_filtered'));

      /* The absences, said rather than left to be noticed. */
      var cut = 0;
      for (var b = 0; b < list.length; b++) cut += num(list[b].tasks_omitted) || 0;
      if (cut) {
        foot.appendChild(el('p', null, cut + i18n('foot_cut')));
      }
      var mute = 0;
      for (var m = 0; m < rows.length; m++) if (rows[m].latestAt === null) mute++;
      if (mute) {
        foot.appendChild(el('p', null, mute + i18n('foot_mute')));
      }
      foot.appendChild(el('p', null, i18n('foot_alias')));
    }

    /* In-memory map from board.id (alias) to expanded bool. Initialised on first
       drawNode call; survives message-event re-renders; resets on full page reload. */
    var foldState = {};
    /* The fold buttons the latest render drew, by the same key as foldState. */
    var foldButtons = {};

    wireFilter();
    render();
    window.addEventListener('load', render);
    window.addEventListener('message', function () { setTimeout(render, 0); });
  }());
  </script>
</div>
