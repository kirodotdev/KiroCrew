<div class="swl">
  <style>
    .swl { font: 12px/1.45 system-ui, sans-serif; color: var(--text, #e6e6e6); padding: 10px; }
    .swl h2 { font-size: 12px; font-weight: 600; margin: 0 0 6px; color: var(--text-strong, #fff); }
    .swl .goal { font-size: 13px; font-weight: 600; color: var(--text-strong, #fff); }
    .swl .meta { display: flex; flex-wrap: wrap; gap: 10px; font-size: 10.5px; color: var(--muted, #9aa); margin-top: 4px; }
    .swl .sub { font-size: 10px; color: var(--muted, #9aa); }

    .lane { margin-top: 10px; border: 1px solid var(--border, #333); border-radius: 14px; background: var(--card, #181818); overflow: hidden; }
    .lane .lh { display: flex; align-items: center; gap: 8px; padding: 7px 10px; background: color-mix(in oklab, var(--border, #333) 35%, transparent); }
    .lane .lh b { font-size: 11.5px; font-weight: 700; color: var(--text-strong, #fff); }
    .lane .lh span { font-size: 10px; color: var(--muted, #9aa); }
    .lane .lh .fill { margin-left: auto; display: flex; gap: 2px; width: 92px; height: 6px; border-radius: 3px; overflow: hidden; background: color-mix(in oklab, var(--border, #333) 60%, transparent); }
    .lane .lh .fill i { display: block; height: 100%; }

    .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(152px, 1fr)); gap: 7px; padding: 8px 10px 10px; }
    .col .ch { display: flex; align-items: baseline; gap: 5px; padding-bottom: 4px; border-bottom: 2px solid var(--border-strong, #444); }
    .col .ch b { font-size: 10.5px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; }
    .col .ch i { font-size: 10px; font-style: normal; color: var(--muted, #9aa); margin-left: auto; }

    .card { border: 1px solid var(--border, #333); border-radius: 9px; padding: 6px 8px; margin-top: 5px; background: var(--bg-elevated, #1f1f1f); }
    .card .id { font: 10px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted, #9aa); }
    .card .t { font-size: 11px; font-weight: 600; color: var(--text-strong, #fff); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .card .chip { font-size: 9.5px; font-weight: 600; padding: 0 6px; border-radius: 8px; background: var(--bg-hover, #222); color: var(--muted-strong, #889); }
    .card .quiet { font-size: 9.5px; color: var(--muted, #9aa); margin-top: 3px; }
    .card .quiet.late { color: var(--warn, #ffd230); }
    .none { font-size: 10px; color: var(--muted, #9aa); padding: 6px 0 2px; }
  </style>

  <h2 data-i18n="title">Swimlanes</h2>
  <div class="goal" data-dashboard-field="goal">-</div>
  <div class="meta">
    <span><span data-i18n="round">round</span> <span data-dashboard-field="round">-</span></span>
    <span><span data-i18n="depth">depth</span> <span data-dashboard-field="depth">-</span></span>
    <span><span data-i18n="entries">entries</span> <span data-dashboard-field="entries">-</span></span>
    <span><span data-i18n="generation">generation</span> <span data-dashboard-field="generation">-</span></span>
    <span><span data-i18n="last_write">last write</span> <span data-dashboard-field="last_entry_at">-</span></span>
  </div>

  <div id="lanes"></div>
  <div class="sub" style="margin-top: 7px;">
    <span data-dashboard-field="items">-</span> <span data-i18n="in_all_lanes">item(s) in all lanes,</span>
    <span data-dashboard-field="omitted">-</span> <span data-i18n="not_shown">not shown (list truncated)</span>
  </div>

  <script>
    (function () {
      var DASH = '\u2014';
      var QUIET_MS = 15 * 60 * 1000;

      // The page's own words, one table per UI language. A key a language lacks
      // falls back to English. Values the ledger or a crewmate wrote are never
      // looked up here. The zh-CN strings are \u-escaped so the source stays ASCII.
      var I18N = {
        en: {
          title: 'Swimlanes', round: 'round', depth: 'depth', entries: 'entries',
          generation: 'generation', last_write: 'last write',
          in_all_lanes: 'item(s) in all lanes,', not_shown: 'not shown (list truncated)',
          col_prog: 'In progress', col_await: 'Awaiting verdict', col_acc: 'Accepted',
          col_shut: 'Rejected or left',
          no_round: 'No round stamped', round_n: 'Round {n}', items_n: '{n} item(s)',
          fails: '{n} fail(s)', pr: 'PR {n}', worker_status: 'worker {v}',
          artifacts_n: '{n} artifact(s)',
          empty: 'No item on this board yet, so there is no lane to draw.'
        },
        'zh-CN': {
          title: '\u6cf3\u9053', round: '\u8f6e\u6b21', depth: '\u5c42\u7ea7', entries: '\u6761\u76ee',
          generation: '\u4ee3', last_write: '\u6700\u540e\u5199\u5165',
          in_all_lanes: '\u9879\u5728\u6240\u6709\u6cf3\u9053\u5185\uff0c', not_shown: '\u9879\u672a\u663e\u793a\uff08\u5217\u8868\u5df2\u622a\u65ad\uff09',
          col_prog: '\u8fdb\u884c\u4e2d', col_await: '\u5f85\u88c1\u5b9a', col_acc: '\u5df2\u63a5\u53d7',
          col_shut: '\u5df2\u62d2\u7edd\u6216\u79bb\u5f00',
          no_round: '\u672a\u6807\u6ce8\u8f6e\u6b21', round_n: '\u7b2c {n} \u8f6e', items_n: '{n} \u9879',
          fails: '{n} \u6b21\u5931\u8d25', pr: 'PR {n}', worker_status: '\u6267\u884c\u8005 {v}',
          artifacts_n: '{n} \u4e2a\u4ea7\u7269',
          empty: '\u770b\u677f\u4e0a\u8fd8\u6ca1\u6709\u4efb\u4f55\u4e8b\u9879\uff0c\u56e0\u6b64\u6ca1\u6709\u53ef\u7ed8\u5236\u7684\u6cf3\u9053\u3002'
        }
      };
      function locale() {
        var l = (window.kirocrew || {}).locale;
        return typeof l === 'string' && Object.prototype.hasOwnProperty.call(I18N, l) ? l : 'en';
      }
      function has(key) {
        return Object.prototype.hasOwnProperty.call(I18N.en, key);
      }
      function i18n(key, vars) {
        var table = I18N[locale()];
        var s = Object.prototype.hasOwnProperty.call(table, key) ? table[key] : I18N.en[key];
        if (s === undefined) s = key;
        if (vars) {
          s = s.replace(/\{(\w+)\}/g, function (m, k) {
            return Object.prototype.hasOwnProperty.call(vars, k) ? String(vars[k]) : m;
          });
        }
        return s;
      }
      function applyStatic() {
        var nodes = document.querySelectorAll('[data-i18n]');
        for (var i = 0; i < nodes.length; i++) nodes[i].textContent = i18n(nodes[i].getAttribute('data-i18n'));
      }

      // Four columns, in the order work moves through them. `await` exists because the
      // item a conductor opens this page to find -- a worker said done, nothing has
      // ruled on it -- is named by neither state nor status on its own.
      var COLUMNS = [
        ['prog', 'In progress', '#00d492'],
        ['await', 'Awaiting verdict', '#6aa9ff'],
        ['acc', 'Accepted', '#8ab4ff'],
        ['shut', 'Rejected or left', '#ff5c5c']
      ];

      function text(v) { return typeof v === 'string' && v.trim() ? v.trim() : null; }
      function num(v) { return typeof v === 'number' && isFinite(v) ? v : null; }
      function fields() { return (window.kirocrew || {}).fields || {}; }
      function items() {
        var v = fields().items;
        return Array.isArray(v) ? v.filter(function (e) { return e && typeof e === 'object'; }) : [];
      }
      function stamp(v) {
        var n = num(v);
        if (n !== null) return n;
        var s = text(v);
        if (!s) return null;
        var t = Date.parse(s);
        return isFinite(t) ? t : null;
      }
      function ago(ms) {
        var m = Math.floor(ms / 60000);
        if (m < 1) return 'under a minute';
        if (m < 60) return m + 'm';
        var h = Math.floor(m / 60);
        return h + 'h ' + (m % 60) + 'm';
      }
      function columnOf(it) {
        var state = text(it.state);
        if (state === 'accepted') return 'acc';
        if (state === 'rejected' || state === 'abandoned') return 'shut';
        // Still open. The worker's own last word decides, and `done` is a CLAIM the
        // conductor has not ruled on rather than a finish.
        if (text(it.status) === 'done') return 'await';
        return 'prog';
      }
      function colourOf(key) {
        for (var i = 0; i < COLUMNS.length; i++) if (COLUMNS[i][0] === key) return COLUMNS[i][2];
        return 'var(--muted-strong, #778)';
      }
      function chip(host, label, colour) {
        var el = document.createElement('span');
        el.className = 'chip';
        el.textContent = label;
        if (colour) el.style.color = colour;
        host.appendChild(el);
      }

      function card(it) {
        var el = document.createElement('div');
        el.className = 'card';
        var id = document.createElement('div');
        id.className = 'id';
        id.textContent = text(it.item_id) || DASH;
        el.appendChild(id);
        var t = document.createElement('div');
        t.className = 't';
        t.textContent = text(it.title) || DASH;
        el.appendChild(t);
        var chips = document.createElement('div');
        chips.className = 'chips';
        var verdict = text(it.verdict);
        if (verdict) chip(chips, verdict, verdict === 'pass' ? 'var(--ok, #35d07f)' : 'var(--danger, #ff5c5c)');
        var fails = num(it.fails);
        if (fails) chip(chips, i18n('fails', { n: fails }), 'var(--danger, #ff5c5c)');
        var pr = num(it.pr);
        if (pr) chip(chips, i18n('pr', { n: pr }), 'var(--info, #6aa9ff)');
        var status = text(it.status);
        if (status) chip(chips, i18n('worker_status', { v: status }), null);
        var spender = text(it.spender);
        if (spender) chip(chips, 'w' + spender, null);
        // An evidence pointer on the row itself, so a row that asserts also shows: an
        // artifact key named here is the thing a reader would otherwise have to ask for.
        var artifacts = it.artifacts && typeof it.artifacts === 'object' ? Object.keys(it.artifacts) : [];
        if (artifacts.length) chip(chips, i18n('artifacts_n', { n: artifacts.length }), null);
        if (chips.childNodes.length) el.appendChild(chips);

        var closed = stamp(it.closed_at);
        var last = stamp(it.last_report_at);
        var q = document.createElement('div');
        q.className = 'quiet';
        if (closed !== null) {
          var born = stamp(it.created_at);
          q.textContent = born !== null ? 'took ' + ago(closed - born) : 'closed';
        } else if (last !== null) {
          var silent = Date.now() - last;
          q.textContent = 'quiet ' + ago(silent);
          if (silent >= QUIET_MS) q.className = 'quiet late';
        } else {
          // Silence with no report at all is its own state and must not look like a
          // fresh one: a worker that never reported is the case nothing else surfaces.
          q.textContent = 'no report yet';
          q.className = 'quiet late';
        }
        el.appendChild(q);
        return el;
      }

      // A bound ISO stamp reaches its cell verbatim, and a full offset-bearing
      // timestamp in a meta row is three times the width of the fact it carries. The
      // cell is reformatted rather than the value replaced, so an unparseable stamp is
      // left exactly as the record wrote it instead of becoming an invalid date.
      function shortenStamps(names) {
        for (var i = 0; i < names.length; i++) {
          var cell = document.querySelector('[data-dashboard-field="' + names[i] + '"]');
          if (!cell) continue;
          var raw = (cell.textContent || '').trim();
          if (!raw || raw === DASH) continue;
          var t = Date.parse(raw);
          if (!isFinite(t)) continue;
          var d = new Date(t);
          cell.textContent =
            ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + d.getUTCDate()).slice(-2) +
            ' ' + ('0' + d.getUTCHours()).slice(-2) + ':' + ('0' + d.getUTCMinutes()).slice(-2) +
            ' UTC';
        }
      }

      function render() {
        applyStatic();
        var cells = document.body.querySelectorAll('[data-dashboard-field]');
        for (var c = 0; c < cells.length; c++) {
          if (!cells[c].textContent.trim()) cells[c].textContent = DASH;
        }
        shortenStamps(['last_entry_at']);
        var list = items();
        var host = document.getElementById('lanes');
        if (!host) return;
        host.textContent = '';

        var byRound = {};
        var order = [];
        for (var i = 0; i < list.length; i++) {
          var r = num(list[i].round);
          var key = r === null ? 'none' : String(r);
          if (!byRound[key]) { byRound[key] = []; order.push(key); }
          byRound[key].push(list[i]);
        }
        order.sort(function (x, y) {
          if (x === 'none') return 1;
          if (y === 'none') return -1;
          return Number(y) - Number(x);
        });

        for (var g = 0; g < order.length; g++) {
          var key2 = order[g];
          var group = byRound[key2];
          var lane = document.createElement('div');
          lane.className = 'lane';

          var lh = document.createElement('div');
          lh.className = 'lh';
          var b = document.createElement('b');
          b.textContent = key2 === 'none' ? i18n('no_round') : i18n('round_n', { n: key2 });
          lh.appendChild(b);
          var cnt = document.createElement('span');
          cnt.textContent = i18n('items_n', { n: group.length });
          lh.appendChild(cnt);

          var buckets = { prog: [], await: [], acc: [], shut: [] };
          for (var j = 0; j < group.length; j++) buckets[columnOf(group[j])].push(group[j]);

          var fill = document.createElement('div');
          fill.className = 'fill';
          for (var s = 0; s < COLUMNS.length; s++) {
            var n = buckets[COLUMNS[s][0]].length;
            if (!n) continue;
            var seg = document.createElement('i');
            seg.style.background = COLUMNS[s][2];
            seg.style.width = ((n / group.length) * 100) + '%';
            fill.appendChild(seg);
          }
          lh.appendChild(fill);
          lane.appendChild(lh);

          var cols = document.createElement('div');
          cols.className = 'cols';
          for (var k = 0; k < COLUMNS.length; k++) {
            var ckey = COLUMNS[k][0];
            var col = document.createElement('div');
            col.className = 'col';
            var ch = document.createElement('div');
            ch.className = 'ch';
            ch.style.borderBottomColor = COLUMNS[k][2];
            var cb = document.createElement('b');
            cb.textContent = i18n('col_' + COLUMNS[k][0]);
            cb.style.color = COLUMNS[k][2];
            ch.appendChild(cb);
            var ci = document.createElement('i');
            ci.textContent = String(buckets[ckey].length);
            ch.appendChild(ci);
            col.appendChild(ch);
            for (var m = 0; m < buckets[ckey].length; m++) col.appendChild(card(buckets[ckey][m]));
            if (!buckets[ckey].length) {
              var none = document.createElement('div');
              none.className = 'none';
              none.textContent = DASH;
              col.appendChild(none);
            }
            cols.appendChild(col);
          }
          lane.appendChild(cols);
          host.appendChild(lane);
        }

        if (!order.length) {
          var empty = document.createElement('div');
          empty.className = 'none';
          empty.textContent = i18n('empty');
          host.appendChild(empty);
        }

        var cell = document.querySelector('[data-dashboard-field="items"]');
        if (cell) cell.textContent = String(list.length);
        if (colourOf('prog') === undefined) return;
      }

      render();
      window.addEventListener('load', render);
      window.addEventListener('message', function () { setTimeout(render, 0); });
    }());
  </script>
</div>
