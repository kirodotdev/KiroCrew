<div class="sup">
  <style>
    .sup { font: 12px/1.45 system-ui, sans-serif; color: var(--text, #e6e6e6); padding: 10px; }
    .sup h2 { font-size: 12px; font-weight: 600; margin: 0 0 6px; color: var(--text-strong, #fff); }
    .sup .goal { font-size: 13px; font-weight: 600; color: var(--text-strong, #fff); }
    .sup .meta { display: flex; flex-wrap: wrap; gap: 10px; font-size: 10.5px; color: var(--muted, #9aa); margin-top: 4px; }
    .sup .sub { font-size: 10px; color: var(--muted, #9aa); }
    .sup .wrote { font-size: 9.5px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--muted-strong, #778); border: 1px solid var(--border, #333); border-radius: 8px; padding: 0 5px; }

    .head { margin: 9px 0 0; padding: 9px 11px; border: 1px solid var(--border, #333); border-radius: 12px; background: color-mix(in oklab, #00d492 6%, var(--card, #181818)); }
    .head .say { font-size: 12.5px; font-weight: 600; color: var(--text-strong, #fff); }
    .head .who { margin-top: 3px; }

    .quiet { margin-top: 7px; padding: 6px 10px; border: 1px solid var(--border, #333); border-left: 3px solid var(--warn, #ffd230); border-radius: 8px; font-size: 11px; color: var(--muted-strong, #889); }

    .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; margin-top: 10px; }
    .col { border: 1px solid var(--border, #333); border-radius: 14px; padding: 8px 10px; background: var(--card, #181818); }
    .col .ch { display: flex; align-items: baseline; gap: 6px; }
    .col .ch b { font-size: 11px; font-weight: 600; color: var(--text-strong, #fff); }
    .col .ch i { font-size: 18px; font-weight: 700; font-style: normal; margin-left: auto; }
    .col .ch u { font-size: 10px; color: var(--muted, #9aa); text-decoration: none; }
    .col .row { font-size: 11px; color: var(--text, #e6e6e6); margin-top: 5px; padding-left: 8px; border-left: 2px solid var(--border-strong, #444); }
    .col .row span { display: block; font-size: 10px; color: var(--muted, #9aa); }
    .col u { display: block; font-size: 10px; text-decoration: none; color: var(--muted, #9aa); margin-top: 1px; }

    .spark { display: flex; align-items: flex-end; gap: 3px; height: 28px; max-width: 320px; margin: 8px 0 4px; }
    .spark i { display: block; flex: 1 1 0; max-width: 16px; min-width: 3px; border-radius: 2px 2px 0 0; background: var(--accent, #00d492); opacity: .8; }

    .feed { margin-top: 5px; }
    .mom { display: flex; gap: 8px; font-size: 11px; padding: 3px 0; border-bottom: 1px solid color-mix(in oklab, var(--border, #333) 55%, transparent); }
    .mom b { font-weight: 600; color: var(--text-strong, #fff); min-width: 108px; }
    .mom span { color: var(--muted, #9aa); }
  </style>

  <h2 data-i18n="title">Standup</h2>
  <div class="goal" data-dashboard-field="goal">-</div>
  <div class="meta">
    <span><span data-i18n="round">round</span> <span data-dashboard-field="round">-</span></span>
    <span><span data-i18n="turns">turns</span> <span data-dashboard-field="turns_completed">-</span></span>
    <span><span data-i18n="last_board_write">last board write</span> <span data-dashboard-field="last_entry_at">-</span></span>
    <span><span data-i18n="last_ledger_write">last ledger write</span> <span data-dashboard-field="last_progress_at">-</span></span>
  </div>

  <div class="head">
    <div class="say" data-dashboard-field="headline">-</div>
    <div class="who"><span class="wrote" id="wrote"></span></div>
  </div>

  <div id="quiet"></div>

  <div class="cols" id="cols"></div>

  <div class="meta" style="margin-top: 11px;">
    <span style="font-weight: 600; color: var(--text-strong, #fff);" data-i18n="turns_newest_last">Turns, newest last</span>
    <span><span data-i18n="entry">entry</span> <span data-dashboard-field="last_seq">-</span></span>
    <span><span data-i18n="asks_waiting">asks waiting</span> <span data-dashboard-field="approvals_pending">-</span></span>
  </div>
  <div class="spark" id="spark"></div>
  <div class="feed" id="feed"></div>
  <div class="sub" style="margin-top: 5px;">
    <span data-dashboard-field="moments">-</span> <span data-i18n="moments_kept">moment(s) kept,</span>
    <span data-dashboard-field="moments_dropped">-</span> <span data-i18n="dropped_truncated">dropped (feed truncated).</span>
    <span data-i18n="clock_read_at">Clock read at</span> <span data-dashboard-field="last_time">-</span>.
  </div>
  <div class="sub">
    <span data-dashboard-field="items">-</span> <span data-i18n="items_on_board">item(s) on the board,</span>
    <span data-dashboard-field="omitted">-</span> <span data-i18n="not_shown_standup">not shown.</span>
  </div>

  <script>
    (function () {
      var DASH = '\u2014';
      var QUIET_MS = 15 * 60 * 1000;

      // The page's own words, one table per UI language. A key a language lacks falls
      // back to English. Values the record or a crewmate wrote are never looked up
      // here. The zh-CN strings are \u-escaped so the source stays ASCII.
      var I18N = {
        en: {
          title: 'Standup', round: 'round', turns: 'turns',
          last_board_write: 'last board write', last_ledger_write: 'last ledger write',
          turns_newest_last: 'Turns, newest last', entry: 'entry', asks_waiting: 'asks waiting',
          moments_kept: 'moment(s) kept,', dropped_truncated: 'dropped (feed truncated).',
          clock_read_at: 'Clock read at', items_on_board: 'item(s) on the board,',
          not_shown_standup: 'not shown.',
          col_done_t: 'Finished', col_done_c: 'items the conductor accepted',
          col_await_t: 'Claimed done', col_await_c: 'waiting on the conductor\u2019s own verdict',
          col_new_t: 'Still moving', col_new_c: 'open, nobody reported a blocker',
          col_stuck_t: 'Stuck', col_stuck_c: 'blocked, asking, rejected or failed',
          quiet_for: 'quiet {t}', no_report: 'no report yet', worker_prefix: 'worker {v} \u00b7 ',
          more_not_listed: '{n} more not listed', under_a_minute: 'under a minute',
          turn_n: 'turn {n}', credits_suffix: ' credits',
          feed_nothing: 'nothing yet',
          feed_none_desc: 'the timeline fold has no moment for this session',
          quiet_unknown: 'No write time on the record, so this page cannot say whether anything is still moving.',
          quiet_band: 'No new entry for {t}. Nothing has written to the record since.',
          wrote: 'crewmate wrote this', no_headline: 'no headline written'
        },
        'zh-CN': {
          title: '\u7ad9\u4f1a', round: '\u8f6e\u6b21', turns: '\u56de\u5408',
          last_board_write: '\u770b\u677f\u6700\u540e\u5199\u5165', last_ledger_write: '\u8d26\u672c\u6700\u540e\u5199\u5165',
          turns_newest_last: '\u56de\u5408\uff0c\u6700\u65b0\u5728\u540e', entry: '\u6761\u76ee', asks_waiting: '\u7b49\u5f85\u7684\u8bf7\u6c42',
          moments_kept: '\u4e2a\u7247\u6bb5\u5df2\u4fdd\u7559\uff0c', dropped_truncated: '\u4e2a\u88ab\u4e22\u5f03\uff08\u4fe1\u606f\u6d41\u5df2\u622a\u65ad\uff09\u3002',
          clock_read_at: '\u65f6\u949f\u8bfb\u6570\u4e8e', items_on_board: '\u4e2a\u4e8b\u9879\u5728\u770b\u677f\u4e0a\uff0c',
          not_shown_standup: '\u4e2a\u672a\u663e\u793a\u3002',
          col_done_t: '\u5df2\u5b8c\u6210', col_done_c: '\u6307\u6325\u8005\u5df2\u63a5\u53d7\u7684\u4e8b\u9879',
          col_await_t: '\u81ea\u79f0\u5b8c\u6210', col_await_c: '\u7b49\u5f85\u6307\u6325\u8005\u81ea\u5df1\u7684\u88c1\u5b9a',
          col_new_t: '\u4ecd\u5728\u63a8\u8fdb', col_new_c: '\u8fdb\u884c\u4e2d\uff0c\u65e0\u4eba\u62a5\u544a\u963b\u788d',
          col_stuck_t: '\u5361\u4f4f', col_stuck_c: '\u53d7\u963b\u3001\u8be2\u95ee\u3001\u88ab\u62d2\u6216\u5931\u8d25',
          quiet_for: '\u5b89\u9759 {t}', no_report: '\u5c1a\u65e0\u62a5\u544a', worker_prefix: '\u6267\u884c\u8005 {v} \u00b7 ',
          more_not_listed: '\u53e6\u6709 {n} \u4e2a\u672a\u5217\u51fa', under_a_minute: '\u4e0d\u5230\u4e00\u5206\u949f',
          turn_n: '\u7b2c {n} \u8f6e', credits_suffix: ' \u989d\u5ea6',
          feed_nothing: '\u8fd8\u6ca1\u6709',
          feed_none_desc: '\u6b64\u4f1a\u8bdd\u5728\u65f6\u95f4\u7ebf\u6298\u53e0\u4e2d\u6ca1\u6709\u4efb\u4f55\u7247\u6bb5',
          quiet_unknown: '\u8bb0\u5f55\u4e2d\u6ca1\u6709\u5199\u5165\u65f6\u95f4\uff0c\u56e0\u6b64\u672c\u9875\u65e0\u6cd5\u5224\u65ad\u662f\u5426\u8fd8\u6709\u8fdb\u5c55\u3002',
          quiet_band: '\u5df2\u6709 {t} \u6ca1\u6709\u65b0\u6761\u76ee\u3002\u6b64\u540e\u6ca1\u6709\u4efb\u4f55\u5185\u5bb9\u5199\u5165\u8bb0\u5f55\u3002',
          wrote: '\u961f\u53cb\u5199\u5165', no_headline: '\u672a\u5199\u5165\u8981\u70b9'
        }
      };
      function locale() {
        var l = (window.kirocrew || {}).locale;
        return typeof l === 'string' && Object.prototype.hasOwnProperty.call(I18N, l) ? l : 'en';
      }
      function has(key) {
        return Object.prototype.hasOwnProperty.call(I18N.en, key);
      }
      function i18n(key, vars) {
        var table = I18N[locale()];
        var s = Object.prototype.hasOwnProperty.call(table, key) ? table[key] : I18N.en[key];
        if (s === undefined) s = key;
        if (vars) {
          s = s.replace(/\{(\w+)\}/g, function (m, k) {
            return Object.prototype.hasOwnProperty.call(vars, k) ? String(vars[k]) : m;
          });
        }
        return s;
      }
      function applyStatic() {
        var nodes = document.querySelectorAll('[data-i18n]');
        for (var i = 0; i < nodes.length; i++) nodes[i].textContent = i18n(nodes[i].getAttribute('data-i18n'));
      }

      function text(v) { return typeof v === 'string' && v.trim() ? v.trim() : null; }
      function num(v) { return typeof v === 'number' && isFinite(v) ? v : null; }
      function bag() { return window.kirocrew || {}; }
      function fields() { return bag().fields || {}; }
      function arr(name) {
        var v = fields()[name];
        return Array.isArray(v) ? v.filter(function (e) { return e && typeof e === 'object'; }) : [];
      }
      function ago(ms) {
        if (ms === null || ms < 0) return null;
        var m = Math.floor(ms / 60000);
        if (m < 1) return i18n('under_a_minute');
        if (m < 60) return m + 'm';
        var h = Math.floor(m / 60);
        return h + 'h ' + (m % 60) + 'm';
      }
      function stamp(v) {
        var n = num(v);
        if (n !== null) return n;
        var s = text(v);
        if (!s) return null;
        var t = Date.parse(s);
        return isFinite(t) ? t : null;
      }

      // The three buckets, each a question a reader actually asks. `stuck` is
      // deliberately widened past the ledger's own `blocked` state: a worker whose
      // last word was `blocked` or `question`, and an item carrying a failed
      // acceptance, are all things not moving, and only one of them is a state.
      function bucket(it) {
        var state = text(it.state);
        var status = text(it.status);
        if (state === 'accepted') return 'done';
        if (state === 'rejected' || state === 'abandoned') return 'stuck';
        if (status === 'blocked' || status === 'question') return 'stuck';
        if (num(it.fails)) return 'stuck';
        if (text(it.verdict) === 'fail') return 'stuck';
        if (status === 'done') return 'await';
        return 'new';
      }

      var COLS = [
        ['done', 'Finished', 'items the conductor accepted', 'var(--ok, #35d07f)'],
        ['await', 'Claimed done', 'waiting on the conductor\u2019s own verdict', 'var(--info, #6aa9ff)'],
        ['new', 'Still moving', 'open, nobody reported a blocker', 'var(--accent, #00d492)'],
        ['stuck', 'Stuck', 'blocked, asking, rejected or failed', 'var(--danger, #ff5c5c)']
      ];

      function drawCols(items) {
        var host = document.getElementById('cols');
        if (!host) return;
        host.textContent = '';
        var by = { done: [], await: [], new: [], stuck: [] };
        for (var i = 0; i < items.length; i++) by[bucket(items[i])].push(items[i]);
        for (var c = 0; c < COLS.length; c++) {
          var key = COLS[c][0];
          var list = by[key];
          var col = document.createElement('div');
          col.className = 'col';
          var ch = document.createElement('div');
          ch.className = 'ch';
          var b = document.createElement('b');
          b.textContent = i18n('col_' + key + '_t');
          var i2 = document.createElement('i');
          i2.textContent = items.length ? String(list.length) : DASH;
          i2.style.color = COLS[c][3];
          ch.appendChild(b);
          ch.appendChild(i2);
          col.appendChild(ch);
          var u = document.createElement('u');
          u.textContent = i18n('col_' + key + '_c');
          col.appendChild(u);
          // Three rows at most per column: a reader skimming four columns wants the
          // names, and a column that lists thirty is a board, not a standup.
          for (var j = 0; j < list.length && j < 3; j++) {
            var row = document.createElement('div');
            row.className = 'row';
            row.textContent = text(list[j].title) || text(list[j].item_id) || DASH;
            var sub = document.createElement('span');
            var quiet = ago(Date.now() - (stamp(list[j].last_report_at) || 0));
            var when = stamp(list[j].last_report_at) ? i18n('quiet_for', { t: quiet }) : i18n('no_report');
            var who = text(list[j].spender) ? i18n('worker_prefix', { v: text(list[j].spender) }) : '';
            sub.textContent = who + when;
            row.appendChild(sub);
            col.appendChild(row);
          }
          if (list.length > 3) {
            var more = document.createElement('u');
            more.textContent = i18n('more_not_listed', { n: list.length - 3 });
            col.appendChild(more);
          }
          host.appendChild(col);
        }
      }

      function drawFeed(moments) {
        var feed = document.getElementById('feed');
        var spark = document.getElementById('spark');
        if (!feed || !spark) return;
        feed.textContent = '';
        spark.textContent = '';
        // One bar per completed turn, height by its duration. The feed below names
        // the turn; the bars say whether the pace changed, which the names cannot.
        var durations = [];
        for (var i = 0; i < moments.length; i++) {
          var d = num(moments[i].duration_ms);
          if (d !== null) durations.push(d);
        }
        var max = 0;
        for (var k = 0; k < durations.length; k++) if (durations[k] > max) max = durations[k];
        for (var b = 0; b < durations.length; b++) {
          var bar = document.createElement('i');
          bar.style.height = (max ? Math.max(8, (durations[b] / max) * 100) : 8) + '%';
          spark.appendChild(bar);
        }
        if (!durations.length) {
          var flat = document.createElement('i');
          flat.style.height = '4%';
          flat.style.opacity = '.3';
          spark.appendChild(flat);
        }
        var tail = moments.slice(Math.max(0, moments.length - 6));
        for (var m = 0; m < tail.length; m++) {
          var mo = tail[m];
          var row = document.createElement('div');
          row.className = 'mom';
          var what = document.createElement('b');
          what.textContent = text(mo.type) || DASH;
          row.appendChild(what);
          var say = document.createElement('span');
          var bits = [];
          if (num(mo.turn) !== null) bits.push(i18n('turn_n', { n: num(mo.turn) }));
          var dur = num(mo.duration_ms);
          if (dur !== null) bits.push((dur / 1000).toFixed(1) + 's');
          var cr = num(mo.credits);
          if (cr !== null) bits.push(cr.toFixed(2) + i18n('credits_suffix'));
          var sr = text(mo.stop_reason);
          if (sr) bits.push(sr);
          var tool = text(mo.tool);
          if (tool) bits.push(tool);
          say.textContent = bits.length ? bits.join(' \u00b7 ') : DASH;
          row.appendChild(say);
          feed.appendChild(row);
        }
        if (!tail.length) {
          var none = document.createElement('div');
          none.className = 'mom';
          var nb = document.createElement('b');
          nb.textContent = i18n('feed_nothing');
          none.appendChild(nb);
          var ns = document.createElement('span');
          ns.textContent = i18n('feed_none_desc');
          none.appendChild(ns);
          feed.appendChild(none);
        }
      }

      function drawQuiet(f) {
        var host = document.getElementById('quiet');
        if (!host) return;
        host.textContent = '';
        // Silence, not work time. A reader who restarts the gateway cannot otherwise
        // tell a crewmate that is thinking from one that died, and the two look the
        // same on every other element of this page.
        var last = stamp(f.last_time) || stamp(f.last_entry_at) || stamp(f.last_progress_at);
        if (last === null) {
          var unk = document.createElement('div');
          unk.className = 'quiet';
          unk.textContent = i18n('quiet_unknown');
          host.appendChild(unk);
          return;
        }
        var silent = Date.now() - last;
        if (silent < QUIET_MS) return;
        var band = document.createElement('div');
        band.className = 'quiet';
        band.textContent = i18n('quiet_band', { t: ago(silent) });
        host.appendChild(band);
      }

      // A bound ISO stamp reaches its cell verbatim, and a full offset-bearing
      // timestamp in a meta row is three times the width of the fact it carries. The
      // cell is reformatted rather than the value replaced, so an unparseable stamp is
      // left exactly as the record wrote it instead of becoming an invalid date.
      function shortenStamps(names) {
        for (var i = 0; i < names.length; i++) {
          var cell = document.querySelector('[data-dashboard-field="' + names[i] + '"]');
          if (!cell) continue;
          var raw = (cell.textContent || '').trim();
          if (!raw || raw === DASH) continue;
          var t = Date.parse(raw);
          if (!isFinite(t)) continue;
          var d = new Date(t);
          cell.textContent =
            ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + d.getUTCDate()).slice(-2) +
            ' ' + ('0' + d.getUTCHours()).slice(-2) + ':' + ('0' + d.getUTCMinutes()).slice(-2) +
            ' UTC';
        }
      }

      function render() {
        var f = fields();
        applyStatic();
        var cells = document.body.querySelectorAll('[data-dashboard-field]');
        for (var c = 0; c < cells.length; c++) {
          if (!cells[c].textContent.trim()) cells[c].textContent = DASH;
        }
        shortenStamps(['last_entry_at', 'last_progress_at']);
        var items = arr('items');
        var moments = arr('moments');
        drawCols(items);
        drawFeed(moments);
        drawQuiet(f);

        // The mark is the host's own ARRAY of names (dashboard_frame.read_payload sorts
        // a list into `agentic`), so membership is the question. Asking an array for a
        // property named 'headline' answers no on every render, which would label a
        // written headline as one nobody wrote.
        var wrote = document.getElementById('wrote');
        if (wrote) {
          var agentic = bag().agentic;
          var marked = Array.isArray(agentic) && agentic.indexOf('headline') !== -1;
          wrote.textContent = marked ? i18n('wrote') : i18n('no_headline');
        }

        var counts = { items: items.length, moments: moments.length };
        for (var key in counts) {
          if (!Object.prototype.hasOwnProperty.call(counts, key)) continue;
          var cell = document.querySelector('[data-dashboard-field="' + key + '"]');
          if (cell) cell.textContent = String(counts[key]);
        }
        var clock = document.querySelector('[data-dashboard-field="last_time"]');
        var t = stamp(f.last_time);
        if (clock && t !== null) clock.textContent = new Date(t).toISOString().replace('T', ' ').slice(0, 19) + ' UTC';
      }

      render();
      window.addEventListener('load', render);
      window.addEventListener('message', function () { setTimeout(render, 0); });
    }());
  </script>
</div>
