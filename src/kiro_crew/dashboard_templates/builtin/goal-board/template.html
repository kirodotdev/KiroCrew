<div class="board">
  <style>
    .board { font: 12px/1.45 system-ui, sans-serif; color: var(--text, #e6e6e6); padding: 10px; }
    .board h2 { font-size: 12px; font-weight: 600; margin: 0 0 6px; color: var(--text-strong, #fff); }
    .board .goal { font-size: 13px; font-weight: 600; color: var(--text-strong, #fff); }
    .board .meta { display: flex; flex-wrap: wrap; gap: 10px; font-size: 10.5px; color: var(--muted, #9aa); margin-top: 4px; }
    .board .sub { font-size: 10px; color: var(--muted, #9aa); }
    .states { display: flex; gap: 2px; height: 8px; border-radius: 4px; overflow: hidden; margin: 9px 0 5px; background: var(--bg-hover, #222); }
    .states i { display: block; height: 100%; transform-origin: left; }
    .states.grow i { animation: gb-grow .9s cubic-bezier(.2,.8,.2,1) both; }
    .done { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-top: 9px; font-size: 11px; color: var(--muted, #9aa); }
    .done b { color: var(--text-strong, #fff); font-weight: 600; }
    .band { border: 1px solid var(--warn, #ffd230); border-left-width: 4px; border-radius: 8px; padding: 7px 9px; margin-top: 9px;
      background: var(--warn-subtle, rgba(255, 210, 48, .12)); animation: gb-glow 2.6s ease-in-out 3; }
    .band .k { color: var(--warn, #ffd230); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
    .band .v { margin-top: 2px; overflow-wrap: anywhere; color: var(--text-strong, #fff); }
    .band .q { margin-top: 1px; overflow-wrap: anywhere; color: var(--text, #e6e6e6); }
    .band .hint { margin-top: 1px; font-size: 10px; color: var(--muted, #9aa); }
    .band .acts { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0 6px; }
    .band button { font: inherit; font-size: 10.5px; padding: 2px 9px; border-radius: 6px; cursor: pointer;
      border: 1px solid var(--border-strong, #555); background: var(--bg-elevated, #1a1a1a); color: var(--text, #e6e6e6); overflow-wrap: anywhere; text-align: left; }
    .band button.reply { border-color: var(--warn, #ffd230); color: var(--text-strong, #fff); font-weight: 600; }
    .band button:hover { background: var(--bg-hover, #222); }
    .chips button.prlink { font: inherit; font-size: 10px; font-weight: 600; cursor: pointer; text-decoration: underline; }
    .chips button.prlink:focus-visible { outline: 2px solid var(--accent, #00d492); outline-offset: 1px; }
    .band button:focus-visible { outline: 2px solid var(--accent, #00d492); outline-offset: 1px; }
    .calm { margin-top: 9px; font-size: 10.5px; color: var(--muted, #9aa); }
    .calm::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok, #00d492); margin-right: 6px; }
    .tally { display: flex; flex-wrap: wrap; gap: 9px; font-size: 10.5px; color: var(--muted, #9aa); }
    .tally b { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
    .item { position: relative; overflow: hidden; border: 1px solid var(--border, #333); border-top: 3px solid var(--tone, var(--border, #333));
      border-radius: 8px; padding: 8px 9px; margin-top: 6px; }
    .item.pop { animation: gb-pop .42s cubic-bezier(.2,1.4,.4,1) both; }
    .item.you { background: var(--warn-subtle, rgba(255, 210, 48, .12)); }
    .item.live::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent, #00d492), transparent); transform: translateX(-100%); animation: gb-shimmer 1.4s linear infinite; }
    .item .t { font-weight: 600; color: var(--text-strong, #fff); overflow-wrap: anywhere; }
    .item .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
    .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 9px; background: var(--bg-hover, #222); }
    .chip.pill { color: var(--tone); border: 1px solid var(--tone); background: color-mix(in srgb, var(--tone) 12%, transparent); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: gb-blink 1.1s ease-in-out infinite; }
    .item .line { font-size: 10.5px; color: var(--muted, #9aa); margin-top: 4px; }
    .item .line em { color: var(--text, #e6e6e6); font-style: normal; overflow-wrap: anywhere; }
    .talk { margin-top: 4px; }
    .talk .tg { font: inherit; font-size: 10.5px; padding: 0; margin-top: 3px; border: 0; background: none; cursor: pointer;
      color: var(--info, #6aa9ff); text-decoration: underline; }
    .talk .tg:focus-visible, .talk .thread:focus-visible { outline: 2px solid var(--accent, #00d492); outline-offset: 1px; }
    .talk .panel { margin-top: 4px; padding: 5px 8px; border-left: 2px solid var(--info, #6aa9ff); border-radius: 4px; background: var(--bg-hover, #222); }
    .talk .sh { margin-top: 5px; font-size: 10px; font-weight: 700; letter-spacing: .04em; color: var(--muted, #9aa); }
    .talk .sh:first-child { margin-top: 0; }
    .talk ul { margin: 1px 0 0; padding-left: 15px; }
    .talk li { overflow-wrap: anywhere; color: var(--text, #e6e6e6); }
    .talk li b { color: var(--text-strong, #fff); font-weight: 600; }
    .talk .thread { font: inherit; font-size: 10.5px; margin-top: 6px; padding: 1px 8px; border-radius: 6px; cursor: pointer;
      border: 1px solid var(--info, #6aa9ff); background: var(--bg-elevated, #1a1a1a); color: var(--text-strong, #fff); }
    .fold { margin-top: 6px; }
    .fold .fold-tg { font: inherit; font-size: 11px; width: 100%; text-align: left; cursor: pointer; padding: 6px 9px;
      border: 1px dashed var(--border, #333); border-radius: 8px; background: none; color: var(--muted, #9aa); }
    .fold .fold-tg:hover { background: var(--bg-hover, #222); }
    .fold .fold-tg:focus-visible { outline: 2px solid var(--accent, #00d492); outline-offset: 1px; }
    .fold .caret { display: inline-block; width: 1em; }
    .fold .fold-new { margin-top: 3px; padding-left: 9px; font-size: 10.5px; color: var(--text, #e6e6e6); overflow-wrap: anywhere; }
    .fold.pulse .fold-tg { border-color: var(--border-strong, #555); animation: gb-glow 2.6s ease-in-out 2; }
    .nest { margin-top: 6px; padding-left: 8px; border-left: 2px solid var(--border, #333); }
    .nest .nh { font-size: 10.5px; color: var(--muted, #9aa); }
    .nest .row { margin-top: 5px; }
    .nest .row .rt { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; color: var(--text-strong, #fff); overflow-wrap: anywhere; }
    @keyframes gb-pop { from { opacity: 0; transform: translateY(6px) scale(.96); } to { opacity: 1; transform: none; } }
    @keyframes gb-grow { from { transform: scaleX(0); } to { transform: none; } }
    @keyframes gb-shimmer { to { transform: translateX(100%); } }
    @keyframes gb-blink { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
    @keyframes gb-glow { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 50% { box-shadow: 0 0 0 4px var(--warn-subtle, rgba(255, 210, 48, .22)); } }
    /* Every animation above is decoration: with motion off the page reads the same. */
    @media (prefers-reduced-motion: reduce) {
      .board *, .board *::before, .board *::after { animation: none !important; transition: none !important; }
    }
  </style>

          if (head) {
            var b = document.createElement('b');
            b.textContent = head;
            li.appendChild(b);
            if (rest) li.appendChild(document.createTextNode(': '));
          }
          if (rest) li.appendChild(document.createTextNode(rest));
          ul.appendChild(li);
        }
        if (!ul.children.length) return;
        var h = document.createElement('div');
        h.className = 'sh';
        h.textContent = i18n(key);
        host.appendChild(h);
        host.appendChild(ul);
      }
      // Which items' discussion panels the reader opened, kept across refills.
      var talkOpen = {};
      // The discussing row's counts, and behind a toggle what the discussion holds.
      // A question for the reader is not drawn here: it is the needs-you band's.
      function drawTalk(card, it, id) {
        var d = discussionOf(it);
        if (!d) return;
        var agreed = listOf(d.agreed), disputed = listOf(d.disputed);
        var checking = listOf(d.checking), recent = listOf(d.recent);
        var phase = text(d.phase);
        var box = document.createElement('div');
        box.className = 'talk';
        var head = document.createElement('div');
        head.className = 'line';
        head.textContent = i18n('talk_counts', {
          a: agreed.length, d: disputed.length, c: checking.length, q: needsYou(it) ? 1 : 0
        }) + ' \u00b7 ' + i18n('talk_meta', {
          p: has('phase_' + phase) ? i18n('phase_' + phase) : phase, r: num(d.round) || 0, m: num(d.minutes) || 0
        });
        box.appendChild(head);
        var panel = document.createElement('div');
        panel.className = 'panel';
        panel.id = 'gb-talk-' + id.replace(/[^A-Za-z0-9_-]/g, '_');
        var toggle = button('', 'tg', null);
        toggle.setAttribute('aria-controls', panel.id);
        function show(open) {
          talkOpen[id] = open;
          panel.hidden = !open;
          toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
          toggle.textContent = i18n(open ? 'talk_hide' : 'talk_show');
        }
        toggle.addEventListener('click', function () { show(!talkOpen[id]); });
        var direction = text(d.direction);
        talkSection(panel, 'talk_direction', direction ? [direction] : []);
        talkSection(panel, 'talk_agreed', agreed);
        talkSection(panel, 'talk_disputed', disputed.map(function (x) {
          return x && typeof x === 'object' ? [x.point, x.sides] : null;
        }));
        talkSection(panel, 'talk_checking', checking);
        talkSection(panel, 'talk_recent', recent.map(function (x) {
          return x && typeof x === 'object' ? [x.who, x.text] : null;
        }));
        var thread = text(d.thread);
        if (thread && thread.length <= 2048 && LINKABLE.test(thread)) {
          var tb = button(i18n('talk_thread'), 'thread', null);
          tb.title = i18n('talk_thread_title', { v: thread });
          tb.addEventListener('click', function () { openLink(thread); });
          panel.appendChild(tb);
        }
        box.appendChild(toggle);
        box.appendChild(panel);
        show(!!talkOpen[id]);
        card.appendChild(box);
      }

      // Ids already drawn once, so a host refill does not replay the pop-in.
      var seen = {};

      function items() {
        var f = (window.kirocrew || {}).fields || {};
        return Array.isArray(f.items) ? f.items.filter(function (i) { return i && typeof i === 'object'; }) : [];
      }

      // THE BOARDS UNDER THIS ONE. A worker of this board can be a conductor with a
      // ledger of its own, and the `work` fold above reads this board alone, so that
      // conductor's workers would show nowhere. The `workstreams` fold lists every
      // board this slot reaches, each sub-board naming the task it hangs under in
      // `parent` ({board, item_id}). Board ids there are per-read aliases.
      var NEST_DEPTH = 4;
      function boards() {
        var w = ((window.kirocrew || {}).fields || {}).workstreams;
        return Array.isArray(w) ? w.filter(function (b) { return b && typeof b === 'object'; }) : [];
      }
      function tasksOf(b) {
        return Array.isArray(b.tasks) ? b.tasks.filter(function (t) { return t && typeof t === 'object'; }) : [];
      }
      // This page's own board among them: a board with no parent that holds one of
      // the items the work fold lists. The two folds share item ids, not board ids.
      function ownBoardId(list, all) {
        var ids = {};
        for (var i = 0; i < list.length; i++) {
          var id = text(list[i].item_id);
          if (id) ids[id] = true;
        }
        for (var b = 0; b < all.length; b++) {
          if (all[b].parent) continue;
          var ts = tasksOf(all[b]);
          for (var t = 0; t < ts.length; t++) {
            var tid = text(ts[t].item_id);
            if (tid && Object.prototype.hasOwnProperty.call(ids, tid)) return text(all[b].id);
          }
        }
        return null;
      }
      function childBoards(all, boardId, itemId) {
        if (!boardId || !itemId) return [];
        return all.filter(function (b) {
          var p = b.parent;
          return !!p && typeof p === 'object' && text(p.board) === boardId && text(p.item_id) === itemId;
        });
      }
      // Every board reachable under one item, depth-capped and cycle-safe, so a card
      // can tell whether anything under it changed.
      function reach(all, boardId, itemId, depth, path, out) {
        if (depth > NEST_DEPTH) return out;
        var subs = childBoards(all, boardId, itemId);
        for (var s = 0; s < subs.length; s++) {
          var sid = text(subs[s].id);
          if (!sid || path.indexOf(sid) !== -1) continue;
          out.push(subs[s]);
          var ts = tasksOf(subs[s]);
          for (var t = 0; t < ts.length; t++) reach(all, sid, text(ts[t].item_id), depth + 1, path.concat([sid]), out);
        }
        return out;
      }
      // One sub-board under its task: its goal, its tally, and each of its tasks with
      // its state and last report, nested again for a board under one of those.
      function drawNest(host, all, boardId, itemId, depth, path) {
        if (depth > NEST_DEPTH) return;
        var subs = childBoards(all, boardId, itemId);
        for (var s = 0; s < subs.length; s++) {
          var sb = subs[s];
          var sid = text(sb.id);
          if (!sid || path.indexOf(sid) !== -1) continue;
          var ts = tasksOf(sb);
          var box = document.createElement('div');
          box.className = 'nest';
          var head = document.createElement('div');
          head.className = 'nh';
          var total = num(sb.total);
          head.textContent = i18n('sub_board') + ' \u00b7 ' + i18n('done_of', {
            d: num(sb.accepted) || 0, n: total === null ? ts.length : total
          });
          box.appendChild(head);
          // The goal line only when it says more than the task title above it.
          var goal = text(sb.goal);
          var parentTitle = sb.parent && typeof sb.parent === 'object' ? text(sb.parent.title) : null;
          if (goal && goal !== parentTitle) box.appendChild(line(i18n('sub_goal'), goal));
          for (var t = 0; t < ts.length; t++) {
            var task = ts[t];
            var row = document.createElement('div');
            row.className = 'row';
            var rt = document.createElement('div');
            rt.className = 'rt';
            // The RECORDED state, not view(): a sub-board's task carries no runtime
            // facts (worker, stale), so view() would call every task that last said
            // `progress` working even after its chat went idle or closed. The worker's
            // own last word sits beside it as a separate chip.
            var state = text(task.state) || 'unknown';
            var st = text(task.status);
            var withConductor = state === 'open' && (st === 'question' || st === 'blocked');
            rt.appendChild(chip(withConductor ? i18n('state_with_conductor') : stateLabel(state),
              colourFor(withConductor ? 'waiting' : state)));
            if (st) rt.appendChild(chip(statusLabel(st), null));
            rt.appendChild(document.createTextNode(text(task.title) || text(task.item_id) || DASH));
            row.appendChild(rt);
            var said = text(task.summary);
            if (said) row.appendChild(line(i18n('reported'), said));
            drawNest(row, all, sid, text(task.item_id), depth + 1, path.concat([sid]));
            box.appendChild(row);
          }
          var more = num(sb.tasks_omitted);
          if (more) {
            var m = document.createElement('div');
            m.className = 'nh';
            m.textContent = i18n('sub_more', { n: more });
            box.appendChild(m);
          }
          host.appendChild(box);
        }
      }

      // The closed items the fold no longer holds, counted per closing state. The
      // fold keeps only open items and the newest closed ones, so every whole-board
      // number adds these to what `items` holds.
      function forgotten() {
        var f = ((window.kirocrew || {}).fields || {}).forgotten;
        var g = f && typeof f === 'object' ? f : {};
        function n(k) { var v = g[k]; return typeof v === 'number' && isFinite(v) && v > 0 ? Math.floor(v) : 0; }
        return { items: n('items'), accepted: n('accepted'), rejected: n('rejected'), abandoned: n('abandoned') };
      }

      // Each block keeps its DOM until what it shows changes. A refill that moves one
      // field must not rebuild the rest, or every glow, blink and shimmer restarts.
      var statesSignature = null;
      var doneSignature = null;
      var youSignature = null;

      function drawStates(list) {
        var bar = document.getElementById('states');
        var tally = document.getElementById('tally');
        if (!bar || !tally) return;
        var counts = {};
        var order = [];
        for (var i = 0; i < list.length; i++) {
          var s = view(list[i]);
          if (counts[s] === undefined) { counts[s] = 0; order.push(s); }
          counts[s] += 1;
        }
        var gone = forgotten();
        var closing = ['accepted', 'rejected', 'abandoned'];
        for (var c = 0; c < closing.length; c++) {
          if (!gone[closing[c]]) continue;
          if (counts[closing[c]] === undefined) { counts[closing[c]] = 0; order.push(closing[c]); }
          counts[closing[c]] += gone[closing[c]];
        }
        var total = list.length + gone.items;
        // Known states first in their declared order, then anything the ledger used
        // that this page does not know, so a new state shows up rather than hiding.
        var seq = [];
        for (var k = 0; k < STATES.length; k++) if (counts[STATES[k][0]]) seq.push(STATES[k][0]);
        for (var o = 0; o < order.length; o++) if (seq.indexOf(order[o]) === -1) seq.push(order[o]);
        var signature = JSON.stringify([locale(), total, seq.map(function (s) { return [s, counts[s]]; })]);
        if (signature === statesSignature) return;
        statesSignature = signature;
        bar.textContent = '';
        bar.className = 'states' + (bar.getAttribute('data-drawn') ? '' : ' grow');
        tally.textContent = '';
        if (total) bar.setAttribute('data-drawn', '1');
        for (var j = 0; j < seq.length; j++) {
          var state = seq[j];
          var seg = document.createElement('i');
          seg.style.background = colourFor(state);
          seg.style.width = (total ? (counts[state] / total) * 100 : 0) + '%';
          bar.appendChild(seg);
          var row = document.createElement('span');
          var sw = document.createElement('b');
          sw.style.background = colourFor(state);
          row.appendChild(sw);
          row.appendChild(document.createTextNode(' ' + stateLabel(state) + ' ' + counts[state]));
          tally.appendChild(row);
        }
      }

      function drawLoop(list) {
        var done = document.getElementById('done');
        var you = document.getElementById('you');
        if (!done || !you) return;
        var acc = 0, run = 0, park = 0, hush = 0, stuck = 0, ask = [];
        for (var i = 0; i < list.length; i++) {
          var v = view(list[i]);
          if (v === 'accepted') acc += 1;
          // A discussion is work in progress: it counts as running, not as nothing.
          if (v === 'working' || v === 'discussing') run += 1;
          if (v === 'waiting') park += 1;
          if (v === 'quiet') hush += 1;
          if (v === 'stuck') stuck += 1;
          if (v === 'needs_you') ask.push(list[i]);
        }
        var gone = forgotten();
        var signature = JSON.stringify([locale(), acc + gone.accepted, list.length + gone.items, run, park, hush, stuck, ask.length]);
        if (signature !== doneSignature) {
          doneSignature = signature;
          done.textContent = '';
          var b = document.createElement('b');
          b.textContent = i18n('done_of', { d: acc + gone.accepted, n: list.length + gone.items });
          done.appendChild(b);
          done.appendChild(document.createTextNode([
            i18n('running', { n: run }), i18n('parked', { n: park }), i18n('quiet_n', { n: hush }), i18n('stuck_n', { n: stuck }),
            i18n('waiting', { n: ask.length })
          ].join(' \u00b7 ')));
        }
        signature = JSON.stringify([locale(), ask.map(function (it) {
          return [it.item_id, it.title, it.status, it.reason, it.summary, optionsFor(text(it.item_id) || '')];
        })]);
        if (signature === youSignature) return;
        youSignature = signature;
        you.textContent = '';
        var box = document.createElement('div');
        if (!ask.length) { box.className = 'calm'; box.textContent = i18n('calm'); you.appendChild(box); return; }
        box.className = 'band';
        var k = document.createElement('div');
        k.className = 'k';
        k.textContent = i18n('needs_you');
        box.appendChild(k);
        var hint = document.createElement('div');
        hint.className = 'hint';
        hint.textContent = i18n('fills_chat');
        box.appendChild(hint);
        for (var j = 0; j < ask.length; j++) {
          var v = document.createElement('div');
          v.className = 'v';
          var why = text(ask[j].reason);
          v.textContent = (text(ask[j].title) || text(ask[j].item_id) || DASH) + ' \u2014 ' + statusLabel(ask[j].status) +
            (why ? ' (' + (has('reason_' + why) ? i18n('reason_' + why) : why) + ')' : '');
          box.appendChild(v);
          var said = text(ask[j].summary);
          if (said) {
            var q = document.createElement('div');
            q.className = 'q';
            q.textContent = said;
            box.appendChild(q);
          }
          if (why === 'approval') {
            var nx = document.createElement('div');
            nx.className = 'q';
            nx.textContent = i18n('next_approval');
            box.appendChild(nx);
          }
          box.appendChild(actions(ask[j]));
        }
        you.appendChild(box);
      }

      // Item cards live for this document's lifetime, keyed by id. A refill rebuilds
      // only the cards whose item changed; the rest keep their nodes and motion.
      var itemNodes = {};
      var itemSignatures = {};
      var emptyNode = null;
      // Whether the reader opened the abandoned row, kept across refills. Closed at first.
      var droppedOpen = false;
      var droppedCount = 0;
      // The section each card was last drawn in, and the titles of the tasks that
      // moved from the open list into the closed fold since the reader last opened it:
      // the row names them, so a card that left the open list does not vanish unseen.
      var lastSection = {};
      var droppedNew = {};

      // Which part of the list an item sits in: open work first, abandoned items
      // folded into one row, then the items that closed accepted or rejected.
      function section(it) {
        var s = text(it.state);
        return s === 'abandoned' ? 'dropped' : s === 'accepted' || s === 'rejected' ? 'closed' : 'live';
      }

      function drawDropped(n) {
        droppedCount = n;
        var box = document.getElementById('gb-dropped');
        var tg = document.getElementById('gb-dropped-tg');
        var listEl = document.getElementById('gb-dropped-list');
        if (!box || !tg || !listEl) return;
        box.hidden = !n;
        var label = tg.querySelector('.fold-label');
        var caret = tg.querySelector('.caret');
        var want = i18n('dropped_n', { n: n });
        if (label && label.textContent !== want) label.textContent = want;
        var glyph = droppedOpen ? '\u25be' : '\u25b8';
        if (caret && caret.textContent !== glyph) caret.textContent = glyph;
        tg.setAttribute('aria-expanded', droppedOpen ? 'true' : 'false');
        listEl.hidden = !droppedOpen;
        if (droppedOpen) droppedNew = {};
        var fresh = Object.keys(droppedNew).map(function (k) { return droppedNew[k]; });
        var note = document.getElementById('gb-dropped-new');
        var said = fresh.length ? i18n('dropped_new', { t: fresh.join(', ') }) : '';
        if (note && note.textContent !== said) note.textContent = said;
        var cls = 'fold' + (fresh.length ? ' pulse' : '');
        if (box.className !== cls) box.className = cls;
        if (!tg.getAttribute('data-wired')) {
          tg.setAttribute('data-wired', '1');
          tg.addEventListener('click', function () {
            droppedOpen = !droppedOpen;
            drawDropped(droppedCount);
          });
        }
      }

      function drawItems(list) {
        var hosts = {
          live: document.getElementById('gb-live'),
          dropped: document.getElementById('gb-dropped-list'),
          closed: document.getElementById('gb-closed')
        };
        if (!hosts.live || !hosts.dropped || !hosts.closed) return;
        if (list.length && emptyNode) { emptyNode.remove(); emptyNode = null; }
        var all = boards();
        var own = ownBoardId(list, all);
        var keep = {};
        var at = { live: 0, dropped: 0, closed: 0 };
        for (var i = 0; i < list.length; i++) {
          var it = list[i];
          var id = text(it.item_id) || String(i);
          if (keep[id]) id += '#' + i;
          keep[id] = true;
          var part = section(it);
          var host = hosts[part];
          // A card that left the open list for the fold, while the fold is closed.
          var moved = !!lastSection[id] && lastSection[id] !== part;
          if (moved && part === 'dropped' && !droppedOpen) droppedNew[id] = text(it.title) || text(it.item_id) || DASH;
          if (part !== 'dropped') delete droppedNew[id];
          lastSection[id] = part;
          var slot = at[part]++;
          var signature = JSON.stringify([locale(), it, reach(all, own, text(it.item_id), 1, own ? [own] : [], [])]);
          var card = itemNodes[id];
          if (card && itemSignatures[id] === signature) {
            // Unchanged: the same node stays, moved only when the order changed.
            if (host.children[slot] !== card) host.insertBefore(card, host.children[slot] || null);
            continue;
          }
          if (card) card.remove();
          card = document.createElement('div');
          itemNodes[id] = card;
          itemSignatures[id] = signature;
          // A card moved to another section pops in again where it lands.
          card.className = 'item' + (seen[id] && !moved ? '' : ' pop') + (live(it) ? ' live' : '') + (needsYou(it) ? ' you' : '');
          if (!seen[id] && !moved) card.style.animationDelay = (Math.min(slot, 12) * 45) + 'ms';
          seen[id] = true;
          var t = document.createElement('div');
          t.className = 't';
          t.textContent = text(it.title) || text(it.item_id) || DASH;
          card.appendChild(t);

          var chips = document.createElement('div');
          chips.className = 'chips';
          var state = view(it);
          card.style.setProperty('--tone', colourFor(state));
          // A plain question or block waits on the conductor, and the pill says so.
          var withConductor = state === 'waiting' && (it.status === 'question' || it.status === 'blocked');
          // A waiting item names the PR it reported; a stuck or quiet one says why.
          var heldPr = state === 'waiting' && !withConductor ? num(it.pr) : null;
          var pill = chip(withConductor ? i18n('state_with_conductor')
            : heldPr ? i18n('pill_waiting_pr', { n: heldPr })
              : state === 'stuck' ? i18n(it.worker === 'closed' ? 'pill_stuck' : 'pill_stuck_unread')
                : state === 'quiet' ? i18n('pill_quiet') : stateLabel(state), colourFor(state));
          if (live(it)) {
            var dot = document.createElement('span');
            dot.className = 'dot';
            dot.setAttribute('aria-hidden', 'true');
            pill.insertBefore(dot, pill.firstChild);
          }
          chips.appendChild(pill);
          // A VERDICT and a STATE are different facts and the board keeps both: the
          // verdict is what the acceptance evaluator answered, the state is what the
          // conductor then stamped. Showing only one hides a disagreement.
          var verdict = text(it.verdict);
          if (verdict) chips.appendChild(chip(i18n('verdict', { v: verdict }), null));
          var fails = num(it.fails);
          if (fails) chips.appendChild(chip(i18n('fails', { n: fails }), 'var(--danger, #ff5c5c)'));
          var status = text(it.status);
          // The worker's own last word, which is a CLAIM rather than an acceptance.
          if (status) chips.appendChild(chip(i18n('worker_status', { v: statusLabel(status) }), null));
          var pr = num(it.pr);
          var prAt = pr ? prUrl(it, pr) : null;
          if (prAt) {
            var link = button(i18n('pr_open', { n: pr }), 'chip pill prlink', null);
            link.style.setProperty('--tone', 'var(--info, #6aa9ff)');
            link.title = i18n('pr_open_title', { n: pr });
            link.addEventListener('click', function (u) { return function () { openLink(u); }; }(prAt));
            chips.appendChild(link);
          } else if (pr) chips.appendChild(chip(i18n('pr', { n: pr }), null));
          var links = linksOf(it);
          for (var l = 0; l < links.length; l++) {
            var lb = button(i18n('link_open', { k: clip(links[l][0], 40) }), 'chip pill prlink', null);
            lb.style.setProperty('--tone', 'var(--info, #6aa9ff)');
            lb.title = i18n('link_open_title', { v: links[l][1] });
            lb.addEventListener('click', function (u) { return function () { openLink(u); }; }(links[l][1]));
            chips.appendChild(lb);
          }
          card.appendChild(chips);

          var decision = text(it.decision);
          if (decision) card.appendChild(line(i18n('decision'), decision));
          var summary = text(it.summary);
          if (summary) card.appendChild(line(i18n('reported'), summary));
          drawTalk(card, it, id);
          var worker = text(it.spender);
          if (worker) card.appendChild(line(i18n('worker'), worker));
          drawNest(card, all, own, text(it.item_id), 1, own ? [own] : []);
          host.insertBefore(card, host.children[slot] || null);
        }
        Object.keys(itemNodes).forEach(function (id) {
          if (keep[id]) return;
          itemNodes[id].remove();
          delete itemNodes[id];
          delete itemSignatures[id];
          delete lastSection[id];
          delete droppedNew[id];
        });
        drawDropped(at.dropped);
        var emptyText = list.length ? null : i18n('empty');
        if (emptyNode && emptyNode.textContent !== emptyText) { emptyNode.remove(); emptyNode = null; }
        if (emptyText && !emptyNode) {
          emptyNode = document.createElement('div');
          emptyNode.className = 'line';
          emptyNode.textContent = emptyText;
          hosts.live.appendChild(emptyNode);
        }
      }

      function render() {
        var list = items();
        applyStatic();
        // A conductor that opened no board leaves `conductor.goal` and the stamps as
        // the empty string. The host binds that as blank, which reads as a page that
        // failed to load, so it becomes a dash.
        var cells = document.body.querySelectorAll('[data-dashboard-field]');
        for (var c = 0; c < cells.length; c++) {
          if (!cells[c].textContent.trim()) cells[c].textContent = DASH;
        }
        drawLoop(list);
        drawStates(list);
        drawItems(list);
        // The bound element for the array gets a count: the host binds by textContent,
        // so left alone this cell reads as dumped JSON.
        var note = document.querySelector('[data-dashboard-field="items"]');
        if (note) note.textContent = String(list.length + forgotten().items);
      }

      // The frame bootstrap registered first and fills bound cells, so drawing after
      // its fill keeps the dashes and the item count from being overwritten.
      if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', render, { once: true });
      else render();
      // The composed frame dispatches this after it applies a refill. Listening to
      // every message redrew the page for unrelated frame traffic.
      window.addEventListener('kirocrew-dashboard', render);
    }());
  </script>
</div>
