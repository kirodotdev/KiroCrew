openapi: 3.1.0
info:
  title: Crew API shared components
  version: 1.0.0-draft
  description: Components shared by crew-public.yaml and crew-owner.yaml. Components only, no paths.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
- url: https://{crew_endpoint}
  variables:
    crew_endpoint:
      default: crew.example.invalid
paths: {}
components:
  schemas:
    Error:
      type: object
      required:
      - error
      description: Unified error body. Shape follows OpenAI. Clients treat an unknown code by its HTTP status.
      properties:
        error:
          type: object
          required:
          - type
          - code
          - message
          - request_id
          properties:
            type:
              $ref: '#/components/schemas/ErrorType'
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            param:
              type:
              - string
              - 'null'
              description: Name of the field in error.
            request_id:
              type: string
              pattern: ^req_
              description: Same as X-Request-Id.
            oldest_seq:
              type: integer
              description: 'Always present on a 410 resync_required: the oldest seq that can still be replayed.'
            latest_seq:
              type: integer
              description: 'Always present on a 410 resync_required: resync starts here.'
            supported:
              type: object
              description: Only on unsupported_api_version.
              properties:
                min:
                  type: string
                max:
                  type: string
            final:
              type: object
              description: 'Only on approval_already_resolved: the final result.'
              additionalProperties: true
    ErrorType:
      type: string
      description: 'Open enum: clients must accept unknown values.'
      enum:
      - authentication_error
      - capability_error
      - conflict_error
      - invalid_request_error
      - not_found_error
      - permission_error
      - rate_limit_error
      - resync_required_error
      - server_error
    ErrorCode:
      type: string
      description: Open enum; see the error table in the RFC.
      enum:
      - invalid_request
      - unsupported_parameter
      - unsupported_tool_type
      - unsupported_api_version
      - invalid_token
      - token_revoked
      - third_party_disabled
      - insufficient_scope
      - approval_requires_first_party
      - tool_not_registered
      - connector_definition_changed
      - use_responses_api
      - not_found
      - model_not_found
      - method_not_supported
      - response_in_progress
      - approval_already_resolved
      - resync_required
      - payload_too_large
      - capability_unavailable
      - idempotency_key_reused
      - rate_limited
      - concurrency_limit
      - quota_exhausted
      - grant_paused
      - notification_limited
      - internal_error
      - instance_unavailable
    Metadata:
      type: object
      maxProperties: 16
      propertyNames:
        maxLength: 64
      additionalProperties:
        type: string
        maxLength: 512
      description: At most 16 pairs; keys up to 64 characters, values up to 512 (same as OpenAI).
    Timestamp:
      type: integer
      description: Unix seconds.
    ListEnvelope:
      type: object
      required:
      - object
      - data
      - has_more
      description: 'Paged list. Page by id cursor: the next page passes `after=last_id`.'
      properties:
        object:
          const: list
        data:
          type: array
          items: {}
        first_id:
          type:
          - string
          - 'null'
        last_id:
          type:
          - string
          - 'null'
        has_more:
          type: boolean
    InputText:
      type: object
      required:
      - type
      - text
      properties:
        type:
          const: input_text
        text:
          type: string
    MessageInput:
      type: object
      required:
      - role
      - content
      properties:
        type:
          const: message
        role:
          enum:
          - user
          - assistant
          - developer
          - system
        content:
          oneOf:
          - type: string
          - type: array
            items:
              $ref: '#/components/schemas/InputText'
      description: '`input_image` and `input_file` are an open question; until settled only text is accepted and
        other content types get 400.'
    FunctionCallOutputInput:
      type: object
      required:
      - type
      - call_id
      - output
      description: Answers the previous turn's client-side tool call. Needs the `client_tools` capability.
      properties:
        type:
          const: function_call_output
        call_id:
          type: string
        output:
          type: string
    McpApprovalResponseInput:
      type: object
      required:
      - type
      - approval_request_id
      - approve
      description: The user's own credential (Owner) only. A delegated credential and the embed credential both
        get 403 `approval_requires_first_party`; the embed credential answers only through POST /v1/crew/approvals/{id}/decision.
      properties:
        type:
          const: mcp_approval_response
        approval_request_id:
          type: string
          pattern: ^apr_
        approve:
          type: boolean
    InputItem:
      oneOf:
      - $ref: '#/components/schemas/MessageInput'
      - $ref: '#/components/schemas/FunctionCallOutputInput'
      - $ref: '#/components/schemas/McpApprovalResponseInput'
    FunctionTool:
      type: object
      required:
      - type
      - name
      description: Client-side tool. Needs the `client_tools` capability and must match the tool of the same name
        in the consented manifest.
      properties:
        type:
          const: function
        name:
          type: string
        description:
          type: string
        parameters:
          type: object
    McpTool:
      type: object
      required:
      - type
      - server_label
      - server_url
      description: 'Must be a subset of the consented manifest: name, server_url, parameter schema and approval
        setting all match, and always cannot become never.'
      properties:
        type:
          const: mcp
        server_label:
          type: string
        server_url:
          type: string
          format: uri
        allowed_tools:
          type: array
          items:
            type: string
        require_approval:
          oneOf:
          - enum:
            - always
            - never
          - type: object
    Tool:
      oneOf:
      - $ref: '#/components/schemas/FunctionTool'
      - $ref: '#/components/schemas/McpTool'
    CreateResponseRequest:
      type: object
      required:
      - model
      - input
      description: 'Rule: support what can be done and refuse the rest with 400, never silently ignore; sampling
        parameters are the exception. `reasoning`, `include`, `truncation`, `prompt`, `service_tier`, `user`, `parallel_tool_calls`,
        `max_tool_calls` and `top_logprobs` always get 400 `unsupported_parameter`.'
      properties:
        model:
          type: string
          description: 'For a delegated credential: the connector''s agent.id, or a mate id in the grant''s mates.
            The owner may also pass a template name. Anything else gets 404 model_not_found.'
        input:
          oneOf:
          - type: string
          - type: array
            items:
              $ref: '#/components/schemas/InputItem'
        instructions:
          type: string
          description: Appended after the agent's own prompt; cannot replace it.
        conversation:
          type: string
          pattern: ^conv_
          description: Omit to create a new conversation.
        previous_response_id:
          type: string
          pattern: ^resp_
          description: Either this or conversation; if both are given they must point to the same conversation,
            else 400.
        stream:
          type: boolean
          default: false
        background:
          type: boolean
          default: false
          description: Returns queued at once. A background run started by a delegated credential ends incomplete
            with reason grant_unverified if its grant can no longer be verified.
        metadata:
          $ref: '#/components/schemas/Metadata'
        tools:
          type: array
          items:
            $ref: '#/components/schemas/Tool'
          description: Without it, every tool in the consented manifest is used. `web_search`, `file_search`, `code_interpreter`,
            `computer_use` and `image_generation` get 400 `unsupported_tool_type`.
        tool_choice:
          enum:
          - auto
          - none
        store:
          const: true
          description: Only true is accepted; false gets 400.
        text:
          type: object
          properties:
            format:
              type: object
              properties:
                type:
                  const: text
          description: Only text is supported; json_schema is an open question.
        temperature:
          type: number
          description: Accepted and ignored; listed in crew.ignored_parameters.
        top_p:
          type: number
          description: Accepted and ignored.
        max_output_tokens:
          type: integer
          description: Accepted and ignored.
    OutputText:
      type: object
      required:
      - type
      - text
      properties:
        type:
          const: output_text
        text:
          type: string
        annotations:
          type: array
          maxItems: 0
          items: {}
    MessageItem:
      type: object
      required:
      - type
      - id
      - role
      - content
      - status
      properties:
        type:
          const: message
        id:
          type: string
          pattern: ^msg_
        role:
          enum:
          - user
          - assistant
        status:
          enum:
          - in_progress
          - completed
          - incomplete
        content:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/OutputText'
            - $ref: '#/components/schemas/InputText'
    FunctionCallItem:
      type: object
      required:
      - type
      - id
      - call_id
      - name
      - arguments
      description: Needs the client_tools capability.
      properties:
        type:
          const: function_call
        id:
          type: string
        call_id:
          type: string
        name:
          type: string
        arguments:
          type: string
        status:
          enum:
          - in_progress
          - completed
    McpCallItem:
      type: object
      required:
      - type
      - id
      - server_label
      - name
      description: Arguments and output are summaries only. A delegated credential sees only its own connector's
        tool names; built-in tools show as "internal tool".
      properties:
        type:
          const: mcp_call
        id:
          type: string
        server_label:
          type: string
        name:
          type: string
        arguments:
          type: string
          description: Summary.
        output:
          type:
          - string
          - 'null'
          description: Summary.
        error:
          type:
          - string
          - 'null'
    McpApprovalRequestItem:
      type: object
      required:
      - type
      - id
      - server_label
      - name
      description: The id is the instance-wide approval id.
      properties:
        type:
          const: mcp_approval_request
        id:
          type: string
          pattern: ^apr_
        server_label:
          type: string
        name:
          type: string
        arguments:
          type: string
          description: Summary.
    OutputItem:
      oneOf:
      - $ref: '#/components/schemas/MessageItem'
      - $ref: '#/components/schemas/FunctionCallItem'
      - $ref: '#/components/schemas/McpCallItem'
      - $ref: '#/components/schemas/McpApprovalRequestItem'
      discriminator:
        propertyName: type
        mapping:
          message: '#/components/schemas/MessageItem'
          function_call: '#/components/schemas/FunctionCallItem'
          mcp_call: '#/components/schemas/McpCallItem'
          mcp_approval_request: '#/components/schemas/McpApprovalRequestItem'
    Usage:
      type:
      - object
      - 'null'
      description: Filled when token counts are known; otherwise the whole field is null, never 0.
      properties:
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        total_tokens:
          type: integer
        credits:
          type:
          - number
          - 'null'
          description: 'Added by Crew: present only on engines that bill in credits.'
    ResponseStatus:
      enum:
      - queued
      - in_progress
      - completed
      - failed
      - cancelled
      - incomplete
    IncompleteReason:
      enum:
      - turn_token_limit
      - tool_call_limit
      - turn_time_limit
      - grant_unverified
      - approval_expired
      - cancelled
      description: Open enum.
    Response:
      type: object
      required:
      - id
      - object
      - created_at
      - status
      - model
      - output
      properties:
        id:
          type: string
          pattern: ^resp_
        object:
          const: response
        created_at:
          $ref: '#/components/schemas/Timestamp'
        status:
          $ref: '#/components/schemas/ResponseStatus'
        model:
          type: string
        output:
          type: array
          items:
            $ref: '#/components/schemas/OutputItem'
        error:
          type:
          - object
          - 'null'
          properties:
            code:
              type: string
            message:
              type: string
        incomplete_details:
          type:
          - object
          - 'null'
          properties:
            reason:
              $ref: '#/components/schemas/IncompleteReason'
        conversation:
          type: object
          properties:
            id:
              type: string
              pattern: ^conv_
        metadata:
          $ref: '#/components/schemas/Metadata'
        usage:
          $ref: '#/components/schemas/Usage'
        crew:
          type: object
          description: Fields added by Crew.
          properties:
            ignored_parameters:
              type: array
              items:
                type: string
    ResponseStreamEvent:
      type: object
      required:
      - type
      - sequence_number
      description: 'SSE events of `POST /v1/responses` (stream=true) and `GET /v1/responses/{id}?stream=true`. Each
        SSE `event:` line carries the type and each `data:` line is this object as JSON. `sequence_number` increases
        only within this turn''s stream and is used by `starting_after`; it is unrelated to the event stream''s
        `seq`. Not sent: `response.reasoning_*`, `response.refusal.*`, `response.output_text.annotation.added`,
        `response.web_search_call.*`, `response.file_search_call.*`, `response.code_interpreter_call.*`, `response.image_generation_call.*`.
        Clients skip `crew.*` events they do not know.'
      properties:
        type:
          enum:
          - response.created
          - response.queued
          - response.in_progress
          - response.completed
          - response.failed
          - response.incomplete
          - response.output_item.added
          - response.output_item.done
          - response.content_part.added
          - response.content_part.done
          - response.output_text.delta
          - response.output_text.done
          - response.function_call_arguments.delta
          - response.function_call_arguments.done
          - response.mcp_call.in_progress
          - response.mcp_call.completed
          - response.mcp_call.failed
          - error
          - crew.notice
        sequence_number:
          type: integer
          minimum: 0
        response:
          $ref: '#/components/schemas/Response'
          description: For response.* lifecycle events.
        output_index:
          type: integer
        content_index:
          type: integer
        item_id:
          type: string
        item:
          $ref: '#/components/schemas/OutputItem'
        part:
          $ref: '#/components/schemas/OutputText'
        delta:
          type: string
        text:
          type: string
        arguments:
          type: string
        code:
          type: string
          description: Only on error.
        message:
          type: string
        level:
          enum:
          - info
          - warning
          description: Only on crew.notice.
      x-crew-sse-events:
      - response.created
      - response.queued
      - response.in_progress
      - response.completed
      - response.failed
      - response.incomplete
      - response.output_item.added
      - response.output_item.done
      - response.content_part.added
      - response.content_part.done
      - response.output_text.delta
      - response.output_text.done
      - response.function_call_arguments.delta
      - response.function_call_arguments.done
      - response.mcp_call.in_progress
      - response.mcp_call.completed
      - response.mcp_call.failed
      - error
      - crew.notice
    Conversation:
      type: object
      required:
      - id
      - object
      - created_at
      properties:
        id:
          type: string
          pattern: ^conv_
        object:
          const: conversation
        created_at:
          $ref: '#/components/schemas/Timestamp'
        metadata:
          $ref: '#/components/schemas/Metadata'
        crew:
          type: object
          properties:
            title:
              type:
              - string
              - 'null'
            model:
              type: string
            latest_seq:
              type: integer
              description: This conversation stream's latest seq (for resync).
            status:
              enum:
              - idle
              - running
              - needs_approval
    CreateConversationRequest:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        items:
          type: array
          maxItems: 0
          items: {}
          description: Initial items are not accepted (they would put a conversation that never happened into history).
    UpdateConversationRequest:
      type: object
      required:
      - metadata
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
      additionalProperties: false
    ConversationItem:
      oneOf:
      - $ref: '#/components/schemas/MessageItem'
      - $ref: '#/components/schemas/FunctionCallItem'
      - $ref: '#/components/schemas/McpCallItem'
      - $ref: '#/components/schemas/McpApprovalRequestItem'
    ConversationList:
      allOf:
      - $ref: '#/components/schemas/ListEnvelope'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/Conversation'
    ConversationItemList:
      allOf:
      - $ref: '#/components/schemas/ListEnvelope'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/ConversationItem'
    InputItemList:
      allOf:
      - $ref: '#/components/schemas/ListEnvelope'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/ConversationItem'
    Model:
      type: object
      required:
      - id
      - object
      - owned_by
      properties:
        id:
          type: string
        object:
          const: model
        created:
          $ref: '#/components/schemas/Timestamp'
        owned_by:
          type: string
          description: '`crew`, or the connector''s client_id.'
        crew:
          type: object
          properties:
            kind:
              enum:
              - agent
              - mate
              - connector
            name:
              type: string
            description:
              type: string
    ModelList:
      type: object
      required:
      - object
      - data
      properties:
        object:
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/Model'
    Capabilities:
      type: object
      required:
      - api_version
      - features
      description: Filtered by the caller's permissions; a delegated credential sees only the agents it can use.
      properties:
        api_version:
          type: object
          properties:
            current:
              type: string
            min_supported:
              type: string
        features:
          type: object
          additionalProperties:
            type: boolean
          properties:
            background:
              type: boolean
            client_tools:
              type: boolean
            mcp_tools:
              type: boolean
            approvals:
              type: boolean
            fork:
              type: boolean
            mid_turn_question:
              type: boolean
            instance_events:
              type: boolean
            webhooks:
              type: boolean
        agents:
          type: object
          additionalProperties:
            type: object
            properties:
              engine:
                type: string
              tools_closed_by_default:
                type: boolean
              input_modalities:
                type: array
                items:
                  type: string
              resumable_elsewhere:
                type: boolean
        limits:
          type: object
          properties:
            max_input_bytes:
              type: integer
            rate_limit_per_minute:
              type: integer
            max_concurrent_turns:
              type: integer
            max_queued_turns:
              type: integer
        quota:
          $ref: '#/components/schemas/Quota'
    Quota:
      type: object
      description: This grant's quota and usage.
      properties:
        daily_credits:
          type: number
        used_credits:
          type: number
        reserved_credits:
          type: number
        resets_at:
          $ref: '#/components/schemas/Timestamp'
        max_turn_tokens:
          type: integer
        max_turn_tool_calls:
          type: integer
        max_turn_secs:
          type: integer
    InstanceInfo:
      type: object
      required:
      - id
      properties:
        id:
          type: string
        display_name:
          type: string
        timezone:
          type: string
        api_version:
          type: string
      description: 503 instance_unavailable when the crew is offline.
    Event:
      type: object
      required:
      - seq
      - event_id
      - type
      - created_at
      - data
      description: In-instance event. Types and fields are only ever added; clients skip unknown types but still
        advance their cursor.
      properties:
        seq:
          type: integer
          description: Strictly increasing within the stream; gaps are allowed (filtered events still take a number).
        event_id:
          type: string
          pattern: ^evt_
          description: Globally unique; deduplicate across streams, push and replay by it.
        type:
          type: string
          enum:
          - conversation.created
          - conversation.updated
          - turn.started
          - message.created
          - tool.called
          - approval.requested
          - approval.decided
          - turn.completed
          - grant.revoked
          - notice
          description: Open enum.
        conversation:
          type:
          - string
          - 'null'
          pattern: ^conv_
        response:
          type:
          - string
          - 'null'
          pattern: ^resp_
        created_at:
          $ref: '#/components/schemas/Timestamp'
        data:
          type: object
          additionalProperties: true
      x-crew-event-data:
        conversation.created:
          stream: instance stream
          data:
            type: object
            properties:
              title:
                type:
                - string
                - 'null'
              model:
                type: string
        conversation.updated:
          stream: instance stream
          data:
            type: object
            properties:
              latest_seq:
                type: integer
        turn.started:
          stream: conversation stream
          data:
            type: object
            properties: {}
        message.created:
          stream: conversation stream
          data:
            type: object
            properties:
              item_id:
                type: string
        tool.called:
          stream: conversation stream
          data:
            type: object
            properties:
              tool:
                type: string
              summary:
                type: string
        approval.requested:
          stream: conversation stream, plus a hint on the instance stream
          data:
            type: object
            properties:
              approval_id:
                type: string
                pattern: ^apr_
              tool:
                type: string
              reason:
                type: string
              expires_at:
                $ref: '#/components/schemas/Timestamp'
              answerable_by_you:
                type: boolean
        approval.decided:
          stream: conversation stream, plus a hint on the instance stream
          data:
            type: object
            properties:
              approval_id:
                type: string
                pattern: ^apr_
              state:
                enum:
                - allowed
                - denied
                - expired
              expired_reason:
                enum:
                - timeout
                - turn_cancelled
              decided_by:
                type: object
                description: 'Who answered: which kind of client, never the token.'
                properties:
                  kind:
                    enum:
                    - owner
                    - first_party
                    - embed
                    - gateway
        turn.completed:
          stream: conversation stream
          data:
            type: object
            properties:
              result:
                enum:
                - completed
                - failed
                - cancelled
                - incomplete
        grant.revoked:
          stream: instance stream, only to the revoked grant
          data:
            type: object
            properties:
              grant_id:
                type: string
        notice:
          stream: instance stream
          data:
            type: object
            properties:
              level:
                enum:
                - info
                - warning
              text:
                type: string
    EventPage:
      type: object
      required:
      - events
      - latest_seq
      - has_more
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        latest_seq:
          type: integer
        oldest_seq:
          type: integer
        has_more:
          type: boolean
    ApprovalState:
      enum:
      - pending
      - allowed
      - denied
      - expired
      description: Only these four values are used. When a turn is cancelled, the approval it was waiting on becomes
        expired with reason turn_cancelled.
    ExpiredReason:
      enum:
      - timeout
      - turn_cancelled
    Approval:
      type: object
      required:
      - id
      - object
      - conversation
      - state
      - created_at
      properties:
        id:
          type: string
          pattern: ^apr_
          description: apr_ plus 128 random bits; unique across the instance.
        object:
          const: approval
        conversation:
          type: string
          pattern: ^conv_
        response:
          type:
          - string
          - 'null'
          pattern: ^resp_
        tool:
          type: string
        reason:
