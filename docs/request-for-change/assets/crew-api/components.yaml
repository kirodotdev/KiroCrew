openapi: 3.1.0
info:
  title: Crew API shared components
  version: 1.0.0-draft
  description: Components shared by crew-public.yaml and crew-owner.yaml. Components only, no paths.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
- url: https://{crew_endpoint}
  variables:
    crew_endpoint:
      default: crew.example.invalid
paths: {}
components:
  schemas:
    Error:
      type: object
      required:
      - error
      description: Unified error body. Shape follows OpenAI. Clients treat an unknown code by its HTTP status.
      properties:
        error:
          type: object
          required:
          - type
          - code
          - message
          - request_id
          properties:
            type:
              $ref: '#/components/schemas/ErrorType'
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            param:
              type:
              - string
              - 'null'
              description: Name of the field in error.
            request_id:
              type: string
              pattern: ^req_
              description: Same as X-Request-Id.
            oldest_seq:
              type: integer
              description: 'Always present on a 410 resync_required: the oldest seq that can still be replayed.'
            latest_seq:
              type: integer
              description: 'Always present on a 410 resync_required: resync starts here.'
            entitlement:
              type: string
              description: 'Only on entitlement_required: the missing entitlement, for example memory.read.'
            retry_after:
              type: integer
              minimum: 0
              description: 'Only on 429: seconds to wait before retrying, the same as the Retry-After header; not
                sent with grant_paused.'
            limit:
              type: string
              description: 'Only on concurrency_limit and on a wake''s rate_limited: which limit was hit. event_streams:
                too many event streams, and the client should close the ones it does not use; turns: running and
                queued turns are both full, and the client should retry after Retry-After; bot_wakes: this grant''s
                wakes of this Bot in this hour are used up; grant_wakes: this grant''s total wakes in this hour
                are used up. Open enum: later limits use this field too, and a client treats a value it does not
                know as turns.'
              enum:
              - event_streams
              - turns
              - bot_wakes
              - grant_wakes
            final:
              type: object
              description: 'Only on approval_already_resolved: the final result.'
              additionalProperties: true
    ErrorType:
      type: string
      description: 'Open enum: clients must accept unknown values. The examples are the known values, not all of
        them.'
      pattern: ^[a-z][a-z0-9_]*$
      examples:
      - authentication_error
      - capability_error
      - conflict_error
      - invalid_request_error
      - not_found_error
      - permission_error
      - rate_limit_error
      - resync_required_error
      - server_error
    ErrorCode:
      type: string
      description: 'Open enum: a client treats an unknown code by its HTTP status. The examples are the known values,
        not all of them; the table is in the RFC. stale_session_reauth (401): this first-party session signed in
        before an owner was configured, the owner check does not accept it, and the user has to sign in again. grant_paused
        is 403 (the user has to resume it; it is not rate limiting). prune_in_progress (503): the Bot roster is
        being tidied; retry later.'
      pattern: ^[a-z][a-z0-9_]*$
      examples:
      - invalid_request
      - unsupported_parameter
      - unsupported_tool_type
      - invalid_token
      - token_revoked
      - stale_session_reauth
      - third_party_disabled
      - entitlement_required
      - insufficient_scope
      - owner_only
      - approval_requires_first_party
      - tool_not_registered
      - connector_definition_changed
      - use_responses_api
      - not_found
      - model_not_found
      - method_not_supported
      - response_in_progress
      - approval_already_resolved
      - resync_required
      - payload_too_large
      - capability_unavailable
      - idempotency_key_reused
      - rate_limited
      - concurrency_limit
      - quota_exhausted
      - grant_paused
      - notification_limited
      - tools_removed
      - tools_revoked_by_app
      - structured_output_invalid
      - internal_error
      - instance_unavailable
      - prune_in_progress
    Metadata:
      type: object
      maxProperties: 16
      propertyNames:
        maxLength: 64
      additionalProperties:
        type: string
        maxLength: 512
      description: At most 16 pairs; keys up to 64 characters, values up to 512 (same as OpenAI).
    Timestamp:
      type: integer
      description: Unix seconds.
    ListEnvelope:
      type: object
      required:
      - object
      - data
      - has_more
      description: 'Paged list. Page by id cursor: the next page passes `after=last_id`.'
      properties:
        object:
          const: list
        data:
          type: array
          items: {}
        first_id:
          type:
          - string
          - 'null'
        last_id:
          type:
          - string
          - 'null'
        has_more:
          type: boolean
    InputText:
      type: object
      required:
      - type
      - text
      properties:
        type:
          const: input_text
        text:
          type: string
    MessageInput:
      type: object
      required:
      - role
      - content
      properties:
        type:
          const: message
        role:
          enum:
          - user
          - assistant
          - developer
          - system
        content:
          oneOf:
          - type: string
          - type: array
            items:
              $ref: '#/components/schemas/InputContentPart'
      description: 'Content is a string, or a list of content parts: `input_text` (phase 1), `input_image` and `input_file`
        (phase 2). Images and files are allowed only in user messages.'
    FunctionCallOutputInput:
      type: object
      required:
      - type
      - call_id
      - output
      description: Answers the previous turn's client-side tool call. Needs the `client_tools` capability.
      properties:
        type:
          const: function_call_output
        call_id:
          type: string
        output:
          type: string
    McpApprovalResponseInput:
      type: object
      required:
      - type
      - approval_request_id
      - approve
      description: The user's own credential (Owner) only. A delegated credential and the embed credential both
        get 403 `approval_requires_first_party`; the embed credential answers only through POST /v1/crew/approvals/{id}/decision.
      properties:
        type:
          const: mcp_approval_response
        approval_request_id:
          type: string
          pattern: ^apr_
        approve:
          type: boolean
    InputItem:
      oneOf:
      - $ref: '#/components/schemas/MessageInput'
      - $ref: '#/components/schemas/FunctionCallOutputInput'
      - $ref: '#/components/schemas/McpApprovalResponseInput'
    FunctionTool:
      type: object
      required:
      - type
      - name
      description: Client-side tool. Needs the `client_tools` capability and must match the tool of the same name
        in the consented manifest.
      properties:
        type:
          const: function
        name:
          type: string
        description:
          type: string
        parameters:
          type: object
    McpTool:
      type: object
      required:
      - type
      - server_label
      - server_url
      description: 'Must be a subset of the consented manifest: name, server_url, parameter schema and approval
        setting all match, and always cannot become never.'
      properties:
        type:
          const: mcp
        server_label:
          type: string
        server_url:
          type: string
          format: uri
        allowed_tools:
          type: array
          items:
            type: string
        require_approval:
          oneOf:
          - enum:
            - always
            - never
          - type: object
    Tool:
      oneOf:
      - $ref: '#/components/schemas/FunctionTool'
      - $ref: '#/components/schemas/McpTool'
    CreateResponseRequest:
      type: object
      required:
      - model
      - input
      description: 'Rule: support what can be done; refuse with 400 what would change what runs or what is stored
        (tools outside the manifest, `store: false`, unsupported tool types, `prompt`); accept and ignore fields
        that only tune generation or do bookkeeping, and list them in the response''s `crew.ignored_parameters`.
        Phase 2 fields (images, files, json_schema, reasoning summaries) open per agent as `GET /v1/crew/capabilities`
        reports; when the agent does not support one, 422 `capability_unavailable`.'
      properties:
        model:
          type: string
          description: 'For a delegated credential: the template id of the app''s capability bundle, <client_id>/<bundle.agent.id>,
            or a bot id in the grant''s bots. The owner may also pass a template name. Anything else gets 404 model_not_found.'
        input:
          oneOf:
          - type: string
          - type: array
            items:
              $ref: '#/components/schemas/InputItem'
        instructions:
          type: string
          description: Appended after the agent's own prompt; cannot replace it.
        conversation:
          type: string
          pattern: ^conv_
          description: Omit to create a new conversation.
        previous_response_id:
          type: string
          pattern: ^resp_
          description: Either this or conversation; if both are given they must point to the same conversation,
            else 400.
        stream:
          type: boolean
          default: false
        background:
          type: boolean
          default: false
          description: Returns queued at once. A background run started by a delegated credential holds a 5-minute
            lease; if the grant can no longer be verified when the lease runs out, the run ends incomplete with
            reason grant_unverified.
        metadata:
          $ref: '#/components/schemas/Metadata'
        tools:
          type: array
          items:
            $ref: '#/components/schemas/Tool'
          description: Without it, every tool in the consented manifest is used. `web_search`, `file_search`, `code_interpreter`,
            `computer_use` and `image_generation` get 400 `unsupported_tool_type`.
        tool_choice:
          enum:
          - auto
          - none
        store:
          const: true
          description: Only true is accepted; false gets 400.
        text:
          type: object
          description: 'Output format: `text` (phase 1) or `json_schema` (phase 2, only when the agent''s `structured_output`
            is true).'
          properties:
            format:
              oneOf:
              - type: object
                required:
                - type
                properties:
                  type:
                    const: text
              - type: object
                required:
                - type
                - name
                - schema
                description: The crew validates the last reply against this schema; when it does not conform the
                  whole turn is failed with error.code structured_output_invalid.
                properties:
                  type:
                    const: json_schema
                  name:
                    type: string
                    maxLength: 64
                    pattern: ^[A-Za-z0-9_-]+$
                  description:
                    type: string
                  schema:
                    type: object
                    additionalProperties: true
                    description: JSON Schema; at most 100 properties and 5 levels.
                  strict:
                    type: boolean
                    default: true
        reasoning:
          type: object
          description: 'Reasoning summary (phase 2), off by default: without this field no reasoning item is returned.
            Summaries only, never the raw reasoning. A level that is not in the agent''s `reasoning_summary` is
            422 capability_unavailable.'
          properties:
            summary:
              enum:
              - auto
              - concise
              - detailed
        temperature:
          type: number
          description: Accepted and ignored; listed in crew.ignored_parameters.
        top_p:
          type: number
          description: Accepted and ignored.
        max_output_tokens:
          type: integer
          description: Accepted and ignored.
    OutputText:
      type: object
      required:
      - type
      - text
      properties:
        type:
          const: output_text
        text:
          type: string
        annotations:
          type: array
          maxItems: 0
          items: {}
    MessageItem:
      type: object
      required:
      - type
      - id
      - role
      - content
      - status
      properties:
        type:
          const: message
        id:
          type: string
          pattern: ^msg_
        role:
          enum:
          - user
          - assistant
        status:
          enum:
          - in_progress
          - completed
          - incomplete
        content:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/OutputText'
            - $ref: '#/components/schemas/InputText'
    FunctionCallItem:
      type: object
      required:
      - type
      - id
      - call_id
      - name
      - arguments
      description: Needs the client_tools capability.
      properties:
        type:
          const: function_call
        id:
          type: string
        call_id:
          type: string
        name:
          type: string
        arguments:
          type: string
        status:
          enum:
          - in_progress
          - completed
    McpCallItem:
      type: object
      required:
      - type
      - id
      - server_label
      - name
      description: Arguments and output are summaries only, as in the crew log. A delegated credential sees only
        its own connector's tool names; built-in tools show as "internal tool".
      properties:
        type:
          const: mcp_call
        id:
          type: string
        server_label:
          type: string
        name:
          type: string
        arguments:
          type: string
          description: Summary.
        output:
          type:
          - string
          - 'null'
          description: Summary.
        error:
          type:
          - string
          - 'null'
    McpApprovalRequestItem:
      type: object
      required:
      - type
      - id
      - server_label
      - name
      description: The id is the instance-wide approval id.
      properties:
        type:
          const: mcp_approval_request
        id:
          type: string
          pattern: ^apr_
        server_label:
          type: string
        name:
          type: string
        arguments:
          type: string
          description: Summary.
        approval_url:
          type: string
          format: uri
          description: Address of the approval page (a proposal). The app hands it to the user, who signs in in
            a small window under the Kiro Crew host name and answers there. The app itself cannot answer.
    OutputItem:
      oneOf:
      - $ref: '#/components/schemas/MessageItem'
      - $ref: '#/components/schemas/FunctionCallItem'
      - $ref: '#/components/schemas/McpCallItem'
      - $ref: '#/components/schemas/McpApprovalRequestItem'
      - $ref: '#/components/schemas/ReasoningItem'
      discriminator:
        propertyName: type
        mapping:
          message: '#/components/schemas/MessageItem'
          function_call: '#/components/schemas/FunctionCallItem'
          mcp_call: '#/components/schemas/McpCallItem'
          mcp_approval_request: '#/components/schemas/McpApprovalRequestItem'
          reasoning: '#/components/schemas/ReasoningItem'
    Usage:
      type:
      - object
      - 'null'
      description: Filled when token counts are known; otherwise the whole field is null, never 0.
      properties:
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        total_tokens:
          type: integer
        credits:
          type:
          - number
          - 'null'
          description: 'Added by Crew: present only on engines that bill in credits.'
    ResponseStatus:
      description: requires_action means it is waiting for the user to answer an approval (output has an mcp_approval_request).
      enum:
      - queued
      - in_progress
      - requires_action
      - completed
      - failed
      - cancelled
      - incomplete
    IncompleteReason:
      enum:
      - turn_token_limit
      - tool_call_limit
      - turn_time_limit
      - grant_unverified
      description: Open enum.
    Response:
      type: object
      required:
      - id
      - object
      - created_at
      - status
      - model
      - output
      properties:
        id:
          type: string
          pattern: ^resp_
        object:
          const: response
        created_at:
          $ref: '#/components/schemas/Timestamp'
        status:
          $ref: '#/components/schemas/ResponseStatus'
        model:
          type: string
        output:
          type: array
          items:
            $ref: '#/components/schemas/OutputItem'
        error:
          type:
          - object
          - 'null'
          properties:
            code:
              type: string
            message:
              type: string
        incomplete_details:
          type:
          - object
          - 'null'
          properties:
            reason:
              $ref: '#/components/schemas/IncompleteReason'
        conversation:
          type: object
          properties:
            id:
              type: string
              pattern: ^conv_
        metadata:
          $ref: '#/components/schemas/Metadata'
        usage:
          $ref: '#/components/schemas/Usage'
        crew:
          type: object
          description: Fields added by Crew.
          properties:
            ignored_parameters:
              type: array
              items:
                type: string
      description: 'Retention: stored responses (with the stream events used to resume), the event index, resolved
        approvals and uploaded files are all kept 30 days by default; the owner can set `crew_api.retention_days`
        in the crew settings to 1 to 365 days. Deleting a conversation deletes its responses and events. After the
        retention period GET returns 404 not_found.'
    ResponseStreamEvent:
      type: object
      required:
      - type
      - sequence_number
      description: 'SSE events of `POST /v1/responses` (stream=true) and `GET /v1/responses/{id}?stream=true`. Each
        SSE `event:` line carries the type and each `data:` line is this object as JSON. `sequence_number` increases
        only within this turn''s stream and is used by `starting_after`; it is unrelated to the event stream''s
        `seq`. `response.reasoning_summary_*` is sent only when the request carries reasoning.summary (phase 2).
        Not sent: `response.reasoning_text.*`, `response.refusal.*`, `response.output_text.annotation.added`, `response.web_search_call.*`,
        `response.file_search_call.*`, `response.code_interpreter_call.*`, `response.image_generation_call.*`. Clients
        skip `crew.*` events they do not know.'
      properties:
        type:
          enum:
          - response.created
          - response.queued
          - response.in_progress
          - response.completed
          - response.failed
          - response.incomplete
          - response.output_item.added
          - response.output_item.done
          - response.content_part.added
          - response.content_part.done
          - response.output_text.delta
          - response.output_text.done
          - response.function_call_arguments.delta
          - response.function_call_arguments.done
          - response.mcp_call.in_progress
          - response.mcp_call.completed
          - response.mcp_call.failed
          - response.reasoning_summary_part.added
          - response.reasoning_summary_part.done
          - response.reasoning_summary_text.delta
          - response.reasoning_summary_text.done
          - error
          - crew.notice
        sequence_number:
          type: integer
          minimum: 0
        response:
          $ref: '#/components/schemas/Response'
          description: For response.* lifecycle events.
        output_index:
          type: integer
        content_index:
          type: integer
        item_id:
          type: string
        item:
          $ref: '#/components/schemas/OutputItem'
        part:
          $ref: '#/components/schemas/OutputText'
        delta:
          type: string
        text:
          type: string
        arguments:
          type: string
        code:
          type: string
          description: Only on error.
        message:
          type: string
        level:
          enum:
          - info
          - warning
          description: Only on crew.notice.
        summary_index:
          type: integer
          description: Only on response.reasoning_summary_*.
      x-crew-sse-events:
      - response.created
      - response.queued
      - response.in_progress
      - response.completed
      - response.failed
      - response.incomplete
      - response.output_item.added
      - response.output_item.done
      - response.content_part.added
      - response.content_part.done
      - response.output_text.delta
      - response.output_text.done
      - response.function_call_arguments.delta
      - response.function_call_arguments.done
      - response.mcp_call.in_progress
      - response.mcp_call.completed
      - response.mcp_call.failed
      - response.reasoning_summary_part.added
      - response.reasoning_summary_part.done
      - response.reasoning_summary_text.delta
      - response.reasoning_summary_text.done
      - error
      - crew.notice
    Conversation:
      type: object
      required:
      - id
      - object
      - created_at
      properties:
        id:
          type: string
          pattern: ^conv_
        object:
          const: conversation
        created_at:
          $ref: '#/components/schemas/Timestamp'
        metadata:
          $ref: '#/components/schemas/Metadata'
        crew:
          type: object
          properties:
            title:
              type:
              - string
              - 'null'
            model:
              type: string
            latest_seq:
              type: integer
              description: This conversation stream's latest seq (for resync).
            status:
              enum:
              - idle
              - running
              - needs_approval
    CreateConversationRequest:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        items:
          type: array
          maxItems: 0
          items: {}
          description: Initial items are not accepted (they would put a conversation that never happened into history).
    UpdateConversationRequest:
      type: object
      required:
      - metadata
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
      additionalProperties: false
    ConversationItem:
      oneOf:
      - $ref: '#/components/schemas/MessageItem'
      - $ref: '#/components/schemas/FunctionCallItem'
      - $ref: '#/components/schemas/McpCallItem'
      - $ref: '#/components/schemas/McpApprovalRequestItem'
    ConversationList:
      allOf:
      - $ref: '#/components/schemas/ListEnvelope'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/Conversation'
    ConversationItemList:
      allOf:
      - $ref: '#/components/schemas/ListEnvelope'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/ConversationItem'
    InputItemList:
      allOf:
      - $ref: '#/components/schemas/ListEnvelope'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/ConversationItem'
    Model:
      type: object
      required:
      - id
      - object
      - owned_by
      properties:
        id:
          type: string
        object:
          const: model
        created:
          $ref: '#/components/schemas/Timestamp'
        owned_by:
          type: string
          description: '`crew`, or the connector''s client_id.'
        crew:
          type: object
          properties:
            kind:
              enum:
              - agent
              - bot
              - connector
            name:
              type: string
            description:
              type: string
    ModelList:
      type: object
      required:
      - object
      - data
      properties:
        object:
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/Model'
    Capabilities:
      type: object
      required:
      - api_version
      - features
      description: Filtered by the caller's permissions; a delegated credential sees only the agents it can use.
      properties:
        api_version:
          type: object
          properties:
            current:
              type: string
          description: current is this Kiro Crew's Crew API minor version, for display and troubleshooting only.
            Clients decide what they can use from features and agents, not by comparing version numbers.
        features:
          type: object
          additionalProperties:
            type: boolean
          properties:
            background:
              type: boolean
            client_tools:
              type: boolean
            mcp_tools:
              type: boolean
            approvals:
              type: boolean
            fork:
              type: boolean
            mid_turn_question:
              type: boolean
            instance_events:
              type: boolean
            webhooks:
              type: boolean
            file_uploads:
              type: boolean
              description: Whether POST /v1/files can be used (phase 2).
        agents:
          type: object
          additionalProperties:
            type: object
            properties:
              engine:
                type: string
              tools_closed_by_default:
                type: boolean
              input_modalities:
                type: array
                items:
                  enum:
                  - text
                  - image
                  - file
                description: The inputs this agent accepts; only text in phase 1.
              resumable_elsewhere:
                type: boolean
              structured_output:
                type: boolean
                description: 'Whether text.format: json_schema can be used.'
              reasoning_summary:
                type: array
                items:
                  enum:
                  - auto
                  - concise
                  - detailed
                description: The reasoning summary levels it can give; empty means none.
        limits:
          type: object
          properties:
            max_input_bytes:
              type: integer
            rate_limit_per_minute:
              type: integer
            max_concurrent_turns:
              type: integer
            max_queued_turns:
              type: integer
        quota:
          $ref: '#/components/schemas/Quota'
        retention_days:
          type: integer
          minimum: 1
          maximum: 365
          description: This crew's retention in days (30 by default). It decides how far back cursors, stream resumption
            and files reach.
    Quota:
      type: object
      description: This grant's quota and usage.
      properties:
        daily_credits:
          type: number
        used_credits:
          type: number
        reserved_credits:
          type: number
        resets_at:
          $ref: '#/components/schemas/Timestamp'
        max_turn_tokens:
          type: integer
        max_turn_tool_calls:
          type: integer
        max_turn_secs:
          type: integer
    InstanceInfo:
      type: object
      required:
      - id
      - form
      properties:
        id:
          type: string
        form:
          enum:
          - local
          - self_hosted
          - managed
          - team
        display_name:
          type: string
        timezone:
          type: string
        api_version:
          type: string
      description: Whether the crew is online is answered in front of the gateway (503 instance_unavailable when
        it is offline).
    Event:
      type: object
      required:
      - seq
      - event_id
      - type
      - created_at
      - data
      description: In-instance event. Types and fields are only ever added; clients skip unknown types but still
        advance their cursor.
      properties:
        seq:
          type: integer
          description: Strictly increasing within this stream. A conversation stream has one numbering per conversation;
            the instance stream is numbered separately for each grant, so an app cannot read activity elsewhere
            from the numbers. Gaps can still occur within one stream, and a client must not treat a gap as a loss.
        event_id:
          type: string
          pattern: ^evt_
          description: Globally unique; deduplicate across streams, push and replay by it.
        type:
          type: string
          enum:
          - conversation.created
          - conversation.updated
          - turn.started
          - message.created
          - tool.called
          - tool.completed
          - plan.updated
          - approval.requested
          - approval.decided
          - turn.completed
          - grant.revoked
          - notice
          - bot.reply
          - bot.turn.completed
          description: Open enum.
        conversation:
          type:
          - string
          - 'null'
          pattern: ^conv_
        response:
          type:
          - string
          - 'null'
          pattern: ^resp_
        created_at:
          $ref: '#/components/schemas/Timestamp'
        data:
          type: object
          additionalProperties: true
      x-crew-event-data:
        conversation.created:
          stream: instance stream
          data:
            type: object
            properties:
              title:
                type:
                - string
                - 'null'
              model:
                type: string
        conversation.updated:
          stream: instance stream
          data:
            type: object
            properties:
              latest_seq:
                type: integer
        turn.started:
          stream: conversation stream
          data:
            type: object
            properties: {}
        message.created:
          stream: conversation stream
          data:
            type: object
            properties:
              item_id:
                type: string
        tool.called:
          stream: conversation stream
          data:
            type: object
            properties:
              call_id:
                type: string
                description: The id of this tool call; tool.completed uses the same id.
              tool:
                type: string
              summary:
                type: string
        tool.completed:
          stream: conversation stream
          data:
            type: object
            properties:
              call_id:
                type: string
              tool:
                type: string
              status:
                enum:
                - completed
                - failed
                description: The status words are the same as ACP's. The tool's returned content is not included.
              reason:
                enum:
                - cancelled
                - refused
                - unknown
                description: Present only when failed and the crew log recorded one of these three; this mapping
                  is a proposal.
        plan.updated:
          stream: conversation stream
          data:
            type: object
            properties:
              items:
                type: array
                description: The agent's whole task list for this turn; the full list is sent every time and the
                  client replaces its copy.
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    text:
                      type: string
                    status:
                      enum:
                      - pending
                      - in_progress
                      - completed
                      description: Only pending and completed occur today; in_progress is kept for engines that
                        can report it later.
        approval.requested:
          stream: conversation stream, plus a hint on the instance stream
          data:
            type: object
            properties:
              approval_id:
                type: string
                pattern: ^apr_
              tool:
                type: string
              reason:
                type: string
              expires_at:
                $ref: '#/components/schemas/Timestamp'
              answerable_by_you:
                type: boolean
              approval_url:
                type: string
                format: uri
        approval.decided:
          stream: conversation stream, plus a hint on the instance stream
          data:
            type: object
            properties:
              approval_id:
                type: string
                pattern: ^apr_
              state:
                enum:
                - allowed
                - denied
                - expired
              expired_reason:
                enum:
                - timeout
                - turn_cancelled
              decided_by:
                type: object
                description: 'Who answered: which kind of client, never the token.'
                properties:
                  kind:
                    enum:
                    - owner
                    - first_party
                    - embed
                    - gateway
        turn.completed:
          stream: conversation stream
          data:
            type: object
            properties:
              result:
                enum:
                - completed
                - failed
                - cancelled
                - incomplete
        grant.revoked:
          stream: instance stream, only to the revoked grant
          data:
            type: object
            properties:
              grant_id:
                type: string
        notice:
          stream: instance stream
          data:
            type: object
            properties:
              level:
                enum:
                - info
                - warning
              text:
                type: string
        bot.reply:
          stream: instance stream, only to the grant that woke this turn
          data:
            type: object
            properties:
              bot:
                type: string
              wake_ref:
                type: string
              item_id:
                type: string
                description: Read the body with GET /v1/conversations/{id}/items, which needs conversations:read;
                  the event's conversation is this Bot's app-room conversation.
        bot.turn.completed:
          stream: instance stream, only to the grant that woke this turn
          data:
            type: object
            properties:
              bot:
                type: string
              wake_ref:
                type: string
              result:
                enum:
                - completed
                - failed
                - cancelled
                - incomplete
              usage:
                type: object
                properties:
                  input_tokens:
                    type: integer
                  output_tokens:
                    type: integer
                  credits:
                    type:
                    - number
                    - 'null'
                    description: null when the engine does not bill in credits.
    EventPage:
      type: object
      required:
      - events
      - latest_seq
      - has_more
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        latest_seq:
          type: integer
        oldest_seq:
          type: integer
        has_more:
          type: boolean
    ApprovalState:
      enum:
      - pending
      - allowed
      - denied
      - expired
      description: Only these four values are used. When a turn is cancelled, the approval it was waiting on becomes
        expired with reason turn_cancelled.
    ExpiredReason:
      enum:
      - timeout
      - turn_cancelled
    Approval:
      type: object
      required:
      - id
      - object
      - conversation
      - state
      - created_at
      properties:
        id:
          type: string
          pattern: ^apr_
          description: apr_ plus 128 random bits; unique across the instance.
        object:
          const: approval
        conversation:
          type: string
          pattern: ^conv_
        response:
          type:
          - string
          - 'null'
          pattern: ^resp_
        tool:
          type: string
        reason:
          type: string
          description: Redacted and truncated.
        state:
          $ref: '#/components/schemas/ApprovalState'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        decided_at:
          type:
          - integer
          - 'null'
        expired_reason:
          oneOf:
          - $ref: '#/components/schemas/ExpiredReason'
          - type: 'null'
          description: Only when state=expired.
        decided_by:
          type:
          - object
          - 'null'
          properties:
            kind:
              type: string
        answerable_by_you:
          type: boolean
        approval_url:
          type: string
          format: uri
          description: Address of the approval page (a proposal). The app hands it to the user, who signs in in
            a small window under the Kiro Crew host name and answers there. The app itself cannot answer.
    ApprovalList:
      allOf:
      - $ref: '#/components/schemas/ListEnvelope'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/Approval'
    ApprovalDecisionRequest:
      type: object
      required:
      - decision
      additionalProperties: false
      properties:
        decision:
          enum:
          - allow
          - deny
    Bot:
      type: object
      required:
      - id
      - object
      - name
      - status
      description: 'Roster and status, these fields only. It is the cut-down view apps get of the Owner tier''s
        BotRosterRow (GET /v1/crew/owner/bots): only id, name, description, avatar and status, and only the grant''s
        Bot range. Private chat (including the last line), briefing, rules, conversations and private memory are
        never here, and no Public operation returns them.'
      properties:
        id:
          type: string
          description: Also the model value for /v1/responses.
        object:
          const: bot
        name:
          type: string
        description:
          type: string
        avatar_url:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - idle
          - working
          description: working means this Bot has a turn running right now (in whichever conversation). Open enum;
            a client treats an unknown value as idle.
        created_by_app:
          type: boolean
          description: 'true: this app created the Bot (bundle.kind bot or bots:create), so it is in the app_created
            range.'
    BotWakeRequest:
      type: object
      required:
      - ref
      additionalProperties: false
      description: 'Only ref. There is no text field: the gateway writes the reminder.'
      properties:
        ref:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
          description: The number of that message in the app's own ledger. This character set cannot hold a sentence.
    BotWakeUsage:
      type: object
      description: Usage at the time of the wake, without this turn itself (that arrives with bot.turn.completed).
        Phase 1 has no grant quota, so credits_used_today and daily_credits are null.
      required:
      - bot_wakes_this_hour
      - bot_wake_limit_per_hour
      - grant_wakes_this_hour
      - grant_wake_limit_per_hour
      properties:
        bot_wakes_this_hour:
          type: integer
          description: How many times this grant woke this Bot in this hour, including this one.
        bot_wake_limit_per_hour:
          type: integer
          description: 20 by default (a proposal); the user can lower it.
        grant_wakes_this_hour:
          type: integer
        grant_wake_limit_per_hour:
          type: integer
          description: 120 by default (a proposal); the user can lower it.
        credits_used_today:
          type:
          - number
          - 'null'
        daily_credits:
          type:
          - number
          - 'null'
    BotWake:
      type: object
      required:
      - object
      - id
      - bot
      - ref
      - status
      - usage
      properties:
        object:
          const: bot.wake
        id:
          type: string
          pattern: ^wake_
        bot:
          type: string
        ref:
          type: string
          description: This wake's ref. After a merge, the Bot sees the latest ref when it wakes.
        status:
          type: string
          enum:
          - queued
          - coalesced
          - deferred
          description: 'queued: a new turn was queued; coalesced: merged into a turn already queued; deferred: the
            Bot is not online and runs it when it is back.'
        usage:
          $ref: '#/components/schemas/BotWakeUsage'
    BotList:
      allOf:
      - $ref: '#/components/schemas/ListEnvelope'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/Bot'
    KeyResult:
      type: object
      required:
      - id
      - text
      - target
      properties:
        id:
          type: string
        text:
          type: string
        target:
          type: string
        current:
          type:
          - string
          - 'null'
        updated_at:
          type:
          - integer
          - 'null'
        goal_ids:
          type: array
          items:
            type: string
        history:
          type: array
          items:
            type: object
            properties:
              at:
                $ref: '#/components/schemas/Timestamp'
              value:
                type: string
    BotGoals:
      type: object
      required:
      - bot
      - goals
      - key_results
      properties:
        bot:
          type: string
        goals:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              number:
                type: integer
              text:
                type: string
        key_results:
          type: array
          items:
            $ref: '#/components/schemas/KeyResult'
    BotReport:
      type: object
      required:
      - id
      - kind
      - title
      - created_at
      description: bots:read is enough to read report bodies; artifacts:read is not needed.
      properties:
        id:
          type: string
        kind:
          enum:
          - weekly
          - monthly
        title:
          type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'
        format:
          enum:
          - markdown
          - html
        content:
          type: string
          description: Returned with include=content.
    BotReportList:
      allOf:
      - $ref: '#/components/schemas/ListEnvelope'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/BotReport'
    ArtifactKind:
      enum:
      - markdown
      - html
      - widget
      - svg
      - json
      - text
      description: html and widget artifacts created by third parties are shown in the Kiro panel inside a frame
        that cannot run scripts, always labelled "from <app name>".
    Artifact:
      type: object
      required:
      - id
      - object
      - name
      - kind
      - version
      - created_at
      properties:
        id:
          type: string
          description: Today's slug.
        object:
          const: artifact
        name:
          type: string
        kind:
          $ref: '#/components/schemas/ArtifactKind'
        description:
          type: string
        tags:
          type: array
          maxItems: 16
          items:
            type: string
        version:
          type: integer
        content:
          type: string
          description: Returned only when reading a single artifact.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    ArtifactList:
      allOf:
      - $ref: '#/components/schemas/ListEnvelope'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/Artifact'
    CreateArtifactRequest:
      type: object
      required:
      - name
      - content
      properties:
        name:
          type: string
        content:
          type: string
        kind:
          $ref: '#/components/schemas/ArtifactKind'
        description:
          type: string
        tags:
          type: array
          maxItems: 16
          items:
            type: string
      description: The `webapp` and `dashboard` kinds are not open to third parties.
    UpdateArtifactRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
        content:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
      description: Changing content creates a new version.
    ArtifactVersion:
      type: object
      required:
      - version
      - created_at
      properties:
        version:
          type: integer
        created_at:
          $ref: '#/components/schemas/Timestamp'
        source:
          type: string
    ArtifactVersionList:
      allOf:
      - $ref: '#/components/schemas/ListEnvelope'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/ArtifactVersion'
    Comment:
      type: object
      required:
      - id
      - text
      - created_at
      properties:
        id:
          type: string
        text:
          type: string
        parent_id:
          type:
          - string
          - 'null'
        author:
          type: object
          properties:
            kind:
              enum:
              - user
              - app
              - agent
            name:
              type: string
        status:
          enum:
          - open
          - review
          - resolved
        created_at:
          $ref: '#/components/schemas/Timestamp'
    CommentList:
      allOf:
      - $ref: '#/components/schemas/ListEnvelope'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/Comment'
    CreateCommentRequest:
      type: object
      required:
      - text
      properties:
        text:
          type: string
          maxLength: 10000
        parent_id:
          type: string
          description: Reply to a comment.
    CreateNotificationRequest:
      type: object
      required:
      - title
      description: Dashboard bell only; the panel always labels it "from <app name>" and the app cannot change that
        label. Channels such as Slack need the owner.
      properties:
        title:
          type: string
          maxLength: 500
        body:
          type: string
          maxLength: 20000
        priority:
          enum:
          - default
          - passive
          description: Third parties cannot send critical.
        group_key:
          type: string
        conversation:
          type: string
          pattern: ^conv_
    Notification:
      type: object
      required:
      - id
      - object
      - created_at
      properties:
        id:
          type: string
          pattern: ^ntf_
        object:
          const: notification
        created_at:
          $ref: '#/components/schemas/Timestamp'
    ScheduleSpec:
      type: object
      description: Exactly one of these.
      properties:
        every_secs:
          type: integer
          minimum: 60
        cron:
          type: string
          description: Five-field cron expression.
        at:
          $ref: '#/components/schemas/Timestamp'
        timezone:
          type: string
          description: IANA time zone. Defaults to the user's time zone.
      oneOf:
      - required:
        - every_secs
      - required:
        - cron
      - required:
        - at
    Schedule:
      type: object
      required:
      - id
      - object
      - name
      - schedule
      - status
      properties:
        id:
          type: string
          pattern: ^sch_
        object:
          const: schedule
        name:
          type: string
        model:
          type: string
        message:
          type: string
        schedule:
          $ref: '#/components/schemas/ScheduleSpec'
        status:
          enum:
          - active
          - paused
        next_run_at:
          type:
          - integer
          - 'null'
        last_run:
          type:
          - object
          - 'null'
          properties:
            at:
              $ref: '#/components/schemas/Timestamp'
            status:
              enum:
              - ok
              - error
              - skipped_quota
            response:
              type: string
              pattern: ^resp_
        created_at:
          $ref: '#/components/schemas/Timestamp'
    ScheduleList:
      allOf:
      - $ref: '#/components/schemas/ListEnvelope'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/Schedule'
    CreateScheduleRequest:
      type: object
      required:
      - name
      - model
      - message
      - schedule
      description: Runs only an agent message; scripts and shell commands are not available (the script and command
        modes of today's cron are not opened).
      properties:
        name:
          type: string
        model:
          type: string
          description: The agent id of this app's capability bundle, or a Bot id the grant allows. With a Bot, every
            trigger runs under the rules for conversations that use a Bot as the model.
        message:
          type: string
        schedule:
          $ref: '#/components/schemas/ScheduleSpec'
        conversation:
          type: string
          pattern: ^conv_
          description: Run in an existing conversation; omit to start a new one each time.
    UpdateScheduleRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
        message:
          type: string
        schedule:
          $ref: '#/components/schemas/ScheduleSpec'
        status:
          enum:
          - active
          - paused
    ScheduleRun:
      type: object
      required:
      - schedule
      - response
      properties:
        schedule:
          type: string
        response:
          type: string
          pattern: ^resp_
    WorkflowRun:
      type: object
      required:
      - id
      - object
      - status
      - created_at
      properties:
        id:
          type: string
          pattern: ^wfr_
        object:
          const: workflow.run
        workflow:
          type:
          - string
          - 'null'
          description: Slug of a saved workflow.
        status:
          enum:
          - queued
          - running
          - finished
          - failed
          - cancelled
        created_at:
          $ref: '#/components/schemas/Timestamp'
        finished_at:
          type:
          - integer
          - 'null'
        result:
          description: The workflow's return value; its shape is defined by the workflow.
        error:
          type:
          - string
          - 'null'
        usage:
          $ref: '#/components/schemas/Usage'
    WorkflowRunList:
      allOf:
      - $ref: '#/components/schemas/ListEnvelope'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/WorkflowRun'
    CreateWorkflowRunRequest:
      type: object
      required:
      - workflow
      description: Only saved workflows the user marked "allow third parties"; source and intent are not accepted.
        Anything else gets 404.
      properties:
        workflow:
          type: string
        args:
          type: object
        input:
          type: string
        budget_total:
          type: integer
          description: Token ceiling; cannot exceed the grant quota.
    RecallResult:
      type: object
      required:
      - results
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              text:
                type: string
              source:
                type: string
              score:
                type: number
    KnowledgeResult:
      type: object
      required:
      - results
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              snippet:
                type: string
              source_id:
                type: string
              score:
                type: number
    WebhookEventType:
      enum:
      - turn.completed
      - approval.requested
      - grant.revoked
      description: Open enum; the first set is provisional.
    Webhook:
      type: object
      required:
      - id
      - object
      - url
      - events
      description: 'Subscription: selects event types only. The address comes only from the callbacks.webhook_url
        the user consented to.'
      properties:
        id:
          type: string
          pattern: ^whk_
        object:
          const: webhook
        url:
          type: string
          format: uri
          readOnly: true
          description: The manifest's callbacks.webhook_url; read only.
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    WebhookDelivery:
      type: object
      required:
      - id
      - type
      - created_at
      - grant_id
      description: Callback body. Ids only, no content; read content through the API.
      properties:
        id:
          type: string
          pattern: ^evt_
        type:
          $ref: '#/components/schemas/WebhookEventType'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        grant_id:
          type: string
        conversation:
          type:
          - string
          - 'null'
        response:
          type:
          - string
          - 'null'
    WebhookList:
      allOf:
      - $ref: '#/components/schemas/ListEnvelope'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/Webhook'
    CreateWebhookRequest:
      type: object
      required:
      - events
      additionalProperties: false
      description: url is not accepted.
      properties:
        events:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WebhookEventType'
    Deleted:
      type: object
      required:
      - id
      - deleted
      properties:
        id:
          type: string
        object:
          type: string
        deleted:
          const: true
    ToolError:
      type: object
      required:
      - isError
      - content
      - structuredContent
      description: 'Not an HTTP response: the MCP tool result the crew''s MCP proxy returns when a capability bundle
        was removed, the site took its token back or the grant is paused.'
      properties:
        isError:
          const: true
        content:
          type: array
          items:
            type: object
            required:
            - type
            - text
            properties:
              type:
                const: text
              text:
                type: string
        structuredContent:
          type: object
          required:
          - error
          properties:
            error:
              type: object
              required:
              - type
              - code
              properties:
                type:
                  $ref: '#/components/schemas/ErrorType'
                code:
                  enum:
                  - tools_removed
                  - tools_revoked_by_app
                  - grant_paused
      example:
        isError: true
        content:
        - type: text
          text: Removed from this crew; nothing was sent to Notely.
        structuredContent:
          error:
            type: not_found_error
            code: tools_removed
    Entitlement:
      enum:
      - memory.read
      - memory.global
      - knowledge.read
      - workflows.run
      - schedules.manage
      - notifications.send
      - quota.elevated
      - bots.create
      description: 'What Kiro allows an app to ask for. It is a second gate beside scope: an entitlement decides
        whether the app may ask, a scope whether the user granted it. The crew checks ent from phase 1 on; phase
        1 has only local-development entitlements, which an owner sets for apps they registered themselves; review
        by Kiro starts in phase 2. Open enum.'
      x-crew-meanings:
        memory.read: May request the scope memory:read
        memory.global: May let the user set the grant's memory_global to true (memory.read and memory:read are also
          needed)
        knowledge.read: May request the scope knowledge:read
        workflows.run: May request the scope workflows:run
        schedules.manage: May request the scope schedules:manage
        notifications.send: May request the scope notifications:send (push notifications)
        quota.elevated: The elevated tier, at most 500 credits a day (the manifest's requested_quota)
        bots.create: The bundle may have kind bot and create a Bot with private memory in the user's crew.
    InputImage:
      type: object
      description: Image input (phase 2). Exactly one of `image_url` and `file_id`. When the agent's `input_modalities`
        does not include image, 422 capability_unavailable.
      oneOf:
      - type: object
        required:
        - type
        - image_url
        properties:
          type:
            const: input_image
          detail:
            enum:
            - auto
            - low
            - high
            default: auto
          image_url:
            type: string
            description: 'An https address or a data: URI; the gateway fetches it itself and does not follow internal
              addresses.'
      - type: object
        required:
        - type
        - file_id
        properties:
          type:
            const: input_image
          detail:
            enum:
            - auto
            - low
            - high
            default: auto
          file_id:
            type: string
            pattern: ^file_
            description: A file uploaded with POST /v1/files; only one this grant uploaded.
    InputFile:
      type: object
      required:
      - type
      - file_id
      description: File input (phase 2). Only file_id is accepted. When the agent's `input_modalities` does not
        include file, 422 capability_unavailable.
      properties:
        type:
          const: input_file
        file_id:
          type: string
          pattern: ^file_
          description: A file uploaded with POST /v1/files; only one this grant uploaded.
    InputContentPart:
      oneOf:
      - $ref: '#/components/schemas/InputText'
      - $ref: '#/components/schemas/InputImage'
      - $ref: '#/components/schemas/InputFile'
      discriminator:
        propertyName: type
        mapping:
          input_text: '#/components/schemas/InputText'
          input_image: '#/components/schemas/InputImage'
          input_file: '#/components/schemas/InputFile'
    ReasoningItem:
      type: object
      required:
      - type
      - id
      - summary
      description: Reasoning summary (phase 2). Present only when the request carries reasoning.summary.
      properties:
        type:
          const: reasoning
        id:
          type: string
        status:
          enum:
          - in_progress
          - completed
          - incomplete
        summary:
          type: array
          items:
            type: object
            required:
            - type
            - text
            properties:
              type:
                const: summary_text
              text:
                type: string
    File:
      type: object
      required:
      - id
      - object
      - bytes
      - created_at
      - expires_at
      - filename
      - purpose
      properties:
        id:
          type: string
          pattern: ^file_
        object:
          const: file
        bytes:
          type: integer
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        filename:
          type: string
        mime_type:
          type: string
        purpose:
          const: user_data
    CreateFileRequest:
      type: object
      required:
      - file
      - purpose
      properties:
        file:
          type: string
          format: binary
          description: One file, at most 20 MB.
        purpose:
          const: user_data
    BotRoster:
      type: object
      required:
      - members
      description: The full Bot roster as the owner sees it (GET /v1/crew/owner/bots, which wraps GET /api/members).
        One row per global Bot, with its private chat with the owner, its configuration and its live state. The
        Public GET /v1/crew/bots is the cut-down view apps get (Bot).
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/BotRosterRow'
          description: Field names follow what GET /api/members returns today; the wrapper does not change the shape.
    BotRosterRow:
      type: object
      required:
      - name
      - slug
      - slot_key
      - running
      additionalProperties: true
      description: One roster row. The fields are the ones GET /api/members returns today; the Owner tier is experimental,
        so fields can be added later. Free text other than name and slug goes through the gateway's redaction and
        can be replaced as a whole.
      properties:
        name:
          type: string
          description: The Bot's name; every per-Bot route uses it as the key.
        slug:
          type: string
          description: The path-safe form of the name.
        slot_key:
          type: string
          description: The session key of the private chat with the owner; an empty string while that chat has not
            been opened.
        running:
          type: boolean
          description: The private chat has a turn running right now.
        display_name:
          type: string
        description:
          type: string
        kiro_agent:
          type: string
        workspace:
          type: string
        memory_store:
          type: string
        memory_version:
          type:
          - integer
          - 'null'
        memory_owner:
          type: string
        model:
          type: string
        reasoning_effort:
          type: string
        approval_mode:
          type: string
        worker_model:
          type: string
        worker_reasoning_effort:
          type: string
        dynamic_capabilities:
          type: boolean
        avatar:
          type: object
        source:
          type: string
        starred:
          type: boolean
        star_order:
          type: integer
        dashboard_created:
          type: boolean
        last_active_ts:
          type: number
        last_message:
          type: string
          description: The last line of the private chat. Owner tier only; the Public Bot never has it.
        has_dm_message:
          type: boolean
        projections:
          type: object
    GrantSelf:
      type: object
      required:
      - id
      - object
      - client_id
      - kind
      - scopes
      - status
      - created_at
      description: 'The app''s view of its own grant: which scopes it has, which Bots it may use, its quota and
        status, and the reason when it is paused. Only this grant; other apps are not visible.'
      properties:
        id:
          type: string
          pattern: ^grt_
        object:
          const: grant
        client_id:
          type: string
        kind:
          enum:
          - remote
          - local
          description: 'remote: issued by the Kiro authorization service; local: local authorization, issued by
            this gateway.'
        scopes:
          type: array
          items:
            type: string
        entitlements:
          type: array
          items:
            $ref: '#/components/schemas/Entitlement'
        bots:
          type: object
          properties:
            mode:
              enum:
              - selected
              - app_created
              - all
            ids:
              type: array
              items:
                type: string
        status:
          enum:
          - active
          - throttled
          - paused
          description: After a revocation the token stops working and this object cannot be read (401 token_revoked).
        pause:
          type:
          - object
          - 'null'
          description: 'Only when paused: who paused it, a reason a person can read, and when. The app uses it to
            tell the user why it stopped.'
          properties:
            by:
              enum:
              - monitor
              - user
              - reconsent
              - entitlement
            reason:
              type: string
            at:
              $ref: '#/components/schemas/Timestamp'
        quota:
          $ref: '#/components/schemas/Quota'
        memory_global:
          type: boolean
        created_at:
          $ref: '#/components/schemas/Timestamp'
    CreateBotRequest:
      type: object
      required:
      - template
      additionalProperties: false
      description: Create a helper Bot. The prompt and tools come from a template in the manifest that the user
        consented to; the request cannot carry prompt text or choose a model.
      properties:
        template:
          type: string
          description: A template name in the manifest's bundle.bot_templates.
        name:
          type: string
          maxLength: 80
          description: Display name; the template's name when omitted.
    RecallRequest:
      type: object
      required:
      - query
      additionalProperties: false
      properties:
        query:
          type: string
          maxLength: 2000
          description: Search query.
        limit:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
    KnowledgeSearchRequest:
      type: object
      required:
      - query
      additionalProperties: false
      properties:
        query:
          type: string
          maxLength: 2000
          description: Search query.
        limit:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
  headers:
    WWW-Authenticate:
      description: Sent on every 401. The value is `Bearer error="invalid_token"` (RFC 6750). It tells the client
        to get a new credential, as opposed to lacking permission.
      schema:
        type: string
        example: Bearer error="invalid_token"
    X-Request-Id:
      description: One id per request, supplied by the caller or an intermediary, or generated by the gateway. Also
        written to the audit log and the error body.
      schema:
        type: string
        pattern: ^req_
    Crew-API-Version:
      description: The server's minor version, for example 1.3.
      schema:
        type: string
    X-Crew-Quota-Limit:
      description: This grant's daily credit ceiling. Sent on every response to a delegated-credential request,
        success or failure; not sent for the embed credential.
      schema:
        type: number
    X-Crew-Quota-Remaining:
      description: Credits left today (reservations already subtracted).
      schema:
        type: number
    X-Crew-Quota-Reset:
      description: When the quota resets, Unix seconds.
      schema:
        type: integer
    Retry-After:
      description: Seconds to wait before retrying. Not sent with grant_paused.
      schema:
        type: integer
    X-Crew-Signature:
      description: 'Callback signature: sha256=<hex>, where <hex> is the lowercase hex HMAC-SHA256 of timestamp
        + "." + raw_body (timestamp is the X-Crew-Timestamp value, raw_body the exact request body) under the app''s
        webhook secret. The secret is issued once when the app is registered and can be rotated.'
      schema:
        type: string
        pattern: ^sha256=[0-9a-f]{64}$
    X-Crew-Timestamp:
      description: Callback time in Unix seconds. Receivers reject anything older than 5 minutes.
      schema:
        type: integer
    Deprecation:
      description: Sent on anything being deprecated (RFC 9745).
      schema:
        type: string
  parameters:
    CrewApiVersion:
      name: Crew-API-Version
      in: header
      required: false
      description: The minor version the client was written for. Without it, the server answers with 1.0 behaviour.
        The server never refuses a request because this version is old.
      schema:
        type: string
        example: '1.3'
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: A caller may supply its own; an id assigned by an intermediary in front of the gateway wins.
      schema:
        type: string
    After:
      name: after
      in: query
      required: false
      schema:
        type: string
      description: Start after this id.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Accepted by every Public POST. Within one grant, a retry with the same key within 24 hours returns
        the first result (the same object id) and is neither run again nor charged again; the same key with a different
        body is 422 idempotency_key_reused.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    Order:
      name: order
      in: query
      required: false
      schema:
        enum:
        - asc
        - desc
        default: desc
  responses:
    BadRequest:
      description: '400: invalid_request, unsupported_parameter, unsupported_tool_type. Carries X-Crew-Quota-* on
        delegated-credential requests.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Crew-API-Version:
          $ref: '#/components/headers/Crew-API-Version'
        X-Crew-Quota-Limit:
          $ref: '#/components/headers/X-Crew-Quota-Limit'
        X-Crew-Quota-Remaining:
          $ref: '#/components/headers/X-Crew-Quota-Remaining'
        X-Crew-Quota-Reset:
          $ref: '#/components/headers/X-Crew-Quota-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_request:
              summary: Malformed field.
              value:
                error:
                  type: invalid_request_error
                  code: invalid_request
                  message: Malformed field.
                  param: null
                  request_id: req_01JBXQ4K7Y2M
            unsupported_parameter:
              summary: A field this API refuses.
              value:
                error:
                  type: invalid_request_error
                  code: unsupported_parameter
                  message: A field this API refuses.
                  param: null
                  request_id: req_01JBXQ4K7Y2M
            unsupported_tool_type:
              summary: An unsupported tool type.
              value:
                error:
                  type: invalid_request_error
                  code: unsupported_tool_type
                  message: An unsupported tool type.
                  param: null
                  request_id: req_01JBXQ4K7Y2M
    BadRequestNoQuota:
      description: '400: invalid_request, unsupported_parameter, unsupported_tool_type. For embed-credential endpoints:
