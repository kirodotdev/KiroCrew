  headers:
    X-Request-Id:
      description: One id per request, supplied by the caller or an intermediary, or generated by the gateway. Also
        written to the audit log and the error body.
      schema:
        type: string
        pattern: ^req_
    Crew-API-Version:
      description: The server's minor version, for example 1.3.
      schema:
        type: string
    X-Crew-Quota-Limit:
      description: This grant's daily credit ceiling. Sent on every response to a delegated-credential request,
        success or failure; not sent for the embed credential.
      schema:
        type: number
    X-Crew-Quota-Remaining:
      description: Credits left today (reservations already subtracted).
      schema:
        type: number
    X-Crew-Quota-Reset:
      description: When the quota resets, Unix seconds.
      schema:
        type: integer
    Retry-After:
      description: Seconds to wait before retrying. Not sent with grant_paused.
      schema:
        type: integer
    X-Crew-Signature:
      description: 'Callback signature: sha256=<hex>, where <hex> is the lowercase hex HMAC-SHA256 of timestamp
        + "." + raw_body (timestamp is the X-Crew-Timestamp value, raw_body the exact request body) under the app''s
        webhook secret. The secret is issued once when the app is registered and can be rotated; how it is issued
        is out of scope for this API.'
      schema:
        type: string
    X-Crew-Timestamp:
      description: Callback time in Unix seconds. Receivers reject anything older than 5 minutes.
      schema:
        type: integer
    Deprecation:
      description: Sent on anything being deprecated (RFC 9745).
      schema:
        type: string
  parameters:
    CrewApiVersion:
      name: Crew-API-Version
      in: header
      required: false
      description: The minor version the client declares. Without it, the server's lowest supported minor version
        is assumed.
      schema:
        type: string
        example: '1.3'
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: A caller may supply its own; an id assigned by an intermediary in front of the gateway wins.
      schema:
        type: string
    After:
      name: after
      in: query
      required: false
      schema:
        type: string
      description: Start after this id.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Accepted on POSTs that spend credits. Within one grant, a retry with the same key within 24 hours
        returns the first result and is not charged again; the same key with a different body gets 422 idempotency_key_reused.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    Order:
      name: order
      in: query
      required: false
      schema:
        enum:
        - asc
        - desc
        default: desc
  responses:
    BadRequest:
      description: '400: invalid_request, unsupported_parameter, unsupported_tool_type, unsupported_api_version.
        Carries X-Crew-Quota-* on delegated-credential requests.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Crew-API-Version:
          $ref: '#/components/headers/Crew-API-Version'
        X-Crew-Quota-Limit:
          $ref: '#/components/headers/X-Crew-Quota-Limit'
        X-Crew-Quota-Remaining:
          $ref: '#/components/headers/X-Crew-Quota-Remaining'
        X-Crew-Quota-Reset:
          $ref: '#/components/headers/X-Crew-Quota-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_request:
              summary: Malformed field.
              value:
                error:
                  type: invalid_request_error
                  code: invalid_request
                  message: Malformed field.
                  param: null
                  request_id: req_01JBXQ4K7Y2M
            unsupported_parameter:
              summary: A field this API refuses.
              value:
                error:
                  type: invalid_request_error
                  code: unsupported_parameter
                  message: A field this API refuses.
                  param: null
                  request_id: req_01JBXQ4K7Y2M
            unsupported_tool_type:
              summary: An unsupported tool type.
              value:
                error:
                  type: invalid_request_error
                  code: unsupported_tool_type
                  message: An unsupported tool type.
                  param: null
                  request_id: req_01JBXQ4K7Y2M
            unsupported_api_version:
              summary: The client's declared minor version is below the lowest the server supports.
              value:
                error:
                  type: invalid_request_error
                  code: unsupported_api_version
                  message: The client's declared minor version is below the lowest the server supports.
                  param: null
                  request_id: req_01JBXQ4K7Y2M
                  supported:
                    min: '1.2'
                    max: '1.4'
    BadRequestNoQuota:
      description: '400: invalid_request, unsupported_parameter, unsupported_tool_type, unsupported_api_version.
        For embed-credential endpoints: no quota headers.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Crew-API-Version:
          $ref: '#/components/headers/Crew-API-Version'
      content:
        application/json:
          schema:
