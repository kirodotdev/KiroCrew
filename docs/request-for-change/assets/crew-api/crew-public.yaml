            X-Crew-Quota-Remaining:
              $ref: ./components.yaml#/components/headers/X-Crew-Quota-Remaining
            X-Crew-Quota-Reset:
              $ref: ./components.yaml#/components/headers/X-Crew-Quota-Reset
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Response
              example:
                id: resp_01JBX9
                object: response
                created_at: 1761822000
                status: completed
                model: agent_writer
                conversation:
                  id: conv_01JBX8
                output:
                - type: message
                  id: msg_01
                  role: assistant
                  status: completed
                  content:
                  - type: output_text
                    text: Done.
                    annotations: []
                usage: null
                metadata: {}
                crew:
                  ignored_parameters:
                  - temperature
            text/event-stream:
              schema:
                type: string
                description: 'SSE. Each data: line is one ResponseStreamEvent JSON object.'
              x-crew-sse-data:
                $ref: ./components.yaml#/components/schemas/ResponseStreamEvent
              x-crew-sse-events:
              - response.created
              - response.queued
              - response.in_progress
              - response.completed
              - response.failed
              - response.incomplete
              - response.output_item.added
              - response.output_item.done
              - response.content_part.added
              - response.content_part.done
              - response.output_text.delta
              - response.output_text.done
              - response.function_call_arguments.delta
              - response.function_call_arguments.done
              - response.mcp_call.in_progress
              - response.mcp_call.completed
              - response.mcp_call.failed
              - error
              - crew.notice
              example: |
                event: response.created
                data: {"type":"response.created","sequence_number":0,"response":{"id":"resp_01JBX9","object":"response","status":"in_progress"}}

                event: response.output_text.delta
                data: {"type":"response.output_text.delta","sequence_number":4,"item_id":"msg_01","output_index":0,"content_index":0,"delta":"Done"}

                event: response.completed
                data: {"type":"response.completed","sequence_number":9,"response":{"id":"resp_01JBX9","object":"response","status":"completed"}}
        '401':
          $ref: ./components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/components/responses/Forbidden
        '404':
          $ref: ./components.yaml#/components/responses/NotFound
        '429':
          $ref: ./components.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/components/responses/InternalError
        '503':
          $ref: ./components.yaml#/components/responses/InstanceUnavailable
      x-crew-tier: public
      x-crew-scope: conversations:read
      x-crew-reuses:
      - None; new work.
      x-crew-coverage: partial
      x-crew-depends-on:
      - Q1 event and stream retention
      description: Stream events must be stored to allow resuming; how long is an open question.
  /v1/responses/{response_id}/cancel:
