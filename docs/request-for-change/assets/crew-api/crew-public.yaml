  /v1/crew/events:
    get:
      operationId: get_v1_crew_events
      summary: In-instance event stream (conversation stream or instance stream)
      tags:
      - events
      security:
      - delegatedCredential:
        - conversations:read
      - delegatedCredential:
        - instance:read
      - delegatedCredential:
        - bots:wake
      - firstPartySession: []
      parameters:
      - $ref: ./components.yaml#/components/parameters/CrewApiVersion
      - $ref: ./components.yaml#/components/parameters/RequestId
      - name: conversation
        in: query
        required: false
        description: With it, a conversation stream; without it, the instance stream.
        schema:
          type: string
          pattern: ^conv_
      - name: bot
        in: query
        required: false
        description: 'Instance stream only: receive bot.reply and bot.turn.completed for these Bots only; may be
          repeated. Needs bots:wake; each one must be in the grant''s Bot range, else 404. Only turns this grant
          woke are sent.'
        style: form
        explode: true
        schema:
          type: array
          maxItems: 50
          items:
            type: string
      - name: since
        in: query
        required: false
        description: 'Cursor: the last seq the client processed. Without it, only new events are sent.'
        schema:
          type: integer
          minimum: 0
      - name: limit
        in: query
        required: false
        description: Page size for paged JSON; 0 returns only latest_seq.
        schema:
          type: integer
          minimum: 0
          maximum: 1000
          default: 100
      - name: wait
        in: query
        required: false
        description: Long-poll seconds for paged JSON.
        schema:
          type: integer
          minimum: 0
          maximum: 30
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          type: string
        description: Sent by the browser on SSE reconnect; same as since.
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: ./components.yaml#/components/headers/X-Request-Id
            Crew-API-Version:
              $ref: ./components.yaml#/components/headers/Crew-API-Version
            X-Crew-Quota-Limit:
              $ref: ./components.yaml#/components/headers/X-Crew-Quota-Limit
            X-Crew-Quota-Remaining:
              $ref: ./components.yaml#/components/headers/X-Crew-Quota-Remaining
            X-Crew-Quota-Reset:
              $ref: ./components.yaml#/components/headers/X-Crew-Quota-Reset
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/EventPage
            text/event-stream:
              schema:
                type: string
                description: 'SSE. Each data: line is one Event JSON object.'
              x-crew-sse-data:
                $ref: ./components.yaml#/components/schemas/Event
              x-crew-sse-events:
              - conversation.created
              - conversation.updated
              - turn.started
              - message.created
              - tool.called
              - tool.completed
              - plan.updated
              - approval.requested
              - approval.decided
              - turn.completed
              - grant.revoked
              - notice
              - bot.reply
              - bot.turn.completed
              example: |
                id: 43
                event: approval.requested
                data: {"seq":43,"event_id":"evt_01JBX","type":"approval.requested","conversation":"conv_01JBX8","response":"resp_01JBX9","created_at":1761822000,"data":{"approval_id":"apr_9f3c","tool":"docs.publish","reason":"Publish the document","answerable_by_you":false}}

                : keepalive
        '401':
          $ref: ./components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/components/responses/Forbidden
        '404':
          $ref: ./components.yaml#/components/responses/NotFound
        '410':
          $ref: ./components.yaml#/components/responses/ResyncRequired
        '429':
          $ref: ./components.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/components/responses/InternalError
        '503':
          $ref: ./components.yaml#/components/responses/InstanceUnavailable
      x-crew-tier: public
      x-crew-scope:
      - conversations:read
      - instance:read
      - bots:wake
      x-crew-phase: 1a
      x-crew-reuses:
      - src/kiro_crew/crew_log/read.py:559 (read_page)
      x-crew-coverage: done
      description: 'Filtered by the scopes held: conversations:read receives events of this grant''s conversations;
        instance:read receives instance-level notices sent to this grant that belong to no conversation; bots:wake
        receives the Bot events of the turns this grant woke. A credential receives each class it holds a scope
        for; with none of them, 403 insufficient_scope. With Accept: text/event-stream the answer is SSE: each message''s
        id: is the seq and event: is the type, and a comment line every 15 seconds keeps an idle connection alive.
        Otherwise the answer is paged JSON. An event is stored before it is sent; a slow client is disconnected
        instead of losing events. One user, one crew and one grant may hold at most 10 concurrent streams in total,
        and refreshing the access token does not reset the count; the whole crew also has a ceiling, crew_api.max_event_streams
        (configurable, default 100). Past either, 429 concurrency_limit. Retention: stored responses (with the stream
        events used to resume), the event index, resolved approvals and uploaded files are all kept 30 days by default;
        the owner can set `crew_api.retention_days` in the crew settings to 1 to 365 days. Deleting a conversation
        deletes its responses and events. When since is older than the oldest retained event, 410 resync_required
        with oldest_seq and latest_seq in the body. The instance stream is numbered separately for each grant.'
