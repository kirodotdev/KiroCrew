components:
  securitySchemes:
    delegatedCredential:
      type: http
      scheme: bearer
      description: 'A bearer credential an app holds on the user''s behalf. Two issuers produce it with the same
        claims: (1) the Kiro authorization service, for apps that reach the crew from another machine; (2) local
        authorization, where a client on the same machine runs authorization code + PKCE against this gateway on
        a loopback redirect and the gateway signs the token with a local key. The token carries the claims scope
        (what the user consented to) and ent (the app''s entitlements, an array of strings, see x-crew-entitlements;
        a grant from local authorization starts with only the scopes that need no entitlement). The gateway checks
        ent before scope: a missing entitlement is 403 entitlement_required, an entitlement without the scope is
        403 insufficient_scope. How credentials are issued, refreshed and revoked is out of scope for this API.'
    firstPartySession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The user's own first-party sign-in (owner, official app, control panel, CLI). Holds every scope.
    embedCredential:
      type: apiKey
      in: cookie
      name: crew_embed
      description: 'The embed credential: a partitioned cookie inside the embedded frame (Partitioned; Secure; SameSite=None;
        HttpOnly). It represents the user and can only answer approvals in the connector conversation it is bound
        to. The cookie name is a placeholder.'
    embedCredentialHeader:
      type: apiKey
      in: header
      name: X-Crew-Embed-Credential
      description: Fallback when the browser refuses the partitioned cookie; the gateway accepts this header only
        on the approval endpoint.
x-crew-scopes:
  responses:write: Open conversations, run a turn, cancel its own turns, delete the conversations it opened; read
    the responses it created
  conversations:read: Read the conversations this grant opened, their events and approvals (read only)
  instance:read: Receive instance-level notices sent to this grant that belong to no conversation
  webhooks:manage: Choose the event types to be called back for; the address comes from the manifest (phase 3)
  bots:chat: Chat with the Bots in the grant's range (unchecked by default on the consent page). In such a conversation
    the Bot has none of its usual tools, reads no private memory, and its briefing and rules are not in the prompt.
  bots:read: 'Read only: the roster and status of the Bots in the grant''s range, and their goals, key results,
    progress and reports (with body). No private chat, briefing or rules.'
  bots:wake: Wake a Bot in the grant's range, passing only a reference number ref; the gateway writes a fixed reminder;
    rate limited per Bot and per grant (unchecked by default)
  bots:create: Create helper Bots such as a secretary or a reviewer (POST /v1/crew/bots). The prompt and tools come
    from a template in the manifest and the owner picks the model; needs the entitlement bots.create (unchecked
    by default)
  artifacts:read: Read this grant's artifacts and comments
  artifacts:write: Write this grant's artifacts and comments
  notifications:send: Notify the user (dashboard bell only; 10 per hour per grant by default)
  schedules:manage: This grant's schedules (unchecked by default)
  workflows:run: Start saved workflows the user marked "allow third parties" (unchecked by default)
  memory:read: Memory recall; Global memory is readable only with the grant's Global switch on as well (unchecked
    by default, and shown prominently on the consent page)
  knowledge:read: Knowledge base search (unchecked by default, and shown prominently on the consent page)
x-crew-owner-only-scopes:
- approvals:answer
- grants:manage
- instance:manage
- bots:manage
- memory:write
- knowledge:write
x-crew-entitlements:
  memory.read: May request the scope memory:read
  memory.global: May let the user set the grant's memory_global to true (memory.read and memory:read are also needed)
  knowledge.read: May request the scope knowledge:read
  workflows.run: May request the scope workflows:run
  schedules.manage: May request the scope schedules:manage
  notifications.send: May request the scope notifications:send (push notifications)
  quota.elevated: The elevated tier, at most 500 credits a day (the manifest's requested_quota)
  bots.create: The bundle may have kind bot and create a Bot with private memory in the user's crew; also gates
    the scope bots:create (creating helper Bots at run time)
x-crew-entitlement-for-scope:
  memory:read: memory.read
  knowledge:read: knowledge.read
  workflows:run: workflows.run
  schedules:manage: schedules.manage
  notifications:send: notifications.send
  bots:create: bots.create
webhooks:
  crewEvent:
    post:
      operationId: crew_event_webhook
      summary: Callback the crew sends to the app's backend
      description: Sent to the manifest's callbacks.webhook_url. Carries ids only, never content. Signed with HMAC-SHA256
        over timestamp + "." + raw_body under the webhook secret issued when the app is registered (it can be rotated);
        see X-Crew-Signature. Receivers reject an X-Crew-Timestamp older than 5 minutes. The address is checked
        on every connection and must be public; redirects are not followed. Phase 3.
      security: []
      x-crew-phase: 3
      x-crew-coverage: done
      parameters:
      - name: X-Crew-Signature
        in: header
        required: true
        description: 'sha256=<hex>: HMAC-SHA256(webhook secret, timestamp + "." + raw_body), lowercase hex.'
        schema:
          type: string
          pattern: ^sha256=[0-9a-f]{64}$
      - name: X-Crew-Timestamp
