openapi: 3.1.0
info:
  title: Crew API · Public
  version: 1.0.0-draft
  description: |
    Public tier of the Crew API: third-party apps call it with a delegated credential. 48 operations:
    18 in phase 1a, 13 in phase 1b, 14 in phase 2 and 3 in phase 3.
    Design and rationale: docs/request-for-change/rfc-crew-api.md.

    - Versioning: the major version is in the path (/v1). The minor version is the Crew-API-Version
      request header and is only a declaration. Inside /v1 the server only adds and never refuses a
      request because the minor version is old; without the header it answers with 1.0 behaviour.
    - Errors: one error body, Error in components.yaml. Every refusal under /v1/ uses it, including
      refusals from middleware.
    - Permissions: a delegated credential holds only the scopes listed under security; when security
      lists several groups, holding any one of them is enough. A list in x-crew-scope means the same.
      Calling an Owner operation under /v1/crew/owner/ always returns 403 owner_only.
      firstPartySession (the user) may call every Public operation and holds every scope.
    - Ownership: a delegated credential sees and changes only the conversations, artifacts, files,
      schedules and workflow runs tagged with its own grant. Anything else is 404, so the app cannot
      learn that it exists.
    - Quota: every response to a delegated-credential request, success or failure, carries
      X-Crew-Quota-*. Operations that spend credits share one grant quota and are watched by the
      gateway's monitor. The embed-only /v1/crew/approvals/{id}/decision carries no quota headers.
    - Idempotency: every POST accepts Idempotency-Key, for 24 hours within one grant.
    - Vocabulary: approval answers are allow and deny; approval states are pending, allowed,
      denied and expired.
    - Webhooks: the address comes only from the manifest. The webhooks section below gives the
      callback body and signature headers.
    - Extensions: x-crew-tier, x-crew-scope, x-crew-entitlement, x-crew-phase (1a / 1b / 2 / 3),
      x-crew-stability (preview: a phase 1b operation whose shape may still change, with notice for
      the preview deprecation period before it does), x-crew-reuses (existing code that can be built
      on, at commit 8da9c340eb), x-crew-coverage (done/partial), x-crew-depends-on (open questions
      in the RFC).
    - Streaming: for text/event-stream, x-crew-sse-data gives the shape of each data line and
      x-crew-sse-events lists the event types (OpenAPI 3.1 has no item schema for SSE).
    - Gateway routes outside these 48 (control plane, embed page, site connection, approval page,
      local authorization) are listed in the RFC.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
- url: https://{crew_endpoint}
  description: The user's crew gateway
  variables:
    crew_endpoint:
      default: crew.example.invalid
      description: The address the app was given for this crew. Placeholder.
- url: http://127.0.0.1:{port}
  description: Local
  variables:
    port:
      default: '5476'
tags:
- name: approvals
  description: Approvals
- name: artifacts
  description: Artifacts
- name: conversations
  description: Conversations
- name: crew
  description: Crew extensions
- name: events
  description: Event stream
- name: knowledge
  description: Knowledge base
- name: bots
  description: Bot
- name: memory
  description: Memory
- name: models
  description: Models
- name: notifications
  description: Notifications
- name: responses
  description: Responses compatible
- name: schedules
  description: Schedules
- name: webhooks
  description: Webhooks
- name: workflows
  description: Workflows
- name: files
  description: Files
paths:
  /v1/responses:
    post:
      operationId: post_v1_responses
      summary: Run a turn
      tags:
      - responses
      security:
      - delegatedCredential:
        - responses:write
      - firstPartySession: []
      parameters:
      - $ref: ./components.yaml#/components/parameters/CrewApiVersion
      - $ref: ./components.yaml#/components/parameters/RequestId
      - $ref: ./components.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: ./components.yaml#/components/headers/X-Request-Id
            Crew-API-Version:
              $ref: ./components.yaml#/components/headers/Crew-API-Version
            X-Crew-Quota-Limit:
              $ref: ./components.yaml#/components/headers/X-Crew-Quota-Limit
            X-Crew-Quota-Remaining:
              $ref: ./components.yaml#/components/headers/X-Crew-Quota-Remaining
            X-Crew-Quota-Reset:
              $ref: ./components.yaml#/components/headers/X-Crew-Quota-Reset
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Response
              example:
                id: resp_01JBX9
                object: response
                created_at: 1761822000
                status: completed
                model: agent_writer
                conversation:
                  id: conv_01JBX8
                output:
                - type: message
                  id: msg_01
                  role: assistant
                  status: completed
                  content:
                  - type: output_text
                    text: Done.
                    annotations: []
                usage: null
                metadata: {}
                crew:
                  ignored_parameters:
                  - temperature
            text/event-stream:
              schema:
                type: string
                description: 'SSE. Each data: line is one ResponseStreamEvent JSON object.'
              x-crew-sse-data:
                $ref: ./components.yaml#/components/schemas/ResponseStreamEvent
              x-crew-sse-events:
              - response.created
              - response.queued
              - response.in_progress
              - response.completed
              - response.failed
              - response.incomplete
              - response.output_item.added
              - response.output_item.done
              - response.content_part.added
              - response.content_part.done
              - response.output_text.delta
              - response.output_text.done
              - response.function_call_arguments.delta
              - response.function_call_arguments.done
              - response.mcp_call.in_progress
              - response.mcp_call.completed
              - response.mcp_call.failed
              - error
              - crew.notice
              example: |
                event: response.created
                data: {"type":"response.created","sequence_number":0,"response":{"id":"resp_01JBX9","object":"response","status":"in_progress"}}

                event: response.output_text.delta
                data: {"type":"response.output_text.delta","sequence_number":4,"item_id":"msg_01","output_index":0,"content_index":0,"delta":"Done"}

                event: response.completed
                data: {"type":"response.completed","sequence_number":9,"response":{"id":"resp_01JBX9","object":"response","status":"completed"}}
        '400':
          $ref: ./components.yaml#/components/responses/BadRequest
        '401':
          $ref: ./components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/components/responses/Forbidden
        '404':
          $ref: ./components.yaml#/components/responses/NotFound
        '409':
          $ref: ./components.yaml#/components/responses/Conflict
        '413':
          $ref: ./components.yaml#/components/responses/PayloadTooLarge
        '422':
          $ref: ./components.yaml#/components/responses/Unprocessable
        '429':
          $ref: ./components.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/components/responses/InternalError
        '503':
          $ref: ./components.yaml#/components/responses/InstanceUnavailable
      x-crew-tier: public
      x-crew-scope: responses:write
      x-crew-phase: 1a
      x-crew-reuses:
      - src/kiro_crew/dashboard/chat_runner.py:765 (_run_chat)
      - src/kiro_crew/dashboard/openai_compat.py:757 (how _stream_response reads the queue)
      x-crew-coverage: done
      description: 'stream=true returns text/event-stream; background=true returns queued at once. Delegated credential:
        model must be the template id of the app''s capability bundle, <client_id>/<bundle.agent.id>, or a Bot the
        grant allows, and conversation must be one opened under this grant. Spends credits against the grant quota;
        a retry with the same Idempotency-Key is not charged again. Phase 1 accepts text only; `input_image`, `input_file`,
        `text.format: json_schema` and `reasoning.summary` are phase 2 and open per agent as capabilities reports;
        when the agent does not support one, 422 capability_unavailable. When json_schema validation fails the whole
        turn is failed with error.code structured_output_invalid.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components.yaml#/components/schemas/CreateResponseRequest
            example:
              model: agent_writer
              conversation: conv_01JBX8
              input: Make the second paragraph shorter
              stream: true
      x-crew-phase-parts:
        input_image: '2'
        input_file: '2'
        text.format.json_schema: '2'
        reasoning.summary: '2'
  /v1/responses/{response_id}:
    get:
      operationId: get_v1_responses_response_id
      summary: Read a turn; can resume its stream
      tags:
      - responses
      security:
      - delegatedCredential:
        - conversations:read
      - delegatedCredential:
        - responses:write
      - firstPartySession: []
      parameters:
      - $ref: ./components.yaml#/components/parameters/CrewApiVersion
      - $ref: ./components.yaml#/components/parameters/RequestId
      - name: response_id
        in: path
        required: true
        description: resp_ id
        schema:
          type: string
      - name: stream
        in: query
        required: false
        description: true resumes the stream as SSE.
        schema:
          type: boolean
      - name: starting_after
        in: query
        required: false
        description: Resume after the Nth stream event (sequence_number).
        schema:
          type: integer
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: ./components.yaml#/components/headers/X-Request-Id
            Crew-API-Version:
              $ref: ./components.yaml#/components/headers/Crew-API-Version
            X-Crew-Quota-Limit:
              $ref: ./components.yaml#/components/headers/X-Crew-Quota-Limit
            X-Crew-Quota-Remaining:
              $ref: ./components.yaml#/components/headers/X-Crew-Quota-Remaining
            X-Crew-Quota-Reset:
              $ref: ./components.yaml#/components/headers/X-Crew-Quota-Reset
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Response
              example:
                id: resp_01JBX9
                object: response
                created_at: 1761822000
                status: completed
                model: agent_writer
                conversation:
                  id: conv_01JBX8
                output:
                - type: message
                  id: msg_01
                  role: assistant
                  status: completed
                  content:
                  - type: output_text
                    text: Done.
                    annotations: []
                usage: null
                metadata: {}
                crew:
                  ignored_parameters:
                  - temperature
            text/event-stream:
              schema:
                type: string
                description: 'SSE. Each data: line is one ResponseStreamEvent JSON object.'
              x-crew-sse-data:
                $ref: ./components.yaml#/components/schemas/ResponseStreamEvent
              x-crew-sse-events:
              - response.created
              - response.queued
              - response.in_progress
              - response.completed
              - response.failed
              - response.incomplete
              - response.output_item.added
              - response.output_item.done
              - response.content_part.added
              - response.content_part.done
              - response.output_text.delta
              - response.output_text.done
              - response.function_call_arguments.delta
              - response.function_call_arguments.done
              - response.mcp_call.in_progress
              - response.mcp_call.completed
              - response.mcp_call.failed
              - error
              - crew.notice
              example: |
                event: response.created
                data: {"type":"response.created","sequence_number":0,"response":{"id":"resp_01JBX9","object":"response","status":"in_progress"}}

                event: response.output_text.delta
                data: {"type":"response.output_text.delta","sequence_number":4,"item_id":"msg_01","output_index":0,"content_index":0,"delta":"Done"}

                event: response.completed
                data: {"type":"response.completed","sequence_number":9,"response":{"id":"resp_01JBX9","object":"response","status":"completed"}}
        '401':
          $ref: ./components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/components/responses/Forbidden
        '404':
          $ref: ./components.yaml#/components/responses/NotFound
        '429':
          $ref: ./components.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/components/responses/InternalError
        '503':
          $ref: ./components.yaml#/components/responses/InstanceUnavailable
      x-crew-tier: public
      x-crew-scope:
      - conversations:read
      - responses:write
      x-crew-phase: 1a
      x-crew-reuses:
      - None; new work.
      x-crew-coverage: done
      description: 'Holding either conversations:read or responses:write is enough; with only responses:write, only
        responses this grant created can be read. Stream events are stored with the response, so the stream can
        be resumed. Retention: stored responses (with the stream events used to resume), the event index, resolved
        approvals and uploaded files are all kept 30 days by default; the owner can set `crew_api.retention_days`
        in the crew settings to 1 to 365 days. Deleting a conversation deletes its responses and events. After the
        retention period this returns 404 not_found.'
  /v1/responses/{response_id}/cancel:
    post:
      operationId: post_v1_responses_response_id_cancel
      summary: Cancel a running turn
      tags:
      - responses
      security:
      - delegatedCredential:
        - responses:write
      - firstPartySession: []
      parameters:
      - $ref: ./components.yaml#/components/parameters/CrewApiVersion
      - $ref: ./components.yaml#/components/parameters/RequestId
      - $ref: ./components.yaml#/components/parameters/IdempotencyKey
      - name: response_id
        in: path
        required: true
        description: resp_ id
        schema:
          type: string
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: ./components.yaml#/components/headers/X-Request-Id
            Crew-API-Version:
              $ref: ./components.yaml#/components/headers/Crew-API-Version
            X-Crew-Quota-Limit:
              $ref: ./components.yaml#/components/headers/X-Crew-Quota-Limit
            X-Crew-Quota-Remaining:
              $ref: ./components.yaml#/components/headers/X-Crew-Quota-Remaining
            X-Crew-Quota-Reset:
              $ref: ./components.yaml#/components/headers/X-Crew-Quota-Reset
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Response
        '401':
          $ref: ./components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/components/responses/Forbidden
        '404':
          $ref: ./components.yaml#/components/responses/NotFound
        '429':
          $ref: ./components.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/components/responses/InternalError
        '503':
          $ref: ./components.yaml#/components/responses/InstanceUnavailable
      x-crew-tier: public
      x-crew-scope: responses:write
      x-crew-phase: 1a
      x-crew-reuses:
      - src/kiro_crew/dashboard/chat_api/turn_stop.py:822 (api_chat_slot_stop)
      x-crew-coverage: done
      description: An already finished turn returns its current state without error. A cancelled turn has status=cancelled.
  /v1/responses/{response_id}/input_items:
    get:
      operationId: get_v1_responses_response_id_input_items
      summary: Read this turn's input
      tags:
      - responses
      security:
      - delegatedCredential:
        - conversations:read
      - firstPartySession: []
      parameters:
      - $ref: ./components.yaml#/components/parameters/CrewApiVersion
      - $ref: ./components.yaml#/components/parameters/RequestId
      - name: response_id
        in: path
        required: true
        description: resp_ id
        schema:
          type: string
      - $ref: ./components.yaml#/components/parameters/After
      - $ref: ./components.yaml#/components/parameters/Limit
      - $ref: ./components.yaml#/components/parameters/Order
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: ./components.yaml#/components/headers/X-Request-Id
            Crew-API-Version:
              $ref: ./components.yaml#/components/headers/Crew-API-Version
            X-Crew-Quota-Limit:
              $ref: ./components.yaml#/components/headers/X-Crew-Quota-Limit
            X-Crew-Quota-Remaining:
              $ref: ./components.yaml#/components/headers/X-Crew-Quota-Remaining
            X-Crew-Quota-Reset:
              $ref: ./components.yaml#/components/headers/X-Crew-Quota-Reset
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/InputItemList
        '401':
          $ref: ./components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/components/responses/Forbidden
        '404':
          $ref: ./components.yaml#/components/responses/NotFound
        '429':
          $ref: ./components.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/components/responses/InternalError
        '503':
          $ref: ./components.yaml#/components/responses/InstanceUnavailable
      x-crew-tier: public
      x-crew-scope: conversations:read
      x-crew-phase: 1a
      x-crew-reuses:
      - src/kiro_crew/dashboard/chat_api/slot_detail.py:803 (the slot window)
      x-crew-coverage: done
  /v1/files:
    post:
      operationId: post_v1_files
      summary: Upload a file for input_image / input_file
      tags:
      - files
      security:
      - delegatedCredential:
        - responses:write
      - firstPartySession: []
      parameters:
      - $ref: ./components.yaml#/components/parameters/CrewApiVersion
      - $ref: ./components.yaml#/components/parameters/RequestId
      - $ref: ./components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: ./components.yaml#/components/schemas/CreateFileRequest
      responses:
        '201':
          description: Stored
          headers:
            X-Request-Id:
              $ref: ./components.yaml#/components/headers/X-Request-Id
            Crew-API-Version:
              $ref: ./components.yaml#/components/headers/Crew-API-Version
            X-Crew-Quota-Limit:
              $ref: ./components.yaml#/components/headers/X-Crew-Quota-Limit
            X-Crew-Quota-Remaining:
              $ref: ./components.yaml#/components/headers/X-Crew-Quota-Remaining
            X-Crew-Quota-Reset:
              $ref: ./components.yaml#/components/headers/X-Crew-Quota-Reset
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/File
              example:
                id: file_01JBXA
                object: file
                bytes: 48213
                created_at: 1761822000
                expires_at: 1764414000
                filename: mockup.png
                mime_type: image/png
                purpose: user_data
        '400':
          $ref: ./components.yaml#/components/responses/BadRequest
        '401':
          $ref: ./components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/components/responses/Forbidden
        '413':
          $ref: ./components.yaml#/components/responses/PayloadTooLarge
        '422':
          $ref: ./components.yaml#/components/responses/Unprocessable
        '429':
          $ref: ./components.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/components/responses/InternalError
        '503':
          $ref: ./components.yaml#/components/responses/InstanceUnavailable
      x-crew-tier: public
      x-crew-scope: responses:write
      x-crew-phase: '2'
      x-crew-reuses:
      - src/kiro_crew/dashboard/routes/taskrunner.py:70 (handlers.api_upload_file)
      x-crew-coverage: done
      description: 'The file is stored in the user''s crew and belongs to this grant: only this grant can reference
        it in input_image / input_file, and a reference from another grant is 404. At most 20 MB. Only types the
        agent''s input_modalities can use are accepted (images: png, jpeg, webp, gif; files: pdf, txt, md, csv,
        json); anything else is 422 capability_unavailable. Spends no credits but counts against the rate limit.
        When features.file_uploads is false, 422 capability_unavailable. Retention: stored responses (with the stream
        events used to resume), the event index, resolved approvals and uploaded files are all kept 30 days by default;
        the owner can set `crew_api.retention_days` in the crew settings to 1 to 365 days. Deleting a conversation
        deletes its responses and events.'
  /v1/conversations:
    post:
      operationId: post_v1_conversations
      summary: Create a conversation
      tags:
      - conversations
      security:
      - delegatedCredential:
        - responses:write
      - firstPartySession: []
      parameters:
      - $ref: ./components.yaml#/components/parameters/CrewApiVersion
      - $ref: ./components.yaml#/components/parameters/RequestId
      - $ref: ./components.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: ./components.yaml#/components/headers/X-Request-Id
            Crew-API-Version:
              $ref: ./components.yaml#/components/headers/Crew-API-Version
            X-Crew-Quota-Limit:
              $ref: ./components.yaml#/components/headers/X-Crew-Quota-Limit
            X-Crew-Quota-Remaining:
              $ref: ./components.yaml#/components/headers/X-Crew-Quota-Remaining
            X-Crew-Quota-Reset:
              $ref: ./components.yaml#/components/headers/X-Crew-Quota-Reset
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Conversation
              example:
                id: conv_01JBX8
                object: conversation
                created_at: 1761822000
                metadata:
                  doc_id: d42
        '400':
          $ref: ./components.yaml#/components/responses/BadRequest
        '401':
          $ref: ./components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/components/responses/Forbidden
        '429':
          $ref: ./components.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/components/responses/InternalError
        '503':
          $ref: ./components.yaml#/components/responses/InstanceUnavailable
      x-crew-tier: public
      x-crew-scope: responses:write
      x-crew-phase: 1a
      x-crew-reuses:
      - src/kiro_crew/dashboard/chat_api/slot_create.py:212 (api_chat_slot_create)
      x-crew-coverage: done
      description: The conversation is tagged with the grant id. The external id is conv_, never the internal session
        key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components.yaml#/components/schemas/CreateConversationRequest
    get:
      operationId: get_v1_conversations
      summary: List this grant's conversations
      tags:
      - conversations
      security:
      - delegatedCredential:
        - conversations:read
      - firstPartySession: []
      parameters:
      - $ref: ./components.yaml#/components/parameters/CrewApiVersion
      - $ref: ./components.yaml#/components/parameters/RequestId
      - $ref: ./components.yaml#/components/parameters/After
      - $ref: ./components.yaml#/components/parameters/Limit
      - $ref: ./components.yaml#/components/parameters/Order
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: ./components.yaml#/components/headers/X-Request-Id
            Crew-API-Version:
              $ref: ./components.yaml#/components/headers/Crew-API-Version
            X-Crew-Quota-Limit:
              $ref: ./components.yaml#/components/headers/X-Crew-Quota-Limit
            X-Crew-Quota-Remaining:
              $ref: ./components.yaml#/components/headers/X-Crew-Quota-Remaining
            X-Crew-Quota-Reset:
              $ref: ./components.yaml#/components/headers/X-Crew-Quota-Reset
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/ConversationList
        '401':
          $ref: ./components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/components/responses/Forbidden
        '429':
          $ref: ./components.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/components/responses/InternalError
        '503':
          $ref: ./components.yaml#/components/responses/InstanceUnavailable
      x-crew-tier: public
      x-crew-scope: conversations:read
      x-crew-phase: 1a
      x-crew-reuses:
      - src/kiro_crew/dashboard/chat_api/slot_detail.py:52 (api_chat_slots)
      x-crew-coverage: done
      description: OpenAI has no such endpoint; Crew adds it. A delegated credential lists only conversations opened
        under its grant.
