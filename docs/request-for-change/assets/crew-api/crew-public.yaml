      description: 'The gateway sends the Bot only a fixed reminder it writes itself ("You have a new message from
        <app name>, number <ref>"), with the app name taken from the app''s registration record. The request body
        has nothing but ref, so no text can ride along. The turn runs in an app-room conversation dedicated to this
        (Bot x grant) pair, with only the tools listed in the manifest''s bundle.wake_tools; it reads the Bot''s
        own memory and writes none. One (Bot x grant) pair has at most one queued wake; later ones are merged (coalesced).
        When the Bot is not online the wake is deferred and runs when it is back. Limits: 20 per hour for each (grant
        x Bot) pair and 120 per hour for each grant, both proposals. Past them, 429 rate_limited with limit bot_wakes
        or grant_wakes in the error body. A Bot outside the grant''s Bot range is 404. The turn''s usage is in the
