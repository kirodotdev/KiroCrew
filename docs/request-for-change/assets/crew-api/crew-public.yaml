components:
  securitySchemes:
    delegatedCredential:
      type: http
      scheme: bearer
      description: A bearer credential an app holds on the user's behalf. Each credential carries a set of scopes
        (x-crew-scopes at the document root). How credentials are issued is out of scope for this API.
    firstPartySession:
      type: http
      scheme: bearer
      description: The user's own credential (owner). Holds every scope.
    embedCredential:
      type: apiKey
      in: cookie
      name: crew_embed
      description: A short-lived credential that represents the user and is bound to one conversation. It can only
        answer approvals in that conversation. The cookie name is a placeholder.
    embedCredentialHeader:
      type: apiKey
      in: header
      name: X-Crew-Embed-Credential
      description: The same embed credential sent as a header; accepted only on the approval endpoint.
x-crew-scopes:
  responses:write: Open conversations, run turns, cancel its own turns.
  conversations:read: Read conversations, events and approvals opened under this grant (read only).
  webhooks:manage: Select event types for callbacks; the address comes from the manifest.
  mates:chat: List mates the app may chat with, and chat with them.
  mates:read: Read goals, key results, progress and reports (with bodies) of mates the grant allows.
  artifacts:read: Read this grant's artifacts and comments.
  artifacts:write: Write this grant's artifacts and comments.
  notifications:send: Send the user a notification (dashboard bell only; 10 per hour per grant by default).
  schedules:manage: This grant's schedules (off unless the user enables it).
  workflows:run: Start saved workflows the user marked "allow third parties" (off unless the user enables it).
  memory:read: Memory recall over the user's Global memory (off unless the user enables it).
  knowledge:read: Knowledge base search (off unless the user enables it).
x-crew-owner-only-scopes:
- approvals:answer
- grants:manage
- instance:manage
- mates:manage
- memory:write
- knowledge:write
webhooks:
  crewEvent:
    post:
      operationId: crew_event_webhook
      summary: Callback the crew sends to the app's backend
      description: Sent to the manifest's callbacks.webhook_url. Carries ids only, never content. Signed with HMAC-SHA256
        under the app's webhook secret; see X-Crew-Signature. Receivers reject an X-Crew-Timestamp older than 5
        minutes. The gateway sends only to public addresses and does not follow redirects.
      security: []
      x-crew-coverage: done
      parameters:
      - name: X-Crew-Signature
        in: header
        required: true
        description: sha256=<hex>, where <hex> is the lowercase hex HMAC-SHA256 of timestamp + "." + raw_body (timestamp
          is the X-Crew-Timestamp value, raw_body the exact request body) under the app's webhook secret. The secret
          is issued once when the app is registered and can be rotated; how it is issued is out of scope for this
          API.
        schema:
          type: string
      - name: X-Crew-Timestamp
        in: header
        required: true
        description: Unix seconds.
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components.yaml#/components/schemas/WebhookDelivery
            example:
