openapi: 3.1.0
info:
  title: Crew API · Owner
  version: 1.0.0-draft
  description: |
    Owner tier of the Crew API: the user's own clients (dashboard, control panel, CLI) call it
    with the user's own credential. Design and rationale: docs/request-for-change/rfc-crew-api.md.

    - paths holds the 6 new grant and connector operations, fully defined.
    - x-crew-reused-routes lists the 96 existing routes that move into the Owner tier as they are.
      They carry path, method, summary and source only, no full schema, and are all
      x-crew-stability: experimental. They are wrapped as /v1/crew/owner/* over time.
    - A delegated credential calling any Owner operation gets 403 insufficient_scope.
    - The Owner tier's compatibility promise is an open question in the RFC.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
- url: https://{crew_endpoint}
  description: The user's crew gateway
  variables:
    crew_endpoint:
      default: crew.example.invalid
      description: The address the app was given for this crew. Placeholder.
- url: http://127.0.0.1:{port}
  description: Local
  variables:
    port:
      default: '5476'
tags:
- name: connectors
  description: Connectors
- name: grants
  description: Grants
paths:
  /v1/crew/grants:
    get:
      operationId: get_v1_crew_grants
      summary: List grants (with usage)
      tags:
      - grants
      security:
      - firstPartySession: []
      parameters:
      - $ref: ./components.yaml#/components/parameters/CrewApiVersion
      - $ref: ./components.yaml#/components/parameters/RequestId
      - name: status
        in: query
        required: false
        description: Filter by status.
        schema:
          $ref: '#/components/schemas/GrantStatus'
      - $ref: ./components.yaml#/components/parameters/After
      - $ref: ./components.yaml#/components/parameters/Limit
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: ./components.yaml#/components/headers/X-Request-Id
            Crew-API-Version:
              $ref: ./components.yaml#/components/headers/Crew-API-Version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantList'
        '401':
          $ref: ./components.yaml#/components/responses/UnauthorizedNoQuota
        '403':
          $ref: ./components.yaml#/components/responses/ForbiddenNoQuota
        '429':
          $ref: ./components.yaml#/components/responses/TooManyRequestsNoQuota
        '500':
          $ref: ./components.yaml#/components/responses/InternalErrorNoQuota
        '503':
          $ref: ./components.yaml#/components/responses/InstanceUnavailableNoQuota
      x-crew-tier: owner
      x-crew-scope: grants:manage
      x-crew-reuses:
      - None; new work.
      x-crew-coverage: done
      description: revoked grants are not listed by default.
  /v1/crew/grants/{grant_id}:
    patch:
      operationId: patch_v1_crew_grants_grant_id
      summary: 'Tighten a grant: lower quota, remove mates, change sensitivity and notification limit'
      tags:
      - grants
      security:
      - firstPartySession: []
      parameters:
      - $ref: ./components.yaml#/components/parameters/CrewApiVersion
      - $ref: ./components.yaml#/components/parameters/RequestId
      - name: grant_id
        in: path
        required: true
        description: grt_ id
        schema:
          type: string
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: ./components.yaml#/components/headers/X-Request-Id
            Crew-API-Version:
              $ref: ./components.yaml#/components/headers/Crew-API-Version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grant'
        '400':
          $ref: ./components.yaml#/components/responses/BadRequestNoQuota
        '401':
          $ref: ./components.yaml#/components/responses/UnauthorizedNoQuota
        '403':
          $ref: ./components.yaml#/components/responses/ForbiddenNoQuota
        '404':
          $ref: ./components.yaml#/components/responses/NotFoundNoQuota
        '429':
          $ref: ./components.yaml#/components/responses/TooManyRequestsNoQuota
        '500':
          $ref: ./components.yaml#/components/responses/InternalErrorNoQuota
        '503':
          $ref: ./components.yaml#/components/responses/InstanceUnavailableNoQuota
      x-crew-tier: owner
      x-crew-scope: grants:manage
      x-crew-reuses:
      - None; new work.
      x-crew-coverage: done
      description: 'Takes effect at once: the next request uses the new values; a turn in flight finishes its reserved
        part.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGrantRequest'
    delete:
      operationId: delete_v1_crew_grants_grant_id
      summary: Revoke a grant
      tags:
      - grants
      security:
      - firstPartySession: []
      parameters:
      - $ref: ./components.yaml#/components/parameters/CrewApiVersion
      - $ref: ./components.yaml#/components/parameters/RequestId
      - name: grant_id
        in: path
        required: true
        description: grt_ id
        schema:
          type: string
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: ./components.yaml#/components/headers/X-Request-Id
            Crew-API-Version:
              $ref: ./components.yaml#/components/headers/Crew-API-Version
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Deleted
        '401':
          $ref: ./components.yaml#/components/responses/UnauthorizedNoQuota
        '403':
          $ref: ./components.yaml#/components/responses/ForbiddenNoQuota
        '404':
          $ref: ./components.yaml#/components/responses/NotFoundNoQuota
        '429':
          $ref: ./components.yaml#/components/responses/TooManyRequestsNoQuota
        '500':
          $ref: ./components.yaml#/components/responses/InternalErrorNoQuota
        '503':
          $ref: ./components.yaml#/components/responses/InstanceUnavailableNoQuota
      x-crew-tier: owner
      x-crew-scope: grants:manage
      x-crew-reuses:
      - None; new work.
      x-crew-coverage: done
      description: Takes effect at once (status=revoked). Open streams receive grant.revoked and are closed.
  /v1/crew/grants/{grant_id}/resume:
    post:
      operationId: post_v1_crew_grants_grant_id_resume
      summary: Resume a paused or throttled grant
      tags:
      - grants
      security:
      - firstPartySession: []
      parameters:
      - $ref: ./components.yaml#/components/parameters/CrewApiVersion
      - $ref: ./components.yaml#/components/parameters/RequestId
      - name: grant_id
        in: path
        required: true
        description: grt_ id
        schema:
          type: string
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: ./components.yaml#/components/headers/X-Request-Id
            Crew-API-Version:
              $ref: ./components.yaml#/components/headers/Crew-API-Version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grant'
        '401':
          $ref: ./components.yaml#/components/responses/UnauthorizedNoQuota
        '403':
          $ref: ./components.yaml#/components/responses/ForbiddenNoQuota
        '404':
          $ref: ./components.yaml#/components/responses/NotFoundNoQuota
        '409':
          $ref: ./components.yaml#/components/responses/ConflictNoQuota
        '429':
          $ref: ./components.yaml#/components/responses/TooManyRequestsNoQuota
        '500':
          $ref: ./components.yaml#/components/responses/InternalErrorNoQuota
        '503':
          $ref: ./components.yaml#/components/responses/InstanceUnavailableNoQuota
      x-crew-tier: owner
      x-crew-scope: grants:manage
      x-crew-reuses:
      - None; new work.
      x-crew-coverage: done
      description: paused or throttled goes back to active. A grant paused for re-consent (pause.by=reconsent) gets
        409 and recovers only through re-consent.
  /v1/crew/connectors:
    get:
      operationId: get_v1_crew_connectors
      summary: List consented connectors
      tags:
      - connectors
      security:
      - firstPartySession: []
      parameters:
      - $ref: ./components.yaml#/components/parameters/CrewApiVersion
      - $ref: ./components.yaml#/components/parameters/RequestId
      - $ref: ./components.yaml#/components/parameters/After
      - $ref: ./components.yaml#/components/parameters/Limit
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: ./components.yaml#/components/headers/X-Request-Id
            Crew-API-Version:
              $ref: ./components.yaml#/components/headers/Crew-API-Version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorList'
        '401':
          $ref: ./components.yaml#/components/responses/UnauthorizedNoQuota
        '403':
          $ref: ./components.yaml#/components/responses/ForbiddenNoQuota
        '429':
          $ref: ./components.yaml#/components/responses/TooManyRequestsNoQuota
        '500':
          $ref: ./components.yaml#/components/responses/InternalErrorNoQuota
        '503':
          $ref: ./components.yaml#/components/responses/InstanceUnavailableNoQuota
      x-crew-tier: owner
      x-crew-scope: grants:manage
      x-crew-reuses:
      - None; new work.
      x-crew-coverage: done
  /v1/crew/connectors/{client_id}:
    get:
      operationId: get_v1_crew_connectors_client_id
      summary: Read a connector's manifest and hash
      tags:
      - connectors
      security:
      - firstPartySession: []
      parameters:
      - $ref: ./components.yaml#/components/parameters/CrewApiVersion
      - $ref: ./components.yaml#/components/parameters/RequestId
      - name: client_id
        in: path
        required: true
        description: App id
        schema:
          type: string
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: ./components.yaml#/components/headers/X-Request-Id
            Crew-API-Version:
              $ref: ./components.yaml#/components/headers/Crew-API-Version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connector'
        '401':
          $ref: ./components.yaml#/components/responses/UnauthorizedNoQuota
        '403':
          $ref: ./components.yaml#/components/responses/ForbiddenNoQuota
        '404':
          $ref: ./components.yaml#/components/responses/NotFoundNoQuota
        '429':
          $ref: ./components.yaml#/components/responses/TooManyRequestsNoQuota
        '500':
          $ref: ./components.yaml#/components/responses/InternalErrorNoQuota
        '503':
          $ref: ./components.yaml#/components/responses/InstanceUnavailableNoQuota
      x-crew-tier: owner
      x-crew-scope: grants:manage
      x-crew-reuses:
      - None; new work.
      x-crew-coverage: done
components:
  securitySchemes:
    firstPartySession:
      type: http
      scheme: bearer
      description: The user's own credential (owner). Holds every scope.
  schemas:
    GrantStatus:
      enum:
      - active
      - throttled
      - paused
      - revoked
      description: Only these four values are used. Revoked grants are no longer listed.
    Grant:
      type: object
      required:
      - id
      - object
      - client_id
      - scopes
      - status
      - created_at
      properties:
        id:
          type: string
          pattern: ^grt_
        object:
          const: grant
        client_id:
          type: string
        app:
          type: object
          properties:
            name:
              type: string
            icon_url:
              type:
              - string
              - 'null'
        grant_type:
          enum:
          - backend
          - embed
        scopes:
          type: array
          items:
            type: string
        mates:
          type: array
          items:
            type: string
          description: Mate ids the user allows this app to use; empty means none.
        memory_global:
          type: boolean
          default: false
          description: Whether this grant may read the user's Global memory. Takes effect only together with memory:read.
        notify_per_hour:
          type: integer
          minimum: 0
          default: 10
        status:
          $ref: '#/components/schemas/GrantStatus'
        pause:
          type:
          - object
          - 'null'
          description: Only when paused.
          properties:
            by:
              enum:
              - monitor
              - user
              - reconsent
              description: 'monitor: the gateway paused it automatically; user: the user did; reconsent: it waits
                for the user to agree to a changed grant'
            reason:
              type: string
            at:
              $ref: ./components.yaml#/components/schemas/Timestamp
        created_at:
          $ref: ./components.yaml#/components/schemas/Timestamp
        last_used_at:
          type:
          - integer
          - 'null'
        quota:
          allOf:
          - $ref: ./components.yaml#/components/schemas/Quota
          - type: object
            properties:
              consented_at:
                $ref: ./components.yaml#/components/schemas/Timestamp
        usage_7d:
          type: array
          items:
            type: object
            properties:
              day:
                type: string
                format: date
              credits:
                type: number
    GrantList:
      allOf:
      - $ref: ./components.yaml#/components/schemas/ListEnvelope
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/Grant'
    UpdateGrantRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      description: 'Tighten only: quota can only go down and mates can only be removed. Raising quota or adding
        a mate gets 403 insufficient_scope (the app must ask for re-consent).'
      properties:
        quota:
          type: object
          properties:
            daily_credits:
              type: number
            max_turn_tokens:
              type: integer
            max_turn_tool_calls:
              type: integer
            max_turn_secs:
              type: integer
        notify_per_hour:
          type: integer
          minimum: 0
        mates:
          type: array
          items:
            type: string
          description: The new full list; must be a subset of the current list.
    Connector:
      type: object
      required:
      - client_id
      - object
      - agent_id
      - manifest_hash
      - defn_sv
      description: Manifests are written by the system that records the grant (Internal, not in this file); read
        only here.
      properties:
        client_id:
          type: string
        object:
          const: connector
        name:
          type: string
        agent_id:
          type: string
        manifest_hash:
          type: string
        defn_sv:
          type: integer
          description: Security version.
        consented_at:
          $ref: ./components.yaml#/components/schemas/Timestamp
        grants:
          type: array
          items:
            type: string
        manifest:
          $ref: '#/components/schemas/ConnectorManifest'
          description: Returned only when reading a single item.
    ConnectorList:
      allOf:
      - $ref: ./components.yaml#/components/schemas/ListEnvelope
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/Connector'
    ConnectorManifest:
      type: object
      required:
      - manifest_version
      - client_id
      - agent
      - scopes
      description: 'What the user agreed to for this app: its agent, tools, mates, scopes and webhook address'
      properties:
        manifest_version:
          const: 1
        client_id:
          type: string
        agent:
          type: object
          required:
          - id
          - name
          - description
          - prompt
          properties:
            id:
              type: string
            name:
              type: string
            description:
              type: string
            prompt:
              type: string
            icon_url:
              type: string
              format: uri
        tools:
          type: object
          properties:
            mcp_servers:
              type: array
              items:
                type: object
                required:
                - name
                - url
                - tools
                properties:
                  name:
                    type: string
                  url:
                    type: string
                    pattern: ^https://
                  tools:
                    type: array
                    items:
                      type: object
                      required:
                      - name
                      - approval
                      properties:
                        name:
                          type: string
                        approval:
                          enum:
                          - always
                          - never
            client_tools:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
        mates:
          type: array
          items:
            type: string
          description: Mate ids the app asks for; the ones the user allows are stored in the grant's mates.
        scopes:
          type: array
          items:
            type: string
        optional_scopes:
          type: array
          items:
            enum:
            - memory:read
            - knowledge:read
            - schedules:manage
            - workflows:run
        requested_quota:
          type: object
          description: Defaults apply when omitted.
          properties:
            daily_credits:
              type: number
            max_turn_tokens:
              type: integer
            max_turn_tool_calls:
              type: integer
            max_turn_secs:
              type: integer
        callbacks:
          type: object
          properties:
            webhook_url:
              type: string
              format: uri
              description: The only source of the callback address; changing it needs re-consent.
