[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kirocrew"
version = "0.7.0"
description = "Personal AI agent that runs locally — chat via CLI, dashboard, desktop app, or messaging channels like Slack and Discord"
readme = "README.md"
# macOS (x86_64 + arm64) and Linux (x86_64 + aarch64), CPython 3.12-3.13.
# Must be declared in this [project] table: when it exists, setuptools reads
# requires-python from here (not setup.cfg), and an absent value makes the
# build backend raise SpecifierSet(None) -> TypeError during wheel builds.
requires-python = ">=3.12"
# optional-dependencies must be listed here too: the extras live in setup.cfg
# ([options.extras_require]), and once a [project] table exists setuptools
# ignores setup.cfg metadata unless the field is declared dynamic. Omitting it
# silently drops every extra — `pip install -e ".[dev]"` then reports
# "does not provide the extra 'dev'" and installs no test tooling.
dynamic = ["dependencies", "optional-dependencies"]

[project.urls]
Homepage = "https://github.com/kirodotdev/KiroCrew"

[project.scripts]
kirocrew = "kiro_crew._bootstrap:main"

[dependency-groups]
# Pinned dev tool versions for reproducible CI. Bump as needed.
dev = [
    "pytest==9.0.3",
    "pytest-xdist==3.5.0",
    "pytest-timeout==2.2.0",
    "pytest-asyncio==0.20.3",
    "hypothesis==6.98.10",
    "coverage==7.10.6",
    "pytest-cov>=5",
    # Duration-balanced test sharding across parallel CI jobs (--splits/--group).
    "pytest-split==0.11.0",
    "flake8==7.1.0",
    "mypy==1.14.1",
    "black==26.3.1",
    "isort==6.0.0",
    # Not a dev TOOL. kiro_crew.config.validation imports jsonschema behind a
    # try/except and returns the config unvalidated when the import fails, so a
    # run without it exercises none of the schema-validation path and silently
    # SKIPS the 11 tests that cover it (pytest scores a skip as a pass). It is
    # declared here so those guards actually run. Whether jsonschema should also
    # be a runtime dependency -- making validation always-on for users rather
    # than opt-in-by-accident -- is a separate, user-visible call and is
    # deliberately not made here.
    "jsonschema==4.26.0",
    # Same shape as jsonschema above, and the same reason. PyJWT ships in the
    # optional `teams` extra, which CI never installs, so `test_teams_client.py`'s
    # module-level `pytest.importorskip("jwt")` silently skipped the WHOLE file --
    # every test of the inbound Bot Framework token gate (signature, audience,
    # issuer, expiry, the serviceUrl-claim binding, replay drop, in-flight
    # shedding). That is the channel's entire trust boundary, and a skip scores as
    # a pass, so the gate looked covered while nothing exercised it. Declared here
    # so those tests actually run; the runtime dependency stays optional, because
    # a user who does not enable Teams should not carry a crypto library.
    "PyJWT[crypto]==2.13.0",
    # Test-only, NOT a runtime dependency. test_transcribe.py's pin-completeness
    # test imports imageio_ffmpeg._definitions.FNAME_PER_PLATFORM to derive the
    # authoritative bundled-decoder filename set; without the package installed the
    # test would importorskip and silently pass, which is the "green while checking
    # nothing" shape that test exists to end. imageio_ffmpeg stays a packaging and
    # runtime concern for the desktop bundle, NOT a core install_requires. Pinned to
    # the exact version the desktop matrix ships (packaging/build-desktop.sh).
    "imageio-ffmpeg==0.6.0",
]

[tool.black]
line-length = 100
# force-exclude (not extend-exclude): formatter hooks pass explicit file paths
# to black, and only force-exclude is honored for explicit paths. Vendored
# third-party code must never be reformatted (keeps diffs against upstream
# wheels clean for upgrades). test/workflows/malicious/ is the B9 adversarial
# workflow corpus — hostile scripts kept as DATA (loaded by
# test_workflows_malicious.py, never collected or imported); reformatting
# attack payloads would alter the very byte patterns they exist to probe.
force-exclude = "/_vendor/|/test/workflows/malicious/"

[tool.isort]
# `tests` covers the builtin apps' own test packages (e.g.
# src/kiro_crew/apps/builtins/code_review_sage/tests), imported as
# `from tests.fixtures import ...` with the app dir as the sys.path root.
# isort used to infer first-party from the repo-root tests/ directory; that
# directory was removed in #6577, so the classification is pinned explicitly.
known_first_party = ["kiro_crew", "tests"]

# required for compatibility with black:
profile = "black"

# To maintain consistency with other settings
line_length = 100
# skip + skip_glob: isort's skip_glob alone is not honored when a formatter
# hook passes explicit file paths with --filter-files unset; filter both ways.
skip_glob = ["**/_vendor/*", "src/kiro_crew/_vendor/*"]
extend_skip = ["_vendor"]

[tool.mypy]
mypy_path = "src"
# Keep the blocking gate host-independent. CI type-checks the Linux deployment
# surface, while mypy otherwise selects typeshed from the developer's host and
# reports guarded POSIX APIs as missing when this same command runs on Windows.
platform = "linux"
# See https://mypy.readthedocs.io/en/latest/config_file.html for more mypy options.

# Enables the type-checker on the interior of functions without type annotations.
check_untyped_defs = true

# Displaying specific error codes makes it easier to silence specific errors
# See also https://mypy.readthedocs.io/en/latest/error_codes.html
show_error_codes = true

# Show source code snippets and location markers in error messages
pretty = true

# Suppresses errors about packages which do not implement type-hint sharing.
# See also https://mypy.readthedocs.io/en/latest/running_mypy.html#missing-imports.
ignore_missing_imports = true
# Vendored third-party code (llama-cpp-python) — never type-check it. The
# exclude matches _vendor anywhere (src/ and build output trees alike).
exclude = ['/_vendor/']

[[tool.mypy.overrides]]
# _vendor has no __init__.py (it is a sys.path root), so mypy may resolve the
# vendored files as either kiro_crew._vendor.* or top-level llama_cpp.* /
# diskcache depending on invocation — suppress both spellings.
module = ["kiro_crew._vendor.*", "llama_cpp", "llama_cpp.*", "diskcache"]
ignore_errors = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# neonize is the optional [whatsapp] extra; CI runs mypy without it installed,
# so its imports must resolve the same way (Any) on machines that DO have it.
module = ["neonize", "neonize.*"]
ignore_missing_imports = true
follow_imports = "skip"

