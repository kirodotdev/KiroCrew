[package]
name = "kirocrew-windows-sandbox"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
mxc-sdk = { git = "https://github.com/microsoft/mxc", rev = "b21120168d70befe12356411423266bfef168446" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracelogging = "=1.2.3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
