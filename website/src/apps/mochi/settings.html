<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⚙️ Settings</title>
    <style>
      /*
       * Brought to parity with the original settings entry (renderer/settings.html):
       * global reset, Apple system font stack, 100vw/100vh with overflow hidden
       * (the panel scrolls internally), and the `spin` keyframe the original
       * declared at document level for its loading indicator. The thin custom
       * scrollbar is inherited from the other Mochi entries so the sections
       * scroll like the rest of the app.
       */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #1e1e2e;
        color: #e0e0e0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      ::-webkit-scrollbar {
        width: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--scrollbar, rgba(255, 255, 255, 0.06));
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--scrollbar-hover, rgba(255, 255, 255, 0.12));
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/apps/mochi/settings/main.tsx"></script>
  </body>
</html>
