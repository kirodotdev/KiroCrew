<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mochi</title>
    <style>
      /*
       * Full-screen crop surface. The background MUST stay transparent: the crop
       * overlay paints its OWN dim backdrop (bg-black/50) over the captured frame,
       * and an opaque surface here would sit on top of the window's transparency
       * and show as a black rectangle for the moment before the frame is ready.
       *
       * cursor:crosshair on the root so the pointer reads as "drag a region" the
       * instant the surface appears, not only once it is over the image.
       *
       * Unlike the pet entry this window is NOT click-through, so nothing here
       * disables pointer events; user-select:none is still wanted so a drag
       * selects a region instead of the hint text.
       */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        cursor: crosshair;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #e0e0e0;
        height: 100%;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/apps/mochi/snip/main.tsx"></script>
  </body>
</html>
