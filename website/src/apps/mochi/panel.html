<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mochi</title>
    <style>
      /*
       * The panel window is chromeless and its React root paints its own
       * rounded surface (PanelApp draws a #16161e card with border-radius:12),
       * so the page background stays TRANSPARENT to let those corners show
       * through. Everything else is brought to parity with the original chat
       * entry: global reset, Apple system font stack, themable --text colour,
       * and the thin custom scrollbar driven by --scrollbar / --scrollbar-hover
       * (without these the chat-scroll list and code blocks get fat OS
       * scrollbars).
       */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--text, #cdd6f4);
        height: 100%;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--scrollbar, rgba(255, 255, 255, 0.06));
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--scrollbar-hover, rgba(255, 255, 255, 0.12));
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/apps/mochi/panel/main.tsx"></script>
  </body>
</html>
