<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>ChatInput rich harness</title>
<style>
  :root{--bg:#12141a;--bg-elevated:#1a1d25;--bg-hover:#262a35;--chrome:#1a1d25;--border:#27272a;--border-strong:#3f3f46;
    --text:#e4e4e7;--muted:#7f7f88;--muted-strong:#52525b;--accent:#8e48ff;--accent-fg:#fff;--accent-hover:#9f63ff;
    --accent-subtle:rgba(178,127,255,.16);--danger:#f87171;--ok:#22c55e}
  body{background:#0b0d12;color:var(--text);margin:0;padding:300px 32px 60px;font-family:system-ui,"PingFang SC","Noto Sans CJK SC",sans-serif}
  .composer{background:var(--bg-elevated);border:1px solid var(--border-strong);border-radius:14px;max-width:780px;padding:12px 14px}
  pre{background:#0e1015;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font:11px ui-monospace,monospace;color:var(--muted);white-space:pre-wrap;max-width:780px}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="./chatinput.tsx"></script>
</body>
