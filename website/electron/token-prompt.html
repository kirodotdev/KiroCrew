<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kiro Crew — Token Required</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f8fafc;
      color: #1e293b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .container { text-align: center; max-width: 480px; padding: 20px; }
    .logo { font-size: 48px; margin-bottom: 16px; }
    h2 { margin-bottom: 12px; font-size: 18px; }
    p { color: #64748b; font-size: 13px; margin-bottom: 16px; line-height: 1.5; }
    code {
      background: #e2e8f0; padding: 2px 6px; border-radius: 4px; color: #c2410c;
      /* A bundled AppImage launcher path (~75 chars, no spaces) must not run
         past the 480px column — Chromium will not break at "/" on its own. */
      overflow-wrap: anywhere; word-break: break-word;
    }
    input {
      width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #cbd5e1;
      background: #fff; color: #1e293b; font-size: 14px; margin-bottom: 12px;
      outline: none;
    }
    input:focus { border-color: #f97316; }
    button {
      padding: 8px 24px; border-radius: 8px; border: none; cursor: pointer;
      background: #f97316; color: #fff; font-size: 14px; font-weight: 600;
    }
    button:hover { background: #ea580c; }
    .error { color: #dc2626; font-size: 12px; margin-top: 8px; display: none; }
    @media (prefers-color-scheme: dark) {
      body { background: #0f1117; color: #e2e8f0; }
      p { color: #94a3b8; }
      code { background: #1e293b; color: #f97316; }
      input { border-color: #334155; background: #1e293b; color: #e2e8f0; }
      .error { color: #ef4444; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">👻</div>
    <h2>Token Required</h2>
    <p id="why"></p>
    <input id="url" type="text" placeholder="Paste token URL or raw token…" autofocus>
    <button onclick="go()">Connect</button>
    <div class="error" id="err">Invalid URL — must be http://localhost with a ?token= parameter</div>
  </div>
  <script>
    // WHICH machine to act on depends on who holds the port. main.js probes the
    // listening socket and passes the verdict in as ?kind=. Three cases, not
    // two: on a platform without lsof the probe cannot determine an owner, and
    // asserting "not this app" there would be a confident guess. Default to the
    // hedged wording, which is right whenever we are unsure.
    //
    // A packaged AppImage installs no `kirocrew` on PATH — the launcher ships
    // inside the image — so the shell passes the bundled launcher's absolute
    // path in ?cli=. When present it replaces the bare `kirocrew` in the LOCAL
    // mint command. The command is rendered as a <code> span (not inline prose)
    // so a long bundled path is legible and selectable on its own. A "foreign"
    // gateway's token must be minted on the OTHER machine, where this app's
    // bundled CLI has no standing, so its command stays the plain on-PATH
    // `kirocrew token`. With no ?cli= every branch renders exactly its prior
    // text, so a normal install is unchanged.
    (function explain() {
      const q = new URLSearchParams(window.location.search);
      const port = q.get('port') || '5476';
      const host = q.get('host') || '';
      const where = host ? host : 'the machine running that gateway';
      const kind = q.get('kind');
      const cli = (q.get('cli') || '').trim();
      // The LOCAL mint command: the bundled launcher path when the shell is a
      // packaged AppImage, else the bare on-PATH name. A path with spaces is
      // quoted so it is one shell token.
      const localMint = cli
        ? (/\s/.test(cli) ? '"' + cli + '"' : cli) + ' token'
        : 'kirocrew token';

      const why = document.getElementById('why');
      why.textContent = '';
      // Append plain text, then a <code> command, then more text — so the
      // command renders in its own styled span the user can read and select.
      const say = (t) => why.appendChild(document.createTextNode(t));
      const cmd = (t) => {
        const c = document.createElement('code');
        c.textContent = t;
        why.appendChild(c);
      };

      if (kind === 'local') {
        say('Port ' + port + ' is served by this app\u2019s own gateway, but it could not issue a '
          + 'dashboard token. Run ');
        cmd(localMint);
        say(' on THIS machine and paste the URL below.');
      } else if (kind === 'foreign') {
        say('Port ' + port + ' is held by a gateway this app did not start \u2014 most often an SSH '
          + 'tunnel to another machine. Its access key is its own, so a token has to come from '
          + 'there: run ');
        cmd('kirocrew token');
        say(' on ' + where + ', then paste the URL below.');
      } else if (cli) {
        // Unknown owner on a packaged AppImage: name both paths, the local one
        // using the bundled launcher.
        say('The gateway on port ' + port + ' would not issue a dashboard token, and this app '
          + 'could not determine which machine it is running on. If you reached it through an SSH '
          + 'tunnel, run ');
        cmd('kirocrew token');
        say(' on ' + where + '; otherwise run ');
        cmd(localMint);
        say(' on this machine. Then paste the URL below.');
      } else {
        // Unknown owner, not packaged: byte-for-byte the original hedged text,
        // which refers back to the command rather than spelling it out again.
        say('The gateway on port ' + port + ' would not issue a dashboard token, and this app '
          + 'could not determine which machine it is running on. If you reached it through an SSH '
          + 'tunnel, run ');
        cmd('kirocrew token');
        say(' on ' + where + '; otherwise run it on this machine. Then paste the URL below.');
      }
    })();

    function go() {
      const v = document.getElementById('url').value.trim();
      if (!v) return;
      const port = new URLSearchParams(window.location.search).get('port') || '5476';
      let t;
      try { t = new URL(v).searchParams.get('token'); } catch (_) { t = v; }
      if (t) {
        window.location.href = 'http://localhost:' + port + '?token=' + encodeURIComponent(t);
      } else {
        document.getElementById('err').style.display = 'block';
      }
    }
    document.getElementById('url').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  </script>
</body>
</html>
