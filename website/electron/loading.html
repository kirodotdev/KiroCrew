<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KiroCrew</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --kiro: #9046FF; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;          /* neutral backdrop revealed during the final fade */
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
    }
    /* The whole reveal lives in #root; it fades out as one layer when ready. */
    #root {
      position: fixed; inset: 0; overflow: hidden;
      background: var(--kiro);
      opacity: 1;
      transition: opacity 0.42s ease;
      will-change: opacity;
    }
    /* White sweep panel — grows from the left with a lightly feathered right edge. */
    #white {
      position: absolute; top: 0; left: 0; height: 100%;
      width: 0; background: #ffffff; z-index: 10;
      filter: blur(1.5px);
      -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 70px), transparent 100%);
      mask-image: linear-gradient(to right, #000 calc(100% - 70px), transparent 100%);
      will-change: width;
    }
    #wordWrap {
      position: absolute; inset: 0; z-index: 20;
      display: flex; align-items: center; justify-content: center;
    }
    .boot-word { max-width: 92vw; height: auto; }
    /* Status line — absolutely positioned below the wordmark so it never shifts
       the centered KIROCREW. Hidden until the reveal completes. */
    #status {
      position: absolute; left: 50%; top: calc(50% + 92px);
      transform: translate(-50%, 6px); opacity: 0;
      transition: opacity 0.45s ease, transform 0.45s ease;
      z-index: 21;
      display: flex; align-items: center; gap: 9px;
      font-size: 15px; font-weight: 600; letter-spacing: 0.01em;
      color: var(--kiro);
    }
    #status.show { opacity: 1; transform: translate(-50%, 0); }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--kiro);
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; transform: scale(0.8); }
      50%      { opacity: 1;    transform: scale(1); }
    }
    /* Kiro ghost. Off-screen left before JS runs (matches HIDDEN_X) so it never
       flashes at the edge on first paint — request: render it first, animate later. */
    #ghost {
      position: absolute; top: 50%; left: 0; z-index: 30;
      transform: translate(-260px, -50%);
      will-change: transform;
      filter: drop-shadow(0 10px 26px rgba(40, 20, 90, 0.35));
    }
    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; }
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="white"></div>

    <div id="wordWrap">
      <!-- KIROCREW characters are injected + laid out by JS (one <text> each;
           outline strokes on, then fills, as the ghost sweeps past). -->
      <svg class="boot-word" width="900" height="160" viewBox="0 0 900 160" aria-hidden="true"></svg>
    </div>

    <!-- Appears below KIROCREW only after the reveal finishes; shows live gateway
         status and stays until the gateway is ready, then the whole screen fades. -->
    <div id="status"><span class="dot"></span><span id="statusText">Starting gateway&hellip;</span></div>

    <!-- Inline ghost (white body, black eyes) — inlined, not an <img>, so it paints
         instantly with no first-load delay. -->
    <div id="ghost">
      <svg width="200" height="263" viewBox="255 110 745 980" fill="none" aria-hidden="true">
        <path d="M398.554 818.914C316.315 1001.03 491.477 1046.74 620.672 940.156C658.687 1059.66 801.052 970.473 852.234 877.795C964.787 673.567 919.318 465.357 907.64 422.374C827.637 129.443 427.623 128.946 358.8 423.865C342.651 475.544 342.402 534.18 333.458 595.051C328.986 625.86 325.507 645.488 313.83 677.785C306.873 696.424 297.68 712.819 282.773 740.645C259.915 783.881 269.604 867.113 387.87 823.883L399.051 818.914H398.554Z" fill="#ffffff" />
        <path d="M636.123 549.353C603.328 549.353 598.359 510.097 598.359 486.742C598.359 465.623 602.086 448.977 609.293 438.293C615.504 428.852 624.697 424.131 636.123 424.131C647.555 424.131 657.492 428.852 664.447 438.541C672.398 449.474 676.623 466.12 676.623 486.742C676.623 525.998 661.471 549.353 636.375 549.353H636.123Z" fill="#000000" />
        <path d="M771.24 549.353C738.445 549.353 733.477 510.097 733.477 486.742C733.477 465.623 737.203 448.977 744.41 438.293C750.621 428.852 759.814 424.131 771.24 424.131C782.672 424.131 792.609 428.852 799.564 438.541C807.516 449.474 811.74 466.12 811.74 486.742C811.74 525.998 796.588 549.353 771.492 549.353H771.24Z" fill="#000000" />
      </svg>
    </div>
  </div>

  <!-- Same anime.js engine the dashboard's BootReveal.tsx uses (vendored from
       src/lib/anime.es.js). Loaded as a classic script because file:// pages
       cannot import ES modules. Exposes window.anime. -->
  <script src="./anime.global.js"></script>
  <script>
    (function () {
      "use strict";

      var anime = window.anime;

      // ── Constants (mirrors src/components/BootReveal.tsx) ──
      var KIRO_PURPLE = "#9046FF";
      var KIRO_RGB = "144,70,255";
      var WORD = "KIROCREW";
      var GHOST_W = 200, FADE = 70, VB_W = 900, CHAR_SPACING = 8, OUTLINE_MULT = 7;
      var FLOAT_MS = 2400, DRAW_MS = 320, FILL_MS = 260;
      var DRAW_FRAC = DRAW_MS / FLOAT_MS, FILL_FRAC = FILL_MS / FLOAT_MS;
      var HIDDEN_X = -GHOST_W - 30, PEEK_TILT = 16, PEEK_X = -GHOST_W + 130;
      var GHOST_LOAD_DELAY = 500;   // request: let the ghost paint/settle before animating
      var MIN_STATUS_HOLD = 500;    // keep the status text on screen briefly before fading

      var root = document.getElementById("root");
      var white = document.getElementById("white");
      var ghost = document.getElementById("ghost");
      var statusEl = document.getElementById("status");
      var statusText = document.getElementById("statusText");
      var svg = document.querySelector(".boot-word");
      var SVG_NS = "http://www.w3.org/2000/svg";

      var chars = [];
      var revealDone = false, revealDoneAt = 0;
      var gatewayReady = false, finished = false;
      var latestStatus = "Starting gateway…";

      function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
      function setGhost(gx, bob, rot) {
        ghost.style.transform =
          "translate(" + gx + "px, -50%) translateY(" + (bob || 0) + "px) rotate(" + (rot || 0) + "deg)";
      }

      // Create the 8 character elements and measure/lay them out (centered).
      function buildChars() {
        var els = WORD.split("").map(function (ch) {
          var t = document.createElementNS(SVG_NS, "text");
          t.setAttribute("class", "boot-char");
          t.setAttribute("x", "0");
          t.setAttribute("y", "80");
          t.setAttribute("text-anchor", "start");
          t.setAttribute("dominant-baseline", "central");
          t.setAttribute("font-size", "84");
          t.setAttribute("font-weight", "800");
          t.setAttribute("fill", "none");
          t.setAttribute("stroke", KIRO_PURPLE);
          t.setAttribute("stroke-width", "3");
          t.setAttribute("stroke-linejoin", "round");
          t.setAttribute("stroke-linecap", "round");
          t.textContent = ch;
          svg.appendChild(t);
          return t;
        });
        var widths = els.map(function (c) { return c.getComputedTextLength() || 50; });
        var total = widths.reduce(function (a, b) { return a + b; }, 0) + CHAR_SPACING * (els.length - 1);
        var cur = (VB_W - total) / 2;
        chars = els.map(function (c, i) {
          c.setAttribute("x", String(cur));
          var vbLeft = cur;
          cur += widths[i] + CHAR_SPACING;
          var len = widths[i] * OUTLINE_MULT;
          c.style.strokeDasharray = String(len);
          c.style.strokeDashoffset = String(len);
          return { el: c, len: len, vbLeft: vbLeft, screenLeft: 0, triggerMp: -1 };
        });
      }

      // Force the finished frame: full white sweep, all glyphs filled, ghost gone.
      function settleFinalFrame() {
        white.style.width = (window.innerWidth + GHOST_W + FADE + 60) + "px";
        chars.forEach(function (c) {
          c.el.style.strokeDashoffset = "0";
          c.el.style.fill = KIRO_PURPLE;
          c.el.style.stroke = "transparent";
        });
        setGhost(window.innerWidth + GHOST_W + 80, 0, 0);
      }

      function onRevealDone() {
        if (revealDone) return;
        revealDone = true;
        revealDoneAt = performance.now();
        settleFinalFrame();
        statusText.textContent = latestStatus;
        statusEl.classList.add("show");
        maybeFinish();
      }

      function maybeFinish() {
        if (!revealDone || !gatewayReady || finished) return;
        var wait = Math.max(0, revealDoneAt + MIN_STATUS_HOLD - performance.now());
        setTimeout(fadeOut, wait);
      }

      function fadeOut() {
        if (finished) return;
        finished = true;
        var done = false;
        function notifyMain() {
          if (done) return;
          done = true;
          try { if (window.electronAPI && window.electronAPI.bootComplete) window.electronAPI.bootComplete(); } catch (e) {}
        }
        root.addEventListener("transitionend", function (e) {
          if (e.propertyName === "opacity") notifyMain();
        }, { once: true });
        root.style.opacity = "0";
        setTimeout(notifyMain, 700); // fallback if transitionend doesn't fire
      }

      // ── The reveal timeline — same anime.js engine + phases as BootReveal.tsx ──
      function startReveal() {
        var prog = { p: 0 };
        var writeMp = { p: 0 };
        var startX = 0, endX = 0;

        setGhost(HIDDEN_X, 0, 0);

        var tl = anime.timeline({ autoplay: false, complete: onRevealDone });

        // 1. Peek in, head tilting to look around the edge.
        tl.add({
          targets: prog, p: [0, 1], duration: 560, easing: "easeOutBack",
          update: function () { setGhost(HIDDEN_X + (PEEK_X - HIDDEN_X) * prog.p, Math.sin(prog.p * Math.PI) * -6, PEEK_TILT * prog.p); }
        });
        // 2. Curious look-around while peeking.
        tl.add({
          targets: prog, p: [0, 1], duration: 460, easing: "easeInOutSine",
          update: function () { setGhost(PEEK_X, Math.sin(prog.p * Math.PI * 2) * 7, PEEK_TILT + Math.sin(prog.p * Math.PI * 2) * 3); }
        });
        // 3. Withdraw, straightening up.
        tl.add({
          targets: prog, p: [0, 1], duration: 380, easing: "easeInBack",
          update: function () { setGhost(PEEK_X + (HIDDEN_X - PEEK_X) * prog.p, 0, PEEK_TILT * (1 - prog.p)); }
        });
        // 4. Constant-speed float; each glyph strokes its outline as the ghost
        //    passes, then fills in just behind the sweep edge.
        tl.add({
          targets: writeMp, p: [0, 1], duration: FLOAT_MS, easing: "linear",
          begin: function () {
            var r = svg.getBoundingClientRect();
            var rl = r && r.width ? r.left : 0;
            var rw = r && r.width ? r.width : 1;
            chars.forEach(function (c) { c.screenLeft = rl + (c.vbLeft / VB_W) * rw; });
            startX = -GHOST_W - FADE - 20;
            endX = window.innerWidth + GHOST_W + FADE + 40;
          },
          update: function () {
            var mp = writeMp.p;
            var gx = startX + (endX - startX) * mp;
            setGhost(gx, Math.sin(mp * Math.PI * 3) * 14, 0);
            var front = gx + 30;
            white.style.width = clamp(front, 0, endX + FADE + 60) + "px";
            var solidEdge = front - FADE;
            for (var i = 0; i < chars.length; i++) {
              var c = chars[i];
              if (c.triggerMp < 0 && solidEdge >= c.screenLeft) c.triggerMp = mp;
              if (c.triggerMp >= 0) {
                var dp = clamp((mp - c.triggerMp) / DRAW_FRAC, 0, 1);
                c.el.style.strokeDashoffset = String(c.len * (1 - dp));
                var fp = clamp((mp - c.triggerMp - DRAW_FRAC) / FILL_FRAC, 0, 1);
                c.el.style.fill = "rgba(" + KIRO_RGB + "," + fp + ")";
                c.el.style.stroke = "rgba(" + KIRO_RGB + "," + (1 - fp) + ")";
              }
            }
          }
        }, "+=120");

        // Request: ghost is rendered first (off-screen); animate only after 0.5s.
        setTimeout(function () { tl.play(); }, GHOST_LOAD_DELAY);
      }

      // ── Gateway status / ready signals from the Electron main process ──
      if (window.electronAPI && window.electronAPI.onStatus) {
        window.electronAPI.onStatus(function (msg) {
          if (msg) latestStatus = msg;
          if (revealDone) statusText.textContent = latestStatus;
        });
      }
      if (window.electronAPI && window.electronAPI.onBootReady) {
        window.electronAPI.onBootReady(function () { gatewayReady = true; maybeFinish(); });
      }

      // ── Kick off ──
      function start() {
        buildChars();
        var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (reduce || !anime) {
          white.style.maskImage = "none";
          white.style.webkitMaskImage = "none";
          white.style.filter = "none";
          ghost.style.display = "none";
          settleFinalFrame();
          onRevealDone();
          return;
        }
        startReveal();
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", start);
      } else {
        start();
      }
    })();
  </script>
</body>
</html>
