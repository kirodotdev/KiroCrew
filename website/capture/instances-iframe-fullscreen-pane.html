<!DOCTYPE html>
<!-- Evidence harness pane: stands in for the embedded remote dashboard.
     Served on its own port so the embedding parent is CROSS-ORIGIN, which is
     the condition under which the fullscreen delegation matters. -->
<html>
<head><meta charset="utf-8"><style>
  body { margin: 0; font: 13px system-ui; background: #fff; padding: 12px; }
  #state { font-weight: 600; margin-bottom: 8px; }
  video { width: 480px; display: block; }
</style></head>
<body>
  <div id="state"></div>
  <video id="v" controls src="/test-video.webm"></video>
  <script>
    document.getElementById('state').textContent =
      'document.fullscreenEnabled = ' + document.fullscreenEnabled;
    document.title = 'pane-fs-' + document.fullscreenEnabled;
  </script>
</body>
</html>
