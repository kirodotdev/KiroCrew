<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Pixel art office/gamepad icon for Agent Worlds -->
  <rect width="32" height="32" rx="6" fill="#1a1209"/>
  <!-- Desk -->
  <rect x="6" y="18" width="20" height="2" fill="#7a5c47"/>
  <rect x="6" y="17" width="20" height="1" fill="#f90"/>
  <!-- Monitor -->
  <rect x="12" y="10" width="8" height="6" fill="#333"/>
  <rect x="13" y="11" width="6" height="4" fill="#0a2a0a"/>
  <!-- Screen text -->
  <rect x="14" y="12" width="4" height="1" fill="#33ff33"/>
  <rect x="14" y="14" width="3" height="1" fill="#33ff33"/>
  <!-- Agent (pixel person) -->
  <rect x="8" y="20" width="4" height="4" fill="#e74c3c"/>
  <rect x="9" y="18" width="2" height="2" fill="#fdd"/>
  <!-- Agent 2 -->
  <rect x="20" y="20" width="4" height="4" fill="#3498db"/>
  <rect x="21" y="18" width="2" height="2" fill="#fdd"/>
  <!-- Sparkle -->
  <rect x="26" y="6" width="2" height="2" fill="#f90"/>
  <rect x="4" y="8" width="2" height="2" fill="#f90"/>
</svg>
