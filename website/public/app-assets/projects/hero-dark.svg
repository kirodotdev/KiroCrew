  <circle cx="240" cy="140" r="70" fill="#f97316" fill-opacity="0.06"/>
  <!-- Rocket body -->
  <path d="M240 45 Q210 85 210 140 L222 158 L258 158 L270 140 Q270 85 240 45" fill="#f97316" fill-opacity="0.15" stroke="#fb923c" stroke-width="2.5"/>
  <!-- Window -->
  <circle cx="240" cy="105" r="16" fill="#f97316" fill-opacity="0.3" stroke="#fb923c" stroke-width="2"/>
  <!-- Side fins -->
  <path d="M210 140 L190 170 L215 155" fill="#fb923c" fill-opacity="0.3" stroke="#fb923c" stroke-width="1"/>
  <path d="M270 140 L290 170 L265 155" fill="#fb923c" fill-opacity="0.3" stroke="#fb923c" stroke-width="1"/>
  <!-- Flame -->
  <path d="M222 158 L218 185 L228 175 L240 195 L252 175 L262 185 L258 158" fill="#fbbf24" fill-opacity="0.8"/>
  <!-- Exhaust -->
  <circle cx="240" cy="210" r="5" fill="#fb923c" fill-opacity="0.5"/>
  <circle cx="230" cy="225" r="3.5" fill="#f97316" fill-opacity="0.3"/>
  <circle cx="250" cy="225" r="3.5" fill="#f97316" fill-opacity="0.3"/>
  <circle cx="240" cy="240" r="2.5" fill="#f97316" fill-opacity="0.2"/>
  <!-- Terminal -->
  <rect x="320" y="110" width="100" height="70" rx="8" fill="#f97316" fill-opacity="0.08" stroke="#fb923c" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="332" y="125" width="45" height="5" rx="2.5" fill="#4ade80" fill-opacity="0.7"/>
  <rect x="332" y="137" width="65" height="5" rx="2.5" fill="#fb923c" fill-opacity="0.4"/>
  <rect x="332" y="149" width="35" height="5" rx="2.5" fill="#fb923c" fill-opacity="0.3"/>
  <rect x="332" y="161" width="55" height="5" rx="2.5" fill="#4ade80" fill-opacity="0.5"/>
  <!-- Speed lines -->
  <rect x="100" y="120" width="40" height="3" rx="1.5" fill="#fb923c" fill-opacity="0.25"/>
  <rect x="80" y="145" width="55" height="3" rx="1.5" fill="#fb923c" fill-opacity="0.2"/>
  <rect x="110" y="170" width="35" height="3" rx="1.5" fill="#fb923c" fill-opacity="0.15"/>
