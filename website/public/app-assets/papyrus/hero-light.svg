<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Papyrus">
  <defs>
    <linearGradient id="pap-bg-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf6ec"/>
      <stop offset="100%" stop-color="#f3e3c8"/>
    </linearGradient>
  </defs>
  <rect width="480" height="270" rx="12" fill="url(#pap-bg-l)"/>
  <circle cx="52" cy="38" r="22" fill="#e7d0a6" opacity="0.55"/>
  <circle cx="430" cy="238" r="30" fill="#dbc192" opacity="0.4"/>

  <!-- LEFT PANE: the LaTeX source -->
  <rect x="26" y="30" width="196" height="182" rx="8" fill="#fffdf8" stroke="#d9c39a" stroke-width="1.5"/>
  <rect x="26" y="30" width="196" height="20" rx="8" fill="#efe0c4"/>
  <rect x="26" y="44" width="196" height="6" fill="#efe0c4"/>
  <text x="38" y="45" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#8a6d3b">main.tex</text>
  <!-- gutter -->
  <rect x="26" y="50" width="20" height="162" fill="#faf2e2"/>
  <g fill="#c2a878" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7">
    <text x="32" y="65">1</text><text x="32" y="79">2</text><text x="32" y="93">3</text>
    <text x="32" y="107">4</text><text x="32" y="121">5</text><text x="32" y="135">6</text>
    <text x="32" y="149">7</text><text x="32" y="163">8</text><text x="32" y="177">9</text>
  </g>
  <!-- source lines: command tokens in one hue, prose in another -->
  <g>
    <rect x="54" y="59" width="52" height="6" rx="2" fill="#b4762a"/>
    <rect x="110" y="59" width="34" height="6" rx="2" fill="#9a8a6b" opacity="0.5"/>
    <rect x="54" y="73" width="40" height="6" rx="2" fill="#b4762a"/>
    <rect x="54" y="87" width="88" height="6" rx="2" fill="#6f6350" opacity="0.65"/>
    <rect x="54" y="101" width="118" height="6" rx="2" fill="#6f6350" opacity="0.65"/>
    <rect x="54" y="115" width="64" height="6" rx="2" fill="#6f6350" opacity="0.65"/>
    <rect x="54" y="129" width="46" height="6" rx="2" fill="#b4762a"/>
    <rect x="104" y="129" width="58" height="6" rx="2" fill="#2f7d5c" opacity="0.7"/>
    <rect x="54" y="143" width="104" height="6" rx="2" fill="#6f6350" opacity="0.65"/>
    <rect x="54" y="157" width="76" height="6" rx="2" fill="#6f6350" opacity="0.65"/>
    <rect x="54" y="171" width="54" height="6" rx="2" fill="#b4762a"/>
  </g>
  <!-- caret -->
  <rect x="112" y="169" width="1.6" height="10" fill="#b4762a"/>

  <!-- RIGHT PANE: the rendered PDF page -->
  <rect x="246" y="22" width="150" height="198" rx="4" fill="#ffffff" stroke="#d9c39a" stroke-width="1.5"/>
  <rect x="252" y="28" width="138" height="186" rx="2" fill="#ffffff"/>
  <!-- title block -->
  <rect x="278" y="40" width="86" height="7" rx="2" fill="#4a4336"/>
  <rect x="294" y="52" width="54" height="4" rx="2" fill="#8a8172"/>
  <!-- two-column body -->
  <g fill="#b6ac99">
    <rect x="262" y="70" width="58" height="3.4" rx="1.7"/>
    <rect x="262" y="78" width="58" height="3.4" rx="1.7"/>
    <rect x="262" y="86" width="44" height="3.4" rx="1.7"/>
    <rect x="262" y="98" width="58" height="3.4" rx="1.7"/>
    <rect x="262" y="106" width="52" height="3.4" rx="1.7"/>
    <rect x="326" y="70" width="58" height="3.4" rx="1.7"/>
    <rect x="326" y="78" width="58" height="3.4" rx="1.7"/>
    <rect x="326" y="86" width="50" height="3.4" rx="1.7"/>
  </g>
  <!-- a typeset equation -->
  <rect x="272" y="120" width="98" height="18" rx="3" fill="#f7f2e6"/>
  <rect x="284" y="127" width="14" height="4" rx="2" fill="#7a705d"/>
  <rect x="302" y="127" width="6" height="4" rx="2" fill="#b4762a"/>
  <rect x="312" y="127" width="44" height="4" rx="2" fill="#7a705d"/>
  <!-- a figure -->
  <rect x="262" y="150" width="122" height="40" rx="3" fill="#f2ede1" stroke="#e0d6bf" stroke-width="1"/>
  <path d="M270 182 L288 166 L302 176 L318 156 L336 172 L354 160 L376 178" fill="none" stroke="#2f7d5c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#b6ac99">
    <rect x="262" y="196" width="100" height="3.4" rx="1.7"/>
    <rect x="262" y="204" width="70" height="3.4" rx="1.7"/>
  </g>

  <!-- co-author bubble -->
  <g transform="translate(30,224)">
    <rect width="186" height="30" rx="8" fill="#fffdf8" stroke="#d9c39a" stroke-width="1.5"/>
    <circle cx="18" cy="15" r="7" fill="#b4762a"/>
    <path d="M15 15 L21 15 M18 12 L18 18" stroke="#fffdf8" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="33" y="9" width="112" height="5" rx="2.5" fill="#c9bda3"/>
    <rect x="33" y="18" width="76" height="4" rx="2" fill="#ddd2b8"/>
  </g>
</svg>
