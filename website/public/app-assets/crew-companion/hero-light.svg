<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <defs>
    <linearGradient id="cc-bg-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f1ff"/>
      <stop offset="100%" stop-color="#e2d8ff"/>
    </linearGradient>
    <linearGradient id="cc-body-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0ebff"/>
    </linearGradient>
  </defs>
  <rect width="480" height="270" rx="12" fill="url(#cc-bg-l)"/>

  <!-- Soft corner motes -->
  <circle cx="58" cy="42" r="20" fill="#cbb8ff" opacity="0.5"/>
  <circle cx="430" cy="232" r="30" fill="#b79bff" opacity="0.35"/>

  <!-- Breathing rings behind the companion -->
  <g transform="translate(150,140)">
    <circle r="118" fill="none" stroke="#a78bfa" stroke-width="1.4" opacity="0.22"/>
    <circle r="92" fill="none" stroke="#a78bfa" stroke-width="1.4" opacity="0.32"/>
    <circle r="66" fill="none" stroke="#8b5cf6" stroke-width="1.4" opacity="0.4"/>
  </g>

  <!-- Companion ghost, silhouette reused from the app's kiro_idle pose -->
  <g transform="translate(0,4)">
    <path d="M90,196 L90,120 A60,60 0 0 1 210,120 L210,196
             Q190,218 170,196 Q150,218 130,196 Q110,218 90,196 Z"
          fill="url(#cc-body-l)" stroke="#3a3363" stroke-width="5" stroke-linejoin="round"/>
    <!-- Cheeks -->
    <circle cx="118" cy="140" r="8" fill="#ffb3c8" opacity="0.55"/>
    <circle cx="182" cy="140" r="8" fill="#ffb3c8" opacity="0.55"/>
    <!-- Eyes -->
    <circle cx="132" cy="120" r="9" fill="#3a3363"/>
    <circle cx="168" cy="120" r="9" fill="#3a3363"/>
    <circle cx="135" cy="117" r="2.6" fill="#ffffff"/>
    <circle cx="171" cy="117" r="2.6" fill="#ffffff"/>
  </g>

  <!-- Nudge cards: drink water / look away / reminder -->
  <!-- Water -->
  <rect x="300" y="52" width="152" height="44" rx="9" fill="#ffffff" stroke="#cbb8ff" stroke-width="1.5"/>
  <circle cx="324" cy="74" r="13" fill="#e6f2ff"/>
  <path d="M324,66 C330,73 330,80 324,80 C318,80 318,73 324,66 Z" fill="#4a9ede"/>
  <rect x="346" y="68" width="86" height="6" rx="3" fill="#5b4f8f"/>
  <rect x="346" y="79" width="54" height="5" rx="2.5" fill="#b9a9e6"/>

  <!-- Look away -->
  <rect x="300" y="108" width="152" height="44" rx="9" fill="#ffffff" stroke="#cbb8ff" stroke-width="1.5"/>
  <circle cx="324" cy="130" r="13" fill="#e3f7ef"/>
  <path d="M317,130 Q324,123 331,130 Q324,137 317,130 Z" fill="none" stroke="#10b981" stroke-width="2"/>
  <circle cx="324" cy="130" r="2.4" fill="#10b981"/>
  <rect x="346" y="124" width="72" height="6" rx="3" fill="#5b4f8f"/>
  <rect x="346" y="135" width="60" height="5" rx="2.5" fill="#b9a9e6"/>

  <!-- Reminder (clock) -->
  <rect x="300" y="164" width="152" height="44" rx="9" fill="#ffffff" stroke="#cbb8ff" stroke-width="1.5" opacity="0.92"/>
  <circle cx="324" cy="186" r="13" fill="#fff2dd"/>
  <circle cx="324" cy="186" r="8" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <path d="M324,186 L324,181 M324,186 L328,188" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <rect x="346" y="180" width="64" height="6" rx="3" fill="#5b4f8f"/>
  <rect x="346" y="191" width="46" height="5" rx="2.5" fill="#b9a9e6"/>
</svg>
