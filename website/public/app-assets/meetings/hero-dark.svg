      <stop offset="0%" stop-color="#161a2e"/>
      <stop offset="100%" stop-color="#0e1020"/>
    </linearGradient>
    <linearGradient id="mt-wave-d" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="1"/>
