<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Cards draining through lanes. Card pitch is deliberately tight (a 0.75 gap
       against a 2.7 card) so each lane reads as one mass rather than dissolving
       into loose pills, and the descending heights give the mark a staircase
       silhouette that still resolves at 16px: work piles up in the queue and
       drains to the right.

       Exactly one card is solid, and it is the one running in a real agent
       session — the distinction this board exists for, since a card here is not
       just dragged between columns, it executes. Saying that with fill rather
       than an added play glyph is what keeps the mark legible in the sidebar,
       where such a glyph would be two grey pixels.

       Painted from --ico-a (muted structure) and --ico-b (accent) so the theme
       cascades in: AppIcon drives idle as (muted, accent) and selected as
       (accent, text), and hardcoded colours would opt out of both. -->
  <rect x="3.4" y="4.6" width="5.4" height="2.7" rx="0.95" fill="var(--ico-a, currentColor)" fill-opacity="0.55"/>
  <rect x="3.4" y="8.05" width="5.4" height="2.7" rx="0.95" fill="var(--ico-a, currentColor)" fill-opacity="0.55"/>
  <rect x="3.4" y="11.5" width="5.4" height="2.7" rx="0.95" fill="var(--ico-a, currentColor)" fill-opacity="0.55"/>
  <rect x="3.4" y="14.95" width="5.4" height="2.7" rx="0.95" fill="var(--ico-a, currentColor)" fill-opacity="0.55"/>
  <rect x="9.3" y="4.6" width="5.4" height="2.7" rx="0.95" fill="var(--ico-b, currentColor)"/>
  <rect x="9.3" y="8.05" width="5.4" height="2.7" rx="0.95" fill="var(--ico-a, currentColor)" fill-opacity="0.55"/>
  <rect x="15.2" y="4.6" width="5.4" height="2.7" rx="0.95" fill="var(--ico-b, currentColor)" fill-opacity="0.38"/>
</svg>
