<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- The ruler: the app's thesis is that the measurement IS the product, so the
       measuring edge is the dominant shape and the improvement rides on it. -->
  <rect x="2" y="16.5" width="20" height="5" rx="1.2" fill="var(--ico-a, currentColor)" fill-opacity="0.16" stroke="var(--ico-a, currentColor)" stroke-width="1.6"/>
  <line x1="6" y1="16.5" x2="6" y2="19" stroke="var(--ico-a, currentColor)" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="10" y1="16.5" x2="10" y2="19" stroke="var(--ico-a, currentColor)" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="14" y1="16.5" x2="14" y2="19" stroke="var(--ico-a, currentColor)" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="18" y1="16.5" x2="18" y2="19" stroke="var(--ico-a, currentColor)" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Keep-or-revert: the staircase only steps down when a win clears the band. -->
  <path d="M3.5,13 L8,13 L8,9.5 L13,9.5 L13,6 L20.5,6" stroke="var(--ico-b, currentColor)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="20.5" cy="6" r="1.9" fill="var(--ico-b, currentColor)"/>
</svg>
