  </g>

  <!-- Account rows, one health dot each (right) -->
  <rect x="282" y="48" width="164" height="32" rx="7" fill="#0f2630" stroke="#164e63" stroke-width="1.5"/>
  <circle cx="299" cy="64" r="4.5" fill="#22d3ee"/>
  <rect x="312" y="58" width="96" height="6" rx="3" fill="#a5f3fc"/>
  <rect x="312" y="68" width="56" height="5" rx="2.5" fill="#164e63"/>

  <rect x="282" y="88" width="164" height="32" rx="7" fill="#0f2630" stroke="#164e63" stroke-width="1.5"/>
  <circle cx="299" cy="104" r="4.5" fill="#22d3ee"/>
  <rect x="312" y="98" width="78" height="6" rx="3" fill="#a5f3fc"/>
  <rect x="312" y="108" width="44" height="5" rx="2.5" fill="#164e63"/>

  <rect x="282" y="128" width="164" height="32" rx="7" fill="#0f2630" stroke="#164e63" stroke-width="1.5"/>
  <circle cx="299" cy="144" r="4.5" fill="#fbbf24"/>
  <rect x="312" y="138" width="88" height="6" rx="3" fill="#a5f3fc"/>
  <rect x="312" y="148" width="50" height="5" rx="2.5" fill="#164e63"/>

