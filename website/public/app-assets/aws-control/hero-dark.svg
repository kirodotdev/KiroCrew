    <path d="M-15,-24 h30 a5,5 0 0 1 5,5 v38 l-6.7,-4 l-6.6,4 l-6.7,-4 l-6.7,4 l-6.6,-4 l-6.7,4 v-38 a5,5 0 0 1 5,-5 z" fill="#0f2630" stroke="#164e63" stroke-width="1.6"/>
