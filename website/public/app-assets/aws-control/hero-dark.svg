    <rect x="-12" y="-6" width="15" height="4.5" rx="2.25" fill="#164e63"/>
    <circle cx="19" cy="16" r="13.5" fill="#0f2630"/>
    <circle cx="19" cy="16" r="11.5" fill="#22d3ee"/>
    <path d="M13.6,16 L17.6,20 L24.8,12.2" fill="none" stroke="#0a1a21" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
