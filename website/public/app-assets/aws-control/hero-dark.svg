<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="AWS Control">
  <defs>
    <linearGradient id="ac-bg-d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a21"/>
      <stop offset="100%" stop-color="#0f2a34"/>
