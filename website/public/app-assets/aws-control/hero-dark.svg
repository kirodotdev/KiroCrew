      <path d="M0,-12 L10.5,-8.3 V0.6 C10.5,7.6 0,12.5 0,12.5 C0,12.5 -10.5,7.6 -10.5,0.6 V-8.3 Z" fill="#22d3ee" stroke="#0f2630" stroke-width="3"/>
      <path d="M0,-12 L10.5,-8.3 V0.6 C10.5,7.6 0,12.5 0,12.5 C0,12.5 -10.5,7.6 -10.5,0.6 V-8.3 Z" fill="#22d3ee"/>
      <path d="M-4.4,-0.4 L-1.3,2.8 L4.8,-4" fill="none" stroke="#0a1a21" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
