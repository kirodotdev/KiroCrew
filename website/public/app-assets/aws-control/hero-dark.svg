  </defs>
  <rect width="480" height="270" rx="12" fill="url(#ac-bg-d)"/>
  <circle cx="60" cy="40" r="20" fill="#155e75" opacity="0.4"/>
  <circle cx="432" cy="242" r="28" fill="#0e7490" opacity="0.3"/>

  <!-- Drive / bucket on faint concentric arcs (left third) -->
  <g transform="translate(122,136)">
    <circle r="104" fill="none" stroke="#22d3ee" stroke-width="1.2" opacity="0.14"/>
    <circle r="80" fill="none" stroke="#22d3ee" stroke-width="1.2" opacity="0.22"/>
    <circle r="56" fill="none" stroke="#22d3ee" stroke-width="1.2" opacity="0.3"/>

    <rect x="-48" y="-56" width="96" height="112" rx="12" fill="#0f2630" stroke="#164e63" stroke-width="1.8"/>
    <line x1="-48" y1="-19" x2="48" y2="-19" stroke="#164e63" stroke-width="1.5"/>
    <line x1="-48" y1="19" x2="48" y2="19" stroke="#164e63" stroke-width="1.5"/>

    <rect x="-34" y="-43" width="48" height="6" rx="3" fill="#a5f3fc" opacity="0.8"/>
    <rect x="-34" y="-32" width="30" height="5" rx="2.5" fill="#164e63"/>

    <rect x="-34" y="-3" width="68" height="6" rx="3" fill="#164e63"/>
