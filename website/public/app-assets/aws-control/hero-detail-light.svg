<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 288" width="1200" height="288" role="img" aria-label="AWS Control">
  <defs>
    <linearGradient id="ac-dbg-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#c6f0f7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="288" fill="url(#ac-dbg-l)"/>

  <!-- Soft decorative orbs -->
  <circle cx="120" cy="42" r="30" fill="#a5f3fc" opacity="0.45"/>
  <circle cx="1150" cy="250" r="48" fill="#67e8f9" opacity="0.3"/>
  <circle cx="655" cy="272" r="18" fill="#a5f3fc" opacity="0.4"/>

  <!-- Drive / bucket on faint concentric arcs (left) -->
  <g transform="translate(230,144)">
    <circle r="124" fill="none" stroke="#0e7490" stroke-width="1.2" opacity="0.16"/>
    <circle r="98" fill="none" stroke="#0e7490" stroke-width="1.2" opacity="0.26"/>
    <circle r="72" fill="none" stroke="#0e7490" stroke-width="1.2" opacity="0.36"/>

    <rect x="-56" y="-64" width="112" height="128" rx="14" fill="#ffffff" stroke="#a5f3fc" stroke-width="1.8"/>
    <line x1="-56" y1="-21" x2="56" y2="-21" stroke="#a5f3fc" stroke-width="1.5"/>
    <line x1="-56" y1="21" x2="56" y2="21" stroke="#a5f3fc" stroke-width="1.5"/>
    <rect x="-40" y="-49" width="56" height="7" rx="3.5" fill="#155e75" opacity="0.8"/>
    <rect x="-40" y="-37" width="34" height="6" rx="3" fill="#67e8f9"/>

    <rect x="-42" y="-3.5" width="84" height="7" rx="3.5" fill="#67e8f9"/>
    <rect x="-42" y="-3.5" width="52" height="7" rx="3.5" fill="#0891b2"/>

    <rect x="-40" y="34" width="40" height="6" rx="3" fill="#67e8f9"/>

    <g transform="translate(41,55)">
      <path d="M0,-13 L11.5,-9 V0.6 C11.5,8.3 0,13.6 0,13.6 C0,13.6 -11.5,8.3 -11.5,0.6 V-9 Z" fill="#0891b2" stroke="#ffffff" stroke-width="3.2"/>
      <path d="M0,-13 L11.5,-9 V0.6 C11.5,8.3 0,13.6 0,13.6 C0,13.6 -11.5,8.3 -11.5,0.6 V-9 Z" fill="#0891b2"/>
      <path d="M-4.8,-0.5 L-1.4,3.1 L5.3,-4.3" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Account rows, one health dot each (center) -->
  <g>
    <rect x="470" y="58" width="250" height="46" rx="9" fill="#ffffff" stroke="#a5f3fc" stroke-width="1.5"/>
    <circle cx="490" cy="81" r="5" fill="#0891b2"/>
    <rect x="506" y="72" width="150" height="7" rx="3.5" fill="#155e75"/>
    <rect x="506" y="86" width="96" height="6" rx="3" fill="#67e8f9"/>
    <rect x="672" y="73" width="36" height="15" rx="7.5" fill="#cffafe"/>

    <rect x="470" y="119" width="250" height="46" rx="9" fill="#ffffff" stroke="#a5f3fc" stroke-width="1.5"/>
    <circle cx="490" cy="142" r="5" fill="#0891b2"/>
    <rect x="506" y="133" width="120" height="7" rx="3.5" fill="#155e75"/>
    <rect x="506" y="147" width="72" height="6" rx="3" fill="#67e8f9"/>
    <rect x="672" y="134" width="36" height="15" rx="7.5" fill="#cffafe"/>

    <rect x="470" y="180" width="250" height="46" rx="9" fill="#ffffff" stroke="#a5f3fc" stroke-width="1.5"/>
    <circle cx="490" cy="203" r="5" fill="#f59e0b"/>
    <rect x="506" y="194" width="134" height="7" rx="3.5" fill="#155e75"/>
    <rect x="506" y="208" width="84" height="6" rx="3" fill="#67e8f9"/>
    <rect x="672" y="195" width="36" height="15" rx="7.5" fill="#fde68a"/>
  </g>

  <!-- One bucket, three kinds of storage (center-right) -->
  <g transform="translate(790,96)">
    <rect width="176" height="96" rx="12" fill="#ffffff" stroke="#67e8f9" stroke-width="1.8"/>
    <rect x="18" y="20" width="88" height="7" rx="3.5" fill="#155e75"/>
    <g transform="translate(18,44)">
      <rect width="140" height="8" rx="4" fill="#67e8f9" opacity="0.5"/>
      <path d="M4,0 H70 V8 H4 A4,4 0 0 1 0,4 A4,4 0 0 1 4,0 Z" fill="#0891b2"/>
      <rect x="70" width="38" height="8" fill="#0891b2" opacity="0.55"/>
      <rect x="108" width="24" height="8" fill="#155e75" opacity="0.3"/>
    </g>
    <g transform="translate(18,68)">
      <circle cx="4" cy="4" r="4" fill="#0891b2"/>
      <rect x="14" y="1" width="26" height="6" rx="3" fill="#67e8f9"/>
      <circle cx="56" cy="4" r="4" fill="#0891b2" opacity="0.55"/>
      <rect x="66" y="1" width="30" height="6" rx="3" fill="#67e8f9"/>
      <circle cx="112" cy="4" r="4" fill="#155e75" opacity="0.3"/>
      <rect x="122" y="1" width="22" height="6" rx="3" fill="#67e8f9"/>
    </g>
  </g>

  <!-- Receipt badge: every paid service is confirmed on the record -->
  <g transform="translate(1036,144) scale(1.16)">
    <path d="M-23,-29 h40 a5,5 0 0 1 5,5 v46 l-7.5,-6 l-7.5,6 l-7.5,-6 l-7.5,6 l-7.5,-6 l-7.5,6 v-46 a5,5 0 0 1 5,-5 z" fill="#ffffff" stroke="#a5f3fc" stroke-width="1.8"/>
    <rect x="-15" y="-19" width="26" height="5" rx="2.5" fill="#155e75" opacity="0.7"/>
    <rect x="-15" y="-8" width="17" height="5" rx="2.5" fill="#67e8f9"/>
    <circle cx="24" cy="17" r="17" fill="#ffffff"/>
    <circle cx="24" cy="17" r="14.5" fill="#0891b2"/>
    <path d="M17.5,17 L22.4,21.9 L31.2,12.4" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
