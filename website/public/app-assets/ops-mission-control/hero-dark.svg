      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#232538"/>
    </linearGradient>
    <linearGradient id="omc-card-d" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
