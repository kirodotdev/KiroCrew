    <circle r="3.4" fill="#a5b4fc"/>
    <circle cx="26" cy="-18" r="3" fill="#f87171"/>
    <circle cx="-31" cy="24" r="2.6" fill="#fbbf24"/>
  </g>

  <!-- board rows -->
