<!doctype html>
<!--
  Host page for capture-zero-turn-option-actions.mjs. Copied verbatim into the harness's
  staging dir beside the generated entry.tsx, so the `./entry.tsx` reference below resolves
  against that dir rather than this one.

  Static on purpose. This page was previously a template literal inside the harness, which
  put a `<script>` tag in the same writeFileSync call as a path semgrep could not fold to a
  constant, tripping javascript.lang.security.audit.unknown-value-with-script-tag. Keeping
  it as bytes means the page that carries the script tag is not assembled at runtime at all,
  so there is no value to sanitize and nothing to interpolate.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>option actions</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./entry.tsx"></script>
  </body>
</html>
