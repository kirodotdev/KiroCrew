[options]
zip_safe = True
include_package_data = True
# macOS (x86_64 + arm64), Linux (x86_64 + aarch64), and Windows, CPython
# 3.12-3.13. Declaring this gives pip a clear, early error on an unsupported
# interpreter instead of a late syntax/dependency failure.
#
# Must match pyproject.toml's requires-python: that [project] value is the one
# that actually lands in the built metadata, so a looser bound here is dead
# config that misleads readers into thinking 3.10/3.11 is supported (they are
# not — every release artifact bundles CPython 3.12, ensure-python.sh
# provisions 3.12, and 3.12 is the only version CI tests).
python_requires = >=3.12
package_dir =
    = src
packages = find:
install_requires =
    aiohttp>=3.9,<4
    # Security.framework-backed TLS validation for bundled macOS Python.
    # File CA bundles cannot preserve Keychain trust policy or explicit deny.
    truststore==0.10.4; sys_platform == "darwin"
    # Direct dependency, not just aiohttp's transitive one: the link-unfurl vet
    # derives the resolver-pin host with `yarl.URL.raw_host` so it matches the
    # exact key aiohttp asks its resolver with. Pinning on any other encoding of
    # the host silently refuses every internationalized domain.
    yarl>=1.9,<2
    slack-sdk>=3.27,<4
    websockets>=12,<16
    cron-descriptor>=1.4,<2
    croniter>=2.0,<3
    numpy>=1.21,<3
    snowballstemmer>=1.0
    # Windows ships no IANA tz database, so stdlib zoneinfo.ZoneInfo() raises
    # ZoneInfoNotFoundError. The tzdata package supplies it. POSIX uses the
    # system zoneinfo, so scope this to Windows only.
    tzdata>=2024.1; platform_system == "Windows"
    # Windows web-terminal backend: the dashboard terminal uses a ConPTY
    # pseudo-console, and pywinpty is the maintained ConPTY binding. Windows
    # only — POSIX drives the terminal with the stdlib pty/fork instead.
    pywinpty>=2.0,<4; platform_system == "Windows"
    # Windows keeps its timezone in the registry as a Windows zone id
    # ("Pacific Standard Time"); tzlocal maps it to IANA via the CLDR
    # windowsZones table so timezone auto-detection works and the product does
    # not silently fall back to UTC. POSIX reads $TZ / /etc/localtime directly.
    # Its only dependency, tzdata, is already declared above.
    tzlocal>=5.0; platform_system == "Windows"
    # Vendored llama-cpp-python runtime imports (in-process embeddings).
    jinja2>=2.11.3
    typing-extensions>=4.5.0
    # Dashboard file viewer xlsx preview (GET /api/file-sheet): parses OOXML
    # workbooks into a JSON cell grid with openpyxl. openpyxl switches its XML
    # parsing to defusedxml (declared below for doc_parser) whenever that
    # module is importable, which hardens the endpoint against XML
    # entity-expansion payloads inside untrusted workbook files.
    openpyxl>=3.1,<4
    # pysqlite3 needed on older Linux x86_64 (old SQLite lacks FTS5/UPSERT);
    # modern Linux, macOS, and aarch64 ship a recent SQLite. No aarch64 wheels exist.
    pysqlite3-binary>=0.5.4; sys_platform == "linux" and platform_machine == "x86_64"
    # docx ingestion. 0.8.x ships `from collections import Sequence` (removed in
    # Python 3.10), an ImportError at runtime — require 1.x, which fixes the
    # import and is API-compatible for our usage (Document(), paragraphs, style).
    python-docx>=1,<2
    pdfplumber>=0.10,<1
    # doc_parser parses the XML inside user-supplied .docx/.pptx uploads. The
    # stdlib xml.etree parser resolves external entities, so a crafted document
    # can mount an XXE (local-file read / entity-expansion DoS). defusedxml is a
    # pure-Python, dependency-free drop-in that hardens fromstring() against it.
    defusedxml>=0.7,<1
    # WeChat (weixin) QR login: iLink returns a scannable login URL, not image
    # bytes — the dashboard renders it into a PNG server-side. qrcode[pil]
    # pulls Pillow explicitly (we already ship it transitively via pdfplumber,
    # but the QR path must not depend on another feature's dependency tree).
    qrcode[pil]>=7.4,<9
    # WeChat (weixin) inbound media: iLink never carries bytes in the envelope,
    # it hands out a CDN reference whose object is AES-128-ECB encrypted, so
    # reading an inbound image/voice/file requires a real AES implementation.
    # Declared in core (not an extra) for the same reason as qrcode above: the
    # weixin channel ships enabled-by-config, and a channel must not depend on
    # another feature's dependency tree to receive a message.
    cryptography>=42,<48
    requests>=2.28,<3
    # Agent frontmatter parsing, eval scenario specs, and the task planner.
    PyYAML>=6,<7
    # Telemetry trunk (Wave 0): OpenTelemetry SDK metrics. Apache-2.0 / CNCF
    # standard. The local JSONL sink is the default; OTLP egress is available
    # through the explicit kirocrew[otlp] package extra. Consumed by src/kiro_crew/metrics/.
    opentelemetry-api>=1,<2
    opentelemetry-sdk>=1,<2
    # PPTX Maker provisions its presentation engine into a uv-managed venv. Ships
    # the uv binary as a wheel (MIT OR Apache-2.0), located via uv.find_uv_bin(),
    # so a stock `pip install kirocrew` can provision the engine with no separate
    # `brew`/`curl` step. Not a build backend — see apps/builtins/pptx_maker.
    uv>=0.5,<1

[options.extras_require]
# HOW TO INSTALL ONE OF THESE. `pip install "kirocrew[<extra>]"` does NOT work:
# this project is not published on any index, so pip fails with "No matching
# distribution found for kirocrew" regardless of how Kiro Crew was installed --
# and were it published, that form would REPLACE an editable/source install with
# a released wheel. Install an extra's own distributions instead (the commands
# below), or from a source checkout use `pip install -e ".[<extra>]"`. At runtime
# `kiro_crew.extras` renders these lists for the dashboard and the logs, so a pin
# changed here reaches the user's copy button without a code change.
# Optional OTLP/HTTP metrics egress. Network export still requires an explicit
# telemetry.otlp_endpoint; installing this extra alone does not enable egress:
#   pip install "opentelemetry-exporter-otlp-proto-http==1.44.0"
otlp =
    opentelemetry-exporter-otlp-proto-http==1.44.0
# Optional out-of-process profiling for `kirocrew perf sample --pid`. The
# in-process sampler (`--call`) needs nothing extra; py-spy is only required to
# attach to an already-running gateway, and on macOS also needs elevated
# privileges (task_for_pid). Profiling stays off unless KIROCREW_DEBUG is set:
#   pip install 'py-spy>=0.3,<1'
perf =
    py-spy>=0.3,<1
# Optional Microsoft Teams channel. The inbound Bot Framework webhook validates
# an RS256 JWT (issuer + App-ID audience + JWKS signature) before processing, so
# it needs PyJWT + cryptography. Install with:
#   pip install "PyJWT[crypto]==2.13.0"
teams =
    PyJWT[crypto]==2.13.0
# Optional WhatsApp channel (QR-linked personal account over the WhatsApp Web
# protocol). neonize bundles the Go whatsmeow core as a prebuilt shared
# library; core kirocrew runs without it and the channel reports the missing
# extra in Settings. Install with:
#   pip install 'neonize==0.4.3.post0'
whatsapp =
    neonize==0.4.3.post0
# Optional Feishu (Lark/飞书) channel. Unlike the other non-Slack channels, the
# Feishu long-connection transport is not a plain HTTP/WS endpoint we can drive
# with aiohttp: the handshake, tenant-token refresh and frame envelope are only
# specified through the official SDK, so the channel depends on lark-oapi. It
# stays OUT of core (same reasoning as [teams]) and is lazily imported, so a
# build without it simply logs and skips the channel. Install with:
#   pip install 'lark-oapi>=1.4,<2'
feishu =
    lark-oapi>=1.4,<2
# Optional speech-to-text integration. Install with:
#   pip install 'boto3>=1.34,<2' 'amazon-transcribe>=0.6,<1' 'pywhispercpp>=1.5,<2'
# pywhispercpp is the whisper.cpp binding (MIT) behind the default `local`
# provider, held loaded in-process by kiro_crew.stt. Desktop releases bundle this
# binding and its runtime dependencies; users only download their selected model.
# Prebuilt wheels cover macOS arm64, glibc and musl Linux on x86_64 and aarch64,
# and Windows. Intel macOS has NO wheel, so pip builds it from source there and
# needs a C++ toolchain plus CMake; kiro_crew.stt.engine reports that as its own
# availability state rather than as a missing extra, because the two need
# different fixes.
# amazon-transcribe (and its boto3 credential resolver in kiro_crew.transcribe)
# is only needed for the `transcribe` (AWS) provider. Desktop packaging adds its
# pinned imageio-ffmpeg decoder separately; source environments deliberately use
# a system decoder instead of executing a binary from an agent-writable venv.
# Core kirocrew runs without these extras and reports STT as unavailable precisely.
# The cloud half, split out so a platform with no recogniser wheel can still get
# it. An extra resolves ATOMICALLY, so with the full `voice` set on Intel macOS --
# where pywhispercpp publishes no wheel -- the whole install fails and boto3 and
# amazon-transcribe are omitted with it, taking the `transcribe` provider down
# alongside the `local` one it has nothing to do with. Packaging installs this
# first, then attempts the recogniser separately.
voice-aws =
    boto3>=1.34,<2
    amazon-transcribe>=0.6,<1
voice =
    kirocrew[voice-aws]
    pywhispercpp>=1.5,<2
# Development and test tooling:
#   pip install -e ".[dev]"
# Keep in sync with [dependency-groups] dev in pyproject.toml, which CI
# installs via `--group dev`; this extra is what `make build` uses.
# The formatter/linter/type-checker are pinned to the exact versions CI runs:
# black and mypy change their output across minor releases, so a floating range
# makes a local `make build` venv disagree with CI (black 26 reformats ~680
# files that black 24 accepts). Bump these in lockstep with pyproject.toml.
dev =
    # Ceiling admits pytest 9 (CI dev-group pins pytest==9.0.3 and proves it works).
    pytest>=8,<10
    pytest-cov>=4,<7
    pytest-asyncio>=0.21
    pytest-xdist>=3
    pytest-timeout>=2
    pytest-testmon>=2
    # Imported unconditionally by test/conftest.py.
    hypothesis>=6
    black==26.3.1
    isort==6.0.0
    flake8==7.1.0
    mypy==1.14.1
    # Not a dev TOOL -- see the [dependency-groups] dev rationale in
    # pyproject.toml: kiro_crew.config.validation imports jsonschema behind a
    # try/except, so a `.[dev]` install without it silently SKIPS the 11
    # config-validation guard tests (pytest scores a skip as a pass). Keep the
    # pin identical to the group's.
    jsonschema==4.26.0
    PyJWT[crypto]==2.13.0
    # Test-only, NOT a runtime dependency -- see the [dependency-groups] dev
    # rationale in pyproject.toml (kept in lockstep with it). test_transcribe.py's
    # pin-completeness test imports imageio_ffmpeg._definitions.FNAME_PER_PLATFORM
    # to derive the authoritative bundled-decoder filename set; without the package
    # the test would importorskip and silently pass, which is the "green while
    # checking nothing" shape that test exists to end. imageio_ffmpeg stays a
    # packaging and runtime concern for the desktop bundle, NOT a core
    # install_requires.
    imageio-ffmpeg==0.6.0

[options.packages.find]
where = src
exclude =
    test

[options.package_data]
kiro_crew =
    py.typed
    # Optional distribution build stamp (kiro_crew/__init__.py). Absent in this
    # repo and in the wheels it publishes; a downstream that writes it before
    # building its own wheel needs it carried into the package.
    BUILD_VERSION
    slack-manifest.yaml
    model_tokens.json
    model_registry.json
    connections/registry.json
    data/tips_catalog.json
    # Swift source for the Apple on-device speech helper. Shipped as SOURCE, not a
    # binary: a prebuilt Mach-O would need signing/notarization to clear Gatekeeper
    # on a downloaded DMG, so kiro_crew.apple_speech compiles it on the host once.
    # Without this entry the `apple` STT provider silently reports unavailable on
    # every pip/DMG install while working perfectly from a source checkout.
    apple_speech/*.swift
    config/defaults.json
    config/prompt.md
    config/prompt-orchestrator.md
    cloud/templates/*.yaml
    apps/app-registry.json
    apps/builtins/*/app.json
    apps/builtins/*/ui/**/*
    apps/builtins/*/lib/**/*
    apps/builtins/*/backend/**/*
    apps/builtins/*/agents/**/*
    apps/builtins/*/inject/**/*
    apps/builtins/*/skills/**/*
    apps/builtins/*/scripts/**/*
    apps/builtins/*/agents/*.json
    apps/builtins/*/prompts/*.md
    # ATTRIBUTION.md / README.md carry the upstream-author credit for the builtin
    # apps ported from third-party work — Apache-2.0 attribution has to reach the
    # installed package, not just the repository. This glob also subsumes the
    # `README.md` line this branch had added separately.
    apps/builtins/*/*.md
    builtin_skills/**/*
    deploy/skills/**/*
    eval/scenarios/*.json
    eval/bench/data/*.json
    docs/*.md
    static/*
    tests_fixtures/**/*
    _vendor/**/*
    # Vendored llama-cpp-python: Python source + per-platform native libs.
    # The `_vendor/**/*` glob above relies on setuptools `**` recursion, which
    # is unreliable across versions — keep these explicit entries too.
    _vendor/llama_cpp/*.py
    _vendor/llama_cpp/py.typed
    _vendor/llama_cpp/LICENSE.md
    _vendor/README.md
    _vendor/llama_cpp_libs/linux_x86_64/*
    _vendor/llama_cpp_libs/linux_aarch64/*
    _vendor/llama_cpp_libs/macos_arm64/*
    _vendor/llama_cpp_libs/macos_x86_64/*
    _vendor/llama_cpp_libs/win_amd64/*

[options.entry_points]
# Console scripts installed onto PATH by pip:
#   kirocrew        -> kiro_crew._bootstrap:main (self-heals stale editable
#                      installs, then dispatches to kiro_crew.cli:main)
console_scripts =
    kirocrew = kiro_crew._bootstrap:main

# Configuration for pytest; enable coverage for KiroCrew, emit
# XML, HTML, and terminal reports.
[tool:pytest]
xfail_strict = true
markers =
    integration: live browser tests requiring Chrome CDP
pythonpath = src
# Keep a test's tmp_path only when that test FAILED, which is the only case anyone
# ever reads it. The default ("all") keeps every passing test's directory too, and
# with tmp_path_retention_count also defaulting to 3 that retains the whole suite's
# temp footprint three times over -- at ~56.5k tests, on a /tmp that is a tmpfs with
# a fixed inode budget (1,048,576 on the hosts this was measured on), that is what
# eventually returns ENOSPC to unrelated processes while 90% of the BYTES are still
# free. Debuggability is unaffected: a failing test's directory is still kept, for
# the configured number of runs, which is the only one anybody opens.
tmp_path_retention_policy = failed
addopts =
    --verbose
    --ignore=build/private
    # Parallel test execution via xdist. Override with -n0 for debugging:
    #   pytest -n0 -k test_name --pdb
    #
    # `auto` does NOT mean one worker per core here: the rootdir conftest's
    # pytest_xdist_auto_num_workers hook bounds it by available memory and by
    # what concurrent runs on this host already hold. A worker costs ~1.5 GiB,
    # almost all of it collecting the suite, so a small laptop cannot back one
    # per core -- see testing-conventions.md "Running on a machine with little
    # RAM" for the knobs. An explicit -n <N> bypasses the budget.
    -n auto
    # loadgroup (not worksteal) so @pytest.mark.xdist_group is honored: the
    # concurrency-sensitive tests marked xdist_group(name="serial") (transcribe,
    # dashboard approval) run on one worker instead of racing under -n auto.
    --dist loadgroup
    # Fail fast instead of thrashing. When workers die from memory pressure
    # xdist silently clones replacements, up to numprocesses*4 of them -- a
    # 10-worker run will quietly restart 40 times, which on a host that has
    # started swapping means ~20 minutes of zero progress and an empty log.
    # Two replacements is enough to absorb a genuine one-off crash; past that
    # the run is not going to finish, so surface it loudly and immediately.
    --max-worker-restart=2
    --timeout=120
    # Coverage is NOT enabled by default: measured on a 1,231-test subset it
    # costs +21% wall time (52.5s -> 63.4s) and +36% peak worker RSS (387MB ->
    # 527MB) on every local and agent run, while CI asks for it explicitly
    # (ci.yml passes --cov=kiro_crew on the 3.12 shards,
    # and the coverage-combine job builds coverage.xml from the shard data
    # files). `pytest --cov=kiro_crew` still gives a term-missing report via
    # [coverage:report] below; add --cov-report for the html/xml artifacts.
    # show the slowest 5 tests at the end
    --durations=5
    # Default to colorful output
    --color=yes
    # Uncomment to enforce a minimum code coverage threshold.
    # --cov-fail-under 50
# `src/kiro_crew/apps/builtins` is here because five builtin apps ship their test suites
# INSIDE the package (next to the code they cover) rather than in `test/`. Without this path
# those ~3780 tests ran only when someone targeted them explicitly, so CI was green while the
# suites guarding the ops autonomy gate — the security ceiling, the off-shift refusal, the
# credential redaction floors — never executed on a pull request at all. Found in review.
#
# Scoped to the builtins dir rather than all of `src` so pytest does not walk the vendored
# llama-cpp tree or treat unrelated modules as collection roots.
testpaths = test src/kiro_crew/apps/builtins
looponfailroots = src test

# Additional coverage.py settings. The parallel flag and source values let
# pytest-cov alias the installed-package absolute paths back to the relative
# ones in your package source.
[coverage:run]
branch = true
parallel = true
# Ephemeral pytest tmp fixtures fabricate checkout layouts at
# <tmp>/<name>/src/kiro_crew/agent.py. No real file is ever written there, but
# the phantom path lands in the coverage data and makes `coverage xml`/`coverage
# report` in the Coverage Combine job abort with "No source for code:
# .../agent.py" (the step runs under `bash -e`, so the non-zero exit fails the
# whole gate — and Coverage Gate then fails closed, blocking PR Readiness on
# every open PR). Never measure it.
#
# Anchor the pattern on pytest's tmp root, not on each fixture's directory name:
# test/test_agent_home_isolation.py already builds such a layout under two
# different names (kirocrew-wt-example/ via _make_linked_worktree, and a plain
# KiroCrew/ clone dir in test_does_not_decline_from_an_ordinary_clone), so a
# name-based glob has to be extended for every new fixture — and "*/KiroCrew/*"
# would be actively unsafe, because CI checks the repo out at
# /home/runner/work/KiroCrew/KiroCrew and that glob would omit all real source,
# turning the coverage gate green by measuring nothing. Nothing real is ever
# measured from a pytest temporary directory. The name-based entry is kept as a
# backstop for runs that override pytest's basetemp.
omit =
    */pytest-of-*/*
    */kirocrew-wt-example/*
# Test files whose bodies are UNREACHABLE on a GH runner, for a reason the runner cannot
# fix: each carries `skipif(not userns_available())` on the tests that need a namespace
# sandbox, and a runner denies `unshare(CLONE_NEWNS)`. A skipped test's lines are never
# executed, so measuring them charges the denominator for code the measuring host cannot
# reach -- `test_ledger_sync_git.py` measured 16% (65/405) on CI for exactly that reason.
#
# This is NOT the old "CI deselects these files" list, which covered eleven files and is
# gone: ci.yml deselects nothing now, so all eleven RUN and report their skips, and the
# five without a sandbox guard are measured normally. What remains is the narrower and
# checkable rule that test/test_coverage_omit_contract.py enforces -- an omitted test file
# must carry a capability guard CI cannot satisfy, and a pattern here may never match
# product code.
#
# The proper fix is upstream of coverage: `backend-test-sandbox` clears the AppArmor
# restriction, so measuring THAT job would reach these lines. It runs `--no-cov` today.
    */ops_mission_control/tests/test_ledger_sync_git.py
    */ops_mission_control/tests/test_schedule_file.py
    */auto_improvement/tests/test_lint_findings.py
    */auto_improvement/tests/test_github_profile.py
    */auto_improvement/tests/test_profile_capture.py
    */auto_improvement/tests/test_runner.py

[coverage:paths]
source =
    src/
    build/lib/*/site-packages/

# Code Review Sage puts its OWN app root on sys.path (backend/routes.py and
# sage_lib/*.py do this so the app also runs standalone as
# `python3 sage_lib/learning.py`), so its 27-file suite imports the library as
# the TOP-LEVEL package `sage_lib` -- `from sage_lib import learning` -- not as
# kiro_crew.apps.builtins.code_review_sage.sage_lib.learning.
#
# `--cov=kiro_crew` resolves its inclusion set from that package's module tree,
# so execution attributed to a foreign top-level module was discarded -- while
# the FILES, which do live under src/kiro_crew/, were still listed in the report
# as never-executed. Result: sage_lib's 2437 statements sat in the denominator
# at a reported 0.0% even though 693 passing tests cover 83.7% of them, costing
# ~0.96pp of the measured backend rate.
#
# ci.yml therefore also passes `--cov=sage_lib`, and this paths entry collapses
# the two filename shapes coverage then sees ("sage_lib/learning.py" from the
# top-level import, and the canonical in-package path) onto ONE canonical file.
# Without the merge, the same module lands twice -- once covered, once at 0% --
# which double-counts the denominator and cancels the correction out entirely.
#
# Same class of measurement fix as the deselected-test omit above: it changes
# what the number MEANS, not how much code is tested.
sagelib =
    src/kiro_crew/apps/builtins/code_review_sage/sage_lib
    */code_review_sage/sage_lib
    sage_lib

# Kept here rather than as an addopts --cov-report so that an explicit
# `pytest --cov=kiro_crew` still shows uncovered lines now that coverage is
# opt-in.
[coverage:report]
show_missing = true
# Also omit at report time: the Coverage Combine job reads shards produced by
# the test job, and `[coverage:run] omit` only governs collection. Without this
# a shard that already recorded the phantom fixture path would still trip
# `coverage xml`/`coverage report` with "No source for code". Keep both in sync.
omit =
    */pytest-of-*/*
    */kirocrew-wt-example/*
# Same capability-guarded test files as [coverage:run] omit above -- repeated here because
# Coverage Combine reads shard data and reports it in a separate process, where only
# report-time omit applies. Kept in sync by test/test_coverage_omit_contract.py.
    */ops_mission_control/tests/test_ledger_sync_git.py
    */ops_mission_control/tests/test_schedule_file.py
    */auto_improvement/tests/test_lint_findings.py
    */auto_improvement/tests/test_github_profile.py
    */auto_improvement/tests/test_profile_capture.py
    */auto_improvement/tests/test_runner.py

[coverage:html]
directory = build/coverage

[coverage:xml]
output = build/coverage/coverage.xml

[flake8]
# extend-ignore (not ignore) so pycodestyle's default-ignore list — which
# includes the black-compatible codes E226/E24/E704/W504 — stays in effect.
# Using bare `ignore =` would REPLACE those defaults and start flagging e.g.
# E226 on f-string arithmetic (`{i+1}`), which black intentionally does not space.
extend-ignore =
    # Not pep8, black adds whitespace before ':'
    E203,
    # Not pep8, black adds line break before binary operator
    W503,
    # After auto-formatting, the only remaining long lines do not matter; ignore.
    E501,
max_line_length = 100
# The B9 adversarial workflow corpus is hostile-script DATA loaded by
# test_workflows_malicious.py, not code: deliberate style violations and even
# a deliberately-invalid format string (F521) are the payload, not defects.
extend-exclude = test/workflows/malicious
# Vendored third-party code (llama-cpp-python) must never be linted —
# keeps diffs against upstream wheels clean for upgrades.
exclude =
    src/kiro_crew/_vendor
per-file-ignores =
    # _ensure_ssl_certs() must run before any library caches its SSL context
    src/kiro_crew/cli.py: E402
    src/kiro_crew/__main__.py: E402
    src/kiro_crew/mcp_gateway/gatewayd.py: E402
    # Builtin app backends use compact continuation indent style
    src/kiro_crew/apps/builtins/*: E128
# Uncomment to enforce a maximum cyclomatic complexity - more info https://en.wikipedia.org/wiki/Cyclomatic_complexity
# max_complexity=10
