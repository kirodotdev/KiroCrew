[options]
zip_safe = True
include_package_data = True
# macOS (x86_64 + arm64), Linux (x86_64 + aarch64), and Windows, CPython
# 3.9-3.13. Declaring this gives pip a clear, early error on an unsupported
# interpreter instead of a late syntax/dependency failure.
python_requires = >=3.9
package_dir =
    = src
packages = find:
install_requires =
    aiohttp>=3.9,<4
    slack-sdk>=3.27,<4
    websockets>=12,<16
    cron-descriptor>=1.4,<2
    croniter>=2.0,<3
    numpy>=1.21,<3
    snowballstemmer>=1.0
    # Windows ships no IANA tz database, so stdlib zoneinfo.ZoneInfo() raises
    # ZoneInfoNotFoundError. The tzdata package supplies it. POSIX uses the
    # system zoneinfo, so scope this to Windows only.
    tzdata>=2024.1; platform_system == "Windows"
    # pysqlite3 needed on older Linux x86_64 (old SQLite lacks FTS5/UPSERT);
    # modern Linux, macOS, and aarch64 ship a recent SQLite. No aarch64 wheels exist.
    pysqlite3-binary>=0.5.4; sys_platform == "linux" and platform_machine == "x86_64"
    # docx ingestion. 0.8.x ships `from collections import Sequence` (removed in
    # Python 3.10), an ImportError at runtime — require 1.x, which fixes the
    # import and is API-compatible for our usage (Document(), paragraphs, style).
    python-docx>=1,<2
    pdfplumber>=0.10,<1
    requests>=2.28,<3
    # Agent frontmatter parsing, eval scenario specs, and the task planner.
    PyYAML>=6,<7
    # Telemetry trunk (Wave 0): OpenTelemetry SDK metrics. Apache-2.0 / CNCF
    # standard. The local JSONL sink is the default; OTLP egress is a separate
    # opt-in extra (deferred). Consumed by src/kiro_crew/metrics/.
    opentelemetry-api>=1,<2
    opentelemetry-sdk>=1,<2

[options.extras_require]
# Optional speech-to-text integration. Install with:
#   pip install kirocrew[voice]
# amazon-transcribe (and its boto3 credential resolver in kiro_crew.transcribe)
# are only needed for the voice transcription feature; core kirocrew runs
# without them.
voice =
    boto3>=1.34,<2
    amazon-transcribe>=0.6,<1
# Build the standalone desktop backend binary:
#   pip install kirocrew[desktop] && make backend-bin
desktop =
    pyinstaller>=6,<7
# Development and test tooling:
#   pip install -e ".[dev]"
dev =
    pytest-cov>=4,<7
    pytest-asyncio>=0.21
    pytest-xdist>=3
    pytest-timeout>=2
    pytest-testmon>=2
    black>=24
    isort>=5
    flake8>=7
    mypy>=1

[options.packages.find]
where = src
exclude =
    test

[options.package_data]
kiro_crew =
    py.typed
    slack-manifest.yaml
    model_tokens.json
    model_registry.json
    config/defaults.json
    config/prompt.md
    config/persona-*.md
    config/prompt-orchestrator.md
    cloud/templates/*.yaml
    apps/app-registry.json
    apps/builtins/*/app.json
    apps/builtins/*/ui/**/*
    apps/builtins/*/lib/**/*
    apps/builtins/*/backend/**/*
    apps/builtins/*/skills/**/*
    apps/builtins/*/scripts/**/*
    builtin_skills/**/*
    eval/scenarios/*.json
    docs/*.md
    mcp_gateway/stub_wrapper.sh
    static/*
    tests_fixtures/**/*
    _vendor/**/*

[options.entry_points]
# Console scripts installed onto PATH by pip:
#   kirocrew        -> kiro_crew.cli:main
#   kirocrew-browse -> kiro_crew.browser.cli:main
console_scripts =
    kirocrew = kiro_crew.cli:main
    kirocrew-browse = kiro_crew.browser.cli:main

# Configuration for pytest; enable coverage for KiroCrew, emit
# XML, HTML, and terminal reports.
[tool:pytest]
xfail_strict = true
markers =
    integration: live browser tests requiring Chrome CDP
pythonpath = src
addopts =
    --verbose
    --ignore=build/private
    # Parallel test execution via xdist. Override with -n0 for debugging:
    #   pytest -n0 -k test_name --pdb
    -n auto
    # loadgroup (not worksteal) so @pytest.mark.xdist_group is honored: the
    # concurrency-sensitive tests marked xdist_group(name="serial") (transcribe,
    # dashboard approval) run on one worker instead of racing under -n auto.
    --dist loadgroup
    --timeout=120
    --cov kiro_crew
    --cov-config setup.cfg
    --cov-report term-missing
    --cov-report html:build/coverage
    --cov-report xml:build/coverage/coverage.xml
    # show the slowest 5 tests at the end
    --durations=5
    # Default to colorful output
    --color=yes
    # Uncomment to enforce a minimum code coverage threshold.
    # --cov-fail-under 50
testpaths = test transfer
looponfailroots = src test

# Additional coverage.py settings. The parallel flag and source values let
# pytest-cov alias the installed-package absolute paths back to the relative
# ones in your package source.
[coverage:run]
branch = true
parallel = true

[coverage:paths]
source =
    src/
    build/lib/*/site-packages/

[coverage:html]
directory = build/coverage

[coverage:xml]
output = build/coverage/coverage.xml

[flake8]
# extend-ignore (not ignore) so pycodestyle's default-ignore list — which
# includes the black-compatible codes E226/E24/E704/W504 — stays in effect.
# Using bare `ignore =` would REPLACE those defaults and start flagging e.g.
# E226 on f-string arithmetic (`{i+1}`), which black intentionally does not space.
extend-ignore =
    # Not pep8, black adds whitespace before ':'
    E203,
    # Not pep8, black adds line break before binary operator
    W503,
    # After auto-formatting, the only remaining long lines do not matter; ignore.
    E501,
max_line_length = 100
per-file-ignores =
    # _ensure_ssl_certs() must run before any library caches its SSL context
    src/kiro_crew/cli.py: E402
    src/kiro_crew/__main__.py: E402
    # Builtin app backends use compact continuation indent style
    src/kiro_crew/apps/builtins/*: E128
# Uncomment to enforce a maximum cyclomatic complexity - more info https://en.wikipedia.org/wiki/Cyclomatic_complexity
# max_complexity=10
