[options]
zip_safe = True
include_package_data = True
# macOS (x86_64 + arm64), Linux (x86_64 + aarch64), and Windows, CPython
# 3.10-3.13. Declaring this gives pip a clear, early error on an unsupported
# interpreter instead of a late syntax/dependency failure.
#
# Must match pyproject.toml's requires-python: that [project] value is the one
# that actually lands in the built metadata, so a looser bound here is dead
# config that misleads readers into thinking 3.9 is supported (it is not — the
# code uses contextlib.aclosing, added in 3.10).
python_requires = >=3.10
package_dir =
    = src
packages = find:
install_requires =
    aiohttp>=3.9,<4
    slack-sdk>=3.27,<4
    websockets>=12,<16
    cron-descriptor>=1.4,<2
    croniter>=2.0,<3
    numpy>=1.21,<3
    snowballstemmer>=1.0
    # Windows ships no IANA tz database, so stdlib zoneinfo.ZoneInfo() raises
    # ZoneInfoNotFoundError. The tzdata package supplies it. POSIX uses the
    # system zoneinfo, so scope this to Windows only.
    tzdata>=2024.1; platform_system == "Windows"
    # Windows web-terminal backend: the dashboard terminal uses a ConPTY
    # pseudo-console, and pywinpty is the maintained ConPTY binding. Windows
    # only — POSIX drives the terminal with the stdlib pty/fork instead.
    pywinpty>=2.0,<4; platform_system == "Windows"
    # Vendored llama-cpp-python runtime imports (in-process embeddings).
    jinja2>=2.11.3
    typing-extensions>=4.5.0
    # pysqlite3 needed on older Linux x86_64 (old SQLite lacks FTS5/UPSERT);
    # modern Linux, macOS, and aarch64 ship a recent SQLite. No aarch64 wheels exist.
    pysqlite3-binary>=0.5.4; sys_platform == "linux" and platform_machine == "x86_64"
    # docx ingestion. 0.8.x ships `from collections import Sequence` (removed in
    # Python 3.10), an ImportError at runtime — require 1.x, which fixes the
    # import and is API-compatible for our usage (Document(), paragraphs, style).
    python-docx>=1,<2
    pdfplumber>=0.10,<1
    # WeChat (weixin) QR login: iLink returns a scannable login URL, not image
    # bytes — the dashboard renders it into a PNG server-side. qrcode[pil]
    # pulls Pillow explicitly (we already ship it transitively via pdfplumber,
    # but the QR path must not depend on another feature's dependency tree).
    qrcode[pil]>=7.4,<9
    requests>=2.28,<3
    # Agent frontmatter parsing, eval scenario specs, and the task planner.
    PyYAML>=6,<7
    # Telemetry trunk (Wave 0): OpenTelemetry SDK metrics. Apache-2.0 / CNCF
    # standard. The local JSONL sink is the default; OTLP egress is available
    # through the explicit kirocrew[otlp] package extra. Consumed by src/kiro_crew/metrics/.
    opentelemetry-api>=1,<2
    opentelemetry-sdk>=1,<2

[options.extras_require]
# Optional OTLP/HTTP metrics egress. Network export still requires an explicit
# telemetry.otlp_endpoint; installing this extra alone does not enable egress:
#   pip install "kirocrew[otlp]"
otlp =
    opentelemetry-exporter-otlp-proto-http==1.44.0
# Optional Microsoft Teams channel. The inbound Bot Framework webhook validates
# an RS256 JWT (issuer + App-ID audience + JWKS signature) before processing, so
# it needs PyJWT + cryptography. Install with:
#   pip install "kirocrew[teams]"
teams =
    PyJWT[crypto]==2.10.1
# Optional speech-to-text integration. Install with:
#   pip install kirocrew[voice]
# amazon-transcribe (and its boto3 credential resolver in kiro_crew.transcribe)
# are only needed for the voice transcription feature; core kirocrew runs
# without them.
voice =
    boto3>=1.34,<2
    amazon-transcribe>=0.6,<1
# Build the standalone desktop backend binary:
#   pip install kirocrew[desktop] && make backend-bin
desktop =
    pyinstaller>=6,<7
# Development and test tooling:
#   pip install -e ".[dev]"
# Keep in sync with [dependency-groups] dev in pyproject.toml, which CI
# installs via `--group dev`; this extra is what `make build` uses.
# The formatter/linter/type-checker are pinned to the exact versions CI runs:
# black and mypy change their output across minor releases, so a floating range
# makes a local `make build` venv disagree with CI (black 26 reformats ~680
# files that black 24 accepts). Bump these in lockstep with pyproject.toml.
dev =
    pytest>=8,<9
    pytest-cov>=4,<7
    pytest-asyncio>=0.21
    pytest-xdist>=3
    pytest-timeout>=2
    pytest-testmon>=2
    # Imported unconditionally by test/conftest.py.
    hypothesis>=6
    black==24.10.0
    isort==6.0.0
    flake8==7.1.0
    mypy==1.14.1
    PyJWT[crypto]==2.10.1

[options.packages.find]
where = src
exclude =
    test

[options.package_data]
kiro_crew =
    py.typed
    slack-manifest.yaml
    model_tokens.json
    model_registry.json
    data/tips_catalog.json
    config/defaults.json
    config/prompt.md
    config/prompt-orchestrator.md
    cloud/templates/*.yaml
    apps/app-registry.json
    apps/builtins/*/app.json
    apps/builtins/*/ui/**/*
    apps/builtins/*/lib/**/*
    apps/builtins/*/backend/**/*
    apps/builtins/*/skills/**/*
    apps/builtins/*/scripts/**/*
    apps/builtins/*/agents/*.json
    apps/builtins/*/prompts/*.md
    # ATTRIBUTION.md / README.md carry the upstream-author credit for the builtin
    # apps ported from third-party work — Apache-2.0 attribution has to reach the
    # installed package, not just the repository.
    apps/builtins/*/*.md
    builtin_skills/**/*
    deploy/skills/**/*
    eval/scenarios/*.json
    docs/*.md
    mcp_gateway/stub_wrapper.sh
    static/*
    tests_fixtures/**/*
    _vendor/**/*
    # Vendored llama-cpp-python: Python source + per-platform native libs.
    # The `_vendor/**/*` glob above relies on setuptools `**` recursion, which
    # is unreliable across versions — keep these explicit entries too.
    _vendor/llama_cpp/*.py
    _vendor/llama_cpp/py.typed
    _vendor/llama_cpp/LICENSE.md
    _vendor/README.md
    _vendor/llama_cpp_libs/linux_x86_64/*
    _vendor/llama_cpp_libs/linux_aarch64/*
    _vendor/llama_cpp_libs/macos_arm64/*
    _vendor/llama_cpp_libs/macos_x86_64/*
    _vendor/llama_cpp_libs/win_amd64/*

[options.entry_points]
# Console scripts installed onto PATH by pip:
#   kirocrew        -> kiro_crew.cli:main
#   kirocrew-browse -> kiro_crew.browser.cli:main
console_scripts =
    kirocrew = kiro_crew.cli:main
    kirocrew-browse = kiro_crew.browser.cli:main

# Configuration for pytest; enable coverage for KiroCrew, emit
# XML, HTML, and terminal reports.
[tool:pytest]
xfail_strict = true
markers =
    integration: live browser tests requiring Chrome CDP
pythonpath = src
addopts =
    --verbose
    --ignore=build/private
    # Parallel test execution via xdist. Override with -n0 for debugging:
    #   pytest -n0 -k test_name --pdb
    -n auto
    # loadgroup (not worksteal) so @pytest.mark.xdist_group is honored: the
    # concurrency-sensitive tests marked xdist_group(name="serial") (transcribe,
    # dashboard approval) run on one worker instead of racing under -n auto.
    --dist loadgroup
    # Fail fast instead of thrashing. When workers die from memory pressure
    # xdist silently clones replacements, up to numprocesses*4 of them -- a
    # 10-worker run will quietly restart 40 times, which on a host that has
    # started swapping means ~20 minutes of zero progress and an empty log.
    # Two replacements is enough to absorb a genuine one-off crash; past that
    # the run is not going to finish, so surface it loudly and immediately.
    --max-worker-restart=2
    --timeout=120
    # Coverage is NOT enabled by default: measured on a 1,231-test subset it
    # costs +21% wall time (52.5s -> 63.4s) and +36% peak worker RSS (387MB ->
    # 527MB) on every local and agent run, while CI asks for it explicitly
    # (ci.yml passes --cov=kiro_crew on the 3.12 shards and --no-cov on 3.10,
    # and the coverage-combine job builds coverage.xml from the shard data
    # files). `pytest --cov=kiro_crew` still gives a term-missing report via
    # [coverage:report] below; add --cov-report for the html/xml artifacts.
    # show the slowest 5 tests at the end
    --durations=5
    # Default to colorful output
    --color=yes
    # Uncomment to enforce a minimum code coverage threshold.
    # --cov-fail-under 50
testpaths = test transfer
looponfailroots = src test

# Additional coverage.py settings. The parallel flag and source values let
# pytest-cov alias the installed-package absolute paths back to the relative
# ones in your package source.
[coverage:run]
branch = true
parallel = true

[coverage:paths]
source =
    src/
    build/lib/*/site-packages/

# Kept here rather than as an addopts --cov-report so that an explicit
# `pytest --cov=kiro_crew` still shows uncovered lines now that coverage is
# opt-in.
[coverage:report]
show_missing = true

[coverage:html]
directory = build/coverage

[coverage:xml]
output = build/coverage/coverage.xml

[flake8]
# extend-ignore (not ignore) so pycodestyle's default-ignore list — which
# includes the black-compatible codes E226/E24/E704/W504 — stays in effect.
# Using bare `ignore =` would REPLACE those defaults and start flagging e.g.
# E226 on f-string arithmetic (`{i+1}`), which black intentionally does not space.
extend-ignore =
    # Not pep8, black adds whitespace before ':'
    E203,
    # Not pep8, black adds line break before binary operator
    W503,
    # After auto-formatting, the only remaining long lines do not matter; ignore.
    E501,
max_line_length = 100
# Vendored third-party code (llama-cpp-python) must never be linted —
# keeps diffs against upstream wheels clean for upgrades.
exclude =
    src/kiro_crew/_vendor
per-file-ignores =
    # _ensure_ssl_certs() must run before any library caches its SSL context
    src/kiro_crew/cli.py: E402
    src/kiro_crew/__main__.py: E402
    # Builtin app backends use compact continuation indent style
    src/kiro_crew/apps/builtins/*: E128
# Uncomment to enforce a maximum cyclomatic complexity - more info https://en.wikipedia.org/wiki/Cyclomatic_complexity
# max_complexity=10
