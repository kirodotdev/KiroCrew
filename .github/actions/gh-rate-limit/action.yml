name: Rate-limit-aware gh
description: >-
  Put a gh wrapper first on PATH for every later step of the job. It waits out
  a spent GitHub API rate limit, bounded, and retries only a call whose error
  names a rate limit. Any other result passes through unchanged. It also adds
  `gh-rate-limit-wait`, the same bounded wait as a command, for a step whose
  API calls cannot be wrapped.

# A job's token draws on the repository's shared installation rate limit,
# which the rest of the CI fleet can spend. When it is spent, a single `gh`
# call fails with "API rate limit exceeded" and the run fails, although the
# limit resets within the hour. A scheduled run that fails this way loses what
# it was for until its next tick, which for a daily or weekly job is a day or
# a week.
#
# The wrapper retries ONLY a call whose error names a rate limit, and at most
# twice. It waits until the earliest reset GitHub reports among the spent
# buckets (`/rate_limit` does not count against the quota), or 60s when no
# bucket reads as spent (a secondary limit). The earliest, because the failed
# call's own bucket is not known: if that one is still spent on retry, the
# next wait reads it. Waits share one budget for the whole job, `max-wait`
# seconds; a reset past it fails the call as before. Any other failure passes
# through unchanged.
#
# Retrying is safe for reads and for writes alike: GitHub refuses a
# rate-limited request before acting on it. The wrapper holds a call's output
# until the call ends, so a paginated read that fails part way is re-read from
# the first page and never emits a partial page set. A step that streams
# `gh` output (`gh run watch`) would see it all at once at the end. A call fed
# on stdin (`--input -`, `--body-file -`) is not retry-safe: its retry would
# read an empty stdin. Give such a call a file instead.
#
# A third-party action makes its API calls from its own process, where no
# wrapper reaches. For those the action also installs `gh-rate-limit-wait
# [floor]`. It reads the REST (`core`) bucket from `/rate_limit` and, when
# fewer than `floor` requests remain (default 1, so only a spent bucket), sleeps
# until the reset out of the same job-wide budget. It prints one word on
# stdout: `ready` when it did not wait, `waited` when it did. It exits non-zero
# only when the reset is past the budget, with an `::error::` that names the
# rate limit as CI infrastructure. It never retries anything and never reports
# on the action it guards: run it before the action, and again after a failed
# attempt to learn whether a spent limit explains the failure (`waited`) or not
# (`ready`, so the failure stands). A reading it cannot take counts as `ready`.
#
# The job's `timeout-minutes` must leave room for `max-wait` on top of its own
# work. Put this step after the checkout and before the job's first `gh` call.
# test/test_scheduled_gh_rate_limit.py pins both for every scheduled workflow
# and for the event-triggered jobs it lists in EVENT_WRAPPED.

inputs:
  max-wait:
    description: Total seconds the job may spend waiting for rate-limit resets.
    required: false
    default: "1200"

runs:
  using: composite
  steps:
    - name: Install rate-limit-aware gh
      shell: bash
      env:
        GH_RATE_LIMIT_MAX_WAIT: ${{ inputs.max-wait }}
      run: |
        set -euo pipefail
        real="$(command -v gh)"
        dir="$RUNNER_TEMP/gh-rate-limit"
        mkdir -p "$dir"
        {
          echo '#!/usr/bin/env bash'
          printf 'REAL_GH=%q\n' "$real"
          printf 'WAITED_FILE=%q\n' "$dir/waited-seconds"
          printf 'BUDGET=%q\n' "$GH_RATE_LIMIT_MAX_WAIT"
          cat <<'SHIM'
        set -uo pipefail
        case "$BUDGET" in '' | *[!0-9]*) BUDGET=1200 ;; esac
        # Charges a wait of $1 seconds to the job-wide budget. Fails, charging
        # nothing, when the budget does not hold it. Sets `waited` to the
        # seconds already used.
        charge_wait() {
          waited="$(cat "$WAITED_FILE" 2> /dev/null || true)"
          case "$waited" in '' | *[!0-9]*) waited=0 ;; esac
          [ $((waited + $1)) -le "$BUDGET" ] || return 1
          echo $((waited + $1)) > "$WAITED_FILE"
        }
        if [ "${0##*/}" = gh-rate-limit-wait ]; then
          floor="${1:-1}"
          case "$floor" in '' | *[!0-9]*) floor=1 ;; esac
          verdict=ready
          while :; do
            now="$(date +%s)"
            state="$("$REAL_GH" api rate_limit --jq '
              .resources.core | "\(.remaining) \(.reset)"' 2> /dev/null)" || state=""
            remaining="${state%% *}"
            reset="${state##* }"
            if ! [[ "$remaining" =~ ^[0-9]+$ && "$reset" =~ ^[0-9]+$ ]]; then
              echo "::warning::The GitHub API rate limit could not be read; not waiting." >&2
              break
            fi
            if [ "$remaining" -ge "$floor" ]; then
              echo "GitHub API rate limit: ${remaining} REST requests remain (floor ${floor}); not waiting." >&2
              break
            fi
            delay=$((reset - now + 5))
            [ "$delay" -ge 5 ] || delay=5
            if [ "$verdict" = waited ]; then
              echo "::error::The GitHub API rate limit still has ${remaining} REST requests left (floor ${floor}) after waiting for its reset. This is CI infrastructure, not the code under test: re-run this job later." >&2
              exit 1
            fi
            if ! charge_wait "$delay"; then
              echo "::error::The GitHub API rate limit is spent (${remaining} REST requests left) and resets in ${delay}s, past what is left of this job's ${BUDGET}s wait budget (${waited}s used). This is CI infrastructure, not the code under test: re-run this job after the reset." >&2
              exit 1
            fi
            echo "::warning::The GitHub API rate limit is spent (${remaining} REST requests left); waiting ${delay}s for the reset." >&2
            sleep "$delay"
            verdict=waited
          done
          echo "$verdict"
          exit 0
        fi
        out="$(mktemp)"
        err="$(mktemp)"
        trap 'rm -f "$out" "$err"' EXIT
        retries=0
        while :; do
          "$REAL_GH" "$@" > "$out" 2> "$err"
          rc=$?
          if [ "$rc" -eq 0 ] || [ "$retries" -ge 2 ] || ! grep -qi 'rate limit' "$err"; then
            cat "$out"
            cat "$err" >&2
            exit "$rc"
          fi
          now="$(date +%s)"
          reset="$("$REAL_GH" api rate_limit --jq '
            [.resources | (.core, .graphql, .search)
             | select(type == "object" and .remaining == 0) | .reset]
            | min // empty' 2> /dev/null)" || reset=""
          if [[ "$reset" =~ ^[0-9]+$ ]]; then
            delay=$((reset - now + 5))
          else
            delay=60
          fi
          [ "$delay" -ge 5 ] || delay=5
          if ! charge_wait "$delay"; then
            cat "$err" >&2
            echo "::error::The GitHub API rate limit is spent and resets in ${delay}s, past what is left of this job's ${BUDGET}s wait budget (${waited}s used). This is CI infrastructure, not the code under test. Failing the call without waiting." >&2
            exit "$rc"
          fi
          echo "::warning::gh ${1:-} hit the GitHub API rate limit; waiting ${delay}s for the reset, then retrying." >&2
          sleep "$delay"
          retries=$((retries + 1))
        done
        SHIM
        } > "$dir/gh"
        chmod +x "$dir/gh"
        cp "$dir/gh" "$dir/gh-rate-limit-wait"
        echo "$dir" >> "$GITHUB_PATH"
