name: Sign and Notarize macOS (reusable)

# Reusable workflow: CDSigner-sign the macOS app, notarize + staple it, then
# publish it. Called by nightly.yml (channel: nightly) and release.yml
# (channel: insider | stable). See docs/signing-runbook.md for the full
# chain and the credential rotation procedure.
#
# Three jobs, chained:
#   sign      -- flatten build artifacts, attest provenance, upload unsigned
#                artifacts to pre-signed/ in the PRIVATE signing bucket,
#                submit the .app to CDSigner. Nothing here is public-facing.
#                (This job was historically duplicated in nightly.yml and
#                release.yml under the misleading name "publish".)
#   notarize  -- everything macOS-bound: Apple notarization, staple, the
#                spctl fail-closed gate. The Apple credential is confined
#                to this job. Ends by attaching the GATED artifact
#                (notarized zip) to the workflow run.
#   publish   -- everything S3-bound: copy the gated artifact to the public
#                distribution bucket and write the channel feed, dead last.
#                Separate from notarize so a transient publish failure
#                retries as a ~2-minute ubuntu job ("Re-run failed jobs")
#                instead of repeating two ~30-minute-budget Apple
#                submissions, and so the expensive macOS runner never burns
#                minutes on S3 uploads.
#
# DMG history (2026-07-21): the DMG was briefly withdrawn after a field
# defect -- hdiutil-created DMGs carry an ADHOC signature, which the Apple
# notary service Accepts but Gatekeeper treats as "no usable signature",
# showing "app is damaged" when a user drags the app out of the quarantined
# mount (syspolicy_check: app passed, DMG failed). It is reinstated with a
# proper Developer ID signature: a SECOND CDSigner task (manifest type:
# dmg, see packaging/signing/sign-dmg.sh) signs the rebuilt DMG before its
# notarization -- which also makes the DMG STAPLE-able (stapler fails with
# Error 73 on unsigned DMGs), so first-install verification now works
# fully offline. A fail-closed spctl gate below enforces the end state.
#
# Key properties:
#   - The signed_zip_key handoff is internal (sign job output -> notarize
#     job), no longer plumbed through every caller.
#   - The Apple credential is fetched from AWS Secrets Manager at runtime
#     (kirocrew/signing/apple-notary) via the same OIDC role used for
#     signing. The password is masked and scoped to single steps in the
#     notarize job only; it is never persisted to GITHUB_ENV, files, or
#     logs, and the publish job never touches it.
#   - Fails closed: Gatekeeper assessment (spctl) must report
#     "Notarized Developer ID" or the notarize job fails and publish never
#     runs. On an Invalid notarization the itemized Apple log is printed.
#   - The publish job consumes only the artifact the notarize job attached
#     AFTER the gate, in the same run -- un-notarized bytes have no path to
#     the distribution bucket or the feed.
#   - Writes the update feed AFTER both artifacts are publicly
#     downloadable. Un-notarized artifacts must never appear in the update
#     feed for the same reason unsigned ones must not: clients would
#     auto-update to a build Gatekeeper blocks.

on:
  workflow_call:
    inputs:
      channel:
        description: "Release channel: nightly | insider | stable"
        required: true
        type: string
      version:
        description: "Version label used in S3 keys and the feed"
        required: true
        type: string
      write_feed:
        description: "Publish to the distribution bucket and write feed/<channel>/latest-mac.json"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  sign:
    name: Sign with CDSigner (${{ inputs.channel }})
    runs-on: ubuntu-latest
    # OIDC subject alignment: tag-triggered callers (release.yml) present
    # ref:refs/tags/<tag>, which the signing role does not trust. The prod
    # environment switches the subject to environment:prod, which it does.
    # (Nightly runs on main present either trusted form.) See the notarize
    # job below for the full environment-protection rationale.
    environment: prod
    outputs:
      signed_zip_key: ${{ steps.sign.outputs.signed_zip_key }}
    env:
      HAS_SIGNING_SECRETS: ${{ secrets.AWS_SIGNING_ROLE_ARN != '' && 'true' || '' }}
      HAS_CDSIGNER: ${{ secrets.CDSIGNER_API_ENDPOINT != '' && 'true' || '' }}
      CHANNEL: ${{ inputs.channel }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          sparse-checkout: packaging/signing

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.whl" -o -name "*.tar.gz" -o -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" \) -exec cp {} release/ \;
          ls -la release/

      - name: Attest build provenance
        # Signed SLSA provenance for the wheel/sdist/AppImage (CWE-1104).
        # Runs right after flatten, before anything leaves the runner.
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          # Attest only artifacts whose bytes are final here. The macOS .zip is
          # re-signed + notarized downstream, so a pre-notarization attestation
          # would bind a digest that never ships -- omit *.zip. Same for *.dmg:
          # the electron-builder DMG wraps the unsigned app and never ships
          # (no DMG ships at all -- see the header note).
          subject-path: |
            release/*.whl
            release/*.tar.gz
            release/*.AppImage

      # Install the CDSigner SigV4 client (awscurl) BEFORE AWS credentials are
      # configured, so a compromised or version-drifted release can never observe
      # the signing-role credentials at install time. Pinned for the same reason.
      - name: Install awscurl (SigV4 client for CDSigner)
        if: env.HAS_CDSIGNER
        run: |
          python3 -m pip install --user --quiet "awscurl==0.44"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure AWS credentials
        if: env.HAS_SIGNING_SECRETS
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
          aws-region: us-west-2

      - name: Upload unsigned artifacts to S3
        if: env.HAS_SIGNING_SECRETS
        run: |
          for f in release/*; do
            [ -f "$f" ] || continue
            KEY="pre-signed/${CHANNEL}/${VERSION}/$(basename "$f")"
            echo "Uploading $f -> s3://${{ secrets.AWS_SIGNING_BUCKET }}/${KEY}"
            aws s3 cp "$f" "s3://${{ secrets.AWS_SIGNING_BUCKET }}/${KEY}"
          done

      - name: Extract .app from zip for signing
        if: env.HAS_CDSIGNER
        run: |
          mkdir -p unsigned-app
          MAC_ZIP=$(find release -name "*arm64*.zip" | head -1)
          if [ -n "$MAC_ZIP" ]; then
            unzip -q "$MAC_ZIP" -d unsigned-app/
            echo "APP_PATH=$(find unsigned-app -name '*.app' -maxdepth 1 | head -1)" >> "$GITHUB_ENV"
          else
            echo "No macOS zip found -- skipping signing"
            echo "APP_PATH=" >> "$GITHUB_ENV"
          fi

      - name: Sign with CDSigner
        id: sign
        if: env.HAS_CDSIGNER && env.APP_PATH != ''
        env:
          AWS_SIGNING_BUCKET: ${{ secrets.AWS_SIGNING_BUCKET }}
          AWS_SIGNER_ROLE_ARN: ${{ secrets.AWS_SIGNER_ACCESS_ROLE_ARN }}
          CDSIGNER_API_ENDPOINT: ${{ secrets.CDSIGNER_API_ENDPOINT }}
        run: |
          bash packaging/signing/sign.sh "$APP_PATH" "$CHANNEL" "$VERSION"
          echo "signed_zip_key=signed/${CHANNEL}/${VERSION}/$(basename "$APP_PATH" .app).zip" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "## Sign (${CHANNEL})"
            echo "- Version: ${VERSION}"
            echo "- Signed: ${{ env.HAS_CDSIGNER && env.APP_PATH != '' && 'Yes' || 'No (CDSigner not configured)' }}"
            echo "- Artifacts:"
            ls release/ | sed 's/^/  - /'
          } >> "$GITHUB_STEP_SUMMARY"

  notarize:
    name: Notarize + staple (${{ inputs.channel }})
    needs: sign
    # Skip cleanly (rather than fail) when signing is not configured
    # (fork / repo without CDSigner secrets) -- there is nothing to notarize.
    if: needs.sign.outputs.signed_zip_key != ''
    runs-on: macos-14
    # Worst-case wait budget: two notarytool submissions (app, then DMG)
    # at up to 30m each, plus the CDSigner DMG sign task poll at up to 15m
    # = 75m of pure waiting. The budget must also cover checkout, installs,
    # downloads, DMG build, staple, attestation, and uploads, or GitHub
    # cancels the job mid-publication on a legitimately slow day.
    timeout-minutes: 90
    # OIDC subject alignment: tag-triggered callers (release.yml) present
    # ref:refs/tags/<tag>, which the signing role does not trust. The prod
    # environment switches the subject to environment:prod, which it does.
    # The prod environment is protected by GitHub-side ref restrictions
    # rather than required reviewers (which would stall the unattended
    # scheduled nightly): a deployment branch/tag policy limits the
    # environment to main and v* tags, and the release-tags-admin-only
    # repository ruleset restricts v* tag creation/update/deletion to
    # repository admins. An unmerged commit can therefore only reach this
    # environment if an admin deliberately tags it -- the same principal
    # who could merge it to main.
    environment: prod
    outputs:
      app_name: ${{ steps.staple.outputs.app_name }}
    env:
      HAS_SIGNING_SECRETS: ${{ secrets.AWS_SIGNING_ROLE_ARN != '' && 'true' || '' }}
      CHANNEL: ${{ inputs.channel }}
      VERSION: ${{ inputs.version }}
      SIGNED_ZIP_KEY: ${{ needs.sign.outputs.signed_zip_key }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          sparse-checkout: packaging/signing

      # Install the CDSigner SigV4 client BEFORE AWS credentials are
      # configured (same supply-chain ordering as the sign job). macOS
      # --user installs land under `python3 -m site --user-base`/bin.
      - name: Install awscurl (SigV4 client for CDSigner)
        run: |
          python3 -m pip install --user --quiet "awscurl==0.44"
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: Configure AWS credentials
        if: env.HAS_SIGNING_SECRETS
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
          aws-region: us-west-2

      - name: Download signed artifact
        if: env.HAS_SIGNING_SECRETS
        run: |
          mkdir -p work
          aws s3 cp "s3://${{ secrets.AWS_SIGNING_BUCKET }}/${SIGNED_ZIP_KEY}" work/signed.zip --only-show-errors
          ls -la work/

      # The credential lives in Secrets Manager (never GitHub secrets --
      # Amazon custody, CloudTrail audit, rotation lifecycle). It is fetched,
      # masked, used, and discarded inside this single step.
      - name: Notarize with Apple notary service
        if: env.HAS_SIGNING_SECRETS
        run: |
          set -euo pipefail
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id kirocrew/signing/apple-notary \
            --query SecretString --output text)
          APPLE_ID=$(printf '%s' "$SECRET_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin)['apple_id'])")
          APPLE_PW=$(printf '%s' "$SECRET_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin)['password'])")
          TEAM_ID=$(printf '%s' "$SECRET_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin)['team_id'])")
          echo "::add-mask::$APPLE_PW"
          unset SECRET_JSON

          echo "Submitting to Apple notary service (team $TEAM_ID)..."
          set +e
          SUBMIT_OUT=$(xcrun notarytool submit work/signed.zip \
            --apple-id "$APPLE_ID" --password "$APPLE_PW" --team-id "$TEAM_ID" \
            --wait --timeout 30m 2>&1)
          RC=$?
          set -e
          echo "$SUBMIT_OUT"
          SUBMISSION_ID=$(echo "$SUBMIT_OUT" | awk '/^  id: /{print $2; exit}')

          if [ $RC -ne 0 ] || ! echo "$SUBMIT_OUT" | grep -q "status: Accepted"; then
            echo "Notarization was not Accepted. Fetching the itemized Apple log..."
            if [ -n "$SUBMISSION_ID" ]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" --password "$APPLE_PW" --team-id "$TEAM_ID" || true
            fi
            exit 1
          fi
          echo "Notarization Accepted: $SUBMISSION_ID"

      - name: Staple and verify
        id: staple
        if: env.HAS_SIGNING_SECRETS
        run: |
          set -euo pipefail
          mkdir -p work/stapled && cd work/stapled
          unzip -q ../signed.zip
          APP=$(find . -maxdepth 1 -name "*.app" | head -1)
          [ -n "$APP" ] || { echo "No .app found in signed zip"; exit 1; }

          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

          ASSESS=$(spctl --assess --type execute --verbose "$APP" 2>&1)
          echo "$ASSESS"
          echo "$ASSESS" | grep -q "Notarized Developer ID" || {
            echo "Gatekeeper assessment did not report 'Notarized Developer ID' -- failing closed."
            exit 1
          }

          # ditto preserves the resource fork carrying the stapled ticket.
          /usr/bin/ditto -c -k --keepParent "$APP" ../notarized.zip
          echo "APP_NAME=$(basename "$APP" .app)" >> "$GITHUB_ENV"
          echo "app_name=$(basename "$APP" .app)" >> "$GITHUB_OUTPUT"

      - name: Upload notarized artifact to S3
        if: env.HAS_SIGNING_SECRETS
        run: |
          KEY="notarized/${CHANNEL}/${VERSION}/${APP_NAME}.zip"
          aws s3 cp work/notarized.zip "s3://${{ secrets.AWS_SIGNING_BUCKET }}/${KEY}" --only-show-errors
          echo "NOTARIZED_KEY=${KEY}" >> "$GITHUB_ENV"
          echo "Notarized artifact: s3://${{ secrets.AWS_SIGNING_BUCKET }}/${KEY}"

      # First-install DMG, rebuilt from the STAPLED app (the electron-builder
      # DMG from the build job wraps the unsigned app and must never ship).
      - name: Build DMG from stapled app
        if: env.HAS_SIGNING_SECRETS
        run: |
          set -euo pipefail
          rm -rf work/dmg-staging && mkdir -p work/dmg-staging
          cp -R "work/stapled/${APP_NAME}.app" work/dmg-staging/
          ln -s /Applications work/dmg-staging/Applications
          hdiutil create -volname "${APP_NAME}" -srcfolder work/dmg-staging \
            -ov -format UDZO -quiet "work/${APP_NAME}.dmg"
          ls -lh "work/${APP_NAME}.dmg"

      # Developer ID sign the DMG itself via a second CDSigner task (type:
      # dmg). Without this, the DMG carries hdiutil's adhoc signature, which
      # Gatekeeper rejects as "app is damaged" on drag-out -- and an unsigned
      # DMG cannot be stapled (stapler Error 73). Fail-closed: the script
      # verifies a Developer ID Application authority on the result.
      - name: Sign DMG with CDSigner
        if: env.HAS_SIGNING_SECRETS
        env:
          AWS_SIGNING_BUCKET: ${{ secrets.AWS_SIGNING_BUCKET }}
          AWS_SIGNER_ROLE_ARN: ${{ secrets.AWS_SIGNER_ACCESS_ROLE_ARN }}
          CDSIGNER_API_ENDPOINT: ${{ secrets.CDSIGNER_API_ENDPOINT }}
        run: bash packaging/signing/sign-dmg.sh "work/${APP_NAME}.dmg" "$CHANNEL" "$VERSION"

      - name: Notarize DMG
        if: env.HAS_SIGNING_SECRETS
        run: |
          set -euo pipefail
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id kirocrew/signing/apple-notary \
            --query SecretString --output text)
          APPLE_ID=$(printf '%s' "$SECRET_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin)['apple_id'])")
          APPLE_PW=$(printf '%s' "$SECRET_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin)['password'])")
          TEAM_ID=$(printf '%s' "$SECRET_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin)['team_id'])")
          echo "::add-mask::$APPLE_PW"
          unset SECRET_JSON

          echo "Submitting DMG to Apple notary service..."
          set +e
          SUBMIT_OUT=$(xcrun notarytool submit "work/${APP_NAME}.dmg" \
            --apple-id "$APPLE_ID" --password "$APPLE_PW" --team-id "$TEAM_ID" \
            --wait --timeout 30m 2>&1)
          RC=$?
          set -e
          echo "$SUBMIT_OUT"
          SUBMISSION_ID=$(echo "$SUBMIT_OUT" | awk '/^  id: /{print $2; exit}')

          if [ $RC -ne 0 ] || ! echo "$SUBMIT_OUT" | grep -q "status: Accepted"; then
            echo "DMG notarization was not Accepted. Fetching the itemized Apple log..."
            if [ -n "$SUBMISSION_ID" ]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" --password "$APPLE_PW" --team-id "$TEAM_ID" || true
            fi
            exit 1
          fi
          echo "DMG notarization Accepted: $SUBMISSION_ID"

      # Staple the ticket INTO the DMG (possible now that it is signed) and
      # hold it to the same fail-closed Gatekeeper standard as the app. This
      # gate is exactly the check that would have caught the adhoc defect.
      - name: Staple and gate DMG
        if: env.HAS_SIGNING_SECRETS
        run: |
          set -euo pipefail
          xcrun stapler staple "work/${APP_NAME}.dmg"
          xcrun stapler validate "work/${APP_NAME}.dmg"
          ASSESS=$(spctl --assess --type install --verbose "work/${APP_NAME}.dmg" 2>&1)
          echo "$ASSESS"
          echo "$ASSESS" | grep -q "Notarized Developer ID" || {
            echo "Gatekeeper assessment did not report 'Notarized Developer ID' -- failing closed."
            exit 1
          }

      # Attest the DMG that actually ships -- AFTER staple, because stapling
      # embeds the ticket into the DMG file (the final released bytes).
      - name: Attest DMG provenance
        if: env.HAS_SIGNING_SECRETS
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: work/*.dmg

      # The GATED artifact: attached only after the spctl gate above. This
      # is the sole input of the publish job (and of release.yml's
      # github-release job), so un-notarized bytes have no path downstream.
      - name: Attach notarized artifact to workflow run
        if: env.HAS_SIGNING_SECRETS
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: KiroCrew-notarized-${{ inputs.channel }}-${{ inputs.version }}
          path: |
            work/notarized.zip
            work/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: env.HAS_SIGNING_SECRETS
        run: |
          {
            echo "## Notarization (${CHANNEL})"
            echo "- Version: ${VERSION}"
            echo "- Input: \`${SIGNED_ZIP_KEY}\`"
            echo "- Output: \`${NOTARIZED_KEY}\` (stapled, Gatekeeper-verified)"
            echo "- DMG: \`${APP_NAME}.dmg\` (Developer ID signed, notarized, stapled)"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to distribution (${{ inputs.channel }})
    needs: notarize
    # success() is REQUIRED here: a custom job-level `if` replaces the
    # implicit success check, and without it this job would run even after
    # a failed or skipped notarize. The remaining conditions gate public
    # distribution on the CDN being configured -- when it is not (fork),
    # notarize still produced the gated artifact for github-release.
    if: ${{ success() && inputs.write_feed && vars.CLI_DIST_BUCKET != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same OIDC subject alignment as the jobs above (S3 writes assume the
    # signing role). No Secrets Manager access here -- the Apple credential
    # stays confined to the notarize job.
    environment: prod
    env:
      HAS_SIGNING_SECRETS: ${{ secrets.AWS_SIGNING_ROLE_ARN != '' && 'true' || '' }}
      CHANNEL: ${{ inputs.channel }}
      VERSION: ${{ inputs.version }}
      APP_NAME: ${{ needs.notarize.outputs.app_name }}
    steps:
      - name: Configure AWS credentials
        if: env.HAS_SIGNING_SECRETS
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
          aws-region: us-west-2

      - name: Download gated artifact
        if: env.HAS_SIGNING_SECRETS
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: KiroCrew-notarized-${{ inputs.channel }}-${{ inputs.version }}
          path: work

      - name: Verify gated artifact contents
        if: env.HAS_SIGNING_SECRETS
        run: |
          set -euo pipefail
          ls -la work/
          [ -f "work/notarized.zip" ] || { echo "notarized.zip missing from gated artifact"; exit 1; }
          [ -f "work/${APP_NAME}.dmg" ] || { echo "${APP_NAME}.dmg missing from gated artifact"; exit 1; }

      # The versioned zip key is immutable-cached by CloudFront, so it must
      # never be republished with different bytes (same class as the cli/*
      # wheel keys). --if-none-match makes the write conditional; on a 412
      # (job re-run after a later-step failure) the existing object is a
      # notarized artifact that already passed the spctl gate on the earlier
      # attempt, so it is KEPT and the step continues idempotently.
      - name: Publish notarized artifact to distribution bucket
        if: env.HAS_SIGNING_SECRETS
        run: |
          set -euo pipefail
          DESKTOP_KEY="desktop/${CHANNEL}/${VERSION}/${APP_NAME}.zip"
          set +e
          PUT_OUT=$(aws s3api put-object \
            --bucket "${{ vars.CLI_DIST_BUCKET }}" \
            --key "${DESKTOP_KEY}" \
            --body work/notarized.zip \
            --if-none-match '*' \
            --content-type application/zip \
            --cache-control "public, max-age=31536000, immutable" 2>&1)
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            if echo "$PUT_OUT" | grep -q "PreconditionFailed"; then
              echo "Key already published (job re-run) -- keeping existing notarized bytes: ${DESKTOP_KEY}"
            else
              echo "$PUT_OUT"
              exit $RC
            fi
          fi
          echo "DESKTOP_KEY=${DESKTOP_KEY}" >> "$GITHUB_ENV"
          echo "Public artifact: ${{ vars.CLI_CDN_BASE }}/${DESKTOP_KEY}"

      # Same never-republish discipline as the zip: conditional write,
      # 412 on a job re-run keeps the existing bytes.
      - name: Publish DMG to distribution bucket
        if: env.HAS_SIGNING_SECRETS
        run: |
          set -euo pipefail
          DMG_KEY="desktop/${CHANNEL}/${VERSION}/${APP_NAME}.dmg"
          set +e
          PUT_OUT=$(aws s3api put-object \
            --bucket "${{ vars.CLI_DIST_BUCKET }}" \
            --key "${DMG_KEY}" \
            --body "work/${APP_NAME}.dmg" \
            --if-none-match '*' \
            --content-type application/x-apple-diskimage \
            --cache-control "public, max-age=31536000, immutable" 2>&1)
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            if echo "$PUT_OUT" | grep -q "PreconditionFailed"; then
              echo "DMG key already published (job re-run) -- keeping existing bytes: ${DMG_KEY}"
            else
              echo "$PUT_OUT"
              exit $RC
            fi
          fi
          echo "DMG_KEY=${DMG_KEY}" >> "$GITHUB_ENV"
          echo "Public DMG: ${{ vars.CLI_CDN_BASE }}/${DMG_KEY}"

      # Feed points at the NOTARIZED artifact on the CDN -- written only
      # after the spctl gate passed (this job's sole input is the gated
      # artifact) and only after the artifact is publicly downloadable
      # (feed-before-artifact would hand clients a 403/404). The feed key is
      # mutable and served no-cache by the feed/* CloudFront behavior, so
      # overwriting is safe. Out-of-order overwrites (older run finishing
      # last -> channel rollback) are prevented by the CALLER workflows'
      # concurrency groups, which serialize runs per channel -- not by
      # version comparison here, which would itself be a read-then-write
      # race.
      - name: Write update feed
        if: env.HAS_SIGNING_SECRETS
        run: |
          set -euo pipefail
          cat > /tmp/latest-mac.json <<EOF
          {
            "version": "${VERSION}",
            "url": "${{ vars.CLI_CDN_BASE }}/${DESKTOP_KEY}",
            "dmg": "${{ vars.CLI_CDN_BASE }}/${DMG_KEY}",
            "name": "${VERSION}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          aws s3 cp /tmp/latest-mac.json \
            "s3://${{ vars.CLI_DIST_BUCKET }}/feed/${CHANNEL}/latest-mac.json" \
            --content-type application/json
          echo "Feed written: feed/${CHANNEL}/latest-mac.json -> ${{ vars.CLI_CDN_BASE }}/${DESKTOP_KEY}"

      - name: Summary
        if: env.HAS_SIGNING_SECRETS
        run: |
          {
            echo "## Publish (${CHANNEL})"
            echo "- Version: ${VERSION}"
            echo "- Public zip: ${{ vars.CLI_CDN_BASE }}/${DESKTOP_KEY}"
            echo "- Public DMG: ${{ vars.CLI_CDN_BASE }}/${DMG_KEY}"
            echo "- Feed: \`feed/${CHANNEL}/latest-mac.json\`"
          } >> "$GITHUB_STEP_SUMMARY"
