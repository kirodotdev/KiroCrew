# Deferred-finding discipline (RFC: closing the fix loop).
#
# A review finding dispositioned as `accepted-and-deferred` is a promise, and
# 63% of this repo's traceable escaped bugs were exactly such promises: flagged
# by a review lane, deferred to a follow-up issue, never recycled, then shipped
# and broke. This workflow validates the promise's shape at the moment it is
# made: a deferral must name an open follow-up issue that carries the
# `deferred-finding` label, an assignee (the owner), and a due date (a
# `Due: YYYY-MM-DD` line in the issue body, or a milestone with a due date).
#
# ADVISORY BY DESIGN: an issue_comment event cannot gate a PR that is already
# green, so this lane replies with what is missing rather than failing a
# required check. The teeth live elsewhere: the GPT lane's ROUND CONVERGENCE
# rules re-raise security/data-loss findings that a deferral tries to cover,
# and the weekly deferred-findings-audit surfaces overdue items.
#
# INJECTION SAFETY: the comment body is attacker-controlled on a public repo.
# It reaches shell steps ONLY via env (never ${{ }} inside run:), and this
# workflow takes no privileged action from its content — it reads, validates,
# and replies.
name: Disposition Deferral Check

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  validate-deferral:
    # Only PR comments that are disposition records mentioning a deferral.
    if: >
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '<!-- ai-review-disposition') &&
      contains(github.event.comment.body, 'accepted-and-deferred')
    name: Validate deferred-finding promise
    # NOT routed to the CodeBuild fleet -- same class of bug as
    # issue-summary.yml/issue-triage.yml: this fires on `issue_comment`, any
    # commenter can trigger it, and a non-collaborator commenter's dispatch
    # is rejected by the AWS webhook's actor allowlist, queuing the job
    # forever instead of running it.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The four tests a tracked deferral passes live in
      # .github/scripts/release_record.py, the module the override handler calls
      # for class `deferred`, so the two cannot drift. Read from the default
      # branch's tree at the commit this workflow runs from; no checkout.
      - name: Load the release-record module
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.sha }}
          RELEASE_RECORD: ${{ runner.temp }}/release_record.py
        run: |
          set -euo pipefail
          dest="$RELEASE_RECORD"
          for attempt in 1 2 3; do
            if gh api -H "Accept: application/vnd.github.raw" \
              "repos/$REPO/contents/.github/scripts/release_record.py?ref=$WORKFLOW_SHA" \
              > "$dest" && [ -s "$dest" ]; then
              exit 0
            fi
            echo "Loading release_record.py failed on attempt $attempt."
            if [ "$attempt" -lt 3 ]; then
              sleep "$attempt"
            fi
          done
          echo "::error::Could not load .github/scripts/release_record.py from $WORKFLOW_SHA after 3 attempts. This is a read failure, not an untracked deferral -- re-run this job."
          exit 1

      - name: Check the deferral names a tracked follow-up issue
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          RELEASE_RECORD: ${{ runner.temp }}/release_record.py
        run: |
          set -euo pipefail
          problems=""

          # Issue references in the disposition body ("#123"), excluding the
          # PR's own number. The deferral must point at least one of them at a
          # properly-shaped follow-up issue.
          refs="$(printf '%s' "$COMMENT_BODY" | grep -oE '#[0-9]+' | tr -d '#' | sort -u | grep -vx "$PR_NUMBER" || true)"

          if [ -z "$refs" ]; then
            problems="- The deferral names no follow-up issue. File one and reference it (\`#<number>\`) in the disposition."
          else
            valid=""
            for n in $refs; do
              # An issue this loop could not READ is not an invalid reference.
              # `2>/dev/null || true` collapsed a transient API failure onto
              # the same empty string as "this number is not an issue here",
              # so a network blip made every referenced follow-up look
              # unresolvable and the author was blamed for an untracked
              # deferral they had in fact tracked. Only HTTP 404 means the
              # reference does not resolve; any other failure is retried and
              # then fails this check closed -- re-runnable -- instead of
              # posting a false refusal.
              issue_json=""
              read_ok=""
              for attempt in 1 2 3; do
                gh_err="$(mktemp)"
                if issue_json="$(gh api "repos/$REPO/issues/$n" 2>"$gh_err")"; then
                  read_ok=1
                  rm -f "$gh_err"
                  break
                fi
                if grep -q "HTTP 404" "$gh_err"; then
                  rm -f "$gh_err"
                  read_ok=404
                  break
                fi
                echo "Reading issue #$n failed on attempt $attempt:"
                cat "$gh_err" >&2
                rm -f "$gh_err"
                if [ "$attempt" -lt 3 ]; then
                  sleep "$attempt"
                fi
              done
              if [ -z "$read_ok" ]; then
                echo "::error::Could not read issue #$n from the API after 3 attempts, so this check cannot tell whether the deferral is tracked. This is a read failure, not an untracked deferral -- re-run this job."
                # This lane is advisory by design (an issue_comment run has no
                # PR-visible check row), so a silent red run in the Actions tab
                # is a signal nobody sees. Leave the unverified state where the
                # promise was made -- best-effort: if the API is down enough
                # that this post also fails, the exit 1 below is still the
                # ground truth.
                reply="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/reply.md"
                {
                  echo "<!-- deferred-finding-check -->"
                  echo "**Could not verify this deferral.** Reading issue #$n from the API failed after 3 attempts, so this check could not tell whether the deferral is tracked. This is a read failure, not a judgement about the deferral -- re-run the deferral check. Checked disposition: ${COMMENT_URL}"
                } > "$reply"
                gh api "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$(cat "$reply")" >/dev/null || true
                exit 1
              fi
              [ "$read_ok" = "404" ] && continue
              # Skip refs that are PRs, not issues.
              if printf '%s' "$issue_json" | jq -e '.pull_request' >/dev/null 2>&1; then
                continue
              fi
              # The same four tests the override handler applies to class
              # `deferred`: open, labelled, assigned, dated. One problem per line.
              found=""
              if ! found="$(printf '%s' "$issue_json" | python3 "$RELEASE_RECORD" issue-problems)"; then
                echo "::error::Could not evaluate issue #$n (release_record.py failed). This is a read failure, not an untracked deferral -- re-run this job."
                exit 1
              fi
              missing=""
              while IFS= read -r problem; do
                [ -n "$problem" ] && missing="$missing $problem;"
              done <<<"$found"
              if [ -z "$missing" ]; then
                valid="$n"
                break
              fi
              problems="$problems
          - Issue #$n:$missing"
            done
            if [ -n "$valid" ]; then
              echo "Deferral is tracked by issue #$valid (open, labeled, owned, dated)."
              exit 0
            fi
            if [ -z "$problems" ]; then
              problems="- None of the referenced numbers resolve to an issue in this repository."
            fi
          fi

          echo "Deferral promise is incomplete — replying with requirements."
          # The reply is staged under the runner's temp dir (not a hardcoded
          # /tmp path) so the behavioural test's TMPDIR containment binds and
          # no artifact outlives a local run.
          reply="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/reply.md"
          # Markdown emphasis next to an expansion MUST be braced: bash treats a
          # trailing `_` as part of the variable name, so `$COMMENT_URL_` is a
          # different, unset variable and `set -u` kills this script before the
          # reply is posted. That failure is invisible from the outside — the
          # refusal simply never arrives — so `test_fix_loop_discipline.py`
          # pins every expansion in these workflows to a defined name.
          {
            echo "<!-- deferred-finding-check -->"
            echo "**This deferral is not yet tracked.** An \`accepted-and-deferred\` disposition must name an open follow-up issue that has:"
            echo ""
            echo "- the \`deferred-finding\` label"
            echo "- an assignee (the owner who will recycle it)"
            echo "- a due date: a \`Due: YYYY-MM-DD\` line in the issue body, or a milestone with a due date"
            echo ""
            echo "What is missing:"
            echo "$problems"
            echo ""
            echo "_An untracked deferral is how flagged findings ship anyway — 63% of this repo's traceable escaped bugs were flagged and then deferred without follow-through. Checked disposition: ${COMMENT_URL}_"
          } > "$reply"
          gh api "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$(cat "$reply")" >/dev/null
