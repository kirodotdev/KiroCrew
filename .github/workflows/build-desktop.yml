name: Build Desktop (reusable)

# Reusable workflow: build the unsigned Electron desktop app for every
# supported platform, stamped so app.getVersion() equals the update-feed
# version (the auto-updater's client-side compare depends on this; a
# mismatch means a permanent "update available" loop). Called by
# nightly.yml and release.yml so the build recipe and the platform matrix
# exist exactly once.
#
# Platform matrix (expand as support lands):
#   - macOS universal (arm64 + x86_64): shipped (one desktop DMG)
#   - Linux x64:    shipped (AppImage + deb + rpm)
#   - Linux arm64:  shipped (AppImage + deb + rpm — Graviton, Raspberry Pi, ARM laptops)
#
# Linux is built NATIVELY per arch, never cross-compiled: build-desktop.sh
# provisions a python-build-standalone interpreter and then RUNS it (pip
# install + the self-containment gate `python -m kiro_crew --version`), so a
# host that cannot execute the target arch cannot build it. macOS gets away
# with one host because Rosetta 2 executes the x86_64 slice; Linux has no
# equivalent, hence one runner per arch.
#
# Windows lives in build-windows.yml, NOT here. Its Squirrel installer embeds
# its own already-signed executables, so Authenticode signing has to happen
# during the build rather than in a downstream job -- which means that job
# holds a production signing identity. This workflow must stay credential-free
# (contents:read only, pinned by test_workflow_permissions.py), so the
# credentialed platform gets its own reusable workflow instead of widening the
# blast radius of the shared one to the mac and Linux legs.

on:
  workflow_call:
    inputs:
      version:
        description: "Semver version to stamp (electron package.json + __init__.py)"
        required: true
        type: string
  # Manual build-only probe: builds every platform's artifacts from any ref
  # WITHOUT publishing anything (no callers, no S3, no feeds). Used to
  # validate packaging changes (e.g. a new platform lane) before merge.
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Semver version to stamp. Use a REALISTIC channel-shaped stamp
          (e.g. 0.1.0-nightly.20260727t181500), not 0.0.0-probe.N: Squirrel
          Int32-parses digit runs in the nupkg filename, and electron-builder
          concatenates dot-separated identifiers into that filename, so a
          probe with a single-digit identifier cannot exercise the stamp shape
          that real nightlies produce. That gap let an Int32 overflow reach a
          nightly. Note the "t": a DOTTED example like
          0.1.0-nightly.20260727.181500 concatenates back to 14 digits and
          reproduces the overflow (proven: run 30293292843).
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            # 'unsigned-' prefix: this artifact is an inter-job handoff to the
            # sign job, NOT an installable deliverable. Humans should download
            # only the KiroCrew-notarized-* artifact. GitHub shows all uploaded
            # artifacts on the run page with equal prominence, so the name is
            # the only place to signal that.
            artifact-name: unsigned-build-darwin-universal
            # On macOS, `make desktop` builds the universal app by default:
            # universal Electron shell + both per-arch PBS backends in one
            # DMG. The x86_64 backend slice builds and gates under Rosetta 2,
            # which GitHub's arm64 macOS runners (macos-15) ship preinstalled.
            # VERIFIED, not assumed: the runner-images manifests never mention
            # Rosetta -- not even for macos-14, where it demonstrably works --
            # so this was probed directly. macos-14/15/26 all report
            # `arch -x86_64 uname -m` -> x86_64 and can host an x86_64
            # interpreter. macos-15 is the chosen target because it also keeps
            # OpenSSL 1.1.1w (same as macos-14); macos-26 jumps to OpenSSL
            # 3.6.x + clang 21, which the bundled backend has not been
            # validated against.
          - os: ubuntu-22.04
            artifact-name: build-linux-x64
            # 22.04 (not 24.04) on BOTH Linux legs: the AppImage links against
            # the builder's glibc, so the runner's glibc IS the floor for every
            # user. 22.04 ships 2.35, which covers the long-support distros ARM
            # users actually run (AL2023, Debian 12, RHEL 9); 24.04's 2.39 would
            # silently exclude them.
          - os: ubuntu-22.04-arm
            artifact-name: build-linux-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # cache disabled: this workflow is workflow_call-only from
          # nightly.yml / release.yml, so every run builds published bytes.
          # An Actions cache is writable from any branch and readable by a
          # tag run (zizmor cache-poisoning).

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        # The build script provisions python-build-standalone interpreters
        # through uv; not every runner image ships it, and the script's
        # curl|sh fallback is POSIX-shaped.
        #
        # Exactly ONE setup-uv per job. Its cache key (restore-cache.ts) is
        # setup-uv-2-<arch>-<platform>-<os>-<python>-<dep-hash> -- every part
        # job-invariant, so a SECOND invocation in this job derives the same key
        # and its post step's save makes this step's post fail reserveCache:
        # "Failed to save: Unable to reserve cache with key setup-uv-2-...,
        # another job may be creating this cache."
        #
        # That message is why the duplicate survived review for so long: it
        # reads as benign matrix contention. It is not. The key embeds arch and
        # OS, so the mac and linux-arm64 legs cannot share one, and the run's
        # two annotations carried two DIFFERENT keys. Same job, different step.
        # (The x64 leg stayed quiet only because ci.yml's linux-packaging job
        # already writes that key, so both post steps hit and skip saving.)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        # cache disabled explicitly: setup-uv's default (enable-cache: auto)
        # turns the cache ON for hosted runners, and this workflow only ever
        # runs on a publish path, so a restored entry would reach signed bytes
        # (zizmor cache-poisoning). This also makes the reserveCache collision
        # described above unreachable -- nothing saves a cache now.
        with:
          enable-cache: false

      - name: Stamp version
        env:
          STAMP_VERSION: ${{ inputs.version }}
        # Explicit bash on both legs: sed -i.bak / rm -f are bash-isms.
        shell: bash
        run: |
          # BSD-sed-compatible -i.bak form: this step runs on macos-15 too.
          sed -i.bak "s/__version__ = \".*\"/__version__ = \"${STAMP_VERSION}\"/" src/kiro_crew/__init__.py
          rm -f src/kiro_crew/__init__.py.bak
          # Stamp the Electron app: app.getVersion() (from the bundle's
          # Info.plist, which electron-builder fills from package.json) must
          # equal the feed version for the auto-updater's compare gate.
          node -e "const fs=require('fs');const f='website/electron/package.json';const p=JSON.parse(fs.readFileSync(f));p.version=process.env.STAMP_VERSION;fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          echo "Building desktop: ${STAMP_VERSION}"

      - name: Build desktop app
        # The build script is bash. Invoked directly rather than through the
        # Makefile target, which only adds a local-dev node-bin-dir PATH
        # nicety that CI's setup-node already covers.
        shell: bash
        run: bash packaging/build-desktop.sh
        env:
          # Unsigned here by design: the signing service signs the .app downstream in
          # sign-and-notarize.yml. Local certificate discovery must stay off.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload desktop artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            website/electron/dist/*.dmg
            website/electron/dist/*.zip
            website/electron/dist/*.AppImage
            website/electron/dist/*.deb
            website/electron/dist/*.rpm
          if-no-files-found: error
          retention-days: 14

  # Install the Linux packages for real, in the distros they target.
  #
  # Everything this job checks is invisible to a unit test, because it lives in
  # metadata the package manager interprets rather than in code we run:
  # dependency names that must exist in the target distro's repositories (they
  # differ per distro, and Ubuntu 24.04's 64-bit time_t rename split several of
  # them), the .desktop entry electron-builder generates, and the maintainer
  # scripts that place the launcher symlink. A wrong name here produces a package
  # that builds green and refuses to install, which no other gate would catch.
  #
  # x64 only: the checks are about metadata and dependency resolution, neither of
  # which is arch-specific, and running arm64 containers under emulation would
  # cost far more than it proves.
  smoke-linux-packages:
    name: Smoke-install Linux packages (deb + rpm)
    needs: build-desktop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Linux x64 build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-linux-x64
          path: dist

      # x64 only: every assertion is about metadata and dependency resolution,
      # neither of which is arch-specific, and running arm64 containers under
      # emulation would cost far more than it proves.
      - name: Install the packages in their target distros
        run: ./scripts/smoke-linux-packages.sh dist
