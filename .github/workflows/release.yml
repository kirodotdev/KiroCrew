name: Release

on:
  push:
    tags: ["v*"]

# All build/sign/notarize/publish logic lives in reusable workflows shared
# with nightly.yml (build-wheel.yml, build-desktop.yml, publish-cli.yml,
# sign-and-notarize.yml). This file owns only what is genuinely
# release-specific: the tag trigger, the tag -> version/channel derivation,
# and the GitHub Release job.

# Serialize release runs: insider/stable feed writes are last-writer-wins;
# two tags pushed close together must publish in order or the channel feed
# can roll back to the older release (see nightly.yml for the full note).
concurrency:
  group: release-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Channel from the tag: pre-release tags (v1.2.3-insider.1, -rc.1, etc.)
  # release on the insider channel; bare semver tags are stable.
  version:
    name: Derive Version + Channel
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.channel.outputs.version }}
      channel: ${{ steps.channel.outputs.channel }}
      wheel_version: ${{ steps.channel.outputs.wheel_version }}
    steps:
      - name: Derive version + channel from tag
        id: channel
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in
            *-*)
              CHANNEL="insider"
              # The pip wheel needs a valid PEP 440 version; semver prerelease
              # labels ("-insider.4", "-rc.2") are not one, and setuptools
              # would silently normalize an invalid stamp down to the base
              # version -- making two insider releases collide on the same
              # immutable cli/<channel>/<version>/ key. Map any prerelease to
              # rcN using its trailing number: 1.2.3-insider.4 -> 1.2.3rc4.
              # (Corollary: do not tag both v1.2.3-insider.N and v1.2.3-rc.N
              # -- they map to the same wheel version, and publish-cli's
              # conditional write would fail the second as a republish.)
              BASE="${VERSION%%-*}"
              PRE="${VERSION#*-}"
              N="${PRE##*.}"
              case "$N" in
                ''|*[!0-9]*) N=0 ;;
              esac
              WHEEL_VERSION="${BASE}rc${N}"
              ;;
            *)
              CHANNEL="stable"
              WHEEL_VERSION="$VERSION"
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "wheel_version=$WHEEL_VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION on channel $CHANNEL (wheel: $WHEEL_VERSION)"

  build-wheel:
    name: Build Wheel
    needs: version
    uses: ./.github/workflows/build-wheel.yml
    with:
      wheel_version: ${{ needs.version.outputs.wheel_version }}

  build-desktop:
    name: Build Desktop
    needs: version
    uses: ./.github/workflows/build-desktop.yml
    with:
      version: ${{ needs.version.outputs.version }}
      # Windows is installer-only (publishes nothing): its failure must not
      # skip publish-linux / sign-and-notarize via this workflow's result.
      windows_soft_fail: true

  # ── CLI channel publish ───────────────────────────────────────────────
  # Publishes the release wheel to the insider/stable CLI channel (cli/ +
  # latest-cli.json + PEP 503 index) -- previously release wheels only
  # reached GitHub Releases, so pip/cli.sh users could never track insider
  # or stable. Depends only on the wheel and its CLI-specific KMS manifest signer
  # (not build-desktop, Apple notarization, or CDSigner), so a macOS signing
  # failure never blocks the CLI release.
  publish-cli:
    name: Publish CLI (${{ needs.version.outputs.channel }} channel)
    needs: [version, build-wheel]
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-cli.yml
    with:
      channel: ${{ needs.version.outputs.channel }}
      version: ${{ needs.version.outputs.version }}
      wheel_artifact: cli-wheel
    secrets: inherit

  # ── Linux desktop publish ─────────────────────────────────────────────
  # Publishes the release AppImage to the distribution CDN (versioned key +
  # latest alias). Its own lane beside publish-cli, deliberately NOT inside
  # sign-and-notarize.yml: the Linux artifact takes no part in the macOS
  # trust chain, and needing only build-desktop means neither a wheel nor a
  # macOS signing failure can block it (per-platform releases).
  publish-linux:
    name: Publish Linux Desktop (${{ needs.version.outputs.channel }} channel)
    needs: [version, build-desktop]
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-linux.yml
    with:
      channel: ${{ needs.version.outputs.channel }}
      version: ${{ needs.version.outputs.version }}
      publish: true
      appimage_artifact: build-linux-x64
    secrets: inherit

  # ── Docker image publish ──────────────────────────────────────────────
  # Multi-arch gateway image from the SAME wheel publish-cli ships, pushed
  # to ghcr.io with the workflow's own GITHUB_TOKEN (no AWS credentials).
  # Depends only on the wheel — a macOS signing failure never blocks the
  # image (per-platform releases). Channel alias insider|stable; stable
  # also moves :latest.
  publish-docker:
    name: Publish Docker Image (${{ needs.version.outputs.channel }} channel)
    needs: [version, build-wheel]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-docker.yml
    with:
      channel: ${{ needs.version.outputs.channel }}
      version: ${{ needs.version.outputs.version }}
      publish: true
      # The GHCR package intentionally remains private for now.
      require_public_access: false
      wheel_artifact: cli-wheel
    # No `secrets: inherit`: the lane authenticates with GITHUB_TOKEN only
    # (implicitly available to reusable workflows). Inheriting would expose
    # every repo secret (signing, CDN) to a lane documented as needing none.

  # Caller job for the reusable sign-and-notarize workflow: a workflow_call
  # callee can never exceed the caller job's permissions, so the caller must
  # grant id-token explicitly. The signing job holds AWS creds (id-token)
  # but never contents:write -- that lives only in the separate
  # github-release job below (least-privilege split enforced by
  # test_workflow_permissions.py).
  sign-and-notarize:
    name: Sign + Notarize macOS
    needs: [version, build-wheel, build-desktop]
    permissions:
      id-token: write
      contents: read
      attestations: write
    uses: ./.github/workflows/sign-and-notarize.yml
    secrets: inherit
    with:
      channel: ${{ needs.version.outputs.channel }}
      version: ${{ needs.version.outputs.version }}
      write_feed: true

  github-release:
    name: Create GitHub Release
    needs: [version, sign-and-notarize]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      # Assemble release assets: everything built, with macOS assets accepted
      # only from the exact gated artifact emitted after notarization, stapling,
      # and Gatekeeper verification. The unsigned electron-builder zip/DMG are
      # inter-job inputs only and must never become GitHub Release assets.
      - name: Assemble release assets (require gated macOS artifacts)
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name "*.whl" -o -name "*.tar.gz" -o -name "*.AppImage" \) -exec cp {} release/ \;

          NOTARIZED_DIR="artifacts/KiroCrew-notarized-${{ needs.version.outputs.channel }}-${{ needs.version.outputs.version }}"
          NOTARIZED_ZIP="${NOTARIZED_DIR}/notarized.zip"
          NOTARIZED_DMG="${NOTARIZED_DIR}/KiroCrew.dmg"
          [ -s "$NOTARIZED_ZIP" ] || {
            echo "::error::Required gated macOS ZIP is missing or empty: ${NOTARIZED_ZIP}"
            exit 1
          }
          [ -s "$NOTARIZED_DMG" ] || {
            echo "::error::Required gated macOS DMG is missing or empty: ${NOTARIZED_DMG}"
            exit 1
          }

          # Fail closed on corrupt or mis-shaped handoff files before granting
          # the GitHub Release job's contents:write capability to publish them.
          # Cryptographic Gatekeeper checks happen immediately before the
          # notarize job uploads this exact, name-bound artifact.
          python3 - "$NOTARIZED_ZIP" "$NOTARIZED_DMG" <<'PY_VALIDATE'
          from pathlib import Path, PurePosixPath
          import sys
          import zipfile

          zip_path = Path(sys.argv[1])
          dmg_path = Path(sys.argv[2])

          try:
              with zipfile.ZipFile(zip_path) as archive:
                  corrupt_member = archive.testzip()
                  names = archive.namelist()
          except (OSError, RuntimeError, zipfile.BadZipFile) as exc:
              raise SystemExit(f"::error::{zip_path} is not a valid ZIP archive: {exc}")

          if corrupt_member is not None:
              raise SystemExit(
                  f"::error::{zip_path} failed its CRC check at {corrupt_member}"
              )
          app_roots = {
              parts[0]
              for name in names
              if (parts := PurePosixPath(name).parts) and parts[0].endswith(".app")
          }
          if len(app_roots) != 1:
              raise SystemExit(
                  f"::error::{zip_path} must contain exactly one top-level .app; "
                  f"found {sorted(app_roots)}"
              )

          try:
              if dmg_path.stat().st_size < 512:
                  raise ValueError("file is smaller than the 512-byte UDIF trailer")
              with dmg_path.open("rb") as dmg:
                  dmg.seek(-512, 2)
                  signature = dmg.read(4)
              if signature != b"koly":
                  raise ValueError("UDIF trailer signature is missing")
          except (OSError, ValueError) as exc:
              raise SystemExit(f"::error::{dmg_path} is not a valid UDIF DMG: {exc}")
          PY_VALIDATE

          cp "$NOTARIZED_ZIP" "release/KiroCrew-${{ needs.version.outputs.version }}-universal-mac.zip"
          cp "$NOTARIZED_DMG" "release/KiroCrew-${{ needs.version.outputs.version }}-universal.dmg"
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.channel == 'insider' }}
          files: release/*
