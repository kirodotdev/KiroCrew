name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-wheel:
    name: Build Wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build frontend
        working-directory: website
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Stage frontend
        run: |
          rm -rf src/kiro_crew/static/dist
          mkdir -p src/kiro_crew/static
          cp -R website/dist src/kiro_crew/static/dist

      - name: Build wheel + sdist
        run: |
          pip install --upgrade build
          python -m build

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*

  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact-name: KiroCrew-macOS-arm64
          - os: ubuntu-22.04
            artifact-name: KiroCrew-Linux-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build desktop app (PBS + uv venv)
        run: make desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            website/electron/dist/*.dmg
            website/electron/dist/*.zip
            website/electron/dist/*.AppImage
          if-no-files-found: warn

  release:
    name: Create Release
    needs: [build-wheel, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      HAS_SIGNING_SECRETS: ${{ secrets.AWS_SIGNING_ROLE_ARN != '' && 'true' || '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.whl" -o -name "*.tar.gz" -o -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" \) -exec cp {} release/ \;
          ls -la release/

      - name: Configure AWS credentials
        if: env.HAS_SIGNING_SECRETS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
          aws-region: us-west-2

      - name: Upload unsigned DMG to S3 for signing
        if: env.HAS_SIGNING_SECRETS
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for f in release/*.dmg release/*.zip; do
            [ -f "$f" ] || continue
            echo "Uploading $f → s3://${{ secrets.AWS_SIGNING_BUCKET }}/pre-signed/${VERSION}/$(basename $f)"
            aws s3 cp "$f" "s3://${{ secrets.AWS_SIGNING_BUCKET }}/pre-signed/${VERSION}/$(basename $f)"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
