name: Deploy Site (GitHub Pages)

# Publishes the public marketing site in site/ to GitHub Pages.
# Path-scoped to site/** so it never runs for backend (kirocrew-client-py)
# or dashboard (website/) changes — and those workflows never run for site-only PRs.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Least privilege at the workflow level: only checkout. The build job runs npm
# (untrusted lifecycle scripts) and must NOT hold Pages/OIDC tokens — only the
# deploy job elevates to what it needs.
permissions:
  contents: read

concurrency:
  group: pages
  # Every run of this workflow is a production deploy: the triggers are a push
  # to main and workflow_dispatch, and both reach `deploy`. So a newer run
  # queues behind the one in flight rather than killing it mid-deploy, which is
  # what `true` did. No condition, unlike ci.yml and build.yml: there is no
  # pull_request trigger here, so `github.event_name == 'pull_request'` would
  # be a constant false and read as a live rule to anyone who added one.
  cancel-in-progress: false

jobs:
  build:
    # Admitted pushes and dispatches use the fleet. Anything else in THIS
    # repository takes the `kirocrew-runners` group rather than the shared
    # standard pool, whose concurrency is shared enterprise-wide; a fork
    # publishing its own Pages cannot reach an organization group and stays on
    # the hosted image. `deploy` below routes the same way.
    runs-on: ${{ github.repository == 'kirodotdev/KiroCrew' && contains(fromJSON(vars.CODEBUILD_ACTOR_IDS || '[]'), github.actor_id) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && format('codebuild-kirocrew-gha-linux-{0}-{1}', github.run_id, github.run_attempt) || github.repository == 'kirodotdev/KiroCrew' && 'kirocrew-linux-4-core' || 'ubuntu-latest' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ${{ github.repository == 'kirodotdev/KiroCrew' && contains(fromJSON(vars.CODEBUILD_ACTOR_IDS || '[]'), github.actor_id) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && format('codebuild-kirocrew-gha-linux-{0}-{1}', github.run_id, github.run_attempt) || github.repository == 'kirodotdev/KiroCrew' && 'kirocrew-linux-4-core' || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
