name: Deploy Site (GitHub Pages)

# Publishes the public marketing site in site/ to GitHub Pages.
# Path-scoped to site/** so it never runs for backend (kirocrew-client-py)
# or dashboard (website/) changes — and those workflows never run for site-only PRs.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Least privilege at the workflow level: only checkout. The build job runs npm
# (untrusted lifecycle scripts) and must NOT hold Pages/OIDC tokens — only the
# deploy job elevates to what it needs.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
