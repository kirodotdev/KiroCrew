name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PRs cancel superseded revisions: only a PR's tip commit needs a verdict.
  # main does not, so let an in-flight run finish instead of killing it.
  # This does NOT produce a verdict per commit. The group still permits one
  # pending run, and GitHub evicts that pending run when a newer one queues
  # (a documented GitHub concurrency behavior). With a ~19min run and a
  # ~1.4min median merge gap, main gets periodic verdicts instead of none.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-wheel:
    name: Build Wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build frontend
        working-directory: website
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Stage frontend into package
        run: |
          rm -rf src/kiro_crew/static/dist
          mkdir -p src/kiro_crew/static
          cp -R website/dist src/kiro_crew/static/dist

      # Build the sdist too, not just the wheel: `--wheel` alone reads
      # package_data and never evaluates MANIFEST.in, so a MANIFEST regression
      # that strips the vendored native libs is INVISIBLE to a wheel-only build
      # here. The release lane builds the published wheel FROM the sdist, so
      # that regression would first surface at tag push — after it reached main.
      - name: Build wheel + sdist
        run: |
          pip install --upgrade build
          python -m build

      - name: Verify wheel installs cleanly
        run: |
          pip install dist/*.whl
          kirocrew --version

      # The PR-time vendored-lib gate. Without it the only such gate on a PR is
      # the pytest guard, which MODELS MANIFEST.in rather than executing it — so
      # this is what proves the real artifacts. Shared with build-wheel.yml so
      # the two lanes cannot drift; a gate that diverges stops guarding without
      # ever failing.
      - name: Verify vendored native libs survived into the wheel + sdist
        run: python scripts/verify_vendored_payload.py

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel
          path: dist/*.whl

  # Compile the actual x64 NSIS installer on Windows. POSIX makensis accepts
  # source-path forms that fail on Windows, so static tests and cross-compilation
  # cannot substitute for this native gate.
  build-windows-installer:
    name: Build Windows Installer (x64)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/electron/package-lock.json

      - name: Install Electron packaging dependencies
        working-directory: website/electron
        run: npm ci --no-audit --no-fund

      - name: Create minimal backend payload
        shell: pwsh
        working-directory: website/electron
        run: |
          New-Item -ItemType Directory -Force backend-dist/kirocrew-backend/bin | Out-Null
          @('@echo off', 'exit /b 0') | Set-Content -Encoding ascii backend-dist/kirocrew-backend/bin/kirocrew.cmd

      - name: Compile unsigned x64 NSIS installer
        working-directory: website/electron
        run: npx --no-install electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Capture live light and dark installer windows
        shell: pwsh
        working-directory: website/electron
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName UIAutomationClient
          $referenceAssemblies = @(
            [System.AppContext]::GetData('TRUSTED_PLATFORM_ASSEMBLIES') -split [IO.Path]::PathSeparator
            [System.Drawing.Bitmap].Assembly.Location
            [System.Drawing.Size].Assembly.Location
          ) | Select-Object -Unique
          Add-Type -ReferencedAssemblies $referenceAssemblies -TypeDefinition @'
          using System;
          using System.Drawing;
          using System.Drawing.Imaging;
          using System.IO;
          using System.Runtime.InteropServices;
          using System.Threading.Tasks;
          public static class KiroInstallerCapture {
            [StructLayout(LayoutKind.Sequential)]
            public struct Rect { public int Left, Top, Right, Bottom; }
            [DllImport("user32.dll")]
            public static extern bool GetWindowRect(IntPtr handle, out Rect rect);
            [DllImport("user32.dll", SetLastError = true)]
            public static extern bool PostMessage(
              IntPtr handle,
              uint message,
              IntPtr word,
              IntPtr data
            );
            [DllImport("user32.dll")]
            public static extern bool IsWindowVisible(IntPtr handle);
            [DllImport("user32.dll")]
            public static extern IntPtr GetDlgItem(IntPtr dialog, int identifier);
            [DllImport("user32.dll", SetLastError = true)]
            public static extern bool SystemParametersInfo(
              uint action,
              uint parameter,
              ref int value,
              uint update
            );
            [DllImport("kernel32.dll")]
            public static extern void Sleep(uint milliseconds);
            public static bool IsBrandedSurface(Bitmap bitmap) {
              int purpleSamples = 0;
              int[,] samples = {
                { bitmap.Width / 2, bitmap.Height / 3 },
                { bitmap.Width / 8, bitmap.Height / 2 },
                { bitmap.Width * 7 / 8, bitmap.Height / 2 }
              };
              for (int sample = 0; sample < samples.GetLength(0); sample++) {
                Color color = bitmap.GetPixel(samples[sample, 0], samples[sample, 1]);
                if (color.B > color.R + 24 && color.R > color.G + 24) {
                  purpleSamples++;
                }
              }
              return purpleSamples >= 2;
            }
            public static Task CaptureProgressBurst(
              IntPtr handle,
              IntPtr progressReadyControl,
              string directory
            ) {
              return Task.Run(() => {
                bool progressReady = false;
                for (int probe = 0; probe < 100; probe++) {
                  if (IsWindowVisible(progressReadyControl)) {
                    progressReady = true;
                    break;
                  }
                  Sleep(80);
                }
                if (!progressReady) {
                  throw new InvalidOperationException("Progress page never became ready for burst capture");
                }
                Bitmap readyFrame = null;
                for (int probe = 0; probe < 150; probe++) {
                  Rect rect;
                  if (!GetWindowRect(handle, out rect)) {
                    throw new InvalidOperationException("Could not read installer bounds during burst capture");
                  }
                  int width = rect.Right - rect.Left;
                  int height = rect.Bottom - rect.Top;
                  Bitmap bitmap = new Bitmap(width, height);
                  using (Graphics graphics = Graphics.FromImage(bitmap)) {
                    graphics.CopyFromScreen(rect.Left, rect.Top, 0, 0, bitmap.Size);
                  }
                  if (IsBrandedSurface(bitmap)) {
                    readyFrame = bitmap;
                    break;
                  }
                  bitmap.Dispose();
                  Sleep(40);
                }
                if (readyFrame == null) {
                  throw new InvalidOperationException("Kiro progress surface never became visible");
                }
                // Keep the entire burst in memory. Encoding a full-window PNG
                // here can consume most of the 600 ms native entrance and make
                // the evidence sampler observe only the settled frame.
                Bitmap[] frames = new Bitmap[16];
                frames[0] = readyFrame;
                try {
                  for (int frame = 1; frame < frames.Length; frame++) {
                    Sleep(40);
                    Rect rect;
                    if (!GetWindowRect(handle, out rect)) {
                      throw new InvalidOperationException("Could not read installer bounds during burst capture");
                    }
                    int width = rect.Right - rect.Left;
                    int height = rect.Bottom - rect.Top;
                    Bitmap bitmap = new Bitmap(width, height);
                    using (Graphics graphics = Graphics.FromImage(bitmap)) {
                      graphics.CopyFromScreen(rect.Left, rect.Top, 0, 0, bitmap.Size);
                    }
                    if (!IsBrandedSurface(bitmap)) {
                      bitmap.Dispose();
                      throw new InvalidOperationException(
                        "A progress frame lost the branded whole-scene surface"
                      );
                    }
                    frames[frame] = bitmap;
                  }
                  for (int frame = 0; frame < frames.Length; frame++) {
                    string name = string.Format("progress-frame-{0:D3}.png", frame);
                    frames[frame].Save(Path.Combine(directory, name), ImageFormat.Png);
                  }
                } finally {
                  foreach (Bitmap frame in frames) {
                    if (frame != null) frame.Dispose();
                  }
                }
              });
            }
          }
          '@
          function Save-KiroInstallerWindow {
            param([IntPtr]$Handle, [string]$Path)
            $rect = New-Object KiroInstallerCapture+Rect
            if (-not [KiroInstallerCapture]::GetWindowRect($Handle, [ref]$rect)) {
              throw "Could not read installer bounds for $Path"
            }
            $width = $rect.Right - $rect.Left
            $height = $rect.Bottom - $rect.Top
            $bitmap = New-Object System.Drawing.Bitmap $width, $height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            try {
              $graphics.CopyFromScreen($rect.Left, $rect.Top, 0, 0, $bitmap.Size)
              $bitmap.Save($Path)
            } finally {
              $graphics.Dispose()
              $bitmap.Dispose()
            }
          }
          $themeKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          New-Item -ItemType Directory -Force runtime-evidence | Out-Null
          New-Item -Path $themeKey -Force | Out-Null
          $animationsEnabled = 1
          if (-not [KiroInstallerCapture]::SystemParametersInfo(
            0x1043,
            0,
            [ref]$animationsEnabled,
            0
          )) {
            throw 'Could not enable client-area animation for runtime verification'
          }
          $verifiedAnimationsEnabled = 0
          if (-not [KiroInstallerCapture]::SystemParametersInfo(
            0x1042,
            0,
            [ref]$verifiedAnimationsEnabled,
            0
          ) -or $verifiedAnimationsEnabled -eq 0) {
            throw 'Client-area animation did not remain enabled for runtime verification'
          }
          $installer = Get-ChildItem dist -Filter '*Setup*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Compiled installer not found' }
          # A file can never own an extracted app directory. Exercise the real
          # silent entry point so /D validation cannot regress behind UI-only
          # checks or a source-pattern assertion.
          $blockedDestination = Join-Path (Resolve-Path runtime-evidence).Path 'blocked-parent'
          Set-Content -Path $blockedDestination -Value 'not a directory'
          $blockedProcess = Start-Process -FilePath $installer.FullName -ArgumentList @(
            '/S',
            "/D=$blockedDestination"
          ) -PassThru -Wait
          if ($blockedProcess.ExitCode -ne 2) {
            throw "Existing-file /D destination returned $($blockedProcess.ExitCode), expected 2"
          }
          foreach ($theme in @(@{ Name = 'light'; Value = 1 }, @{ Name = 'dark'; Value = 0 })) {
            Set-ItemProperty -Path $themeKey -Name AppsUseLightTheme -Type DWord -Value $theme.Value
            $process = Start-Process -FilePath $installer.FullName -PassThru
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              Start-Sleep -Milliseconds 250
              $process.Refresh()
              if ($process.MainWindowHandle -ne 0) { break }
              if ($process.HasExited) { throw "Installer exited before showing the $($theme.Name) window" }
            }
            if ($process.MainWindowHandle -eq 0) { throw "$($theme.Name) installer window did not appear" }
            Start-Sleep -Milliseconds 1200
            Save-KiroInstallerWindow $process.MainWindowHandle "runtime-evidence/$($theme.Name)-options.png"
            if ($theme.Name -eq 'dark') {
              $root = [System.Windows.Automation.AutomationElement]::FromHandle($process.MainWindowHandle)
              $buttonCondition = [System.Windows.Automation.PropertyCondition]::new(
                [System.Windows.Automation.AutomationElement]::NameProperty,
                'Install Kiro Crew'
              )
              $installButton = $root.FindFirst(
                [System.Windows.Automation.TreeScope]::Descendants,
                $buttonCondition
              )
              if (-not $installButton) { throw 'Could not find the live Install Kiro Crew button' }
              $installHandle = [IntPtr]$installButton.Current.NativeWindowHandle
              if ($installHandle -eq [IntPtr]::Zero) {
                throw 'The live Install Kiro Crew button has no native window handle'
              }
              $progressReadyHandle = [KiroInstallerCapture]::GetDlgItem(
                $process.MainWindowHandle,
                2
              )
              if ($progressReadyHandle -eq [IntPtr]::Zero) {
                throw 'The installer has no native progress-page readiness control'
              }
              $evidenceDirectory = (Resolve-Path runtime-evidence).Path
              $progressCapture = [KiroInstallerCapture]::CaptureProgressBurst(
                $process.MainWindowHandle,
                $progressReadyHandle,
                $evidenceDirectory
              )
              Start-Sleep -Milliseconds 100
              if (-not [KiroInstallerCapture]::PostMessage(
                $installHandle,
                0x00F5,
                [IntPtr]::Zero,
                [IntPtr]::Zero
              )) {
                throw 'Could not activate the live Install Kiro Crew button'
              }
              $progressCapture.Wait()
              $process.Refresh()
              if ($process.HasExited) { throw 'Installer exited before the progress page was validated' }
              $burstFrames = Get-ChildItem runtime-evidence -Filter 'progress-frame-*.png' |
                Sort-Object Name
              if ($burstFrames.Count -ne 16) { throw 'The progress-page burst capture is incomplete' }
              Copy-Item -Path ($burstFrames[-1].FullName) -Destination 'runtime-evidence/dark-progress.png' -Force
              $sceneChanged = $false
              # Frame zero can straddle the page handoff. Compare only the
              # following early native-progress frames across the artwork band;
              # extraction is blocked behind the opening animation here.
              for ($frame = 2; $frame -lt $burstFrames.Count -and -not $sceneChanged; $frame++) {
                $firstFrame = [System.Drawing.Bitmap]::FromFile($burstFrames[$frame - 1].FullName)
                $nextFrame = [System.Drawing.Bitmap]::FromFile($burstFrames[$frame].FullName)
                try {
                  $right = $firstFrame.Width
                  $bottom = [Math]::Ceiling($firstFrame.Height * 0.6)
                  for ($y = 0; $y -lt $bottom -and -not $sceneChanged; $y += 4) {
                    for ($x = 0; $x -lt $right; $x += 4) {
                      if ($firstFrame.GetPixel($x, $y).ToArgb() -ne $nextFrame.GetPixel($x, $y).ToArgb()) {
                        $sceneChanged = $true
                        break
                      }
                    }
                  }
                } finally {
                  $firstFrame.Dispose()
                  $nextFrame.Dispose()
                }
              }
              if (-not $sceneChanged) { throw 'The native progress-page scene did not animate' }
              if (-not [KiroInstallerCapture]::IsWindowVisible($progressReadyHandle)) {
                throw 'The native progress-page Exit button disappeared before validation'
              }
            }
            # Evidence capture must not depend on the localized modal NSIS
            # confirmation shown by a mid-extraction Cancel. The visible Exit
            # control was validated above; terminate this throwaway test run
            # deterministically after all frames are safely encoded.
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
          }

      - name: Upload live Windows installer screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer-runtime-evidence
          path: website/electron/runtime-evidence/*.png

  # Resolve which desktop platforms a PR builds. Linux (both arches) ALWAYS
  # builds -- it is comparatively cheap and catches cross-platform bundle
  # breakage, and cannot be cross-compiled. The macos-15 leg bills at ~10x and
  # its UNIQUE coverage is macOS packaging (DMG, universal/Rosetta, mac
  # electron-builder), so on a pull_request it builds only when a macOS-
  # packaging input changed; push / release events always build it. The release
  # lane (build-desktop.yml) still ships every platform unconditionally.
  desktop-matrix:
    name: Resolve desktop matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      os: ${{ steps.compute.outputs.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            desktop:
              - 'website/electron/**'
              - 'website/package.json'
              - 'website/package-lock.json'
              - 'build-desktop.sh'
              - 'Makefile'
              - 'pyproject.toml'
              - 'setup.cfg'
              - '.github/workflows/build.yml'
              - '.github/workflows/build-desktop.yml'
      - id: compute
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          DESKTOP_CHANGED: ${{ steps.filter.outputs.desktop }}
        run: |
          # Linux legs are unconditional; macos-15 only when a packaging-relevant
          # path changed on a PR (always on push / non-PR events).
          if [ "$IS_PR" != "true" ] || [ "$DESKTOP_CHANGED" = "true" ]; then
            echo 'os=["macos-15","ubuntu-22.04","ubuntu-22.04-arm"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-22.04","ubuntu-22.04-arm"]' >> "$GITHUB_OUTPUT"
          fi

  build-desktop:
    needs: [desktop-matrix]
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # macOS bills at 10x, so an unbounded hang here is the costliest in the repo.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Resolved by the desktop-matrix job: both Linux arches always (Linux
        # cannot be cross-compiled -- build-desktop.sh RUNS the interpreter it
        # provisions -- so each arch needs its own runner), plus macos-15 when a
        # macOS-packaging input changed or on any non-PR event. build-desktop.yml
        # stays the release matrix that ships every platform unconditionally.
        os: ${{ fromJSON(needs.desktop-matrix.outputs.os) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Build desktop app (PBS + uv venv)
        run: make desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload desktop artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-macos-arm64
          path: |
            website/electron/dist/*.dmg
            website/electron/dist/*.zip
          if-no-files-found: warn

      - name: Upload desktop artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Arch in the name: both Linux legs match `runner.os == 'Linux'`, and a
          # shared artifact name makes the two uploads collide.
          name: desktop-linux-${{ runner.arch }}
          path: website/electron/dist/*.AppImage
          if-no-files-found: warn
