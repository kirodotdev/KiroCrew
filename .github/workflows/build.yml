name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wheel:
    name: Build Wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build frontend
        working-directory: website
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Stage frontend into package
        run: |
          rm -rf src/kiro_crew/static/dist
          mkdir -p src/kiro_crew/static
          cp -R website/dist src/kiro_crew/static/dist

      - name: Build wheel
        run: |
          pip install --upgrade build
          python -m build --wheel

      - name: Verify wheel installs cleanly
        run: |
          pip install dist/*.whl
          kirocrew --version

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build desktop app (PBS + uv venv)
        run: make desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload desktop artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-arm64
          path: |
            website/electron/dist/*.dmg
            website/electron/dist/*.zip
          if-no-files-found: warn

      - name: Upload desktop artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-x64
          path: website/electron/dist/*.AppImage
          if-no-files-found: warn
