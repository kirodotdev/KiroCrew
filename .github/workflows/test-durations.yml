name: Update Test Durations

# Keeps .test_durations fresh so pytest-split's shards in ci.yml stay balanced
# by *recorded runtime*. Brand-new tests are auto-assigned the average duration
# by pytest-split, so sharding degrades gracefully between refreshes -- this job
# just re-measures periodically and opens a PR with the updated file.
#
# Runs the FULL suite once (no --splits) with --store-durations. main is a
# protected branch, so instead of committing directly it pushes a feature
# branch and opens/updates a PR for review.

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: test-durations
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh .test_durations
    runs-on: ubuntu-latest
    # runs the WHOLE suite unsharded to record per-test durations.
    timeout-minutes: 90
    steps:
      # persist-credentials retained: refresh / "Open PR if durations changed" runs git push --force origin
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            setup.cfg

      - name: Install dependencies
        run: uv pip install --system -e ".[voice,desktop]" --group dev

      - name: Measure test durations
        # Full suite, no coverage (tracing would skew timings), no splits.
        # --store-durations writes/updates .test_durations. `|| true` keeps a
        # flaky failure from aborting the refresh -- durations for tests that
        # ran are still recorded.
        #
        # Nothing is deselected. Two sandbox suites used to be, which meant the file
        # this job produces carried no durations for them -- so pytest-split gave them
        # the AVERAGE duration and balanced the shards on a guess. They record real
        # durations now; the tests inside them that need a namespace sandbox skip here
        # (this runner has none) and a skip is measured as the near-zero it is.
        run: |
          # Same as ci.yml's pytest jobs (#7296): the `python` problem matcher
          # actions/setup-python registers annotates any traceback in the log,
          # including one printed inside a pytest warning, and never matches a
          # pytest failure. conftest.py emits the real annotations instead.
          echo "::remove-matcher owner=python::"
          pytest -q -n auto --timeout=120 --no-cov --store-durations || true
          test -f .test_durations || { echo "::error::no .test_durations produced"; exit 1; }

      - name: Open PR if durations changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Stage first so a brand-new (untracked) .test_durations is detected.
          # `git diff` alone ignores untracked files, so on the first-ever run
          # the bootstrap file would look like "no changes" and never get
          # committed. Staging + `--cached` detects both new and changed files.
          git add .test_durations
          if git diff --cached --quiet -- .test_durations; then
            echo "No duration changes; nothing to do."
            exit 0
          fi
          BRANCH=chore/update-test-durations
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "chore(test): refresh .test_durations for balanced sharding"
          git push --force origin "$BRANCH"
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "PR already open for $BRANCH; updated in place."
          else
            # `gh pr create` with GITHUB_TOKEN is refused outright when the
            # repository has "Allow GitHub Actions to create and approve pull
            # requests" turned OFF -- GitHub answers
            #   GraphQL: GitHub Actions is not permitted to create or approve
            #   pull requests (createPullRequest)
            # This repository leaves it off deliberately: the same single switch
            # also grants APPROVING, and main's merge gate is a required human
            # review. It only bites on the create path, reached once the previous
            # rolling PR merged and its branch was deleted; while that PR is open
            # the push above is enough, which is why some runs got further.
            #
            # The push already succeeded, so nothing is lost -- only the last,
            # cosmetic step is unavailable. Hand the branch to a human with a
            # one-click compare link and keep the run green. Failing here was the
            # old behaviour and it went unnoticed for weeks; a scheduled run that
            # is red every time and that nobody can act on trains maintainers to
            # ignore the signal. Any OTHER create failure is a real error and
            # must still fail loud. Same remedy as add-contributor.yml.
            rc=0
            out="$(gh pr create --base main --head "$BRANCH" \
              --title "chore(test): refresh .test_durations" \
              --body "Automated refresh of \`.test_durations\` so pytest-split shards in ci.yml stay balanced by recorded runtime. Generated by the Update Test Durations workflow." 2>&1)" || rc=$?
            printf '%s\n' "$out"
            if [ "$rc" -ne 0 ]; then
              case "$out" in
                *"not permitted to create or approve pull requests"*)
                  compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1"
                  echo "::notice::Branch $BRANCH is pushed and ready, but GitHub Actions may not open pull requests in this repository. Open it here: $compare"
                  exit 0
                  ;;
                *)
                  exit "$rc"
                  ;;
              esac
            fi
          fi
