name: PR Hygiene

# PR Hygiene judges the PR's title and body, so it runs in a workflow of its own
# that hears `edited`: an author clears a red title or description by editing
# it, and the edit re-judges it. code-review.yml skips `edited`; readiness holds
# a retarget through the base its run records: docs/ci/ci-and-reviews.md,
# "code-review.yml: the deterministic pre-gate".
#
# A PR Readiness lane (`pr-hygiene.yml|PR Hygiene` in pr-readiness.yml): a red
# here reds the PR.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: pr-hygiene-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ── PR Hygiene ───────────────────────────────────────────────────────
  # Enforces: (1) conventional commit message format on PR title,
  # (2) at most two commits per PR (squash review-round noise before merge).
  #
  # Every step assembles its `::error::` prefix at runtime through `err()` rather
  # than writing it literally. Actions echoes each `run:` block's source into the
  # log whether the branch executes or not, so a literal annotation string is
  # printed by PASSING runs too, where it reads as a second, real failure. The
  # annotation a failing run emits is identical either way; only the inert source
  # line stops impersonating one.
  pr-hygiene:
    name: PR Hygiene
    runs-on: ${{ github.repository == 'kirodotdev/KiroCrew' && contains(fromJSON(vars.CODEBUILD_ACTOR_IDS || '[]'), github.actor_id) && (github.event_name == 'push' || (github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize') && github.event.pull_request.head.repo.full_name == github.repository)) && format('codebuild-kirocrew-gha-linux-{0}-{1}', github.run_id, github.run_attempt) || github.repository == 'kirodotdev/KiroCrew' && 'kirocrew-linux-4-core' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      # The merge commit and its two parents. The diff-base step fetches the
      # rest this job reads: see .github/scripts/code-review-history.sh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # First, because the commit count reads history and the Proof line and
      # Sibling sweep steps read the base tip's tree.
      - name: Resolve diff base (merge-base)
        id: diffbase
        env:
          BASE_TIP: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/code-review-history.sh

      # ── Conventional commit format on PR title ──────────────────────
      # PR title becomes the squash-merge commit message, so it must
      # follow conventional commits: type(scope): description
      # Types: feat, fix, docs, style, refactor, perf, test, chore, ci
      - name: Validate PR title (conventional commits)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          err() { printf '::%s::%s\n' error "$*"; }
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|chore|ci|build|revert)(\([a-z0-9_-]+\))?!?: .+'
          if ! echo "$PR_TITLE" | grep -qE "$PATTERN"; then
            err "PR title must follow conventional commits format."
            echo ""
            echo "  Expected: type(scope): description"
            echo "  Examples:"
            echo "    feat(auth): add OAuth2 PKCE flow"
            echo "    fix: resolve race condition in session cleanup"
            echo "    ci: add Semgrep SAST scanning"
            echo ""
            echo "  Valid types: feat, fix, docs, style, refactor, perf, test, chore, ci, build, revert"
            echo ""
            echo "  Got: $PR_TITLE"
            exit 1
          fi
          echo "PR title follows conventional commits: $PR_TITLE"

      # ── Commit count per PR ─────────────────────────────────────────
      # Contributors may carry at most two commits. One remains the norm;
      # the second exists so a mechanical follow-up (a generated artifact
      # rebuild, a formatting sweep) can stay separable from the change it
      # accompanies instead of being squashed into it. Anything beyond that
      # is review-round noise and must be squashed before pushing.
      - name: Enforce commit count
        env:
          # base.sha (not the merge-base): rev-list is a commit-range query, so
          # a non-ancestor base still yields only the PR's own commits — see the
          # merge-base fix (#4968), which deliberately left this site alone.
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          # The branch NAME, for the remedy text. Spelling `origin/main` literally
          # is the wrong command for a PR opened against any other base, and sends
          # the contributor to rebase onto a branch they are not targeting.
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          MAX_COMMITS: "2"
        run: |
          err() { printf '::%s::%s\n' error "$*"; }
          COMMIT_COUNT=$(git rev-list --count "$BASE".."$HEAD")
          if [ "$COMMIT_COUNT" -lt 1 ] || [ "$COMMIT_COUNT" -gt "$MAX_COMMITS" ]; then
            err "PR must contain 1 or $MAX_COMMITS commits (has $COMMIT_COUNT). Rebase, do not merge:"
            echo ""
            echo "  Do NOT plain-click 'Update branch' on this page, and do not merge"
            echo "  $BASE_REF into your branch. Both add a merge commit, which counts"
            echo "  here and will re-trip this check. The button's dropdown carries an"
            echo "  'Update with rebase' option that is safe; its default click is not."
            echo ""
            echo "  git fetch origin"
            echo "  git rebase refs/remotes/origin/$BASE_REF"
            echo "  Then squash your own commits (never a soft reset plus a commit,"
            echo "  which takes whatever the index holds):"
            echo "    git rebase -i refs/remotes/origin/$BASE_REF, marking later commits 'fixup'."
            echo "  Or, with the kirocrew-prepare-pr skill, write the message to a file, then"
            echo "    python3 <kirocrew-prepare-pr skill dir>/scripts/push_guard.py --base $BASE_REF --max-ahead $COMMIT_COUNT --squash <that file>"
            echo "    (without a file it reads <git-dir>/prepare-pr-commit-msg-<branch>.txt, / as -)."
            echo "    For commits made by hand it refuses first: it counts and lists the paths"
            echo "    it did not commit, and writes them to a list file. Read each one's diff."
            echo "    Only when every one is your own change, re-run that command with"
            echo "    --paths-from-file <that list>. A count beyond what your PR changes"
            echo "    means a stale tree: name none of them."
            echo "  git push --force-with-lease=<branch>:<sha you last pushed> origin <branch>"
            echo ""
            exit 1
          fi
          echo "Commit count verified ($COMMIT_COUNT of at most $MAX_COMMITS)."

      # ── Frozen goal sections ────────────────────────────────────────
      # Every PR states its goal once, at open: a `**Goal:**` line under
      # Problem / Motivation, plus Why it matters and Not a goal. The rules
      # live in one script shared with fork-pr-description.yml, so fork and
      # same-repo PRs are held to the same list. Dependabot writes its own
      # body and has no goal to freeze.
      - name: Require the PR template sections
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          err() { printf '::%s::%s\n' error "$*"; }
          out="$(mktemp)"
          PR_DRAFT=false PR_CALLER=pr-hygiene GITHUB_OUTPUT="$out" bash .github/scripts/pr-description-check.sh
          if grep -qx 'conclusion=failure' "$out"; then
            # The annotation names the missing parts AND the fix, because it
            # is the line a coding agent reads first; the full steps go to the
            # log and the job summary page.
            err "$(sed -n 's/^annotation=//p' "$out")"
            sed -n '/^summary<<__FORK_PR_DESCRIPTION__$/,/^__FORK_PR_DESCRIPTION__$/p' "$out" | sed '1d;$d' \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "PR template sections present."

      # ── Pattern harvest on fix PRs ──────────────────────────────────
      # Every fix is a chance to retire its whole defect class. Fix/revert
      # PRs must carry a "Pattern harvest" section stating either a rule
      # candidate (semgrep / lint / review-prompt / agents-md) or why the
      # defect is a one-off. Presence-only: content is judged by reviewers,
      # never by this gate. Feature/docs/chore PRs are exempt.
      - name: Require Pattern harvest section on fix PRs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          err() { printf '::%s::%s\n' error "$*"; }
          if ! echo "$PR_TITLE" | grep -qiE '^(fix|revert)([(!:]|$)'; then
            echo "Not a fix/revert PR; Pattern harvest section not required."
            exit 0
          fi
          if ! printf '%s' "$PR_BODY" | grep -qiE '^##+ *Pattern harvest'; then
            err "Fix/revert PRs must carry a '## Pattern harvest' section."
            echo ""
            echo "  State either a rule candidate or why the defect is a one-off:"
            echo ""
            echo "    ## Pattern harvest"
            echo "    Rule candidate: semgrep"
            echo "    Pattern: sentinel return value used in boolean context"
            echo ""
            echo "  or:"
            echo ""
            echo "    ## Pattern harvest"
            echo "    Not generalizable: typo in a single format string"
            echo ""
            exit 1
          fi
          if ! printf '%s' "$PR_BODY" | grep -qiE '^ *(Rule candidate|Not generalizable) *:'; then
            err "The Pattern harvest section must contain a 'Rule candidate:' or 'Not generalizable:' line."
            exit 1
          fi
          echo "Pattern harvest section present."

      # ── Proof line on fix PRs ───────────────────────────────────────
      # A test that still passes with the fix reverted does not test the fix.
      # "fix:" PRs state, in ONE line under "## Tests", whether their tests fail
      # without the fix (format: proof_line_check.py). Presence, place and shape
      # only; a hand-typed PROVEN line passes here, and only the local
      # diff_signals.py --check-body comparison with prove.py's record catches
      # it. The script is read from the base ref so a branch cannot weaken its
      # own check. The checkout copy runs only while the base tip has no such
      # file; any read that fails fails the step under the runner's `bash -e`,
      # since the diff-base step made the base tip's files local. WARN
      # mode: findings annotate and exit 0 until ENFORCE_FROM in the script
      # names a date.
      - name: Require a Proof line inside ## Tests on fix PRs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
          BASE_TIP: ${{ github.event.pull_request.base.sha }}
        run: |
          script="$(mktemp)"
          listed="$(git ls-tree --name-only "$BASE_TIP" -- .github/scripts/proof_line_check.py)"
          if [ -n "$listed" ]; then
            git show "$BASE_TIP:.github/scripts/proof_line_check.py" > "$script"
          else
            cp .github/scripts/proof_line_check.py "$script"
          fi
          python3 "$script"

      # ── Reader list on take-away diffs ──────────────────────────────
      # A diff that hides, deletes, tightens or migrates something must list
      # every reader of it under "## Backwards compatibility" as `Reader:`
      # lines (#13273 and #12798 both passed CI and broke readers nobody
      # listed). Detection and format live in the script; presence/format
      # only, the content is the reviewers' job. See
      # docs/system-specs/common/take-away-changes.md.
      - name: Require a reader list on take-away diffs
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          MERGE_BASE: ${{ steps.diffbase.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          diff_file="$(mktemp)"
          git diff "$MERGE_BASE" "$HEAD_SHA" > "$diff_file"
          python3 .github/scripts/take_away_check.py "$diff_file"

      # ── App-repo commit for an adopted app's wheel copy ─────────────
      # An app pinned in adoption-pins.json runs from its own repository on
      # an adopted host, so a change made only to its wheel copy never
      # reaches that user. Such a change names its app-repo commit or PR as
      # an `App repo:` line (format and exemptions: the script). Pins are
      # read at the merge base, the base tip and the head: the head so a PR
      # cannot drop its own pin to pass, the base tip so a branch cut before
      # a pin landed is still held to it. The script is read from the base
      # ref so a branch cannot weaken its own check; the checkout copy runs
      # only while the base tip has no such file.
      - name: Require an app-repo commit for an adopted app's wheel copy
        env:
          MERGE_BASE: ${{ steps.diffbase.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_TIP: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          script="$(mktemp)"
          listed="$(git ls-tree --name-only "$BASE_TIP" -- .github/scripts/adopted_wheel_copy_check.py)"
          if [ -n "$listed" ]; then
            git show "$BASE_TIP:.github/scripts/adopted_wheel_copy_check.py" > "$script"
          else
            cp .github/scripts/adopted_wheel_copy_check.py "$script"
          fi
          pins_path=src/kiro_crew/apps/adoption-pins.json
          changes="$(mktemp)"
          git diff --name-status --no-renames "$MERGE_BASE" "$HEAD_SHA" > "$changes"
          pin_files=()
          for rev in "$MERGE_BASE" "$BASE_TIP" "$HEAD_SHA"; do
            pins="$(mktemp)"
            if [ -n "$(git ls-tree --name-only "$rev" -- "$pins_path")" ]; then
              git show "$rev:$pins_path" > "$pins"
            fi
            pin_files+=("$pins")
          done
          python3 "$script" "$changes" ${pin_files[@]+"${pin_files[@]}"}

      # ── Sibling sweep on fix PRs ────────────────────────────────────
      # A fix that repairs one site and leaves its siblings is the commonest
      # partial_fix. Fix/revert PRs list every other place with the same defect
      # under "## Sibling sweep" (format and limits: sibling_list_check.py).
      # Shape and path existence only; completeness is the reviewers' job. The
      # script is read from the base ref so a branch cannot weaken its own
      # check. The checkout copy runs only while the base tip has no such file;
      # any read that fails fails the step under the runner's `bash -e`, since
      # the diff-base step made the base tip's files local. WARN mode: findings
      # annotate and exit 0 until ENFORCE_FROM in the script names a date.
      - name: Require a Sibling sweep section on fix PRs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
          BASE_TIP: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE: ${{ steps.diffbase.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          script="$(mktemp)"
          listed="$(git ls-tree --name-only "$BASE_TIP" -- .github/scripts/sibling_list_check.py)"
          if [ -n "$listed" ]; then
            git show "$BASE_TIP:.github/scripts/sibling_list_check.py" > "$script"
          else
            cp .github/scripts/sibling_list_check.py "$script"
          fi
          python3 "$script"
