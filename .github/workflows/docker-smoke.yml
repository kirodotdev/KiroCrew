name: Docker Smoke Test

# PR gate for the container distribution: builds the gateway image from a
# locally-built wheel and proves, across a real container boundary, that
#   1. the KIROCREW_BIND=0.0.0.0 override makes the gateway reachable from
#      the HOST via a published port (the exact thing loopback binding
#      breaks in Docker),
#   2. token auth still guards the API surface for that non-loopback path
#      (an unauthenticated protected call is rejected),
#   3. the unauthenticated liveness probe (/api/health) works — the image
#      HEALTHCHECK depends on it,
#   4. kiro-cli is installed and runnable inside the image,
#   5. channel credentials passed as container env are moved into the data
#      home's .env and scrubbed from every long-lived process environ.
#
# amd64-only and load-to-daemon (no push, no registry, no credentials):
# multi-arch assembly is the publish lane's job; this check verifies the
# image CONTRACT. Paths-filtered to the container surface so it costs
# nothing on unrelated PRs.

on:
  pull_request:
    paths:
      - "docker/**"
      - ".dockerignore"
      - ".github/workflows/docker-smoke.yml"
      - ".github/workflows/publish-docker.yml"
      # The container contract spans three source files: the bind override
      # (origin.py), the probe Host-barrier exemption in both server chains
      # (server.py), and the liveness payload the HEALTHCHECK consumes
      # (handlers/core.py). A regression in ANY of them must fire this gate.
      - "src/kiro_crew/dashboard/origin.py"
      - "src/kiro_crew/dashboard/server.py"
      - "src/kiro_crew/dashboard/handlers/core.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Build image + host-reachability probe
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      # Same recipe as build-wheel.yml (frontend staged in) with a throwaway
      # version stamp — the smoke image must exercise the identical
      # wheel-consuming build contract the publish lane uses.
      - name: Build wheel
        run: |
          set -euo pipefail
          SMOKE_VERSION="0.0.0.dev$(date -u +%Y%m%d%H%M)"
          sed -i -E "s/^version = \".*\"/version = \"${SMOKE_VERSION}\"/" pyproject.toml
          cd website && npm ci --no-audit --no-fund && npm run build && cd ..
          rm -rf src/kiro_crew/static/dist
          mkdir -p src/kiro_crew/static
          cp -R website/dist src/kiro_crew/static/dist
          pip install --upgrade build
          python -m build --wheel
          ls -la dist/

      - name: Build image (amd64, load to daemon)
        run: |
          set -euo pipefail
          docker build -f docker/Dockerfile -t kirocrew-smoke:pr .

      - name: Boot container and probe from the host
        run: |
          set -euo pipefail
          # A throwaway credential rides in as container env — the entrypoint
          # contract says it must be moved to the data home's .env and
          # scrubbed from the gateway's environment (asserted below).
          docker run -d --name smoke -p 127.0.0.1:5476:5476 \
            -e SLACK_BOT_TOKEN=smoke-placeholder-cred kirocrew-smoke:pr
          # Host-side reachability: this request crosses the published-port
          # mapping into the container's bridge interface — it can only
          # succeed if the gateway bound beyond loopback (KIROCREW_BIND).
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:5476/api/health" > /tmp/health.json 2>/dev/null; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Gateway never became reachable from the host through the published port"
              docker logs smoke
              exit 1
            fi
            sleep 2
          done
          cat /tmp/health.json
          echo "Host reachability through published port: OK"

      - name: Assert token auth guards the API across the bridge
        run: |
          set -euo pipefail
          # A protected API without a token must be REJECTED (401/403),
          # never served: this is the security half of the bind change —
          # widening the bind must not widen unauthenticated access.
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:5476/api/sessions")
          echo "GET /api/sessions (no token) -> ${STATUS}"
          case "$STATUS" in
            401|403) echo "Auth enforced: OK" ;;
            *) echo "::error::Expected 401/403 for unauthenticated API access, got ${STATUS}"; docker logs smoke; exit 1 ;;
          esac

      - name: Assert credential scrub across the container boundary
        run: |
          set -euo pipefail
          # The credential passed via -e must have landed in the data
          # home's .env (mode 600) ...
          docker exec smoke sh -c 'grep -q "^SLACK_BOT_TOKEN=smoke-placeholder-cred$" "$HOME/.kiro/crew/.env"'
          docker exec smoke sh -c 'test "$(stat -c %a "$HOME/.kiro/crew/.env")" = "600"'
          # ... and must be ABSENT from every long-lived process environ
          # (tini, gateway, workers). The probe shell itself is excluded:
          # `docker exec` re-injects the container's env config into the
          # processes IT starts, which is exactly why the entrypoint scrub
          # for the long-lived tree matters.
          docker exec smoke sh -c '
            for p in /proc/[0-9]*; do
              pid=${p#/proc/}
              [ "$pid" = "$$" ] && continue
              # The HEALTHCHECK curl is docker-exec-like: the daemon injects
              # the container env config into it directly (~ms lifetime).
              # It is not part of the entrypoint-scrubbed process tree.
              [ "$(cat "$p/comm" 2>/dev/null)" = "curl" ] && continue
              if tr "\0" "\n" < "$p/environ" 2>/dev/null | grep -q "^SLACK_BOT_TOKEN="; then
                echo "credential leaked into environ of pid $pid ($(cat "$p/comm" 2>/dev/null))"
                exit 1
              fi
            done
            echo "environ scan clean"
          '
          echo "Credential scrub: OK (.env populated, no resident environ copy)"

      - name: Assert kiro-cli present and container healthy
        run: |
          set -euo pipefail
          docker exec smoke kiro-cli --version
          docker exec smoke kirocrew --version
          # Supply-chain audit record: the resolved (checksum-verified)
          # kiro-cli version must be recorded in the image.
          docker exec smoke cat /usr/local/share/kirocrew/kiro-cli-version
          # Wait out the HEALTHCHECK start period, then require "healthy".
          for i in $(seq 1 12); do
            HEALTH=$(docker inspect --format '{{.State.Health.Status}}' smoke)
            [ "$HEALTH" = "healthy" ] && break
            [ "$i" -eq 12 ] && { echo "::error::Container never reported healthy (last: ${HEALTH})"; docker logs smoke; exit 1; }
            sleep 5
          done
          echo "HEALTHCHECK status: healthy"

      - name: Assert the beacon reports the container distribution
        run: |
          set -euo pipefail
          # This lane builds an UNSTAMPED wheel, so it proves the image's
          # re-stamp is what produces "docker" -- not a value inherited from the
          # wheel. Without the re-stamp a container is indistinguishable from a
          # pip install and the channel breakdown silently merges the two.
          ACTUAL=$(docker exec smoke python -c 'from kiro_crew import beacon; print(beacon.distribution())')
          [ "$ACTUAL" = "docker" ] || {
            echo "::error::beacon.distribution() reported '${ACTUAL}', expected 'docker'"; exit 1; }
          echo "beacon distribution: ${ACTUAL}"
          # The env var must NOT be able to override the baked value: a running
          # install relabelling its own count is the failure the stamp prevents.
          SPOOFED=$(docker exec -e KIROCREW_DISTRIBUTION=wheel smoke \
            python -c 'from kiro_crew import beacon; print(beacon.distribution())')
          [ "$SPOOFED" = "docker" ] || {
            echo "::error::env var overrode the baked stamp (got '${SPOOFED}')"; exit 1; }
          echo "env-var override correctly ignored"

      - name: Container logs (post-mortem aid)
        if: always()
        run: docker logs smoke 2>&1 | tail -60 || true

  # The publish lane builds linux/amd64 AND linux/arm64; the smoke job above
  # only exercises amd64. This job builds (no run — QEMU can't meaningfully
  # boot the gateway) the arm64 image so architecture-specific failures in
  # the kiro-cli manifest selection, per-arch zip download, and installer
  # surface on the PR instead of at publish time. Parallel to the smoke job.
  arm64-build:
    name: Build image (arm64 cross-build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build wheel
        run: |
          set -euo pipefail
          SMOKE_VERSION="0.0.0.dev$(date -u +%Y%m%d%H%M)"
          sed -i -E "s/^version = \".*\"/version = \"${SMOKE_VERSION}\"/" pyproject.toml
          cd website && npm ci --no-audit --no-fund && npm run build && cd ..
          rm -rf src/kiro_crew/static/dist
          mkdir -p src/kiro_crew/static
          cp -R website/dist src/kiro_crew/static/dist
          pip install --upgrade build
          python -m build --wheel

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image (arm64, no load)
        run: |
          set -euo pipefail
          # Build-only: RUN steps (kiro-cli arm64 zip + sha256 verify +
          # install.sh, pip install of the wheel) execute under emulation,
          # which is the coverage this job exists for.
          docker buildx build --platform linux/arm64 -f docker/Dockerfile .
