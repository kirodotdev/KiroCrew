name: PR Readiness Self-Heal Sweep

# Backstop for a dropped `workflow_run` event.
#
# `pr-readiness.yml` publishes a live "PR Readiness" commit status, then relies
# on the `workflow_run: completed` event from each monitored workflow (CI,
# Build, Code Review, the AI reviewers) to re-fire and flip the status from the
# mid-flight `pending` to its terminal verdict (`success` for a same-repository
# PR, `failure`/maintainer-review for a fork PR). GitHub does NOT guarantee
# delivery of `workflow_run` events and silently drops them under Actions load.
# When the FINAL completion event for a head SHA is dropped, nothing recomputes
# the unchanged commit, so the required "PR Readiness" status is frozen at the
# stale `pending` forever and the PR can never merge -- even though every check
# is actually green. (Observed on PR #1461: all checks green at 20:00-20:11,
# zero workflow_run readiness runs fired afterward, status stuck `pending`.)
#
# This sweep finds open PRs whose "PR Readiness" status is stale and re-fires the
# EXISTING recompute via `pr-readiness.yml`'s `workflow_dispatch` path. It does
# NOT re-run CI/Build/reviewers and never computes a verdict itself -- it only
# nudges the authoritative readiness workflow to re-evaluate. The recompute is
# idempotent and stale-SHA guarded, so a spurious nudge just republishes the
# correct verdict (including `pending` again, harmlessly, if a long CI run is
# genuinely still in flight) and stops.
#
# TWO freeze modes qualify as stale, and they need different tests:
#
#   1. `pending` past STALE_MINUTES -- the dropped-event case above. Age alone is
#      the signal, because a live fan-out cannot plausibly still be running.
#
#   2. `failure` with check evidence that landed AFTER it was published -- the
#      RE-RUN case. Re-running individual jobs inside an already-completed run
#      (`gh run rerun --failed`) creates a new run ATTEMPT, and that attempt's
#      completion does NOT emit a fresh `workflow_run: completed` event, so
#      nothing re-triggers the aggregator. Proven on PR #2064: CI run 31208434535
#      reached attempt 2 and completed SUCCESS at 19:16:13Z while "PR Readiness"
#      stayed frozen on its 19:01:24Z failure -- every underlying check green, the
#      required aggregate red, and no event left to correct it.
#
#      Age is the WRONG test here: a terminal failure is legitimately old on a PR
#      that is genuinely failing. The test is instead "a check run finished after
#      the verdict was published", which makes the verdict stale by construction.
#      That is self-terminating -- republishing makes readiness the newest
#      timestamp again -- so a genuinely failing PR is nudged at most once per new
#      piece of check evidence, never once per sweep.
#
#   3. NO readiness status at all -- the UNPUBLISHED case. `pr-readiness.yml`
#      deliberately does not retry its status POST (a retry can overwrite a
#      concurrent run's newer verdict) and instead instructs a human to "re-run
#      this workflow". When that POST fails, the SHA carries no readiness status,
#      so there is no `pending` to age out and the only automatic re-runner --
#      this sweep -- used to skip the PR on the assumption that its own run was
#      still coming. The one case the publisher delegates to a re-run was thus
#      the one case nothing re-ran. Proven on PR #2783: both readiness runs for
#      f014465e failed on `gh: HTTP 503` from the status POST on 2026-08-17, and
#      eight days later the PR was still MERGEABLE with no readiness verdict of
#      any kind on its head SHA.
#
#   4. `success` (or `error`) with FAILING check evidence that landed after it was
#      published. Mode 2's mechanism is direction-blind: a job re-run that flips
#      a lane RED after a green verdict emits no `workflow_run: completed`
#      either, leaving the required aggregate green over a now-red revision --
#      which PERMITS a merge, where a stale red merely blocks one. The evidence
#      test is narrowed to failure-class conclusions here, because housekeeping
#      check-runs (`Strip stale workflow-change override`, `Fork workflow-change
#      guard`) legitimately complete long after a verdict and would otherwise
#      re-fire every green PR on every sweep.
#
#   5. `failure` with a DISPOSITION COMMENT that changed after it was published.
#      Since #6658 readiness also fails on a disposition-rule violation, so the
#      verdict depends on comment bytes -- and `pr-readiness.yml` has no
#      `issue_comment` trigger. Correcting the offending comment emits no event
#      and produces no check-run, so mode 2's test cannot see it and the red
#      freezes on an unchanged commit. Same evidence-after-verdict shape and the
#      same self-terminating argument as mode 2, with the comment's `updated_at`
#      as the evidence. An `issue_comment` trigger on the aggregator was the
#      alternative and is the wrong trade: it is already the majority of this
#      repository's run creation and the review bots rewrite their comments in
#      place on every push, so the dispatch would be spent per bot edit, per PR,
#      repo-wide. Deleting the record with no replacement leaves nothing
#      observable and waits for a push or a manual dispatch.
on:
  schedule:
    # Every 15 minutes. A normal fan-out publishes terminal state via events
    # well inside this window; anything still `pending` past STALE_MINUTES is
    # treated as a dropped-event freeze and nudged.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  actions: write        # dispatch pr-readiness.yml (workflow_dispatch)
  contents: read
  pull-requests: read   # list open PRs
  statuses: read        # read the "PR Readiness" commit status

concurrency:
  # Collapse overlap WITHOUT cancelling the incumbent. The group alone already
  # dedupes: GitHub keeps at most one PENDING run per group, and a newer pending
  # run supersedes the older pending one. `cancel-in-progress: true` would also
  # cancel the run currently HOLDING the slot -- and a run that is queued
  # waiting for a runner already holds it, so once repo-wide queue latency
  # exceeds the 15-minute cron interval every run is killed by its own
  # successor before executing a single step and the sweep never runs again,
  # exactly when Actions saturation makes the backstop most needed (#8026).
  # With `false` the incumbent -- queued or executing -- is never cancelled by
  # a successor; a queued run that never gets a runner still expires on
  # GitHub's own queued-run TTL, after which the next tick takes the slot. So
  # under saturation the sweep degrades to running less often instead of never.
  # (The old "the sweep is idempotent, so cancelling an in-flight run is safe"
  # reasoning considered only an executing run and missed that queued runs are
  # cancellation targets too.)
  group: pr-readiness-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Nudge stuck PR Readiness statuses
    runs-on: ubuntu-latest
    # Headroom for the larger dispatch volume: a real backlog can now be drained
    # in a single sweep (see MAX_DISPATCH), so the job may fire many recomputes.
    timeout-minutes: 15
    steps:
      - name: Re-fire readiness for stale pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          STATUS_CONTEXT: "PR Readiness"
          # A `pending` status older than this (minutes) is considered a
          # dropped-event freeze rather than an in-flight fan-out.
          STALE_MINUTES: "15"
          # Runaway backstop ONLY -- not a fairness throttle. Dispatch is
          # oldest-stale-first (see the sort in the second pass), so the cap can
          # never perpetually starve a low-numbered PR the way the old small,
          # PR-number-ordered cap did. It is sized to cover the entire open-PR
          # set in a single sweep, so a genuine backlog drains in one pass; it
          # exists only to bound a single sweep against a pathological run.
          MAX_DISPATCH: "200"
          # Ceiling for the open-PR listing. See the truncation guard below: this
          # must stay comfortably above the real open-PR count, because `gh pr
          # list` drops the OLDEST entries silently once it is reached.
          PR_LIST_LIMIT: "900"
        run: |
          set -euo pipefail

          now_epoch="$(date -u +%s)"
          stale_seconds=$(( STALE_MINUTES * 60 ))

          # Newest disposition-record timestamp on a PR, as an epoch; 0 when
          # there is none or the read fails. Shared by BOTH staleness arms
          # below, because the freeze it detects runs in both directions: a
          # violating record posted AFTER a green verdict leaves the required
          # status green over a revision that now violates the rule, which
          # PERMITS a merge, and a corrected record after a red verdict leaves
          # the red frozen, which blocks one. Only the marker prefix is matched,
          # so the five review bots rewriting their own comments in place on
          # every push are not evidence -- without that narrowing this would
          # re-fire most PRs on every sweep and prove nothing.
          #
          # `--slurp` for the same reason the check-run reads use it: without it
          # `--paginate` emits one document per page and `max` would produce one
          # timestamp per page, which `date -d` then rejects.
          newest_disposition_epoch() {
            local pr_number="$1" newest
            newest="$(gh api "repos/$REPO/issues/$pr_number/comments" \
              --paginate --slurp 2>/dev/null \
              | jq -r '[.[][]? | select((.body // "")
                         | startswith("<!-- ai-review-disposition ")) | .updated_at]
                       | map(select(. != null)) | max // empty' \
              || echo "")"
            [ -n "$newest" ] || { echo 0; return 0; }
            date -u -d "$newest" +%s 2>/dev/null || echo 0
          }

          # Open PRs with their current head SHA and last-activity time. A
          # single cheap list call.
          #
          # `gh pr list` returns NEWEST-first and truncates at --limit SILENTLY,
          # so a ceiling below the real open-PR count drops the OLDEST PRs --
          # exactly the ones most likely to be frozen, and the ones this sweep
          # exists to rescue. The limit is therefore sized well clear of the
          # current set (250 open at the time of writing) and a hit is reported
          # as a loud action item rather than being absorbed as a measurement.
          prs="$(gh pr list --repo "$REPO" --state open --limit "$PR_LIST_LIMIT" \
            --json number,headRefOid,updatedAt)"

          total="$(jq 'length' <<<"$prs")"
          echo "Scanning $total open pull request(s) for stale PR Readiness."
          if [ "$total" -ge "$PR_LIST_LIMIT" ]; then
            echo "::warning::Open-PR list hit its ceiling of $PR_LIST_LIMIT;" \
              "the oldest open PRs were dropped and cannot be rescued." \
              "Raise PR_LIST_LIMIT in pr-readiness-sweep.yml."
          fi

          # First pass: COLLECT every stale PR; do NOT dispatch inline. Inline
          # dispatch in `gh pr list` order plus a cap starves whichever stale PRs
          # land past the cap on every sweep -- in practice the oldest,
          # lowest-numbered ones, since the list is newest-first. Gather them all
          # here, then dispatch oldest-first in the second pass below.
          stale_file="$(mktemp)"

          while read -r row; do
            [ -n "$row" ] || continue
            number="$(jq -r '.number' <<<"$row")"
            sha="$(jq -r '.headRefOid' <<<"$row")"
            pr_updated_at="$(jq -r '.updatedAt // empty' <<<"$row")"
            [ -n "$sha" ] && [ "$sha" != "null" ] || continue

            # Most-recent "PR Readiness" commit status for this head SHA. The
            # statuses API returns newest first, so `first` is authoritative.
            #
            # The read is captured BEFORE the jq filter so a transport failure is
            # distinguishable from a genuinely absent status: both produce empty
            # jq output, and the unpublished arm below dispatches on the latter.
            # Conflating them would turn a statuses-API 503 into a spurious
            # re-fire of an arbitrary old PR. `--slurp` collapses the paginated
            # pages into one array, so the filter sees a single document.
            if ! statuses_json="$(gh api "repos/$REPO/commits/$sha/statuses" \
                --paginate --slurp 2>/dev/null)"; then
              echo "PR #$number: statuses lookup failed; skipping this sweep."
              continue
            fi
            status_json="$(jq -c --arg ctx "$STATUS_CONTEXT" \
              '[.[][] | select(.context == $ctx)] | first // empty' \
              <<<"$statuses_json")"

            # NO readiness status on this SHA. Skipping here on the assumption
            # that "the PR's own run is coming" is only true for a few minutes
            # after a push. Past that window it means no run ever published one
            # -- most often because `pr-readiness.yml`'s status POST failed and
            # is deliberately not retried, which leaves the required aggregate
            # absent with no `pending` to age out and no event pending. That is
            # the freeze mode nothing else can clear, so it is rescued on the
            # PR's own last-activity age (a push bumps `updatedAt`, so the
            # window restarts on every new revision).
            #
            # Self-limiting by construction: one dispatch per sweep per PR, and
            # the moment any verdict lands this branch stops applying. Bounded by
            # MAX_DISPATCH like every other path.
            #
            # Carried as a sentinel STATE rather than an early `printf` so this
            # case reuses the one staleness comparison and the one stale-file
            # record writer below, instead of restating either. GitHub's commit
            # status states are error/failure/pending/success, so the sentinel
            # cannot collide with a real one.
            if [ -z "$status_json" ]; then
              state="__unpublished__"
              updated_at="$pr_updated_at"
            else
              state="$(jq -r '.state' <<<"$status_json")"
              updated_at="$(jq -r '.updated_at' <<<"$status_json")"
            fi
            updated_epoch="$(date -u -d "$updated_at" +%s 2>/dev/null || echo 0)"
            age=$(( now_epoch - updated_epoch ))

            case "$state" in
              __unpublished__)
                # Age is measured from the PR's own last activity, because a push
                # bumps `updatedAt` -- so the grace window restarts on every new
                # revision, and a brand-new PR whose run is genuinely still
                # queueing is left alone.
                if [ "$updated_epoch" -eq 0 ] || [ "$age" -lt "$stale_seconds" ]; then
                  continue
                fi
                reason="no readiness status published; PR last active ${age}s ago (> ${stale_seconds}s)"
                ;;
              pending)
                if [ "$updated_epoch" -eq 0 ] || [ "$age" -lt "$stale_seconds" ]; then
                  # Either unparseable, or still within the plausible-running window.
                  continue
                fi
                reason="pending for ${age}s (> ${stale_seconds}s)"
                ;;
              failure)
                # A TERMINAL verdict can go stale too, and this is the case the
                # pending-only sweep missed entirely. Re-running individual jobs
                # inside an already-completed run (`gh run rerun --failed`)
                # creates a new run ATTEMPT, and that attempt's completion does
                # NOT emit a fresh `workflow_run: completed` event -- so nothing
                # re-triggers the aggregator. Proven on PR #2064: CI run
                # 31208434535 reached attempt 2 and completed SUCCESS at
                # 19:16:13Z, while `PR Readiness` stayed frozen on its 19:01:24Z
                # failure. Every underlying check was green and the aggregate was
                # red, with no event left to fix it.
                #
                # The re-fire condition is deliberately NOT "state is failure":
                # that would dispatch on every legitimately-failing PR every 15
                # minutes, forever. It is "a check run for this SHA finished
                # AFTER the verdict was published" -- i.e. the verdict is stale
                # BY CONSTRUCTION, because evidence landed after it was computed.
                #
                # That condition is self-terminating, which is what makes it safe
                # to run on a schedule: republishing the verdict makes the
                # readiness status the newest timestamp again, so the next sweep
                # sees nothing newer and does not re-fire. A PR that is genuinely
                # failing is nudged at most once per new piece of check evidence,
                # not once per sweep.
                [ "$updated_epoch" -ne 0 ] || continue
                # `--slurp` is REQUIRED, not tidiness: without it `--paginate`
                # concatenates one JSON document per page and jq evaluates each
                # separately, so `max` emits one timestamp PER PAGE. `date -d`
                # then rejects the multi-line string, the epoch reads 0, and the
                # PR is skipped -- silently exempting every PR with more than 100
                # check-runs, which on this repo is any PR whose lanes have been
                # re-run. Slurped, the filter sees one array and emits one value.
                newest_check="$(gh api "repos/$REPO/commits/$sha/check-runs" \
                  --paginate --slurp 2>/dev/null \
                  | jq -r '[.[].check_runs[]? | select(.status == "completed") | .completed_at]
                           | map(select(. != null)) | max // empty' \
                  || echo "")"
                newest_epoch=0
                if [ -n "$newest_check" ]; then
                  newest_epoch="$(date -u -d "$newest_check" +%s 2>/dev/null || echo 0)"
                fi
                # Strictly newer, with a small margin so a check completing in
                # the same second as the publish does not look like new evidence.
                if [ "$newest_epoch" -gt $(( updated_epoch + 5 )) ]; then
                  reason="failure published at $updated_at but a check completed later at $newest_check"
                else
                  # Mode 5: COMMENT evidence. Since #6658 readiness also fails on
                  # a disposition-rule violation, so the verdict now depends on
                  # comment bytes -- and `pr-readiness.yml` has no
                  # `issue_comment` trigger. Correcting the offending comment
                  # therefore emits NO event and produces NO check-run, so mode 2
                  # above cannot see it and the red freezes on an unchanged
                  # commit. That is this sweep's own subject matter, in the red
                  # direction.
                  #
                  # Same shape and same safety argument as mode 2: the test is
                  # "a disposition record changed AFTER the verdict was
                  # published", which makes the verdict stale by construction and
                  # is self-terminating, because republishing makes readiness the
                  # newest timestamp again. A PR that genuinely violates the rule
                  # is nudged at most once per edit, never once per sweep.
                  #
                  # An `issue_comment` trigger on `pr-readiness.yml` was the
                  # alternative and is the wrong trade: that workflow is already
                  # the majority of this repository's run creation, the review
                  # bots rewrite their comments in place on every push, and the
                  # dispatch is spent whether or not a job-level `if` then skips
                  # the run. A scheduled sweep that already iterates these PRs
                  # pays one extra read per candidate PR instead.
                  #
                  # The marker prefix in the helper SELECTS candidate comments; it
                  # does not evaluate the rule. A drift in that prefix changes
                  # only how often a nudge fires, never what counts as a
                  # violation -- which is why this is not the "fourth parser"
                  # #6658 forbids. Deletion with no replacement leaves nothing
                  # observable: in the red direction that residual waits for a
                  # push or a manual dispatch, and the docs say so. In the green
                  # direction it needs no rescue, because removing a record can
                  # only remove a violation.
                  disposition_epoch="$(newest_disposition_epoch "$number")"
                  [ "$disposition_epoch" -ne 0 ] || continue
                  # STRICT, with no margin. The check-evidence modes carry a
                  # 5s margin so a check completing in the same second as the
                  # publish is not read as new evidence; `-le` already excludes
                  # the same second by itself, so for comment evidence that
                  # margin bought nothing and cost a 1-5s window in which a
                  # record could be posted and then never re-examined, since
                  # nothing else observes comments. Self-termination is
                  # unaffected: republishing moves the verdict past the record.
                  if [ "$disposition_epoch" -le "$updated_epoch" ]; then
                    continue
                  fi
                  reason="failure published at $updated_at but a disposition record changed later at $(date -u -d "@$disposition_epoch" +%Y-%m-%dT%H:%M:%SZ)"
                fi
                ;;
              success|error)
                # Mode 2's mechanism does not care which way the re-run went. A
                # job re-run that turns a lane RED after a green verdict emits no
                # `workflow_run: completed` either, so the required aggregate
                # stays green over a now-red revision -- and a stale green
                # PERMITS a merge, where a stale red only blocks one. The unsafe
                # direction is therefore the one that was never rescued.
                #
                # The evidence test is narrowed to FAILURE-CLASS conclusions
                # rather than "any check completed later". Housekeeping check-runs
                # (`Strip stale workflow-change override`, `Fork workflow-change
                # guard`) routinely complete days after a verdict on a long-lived
                # PR, so the unnarrowed test would re-fire most green PRs on every
                # sweep while proving nothing. A later `success` needs no rescue:
                # it cannot turn a green verdict red.
                #
                # Self-terminating exactly like mode 2 -- republishing makes the
                # verdict the newest timestamp, so the same red evidence is not
                # counted twice. `error` shares this arm because it is the same
                # dropped-event problem: "the next real event will correct it"
                # holds only when a next event exists.
                [ "$updated_epoch" -ne 0 ] || continue
                newest_fail="$(gh api "repos/$REPO/commits/$sha/check-runs" \
                  --paginate --slurp 2>/dev/null \
                  | jq -r '[.[].check_runs[]?
                             | select(.status == "completed")
                             | select(.conclusion as $c
                                 | ["failure","timed_out","cancelled","action_required",
                                    "stale","startup_failure"] | index($c))
                             | .completed_at]
                           | map(select(. != null)) | max // empty' \
                  || echo "")"
                newest_fail_epoch=0
                if [ -n "$newest_fail" ]; then
                  newest_fail_epoch="$(date -u -d "$newest_fail" +%s 2>/dev/null || echo 0)"
                fi
                if [ "$newest_fail_epoch" -gt $(( updated_epoch + 5 )) ]; then
                  reason="$state published at $updated_at but a check FAILED later at $newest_fail"
                else
                  # Mode 5 in the PERMITTING direction, and this is the half that
                  # actually matters. A writer can post a rule-violating
                  # disposition record AFTER readiness published success: the
                  # record immediately carries adjudication-ledger downgrade
                  # power, the revision now violates the rule, and no event
                  # re-evaluates it -- so the required status stays green over a
                  # revision that should be red, which PERMITS a merge. Mode 4's
                  # own reasoning applies verbatim: a stale green permits, a
                  # stale red merely blocks, so the permitting direction is the
                  # one that must not be left unrescued.
                  #
                  # No narrowing is needed here beyond the marker prefix the
                  # helper already applies. Mode 4 has to restrict check evidence
                  # to failure-class conclusions because housekeeping check-runs
                  # complete late on every long-lived PR; a disposition record, by
                  # contrast, is only ever written by a writer ruling on this PR,
                  # and each one is counted at most once because republishing
                  # makes readiness the newest timestamp again.
                  disposition_epoch="$(newest_disposition_epoch "$number")"
                  [ "$disposition_epoch" -ne 0 ] || continue
                  # STRICT, with no margin. The check-evidence modes carry a
                  # 5s margin so a check completing in the same second as the
                  # publish is not read as new evidence; `-le` already excludes
                  # the same second by itself, so for comment evidence that
                  # margin bought nothing and cost a 1-5s window in which a
                  # record could be posted and then never re-examined, since
                  # nothing else observes comments. Self-termination is
                  # unaffected: republishing moves the verdict past the record.
                  if [ "$disposition_epoch" -le "$updated_epoch" ]; then
                    continue
                  fi
                  reason="$state published at $updated_at but a disposition record changed later at $(date -u -d "@$disposition_epoch" +%Y-%m-%dT%H:%M:%SZ)"
                fi
                ;;
              *)
                # Any state this sweep does not model is left to a real event.
                continue
                ;;
            esac

            # Record as "staleness_epoch<TAB>number<TAB>sha<TAB>reason". The
            # staleness epoch is the status's own updated_at, so a numeric sort
            # ascending on column 1 orders by HOW LONG each PR has been frozen.
            printf '%s\t%s\t%s\t%s\n' "$updated_epoch" "$number" "$sha" "$reason" >>"$stale_file"
          done < <(jq -c '.[]' <<<"$prs")

          stale_total=0
          [ -s "$stale_file" ] && stale_total="$(wc -l <"$stale_file" | tr -d ' ')"
          echo "Found $stale_total stale PR Readiness status(es); dispatching oldest-first."

          dispatched=0
          skipped_cap=0

          # Second pass: dispatch OLDEST-stale-first (numeric sort ascending on
          # the staleness epoch in column 1). The longest-frozen PR is always
          # served first, so nothing can be perpetually deferred by the cap.
          while IFS=$'\t' read -r s_epoch number sha reason; do
            [ -n "$number" ] || continue
            if [ "$dispatched" -ge "$MAX_DISPATCH" ]; then
              skipped_cap=$(( skipped_cap + 1 ))
              continue
            fi
            echo "PR #$number: PR Readiness $reason at $sha -> re-firing recompute."
            if gh workflow run pr-readiness.yml --repo "$REPO" \
                -f pr="$number" -f sha="$sha" >/dev/null 2>&1; then
              dispatched=$(( dispatched + 1 ))
            else
              echo "PR #$number: failed to dispatch pr-readiness.yml (will retry next sweep)."
            fi
          done < <(sort -n -k1,1 "$stale_file")

          rm -f "$stale_file"

          echo "Re-fired $dispatched recompute(s); $skipped_cap stale PR(s) deferred to next sweep by MAX_DISPATCH=$MAX_DISPATCH."
