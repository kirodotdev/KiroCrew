name: Issue Gate Retrigger

# `issue-gate.yml` runs on pull_request events only, and a label landing on an
# ISSUE is not one. So a PR whose gate went red before its issue was tiered, or
# before a big tier was flipped to `triaged`, would stay red after the label
# landed. This workflow closes that gap: when a label the gate reads is added to
# or removed from an issue, it re-runs the failed `Issue Gate` job of each open
# PR of this repository that references the issue (`gh run rerun --failed`).
#
# The gate reads the PR body and the issue labels from the API at run time, so
# the re-run judges today's state; a PR that merely mentions the issue is judged
# the same way. A gate that is green, still running, or has no run on the PR's
# head is left alone. The re-run's completion reaches `PR Readiness` through
# `pr-readiness-sweep.yml`, like any other re-run attempt.
#
# Nothing here checks out or runs repository code, and the only event text the
# script reads is the issue number.

on:
  issues:
    types: [labeled, unlabeled]

permissions:
  actions: write # re-run the Issue Gate job
  issues: read # the issue's cross-reference timeline
  pull-requests: read # the referencing PRs' state and head

jobs:
  retrigger:
    name: Re-run Issue Gate
    # Exactly the labels issue-gate.yml reads (TIER_LABELS, PENDING_LABEL,
    # TRIAGED_LABEL), so any other label stops here before a runner starts.
    # test/test_issue_gate_refs.py pins the two sets equal.
    if: contains(fromJSON('["tier:T1", "tier:T2", "tier:T3", "tier:T4", "pending-triage", "triaged"]'), github.event.label.name)
    # Job-level, so only a run that passed the `if` joins the group: a burst of
    # other labels on the issue cannot cancel a pending tier run.
    concurrency:
      group: issue-gate-retrigger-${{ github.event.issue.number }}
      cancel-in-progress: false
    # Seconds of work on the path a PR author is waiting on, like the gate it
    # re-runs; the label form keeps the hosted fallback for a fork's own copy.
    runs-on: ${{ github.repository == 'kirodotdev/KiroCrew' && 'kirocrew-linux-4-core' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Re-run the failed Issue Gate of each open PR referencing the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -uo pipefail

          # Open PRs of THIS repository that cross-reference the issue, one per
          # line as "<number> <head sha> <head repository> <head branch>".
          if ! prs="$(gh api graphql \
            -f query='query($owner: String!, $name: String!, $n: Int!) {
              repository(owner: $owner, name: $name) {
                issue(number: $n) {
                  timelineItems(itemTypes: [CROSS_REFERENCED_EVENT], last: 100) {
                    nodes { ... on CrossReferencedEvent { source { ... on PullRequest {
                      number state headRefOid headRefName
                      headRepository { nameWithOwner } repository { nameWithOwner }
                    } } } }
                  }
                }
              }
            }' \
            -F owner="${REPO%%/*}" -F name="${REPO#*/}" -F n="$ISSUE" \
            --jq '.data.repository.issue.timelineItems.nodes[].source
                  | select(.number != null and .state == "OPEN" and .repository.nameWithOwner == env.REPO)
                  | "\(.number) \(.headRefOid) \(.headRepository.nameWithOwner) \(.headRefName)"')"; then
            echo "::error::Could not read the pull requests that reference #$ISSUE."
            exit 1
          fi
          prs="$(sort -u <<< "$prs")"
          if [ -z "$prs" ]; then
            echo "No open pull request references #$ISSUE; nothing to re-run."
            exit 0
          fi

          failed=0
          while read -r pr sha head_repo head_ref; do
            # Two open PRs can share a head SHA, so the newest run on it may be
            # the other PR's: keep the runs of this PR's head repository and branch.
            if ! run="$(HEAD_REPO="$head_repo" HEAD_REF="$head_ref" gh api \
              "repos/$REPO/actions/workflows/issue-gate.yml/runs?head_sha=$sha&event=pull_request&per_page=100" \
              --jq '[.workflow_runs[]
                     | select(.head_repository.full_name == env.HEAD_REPO and .head_branch == env.HEAD_REF)]
                    | max_by(.id) // empty | "\(.id) \(.status) \(.conclusion)"')"; then
              echo "::warning::PR #$pr: could not read its Issue Gate runs."
              failed=1
              continue
            fi
            if [ -z "$run" ]; then
              echo "PR #$pr: no Issue Gate run on head $sha; left alone."
              continue
            fi
            read -r run_id status conclusion <<< "$run"
            if [ "$status" != "completed" ] || [ "$conclusion" != "failure" ]; then
              echo "PR #$pr: Issue Gate run $run_id is $status/$conclusion; left alone."
              continue
            fi
            if gh run rerun "$run_id" --failed -R "$REPO"; then
              echo "PR #$pr: re-ran the failed Issue Gate job of run $run_id."
            else
              echo "::warning::PR #$pr: re-running Issue Gate run $run_id failed."
              failed=1
            fi
          done <<< "$prs"
          exit "$failed"
