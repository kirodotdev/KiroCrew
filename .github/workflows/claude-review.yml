name: Claude AI Review

# Semantic AI review layer. Replicates the AutoSDE rules that CANNOT be
# expressed as a grep (aria-label on icon-only buttons, no-emoji-as-icons,
# template-literal HTML injection, React Query usage, WCAG semantics). Runs
# automatically on every PR (automation mode — no @claude mention needed) and
# fails the check on high-severity findings so it can gate merge via branch
# protection.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write   # required for AWS OIDC (configure-aws-credentials)

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Model-AGNOSTIC check name on purpose: branch protection keys its required
    # status check on this job name. Keep it model-agnostic so bumping the Claude
    # model (--model below) never renames the check and never requires a
    # branch-protection change. Put the model version only in --model, comments,
    # and the posted-summary heading — never here.
    name: Claude AI Review
    runs-on: ubuntu-latest
    # Hard runtime ceiling: if the agentic review ever runs away, the job is
    # cancelled at 40 min and the gate fails closed (a no-output review can't
    # look clean). Pairs with --max-turns below to bound the review.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Non-blocking size signal: raise a concern when the REVIEWABLE diff is
      # large enough that a single review pass may not cover it reliably. Only
      # the vendored tree is excluded (src/kiro_crew/_vendor is excluded from
      # source analysis repo-wide and recurs as large dependency syncs, so
      # counting it would just create noise). This ONLY warns — it never fails
      # the check — so the concern is visible on the run without blocking merge.
      - name: Flag oversized reviewable diff (non-blocking)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MAX_REVIEWABLE_LINES: "15000"
        run: |
          changed=$(git diff --numstat "$BASE_SHA...$HEAD_SHA" -- . ':(exclude)src/kiro_crew/_vendor' 2>/dev/null \
            | awk '{ a += $1; d += $2 } END { print a + d + 0 }')
          echo "reviewable changed lines (excluding src/kiro_crew/_vendor): ${changed}"
          if [ "${changed:-0}" -gt "$MAX_REVIEWABLE_LINES" ]; then
            echo "::warning::This PR changes ${changed} reviewable lines (> ${MAX_REVIEWABLE_LINES}) — likely too large for one reliable review pass. Consider splitting it into smaller, self-contained PRs."
          fi

      # Load AUTOSDE rules from the BASE commit, not the PR HEAD, so a PR
      # cannot weaken the rules that govern it. Fable 5 reads these snapshots
      # (its restricted toolset can Read files but not run git).
      - name: Extract base-ref AUTOSDE rules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p .review-base-rules
          git show "$BASE_SHA:AUTOSDE.yaml" > .review-base-rules/AUTOSDE.yaml 2>/dev/null || echo "# (no backend AUTOSDE rules on base)" > .review-base-rules/AUTOSDE.yaml
          git show "$BASE_SHA:website/AUTOSDE.yaml" > .review-base-rules/website-AUTOSDE.yaml 2>/dev/null || echo "# (no frontend AUTOSDE rules on base)" > .review-base-rules/website-AUTOSDE.yaml

      # Dependabot PRs run with a read-only token and NO access to repo
      # secrets / OIDC, so the AWS role assumption below can never succeed —
      # it errors, the review step is skipped, and the gate fails closed on
      # every Dependabot PR. Skip the credential + review steps for Dependabot
      # and let the gate pass (see "Gate on Fable 5 review"). Dependency bumps
      # are mechanical and remain covered by the non-AI gates (Semgrep,
      # Dependency Audit, CodeQL, build/tests).
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        if: github.actor != 'dependabot[bot]'
        with:
          role-to-assume: ${{ secrets.AWS_BEDROCK_ROLE_ARN }}
          aws-region: us-west-2

      - name: Fable 5 review
        id: review
        if: github.actor != 'dependabot[bot]'
        uses: anthropics/claude-code-action@44423bdec74b97d67543eb16c110546762c110b2 # v1
        with:
          # Inference via Amazon Bedrock (region from the AWS creds step above).
          use_bedrock: "true"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Automation mode: presence of `prompt` makes the action run on the
          # triggering event without waiting for a `@claude` trigger phrase.
          # Allow the gh commands the review uses to post its findings. The
          # action runs Bash deny-by-default; in headless CI a denied `gh pr
          # comment` silently drops the review's summary (and its [BLOCK-MERGE]
          # marker), so the gate can never fire. `gh pr comment` is the
          # single-operation form — `gh pr review --comment` trips the
          # "multiple operations require approval" guard.
          # Read/Grep let the review load the authoritative base-branch rule
          # snapshots (.review-base-rules/AUTOSDE.yaml + website-AUTOSDE.yaml)
          # and any file it needs for context; the gh commands let it
          # post findings.
          claude_args: |
            --model us.anthropic.claude-fable-5
            --fallback-model us.anthropic.claude-opus-4-8
            --max-turns 60
            --allowedTools "Read,Grep,Glob,Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh api:*)"
            --json-schema '{"type":"object","additionalProperties":false,"required":["reviewed","block_merge","summary"],"properties":{"reviewed":{"type":"boolean","description":"true once you have completed the review of this commit"},"block_merge":{"type":"boolean","description":"true IFF at least one finding meets the BLOCKING BAR"},"summary":{"type":"string","description":"markdown review summary CI will post to the PR"}}}'
          prompt: |
            You are reviewing pull request #${{ github.event.pull_request.number }}
            of ${{ github.repository }} (HEAD ${{ github.event.pull_request.head.sha }}).

            KiroCrew is an open-source AI agent platform (Python backend + React/TS
            dashboard). CLAUDE.md and AGENTS.md (root and website/) are read
            automatically — follow the conventions there. This repo is a de-Amazoned
            public fork: do NOT flag the absence of Brazil/AUTOSDE tooling.

            Review ONLY the PR diff. Post specific, actionable inline comments.

            SCOPE (mandatory): FOCUS on the files this PR changes. You MAY read
            surrounding or referenced files (Read/Grep/Glob) for CONTEXT — to
            understand a changed line — but do NOT review or report on code
            outside the diff, and do not go on a whole-repo audit. Report findings
            ONLY on lines this PR adds or changes; use context reads to judge
            those lines, never to expand the review into unrelated code.

            COVERAGE (mandatory): enumerate EVERY file in the PR diff and inspect
            each one — do not sample, skim, or stop early. "Inspect" means read
            each changed file (with enough surrounding context to judge the
            change) and surface the COMPLETE set of findings on the changed lines
            in this single review, never a representative subset.

            THOROUGHNESS — you run as a SINGLE agentic review with a large turn
            budget; USE it. Re-scan the diff more than once within this one run
            until every changed file has been examined and you are confident the
            finding set is COMPLETE — do not stop after a first skim. (Do NOT try
            to reason about what an earlier revision's review reported — you
            cannot see it; review this diff live regardless of prior revisions.)

            AUTHORITATIVE RULE SET: read the BASE-branch rule snapshots at
            `.review-base-rules/AUTOSDE.yaml` (backend Python) and
            `.review-base-rules/website-AUTOSDE.yaml` (frontend). These are the
            rules as they exist on the base branch, so a PR cannot weaken the
            rules that govern it. Together they are the single source of truth
            for this repo's review rules, built up over months. Enforce every
            rule with `blocking: true` whose `file-patterns` match the changed
            files — treat a violation as a CRITICAL/HIGH finding. If this PR
            modifies AUTOSDE.yaml or website/AUTOSDE.yaml, scrutinize the change
            and treat any weakening or removal of a blocking rule as CRITICAL/HIGH.
            The concerns listed below are a non-exhaustive reminder of the
            judgement-based rules; the AUTOSDE.yaml files govern.

            Additional blocking concerns (they mirror the AutoSDE rules that a
            grep cannot catch):
            - Security: credential handling, path traversal, command/SQL injection,
              XSS. In the frontend, dangerouslySetInnerHTML MUST go through
              sanitize()/md() (DOMPurify); no HTML built from template literals with
              user/LLM content. In the backend, sensitive-path reads MUST go through
              hooks.py is_sensitive_path(); never weaken the ~/.kirocrew keystone.
            - Accessibility (WCAG 2.1 AA): icon-only buttons need aria-label;
              interactive elements need keyboard handling; no emoji used as UI icons
              (use lucide-react).
            - Correctness: blocking calls on the asyncio event loop, unbounded
              allocations, resource leaks, race conditions.
            - Conventions: React Query (not manual useState+useEffect) for server
              state; design tokens over hardcoded colors; Framer Motion over new CSS
              @keyframes.

            EVIDENCE REQUIREMENT (anti-hallucination) — every finding MUST show
            its work, or you MUST NOT report it. For each finding include:
              1. Location: exact file:line from the diff.
              2. Evidence: quote the specific changed line(s) the finding is about.
              3. Reasoning (chain of consequences): trace the concrete path from
                 the quoted code to the harm — inputs → call path → observable
                 failure → how far the damage propagates. A CRITICAL/HIGH MUST
                 demonstrate that blast radius; if you cannot name a concrete
                 trigger AND outcome, it is not CRITICAL/HIGH: downgrade or drop it.
              4. Fix: a specific, minimal change.
            Do not report a finding you cannot ground in quoted diff lines. When
            unsure, lower the severity rather than guess. Only the base-branch
            AUTOSDE rules and the actual diff are authoritative — never invent rules.

            BLOCKING BAR (identical for the Codex reviewer) — a finding may block
            merge ONLY if it is CRITICAL or HIGH AND one of: a real, reachable
            security hole with a concrete trigger; a broken security keystone /
            sensitive-path control; a crash / data-loss / corruption bug on a code
            path the diff adds or changes; or a violation of a `blocking: true`
            AUTOSDE.yaml rule whose file-patterns match a changed file. Style,
            naming, speculative performance, hypothetical edge cases, and
            test-coverage suggestions are NEVER blocking — label them MEDIUM/LOW
            and keep them advisory.

            SEVERITY–BLOCK COHERENCE: reserve CRITICAL/HIGH for findings that meet
            the BLOCKING BAR above; anything that does not meet the bar MUST be
            MEDIUM or LOW. Consequently, if ANY finding is CRITICAL/HIGH you MUST
            include the [BLOCK-MERGE] marker; and if you do NOT include it, you
            MUST NOT have labelled any finding above MEDIUM. The gate blocks only
            on the marker, never on raw severity labels — this rule just keeps
            your labels and your block decision consistent.

            SELF-CRITIQUE (run BEFORE you post the summary comment):
            - Kill-filter: DROP pure style preferences, "consider"/"nice-to-have"
              nits, and anything that would not change the author's code or
              understanding. But DO keep and report every substantive MEDIUM —
              real correctness, robustness, maintainability, or clarity issues on
              changed lines that would genuinely help the author — as an ADVISORY
              (non-blocking) finding. Valuable MEDIUMs are the point of the
              review; only true nits get dropped, not useful non-blocking issues.
            - Merge: if two findings share one root cause, post ONE comment.

            PREMISE / DESIGN CONCERNS (keep separate from the code verdict):
            A "should this exist / is this the right design" objection is
            ADVISORY — report it as MEDIUM and NEVER emit BLOCK-MERGE for it,
            UNLESS it is a one-way door (irreversible data/schema migration, a new
            public API, or an irreversible default change). A clean implementation
            does not bless a bad premise, and a premise concern does not inflate
            routine nits into blockers.

            SCOPE & REGRESSION:
            - Scope coherence: flag hunks unrelated to this PR's stated purpose as
              MEDIUM ("belongs in a separate PR"); escalate to the blocking bar
              ONLY if the unrelated change itself alters security/data behavior.
            - Regression: if the diff removes a guard clause, validation, or error
              handling that a prior fix added, and the PR description does not say
              why, that is a blocking-bar finding (it re-exposes a bug on a changed
              path).

            FINAL OUTPUT (authoritative for the gate) — when you finish, return
            the structured result required by the --json-schema. The action
            captures it directly, so the gate does NOT depend on you posting a
            comment:
            - reviewed: true — you completed the review of this commit.
            - block_merge: true IF AND ONLY IF at least one finding meets the
              BLOCKING BAR above (a real reachable security hole, a broken
              keystone/sensitive-path control, a crash/data-loss on a changed
              path, or a violation of a `blocking: true` AUTOSDE.yaml rule).
              Otherwise false. Per SEVERITY↔BLOCK COHERENCE, block_merge MUST be
              true whenever any finding is CRITICAL/HIGH; never label a
              non-blocking finding above MEDIUM.
            - summary: your full markdown review (findings with the evidence
              chain, or an explicit "no blocking findings"). CI posts this to the
              PR on your behalf.
            You MAY still post inline comments during the review, but the
            structured result is the single source of truth for the merge gate.

      # Post the review summary for humans (best-effort, NON-gating). Reads the
      # summary from the action's structured output — not from a model-posted
      # comment — so it works even when the model doesn't call gh pr comment.
      # UPSERT a single marker-keyed comment per PR: re-scanning on every push
      # UPDATEs that one comment (PATCH) instead of stacking a new one —
      # otherwise the PR fills with N near-duplicate Fable 5 summaries as the
      # branch evolves (PR #14 accumulated 3). Fully workflow-owned, so the
      # dedup does not depend on the model following posting instructions.
      - name: Post Fable 5 review summary
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          SO: ${{ steps.review.outputs.structured_output }}
        run: |
          [ -z "$SO" ] && { echo "no structured output to post"; exit 0; }
          summary=$(printf '%s' "$SO" | jq -r '.summary // ""')
          verdict=$(printf '%s' "$SO" | jq -r 'if .block_merge then "🔴 changes requested (blocking)" else "✅ no blocking findings" end')
          [ -z "$summary" ] && exit 0
          MARKER="<!-- claude-ai-review -->"
          {
            echo "$MARKER"
            echo "## Fable 5 Review — $verdict"
            echo
            echo "_Reviewed \`$HEAD\` — this comment is updated in place on each push._"
            echo
            printf '%s\n' "$summary"
            echo
            echo "_Verdict recorded via the action's structured output for commit \`$HEAD\`._"
          } > /tmp/claude-summary.md
          # Find the bot's existing marker comment (first match wins) and PATCH
          # it in place; create once if absent. PR timeline comments are issue
          # comments, so list/create/update via the issues/comments API. Two
          # guards on the lookup:
          #   - author filter: only a github-actions[bot] comment can match —
          #     otherwise any PR commenter could plant the hidden marker and
          #     this step would PATCH (overwrite) THEIR comment with the
          #     write-scoped token.
          #   - per-page jq: with --paginate the --jq filter runs PER PAGE, so
          #     emit only matching ids (never null placeholders) and take the
          #     first line across all pages — a multi-page comment list must
          #     not produce a malformed multi-line id.
          existing="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$MARKER\"))) | .id" 2>/dev/null \
            | head -n1 || true)"
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$existing" \
              --field body="$(cat /tmp/claude-summary.md)" >/dev/null || true
            echo "Updated existing Fable 5 summary comment #$existing"
          else
            gh pr comment "$PR" --body-file /tmp/claude-summary.md || true
            echo "Created new Fable 5 summary comment"
          fi

      # Fail-CLOSED gate. Gates on the action's OWN structured output
      # (steps.review.outputs.structured_output, produced by the --json-schema in
      # claude_args) — NOT on a model-posted comment. This fixes two problems the
      # comment-marker approach had:
      #   1. No-post fragility: the action can report success while the model
      #      never calls `gh pr comment`, leaving no marker and failing the gate
      #      spuriously. structured_output is captured by the action regardless.
      #   2. Comment spoofing: reading a PR comment trusted any github-actions[bot]
      #      body; structured_output comes from THIS review step's own output and
      #      cannot be injected by another comment.
      # Fail closed unless the step succeeded AND emitted structured output with
      # reviewed==true, so a review that errored / ran out of turns / produced no
      # verdict can never look clean.
      - name: Gate on Fable 5 review
        if: always()
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          SO: ${{ steps.review.outputs.structured_output }}
          ACTOR: ${{ github.actor }}
        run: |
          # Dependabot PRs skip the review step above (no secrets/OIDC access).
          # Pass the gate green rather than fail closed — dependency bumps are
          # covered by Semgrep, Dependency Audit, CodeQL and the build/tests.
          if [ "$ACTOR" = "dependabot[bot]" ]; then
            echo "Dependabot PR ($ACTOR): Fable 5 AI review skipped (no Bedrock secrets/OIDC). Passing gate."
            exit 0
          fi
          if [ "$REVIEW_OUTCOME" != "success" ]; then
            echo "::error::Fable 5 review step did not succeed (outcome=$REVIEW_OUTCOME) for $HEAD. Failing closed."
            exit 1
          fi
          if [ -z "$SO" ]; then
            echo "::error::Fable 5 review produced no structured output for $HEAD (review did not complete / ran out of turns). Failing closed — re-run or inspect the Fable 5 review step logs."
            exit 1
          fi
          reviewed=$(printf '%s' "$SO" | jq -r '.reviewed // false')
          block=$(printf '%s' "$SO" | jq -r 'if has("block_merge") then (.block_merge|tostring) else "MISSING" end')
          if [ "$reviewed" != "true" ]; then
            echo "::error::Fable 5 review did not confirm completion (reviewed != true) for $HEAD. Failing closed."
            printf 'structured_output: %s\n' "$SO"
            exit 1
          fi
          if [ "$block" = "MISSING" ]; then
            echo "::error::Fable 5 structured output is missing block_merge for $HEAD. Failing closed."
            printf 'structured_output: %s\n' "$SO"
            exit 1
          fi
          if [ "$block" = "true" ]; then
            echo "::error::Fable 5 review flagged a blocking (CRITICAL/HIGH) issue on $HEAD — see the posted review summary."
            exit 1
          fi
          echo "Fable 5 review completed for $HEAD with no blocking findings."
