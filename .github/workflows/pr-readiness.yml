name: PR Readiness

# One current-SHA verdict for the otherwise wide PR workflow fan-out. The
# commit status is the branch-protection handle; the label is the at-a-glance
# signal on PR lists and the PR header.
on:
  # This workflow never checks out or executes PR code. pull_request_target
  # gives the trusted base workflow enough permission to replace a stale label
  # immediately for both same-repository and fork PRs.
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
      - converted_to_draft
      - closed
  workflow_run:
    workflows:
      - CI
      # The eleven cheap blocking gates, split out of CI so the fork reviewers can
      # key on them. It is a lane in its own right -- a red gate must red the PR --
      # and its completion is also what releases CI's heavy jobs.
      - Fast Gate
      - Build
      - Code Review
      - Opus 4.8 Review
      - GPT 5.6 Review
      - Design Review
      - UX Review
      - First Principles Review
      - CodeQL
      # Stage-2 fork AI reviewers. They run from the default branch via
      # `workflow_run` (on CI's completion), so their own completion must
      # re-trigger this job to publish the fork PR's real verdict once the
      # reviews land -- otherwise the fork verdict freezes at `checking`.
      - Fork Opus 4.8 Review
      - Fork GPT 5.6 Review
      - Fork Design Review
      - Fork UX Review
      - Fork First Principles Review
    # `completed` publishes the real verdict. `in_progress` is kept as a merge
    # guard, and `requested` is deliberately absent.
    #
    # Why `requested` carries nothing: it fires when a run is CREATED, which on
    # a head update happens for all 14 workflows above before any of them can
    # have a verdict -- and readiness has already published `checking` for that
    # revision via the `pull_request_target: synchronize` path. Its only other
    # occasion is a brand-new run, whose eventual `completed` is the fire that
    # actually decides anything. Listing it cost a third of this workflow's
    # dispatch to re-publish a `pending` that was already pending.
    #
    # Why `in_progress` is load-bearing and NOT a cosmetic: it is the only type
    # that observes a monitored workflow going BACK to running. A re-run reuses
    # the same workflow run and increments its attempt rather than creating a
    # new one, so `requested` does not fire for it -- `in_progress` does. That
    # matters for a re-run of an already-GREEN lane: without it, readiness holds
    # the pre-re-run `success` for the whole re-run, and since this status is
    # the branch-protection handle for the entire fan-out, armed auto-merge can
    # merge a revision whose lane is at that moment failing. Dropping it would
    # trade a merge-safety guard for dispatch, which is the wrong direction.
    #
    # The dispatch problem this addresses: every type fires once per monitored
    # workflow per revision, so all three dispatched up to 42 readiness runs per
    # head update and made this workflow the majority of the repository's run
    # creation. Two types put the ceiling at 28. The per-revision concurrency
    # group below collapses the burst for EXECUTION, but a collapsed run has
    # already consumed its dispatch slot, so the group never bounded this cost.
    # Measurements and the queue-saturation mechanism: docs/ci/ci-and-reviews.md.
    types: [in_progress, completed]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to refresh"
        required: true
        type: string
      sha:
        description: "Expected current pull request head SHA"
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  # pull_request_target runs are the only readiness runs that surface as a
  # CheckRun in the PR's status rollup. If they share a cancelling group -- with
  # the workflow_run burst OR with each other -- a superseded PT run is marked
  # "cancelled" by GitHub, and that cancelled check then shows on the PR even
  # though the authoritative "PR Readiness" commit status is fine (this is the
  # "canceled at the end of CI" symptom: a workflow_run:completed fires as CI
  # finishes and collapses an in-flight PT run). GitHub always marks a
  # superseded run cancelled -- cancel-in-progress:true kills the in-flight one,
  # and false still cancels the pending one -- so the only way a PT run never
  # shows cancelled is to keep it out of any group that can cancel it. Each PT
  # run therefore gets its own isolated group and always resolves to a real
  # conclusion (success / failure / skipped), never cancelled. The evaluate and
  # publish steps are idempotent and stale-SHA guarded, so un-collapsed PT runs
  # on superseded revisions simply no-op green. workflow_run / workflow_dispatch
  # runs do NOT appear in the rollup, so they keep the cheap per-revision burst
  # collapse via cancel-in-progress. A workflow_run burst collapses on
  # (head repository, head branch, head SHA) and NOT on the PR number, because
  # `workflow_run.pull_requests` is empty whenever the head repository is a
  # fork -- keying on it degraded every fork burst to one group per run. That
  # triple identifies the same PR, since only one open PR can exist per source
  # repository + branch.
  group: >-
    ${{
      github.event_name == 'pull_request_target'
      && format('pr-readiness-pt-{0}', github.run_id)
      || github.event_name == 'workflow_dispatch'
      && format('pr-readiness-wd-{0}-{1}', inputs.pr, inputs.sha)
      || format('pr-readiness-wr-{0}-{1}-{2}',
           github.event.workflow_run.head_repository.full_name
             || github.run_id,
           github.event.workflow_run.head_branch || '',
           github.event.workflow_run.head_sha
             || github.run_id)
    }}
  cancel-in-progress: true

jobs:
  readiness:
    name: Publish readiness signal
    # This gate MUST NOT consult `workflow_run.pull_requests`: that array is
    # empty whenever the head repository is a fork, so requiring a number in it
    # skipped every fork PR's re-evaluation. A fork PR's verdict was then only
    # ever computed by the pull_request_target run -- which fires BEFORE the
    # monitored workflows exist -- and the commit status stayed pending forever
    # with no later event able to recompute it. The head SHA is the fork-safe
    # key, and the step below resolves it to a PR (skipping cleanly when no
    # open PR owns it), so admitting every pull_request run is correct and the
    # non-PR events are already excluded by the event check.
    #
    # `workflow_run.event == 'workflow_run'` is admitted so the Stage-2 fork AI
    # reviewers (fork-*-review.yml, themselves triggered by CI's workflow_run)
    # re-trigger this job when they complete -- that is how a fork PR's verdict
    # refreshes to "passed" once its reviews land. Which workflows can fire this
    # is already fenced by the `on.workflow_run.workflows` allowlist above.
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.event == 'pull_request'
      || github.event.workflow_run.event == 'dynamic'
      || github.event.workflow_run.event == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Transient network/TLS errors between the runner and api.github.com can
      # abort a single-shot `gh` call, and under `set -e` that ended the whole
      # evaluation before the publish step could run -- leaving a permanently
      # red check unrelated to actual readiness (issue #2753: the same commit
      # evaluated green then red 39 seconds apart with nothing pushed). Every
      # READ-ONLY gh call below now goes through this bounded helper: 3
      # attempts with short backoff, mirroring the bounded-attempts convention
      # in publish-installer.yml. Stdout is buffered per attempt so a failed
      # attempt's partial output (e.g. an aborted --paginate stream) never
      # leaks into a pipe. WRITE calls are deliberately NOT retried here; the
      # label writes have their own narrow race tolerance (see drop_label /
      # ensure_label), and a lost-response retry of a DELETE outside that
      # tolerance would turn an applied change into a new failure.
      - name: Install bounded retry helper for read-only gh calls
        run: |
          cat > "$RUNNER_TEMP/gh-retry.sh" <<'HELPER'
          # `timeout` is GNU coreutils: present on the runner, ABSENT on macOS by
          # default -- and these step scripts are extracted and executed verbatim
          # by test_pr_readiness_evaluate.py / _publish.py, so they have to run
          # there too. Missing, `timeout` makes every call exit 127, `gh_retry`
          # reads that as a transient failure, and the lane publishes `pending`
          # for a reason that has nothing to do with the PR under test.
          #
          # Resolved once here rather than at each call site, so the 120s bound
          # also has a single definition. Falling back to UNBOUNDED is deliberate:
          # a call with no ceiling is a weaker guarantee than a bounded one, but a
          # far better answer than treating the tool's absence as the request
          # having failed. Written for bash 3.2, which is what macOS ships.
          bounded() {
            if command -v timeout >/dev/null 2>&1; then
              timeout 120 "$@"
            elif command -v gtimeout >/dev/null 2>&1; then
              gtimeout 120 "$@"
            else
              "$@"
            fi
          }

          gh_retry() {
            local attempt out err rc=1
            for attempt in 1 2 3; do
              # `bounded` caps a HANGING attempt (gh applies no HTTP request
              # timeout of its own); rc 124 is just another retryable failure.
              if out="$(bounded "$@" 2>"$RUNNER_TEMP/gh-retry-err")"; then
                cat "$RUNNER_TEMP/gh-retry-err" >&2
                printf '%s\n' "$out"
                return 0
              else
                rc=$?
              fi
              err="$(cat "$RUNNER_TEMP/gh-retry-err" 2>/dev/null || true)"
              printf '%s\n' "$err" >&2
              # A non-429 HTTP 4xx is a PERMANENT request error (renamed
              # workflow file, missing scope, bad endpoint): retrying cannot
              # fix it, and calling it "transient" would misdiagnose a
              # misconfiguration as network trouble. Return a distinct code
              # immediately so callers can fail loud instead of publishing a
              # pending "could not be evaluated" verdict forever.
              # EXCEPTION: GitHub's primary/secondary rate limits surface as
              # HTTP 403 with rate-limit text in the body -- those are
              # transient exactly like a 429 and must be retried, not failed.
              if grep -Eq 'HTTP 4[0-9][0-9]' <<<"$err" \
                && ! grep -q 'HTTP 429' <<<"$err" \
                && ! grep -Eiq 'rate limit|abuse detection' <<<"$err"; then
                echo "gh_retry: permanent HTTP error (no retry): $*" >&2
                return 22
              fi
              echo "gh_retry: attempt $attempt/3 failed (rc=$rc): $*" >&2
              if [ "$attempt" -lt 3 ]; then
                sleep $(( attempt * 2 ))
              fi
            done
            return "$rc"
          }
          HELPER

      - name: Resolve current pull request revision
        id: context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr }}
          INPUT_SHA: ${{ inputs.sha }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_HEAD_REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/gh-retry.sh"
          case "$EVENT" in
            workflow_dispatch) PR="$INPUT_PR"; EXPECTED_SHA="$INPUT_SHA" ;;
            workflow_run)
              PR="$RUN_PR"
              EXPECTED_SHA="$RUN_SHA"
              # `workflow_run.pull_requests` is empty for a fork head AND for
              # the managed `dynamic` CodeQL runs, so it can never be the only
              # way in. Resolve the PR from the immutable head SHA instead.
              #
              # NOT via `repos/{repo}/commits/{sha}/pulls`: that endpoint only
              # lists PRs whose head commit is reachable in THIS repo, and a
              # fork PR's head commit is not reachable from any base-repo
              # branch until it merges -- so it returns empty for every OPEN
              # fork PR, skipping every re-evaluation and freezing the fork
              # verdict at the `opened` snapshot (a premature red). Match the
              # head SHA against the open-PR list instead: a PR object always
              # carries its `head.sha` regardless of which repo the commit
              # lives in, so this resolves fork and same-repo heads alike.
              #
              # A head SHA is not by itself unique -- two open PRs can point at
              # the same commit (e.g. the same fork commit pushed to two
              # branches). Disambiguate with the triggering run's head
              # repository + branch (both populated on every workflow_run),
              # exactly as the verdict step binds monitored runs below; fall
              # back to SHA-only when either is absent.
              if [ -z "$PR" ]; then
                PR="$(gh_retry gh api --paginate \
                  "repos/$REPO/pulls?state=open&per_page=100" \
                  | jq -rs \
                      --arg sha "$RUN_SHA" \
                      --arg repo "$RUN_HEAD_REPO" \
                      --arg ref "$RUN_HEAD_REF" '
                      first(.[][]
                        | select(.head.sha == $sha
                                 and ($repo == "" or .head.repo.full_name == $repo)
                                 and ($ref  == "" or .head.ref == $ref))
                        | .number) // empty
                    ')"
              fi
              if [ -z "$PR" ]; then
                {
                  echo "state=SKIP"
                  echo "stale=true"
                } >> "$GITHUB_OUTPUT"
                echo "No open pull request currently has workflow head $RUN_SHA."
                exit 0
              fi
              ;;
            pull_request_target) PR="$EVENT_PR"; EXPECTED_SHA="$EVENT_SHA" ;;
            *) echo "::error::unsupported event: $EVENT"; exit 1 ;;
          esac

          pr_json="$(gh_retry gh pr view "$PR" --repo "$REPO" \
            --json number,state,isDraft,isCrossRepository,baseRefName,headRefName,headRefOid,headRepository,headRepositoryOwner,url)"
          SHA="$(jq -r '.headRefOid' <<<"$pr_json")"
          STATE="$(jq -r '.state' <<<"$pr_json")"
          # The default branch is where CI / Build / CodeQL are gated to run
          # (`pull_request: branches: [<default>]` and CodeQL default-setup).
          # A PR whose base is any other branch -- a stacked PR sitting on
          # another feature branch -- can never start those lanes, so the
          # verdict step marks them ineligible instead of pending-forever.
          DEFAULT_BRANCH="$(gh_retry gh api "repos/$REPO" --jq '.default_branch')"

          {
            echo "pr=$PR"
            echo "sha=$SHA"
            echo "state=$STATE"
            echo "fork=$(jq -r '.isCrossRepository' <<<"$pr_json")"
            echo "draft=$(jq -r '.isDraft' <<<"$pr_json")"
            echo "url=$(jq -r '.url' <<<"$pr_json")"
            echo "base=$(jq -r '.baseRefName' <<<"$pr_json")"
            echo "default_branch=$DEFAULT_BRANCH"
            # (head repository, head branch) is how a monitored workflow run is
            # bound back to this PR below. Both fields are populated on a fork
            # run, unlike `pull_requests`.
            echo "head_repo=$(jq -r '
              "\(.headRepositoryOwner.login)/\(.headRepository.name)"
            ' <<<"$pr_json")"
            echo "head_ref=$(jq -r '.headRefName' <<<"$pr_json")"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$EXPECTED_SHA" ] && [ "$EXPECTED_SHA" != "$SHA" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "Ignoring stale $EVENT event for $EXPECTED_SHA; PR #$PR is now at $SHA."
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove readiness labels from closed pull request
        if: steps.context.outputs.stale != 'true' && steps.context.outputs.state != 'OPEN'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.context.outputs.pr }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/gh-retry.sh"

          # A peer run of this workflow can remove the same label between our
          # snapshot and our DELETE, and a label that is already gone has
          # reached the state we wanted. Treat only that 404 as success; any
          # other failure is still a failure.
          drop_label() {
            local label="$1" encoded out
            encoded="$(jq -rn --arg value "$label" '$value | @uri')"
            if out="$(gh api --method DELETE \
              "repos/$REPO/issues/$PR/labels/$encoded" 2>&1)"; then
              return 0
            fi
            if grep -q 'HTTP 404' <<<"$out"; then
              echo "Label '$label' was already removed by a concurrent run."
              return 0
            fi
            printf '%s\n' "$out" >&2
            return 1
          }

          current="$(gh_retry gh api "repos/$REPO/issues/$PR/labels" --paginate --jq '.[].name')"
          for label in \
            "readiness: checking" \
            "readiness: action required" \
            "readiness: maintainer review" \
            "readiness: passed"; do
            if grep -Fxq "$label" <<<"$current"; then
              drop_label "$label"
            fi
          done

      # The disposition gate below runs a repository script, so the bytes it
      # executes must come from TRUSTED code -- this workflow is
      # pull_request_target and holds write tokens, so checking out the PR head
      # would hand a contributor arbitrary execution with them. Pin the DEFAULT
      # BRANCH explicitly rather than relying on the per-event default ref
      # (base branch for pull_request_target, default branch for workflow_run):
      # one visible ref is what makes the trust boundary reviewable.
      # github.event.repository is absent on some payloads, so fall back to
      # github.ref_name, which is the default branch on those triggers.
      # sparse-checkout keeps this to the one script directory, and
      # persist-credentials: false leaves no token in the worktree -- nothing
      # here runs git against the remote.
      - name: Check out the disposition evaluator from the default branch
        if: steps.context.outputs.stale != 'true' && steps.context.outputs.state == 'OPEN'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch || github.ref_name }}
          sparse-checkout: src/kiro_crew/builtin_skills/kirocrew-dev/prepare-pr/scripts
          persist-credentials: false

      # Issue #6658: the one-lane / one-rationale-per-finding disposition rule
      # was mechanical only for a writer running the prepare-pr loop, so a
      # writer who skips that loop could post a blanket single-rationale
      # `target=gpt` record that codex-review.yml's adjudication ledger admits
      # with full downgrade power while nothing on the merge path objected.
      # Evaluating it here binds every writer, because this job publishes the
      # repository's only required status.
      #
      # The evaluation is NOT reimplemented in shell: `--disposition-gate` runs
      # the same `disposition_violations` the local gate calls, over the same
      # records the ledger admits, so the rule keeps ONE definition instead of
      # gaining a workflow-side fourth copy of the grammar.
      #
      # This step must never fail the job. A failed step skips the publish step
      # below, which leaves the required status pending with no further event to
      # recompute it on an unchanged commit -- the permanent-pending failure
      # mode this workflow is written around. So: no `set -e`, every outcome
      # becomes an output, and an unreadable record set becomes `ok=false`,
      # which the evaluation reads as WAITING, never as a red.
      #
      # Cost, stated plainly: this is the repository's highest-dispatch
      # workflow, and the gate adds a shallow sparse checkout plus one comment
      # read (and one permission call per distinct disposition author, which on
      # a PR with no disposition comments is zero). It cannot be skipped on a
      # cheap precondition, because deciding whether a disposition comment
      # exists means reading the comment list and matching the marker prefix --
      # a fourth reading of the grammar, which is the thing #6658 exists to
      # avoid. The per-revision concurrency group already collapses the
      # workflow_run burst, so the added work lands roughly once per head
      # update per uncollapsed event, not once per monitored workflow.
      - name: Evaluate disposition records
        id: dispositions
        if: steps.context.outputs.stale != 'true' && steps.context.outputs.state == 'OPEN'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.context.outputs.pr }}
          SHA: ${{ steps.context.outputs.sha }}
          GATE: ${{ github.workspace }}/src/kiro_crew/builtin_skills/kirocrew-dev/prepare-pr/scripts/pr_status.py
        run: |
          set -uo pipefail

          ok=false
          violations=""
          if [ ! -f "$GATE" ]; then
            # The evaluator moved or the sparse checkout missed it. Report
            # UNKNOWN so readiness waits and says why, rather than reporting a
            # clean rule from a check that never ran.
            echo "pr-readiness: disposition evaluator not found at $GATE" >&2
          elif out="$(python3 "$GATE" --disposition-gate \
                --repo "$REPO" --pr "$PR" --head "$SHA")"; then
            echo "pr-readiness: disposition gate -- $out"
            if [ "$(jq -r '.ok' <<<"$out" 2>/dev/null)" = "true" ]; then
              ok=true
              violations="$(jq -r '.violations[]' <<<"$out" 2>/dev/null || true)"
            else
              echo "pr-readiness: disposition gate could not evaluate: $(jq -r '.error' <<<"$out" 2>/dev/null)" >&2
            fi
          else
            # stderr above is deliberately NOT suppressed: the gate turns every
            # expected failure into ok=false JSON, so reaching here means the
            # interpreter itself failed and the traceback is the only diagnosis.
            echo "pr-readiness: disposition gate did not run (exit $?)" >&2
          fi

          # Random heredoc delimiter per GitHub's own guidance for multi-line
          # outputs: the violation text is charset-limited (logins, span ids,
          # lane names) and newline-flattened by the gate, so this is belt and
          # braces rather than the only guard.
          delim="EOF_$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          {
            echo "ok=$ok"
            echo "violations<<$delim"
            printf '%s\n' "$violations"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Evaluate current revision
        id: verdict
        if: steps.context.outputs.stale != 'true' && steps.context.outputs.state == 'OPEN'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.context.outputs.pr }}
          SHA: ${{ steps.context.outputs.sha }}
          HEAD_REPO: ${{ steps.context.outputs.head_repo }}
          HEAD_REF: ${{ steps.context.outputs.head_ref }}
          DRAFT: ${{ steps.context.outputs.draft }}
          FORK: ${{ steps.context.outputs.fork }}
          BASE_REF: ${{ steps.context.outputs.base }}
          DEFAULT_BRANCH: ${{ steps.context.outputs.default_branch }}
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_ACTION: ${{ github.event.action }}
          # From the disposition step above. Empty DISPOSITION_OK means the step
          # did not run at all, which contributes nothing -- the step's own `if`
          # matches this one's, and test_pr_readiness_dispositions.py pins the
          # wiring so a rename cannot silently disable the gate.
          DISPOSITION_OK: ${{ steps.dispositions.outputs.ok }}
          DISPOSITION_VIOLATIONS: ${{ steps.dispositions.outputs.violations }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/gh-retry.sh"

          # Set when a read-only API call keeps failing after the bounded
          # retries: the verdict is then UNKNOWN, not red -- see the explicit
          # non-terminal branch after the evaluation loop.
          transport_failed=false

          # CI, Build and CodeQL only ever run for a PR whose base is the
          # default branch: ci.yml / build.yml declare `pull_request:
          # branches: [<default>]`, and CodeQL default-setup only scans PRs
          # into the default branch. A stacked PR (base is another feature
          # branch) therefore never starts those workflows, so the head SHA
          # carries no run for them. Counting a run that structurally cannot
          # exist as "(not started)" froze such a PR at pending forever, with
          # no future event able to recompute it. Mark them ineligible on a
          # non-default base instead -- the same "Not eligible" treatment the
          # fork lane gives CodeQL. This is not a coverage hole: when the
          # bottom PR of the stack merges, GitHub auto-retargets this PR to the
          # default branch and CI/Build/CodeQL then run over the combined diff
          # before anything can reach the default branch.
          stacked=false
          if [ -n "$DEFAULT_BRANCH" ] && [ "$BASE_REF" != "$DEFAULT_BRANCH" ]; then
            stacked=true
          fi

          workflow_specs=()
          skipped=()

          if [ "$stacked" = "true" ]; then
            skipped+=("CI (only runs on PRs to $DEFAULT_BRANCH)")
            skipped+=("Fast Gate (only runs on PRs to $DEFAULT_BRANCH)")
            skipped+=("Build (only runs on PRs to $DEFAULT_BRANCH)")
          else
            workflow_specs+=(
              "ci.yml|CI"
              # Fast Gate carries the same `branches:` filter as CI, so it belongs
              # in this carve-out for the same reason: on a stacked PR it never
              # starts, and a lane that reads "(not started)" freezes the verdict
              # at pending forever.
              "fast-gate.yml|Fast Gate"
              "build.yml|Build"
            )
          fi

          # Code Review and the AI reviewers trigger on `pull_request` with no
          # base-branch filter, so they run on every PR regardless of base.
          workflow_specs+=("code-review.yml|Code Review")

          if [ "$FORK" = "true" ]; then
            # A fork head cannot run the repository's managed default-setup
            # CodeQL, so that lane stays ineligible. The AI code reviews DO run
            # on forks: the privileged Stage-2 fork-*-review.yml pipeline fires
            # on CI completion from the default branch and posts a check-run
            # named exactly like the same-repo lane ("Opus 4.8 Review", etc.).
            # Read those results from the head SHA's check-runs (checkrun:
            # specs) so a fully-reviewed green fork can reach "passed" instead
            # of being forced to a maintainer-review verdict.
            skipped+=("CodeQL (fork PR)")
            workflow_specs+=(
              "checkrun:Opus 4.8 Review|Opus 4.8 Review"
              "checkrun:GPT 5.6 Review|GPT 5.6 Review"
              "checkrun:Design Review|Design Review"
              "checkrun:UX Review|UX Review"
              "checkrun:First Principles Review|First Principles Review"
            )
          else
            if [ "$stacked" = "true" ]; then
              skipped+=("CodeQL (only runs on PRs to $DEFAULT_BRANCH)")
            else
              workflow_specs+=("dynamic/github-code-scanning/codeql|CodeQL")
            fi
            workflow_specs+=(
              "claude-review.yml|Opus 4.8 Review"
              "codex-review.yml|GPT 5.6 Review"
              "design-review.yml|Design Review"
              "ux-review.yml|UX Review"
              "first-principles-review.yml|First Principles Review"
            )
          fi
          passed=()
          pending=()
          failed=()
          # A fork run with conclusion `action_required` was created but never
          # executed: only a maintainer can approve it. Keep that condition out
          # of `failed[]` so the verdict attributes the block correctly, and
          # out of `pending[]` because automation cannot clear it by itself.
          awaiting_approval=()

          for spec in "${workflow_specs[@]}"; do
            file="${spec%%|*}"
            label="${spec#*|}"
            if [[ "$file" == checkrun:* ]]; then
              # Fork AI-review lane: the verdict lives in the head SHA's
              # check-runs, not a PR-bound workflow run (the fork reviewer runs
              # via workflow_run from the default branch, so its workflow-run
              # head ref does not bind back to the fork). The same-repo lane
              # publishes a DIFFERENT name on a fork, but the GPT lane posts
              # several passes under this one -- so collapse ALL check-runs
              # of this name: any still running -> pending; any failure-class
              # -> fail; else any success/neutral -> pass; only skipped (the
              # real review has not posted yet) -> pending.
              cname="${file#checkrun:}"
              enc="$(jq -rn --arg v "$cname" '$v | @uri')"
              cruns="$(gh_retry gh api --method GET \
                "repos/$REPO/commits/$SHA/check-runs?check_name=$enc&per_page=100")" || {
                rc=$?
                # 22 = permanent HTTP error (misconfiguration): fail loud so it
                # is diagnosed, never diluted into "transient network trouble".
                if [ "$rc" -eq 22 ]; then exit 1; fi
                transport_failed=true
                break
              }
              total="$(jq '.check_runs | length' <<<"$cruns")"
              incomplete="$(jq '[.check_runs[]
                | select(.status != "completed")] | length' <<<"$cruns")"
              fail="$(jq '[.check_runs[]
                | select(.status == "completed"
                    and (.conclusion | IN("failure","timed_out","cancelled",
                                           "action_required","stale",
                                           "startup_failure")))] | length' <<<"$cruns")"
              pass="$(jq '[.check_runs[]
                | select(.status == "completed"
                    and (.conclusion | IN("success","neutral")))] | length' <<<"$cruns")"
              if [ "$total" -eq 0 ] || [ "$incomplete" -gt 0 ]; then
                pending+=("$label (not started)")
              elif [ "$label" = "Design Review" ] || [ "$label" = "UX Review" ] || [ "$label" = "First Principles Review" ]; then
                # Design, UX and First Principles all BLOCK on a real BLOCK
                # verdict, so a contributor cannot merge past a design judged
                # wrong, an experience judged broken/misleading, or a surface
                # judged unjustified. Safe to treat a failure as a blocker
                # because each fork-*-review.yml fails the check ONLY on BLOCK
                # -- an errored, throttled or verdict-less run resolves NEUTRAL
                # and exits 0 -- so `failure` here can only mean a judged-wrong
                # verdict, never infrastructure noise. NOTE: `/ai-review
                # override` records the judgment and re-runs the Stage-2 fork
                # lane (located via the run URL its check-run carries), but the
                # fork lanes consume no override marker, so the re-run is a
                # fresh review roll -- a fork false BLOCK clears via a clean
                # re-roll or a new commit, never a forced pass -- identical to
                # the fork Opus / GPT / Design lanes, which already block a
                # fork PR the same way.
                if [ "$fail" -gt 0 ]; then
                  failed+=("$label (BLOCK)")
                elif [ "$pass" -gt 0 ]; then
                  passed+=("$label")
                else
                  pending+=("$label (not started)")
                fi
              elif [ "$fail" -gt 0 ]; then
                failed+=("$label (failure)")
              elif [ "$pass" -gt 0 ]; then
                passed+=("$label")
              else
                pending+=("$label (not started)")
              fi
              continue
            fi
            if [ "$file" = "dynamic/github-code-scanning/codeql" ]; then
              runs="$(gh_retry gh api --method GET \
                "repos/$REPO/actions/runs?event=dynamic&head_sha=$SHA&per_page=100")" || {
                rc=$?
                if [ "$rc" -eq 22 ]; then exit 1; fi
                transport_failed=true
                break
              }
              # Collapse to one run -- newest by monotonic id. Full rationale
              # on the pull_request branch below; the two collapses must stay
              # identical.
              run="$(jq -c --arg path "$file" '
                [.workflow_runs[] | select(.path == $path)]
                | max_by(.id) // empty
              ' <<<"$runs")"
            else
              runs="$(gh_retry gh api --method GET \
                "repos/$REPO/actions/workflows/$file/runs?event=pull_request&head_sha=$SHA&per_page=100")" || {
                rc=$?
                if [ "$rc" -eq 22 ]; then exit 1; fi
                transport_failed=true
                break
              }
              # Bind the run to this PR by (head repository, head branch), NOT
              # by `.pull_requests`: that array is empty on every fork run, so
              # filtering on it matched nothing and reported each already-green
              # workflow as "(not started)" -- a permanent pending verdict. The
              # query is already pinned to this exact head SHA, and only one
              # open PR can exist per source repository + branch.
              # Collapse to one run on the monotonic run id, never on
              # created_at: that timestamp has one-second granularity, and two
              # runs of the same workflow on the same head routinely share a
              # second (e.g. a workflow that fires on both synchronize and
              # edited). jq's sort_by is stable and the API returns runs
              # newest-first, so a created_at sort left same-second ties in
              # API order and `last` picked the OLDEST run -- when that run
              # was concurrency-cancelled, a lane whose newest run succeeded
              # read as a blocking failure. max_by(.id) orders same-second
              # runs correctly because ids increase monotonically, and it is
              # sufficient on its own: a concurrency-cancelled twin is always
              # superseded by a same-head run with a HIGHER id, so the newest
              # run is never the cancelled duplicate. Deliberately NO
              # cancelled-run filter here: dropping a cancelled newest run
              # would revive an older verdict -- a manually cancelled rerun
              # must read failure-class, not resurface a stale green.
              run="$(jq -c --arg head_repo "$HEAD_REPO" --arg head_ref "$HEAD_REF" '
                [.workflow_runs[]
                 | select(.head_repository.full_name == $head_repo
                          and .head_branch == $head_ref)]
                | max_by(.id) // empty
              ' <<<"$runs")"
            fi
            if [ -z "$run" ]; then
              pending+=("$label (not started)")
              continue
            fi

            status="$(jq -r '.status // ""' <<<"$run")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
            if [ "$status" != "completed" ]; then
              pending+=("$label ($status)")
            else
              if [ "$file" = "dynamic/github-code-scanning/codeql" ]; then
                case "$conclusion" in
                  success|skipped) passed+=("$label") ;;
                  *) failed+=("$label ($conclusion)") ;;
                esac
              elif [ "$label" = "Design Review" ] || [ "$label" = "UX Review" ] || [ "$label" = "First Principles Review" ]; then
                # Design, UX and First Principles all BLOCK on a real BLOCK
                # verdict. The "gates on BLOCK" step exits 0 for PASS/CONCERNS,
                # the Dependabot skip, and any overloaded/throttled/verdict-less
                # run, so those never fail the run -- a `failure` conclusion is
                # therefore almost always a judged-wrong verdict. One residual:
                # a HARD model-step error (OIDC / action crash) has no
                # continue-on-error, so it also fails the run and reddens the
                # lane. That is rare, deliberate (a review that never ran must
                # not read as green), identical to the Design / Opus / GPT
                # lanes, and cleared by a one-comment `/ai-review override`
                # (current-SHA scoped) -- so treating a `failure` as a blocker
                # is safe. (The fork reader below never sees this: fork
                # *-review.yml maps a hard error to a NEUTRAL check-run.)
                case "$conclusion" in
                  success|neutral|skipped) passed+=("$label") ;;
                  *) failed+=("$label (BLOCK)") ;;
                esac
              else
                case "$conclusion" in
                  success|neutral) passed+=("$label") ;;
                  # A workflow-level skip stays NON-BLOCKING -- the paths filters
                  # skip lanes on purpose, so failing here would redden ordinary
                  # PRs -- but it is reported as "Not eligible" rather than folded
                  # into the passed count. Counting it as passed made an absent
                  # matrix leg indistinguishable from a green one, which is exactly
                  # how a platform nobody builds for reads as covered. `skipped[]`
                  # feeds only the summary, never the verdict.
                  skipped) skipped+=("$label (skipped)") ;;
                  action_required)
                    if [ "$FORK" = "true" ]; then
                      awaiting_approval+=("$label")
                    else
                      # On an upstream branch this conclusion is anomalous,
                      # so retain the failure-class diagnostic.
                      failed+=("$label ($conclusion)")
                    fi
                    ;;
                  *) failed+=("$label ($conclusion)") ;;
                esac
              fi
            fi
          done

          # A read that still fails after the bounded retries is a TRANSPORT
          # failure: this revision's verdict is UNKNOWN, not red. Publish an
          # explicit non-terminal "could not be evaluated" verdict (a pending
          # status under the existing "readiness: checking" label) instead of
          # exiting non-zero, so the publish step still runs and the job never
          # leaves a red check for a network blip. This deliberately does NOT
          # weaken the gate: pending blocks merge exactly like failure does,
          # and only a transport error with NO already-observed blocker takes
          # this branch -- a genuine failure or maintainer-approval wait
          # recorded by an earlier lane dominates (the array guards below),
          # falling through to the normal action-required verdict, so a known
          # red is never masked by a later lane's network trouble. Recovery is
          # automatic -- the self-heal
          # sweep re-fires any pending readiness status older than its
          # staleness window, and any later monitored-workflow event recomputes
          # sooner.
          if [ "$transport_failed" = "true" ] \
            && [ "${#failed[@]}" -eq 0 ] \
            && [ "${#awaiting_approval[@]}" -eq 0 ]; then
            # The tiebreaker for every ambiguous case is an asymmetry:
            # publishing "pending" can only ever BLOCK a merge, never allow
            # one, so pending is the fail-safe write whenever validation
            # state is unknown. Concretely: if the SHA already carries a
            # BLOCKING verdict (failure/error), this truncated run defers --
            # the merge is already held, and overwriting the red with
            # pending would only discard its diagnostics and set the sweep
            # re-firing. Every other case publishes pending: an existing
            # SUCCESS must not be left mergeable when a rerun's validation
            # state is unknown (the green may be stale -- that is the unsafe
            # direction); an UNREADABLE verdict state gets the same
            # treatment, because the worst a pending can do to an unseen
            # verdict is block a merge that a re-evaluation will unblock;
            # and pending-over-pending / no-status just refresh the
            # self-heal sweep's staleness clock.
            existing_state="$(bounded gh api "repos/$REPO/commits/$SHA/status" \
              --jq '[.statuses[] | select(.context == "PR Readiness")][0].state // empty' \
              2>/dev/null)" || existing_state="__unreadable__"
            if [ "$existing_state" = "failure" ] || [ "$existing_state" = "error" ]; then
              {
                echo "state=deferred"
                echo "status_state="
              } >> "$GITHUB_OUTPUT"
              {
                echo "### PR Readiness: deferred to an existing blocking verdict"
                echo
                echo "- PR: #$PR"
                echo "- Revision: \`$SHA\`"
                echo
                echo "This run's evaluation was truncated by a GitHub API"
                echo "failure, but the revision already carries a blocking"
                echo "readiness verdict (\`$existing_state\`) from another run."
                echo "The merge is already held; overwriting that verdict with"
                echo "pending would only discard its diagnostics, so nothing"
                echo "was published."
              } > "$RUNNER_TEMP/pr-readiness-summary.md"
              exit 0
            fi
            {
              echo "state=could_not_evaluate"
              echo "label=readiness: checking"
              echo "status_state=pending"
              echo "description=Readiness could not be evaluated (transient GitHub API failure); it will be re-evaluated"
            } >> "$GITHUB_OUTPUT"
            {
              echo "### PR Readiness: could not be evaluated"
              echo
              echo "- PR: #$PR"
              echo "- Revision: \`$SHA\`"
              echo
              echo "A read-only GitHub API call kept failing after bounded"
              echo "retries, so this revision's verdict is unknown -- not red."
              echo "A non-terminal \`pending\` status was published; the"
              echo "self-heal sweep or the next monitored-workflow event will"
              echo "re-evaluate it."
            } > "$RUNNER_TEMP/pr-readiness-summary.md"
            exit 0
          fi

          # A pull_request_target open/synchronize/reopen/edit run is meant to
          # surface a transient "checking" signal while validation spins up.
          # But such a run can be runner-queue-delayed by many minutes and
          # execute AFTER the workflow_run:completed runs have already published
          # the terminal verdict for this same SHA. Seeding this sentinel
          # unconditionally would then clobber that decided verdict back to
          # "checking" with no further event left to recompute it on the
          # unchanged commit -- freezing the status at pending indefinitely.
          # Only add it when the live evaluation above still found at least one
          # monitored workflow genuinely incomplete; in that case the verdict is
          # already pending and the sentinel is merely a human-readable note.
          # (A legitimate reviewer re-run arrives via workflow_run and shows up
          # as an in_progress workflow above, so it keeps producing "checking"
          # through this same real-pending path.)
          case "$TRIGGER_EVENT:$TRIGGER_ACTION" in
            pull_request_target:opened|pull_request_target:synchronize|pull_request_target:reopened|pull_request_target:edited)
              if [ "${#pending[@]}" -gt 0 ]; then
                pending+=("validation runs are starting")
              fi
              ;;
          esac

          # (The long-term "Arbiter — judge from comments" gate was retired: its
          # one-way-door / long-term-reversibility lens now lives in Design
          # Review. Readiness no longer waits on any API-owned external check.)

          # Disposition-rule enforcement (issue #6658). A violation is a
          # condition waiting cannot fix -- only the author editing or deleting
          # the comment can -- so it belongs in `failed`, alongside a red lane.
          # `ok=false` means the record set could not be established, which is
          # UNKNOWN and therefore `pending`: a transient comments/permission API
          # failure must never red the required status (issue #2753's class).
          case "${DISPOSITION_OK:-}" in
            true)
              while IFS= read -r violation; do
                [ -n "$violation" ] || continue
                failed+=("disposition rule: $violation")
              done <<<"${DISPOSITION_VIOLATIONS:-}"
              ;;
            false)
              pending+=("disposition records could not be read")
              ;;
          esac

          blockers=()
          waiting=()
          if [ "${#failed[@]}" -gt 0 ]; then
            blockers=("${failed[@]}")
          fi
          if [ "${#pending[@]}" -gt 0 ]; then
            waiting=("${pending[@]}")
          fi
          if [ "$DRAFT" = "true" ]; then
            waiting+=("pull request is a draft")
          fi

          if [ "${#blockers[@]}" -gt 0 ] || [ "${#awaiting_approval[@]}" -gt 0 ]; then
            state="action_required"
            label="readiness: action required"
            status_state="failure"
            if [ "${#blockers[@]}" -gt 0 ] && [ "${#awaiting_approval[@]}" -gt 0 ]; then
              description="${#blockers[@]} blocking readiness item(s); ${#awaiting_approval[@]} awaiting maintainer approval"
            elif [ "${#blockers[@]}" -gt 0 ]; then
              description="${#blockers[@]} blocking readiness item(s)"
            else
              description="${#awaiting_approval[@]} workflow(s) awaiting maintainer approval"
              if [ "${#passed[@]}" -eq 0 ] && [ "$transport_failed" = "false" ]; then
                description="$description; none has run yet"
              fi
            fi
          elif [ "${#waiting[@]}" -gt 0 ]; then
            state="checking"
            label="readiness: checking"
            status_state="pending"
            description="${#waiting[@]} readiness check(s) still pending"
          else
            # Fork PRs reach this branch too: the AI code reviews run on forks
            # via the Stage-2 fork-*-review.yml pipeline and are evaluated above
            # from the head SHA's check-runs, so a fully-green fork is fully
            # validated (CodeQL is the only ineligible lane, listed as a
            # non-blocking "Not eligible" note) and earns "passed" like any
            # same-repo PR.
            state="passed"
            label="readiness: passed"
            status_state="success"
            description="Eligible automated validation passed for this revision"
          fi

          # Diagnostic-only: the lane arrays are only ever readable from
          # $GITHUB_STEP_SUMMARY, which `gh run view --log` cannot query --
          # so a run that publishes a wrong pending/failed verdict (e.g. a
          # lane invisible under GITHUB_TOKEN but visible under a user token)
          # can only be diagnosed by opening the summary UI by hand (#3550).
          # Plain `echo` here lands in the job's own log instead, so
          # `gh run view --log | grep 'pr-readiness: lane state'` finds it.
          echo "pr-readiness: lane state -- passed=[${passed[*]:-}] pending=[${pending[*]:-}] failed=[${failed[*]:-}] skipped=[${skipped[*]:-}] awaiting_approval=[${awaiting_approval[*]:-}]"

          {
            echo "state=$state"
            echo "label=$label"
            echo "status_state=$status_state"
            echo "description=$description"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### PR Readiness: ${state//_/ }"
            echo
            echo "- PR: #$PR"
            echo "- Revision: \`$SHA\`"
            echo "- Passed components: ${#passed[@]}"
            if [ "${#skipped[@]}" -gt 0 ]; then
              echo
              echo "**Not eligible**"
              printf -- "- %s\n" "${skipped[@]}"
            fi
            if [ "${#awaiting_approval[@]}" -gt 0 ]; then
              echo
              echo "**Awaiting maintainer approval**"
              printf -- "- %s\n" "${awaiting_approval[@]}"
              echo
              echo "> GitHub created these fork runs but has not executed them."
              echo "> A maintainer must approve them; the contributor cannot"
              echo "> clear this condition."
            fi
            if [ "${#blockers[@]}" -gt 0 ]; then
              echo
              echo "**Blocking**"
              printf -- "- %s\n" "${blockers[@]}"
            fi
            if [ "${#waiting[@]}" -gt 0 ]; then
              echo
              echo "**Waiting**"
              printf -- "- %s\n" "${waiting[@]}"
            fi
            # Reached with transport_failed=true only via the fall-through
            # above (an already-observed blocker dominates the pending
            # fallback): the arrays stopped filling at the break, so say so --
            # otherwise the summary silently reads as a complete evaluation.
            if [ "$transport_failed" = "true" ]; then
              echo
              echo "> Evaluation was truncated by a GitHub API failure before"
              echo "> every lane could be read; the verdict above is computed"
              echo "> from the lanes read so far and will be recomputed"
              echo "> automatically."
            fi
          } > "$RUNNER_TEMP/pr-readiness-summary.md"

      - name: Publish status and label
        if: steps.context.outputs.stale != 'true' && steps.context.outputs.state == 'OPEN'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.context.outputs.pr }}
          SHA: ${{ steps.context.outputs.sha }}
          URL: ${{ steps.context.outputs.url }}
          TARGET_LABEL: ${{ steps.verdict.outputs.label }}
          STATUS_STATE: ${{ steps.verdict.outputs.status_state }}
          DESCRIPTION: ${{ steps.verdict.outputs.description }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/gh-retry.sh"
          # A truncated evaluation that deferred to an existing terminal
          # verdict emits no status_state: there is nothing safe to publish.
          if [ -z "$STATUS_STATE" ]; then
            echo "Evaluation deferred to an existing verdict on $SHA; publishing nothing."
            exit 0
          fi
          current_sha="$(gh_retry gh pr view "$PR" --repo "$REPO" --json headRefOid --jq '.headRefOid')"
          if [ "$current_sha" != "$SHA" ]; then
            echo "Ignoring publish for stale revision $SHA; PR #$PR is now at $current_sha."
            exit 0
          fi

          # The commit status IS the verdict, and `PR Readiness` is the only
          # required status check on protected branches, so it is published
          # FIRST and on its own. The labels below are advisory decoration; a
          # cosmetic label call must never be in a position to decide whether
          # the required check reports anything at all.
          #
          # This POST is deliberately NOT retried. A commit status is
          # last-write-wins per SHA+context, GitHub offers no conditional
          # write, and two runs can evaluate the SAME revision concurrently
          # (see the concurrency comment above) -- so ANY retry races a
          # concurrent run's newer verdict: between whatever guard read a
          # retry could take and its re-POST, another run can publish, and
          # the re-POST would republish this run's verdict over it (a stale
          # green over a fresh red, or a pending over a terminal). Three
          # successive guard designs ("any status exists", compare-and-swap
          # on the status id, fail-safe reads) each narrowed but could not
          # close that window -- the API gives no atomic primitive to close
          # it with. A failed POST therefore fails the step loud instead:
          # the run shows red with an actionable error, a re-run (or the
          # next monitored-workflow event) re-evaluates and republishes,
          # and no verdict is ever silently overwritten. The POST is
          # bounded (gh applies no HTTP timeout of its own).
          jq -n \
            --arg state "$STATUS_STATE" \
            --arg target_url "$URL" \
            --arg description "$DESCRIPTION" \
            '{
              state: $state,
              target_url: $target_url,
              description: $description,
              context: "PR Readiness"
            }' > "$RUNNER_TEMP/readiness-status.json"
          if ! bounded gh api --method POST "repos/$REPO/statuses/$SHA" \
            --input "$RUNNER_TEMP/readiness-status.json" >/dev/null; then
            echo "::error::Failed to publish the readiness status for $SHA." \
              "The POST is not retried (a retry can overwrite a concurrent" \
              "run's newer verdict); re-run this workflow to re-evaluate" \
              "and republish."
            exit 1
          fi

          # Two runs can evaluate the SAME revision concurrently: each
          # pull_request_target run gets its own concurrency group keyed on
          # run_id, which keeps a superseded run from showing as cancelled and
          # leaves two runs on one revision racing each other's labels. Both
          # races below end in the state this run wanted, so neither is an
          # error -- but nothing wider than those two is tolerated.
          drop_label() {
            local label="$1" encoded out
            encoded="$(jq -rn --arg value "$label" '$value | @uri')"
            if out="$(gh api --method DELETE \
              "repos/$REPO/issues/$PR/labels/$encoded" 2>&1)"; then
              return 0
            fi
            if grep -q 'HTTP 404' <<<"$out"; then
              echo "Label '$label' was already removed by a concurrent run."
              return 0
            fi
            printf '%s\n' "$out" >&2
            return 1
          }

          ensure_label() {
            local name="$1" color="$2" description="$3" out
            if out="$(gh label create "$name" --repo "$REPO" \
              --color "$color" --description "$description" 2>&1)"; then
              return 0
            fi
            if grep -qi 'already exists' <<<"$out"; then
              echo "Label '$name' was already created by a concurrent run."
              return 0
            fi
            printf '%s\n' "$out" >&2
            return 1
          }

          label_specs=(
            "readiness: checking|BFDADC|Automated validation is still running"
            "readiness: action required|D73A4A|A blocking check or review needs attention"
            "readiness: passed|0E8A16|Eligible automated validation passed for the current revision"
          )
          existing_labels="$(gh_retry gh label list --repo "$REPO" --limit 200 --json name --jq '.[].name')"
          for spec in "${label_specs[@]}"; do
            name="${spec%%|*}"
            rest="${spec#*|}"
            color="${rest%%|*}"
            description="${rest#*|}"
            if ! grep -Fxq "$name" <<<"$existing_labels"; then
              ensure_label "$name" "$color" "$description"
            fi
          done

          current="$(gh_retry gh api "repos/$REPO/issues/$PR/labels" --paginate --jq '.[].name')"
          for label in \
            "readiness: checking" \
            "readiness: action required" \
            "readiness: maintainer review" \
            "readiness: passed"; do
            if [ "$label" != "$TARGET_LABEL" ] && grep -Fxq "$label" <<<"$current"; then
              drop_label "$label"
            fi
          done
          if ! grep -Fxq "$TARGET_LABEL" <<<"$current"; then
            jq -n --arg label "$TARGET_LABEL" '{labels: [$label]}' \
              | gh api --method POST "repos/$REPO/issues/$PR/labels" \
                  --input - >/dev/null
          fi

          cat "$RUNNER_TEMP/pr-readiness-summary.md" >> "$GITHUB_STEP_SUMMARY"
