name: Fast Gate

# The cheap, blocking gates, split out of ci.yml so two consumers can key on
# them BEFORE the expensive matrix runs.
#
# Two things depend on this workflow finishing first:
#   1. ci.yml's `await-fast-gate` job, which the heavy jobs need -- so a red gate
#      skips the matrix instead of racing it.
#   2. The fork-*-review.yml lanes, which trigger on this workflow's completion.
#      Waiting for all of CI would put a fork PR's AI verdict ~54 minutes out
#      (CI's median wall clock) when the gates it actually needs are green
#      after one or two.
#
# Three jobs, not one per gate. The fourteen stdlib-only gates share one
# `source-gates` job and run as consecutive steps: each costs seconds of real
# work, and as separate jobs ~70% of their job-seconds went to runner
# acquisition and checkout while every one of them held a runner slot of its
# own. Fourteen slots per push on a repository that pushes ~1,400 times a day
# is most of this workflow's concurrency footprint, and the two pytest-backed
# ratchet jobs below (uv install plus pytest) are the long pole of the run, so
# running the stdlib gates in sequence adds no wall clock to the verdict the
# two consumers wait on. The gate steps carry `if: ${{ !cancelled() }}` so a
# red gate does not hide the gates after it: the job fails, and every failing
# gate is named in the same run.
#
# The pull_request filter matches ci.yml's, including `branches: [main]`: the
# fork reviewers key on this workflow, so a wider filter here would newly review
# fork PRs opened against a non-main base -- which today get no review at all,
# because they wait on a CI run that ci.yml's own branch filter never starts.
# Widening that is a separate decision from moving the gates.
#
# The gates run on every push to main as well, but do the work only while the
# repository variable MERGE_QUEUE_ENABLED is unset: that is when a push to main
# runs ci.yml's full matrix, whose `await-fast-gate` consumes this push run.
# With the variable set the push run still exists but every job here skips,
# because the merge group already established these gates for the exact tree
# that landed, and ci.yml's `await-fast-gate` skips on that path too. So on
# the queue-on push path neither this workflow nor ci.yml requests a fleet
# slot; what still does is build.yml's seconds-long `desktop-matrix` resolver
# and main-ratchet-audit.yml's gates (heal-exempt in the runner watchdog).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # ci.yml's `await-fast-gate` waits on this workflow's run for the merge
  # group's commit, so the gates must run there.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  # Same rule as ci.yml: a PR only needs a verdict on its tip commit, so PRs
  # share a group per ref; a push to main gets a group per commit only while
  # the repository variable MERGE_QUEUE_ENABLED is 'true' (each landed commit
  # then gets exactly one verdict), and otherwise the per-ref group as today
  # (one running plus one pending, a later push evicts the pending one); a
  # merge group's ref is unique to the group. Divergence from ci.yml here would
  # let a superseded gate run outlive the CI run that is waiting on it.
  group: ${{ github.event_name == 'push' && vars.MERGE_QUEUE_ENABLED == 'true' && format('{0}-{1}', github.workflow, github.sha) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-gates:
    name: Source Gates
    # Skipped on a push to main only while the repository variable
    # MERGE_QUEUE_ENABLED is 'true': the merge group ran every gate here on
    # this exact tree, and ci.yml's `await-fast-gate` skips on that path too.
    # With the variable unset a push to main runs every gate. The same clause
    # sits on every job in this file, so the queue-on push run is all-skipped.
    if: github.event_name != 'push' || vars.MERGE_QUEUE_ENABLED != 'true'
    # CodeBuild-hosted runner pilot (docs/ci/ci-and-reviews.md), the same
    # routing decision ci.yml's `changes` job resolves into a `linux_runner`
    # output -- but no gate job here may carry a `needs:` or any `if:` beyond
    # the one push/variable clause every job shares (see
    # test_fast_gate_barrier.py's test_every_gate_skips_only_the_queued_push),
    # so the label is computed inline from `github.*` and `vars.*` instead of
    # a sibling job's output. Only admitted actors on same-repository PRs and
    # merge groups request the fleet. Missing CODEBUILD_ACTOR_IDS,
    # unlisted actors and forks fall back to `ubuntu-latest` without skipping
    # a gate. The AWS webhook independently enforces actor admission; this
    # expression controls availability, not the security boundary.
    runs-on: ${{ github.repository == 'kirodotdev/KiroCrew' && contains(fromJSON(vars.CODEBUILD_ACTOR_IDS || '[]'), github.actor_id) && (github.event_name == 'push' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize') && github.event.pull_request.head.repo.full_name == github.repository)) && format('codebuild-kirocrew-gha-linux-{0}-{1}', github.run_id, github.run_attempt) || github.repository == 'kirodotdev/KiroCrew' && 'kirocrew-linux-4-core' || 'ubuntu-latest' }}
    # Fourteen gates of a few seconds each, plus one checkout and one Python
    # setup. A green run is well under five minutes; the cap is a hang
    # backstop, not a budget.
    timeout-minutes: 15
    steps:
      # persist-credentials retained: the diff-scoped gate steps run `git fetch
      # origin` against the same remote, through the shared diff-base resolver
      # script.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Each gate step runs unless the run was cancelled, so one red gate does
      # not hide the verdicts of the gates after it. Every gate runs its own
      # self-test first: a gate that has silently stopped matching reads as a
      # green signal, which is worse than no gate.

      - name: Verify _vendor tree against the committed sha256 manifest
        if: ${{ !cancelled() }}
        # Blocking gate: fails on any modified, missing, or added file under
        # src/kiro_crew/_vendor relative to scripts/vendor_manifest.sha256.
        # Legitimate vendored bumps regenerate the manifest with --write (see
        # src/kiro_crew/_vendor/README.md) so the change lands as a reviewable
        # manifest diff. Deliberately NOT path-filtered: everything under
        # src/kiro_crew/_vendor is excluded from semgrep and the AI reviewers'
        # diff, so this checksum gate is the only content review the vendored
        # tree gets. Hashing the ~26MB tree takes seconds, and an always-on
        # step cannot be dodged by a path-filter edge case.
        run: python3 scripts/verify_vendor_manifest.py

      - name: Check the product name on the lines this change adds
        if: ${{ !cancelled() }}
        # Diff-scoped on purpose. The tree still carries thousands of prose lines
        # that join the two words, from before the convention, so a whole-tree
        # gate would fail every PR until one enormous rename lands and charge the
        # break to whoever pushed next. Added lines are complete for regression —
        # a line only reaches main through a diff that added it — and the
        # whole-tree number is still printed as a non-failing report.
        env:
          BRAND_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
        run: |
          BRAND_BASE_REF="$(bash "$GITHUB_WORKSPACE/.github/scripts/resolve-i18n-base.sh" \
            "$BRAND_BASE_REF" 'the brand-name gate')" || exit 1
          export BRAND_BASE_REF
          # Self-test first: it plants one probe per rule family, so a typo that
          # silently disables an exemption fails here instead of shipping green.
          python3 scripts/check_brand_name.py --test
          python3 scripts/check_brand_name.py

      - name: Check comments on the lines this change adds
        if: ${{ !cancelled() }}
        # Diff-scoped on purpose, like the brand-name gate above. A comment must
        # not narrate change history -- PR/issue numbers, review rounds, commit
        # SHAs, "previously", "no longer", "we now" (code-style.md). The tree
        # still carries thousands of such lines from before the convention, so
        # only the lines this change ADDS are judged: that is complete for
        # regression, needs no shared baseline file for every cleanup PR to
        # fight over, and is the one set a contributor can act on.
        env:
          COMMENT_HISTORY_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
        run: |
          COMMENT_HISTORY_BASE_REF="$(bash "$GITHUB_WORKSPACE/.github/scripts/resolve-i18n-base.sh" \
            "$COMMENT_HISTORY_BASE_REF" 'the comment-history gate')" || exit 1
          export COMMENT_HISTORY_BASE_REF
          # Self-test first: one probe per rule family, so a typo that silently
          # disables a rule fails here instead of shipping green.
          python3 scripts/check_comment_history.py --test
          python3 scripts/check_comment_history.py

      - name: Check the focus cues on the elements this change touches
        if: ${{ !cancelled() }}
        # Diff-scoped on purpose, same reasoning as the brand gate above: the tree
        # still carries elements that opted out of the focus outline before the
        # global ring existed, so a whole-tree gate would charge that backlog to
        # whoever pushed next. Elements a change touched are complete for
        # regression — a hole only reaches main through a diff that wrote its
        # className — and the whole-tree number is still printed as a non-failing
        # report.
        env:
          FOCUS_CUE_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
        run: |
          FOCUS_CUE_BASE_REF="$(bash "$GITHUB_WORKSPACE/.github/scripts/resolve-i18n-base.sh" \
            "$FOCUS_CUE_BASE_REF" 'the focus-cue gate')" || exit 1
          export FOCUS_CUE_BASE_REF
          # Self-test first: it plants one probe per rule family, so a change that
          # silently promotes a suppressor to a cue — or disables an exemption —
          # fails here instead of shipping a gate that passes everything.
          python3 scripts/check_focus_cue.py --test
          python3 scripts/check_focus_cue.py

      - name: Check the feature map covers the features this change adds
        if: ${{ !cancelled() }}
        # Structural, not line-scoped, and that is the whole design. A feature
        # arrives as a FILE appearing under the pages or handlers tree, or a route
        # entry appearing in the router — so those are what demand a map row.
        # Editing an existing page is how a feature changes BEHAVIOR, which the map
        # deliberately does not describe, so an edit-only diff never fires. A gate
        # that asked for a map review on every UI fix would produce a map nobody
        # reads. Contract: docs/feature-map/README.md
        env:
          FEATURE_MAP_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
        run: |
          FEATURE_MAP_BASE_REF="$(bash "$GITHUB_WORKSPACE/.github/scripts/resolve-i18n-base.sh" \
            "$FEATURE_MAP_BASE_REF" 'the feature-map gate')" || exit 1
          export FEATURE_MAP_BASE_REF
          # Self-test first: it plants one probe per trigger rule, so a widened or
          # narrowed rule fails here instead of shipping a gate that asks for a map
          # update on every edit — or never asks at all.
          python3 scripts/check_feature_map.py --test
          python3 scripts/check_feature_map.py

      - name: Check that shipped changelog sections survived this change
        if: ${{ !cancelled() }}
        # CHANGELOG.md is append-only history: every section already in it
        # describes software a user has installed, so a line deleted from one is
        # unrecoverable from that user's artifact. This has already happened
        # once — a commit titled "docs: add 0.3.0-insider.9 changelog" REPLACED
        # the file instead of prepending to it (53 insertions, 322 deletions),
        # taking [0.2.0], [0.1.3] and [0.1.2] with it. It read as plausible in
        # review because the insertions are what a reader looks at, and the
        # deletions sat in the same hunk. Nothing failed; a user noticed the
        # Releases page had gone nearly empty.
        #
        # So the judgment half of the rule (commit dumps, prerelease headings,
        # whether this PR should touch the file at all) stays in AUTOSDE.yaml
        # where a reviewer applies it, and the mechanical half runs here, where
        # nobody has to notice anything. release.yml's stable gate is the
        # complement: it checks the NEW section exists, not that the old ones
        # survived — which is the half that actually failed.
        env:
          CHANGELOG_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
        run: |
          CHANGELOG_BASE_REF="$(bash "$GITHUB_WORKSPACE/.github/scripts/resolve-i18n-base.sh" \
            "$CHANGELOG_BASE_REF" 'the changelog-history gate')" || exit 1
          export CHANGELOG_BASE_REF
          # Self-test first: one probe per rule family, so a weakened rule fails
          # here instead of shipping green and letting a deletion through.
          python3 scripts/check_changelog_history.py --test
          python3 scripts/check_changelog_history.py

      - name: Check that every recorded decision survived this change
        if: ${{ !cancelled() }}
        # docs/decisions/ holds the team's decisions, one immutable file each.
        # An edit or a deletion there silently rewrites what was decided, and
        # it reads as plausible in review because the reviewer looks at what
        # was added. A change of mind is a NEW entry naming the one it
        # supersedes, so the only legal ledger diff is additions. The
        # judgment half (does this PR reverse a recorded decision?) is the
        # recorded-decisions-are-not-regressions rule in AUTOSDE.yaml; the
        # mechanical half runs here.
        env:
          DECISIONS_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
        run: |
          DECISIONS_BASE_REF="$(bash "$GITHUB_WORKSPACE/.github/scripts/resolve-i18n-base.sh" \
            "$DECISIONS_BASE_REF" 'the decision-ledger-history gate')" || exit 1
          export DECISIONS_BASE_REF
          # Self-test first, so a weakened rule fails here instead of shipping
          # green and letting a rewrite through.
          python3 scripts/check_decisions_history.py --test
          python3 scripts/check_decisions_history.py

      - name: Check for this repository's markers in shipped skill bodies
        if: ${{ !cancelled() }}
        # Everything under src/kiro_crew/builtin_skills/ installs on every
        # machine that installs Kiro Crew, so a skill body naming THIS
        # repository -- its GitHub slug, a src/ checkout path, a test file, a
        # workflow file -- is an instruction that resolves for one user and
        # points an agent at a path that does not exist for everyone else.
        # kirocrew-prepare-pr already solved it properly: repository specifics live in a
        # profile keyed by repository, so the body stays portable. The
        # kirocrew-dev/ family is exempt by directory (matched directly beneath
        # builtin_skills/, so a nested or look-alike name cannot inherit it),
        # because this repository is its subject matter rather than a leak.
        # Product surface (the kirocrew CLI, ~/.kiro/crew paths, config keys) is
        # deliberately NOT a marker -- see the script docstring for why the set
        # is narrow, and for the repository paths it knowingly does not cover.
        # No baseline: the tree's only two markers were fixed here, so the rule
        # is absolute and no marker is exempted by record.
        run: |
          # Self-test first: one probe per marker class, both sides of the
          # exemption, and the undecodable-file path, so a rule that silently
          # stops matching fails here instead of shipping green.
          python3 scripts/check_builtin_skill_scope.py --test
          python3 scripts/check_builtin_skill_scope.py

      - name: Check for bare module-global asyncio primitives
        if: ${{ !cancelled() }}
        # An asyncio.Lock/Event/Queue created at module scope binds to the
        # import-time (or first-use) event loop and raises RuntimeError when
        # acquired from another loop (Python 3.10+). #4800 converted every
        # module-global lock to kiro_crew.loop_lock.LoopBoundLock; this gate
        # keeps the declaration form of the class extinct (the registry form
        # — dicts holding lazily-created locks — is a review concern; see the
        # script docstring). Whole-tree, not diff-scoped: the backlog is zero
        # after the conversion, so there is nothing to charge to whoever
        # pushes next.
        run: |
          # Self-test first: it plants one probe per rule family, so a rule
          # that silently stops matching fails here instead of shipping green.
          python3 scripts/check_loop_bound_locks.py --test
          python3 scripts/check_loop_bound_locks.py

      - name: Check that every pytest test file sits under a collected root
        if: ${{ !cancelled() }}
        # setup.cfg pins `testpaths`, so a test_*.py file created outside those
        # roots is silently never run — green by omission — and rots against
        # the code it claims to cover (#6577: twelve files sat uncollected in a
        # root-level tests/ dir). Whole-tree, not diff-scoped: the backlog is
        # zero after #6577's move, so there is nothing to charge to whoever
        # pushes next. Nested distributions with their own pyproject/setup.cfg
        # and marker-exempted manual scripts are excluded; see the script
        # docstring.
        run: |
          # Self-test first: it plants one probe per rule family, so a rule
          # that silently stops matching fails here instead of shipping green.
          python3 scripts/check_testpaths_coverage.py --test
          python3 scripts/check_testpaths_coverage.py

      - name: Check that no test reaches the repository through the working directory
        if: ${{ !cancelled() }}
        # A structural test that reads the repository's own source has to name a
        # file, and a bare relative literal names it against whatever directory
        # the process started in. Launched from anywhere but the root, that read
        # raises FileNotFoundError before a single assertion runs — a failure that
        # says nothing about the behaviour the test pins. Whole-tree, not
        # diff-scoped: the backlog is zero, so there is nothing to charge to
        # whoever pushes next. A file that changes directory itself is skipped,
        # and a single access can carry a `# cwd-ok:` reason; see the script
        # docstring.
        run: |
          # Self-test first: it plants one probe per rule family, in both
          # directions, so a rule that silently stops matching — or starts
          # matching a legitimate relative read — fails here instead of
          # shipping green.
          python3 scripts/check_cwd_relative_repo_reads.py --test
          python3 scripts/check_cwd_relative_repo_reads.py

      - name: Check harness identity tests on the lines this change adds
        if: ${{ !cancelled() }}
        # Kiro Crew drives one first-class harness (kiro-cli) and adapts the
        # others. The defect class is a call site that spells "this is kiro" as
        # the ABSENCE of another harness: correct with two backends, and then it
        # hands the third a capability or a sandbox waiver nobody granted it.
        # It fails toward the permissive answer, so nothing else goes red.
        #
        # Diff-scoped for the same reason as the brand gate above: the tree
        # carries pre-existing negative tests in the dormant claude seam, and
        # converting them is a separate change with its own review. Added lines
        # are complete for regression, and the whole-tree count is still printed
        # as a non-failing report. Invariants:
        # docs/system-specs/modules/harness-parity.md
        env:
          HARNESS_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
        run: |
          HARNESS_BASE_REF="$(bash "$GITHUB_WORKSPACE/.github/scripts/resolve-i18n-base.sh" \
            "$HARNESS_BASE_REF" 'the harness-parity gate')" || exit 1
          export HARNESS_BASE_REF
          # Self-test first: it plants one probe per rule, so a regex typo that
          # silently disables a rule fails here instead of shipping green.
          python3 scripts/check_harness_parity.py --test
          python3 scripts/check_harness_parity.py

      - name: Check that memory-context call sites name their store
        if: ${{ !cancelled() }}
        # A named memory store is a separate SQLite silo. A build_message /
        # build_session_context call site that does not name one reads whatever
        # the resolver defaults to -- the operator's own `default` store -- for a
        # crew that configured otherwise, and nothing goes red: the prompt is
        # well-formed and the content is plausible. Deriving the store from
        # `agent=` is the same failure with a plausible-looking cause, because
        # that argument carries a kiro-cli modeId from a namespace disjoint from
        # cfg.agents.
        #
        # Diff-scoped for the same reason as the harness gate above, and only
        # until the last call site is converted: a whole-tree gate would charge
        # the remaining backlog to whoever pushed next. The backlog is printed as
        # a non-failing report and pinned by test/test_memory_store_seam.py.
        env:
          MEMSTORE_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
        run: |
          MEMSTORE_BASE_REF="$(bash "$GITHUB_WORKSPACE/.github/scripts/resolve-i18n-base.sh" \
            "$MEMSTORE_BASE_REF" 'the memory-store-seam gate')" || exit 1
          export MEMSTORE_BASE_REF
          # Self-test first: it plants one probe per rule, so a walk that stopped
          # matching fails here instead of shipping a gate that passes everything.
          python3 scripts/check_memory_store_seam.py --test
          python3 scripts/check_memory_store_seam.py

      - name: Verify the docs linter's own checks still fire
        if: ${{ !cancelled() }}
        # Self-test first: a gate that has silently stopped detecting anything is
        # worse than no gate, because it reads as a green signal. Each check is
        # exercised against a planted defect in a throwaway tree.
        run: python3 scripts/docs_lint.py --test

      - name: Lint documentation trees
        if: ${{ !cancelled() }}
        # Blocking gate: every internal link resolves, every doc is reachable from
        # its directory index, every directory holding docs has one, no code comment
        # cites a doc that does not exist, no doc cites a source LINE past the end of
        # the file it names, no module spec names a source file that exists nowhere,
        # and no doc whose filename is hardcoded in code has been renamed out from
        # under its consumer.
        # Stdlib-only checks still use the project's pinned Python runtime.
        run: ./scripts/docs-lint.sh

  static-ratchets:
    # Exact-set / exact-count ratchets that read only source text and ASTs.
    # In 2026-09 they failed 1,206 times across PR and main runs, and
    # each red arrived only after a 20-40 min backend shard (Linux shards 4/7,
    # Windows shards 4/7/8). Here they answer in about a minute on the PR head
    # and, through merge_group, on the integrated tree. They stay in the
    # backend shards too; this job only moves the verdict earlier.
    name: Static Ratchet Gate
    if: github.event_name != 'push' || vars.MERGE_QUEUE_ENABLED != 'true'
    runs-on: ${{ github.repository == 'kirodotdev/KiroCrew' && contains(fromJSON(vars.CODEBUILD_ACTOR_IDS || '[]'), github.actor_id) && (github.event_name == 'push' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize') && github.event.pull_request.head.repo.full_name == github.repository)) && format('codebuild-kirocrew-gha-linux-{0}-{1}', github.run_id, github.run_attempt) || github.repository == 'kirodotdev/KiroCrew' && 'kirocrew-linux-4-core' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            setup.cfg
      - name: Install dependencies
        run: uv pip install --system -e . --group dev
      # Same boundary as backend-test: on a CodeBuild root runner it registers
      # the toolcache libpython and installs jq 1.7 and lsof, which the
      # ratchets' sanitized subprocesses need, and runs pytest as an
      # unprivileged user. Without it the fleet-routing poll tests ran into
      # their 60 s subprocess timeout on the fleet (run 37412794799).
      - uses: ./.github/actions/run-as-runner
      - name: Run the source-only ratchets
        shell: /usr/local/bin/ci-shell {0}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # setup-python's matcher reads any traceback as an error annotation;
          # remove it before pytest, as every other pytest job does.
          echo "::remove-matcher owner=python::"
          python -m pytest -q -n 4 --no-cov \
            test/test_error_code_contract.py \
            test/test_crew_log_exc_info_sites.py \
            test/test_pid_reader_ratchet.py \
            test/test_ci_fleet_routing_expression_parity.py \
            test/test_security_posture.py \
            test/test_backend_cards.py \
            test/test_fold_catalogue.py

  flake-pattern-ratchet:
    # test/test_flake_pattern_ratchet.py holds every test file a change touches
    # to its own count of flake-shaped sites at the change's merge-base. It also
    # runs in the backend shards (depth-2 checkout), but that verdict arrives
    # after a 20-40 min shard, and a shard whose base is unreadable warns
    # `compared nothing` and passes. Here the ratchet answers in about a minute,
    # ahead of the matrix, and a run that compared nothing is red, not green.
    # The ratchet itself is a static scan: a git diff plus the changed files. The
    # last two steps are the exception: they run the changed test files (warn only)
    # and publish the report.
    name: Flake Pattern Ratchet
    if: github.event_name != 'push' || vars.MERGE_QUEUE_ENABLED != 'true'
    runs-on: ${{ github.repository == 'kirodotdev/KiroCrew' && contains(fromJSON(vars.CODEBUILD_ACTOR_IDS || '[]'), github.actor_id) && (github.event_name == 'push' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize') && github.event.pull_request.head.repo.full_name == github.repository)) && format('codebuild-kirocrew-gha-linux-{0}-{1}', github.run_id, github.run_attempt) || github.repository == 'kirodotdev/KiroCrew' && 'kirocrew-linux-4-core' || 'ubuntu-latest' }}
    # 15, not 10: the warn-only network step below may use up to 5 minutes of its
    # own after the ratchet, and the job cap must not turn that into a red job.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Depth 2, not the default 1: the commit this run checks out is a
          # merge commit (the PR merge ref, or the merge queue's candidate),
          # and depth 2 brings in both parents with their trees. The first
          # parent IS the base the tree was merged onto, which is what the
          # ratchet's own resolver reads, so no second fetch and no env.
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            setup.cfg
      - name: Install dependencies
        run: uv pip install --system -e . --group dev
      # Same boundary as static-ratchets: setup actions under the runner
      # identity, pytest through ci-shell as an unprivileged user.
      - uses: ./.github/actions/run-as-runner
      - name: Run the flake-pattern ratchet against this change's base
        shell: /usr/local/bin/ci-shell {0}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "::remove-matcher owner=python::"
          # No FLAKE_RATCHET_BASE: scripts/ratchet_scope.py's resolver reads the
          # checked-out merge commit's first parent on a pull_request, push or
          # merge_group run, and depth 2 above is what makes it readable.
          # Self-test first, as every gate here does: the detectors' positive,
          # negative and mutation cases, and the base resolver's own cases.
          python -m pytest -q -n0 --no-cov test/test_flake_pattern_ratchet.py \
            --deselect test/test_flake_pattern_ratchet.py::test_no_changed_file_gains_a_flaky_shape
          # Then the ratchet itself. `-rA` surfaces its one stdout line, which
          # names the base it compared with; without a base it warns `compared
          # nothing` and PASSES, so that outcome is turned into a red here
          # rather than a green that checked nothing.
          LOG="$RUNNER_TEMP/flake-ratchet.log"
          python -m pytest -q -n0 --no-cov -rA \
            test/test_flake_pattern_ratchet.py::test_no_changed_file_gains_a_flaky_shape \
            2>&1 | tee "$LOG"
          if grep -q "compared nothing" "$LOG" || ! grep -q "^compared with " "$LOG"; then
            echo "::error::the flake-pattern ratchet found no base to compare with; this job exists to give it one, so a run that compared nothing is a failed gate, not a pass"
            exit 1
          fi
      # Warn-first network guard (testing-conventions D10). Runs only the test
      # files this change adds or changes with KIROCREW_NET_STRICT=1, so a file
      # that looks up or connects to a host other than loopback is named in the
      # job summary. This is the one step of the job that runs the pull
      # request's own test code, as the unprivileged ci-shell user, so it
      # cannot write $GITHUB_STEP_SUMMARY (run-as-runner protects the
      # file-command directory): it writes the report under $RUNNER_TEMP and the
      # next step publishes it. continue-on-error keeps both from failing this
      # job or the check; the script's exit code shows on the step. No changed
      # test file, a deleted one, or an unreadable base: it writes why and
      # exits 0. The file names come from the pull request, so the script
      # passes them to pytest as an argument list and no shell sees them.
      - name: Report network reach in the changed test files (warn only)
        continue-on-error: true
        timeout-minutes: 5
        shell: /usr/local/bin/ci-shell {0}
        env:
          PYTHONPATH: ${{ github.workspace }}
          NET_STRICT_REPORT: ${{ runner.temp }}/net-strict-report.md
        run: python scripts/net_strict_changed.py
      # Runs under the runner identity, which owns the summary file. It runs no
      # file from the workspace (the pull request controls those) and reads the
      # report without following a link, from a regular file only, at most 16
      # KiB, so test code that rewrote the path cannot make it publish anything
      # but text. `-I -S` starts the interpreter without site initialization and
      # without the working directory or any PYTHON* variable on the import path:
      # the editable install puts the workspace's src/ on the site path, and a
      # sitecustomize.py a test wrote there would otherwise run as this identity
      # before the checks below.
      - name: Publish the network report to the job summary
        if: always()
        continue-on-error: true
        run: |
          python3 -I -S - <<'PY'
          import os
          import stat

          path = os.path.join(os.environ["RUNNER_TEMP"], "net-strict-report.md")
          try:
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
          except OSError:
              raise SystemExit(0)
          with os.fdopen(fd, "rb") as handle:
              if not stat.S_ISREG(os.fstat(handle.fileno()).st_mode):
                  raise SystemExit(0)
              text = handle.read(16384).decode("utf-8", "replace")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write(text)
          PY
