name: Add Contributor

# Add the authors of merged pull requests, and the people who reported the issues
# those pull requests closed, to the README Contributors block.
# main is a protected branch, so this never commits directly -- it stages the
# README edit on a single rolling feature branch, opens (or updates) one PR, and
# arms GitHub auto-merge on it, like test-durations.yml. Auto-merge lets the
# rolling PR land without a manual click once the repo's own required checks +
# reviews pass; it never bypasses branch protection, so where protection requires
# a human approval GitHub still waits for it.
#
# Why bespoke instead of an off-the-shelf tool (all-contributors bot, a
# contrib.rocks embed): this repo's block is hand-curated with human display
# names, credits by rules this repo chose and can change (merged PRs and the
# issues they closed, not whatever an embed counts), preserves maintainer-added
# entries verbatim, and must honor an opt-out for removal requests. Those
# constraints are exactly what the generic tools do not give, which is why the ~1k
# lines here earn their keep -- do not replace this with the one-liner embed
# without re-checking all four. The all-contributors bot in particular has no
# discovery of its own: every entry there needs a human comment naming the person,
# which is the manual step this job exists to remove.
#
# Opening the PR is best-effort, not guaranteed: this repository does not allow
# GitHub Actions to open pull requests ("Allow GitHub Actions to create and
# approve pull requests" is off, which is a defensible setting because the same
# switch also grants APPROVING, and main's merge gate is a required review). The
# push always succeeds, so when `gh pr create` is refused the job keeps the run
# green and raises a handoff issue with a one-click compare link instead. Do not
# "fix" that by making the step fail again -- it did, daily, unnoticed for weeks.
#
# Trigger choice: a daily cron (plus manual dispatch), NOT pull_request_target.
# Each run re-derives the complete contributor set by paginating every merged PR
# (see below), so a per-merge trigger would do the exact same full
# sweep only sooner -- it buys at most 24h of immediacy while permanently carrying
# a write token in the trusted base-repo context, where any future edit that
# touched a PR's title, body, or head ref would inherit that privilege. A
# once-a-day batch also avoids force-pushing the rolling branch on every merge
# (which would reset its review approval and keep auto-merge from firing).
# Cron-only keeps the same result with a smaller, static risk surface.
#
# Why the rolling branch is rebuilt from base every run AND we enumerate ALL
# merged PRs: the branch is rebuilt from the
# protected branch each run so it never drifts or carries a stale conflict. A
# rebuild is only safe if the collection re-derives the COMPLETE set of people who
# should appear, so it paginates every merged PR -- not a
# recent-days window, which would silently drop someone whose contributors PR
# stayed open past the window while newer activity landed. The script dedups
# against the README (which already holds everyone previously credited), so
# scanning everything is cheap in effect: only genuinely-new contributors ever
# change the file.

on:
  schedule:
    # Daily: credit the previous day's merged-PR authors and the reporters of the
    # issues those PRs closed.
    - cron: "37 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write # only to open/update the failure-tracking issue (see last step)

concurrency:
  # One rolling branch, so serialize every run onto it -- do NOT cancel in
  # progress, or a run could be aborted mid-push and skip a rebuild.
  group: add-contributor
  cancel-in-progress: false

jobs:
  add:
    name: Add contributors to README
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Check out the default branch. github.event.repository is absent on
      # schedule/workflow_dispatch payloads, so fall back to github.ref_name
      # (the default branch on both triggers). We only read/write tracked files.
      # persist-credentials retained: add / "Open or update the contributors PR" runs git fetch + git push --force-with-lease against origin
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Collect merged-PR authors and the reporters they fixed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # One paginated GraphQL sweep over EVERY merged pull request yields both
          # sets of people this job credits:
          #
          #   1. the PR's own author, and
          #   2. the authors of the issues that PR declared it closes.
          #
          # Crediting issue REPORTERS this way, rather than by listing every
          # issue, is the whole point of the shape: `closingIssuesReferences` is
          # populated only when a pull request says it closes the issue (a
          # "Fixes #N" style link), and we only look at MERGED pull requests, so
          # an entry here is evidence the report actually changed the product.
          # Listing all issues instead would credit a duplicate, an invalid
          # report, or an issue opened purely to farm a contribution -- which is
          # exactly what this filter exists to keep out. The trade-off is a known
          # UNDERCOUNT: a real bug fixed by a PR that forgot the closing keyword
          # is not visible here, and the remedy is the manual --login path, not
          # loosening this to "any issue".
          #
          # Enumerate every merged PR, not a recent window: the branch is rebuilt
          # from base each run, so the collection must re-derive the COMPLETE set
          # or someone whose rolling PR outlived a bounded window would be
          # dropped. The script dedups against the README, so only genuinely-new
          # contributors ever change the file.
          #
          # Guard `author != null` first: a deleted account yields a null author,
          # and a bare filter would emit {login: null} and inject a
          # github.com/None entry. `__typename == "User"` then excludes bots
          # (dependabot, renovate, github-actions, ...), whose author type is
          # "Bot" -- the GraphQL analogue of REST's `.user.type == "User"`.
          #
          # `first: 50` on the nested connection is a cap, not a page: a single PR
          # closing more than 50 issues would truncate. None come close, and the
          # miss would be a missing credit, never a wrong one.
          gh api graphql --paginate \
            -f owner="${REPO%/*}" -f name="${REPO#*/}" \
            -f query='
              query($owner: String!, $name: String!, $endCursor: String) {
                repository(owner: $owner, name: $name) {
                  pullRequests(states: MERGED, first: 100, after: $endCursor,
                               orderBy: {field: UPDATED_AT, direction: DESC}) {
                    pageInfo { hasNextPage endCursor }
                    nodes {
                      author { login __typename }
                      closingIssuesReferences(first: 50) {
                        nodes { author { login __typename } }
                      }
                    }
                  }
                }
              }' \
            --jq '.data.repository.pullRequests.nodes[]' >/tmp/merged.jsonl

          jq -r 'select(.author != null and .author.__typename == "User")
                 | .author.login' /tmp/merged.jsonl | sort -u >/tmp/pr_logins.txt

          jq -r '.closingIssuesReferences.nodes[]?
                 | select(.author != null and .author.__typename == "User")
                 | .author.login' /tmp/merged.jsonl | sort -u >/tmp/issue_logins.txt

          # Union, deduped: someone who both authored a merged PR and reported a
          # fixed issue appears in both files and must be credited exactly once.
          # `sort -u` across both is the first of two dedup layers; the second is
          # the script's own README scan, which is what keeps a daily full rebuild
          # from ever duplicating an existing entry.
          sort -u /tmp/pr_logins.txt /tmp/issue_logins.txt >/tmp/logins.txt

          echo "Merged PRs scanned: $(wc -l </tmp/merged.jsonl)."
          echo "PR authors: $(wc -l </tmp/pr_logins.txt);" \
               "reporters of closed issues: $(wc -l </tmp/issue_logins.txt);" \
               "union: $(wc -l </tmp/logins.txt)."

          # A coarse set of logins already mentioned in the README, lowercased.
          # Used ONLY to skip the display-name lookup for people already
          # present, so a steady-state daily run makes ~0 extra API calls while
          # new entries still get the curated "Full Name" convention. The add/skip
          # decision itself is the script's job (precise regex); over-matching
          # here at worst falls a genuinely-new contributor back to login-as-name,
          # so this greedy grep needs no repo-link exclusion.
          #
          # The FIRST run after issue reporters were added is the one expensive
          # run: every reporter not already credited costs one users/<login>
          # lookup, roughly 90 of them on top of the ~40 GraphQL pages. That is
          # well inside GITHUB_TOKEN's hourly budget, and it happens once -- from
          # the next run on they are all in /tmp/known.txt.
          grep -oiE 'https?://(www\.)?github\.com/[A-Za-z0-9][A-Za-z0-9-]*' README.md \
            | sed -E 's#.*/##' | tr '[:upper:]' '[:lower:]' | sort -u >/tmp/known.txt

          # Build records. Name is passed via jq --arg (safe JSON encoding, never
          # shell-eval'd); the script validates the login and HTML-escapes the
          # name. `.name // .login` covers users with no display name set.
          : >/tmp/records.jsonl
          while IFS= read -r login; do
            [ -n "$login" ] || continue
            if grep -qixF "$login" /tmp/known.txt; then
              name="$login"
            else
              name="$(gh api "users/$login" --jq '.name // .login' 2>/dev/null || printf '%s' "$login")"
            fi
            jq -cn --arg l "$login" --arg n "$name" '{login: $l, name: $n}' >>/tmp/records.jsonl
          done </tmp/logins.txt
          jq -s '.' /tmp/records.jsonl >/tmp/records.json

          echo "Collected $(jq 'length' /tmp/records.json) candidate author(s)."

      - name: Update README
        id: update
        run: |
          set -euo pipefail
          python3 scripts/update_contributors.py </tmp/records.json
          if git diff --quiet -- README.md; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Open or update the contributors PR
        id: pr
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BRANCH=chore/add-contributors
          # Resolve the base from the repo itself, not the event payload -- the
          # payload's repository object is absent on schedule/dispatch runs, and
          # `gh pr create --base ""` would then fail.
          BASE="$(gh repo view "$REPO" --json defaultBranchRef --jq .defaultBranchRef.name)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rebuild the rolling branch from the current base each run so it never
          # drifts behind the protected branch or carries a stale conflict. The
          # collection above enumerates all merged authors, so the rebuild is
          # complete and loses none.
          git checkout -B "$BRANCH"
          git add README.md
          git commit -m "docs: add new contributors to README"

          # Skip the push when the rolling branch's TREE already matches the
          # remote branch's tip. Without this, rebuilding from a moved base each
          # day mints a new commit for identical content, and every force-push
          # dismisses the open PR's stale-review approvals and re-runs CI -- which
          # can perpetually starve auto-merge where a human approval is required.
          # Comparing trees (not commit SHAs) ignores the base rebase, so a push
          # happens only when the README content actually changed. Fetch the
          # remote branch first (absent on the first-ever run, hence `|| true`).
          git fetch origin "$BRANCH" 2>/dev/null || true
          remote_commit="$(git rev-parse --verify --quiet FETCH_HEAD || true)"
          if [ -n "$remote_commit" ] \
            && [ "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "$remote_commit^{tree}")" ]; then
            echo "Rolling branch tree unchanged; skipping push (no README delta since last run)."
            exit 0
          fi
          git push --force-with-lease origin "$BRANCH"

          if gh pr view "$BRANCH" --repo "$REPO" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "PR already open for $BRANCH; updated in place."
          else
            # `gh pr create` with GITHUB_TOKEN fails outright when the repository
            # (or its org) has "Allow GitHub Actions to create and approve pull
            # requests" turned OFF -- GitHub answers
            #   GraphQL: GitHub Actions is not permitted to create or approve
            #   pull requests (createPullRequest)
            # That setting is a single switch covering BOTH creating and
            # approving, so a repo whose merge gate is a required human approval
            # has a real reason to leave it off, and this job must not depend on
            # it being flipped. It only ever bites on the create path, which is
            # reached after the previous rolling PR merged and its branch was
            # deleted; when the PR is still open the branch above is enough.
            #
            # The push already succeeded, so the work is not lost: hand the
            # branch to a human instead of failing the run. Failing was the old
            # behaviour and it went unnoticed for weeks -- a daily red run that
            # nobody can act on trains people to ignore the signal, so keep the
            # run green here and raise a SEPARATE, actionable issue below.
            # Any other create failure is still a real error and must fail loud.
            rc=0
            out="$(gh pr create --repo "$REPO" --base "$BASE" --head "$BRANCH" \
              --title "docs: add new contributors to README" \
              --body "Automated update of the README Contributors block for authors of merged pull requests and the people who reported the issues those pull requests closed. Generated by the Add Contributor workflow (\`.github/workflows/add-contributor.yml\`); entries are inserted in sorted order and existing lines are preserved verbatim." 2>&1)" || rc=$?
            printf '%s\n' "$out"
            if [ "$rc" -ne 0 ]; then
              case "$out" in
                *"not permitted to create or approve pull requests"*)
                  compare="$GITHUB_SERVER_URL/$REPO/compare/$BASE...$BRANCH?expand=1"
                  echo "::notice::Branch $BRANCH is pushed and ready, but GitHub Actions may not open pull requests in this repository. Open it here: $compare"
                  echo "handoff=$compare" >>"$GITHUB_OUTPUT"
                  exit 0
                  ;;
                *)
                  exit "$rc"
                  ;;
              esac
            fi
          fi

          # Arm GitHub auto-merge so the rolling PR lands ONCE the repo's own
          # required checks + reviews pass. This never bypasses branch
          # protection -- GitHub still enforces every required gate. The entries
          # carry user-chosen display names and avatars, so a HUMAN review is the
          # safeguard against an offensive name/avatar reaching the front page:
          # main requires an approving review, so auto-merge waits for it. If a
          # repo ever drops that requirement, the human look goes with it -- keep
          # the required review, or drop this auto-merge step so the rolling PR
          # always waits for a manual merge. Non-fatal: if "Allow auto-merge" is
          # disabled or a branch rule forbids it, log and continue.
          if ! gh pr merge "$BRANCH" --repo "$REPO" --auto --squash; then
            echo "Could not arm auto-merge (allow-auto-merge disabled or blocked by a branch rule); PR remains open for manual merge."
          fi

      # Reached only when the branch is pushed and ready but Actions may not open
      # the pull request (see the create step). The run stays green, so this issue
      # is the whole signal -- it must carry the one-click compare link, and it
      # must say what a repo admin can change to make the job fully automatic
      # again. Deduped by a fixed title, and distinct from the failure issue
      # below: this one is a handoff, not a defect.
      - name: Hand the branch to a human when Actions may not open the PR
        if: steps.pr.outputs.handoff != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMPARE_URL: ${{ steps.pr.outputs.handoff }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Add Contributor needs a human to open the contributors PR"
          note="The \`chore/add-contributors\` branch is pushed with new README entries, but this repository does not allow GitHub Actions to open pull requests, so the job could not create it.

          **Open the pull request:** $COMPARE_URL

          Run: $RUN_URL

          To make this automatic again, a repo admin can enable Settings -> Actions -> General -> Workflow permissions -> \"Allow GitHub Actions to create and approve pull requests\". Note that this single switch also lets workflows APPROVE pull requests, which weakens a required-review merge gate -- leaving it off and opening this PR by hand is a legitimate choice, and the branch is always ready when you are."
          existing="$(gh issue list --repo "$REPO" --state open --search "in:title \"$TITLE\"" \
            --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$note"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$note"
          fi

      # A scheduled workflow that fails is easy to miss. If any step above failed
      # (e.g. the script fails loud on a corrupted, non-contiguous block), open or
      # update a single tracking issue so a human actually sees it. Deduped by a
      # fixed title so repeated daily failures do not spam new issues.
      - name: Surface failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Add Contributor workflow is failing"
          existing="$(gh issue list --repo "$REPO" --state open --search "in:title \"$TITLE\"" \
            --json number --jq '.[0].number // empty')"
          body="The scheduled \`add-contributor.yml\` run failed: $RUN_URL

          A common cause is the README Contributors block no longer being a single
          contiguous run of \`<a>\` entries (the script fails loud rather than
          corrupt it). Check the run log, fix the block, and re-run."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "Still failing: $RUN_URL"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$body"
          fi
