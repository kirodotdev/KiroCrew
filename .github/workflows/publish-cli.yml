name: Publish CLI (reusable)

# Reusable workflow: publish an already-built CLI wheel to a release channel.
# Called by nightly.yml today (and by beta-cut.yml / promote-stable.yml once
# those exist). See docs/RELEASE_AUTOMATION.md -> "CLI (Linux / EC2) Distribution".
#
# Key properties:
#   - CI-direct feed: writes feed/<channel>/latest-cli.json straight from CI.
#   - Never gated on CDSigner/notarization (Linux has no Gatekeeper), so a macOS
#     signing failure never blocks a CLI release.
#   - Publishes the wheel exactly as built; the manifest version is parsed from
#     the wheel filename so it always matches what pip will install.

on:
  workflow_call:
    inputs:
      channel:
        description: "Release channel: nightly | beta | stable"
        required: true
        type: string
      version:
        description: "Human-readable version label (informational; the wheel's own version is authoritative)"
        required: false
        type: string
        default: ""
      wheel_artifact:
        description: "Name of the uploaded artifact containing the wheel"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish-cli:
    name: Publish CLI wheel (${{ inputs.channel }})
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_SECRETS: ${{ secrets.AWS_SIGNING_ROLE_ARN != '' && 'true' || '' }}
      CHANNEL: ${{ inputs.channel }}
      VERSION_LABEL: ${{ inputs.version }}
    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.wheel_artifact }}
          path: cli-dist

      - name: Locate wheel and compute checksum
        id: wheel
        run: |
          set -euo pipefail
          WHEEL=$(find cli-dist -name '*.whl' | head -1)
          if [ -z "$WHEEL" ]; then
            echo "::error::No .whl found in artifact '${{ inputs.wheel_artifact }}'"
            exit 1
          fi
          WHEEL_DIR=$(dirname "$WHEEL")
          WHEEL_NAME=$(basename "$WHEEL")
          # PEP 427: wheel filename fields are '-'-separated and the distribution
          # name contains no '-', so the version is always the second field. Using
          # the wheel's own version keeps the manifest in sync with what pip installs.
          WHEEL_VERSION=$(echo "$WHEEL_NAME" | awk -F- '{print $2}')
          ( cd "$WHEEL_DIR" && sha256sum "$WHEEL_NAME" > SHA256SUMS )
          SHA256=$(awk '{print $1}' "$WHEEL_DIR/SHA256SUMS")
          {
            echo "path=$WHEEL"
            echo "name=$WHEEL_NAME"
            echo "sumsdir=$WHEEL_DIR"
            echo "version=$WHEEL_VERSION"
            echo "sha256=$SHA256"
          } >> "$GITHUB_OUTPUT"
          echo "Wheel: $WHEEL_NAME (version $WHEEL_VERSION, label '${VERSION_LABEL}')"

      - name: Configure AWS credentials
        if: env.HAS_SIGNING_SECRETS
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_SIGNING_ROLE_ARN }}
          aws-region: us-west-2

      - name: Publish wheel and channel manifest
        if: env.HAS_SIGNING_SECRETS
        env:
          BUCKET: ${{ vars.CLI_DIST_BUCKET }}
          CDN_BASE: ${{ vars.CLI_CDN_BASE }}
          WHEEL_PATH: ${{ steps.wheel.outputs.path }}
          WHEEL_NAME: ${{ steps.wheel.outputs.name }}
          SUMS_DIR: ${{ steps.wheel.outputs.sumsdir }}
          WHEEL_VERSION: ${{ steps.wheel.outputs.version }}
          SHA256: ${{ steps.wheel.outputs.sha256 }}
        run: |
          set -euo pipefail
          # The origin bucket is private (OAC), so the raw S3 URL is not publicly
          # reachable. Publish only when both the dist bucket and the CloudFront
          # base are configured, and never emit a manifest that points at private
          # S3. Fail closed (before any upload) otherwise.
          if [ -z "${BUCKET}" ] || [ -z "${CDN_BASE}" ]; then
            echo "::error::CLI_DIST_BUCKET and CLI_CDN_BASE repo variables must be set (bucket='${BUCKET}', cdn='${CDN_BASE}')."
            exit 1
          fi
          CDN_BASE="${CDN_BASE%/}"
          PREFIX="cli/${CHANNEL}/${WHEEL_VERSION}"
          aws s3 cp "$WHEEL_PATH" "s3://${BUCKET}/${PREFIX}/${WHEEL_NAME}"
          aws s3 cp "${SUMS_DIR}/SHA256SUMS" "s3://${BUCKET}/${PREFIX}/SHA256SUMS"

          WHEEL_URL="${CDN_BASE}/${PREFIX}/${WHEEL_NAME}"

          # Requires-Python straight from the wheel metadata so the manifest never drifts.
          PYREQ=$(unzip -p "$WHEEL_PATH" '*.dist-info/METADATA' 2>/dev/null \
            | awk -F': ' 'tolower($1)=="requires-python"{print $2; exit}' | tr -d '\r')
          PYREQ="${PYREQ:->=3.9}"

          cat > /tmp/latest-cli.json <<EOF
          {
            "channel": "${CHANNEL}",
            "version": "${WHEEL_VERSION}",
            "wheel_url": "${WHEEL_URL}",
            "sha256": "${SHA256}",
            "python_requires": "${PYREQ}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          aws s3 cp /tmp/latest-cli.json "s3://${BUCKET}/feed/${CHANNEL}/latest-cli.json" \
            --content-type application/json --cache-control no-cache

          {
            echo "## CLI Published (${CHANNEL})"
            echo "- Wheel: \`${WHEEL_NAME}\`"
            echo "- Version: \`${WHEEL_VERSION}\`"
            echo "- Feed: \`feed/${CHANNEL}/latest-cli.json\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish PEP 503 simple index
        if: env.HAS_SIGNING_SECRETS
        env:
          BUCKET: ${{ vars.CLI_DIST_BUCKET }}
          CDN_BASE: ${{ vars.CLI_CDN_BASE }}
          WHEEL_NAME: ${{ steps.wheel.outputs.name }}
          WHEEL_VERSION: ${{ steps.wheel.outputs.version }}
          SHA256: ${{ steps.wheel.outputs.sha256 }}
        run: |
          set -euo pipefail
          # PEP 503 static "simple" index per channel, so pip/uv can install
          # natively (verified invocation; --index-url alone would cut off PyPI
          # and fail on dependencies):
          #   pip install --pre kirocrew --extra-index-url ${CDN_BASE}/feed/<channel>/simple/
          # pip verifies the #sha256= fragment on each link, giving the same
          # fail-closed integrity as the feed. Lives under feed/ because that
          # prefix is CI-writable and CloudFront serves it no-cache.
          CDN_BASE="${CDN_BASE%/}"
          SIMPLE="feed/${CHANNEL}/simple"
          PROJ_URL="${CDN_BASE}/${SIMPLE}/kirocrew/"
          NEW_LINK="<a href=\"${CDN_BASE}/cli/${CHANNEL}/${WHEEL_VERSION}/${WHEEL_NAME}#sha256=${SHA256}\">${WHEEL_NAME}</a><br/>"

          # Merge with the existing (public) project page so prior versions
          # stay installable; replace any stale entry for the same wheel name.
          # Fail-closed on transient fetch errors: only a clean 200 (merge) or
          # an absent page (403/404 -- S3 behind CloudFront returns 403 for
          # missing keys) may proceed. Anything else (5xx, timeout, DNS) aborts
          # the step and leaves the published index untouched, so a CDN blip
          # can never truncate the version history.
          STATUS=$(curl -sS --max-time 15 -o existing.html -w '%{http_code}' "$PROJ_URL") || STATUS=000
          case "$STATUS" in
            200) ;;
            403|404) : > existing.html ;;
            *) echo "::error::Fetching existing index returned HTTP ${STATUS}; aborting without touching the published index."; exit 1 ;;
          esac
          { grep -oE '<a href="[^"]+">[^<]+</a><br/>' existing.html || true; } \
            | { grep -v ">${WHEEL_NAME}<" || true; } > links.txt
          echo "$NEW_LINK" >> links.txt

          {
            echo '<!DOCTYPE html><html><head><meta name="pypi:repository-version" content="1.0"><title>kirocrew</title></head><body><h1>kirocrew</h1>'
            cat links.txt
            echo '</body></html>'
          } > project.html
          printf '%s' '<!DOCTYPE html><html><head><meta name="pypi:repository-version" content="1.0"><title>Simple index</title></head><body><a href="kirocrew/">kirocrew</a><br/></body></html>' > root.html

          # CloudFront+OAC does NOT resolve directory indexes (no S3-website
          # hosting), so ALSO upload the literal trailing-slash keys pip hits.
          for DEST in "${SIMPLE}/kirocrew/index.html" "${SIMPLE}/kirocrew/"; do
            aws s3 cp project.html "s3://${BUCKET}/${DEST}" \
              --content-type "text/html" --cache-control no-cache
          done
          for DEST in "${SIMPLE}/index.html" "${SIMPLE}/"; do
            aws s3 cp root.html "s3://${BUCKET}/${DEST}" \
              --content-type "text/html" --cache-control no-cache
          done
          echo "- Simple index: \`${CDN_BASE}/${SIMPLE}/\` ($(wc -l < links.txt) version(s))" >> "$GITHUB_STEP_SUMMARY"

      - name: Skipped (no signing secrets)
        if: ${{ !env.HAS_SIGNING_SECRETS }}
        run: |
          echo "AWS_SIGNING_ROLE_ARN not set - skipping CLI publish (fork / feature-branch run)." >> "$GITHUB_STEP_SUMMARY"
