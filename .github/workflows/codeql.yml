name: CodeQL

# CodeQL code scanning, checked in (advanced setup). It replaces GitHub's
# CodeQL default setup with the same scan, and adds two savings default setup
# cannot express: a new push to a PR cancels the scan of its previous head, and
# a draft PR is not scanned until it is marked ready for review.
#
# SAME SCAN AS DEFAULT SETUP. The languages, query suite (`default`), threat
# model (`remote`) and build mode (`none`) match what default setup ran
# (`gh api repos/<repo>/code-scanning/default-setup`), as does the weekly
# schedule. The RUNNER does not match: default setup ran on a standard hosted
# runner, and the `Analyze` job below routes to the AWS CodeBuild fleet on an
# eligible push or pull request and takes the `kirocrew-linux-4-core`
# larger-runner label on every other event (see "Larger runners for the review
# lanes and CodeQL" in docs/ci/ci-and-reviews.md). The fleet's default compute
# is 4 vCPU and 7 GB against a public-repo `ubuntu-latest`'s 4 vCPU and 16 GB,
# so the scan has less memory on the fleet leg than on either fallback; the
# larger-runner label is the same 4 vCPU and 16 GB as the hosted image.
# The workflow name `CodeQL` and the job name `Analyze (<language>)` match its
# check names. Each upload names `category: /language:<language>`, the category
# default setup used, so alerts keep their history instead of opening twice
# under a new configuration.
#
# SWITCHOVER. GitHub rejects a CodeQL upload while default setup is enabled.
# Until a repository admin turns default setup OFF and then sets the repository
# variable `CODEQL_ADVANCED_SETUP` to `true`, every job below is skipped, so
# the two setups never both spend minutes on one push: default setup keeps
# producing the alerts and the `CodeQL` results check until the switch.
#
# Every language, `actions` included, is scanned on every eligible PR. Skipping
# a language a PR does not touch was tried and dropped: a category present on
# main but missing on the PR turns GitHub's `CodeQL` results check neutral
# ("1 configuration not found"), and PR Readiness holds a neutral result at
# pending.
on:
  pull_request:
    branches: [main]
    # The default three, plus `ready_for_review`: a draft is skipped below, so
    # leaving draft must start the scan that was skipped.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    # Weekly full scan of main, as default setup's `schedule: weekly` did.
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  # A new push to a PR supersedes the scan of its previous head: pr-readiness
  # reads only the current head, so the cancelled run loses nothing. Every
  # other event keys on its own run id, so a main push or a scheduled scan is
  # never cancelled, and never evicted from the pending slot by the next one
  # either -- every commit that lands on main is scanned.
  group: codeql-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Skip everything until the switchover (above). Then skip a draft PR
    # (re-run on `ready_for_review`), and a fork PR: a fork's token cannot
    # write security events, and default setup did not scan forks either --
    # pr-readiness lists CodeQL as not eligible for them. Only the PR
    # Readiness status is required, so a skipped Analyze job blocks nothing.
    if: >-
      vars.CODEQL_ADVANCED_SETUP == 'true' &&
      (github.event_name != 'pull_request' ||
       (!github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository))
    # The CodeBuild fleet on an admitted actor's push or `opened`/`synchronize`
    # same-repository pull request. Every other event -- `reopened`,
    # `ready_for_review`, the weekly schedule and a manual dispatch -- carries
    # no fleet-eligible actor or action and takes the `kirocrew-linux-4-core`
    # label, the larger-runner definition this job targeted by group before. A
    # fork running this workflow on its own `main` cannot reach an organization
    # runner group, so it takes the hosted image. The AWS webhook remains the
    # security boundary; this expression controls availability.
    runs-on: ${{ github.repository == 'kirodotdev/KiroCrew' && contains(fromJSON(vars.CODEBUILD_ACTOR_IDS || '[]'), github.actor_id) && (github.event_name == 'push' || (github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize') && github.event.pull_request.head.repo.full_name == github.repository)) && format('codebuild-kirocrew-gha-linux-{0}-{1}', github.run_id, github.run_attempt) || github.repository == 'kirodotdev/KiroCrew' && 'kirocrew-linux-4-core' || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
