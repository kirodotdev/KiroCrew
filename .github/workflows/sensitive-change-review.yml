name: Sensitive Change Review

# A PR that touches a sensitive path (sandbox, command floor, secret scrubbing,
# redaction) needs a filled-in reasoning template for the CURRENT head: either
# the PR author's own comment naming the head SHA, or a human approval on the
# head carrying it. A bare "Approve" click stays red. The author's comment
# re-runs this check through sensitive-change-review-comment.yml.
#
# Format only, on purpose: no model and no sandbox run. Whoever ran the real
# sandbox writes what they checked; this gate makes sure it is written down for
# this exact commit. It cannot tell a true reason from a false one.
#
# The checker script is read from the DEFAULT branch, so a PR cannot change the
# rule by editing the script. This workflow FILE still runs from the PR head
# (a `pull_request` limit every gate here shares), so a PR could rewrite it to
# skip the check. Listing it as sensitive does not stop that; running the gate
# from the default branch would, and is left for a follow-up. No waiver label.
#
# A fork PR that touches a sensitive path is refused: a maintainer takes it
# over on a branch here. A same-repository PR gets one sticky comment with the
# template to paste. `pull-requests: write` is for that comment only; on a fork
# PR GitHub hands this job a read-only token anyway.

on:
  pull_request:
    # `edited` covers a base-branch retarget, which changes the file set.
    types: [opened, synchronize, reopened, edited]
  # The approval itself must be able to turn this check green without a push.
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: sensitive-change-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sensitive-change-review:
    name: Sensitive Change Review
    # A 10-second check must not wait an hour behind the hosted queue, so a
    # same-repository PR from a listed actor uses the fleet on every event.
    # The job checks out only the default branch's scripts and never runs PR
    # code, so the opened/synchronize limit other routes carry buys nothing.
    #
    # A run the fleet does not admit -- a fork pull request, or an actor outside
    # CODEBUILD_ACTOR_IDS, which on a review event is the reviewer rather than
    # the author -- takes the larger-runner group when it executes HERE, and
    # `ubuntu-latest` when it executes in a fork's own repository, where an
    # organization runner group is unreachable.
    runs-on: ${{ github.repository == 'kirodotdev/KiroCrew' && contains(fromJSON(vars.CODEBUILD_ACTOR_IDS || '[]'), github.actor_id) && github.event.pull_request.head.repo.full_name == github.repository && format('codebuild-kirocrew-gha-linux-{0}-{1}', github.run_id, github.run_attempt) || github.repository == 'kirodotdev/KiroCrew' && 'kirocrew-linux-4-core' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      # Measurement only: counts this job's GitHub API calls by kind so the
      # shared GITHUB_TOKEN quota can be attributed per workflow. Every later
      # `gh` resolves to a shim that appends one line to a counter file and
      # then `exec`s the real gh with the same arguments, so arguments,
      # stdin, stdout, stderr and exit code are the real gh's own. A counter
      # that cannot be installed or written is skipped; it never fails the job.
      # Pinned identical in every job by test_gh_call_counter.py.
      - name: Count GitHub API calls (measurement only)
        continue-on-error: true
        run: |
          real="$(command -v gh || true)"
          dir="$RUNNER_TEMP/gh-call-count"
          if [ -z "$real" ] || [ "$real" = "$dir/gh" ]; then exit 0; fi
          mkdir -p "$dir" && : > "$dir/calls" || exit 0
          {
            echo '#!/usr/bin/env bash'
            printf 'REAL_GH=%q\n' "$real"
            printf 'COUNT_FILE=%q\n' "$dir/calls"
            cat <<'SHIM'
          # Kinds follow gh 2.103 at github.com/cli/cli: `api` is one REST
          # request (`--paginate` one per page, so it is also tallied apart),
          # `api graphql` one GraphQL request, `pr comment` a GraphQL lookup
          # plus a GraphQL addComment, `pr view` and `label list` GraphQL,
          # `label create` REST. `api rate_limit` costs no quota. Anything
          # else is `other`, counted but unclassified.
          {
            kind=other n=1
            case "${1-} ${2-}" in
              "api rate_limit" | "api /rate_limit") kind=free ;;
              api\ *)
                kind=rest
                for arg in "${@:2}"; do
                  case "$arg" in
                    graphql) kind=graphql ;;
                    --paginate) printf 'paginate 1\n' >> "$COUNT_FILE" ;;
                  esac
                done
                ;;
              "pr comment") kind=graphql n=2 ;;
              "pr view" | "label list") kind=graphql ;;
              "label create") kind=rest ;;
            esac
            printf '%s %s\n' "$kind" "$n" >> "$COUNT_FILE"
          } 2> /dev/null
          exec "$REAL_GH" "$@"
          SHIM
          } > "$dir/gh" && chmod 755 "$dir/gh" && echo "$dir" >> "$GITHUB_PATH" || true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: base
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Require a reasoned human approval for sensitive paths
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          # The commit this check run lands on; the checker judges this SHA
          # and fails if the API's head disagrees.
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          script="base/.github/scripts/sensitive_change_review.py"
          # Never fall back to the PR's own copy: a missing base checker fails
          # closed. Only the PR that adds this gate ever sees this branch.
          if [ ! -f "$script" ]; then
            echo "::error::No checker on the default branch yet, so this PR cannot be judged; a maintainer reviews it by hand."
            exit 1
          fi
          python3 "$script"

      # Counts only, never arguments or responses. `basis=gh-invocations`:
      # a `--paginate` call is one `rest` however many pages it read, and
      # calls made by actions (claude-code-action's octokit) are not seen.
      - name: Report GitHub API call counts
        if: always()
        continue-on-error: true
        run: |
          f="$RUNNER_TEMP/gh-call-count/calls"
          wf="${GITHUB_WORKFLOW_REF%@*}"
          wf="${wf##*/}"
          if [ ! -f "$f" ]; then
            echo "rest-calls: workflow=$wf job=$GITHUB_JOB counter=absent"
            exit 0
          fi
          awk -v wf="$wf" -v job="$GITHUB_JOB" '{ c[$1] += $2 } END {
            printf "rest-calls: workflow=%s job=%s rest=%d graphql=%d paginated=%d other=%d basis=gh-invocations\n",
              wf, job, c["rest"], c["graphql"], c["paginate"], c["other"] }' "$f" || true
