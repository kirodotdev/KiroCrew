name: Kiro BYO CI

on:
  push:
  pull_request:

env:
  PYTHONIOENCODING: utf-8
  # Force CPython UTF-8 mode on every runner. On Windows the process stdout
  # codec otherwise defaults to the locale (cp1252/charmap) and any Chinese
  # text printed by a test or tool raises UnicodeEncodeError. PYTHONIOENCODING
  # alone does not switch the codec selection; PYTHONUTF8 does.
  PYTHONUTF8: "1"

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test tooling
        run: python -m pip install -e ".[dev]"
      - name: Enforce current-version-only repository layout
        run: python scripts/project_hygiene.py
      - name: Compile Python sources
        run: python -m compileall -q src backend scripts
      - name: Test with branch coverage
        run: |
          coverage erase
          coverage run --branch -m pytest -q -m "not browser"
          coverage report --fail-under=60
      - name: Release metadata consistency
        run: python scripts/release_check.py --metadata-only
      - name: Build wheel
        run: python -m build --wheel
      - name: Wheel install smoke test
        run: |
          python -m venv /tmp/kiro-byo-smoke
          /tmp/kiro-byo-smoke/bin/python -m pip install dist/*.whl
          /tmp/kiro-byo-smoke/bin/kiro-byo --version

  browser-ui:
    # Real Chromium checks are mandatory and are never silently skipped by the
    # core coverage matrix. Isolate browser subprocesses to prevent a leaked
    # renderer or unresponsive page from stalling all Python versions.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and browser test runner
        run: python -m pip install -e ".[dev]" playwright pytest-timeout
      - name: Install Chromium with matching Playwright browser assets
        run: |
          python -m playwright install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/browser-bin"
          python - <<'PYCODE'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              executable = Path(p.chromium.executable_path)
          if not executable.is_file():
              raise SystemExit(f"Chromium not installed: {executable}")
          (Path(os.environ['RUNNER_TEMP']) / 'browser-bin' / 'chromium').symlink_to(executable)
          PYCODE
          echo "$RUNNER_TEMP/browser-bin" >> "$GITHUB_PATH"
      - name: Validate Chromium binary
        run: chromium --version
      - name: Run browser tests with bounded waits
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=20s 12m python -m pytest -q -m browser --timeout=45 --timeout-method=signal --durations=20 --junitxml=browser-results.xml 2>&1 | tee browser-tests.log
      - name: Preserve browser failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-ui-results
          if-no-files-found: warn
          path: |
            browser-results.xml
            browser-tests.log

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Ruff critical correctness checks
        run: ruff check src tests scripts backend --select E9,F63,F7,F82
      - name: Typed core boundary
        run: >-
          mypy
          src/kiro_byo/protocol.py
          src/kiro_byo/agent_projection.py
          src/kiro_byo/crew_shared_patch.py
          src/kiro_byo/web_tools.py
          src/kiro_byo/process_manager.py
          src/kiro_byo/code_intelligence.py

  crew-12-work-ledger-phase5-source-contract:
    # BYO targets KiroCrew stable v0.12.0 or later only. This checks the unpatched official 0.12
    # source shape. A passing result does NOT mean our bridge has been installed
    # or live Worker dispatch tested.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: [v0.12.0]
    steps:
      - uses: actions/checkout@v4
      - name: Check out exact KiroCrew source
        uses: actions/checkout@v4
        with:
          repository: kirodotdev/KiroCrew
          ref: ${{ matrix.ref }}
          path: _upstream/kirocrew-work-ledger
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read-only Work Ledger source contract
        run: >-
          python scripts/verify_crew_work_ledger.py
          --crew-package
          "$GITHUB_WORKSPACE/_upstream/kirocrew-work-ledger/src/kiro_crew"
      - name: Read-only BYO integration source-contract preflight
        # Honest by design: this preflight reports whether BYO is a proven member
        # of the official ACP_BACKENDS_KNOWN set. It is NOT — official KiroCrew
        # does not admit third-party harnesses, so this step is EXPECTED to exit
        # non-zero. We surface the report without failing the whole run; we never
        # fake the authorization to make it pass.
        continue-on-error: true
        run: >-
          python scripts/verify_crew12_integration.py
          --crew-package
          "$GITHUB_WORKSPACE/_upstream/kirocrew-work-ledger/src/kiro_crew"
          --crew-version 0.12.0
      - name: Install dev dependencies (pytest)
        run: python -m pip install -e ".[dev]"
      - name: Phase 5 correlation tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_dsh_phase5_crew_work_ledger_bridge.py

  process-model-cross-platform:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Process ownership / lifecycle tests
        run: python -m pytest -q tests/test_process_model.py tests/test_process_session_lifecycle.py tests/test_session_snapshot_fencing.py tests/test_global_integrity.py

  mcp-shutdown-cross-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - name: Session-scoped MCP stdio shutdown and peer EOF regression
        run: python -m pytest -q tests/test_stage5_mcp_shutdown.py tests/test_mcp_warmup.py tests/test_crew_capability_sync.py

  mcp-http-close-cross-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - name: HTTP MCP close, bounded waiters, and durable ID fencing
        run: python -m pytest -q tests/test_stage6_http_and_durable_fencing.py tests/test_mcp_warmup.py tests/test_durable_runs.py tests/test_durable_recovery.py

  run-lease-cross-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - name: Cross-process Run lease and fenced durable recovery
        run: python -m pytest -q tests/test_stage7_run_lease.py tests/test_durable_recovery.py tests/test_durable_runs.py tests/test_session_snapshot_fencing.py

  stage8-tool-admission-cross-platform:
    # A local process-lock and durable receipt gate is not an external
    # provider's exactly-once guarantee. This verifies only our admission.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - name: Durable tool receipt and multi-process admission regression
        run: >-
          python -m pytest -q
          tests/test_stage8_tool_batch_receipts.py
          tests/test_stage7_run_lease.py
          tests/test_durable_runs.py
          tests/test_durable_recovery.py

  stage9-mode-and-receipt-cross-platform:
    # Data-only Mode integrity and tool receipt failure semantics, not
    # executable plugin HMR or end-to-end exactly-once remote side effects.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - name: Audit built-in Mode/Type registration
        run: python scripts/audit_mode_plugins.py
      - name: Mode upgrade integrity and post-tool receipt regression
        run: >-
          python -m pytest -q
          tests/test_stage9_mode_integrity.py
          tests/test_stage9_tool_receipt_failure.py
          tests/test_s4_02_mode_lifecycle.py
          tests/test_s4_03_tiga_plugin.py
          tests/test_stage8_tool_batch_receipts.py

  stage10-mode-upgrade-cross-platform:
    # JSON Mode policy upgrades are read-time reloads, not executable plugin HMR.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - name: Mode Type stability, upgrade, rollback and Tiga route smoke
        run: >-
          python -m pytest -q
          tests/test_stage10_mode_upgrade_compat.py
          tests/test_stage9_mode_integrity.py
          tests/test_s4_02_mode_lifecycle.py
          tests/test_mode_router.py

  tree-sitter-code-intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install real Tree-sitter adapter and grammars
        run: python -m pip install -e ".[dev,code-intel]"
      - name: Verify Tree-sitter path (not fallback)
        run: python -m pytest -q tests/test_code_intelligence.py tests/test_native_tools.py


  linkage-cross-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - name: Linkage and app contract regression
        run: python -m pytest -q tests/test_crew_linkage.py tests/test_app_package.py

  acp-contract-cross-platform:
    # Verify real stdio JSON-RPC framing and negative-path semantics on all
    # supported desktop OSes, independently of upstream Crew installations.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - name: Real-process ACP wire + contract regression
        run: >-
          python -m pytest -q
          tests/test_acp_stdio_process.py
          tests/test_acp_stage2_contract.py
          tests/test_acp_compat_conformance.py
          tests/test_acp_v3_semantics.py
          tests/test_acp_lifecycle_failures.py
          tests/test_acp_control_plane.py

  stage4-execution-integrity-cross-platform:
    # Invariant and process-lifecycle regressions are portable; this job does
    # not substitute for a real installed Crew end-to-end test.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - name: Stage 4 process / durable recovery safety regressions
        run: >-
          python -m pytest -q
          tests/test_stage4_execution_integrity.py
          tests/test_process_model.py
          tests/test_process_session_lifecycle.py
          tests/test_durable_runs.py
          tests/test_durable_recovery.py
          tests/test_s3_01_durable_safety.py
          tests/test_s3_03_fault_state_machine.py

  crew11-picker-settings-ui-cross-platform:
    # DOM contract fixtures cover presentation and wire-value isolation only;
    # installed Windows UI still needs a real desktop verification.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e ".[dev]"
      - name: Crew 0.11 UI model identity and settings regression
        run: python -m pytest -q tests/test_crew11_model_labels.py tests/test_app_package.py

  crew11-tool-trust-and-center-cross-platform:
    # Unit/ACP simulation tests only; do not claim installed Crew E2E.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - name: Crew MCP trust, live revalidation and read-only tool center
        run: >-
          python -m pytest -q
          tests/test_crew11_trust_tool_center.py
          tests/test_crew_capability_sync.py
          tests/test_s104_tool_execution_guard.py
          tests/test_mcp_warmup.py
