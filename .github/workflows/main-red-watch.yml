name: Main Red Watch

# `main-macos-failure-watch.yml` pages a red macOS leg and nothing else. With the
# merge queue off, the push run of `CI` on main runs the whole matrix, and a red
# Linux or Windows test shard there reaches nobody: GitHub's failure e-mail goes
# to the push actor, and the next PR author finds main red only after their own
# run fails the same way. This watcher is the missing notice for that red.
#
# WHAT IT DOES: when a PUSH run of `CI` on main ends `failure` or `timed_out`, it
# reads the check-run annotations of every failed job, collects the failing tests
# the rootdir `conftest.py` annotated there (title: the node id; message:
# `<node id> - <reason>`), and opens or updates ONE issue titled
# `ci: Main is red: <first node id>` under the `main-red` label. The issue has
# the shape of the repository's CI failure form (`.github/ISSUE_TEMPLATE/ci_failure.yml`):
# its `ci: ` title prefix, its labels `bug` and `area: ci` (created when the
# repository lacks one, and left off if filing with them fails), and one section per
# form field in the form's order, filled from what this run knows and
# `_No response_` where it knows nothing. The body holds the
# set {node id: first 80 characters of the message}, the first-red SHA and the
# streak, and one line, `Fix in progress: ...`, that it rewrites on every main run
# from the open pull requests whose body closes the issue (`Fixes #N`). When a later push
# run of `CI` ends green, it comments on the issue and closes it.
#
# WARN ONLY: it writes an issue and nothing else. It comments on no pull request,
# assigns nobody and mentions nobody but the author of a pull request whose
# body closes the issue (the line names who is fixing it). No check of any
# pull request changes. Reverting this one file set removes it.
#
# WHY ANNOTATIONS AND NOT THE LOG: the Actions token's read of a job log
# (`actions/jobs/<id>/logs`) fails in this repository. MEASURED over two weeks of
# push runs of `CI` on main: 155 ended `failure` and this job started for every
# one. 28 died on the installation rate limit. In the other 127 a log-reading
# step failed all 369 of its reads, printed "writing nothing" and filed no issue,
# while the annotations of 87 of the 155 runs named a failing test. That step
# discarded the read's stderr, so the reason is not on record; the same request
# succeeds with a user token. An annotation is a JSON row on the API host, like
# the job list this step reads, and holds the node id as data. The log is the
# fallback for a job whose annotations cannot be read, and for a backend test
# job whose annotations name no test (a shard that died before `conftest.py`
# wrote them). A failed read of either says why, as a notice and in the job
# summary. A read refused by the API rate limit is named as that, with the reset
# time, and ends the reading: a log read after it would fail the same way.
#
# WHEN IT OPENS: with no issue open, only when some test is red in two failed
# jobs of the run, which for a break is the Linux and the Windows shard that
# both carry it. MEASURED on the same two weeks against 30 verified breaks of
# main: opening on any named test files 39 issues, 17 of them for a test that
# was not a break (mostly known flaky tests), and shows 29 of the 30; this rule
# files 22, none of them for a non-break, and shows 28, at the same delay. It
# needs no extra read and no memory of earlier runs. A break that only ever
# fails on one leg (a test that runs on one OS) opens nothing; that run ends
# with a warning, in the log and in the job summary, that names the tests it
# saw red in one job. Once an issue is open every red run updates it.
#
# LIMITS OF AN ANNOTATION: `conftest.py` annotates the first 10 failing tests of
# a job and counts the rest in a notice, so a job with more names 10 here. 1 of
# the 229 red backend jobs on main in those two weeks had more than 10.
#
# WHEN IT WRITES NOTHING: a failed run with no pytest node id in any failed job.
# That covers a Fast Gate barrier timeout (the job waited, no test ran), a
# Coverage Gate failure and a run that failed before the tests started; it says
# so in a warning with the counts of what it read, never in silence. When
# failed jobs exist and not one of them could be read, the job FAILS instead, so
# a watcher that cannot see is red in the Actions list rather than silent. A
# cancelled run never reaches the job (the gate below). A green run closes an
# issue only when the full backend suite ran in it (the `Backend Tests` shards'
# coverage upload ran, which `ci.yml` skips on a frontend-only or leaf-only
# reduced scope), so a run that skipped or reduced the tests (a docs-only push, the
# merge queue's macOS-only push path) cannot close a red it never tried.
#
# STREAK: the issue stays open while main stays red. Each later red run that
# names failing tests replaces the set, keeps the first-red SHA and adds one to
# the streak. A re-run of the same run id does not add one, and a run older than
# the last red one that finishes late changes nothing. The record is a JSON
# comment at the end of the body (`main-red-state`); the issue is found by its
# author (the Actions token), that comment and the title prefix, so it works
# whether or not the label exists and an issue a person writes is never trusted.
#
# DEDUPE: the same shape as `main-macos-failure-watch.yml`. Open issues are read
# through `gh issue list` (the issues API), never `--search`, whose index lags a
# create. The label is created with `--force` when the repository allows it; if
# not, the lookup drops the label and relies on the title prefix and the record.
#
# UNTRUSTED TEXT: a pytest message is whatever a test printed. It is written to
# files by `gh`, read by `.github/scripts/main_red_nodeids.py`, cut to printable
# ASCII with backticks removed, and placed in code spans in the issue body. It is
# never part of a shell command or a `${{ }}` expression. The script is read from
# main's default-branch checkout, never from the failing commit.
#
# API CALLS: no loop waits and nothing retries. A red run costs the job list, one
# annotation read per failed job (first 20 jobs; a second read, the log, only for
# a job whose annotations could not be read or, on a backend test job, name no
# test) and the issue reads and writes.
#
# PERMISSIONS: `actions: read` for the run's jobs and their logs; `checks: read`
# for the annotations of each failed job's check run; `issues: write`
# to read, open, edit, comment on and close the issue and to create its label;
# `contents: read` for the sparse checkout of `.github/scripts`. No pull-request
# scope: the fix line reads the issue's own timeline.
#
# RUNNER: `ubuntu-latest`, for the reason `main-macos-failure-watch.yml` gives: a
# `workflow_run` completion has no live collaborator actor for the AWS webhook
# allowlist.
#
# `test/test_main_red_watch.py` pins the watched name, the gate, the permissions
# and the untrusted-text rule, and runs the step with `gh` stubbed.

on:
  workflow_run:
    workflows:
      - "CI"
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read
  issues: write

# One watcher at a time, never killed: two side by side is how the issue lookup
# passes twice and files two. Only a run the job gate takes joins the shared
# group; every pull_request and merge_group completion of `CI` also starts this
# workflow (the job is skipped) and gets a group of its own, so it cannot evict a
# pending push watcher. A third push completion inside one watcher's run evicts
# the queued one; the newest red run supersedes the older one's set anyway.
concurrency:
  group: >-
    ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    && 'main-red-watch'
    || format('main-red-watch-skip-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  watch:
    name: Open, update or close the main-red issue
    # The `kirocrew-runners` group in THIS repository, rather than the standard
    # pool whose concurrency is shared enterprise-wide. Named by its runner
    # LABEL, not by `group:`: the group belongs to the kirodotdev organization,
    # so a fork running its own copy cannot reach it and would wait forever for
    # a runner. The `||` leg keeps a fork on the hosted image.
    runs-on: ${{ github.repository == 'kirodotdev/KiroCrew' && 'kirocrew-linux-4-core' || 'ubuntu-latest' }}
    timeout-minutes: 10
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out' ||
       github.event.workflow_run.conclusion == 'success')
    steps:
      # `workflow_run` checks out the default branch, so the script is main's own.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Open, update or close the main-red issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          # A green run closes the issue only if every job with this name prefix
          # that has a step of this name passed that step, and at least one did.
          # `ci.yml` skips that step on a reduced backend scope. `test_main_red_watch.py`
          # pins both names against `ci.yml`.
          PROOF_JOB_PREFIX: Backend Tests
          PROOF_STEP_NAME: Upload shard coverage
        run: |
          set -euo pipefail
          script=.github/scripts/main_red_nodeids.py
          work="$RUNNER_TEMP/main-red"
          mkdir -p "$work/logs"
          short_sha="${HEAD_SHA:0:12}"

          # The label is a courtesy. Without it the lookup relies on the title
          # prefix and the state record in the body.
          have_label=0
          if gh label create main-red --repo "$REPO" --force --color B60205 \
            --description "Main's CI is red on a named test; filed by main-red-watch.yml" >/dev/null 2>&1; then
            have_label=1
          else
            echo "::notice::Could not ensure the main-red label; looking up the issue by title prefix."
          fi

          # Sets `existing` (an issue number or empty) and writes its body to
          # $work/prev-body.md. The labelled list is tried first; if it holds no
          # watcher issue, the unlabelled list is too, so an issue filed while the
          # label could not be created is still found once the label exists.
          find_open_issue() {
            : > "$work/prev-body.md"
            existing=""
            if [ "$have_label" = 1 ]; then
              gh issue list --repo "$REPO" --state open --label main-red --limit 100 \
                --json number,title,body,author > "$work/issues.json"
              existing="$(python3 "$script" pick-issue "$work/issues.json" --body-out "$work/prev-body.md")"
            fi
            if [ -z "$existing" ]; then
              gh issue list --repo "$REPO" --state open --limit 200 \
                --json number,title,body,author > "$work/issues.json"
              existing="$(python3 "$script" pick-issue "$work/issues.json" --body-out "$work/prev-body.md")"
            fi
          }

          if [ "$CONCLUSION" = "success" ]; then
            # The proof is a full backend run: the shard coverage upload only runs
            # when the scope step did not reduce the run (a frontend-only or
            # leaf-only push), so a skipped upload means the reported tests were
            # not tried.
            gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --paginate \
              --jq '.jobs[] | select(.name | startswith(env.PROOF_JOB_PREFIX)) | .steps[]? | select(.name == env.PROOF_STEP_NAME) | .conclusion' \
              > "$work/proof-steps.txt"
            if ! grep -qx success "$work/proof-steps.txt" || grep -qxv success "$work/proof-steps.txt"; then
              echo "$RUN_URL did not run the full backend suite ($PROOF_JOB_PREFIX / $PROOF_STEP_NAME not passed in every job); a reduced green run closes nothing."
              exit 0
            fi
            find_open_issue
            if [ -z "$existing" ]; then
              echo "Green run and no open main-red issue."
              exit 0
            fi
            if ! python3 "$script" should-close --prev-body "$work/prev-body.md" --run-id "$RUN_ID"; then
              echo "Issue #$existing records a red run newer than $RUN_URL; leaving it open."
              exit 0
            fi
            gh issue comment "$existing" --repo "$REPO" \
              --body "Main is green again: the \`CI\` push run for \`$short_sha\` passed its tests ($RUN_URL). Closing. If a test is still flaky, the next red run opens a fresh issue."
            gh issue close "$existing" --repo "$REPO" --reason completed
            exit 0
          fi

          # Red: the failing tests of each failed job (first 20), as files. A job's
          # check run has the job's id, and its annotations name the failing tests:
          # one read per job. The log is read for a job whose annotations could not
          # be read, and for a backend test job whose annotations name no test (a
          # shard that died before conftest wrote them). Every failed read says why,
          # in the log and in the job summary.
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | [.id, .name] | @tsv' \
            > "$work/failed-jobs.txt"
          say() { echo "::$1::$2"; printf -- '- %s\n' "$2" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"; }
          why() { head -c 300 "$work/read-error.txt" | tr -c '[:print:]' ' '; }
          rate_limited() { grep -qi 'rate limit' "$work/read-error.txt"; }
          read_log() {
            if gh api "repos/$REPO/actions/jobs/$1/logs" \
              > "$work/logs/$1.log" 2> "$work/read-error.txt"; then
              logs_read=$((logs_read + 1))
              return 0
            fi
            rm -f "$work/logs/$1.log"
            return 1
          }
          failed="$(grep -c . "$work/failed-jobs.txt" || true)"
          fetched=0
          readable=0
          notes_read=0
          logs_read=0
          limited=0
          while IFS=$'\t' read -r job_id job_name; do
            case "$job_id" in ''|*[!0-9]*) continue ;; esac
            if [ "$fetched" -ge 20 ]; then
              say notice "More than 20 failed jobs; reading the first 20."
              break
            fi
            fetched=$((fetched + 1))
            if gh api "repos/$REPO/check-runs/$job_id/annotations?per_page=100" \
              > "$work/logs/$job_id.json" 2> "$work/read-error.txt"; then
              readable=$((readable + 1))
              notes_read=$((notes_read + 1))
              case "$job_name" in
                "$PROOF_JOB_PREFIX"*)
                  if ! python3 "$script" names-test "$work/logs" "$job_id"; then
                    if read_log "$job_id"; then
                      say notice "The annotations of job $job_id name no test; read its log too."
                    elif rate_limited; then
                      limited=1
                      break
                    else
                      say notice "The annotations of job $job_id name no test and its log could not be read ($(why))."
                    fi
                  fi
                  ;;
              esac
              continue
            fi
            rm -f "$work/logs/$job_id.json"
            # A log read after a rate-limited read fails the same way; stop reading.
            if rate_limited; then
              limited=1
              break
            fi
            say notice "Could not read the annotations of job $job_id ($(why)); trying its log."
            if read_log "$job_id"; then
              readable=$((readable + 1))
            elif rate_limited; then
              limited=1
              break
            else
              say notice "Could not read the log of job $job_id ($(why)); skipping it."
            fi
          done < "$work/failed-jobs.txt"
          if [ "$limited" = 1 ]; then
            # The rate_limit endpoint is not counted against the limit.
            reset="$(gh api rate_limit --jq .resources.core.reset 2>/dev/null || true)"
            case "$reset" in
              ''|*[!0-9]*) when="at an unknown time" ;;
              *) when="at $(date -u -d "@$reset" +%H:%MZ 2>/dev/null || echo "epoch $reset")" ;;
            esac
            say warning "The API rate limit of this token is used up (it resets $when). Stopped at job $fetched of $failed failed job(s) and read no log, which would fail the same way."
          fi
          if [ "$fetched" -gt 0 ] && [ "$readable" -eq 0 ]; then
            say error "Could not read the annotations or the log of any of the $fetched failed job(s) of $RUN_URL, so this run cannot say whether main is red on a test."
            exit 1
          fi

          python3 "$script" extract "$work/logs" > "$work/failures.json"
          if [ "$(jq 'length' "$work/failures.json")" = "0" ]; then
            say warning "No failing pytest node id in $RUN_URL: $failed failed job(s), $notes_read annotation set(s) and $logs_read log(s) read, 0 node ids (a barrier timeout, a coverage gate, a job that is not a backend test, or an early failure); writing nothing."
            exit 0
          fi

          find_open_issue
          render() {
            # $1: the issue number or empty. Exit 10 means an older run finished late.
            rc=0
            python3 "$script" render --failures "$work/failures.json" \
              --prev-body "$work/prev-body.md" ${2:+--timeline "$2"} \
              --repo "$REPO" --sha "$HEAD_SHA" --run-id "$RUN_ID" --run-url "$RUN_URL" \
              --jobs "$work/failed-jobs.txt" --logdir "$work/logs" \
              ${1:+--issue-number "$1"} --out-title "$work/title.txt" --out-body "$work/body.md" || rc=$?
            if [ "$rc" = 10 ]; then
              exit 0
            fi
            return "$rc"
          }

          if [ -n "$existing" ]; then
            # Open pull requests whose body closes the issue. A comment that only
            # cites the issue cross-references it too and is not a fix.
            if gh api "repos/$REPO/issues/$existing/timeline?per_page=100" --paginate \
              --jq '.[] | select(.event == "cross-referenced" and .source.issue.pull_request != null) | {url: .source.issue.html_url, state: .source.issue.state, author: .source.issue.user.login, created: .source.issue.created_at, closes: [(.source.issue.body // "") | scan("(?i)\\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?):?\\s+#([0-9]{1,9})\\b") | .[0] | tonumber]}' \
              > "$work/timeline.ndjson"; then
              render "$existing" "$work/timeline.ndjson"
            else
              echo "::notice::Could not read the timeline of #$existing; the fix line shows none."
              render "$existing"
            fi
            gh issue edit "$existing" --repo "$REPO" --body-file "$work/body.md"
            echo "Updated #$existing."
          else
            # No issue is open. A test red in one job only is as often a flake as a
            # break, so the issue opens only when a test is red in two jobs of this
            # run (a Linux and a Windows leg). The run that does not open says which
            # tests it saw. An open issue is updated either way.
            if ! once="$(python3 "$script" confirmed "$work/logs")"; then
              say warning "$RUN_URL: $once and no main-red issue is open; not opening an issue for a failure seen in one job."
              exit 0
            fi
            : > "$work/prev-body.md"
            render ""
            # The form's labels exist where the form does. A repository without one
            # (a fork's own main) gets it created here, with no `--force`, so a
            # label that exists keeps its colour and description. A label must
            # never cost the issue: if filing with labels fails, it is filed bare.
            label_args=()
            for form_label in bug "area: ci"; do
              gh label create "$form_label" --repo "$REPO" >/dev/null 2>&1 || true
              label_args+=(--label "$form_label")
            done
            if [ "$have_label" = 1 ]; then
              label_args+=(--label main-red)
            fi
            if ! created="$(gh issue create --repo "$REPO" --title "$(< "$work/title.txt")" \
              --body-file "$work/body.md" ${label_args[@]+"${label_args[@]}"} 2> "$work/read-error.txt")"; then
              say warning "Could not file the issue with its labels ($(why)); filing it without labels."
              created="$(gh issue create --repo "$REPO" --title "$(< "$work/title.txt")" --body-file "$work/body.md")"
            fi
            printf '%s\n' "$created"
            # The body names the issue in its `Fixes #N` hint once the number exists.
            new_number="$(printf '%s' "$created" | sed -nE 's#.*/issues/([0-9]+)[[:space:]]*$#\1#p')"
            if [ -n "$new_number" ]; then
              render "$new_number"
              gh issue edit "$new_number" --repo "$REPO" --body-file "$work/body.md" >/dev/null \
                || echo "::notice::Could not add the issue number to the body of #$new_number (continuing)."
            fi
          fi
