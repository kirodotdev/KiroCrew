name: Build Wheel (reusable)

# Reusable workflow: build the kirocrew pip wheel + sdist with the frontend
# staged in, stamped to an exact PEP 440 version. Called by nightly.yml and
# release.yml so the build recipe exists exactly once -- the callers differ
# only in how they derive the version (date stamp vs tag).
#
# Uploads artifact "cli-wheel" containing dist/* (wheel + sdist). The wheel
# is what publish-cli.yml ships; the sdist rides along for GitHub Releases.

on:
  workflow_call:
    inputs:
      wheel_version:
        description: "Exact PEP 440 version to stamp (pyproject.toml + __init__.py)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-wheel:
    name: Build Wheel (CLI)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          # cache disabled: this workflow is workflow_call-only from
          # nightly.yml / release.yml, so every run builds published bytes.
          # An Actions cache is writable from any branch and readable by a
          # tag run (zizmor cache-poisoning).

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # cache disabled: this workflow is workflow_call-only from
          # nightly.yml / release.yml, so every run builds published bytes.
          # An Actions cache is writable from any branch and readable by a
          # tag run (zizmor cache-poisoning).

      - name: Stamp wheel version (PEP 440)
        env:
          WHEEL_VERSION: ${{ inputs.wheel_version }}
        run: |
          # The wheel version is sourced from pyproject.toml [project].version
          # (static), NOT src/kiro_crew/__init__.py -- so stamp pyproject to make
          # the built wheel carry the exact version. Keep __init__.py in sync for
          # the runtime --version string.
          sed -i -E "s/^version = \".*\"/version = \"${WHEEL_VERSION}\"/" pyproject.toml
          sed -i "s/__version__ = \".*\"/__version__ = \"${WHEEL_VERSION}\"/" src/kiro_crew/__init__.py
          echo "Building wheel: ${WHEEL_VERSION}"

      - name: Stamp distribution channel
        run: |
          # Must run BEFORE `python -m build` so _build_info.py is inside the
          # package tree when the wheel is assembled. Without it every pip
          # install reports "source" and the channel breakdown is a constant.
          bash scripts/stamp-distribution.sh wheel

      - name: Build frontend
        working-directory: website
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Stage frontend into package
        run: |
          rm -rf src/kiro_crew/static/dist
          mkdir -p src/kiro_crew/static
          cp -R website/dist src/kiro_crew/static/dist

      - name: Build wheel + sdist
        run: |
          pip install --upgrade build
          python -m build

      # Guard against MANIFEST.in regressions (e.g. a global-exclude silently
      # stripping a vendored runtime from the sdist, and therefore from the
      # wheel built from it). Shared with build.yml's PR-time gate so the two
      # lanes cannot drift; the script documents the closure and the mechanism.
      - name: Verify vendored native libs survived into the wheel + sdist
        run: python scripts/verify_vendored_payload.py

      # `local` is the default speech-to-text provider, so `kirocrew[voice]` has to
      # resolve to a PREBUILT wheel wherever we claim one: a platform that silently
      # falls back to a source build needs CMake and a C++ toolchain, which a desktop
      # bundle does not have. Checked against the index rather than asserted in the
      # test suite, because the answer lives on PyPI and changes without us.
      #
      # `stt/engine.py`'s `_WHEEL_ARCHS` is the in-code copy of this matrix and
      # decides which availability code a user sees, so the two must agree in BOTH
      # directions — hence the negative case below.
      - name: The voice extra resolves to a prebuilt recogniser wheel
        run: |
          set -euo pipefail
          # The specifier from setup.cfg's `voice` extra, NOT a bare name. Without it
          # pip happily resolves an OLD release that does have a wheel for a platform
          # the shipped range does not: bare `pywhispercpp` finds a 1.2.0 Intel macOS
          # wheel, which predates the abort-callback and log arguments the engine
          # depends on and is excluded by `>=1.5`. Testing the wrong version would have
          # made this whole step report on software nobody installs.
          SPEC='pywhispercpp>=1.5,<2'
          for plat in macosx_11_0_arm64 manylinux_2_28_x86_64 \
                      manylinux_2_28_aarch64 musllinux_1_2_x86_64 win_amd64; do
            echo "── $plat"
            python -m pip download "$SPEC" --no-deps --only-binary :all: \
              --python-version 3.12 --platform "$plat" -d "$RUNNER_TEMP/pwc-$plat"
          done
          # Intel macOS has no wheel in that range, which is why `_WHEEL_ARCHS`
          # excludes it and the probe reports `stt_no_wheel_for_platform` there. If one
          # appears, the table is wrong in the pessimistic direction and the desktop
          # build can stop skipping the extra on that arch.
          if python -m pip download "$SPEC" --no-deps --only-binary :all: \
              --python-version 3.12 --platform macosx_11_0_x86_64 \
              -d "$RUNNER_TEMP/pwc-intel" >/dev/null 2>&1; then
            echo "::error::An Intel macOS pywhispercpp wheel now exists for $SPEC. Add" \
                 "x86_64 to _WHEEL_ARCHS['Darwin'] in src/kiro_crew/stt/engine.py and" \
                 "revisit the wheel-only skip in packaging/build-desktop.sh."
            exit 1
          fi
          echo "Intel macOS still has no wheel for $SPEC, as _WHEEL_ARCHS records."

      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-wheel
          path: dist/*
          if-no-files-found: error
          retention-days: 14
