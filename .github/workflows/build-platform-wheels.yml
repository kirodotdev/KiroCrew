name: Build Platform Wheels (reusable)

# Reusable workflow: turn the "cli-wheel" artifact build-wheel.yml uploaded (the
# pure py3-none-any wheel) into one py3-none-<tag> wheel per host the pinned KAS
# engine runs on, each uploaded as "cli-wheel-<tag>" for publish-cli.yml. Its
# own workflow because each leg must run on the host its wheel is for (macOS and
# arm64 Linux), while build-wheel.yml's jobs stay on the shared Linux route.
# Callers run it after build-wheel.yml in the same run: release.yml,
# release-lts.yml and nightly.yml.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # One wheel per host the KAS engine runs on: the caller's pure wheel plus the
  # pinned engine and its Node inside the package (scripts/kas_platform_wheel.py).
  # Each leg builds on the host it is for, because the backend's own
  # installer runs the staged Node once; then the leg is the release gate for its
  # wheel: `verify` fails unless the wheel carries the pinned engine with the
  # manifest's digests, and a clean install must report it "(built into the
  # wheel)" with nothing downloaded into the data home and pass `pip check`, the
  # check the update runs before it promotes a new venv. A failed leg fails this
  # reusable workflow, and publish-cli.yml refuses to publish without every tag.
  build-platform-wheels:
    name: Build platform wheel (${{ matrix.tag }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          # glibc 2.26/2.27 (Amazon Linux 2): carries the AL2 KAS pin
          # (kas_platform_wheel.TAG_PINS). Its Node runs on the newer runner too.
          - tag: manylinux_2_26_x86_64
            os: ubuntu-22.04
          - tag: manylinux_2_28_x86_64
            os: ubuntu-22.04
          - tag: manylinux_2_28_aarch64
            os: ubuntu-22.04-arm
          - tag: macosx_11_0_arm64
            os: macos-15
          # An Intel runner: pip on the arm64 runner's native Python refuses
          # an x86_64 wheel, so the clean-install gate needs an x86_64 host.
          - tag: macosx_11_0_x86_64
            os: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download the pure wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-wheel
          path: dist

      - name: Build the platform wheel
        env:
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          PURE=(dist/*-py3-none-any.whl)
          [ "${#PURE[@]}" -eq 1 ] && [ -f "${PURE[0]}" ] || { echo "::error::expected one pure wheel in dist/"; exit 1; }
          python -m venv "$RUNNER_TEMP/kc"
          "$RUNNER_TEMP/kc/bin/pip" install --quiet "${PURE[0]}"
          "$RUNNER_TEMP/kc/bin/python" scripts/kas_platform_wheel.py build "${PURE[0]}" --tag "$TAG" --out platform-dist

      - name: Gate - the wheel carries the pinned engine
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/kc/bin/python" scripts/kas_platform_wheel.py verify platform-dist/*.whl

      - name: Gate - a clean install runs the engine inside the wheel
        env:
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/kc/bin/pip" install --quiet --no-deps --force-reinstall platform-dist/*.whl
          HOME_DIR="$(mktemp -d)"
          # The pin this tag carries: the runner's own glibc would pick the normal
          # pin, so the AL2 wheel's engine is asked for by its version.
          PIN="$("$RUNNER_TEMP/kc/bin/python" scripts/kas_platform_wheel.py pin --tag "$TAG")"
          # Asked through the gateway's own reader, not `kirocrew kas status`: an LTS
          # build refuses that command until someone signs in, and this home has no one.
          PIN="$PIN" KIROCREW_HOME="$HOME_DIR" "$RUNNER_TEMP/kc/bin/python" -I -c '
          import os
          from kiro_crew.acp import kas_bundle
          found = kas_bundle.installed_bundle(version=os.environ["PIN"])
          assert found is not None and found.packaged, f"no engine inside the wheel: {found}"
          print(f"engine built into the wheel: {found.version} at {found.root}")
          ' || { echo "::error::the installed platform wheel does not report its engine"; exit 1; }
          if [ -e "$HOME_DIR/engines/kas" ] && [ -n "$(ls -A "$HOME_DIR/engines/kas")" ]; then
            echo "::error::the platform wheel downloaded an engine into the data home"; exit 1
          fi

      - name: Gate - the AL2 wheel's Node runs on Amazon Linux 2
        # The runner is glibc 2.35, so the steps above cannot see a Node or addon
        # that needs more than 2.26. Run them in the same pinned amazonlinux:2
        # image packaging/kas-al2/ builds them in, with an empty environment.
        if: matrix.tag == 'manylinux_2_26_x86_64'
        env:
          AL2_IMAGE: amazonlinux:2@sha256:7c78b2e1be42be4552d59e4b1590cc915836748b46050aff98b7dbb04a87db59
        run: |
          set -euo pipefail
          ENGINE="$(mktemp -d)"
          # unzip keeps the exec bits the wheel records; Python's zipfile drops them.
          unzip -q platform-dist/*.whl 'kiro_crew/_kas_engine/*' -d "$ENGINE"
          chmod -R a+rX "$ENGINE"
          docker run --rm --network none -v "$ENGINE:/w:ro" "$AL2_IMAGE" /bin/sh -c '
            set -eu
            ldd --version | head -1
            for node in /w/kiro_crew/_kas_engine/*/node/*/bin/node; do
              env -i "$node" --version
              find /w/kiro_crew/_kas_engine -path "*linux*x64*" -name "*.node" | while read -r addon; do
                env -i "$node" -e "process.dlopen({exports: {}}, process.argv[1])" "$addon"
                echo "loaded ${addon#/w/}"
              done
            done
          ' || { echo "::error::the AL2 wheel's Node or a native addon does not load on Amazon Linux 2"; exit 1; }

      - name: Gate - pip check accepts the installed wheel
        # The update promotes a new venv only when `python -I -m pip check` passes
        # there (wheel_engine.py). pip install judges the filename, pip check reads
        # the WHEEL Tag headers, so a wheel can install cleanly and still be
        # refused as "not supported on this platform" by every update.
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/kc/bin/python" -I -m pip check || {
            echo "::error::pip check refuses the installed platform wheel, so the update would not promote it"; exit 1
          }

      - name: Upload platform wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-wheel-${{ matrix.tag }}
          path: platform-dist/*.whl
          if-no-files-found: error
          retention-days: 14
