name: Code Review
# The base this run scans. PR Readiness reads it back from the run's
# display_title and counts the run only while it is the PR's current base, so
# this workflow can skip `edited`: a title or body edit starts no scan, and a
# base retarget leaves the lane pending until a push or reopen rescans it.
# docs/ci/ci-and-reviews.md, "code-review.yml: the deterministic pre-gate".
run-name: "[base ${{ github.event.pull_request.base.ref }}]"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# Without a group a push burst leaves every superseded revision's jobs running
# to completion.
concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  autosde-rules:
    name: Automated Rule Check
    runs-on: ${{ github.repository == 'kirodotdev/KiroCrew' && contains(fromJSON(vars.CODEBUILD_ACTOR_IDS || '[]'), github.actor_id) && (github.event_name == 'push' || (github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize') && github.event.pull_request.head.repo.full_name == github.repository)) && format('codebuild-kirocrew-gha-linux-{0}-{1}', github.run_id, github.run_attempt) || github.repository == 'kirodotdev/KiroCrew' && 'kirocrew-linux-4-core' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      # The merge commit and its two parents. The diff-base step fetches the
      # rest this job reads: see .github/scripts/code-review-history.sh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve diff base (merge-base)
        id: diffbase
        env:
          BASE_TIP: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/code-review-history.sh

      - name: Get changed files
        id: changed
        run: |
          echo "files<<EOF" >> $GITHUB_OUTPUT
          git diff --name-only ${{ steps.diffbase.outputs.sha }}..${{ github.event.pull_request.head.sha }} >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Deterministic replication of the blocking rules from
      # website/AUTOSDE.yaml. These catch the unambiguous cases; the semantic
      # half (aria-label on icon-only buttons, no-emoji, template-literal HTML)
      # is covered by the auto-running Opus 5.5 review in claude-review.yml.
      # Line regexes cannot see multi-line tags, <li>/<tr>, motion.div or a
      # misused role="presentation"; eslint-plugin-jsx-a11y in frontend-lint
      # covers part of that. This workflow runs on `pull_request`, so these
      # greps come from the PR's own copy: an edit that weakens one is judged
      # by CODEOWNERS review and the LLM lanes, which load their rules from
      # the base branch.
      - name: Check frontend blocking rules
        if: contains(steps.changed.outputs.files, 'website/src/')
        working-directory: website
        env:
          BASE: ${{ steps.diffbase.outputs.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "::group::use-lucide-icons — no inline SVGs"
          # website/AUTOSDE.yaml says this gate applies in every .tsx file with
          # no exception (brand marks are image assets). KiroGhost.tsx is the one
          # existing inline brand SVG kept as legacy; no other file is excluded.
          if git diff "$BASE".."$HEAD" -- ':(glob)src/**/*.tsx' \
               ':(exclude)src/components/KiroGhost.tsx' \
             | grep -nP '^\+.*<svg[^>]*viewBox'; then
            echo "::error::Use lucide-react icons instead of inline SVGs"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::accessible-interactive-elements — no <div/span onClick> without role"
          # ':(glob)' so '**/' also matches zero directories: the plain pathspec
          # 'src/**/*.tsx' needs a second '/' and skips src/App.tsx, src/main.tsx.
          # The pattern skips comment lines, treats '=>' as part of a tag, and
          # needs whitespace before role=/onClick (so data-role= does not count).
          if git diff "$BASE".."$HEAD" -- ':(glob)src/**/*.tsx' | grep -nP '^\+(?!\s*(?://|/?\*)).*<(div|span)\b(?!(?:=>|[^>])*\srole=)(?:=>|[^>])*\sonClick'; then
            echo "::error::Use <Clickable> component instead of <div onClick>"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::frontend-security — no .innerHTML / .outerHTML / insertAdjacentHTML"
          # ':(glob)' so 'src/**/' also matches files directly under src/
          # (App.tsx, main.tsx): without it the pathspec needs a second '/'.
          # (?!=) keeps an '===' comparison from tripping the assignment check.
          if git diff "$BASE".."$HEAD" -- ':(glob)src/**/*.tsx' ':(glob)src/**/*.ts' | grep -nP '^\+.*(?:(?:\.|\[\s*['"'"'"])(?:inner|outer)HTML(?:['"'"'"]\s*\])?\s*\+?=(?!=)|\.insertAdjacentHTML\s*\()'; then
            echo "::error::Never write HTML via innerHTML/outerHTML/insertAdjacentHTML — use textContent, createElement, replaceChildren, or React elements"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::frontend-security — Mermaid securityLevel must be 'strict'"
          if git diff "$BASE".."$HEAD" -- ':(glob)src/**/*.tsx' ':(glob)src/**/*.ts' | grep -nP "^\+.*['\"]?securityLevel['\"]?\s*:\s*['\"](?:loose|antiscript)['\"]"; then
            echo "::error::Mermaid securityLevel must be 'strict' (never 'loose' — it allows JS execution from diagrams)"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::page-layout-pattern — no custom max-w wrapper on pages"
          if git diff "$BASE".."$HEAD" -- 'src/pages/*.tsx' | grep -nP '^\+.*max-w-\[(?:9[0-9]{2}|[1-9][0-9]{3,})px\]'; then
            echo "::error::Dashboard pages must use PageHeader + px-6 pb-8 overflow-y-auto flex-1 min-h-0, not a custom max-w-[>=900px] wrapper"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::frontend-security (advisory) — dangerouslySetInnerHTML without sanitize/md/DOMPurify"
          if git diff "$BASE".."$HEAD" -- ':(glob)src/**/*.tsx' ':(glob)src/**/*.ts' | grep -nP '^\+.*dangerouslySetInnerHTML' | grep -vP 'sanitize\(|\bmd\(|DOMPurify'; then
            echo "::warning::dangerouslySetInnerHTML must go through sanitize()/md() (DOMPurify). The Opus 5.5 review will block if unsanitized."
          fi
          echo "::endgroup::"

          # The advisory greps below skip comment lines (// and * prefixes) so
          # a mention in prose does not warn.
          echo "::group::use-design-tokens (advisory) — no hardcoded Tailwind colors"
          if git diff "$BASE".."$HEAD" -- ':(glob)src/**/*.tsx' ':(glob)src/**/*.ts' | grep -nP '^\+(?!\s*(?://|/?\*)).*\b(?:bg|text|border)-(?:gray|slate|zinc|neutral|stone)-\d'; then
            echo "::warning::Prefer CSS custom property design tokens over hardcoded Tailwind colors"
          fi
          echo "::endgroup::"

          echo "::group::use-framer-motion (advisory) — no new CSS @keyframes"
          if git diff "$BASE".."$HEAD" -- ':(glob)src/**/*.tsx' ':(glob)src/**/*.ts' ':(glob)src/**/*.css' | grep -nP '^\+(?!\s*(?://|/?\*)).*@keyframes'; then
            echo "::warning::Prefer Framer Motion over CSS @keyframes for component animations"
          fi
          echo "::endgroup::"

          echo "::group::no-text-below-minimum (advisory) — no text-[0-9px]"
          if git diff "$BASE".."$HEAD" -- ':(glob)src/**/*.tsx' ':(glob)src/**/*.ts' | grep -nP '^\+(?!\s*(?://|/?\*)).*\btext-\[[0-9](?:\.[0-9]+)?px\]'; then
            echo "::warning::Minimum usable text size is 10px; text-[0px]..text-[9px] is not accessible"
          fi
          echo "::endgroup::"

      - name: Check backend security rules
        if: contains(steps.changed.outputs.files, 'src/kiro_crew/')
        env:
          BASE: ${{ steps.diffbase.outputs.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "::group::sensitive-path reads must go through is_sensitive_path()"
          SENSITIVE_PATHS='\.aws/|\.ssh/|\.gnupg/|\.docker/|\.kube/|\.npmrc|\.pypirc|\.netrc|\.git-credentials|\.kirocrew/security_policy|\.kirocrew/admission_policy|\.kirocrew/\.env|\.kiro/crew/security_policy|\.kiro/crew/admission_policy|\.kiro/crew/\.env'
          # Best-effort: covers open()/Path.open()/read_text()/os.open()/aiofiles.
          # The authoritative control is the security/ package + hooks.py + their unit tests;
          # this grep is a fast pre-filter, not the guarantee.
          if git diff "$BASE".."$HEAD" -- 'src/**/*.py' | grep -nP "^\+.*(open\(|\.open\(|read_text\(|read_bytes\(|os\.open\().*($SENSITIVE_PATHS)"; then
            echo "::error::Sensitive credential/keystone paths must go through hooks.py is_sensitive_path()"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::denied-command opt-out state must stay on the keystone floor"
          # The opt-out state (denied_commands.json) is a security ceiling: it
          # MUST live on _SENSITIVE_HOME_DIRS so the agent can neither read nor
          # write its own deny ceiling. Guard the invariant: it must be listed in
          # security/paths.py's sensitive floor AND in the governance boot-integrity
          # required tuple. Fast tripwire — the authoritative controls are
          # the security/ package + governance.py + their unit tests.
          #
          # The data home moved to ~/.kiro/crew, so security/paths.py GENERATES the
          # sensitive floor by expanding each secret leaf (denied_commands.json
          # among them, in _CREW_SECRET_LEAVES) under every crew-home prefix
          # (_CREW_HOME_PREFIXES). Assert the leaf is in that list; the governance
          # boot tuple carries the resolved ".kiro/crew/denied_commands.json".
          if ! grep -qr '"denied_commands.json"' src/kiro_crew/security/; then
            echo "::error::denied_commands.json must be in security._SENSITIVE_HOME_DIRS (via _CREW_SECRET_LEAVES; agent must not read/write its own deny ceiling)"
            exit 1
          fi
          if ! grep -q '".kiro/crew/denied_commands.json"' src/kiro_crew/platform/governance.py; then
            echo "::error::denied_commands.json must be in the governance boot-integrity required tuple"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::denied-command opt-out must not silently disable via bool() truthiness"
          # A hand-edited config.json is operator-editable; boolean opt-out fields
          # (disable_all etc.) must be parsed with _coerce_bool, never bare bool()
          # (bool("false") is True — would silently disable every protection).
          # (?<![_\w]) so bare ``bool(`` matches but ``_coerce_bool(`` does not.
          if git diff "$BASE".."$HEAD" -- 'src/kiro_crew/hooks.py' 'src/kiro_crew/hook_runtime/' 'src/kiro_crew/dashboard/handlers/security.py' 'src/kiro_crew/dashboard/handlers/security_*.py' | grep -nP "^\+.*(?<![_\w])bool\(\s*(dc|data|denied)\.get\(\s*['\"](disable_all|auto_approve_subagent|enabled)"; then
            echo "::error::Parse operator-editable boolean opt-out fields with _coerce_bool(), not bare bool() (bool('false') is truthy)"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::model-selection — no hardcoded model id as a default/fallback"
          # A hardcoded model id fails at runtime for accounts not entitled to it
          # (free-tier gets a subset). Use the "auto" sentinel or
          # agent.role_models.<role> (see
          # docs/system-specs/common/model-selection.md).
          # model_registry.py IS the id source-of-truth (excluded); the CC-seam
          # fallback (_BACKGROUND_CC_MODEL) and *_FALLBACK_* maps are the one
          # documented exception. tests live outside src/kiro_crew.
          if git diff "$BASE".."$HEAD" -- ':(glob)src/kiro_crew/**/*.py' \
               ':(exclude)src/kiro_crew/model_registry.py' \
             | grep -nP "^\+.*(=|\":)\s*[\"'](claude-(opus|sonnet|haiku|fable)|opus-[0-9]|sonnet-[0-9]|haiku-[0-9]|fable-[0-9]|gpt-[0-9])" \
             | grep -vP "_BACKGROUND_CC_MODEL|_FALLBACK_"; then
            echo "::error::Do not hardcode a model id as a default/fallback. Use \"auto\" or agent.role_models.<role> (see docs/system-specs/common/model-selection.md)."
            exit 1
          fi
          echo "::endgroup::"

  # The semantic AI layer of code review (the rules that cannot be
  # expressed as a grep) lives in claude-review.yml, which auto-runs on every
  # PR and fails the check on high-severity findings.

  # ── Inclusive Language ────────────────────────────────────────────────
  # Scans only lines added in this PR. Legacy violations are burned down
  # separately — this gate prevents new ones from landing.
  inclusive-language:
    name: Inclusive Language
    runs-on: ${{ github.repository == 'kirodotdev/KiroCrew' && contains(fromJSON(vars.CODEBUILD_ACTOR_IDS || '[]'), github.actor_id) && (github.event_name == 'push' || (github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize') && github.event.pull_request.head.repo.full_name == github.repository)) && format('codebuild-kirocrew-gha-linux-{0}-{1}', github.run_id, github.run_attempt) || github.repository == 'kirodotdev/KiroCrew' && 'kirocrew-linux-4-core' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      # The merge commit and its two parents. The diff-base step fetches the
      # rest this job reads: see .github/scripts/code-review-history.sh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve diff base (merge-base)
        id: diffbase
        env:
          BASE_TIP: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/code-review-history.sh

      - name: Install woke
        env:
          WOKE_VERSION: "0.19.0"
          WOKE_SHA256: "db5ed0906c81323a8c478cc57e00301dbf184db7a0293d70ba9f4729b6169d8c"
        run: |
          asset="woke-${WOKE_VERSION}-linux-amd64.tar.gz"
          archive="${RUNNER_TEMP}/${asset}"
          bin_dir="${RUNNER_TEMP}/woke-bin"
          # --retry-all-errors is required in addition to --retry: a bare
          # --retry covers transient HTTP statuses and timeouts but not a
          # mid-transfer connection reset (curl exit 35), which is how the
          # Releases CDN fails here. The sha256sum check below still gates a
          # truncated or substituted download.
          curl -sSfL --retry 3 --retry-delay 2 --retry-all-errors \
            "https://github.com/get-woke/woke/releases/download/v${WOKE_VERSION}/${asset}" \
            -o "$archive"
          printf '%s  %s\n' "$WOKE_SHA256" "$archive" | sha256sum -c -
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir" --strip-components=1 \
            "woke-${WOKE_VERSION}-linux-amd64/woke"
          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/woke" --version

      - name: Scan only changed lines
        env:
          BASE: ${{ steps.diffbase.outputs.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # _vendor is third-party code (llama-cpp-python) whose upstream URLs
          # and identifiers must not be rewritten — mirrors the .woke.yml
          # ignore_files entry (file ignores don't apply to a --stdin scan).
          # package-lock.json mirrors its .woke.yml entry for the same reason: a
          # lockfile lists third-party package names verbatim, and JSON has no
          # comment to mark one.
          git diff "$BASE".."$HEAD" --unified=0 --diff-filter=ACMR \
            -- ':(exclude)THIRD-PARTY-NOTICES' ':(exclude)CHANGELOG.md' ':(exclude)*.lock' ':(exclude)**/package-lock.json' ':(exclude).woke.yml' ':(exclude)AUTOSDE.yaml' ':(exclude)website/AUTOSDE.yaml' ':(exclude)src/kiro_crew/_vendor/**' ':(exclude)test/fixtures/denied_commands_golden.json' \
            | grep '^+[^+]' | sed 's/^+//' > /tmp/diff-added-lines.txt

          if [ ! -s /tmp/diff-added-lines.txt ]; then
            echo "No added lines to scan."
            exit 0
          fi

          # Run woke; only fail on error-severity findings (not warnings)
          WOKE_OUT=$(woke -c .woke.yml --stdin < /tmp/diff-added-lines.txt 2>&1) || true
          echo "$WOKE_OUT"
          if echo "$WOKE_OUT" | grep -q "(error)"; then
            echo "::error::Inclusive language violations found in added lines"
            exit 1
          fi

  # ── Production Dependency Vulnerability Gate ─────────────────────────
  # NOT run per pull request. The reusable gate (dependency-vulnerability.yml)
  # audits every lockfile-backed Node project against the npm registry, and a
  # registry that answers slowly -- which it does for hours at a stretch -- made
  # it the one red X on otherwise-green PRs, re-run by hand until it passed. A
  # gate people learn to re-run until green is not a gate. It runs where a
  # vulnerable dependency would actually ship: release.yml, before any wheel or
  # desktop build. A PR that adds or bumps a dependency is checked by the
  # release that would carry it.

  # ── Coverage Gate ────────────────────────────────────────────────────
  # MOVED to ci.yml. It now consumes the coverage-backend / coverage-frontend
  # artifacts that ci.yml's test jobs already produce in the same run (via
  # `needs:`), instead of re-installing everything and re-running the full
  # backend + frontend suites here (~30 min of duplicated work). The check
  # name "Coverage Gate" is unchanged, so branch protection is unaffected.

  # ── SAST (Semgrep) ───────────────────────────────────────────────────
  # Static Application Security Testing. Catches vulnerability patterns
  # that grep rules miss: SQL injection, path traversal, SSRF, insecure
  # deserialization, hardcoded secrets, etc.
  #
  # Runs directly on the runner (no `container:`), so same-repo PRs from
  # eligible actors can use the CodeBuild fleet: fleet routes carry no job
  # container. Semgrep is installed at an exact version instead of pulled
  # as an image, so the engine stays pinned on both pools.
  sast:
    name: SAST (Semgrep)
    runs-on: ${{ github.repository == 'kirodotdev/KiroCrew' && contains(fromJSON(vars.CODEBUILD_ACTOR_IDS || '[]'), github.actor_id) && (github.event_name == 'push' || (github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize') && github.event.pull_request.head.repo.full_name == github.repository)) && format('codebuild-kirocrew-gha-linux-{0}-{1}', github.run_id, github.run_attempt) || github.repository == 'kirodotdev/KiroCrew' && 'kirocrew-linux-4-core' || 'ubuntu-latest' }}
    # The baseline scan re-runs every rule on the merge-base for each changed
    # file, so the job's length grows with the diff: 2-3 min on the CodeBuild
    # fleet for a typical PR, but 9-14 min measured on ubuntu-latest for a large
    # one (#14818). A 15-min cap left that case cancelled by runner variance,
    # and a cancelled lane publishes no verdict. 30 min gives it headroom.
    timeout-minutes: 30
    steps:
      # The merge commit and its two parents. The diff-base step fetches the
      # rest this job reads: see .github/scripts/code-review-history.sh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Semgrep (pinned)
        run: python -m pip install --disable-pip-version-check semgrep==1.78.0

      - name: Resolve diff base (merge-base)
        id: diffbase
        env:
          BASE_TIP: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/code-review-history.sh

      # Regression harness for the custom rules in semgrep/. The fixtures in
      # semgrep-tests/ assert both directions from inline annotations — a
      # `ruleid:` line must match, an `ok:` line must not — so an edit to a
      # hand-tuned rule (or an engine bump past the pinned image) goes red
      # HERE instead of on some future contributor's unrelated PR. Runs on
      # the same pinned engine as the scan below so rules gate on the exact
      # engine version that enforces them. The rules deliberately live in a
      # non-hidden `semgrep/` dir: semgrep 1.78's test mode cannot discover
      # tests when rules live in a hidden directory (see issue #4869).
      - name: Semgrep rule tests (custom rules)
        run: semgrep --test --config semgrep/ semgrep-tests/

      - name: Semgrep scan (diff only)
        env:
          SEMGREP_BASELINE_REF: ${{ steps.diffbase.outputs.sha }}
        run: |
          semgrep scan \
            --config p/python \
            --config p/typescript \
            --config p/security-audit \
            --config p/secrets \
            --config p/owasp-top-ten \
            --config semgrep/ \
            --baseline-commit "$SEMGREP_BASELINE_REF" \
            --error
