name: Cleanup Temp Screenshots

# Caps the growth of temp-screenshots/ -- the ephemeral dir where prepare-pr
# commits PR review images (see temp-screenshots/README.md). Screenshots are
# embedded in PR descriptions via commit-SHA-pinned raw URLs, which keep
# resolving from the pinned historical commit even after the file is deleted
# from main's tip -- so pruning old files never breaks a past PR's images.
#
# This is a SCHEDULED job (weekly), NOT a per-PR job: it runs on a timer like a
# dependency-audit job, prunes files older than the retention window, and -- since
# main is a protected branch -- opens a PR for review instead of pushing directly.
# If nothing is stale, it exits quietly (no branch, no PR).

on:
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC
  workflow_dispatch:
    inputs:
      retention_days:
        description: "Delete temp-screenshots files older than this many days"
        required: false
        default: "5"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cleanup-temp-screenshots
  cancel-in-progress: true

jobs:
  prune:
    name: Prune stale temp-screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # persist-credentials retained: prune / "Open PR if anything was pruned" runs git fetch + git push --force-with-lease against origin
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: file age is derived from each file's last commit date.
          fetch-depth: 0

      - name: Remove files older than the retention window
        id: prune
        env:
          RETENTION_DAYS: ${{ github.event.inputs.retention_days || '5' }}
        run: |
          set -euo pipefail
          cutoff=$(( $(date +%s) - RETENTION_DAYS * 24 * 3600 ))
          removed=0
          # Tracked files under temp-screenshots/, excluding the README convention doc.
          while IFS= read -r f; do
            [ "$f" = "temp-screenshots/README.md" ] && continue
            ts="$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0)"
            if [ -n "$ts" ] && [ "$ts" -lt "$cutoff" ]; then
              git rm --quiet -- "$f"
              removed=$((removed + 1))
              echo "pruning (age > ${RETENTION_DAYS}d): $f"
            fi
          done < <(git ls-files 'temp-screenshots/*')
          echo "removed=$removed" >> "$GITHUB_OUTPUT"
          echo "Pruned $removed stale screenshot file(s)."

      - name: Open PR if anything was pruned
        if: steps.prune.outputs.removed != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RETENTION_DAYS: ${{ github.event.inputs.retention_days || '5' }}
        run: |
          set -euo pipefail
          BRANCH=chore/cleanup-temp-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Fetch the bot branch's current tip (if any) so --force-with-lease can
          # detect an unexpected update and abort instead of clobbering commits
          # from a maintainer or a concurrent run. First run: remote ref is
          # absent, the lease is empty, and the push simply creates the branch.
          git fetch origin "$BRANCH" 2>/dev/null || true
          git checkout -b "$BRANCH"
          git commit -m "chore: prune temp-screenshots older than ${RETENTION_DAYS} days"
          git push --force-with-lease origin "$BRANCH"
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "PR already open for $BRANCH; updated in place."
          else
            # `gh pr create` with GITHUB_TOKEN is refused outright when the
            # repository has "Allow GitHub Actions to create and approve pull
            # requests" turned OFF -- GitHub answers
            #   GraphQL: GitHub Actions is not permitted to create or approve
            #   pull requests (createPullRequest)
            # This repository leaves it off deliberately: the same single switch
            # also grants APPROVING, and main's merge gate is a required human
            # review. It only bites on the create path, reached once the previous
            # rolling PR merged and its branch was deleted; while that PR is open
            # the push above is enough, which is why some runs got further.
            #
            # The push already succeeded, so nothing is lost -- only the last,
            # cosmetic step is unavailable. Hand the branch to a human with a
            # one-click compare link and keep the run green. Failing here was the
            # old behaviour and it went unnoticed for weeks; a scheduled run that
            # is red every time and that nobody can act on trains maintainers to
            # ignore the signal. Any OTHER create failure is a real error and
            # must still fail loud. Same remedy as add-contributor.yml.
            rc=0
            out="$(gh pr create --base main --head "$BRANCH" \
              --title "chore: prune stale temp-screenshots" \
              --body "Automated weekly cleanup of \`temp-screenshots/\` (retention: ${RETENTION_DAYS} days). Past PRs' embedded images are unaffected -- their commit-SHA-pinned \`raw/\` URLs resolve from the historical commit even after the file leaves main's tip. Generated by the Cleanup Temp Screenshots workflow." 2>&1)" || rc=$?
            printf '%s\n' "$out"
            if [ "$rc" -ne 0 ]; then
              case "$out" in
                *"not permitted to create or approve pull requests"*)
                  compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1"
                  echo "::notice::Branch $BRANCH is pushed and ready, but GitHub Actions may not open pull requests in this repository. Open it here: $compare"
                  exit 0
                  ;;
                *)
                  exit "$rc"
                  ;;
              esac
            fi
          fi
