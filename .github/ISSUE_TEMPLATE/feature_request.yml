name: Feature request
description: Propose a new capability or a change to how KiroCrew behaves.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For anything significant, this issue is the right place to agree on the
        approach before code gets written — see
        [CONTRIBUTING.md](https://github.com/kirodotdev/KiroCrew/blob/main/CONTRIBUTING.md).

  - type: checkboxes
    id: search
    attributes:
      label: Existing issues
      options:
        - label: I searched open issues and this is not already requested.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: >-
        What are you trying to do, and what stops you today? Describe the
        situation rather than the solution — it often admits a simpler fix than
        the one you had in mind.
    validations:
      required: true

  - type: textarea
    id: five-whys
    attributes:
      label: Why does this matter? (5 Whys)
      description: >-
        Reason from first principles: set the solution you have in mind aside
        and dig down to the basic need underneath it. Ask "why?" up to five
        times. Build each question from the answer just before it, not from a
        generic prompt. Stop once the answer names who hits this, what they are
        trying to get done, and what it costs them today. Five is the most, not
        the goal. If an AI agent is filing this for someone, ask them these
        questions rather than restating their request.
      placeholder: |
        I want: a button to export my chat history.
        Why do you want to export chat history?
          -> So I can share a session with a teammate.
        Why do you need to share a session with a teammate?
          -> They need to see how I got the agent to fix a bug.
        Why do they need to see how you got there?
          -> ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: >-
        What should happen instead. Concrete beats abstract: name the command,
        surface, or setting where you would expect to find it.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >-
        Other approaches you weighed, including whether an existing feature gets
        you part of the way. "None" is a fine answer.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Mockups, prior art in other tools, or links to related discussion.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        Want to build this yourself? Once the issue is triaged as `tier:T1` or
        `tier:T2`, comment `/claim` on it so nobody else starts the same work. A
        `tier:T3` or `tier:T4` needs a design first. See
        [Claiming an issue](https://github.com/kirodotdev/KiroCrew/blob/main/CONTRIBUTING.md#claiming-an-issue).
