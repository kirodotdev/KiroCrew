<!doctype html>
<!-- Side-by-side comparison built from the two real pod captures (390x844,
     dsf=2). The 3x insets crop the same 90x60 CSS region at each drawer's
     top-left corner, which is where the whole difference lives. -->
<html>
<head><meta charset="utf-8"><style>
  :root { color-scheme: light }
  body { margin: 0; padding: 24px; background: #f6f7f9; font: 14px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif; color: #1f2328 }
  h1 { font-size: 16px; margin: 0 0 4px }
  .sub { color: #59636e; margin: 0 0 20px }
  .cols { display: flex; gap: 28px; align-items: flex-start }
  .col { width: 390px }
  .cap { font-weight: 600; margin: 0 0 2px }
  .num { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: #59636e; margin: 0 0 10px }
  .shot { width: 390px; display: block; border: 1px solid #d1d9e0; border-radius: 6px }
  .zoomwrap { margin-top: 12px }
  .zoom { width: 270px; height: 180px; overflow: hidden; border: 1px solid #d1d9e0; border-radius: 6px; background: #fff }
  /* 3x of a 90x60 CSS-px crop at the top-left corner of the viewport. */
  .zoom img { width: 1170px; margin: 0 0 0 0; display: block }
  .zlab { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: #59636e; margin: 6px 0 0 }
</style></head>
<body>
  <h1>Mobile nav drawer &mdash; top inset</h1>
  <p class="sub">Real captures from an isolated pod at 390&times;844 (deviceScaleFactor 2), drawer open. Insets are a 3&times; zoom of the drawer's top-left corner.</p>
  <div class="cols">
    <div class="col">
      <p class="cap">Before</p>
      <p class="num">top 0px &middot; left 8px &middot; bottom 8px</p>
      <img class="shot" src="before.png" alt="Before: the drawer's top edge is flush with the top of the screen while its left and bottom sides are inset by 8px.">
      <div class="zoomwrap"><div class="zoom"><img src="before.png" alt=""></div>
      <p class="zlab">no gap above the card</p></div>
    </div>
    <div class="col">
      <p class="cap">After</p>
      <p class="num">top 8px &middot; left 8px &middot; bottom 8px</p>
      <img class="shot" src="after.png" alt="After: the drawer is inset by 8px on all four sides, leaving a visible gap above its top edge.">
      <div class="zoomwrap"><div class="zoom"><img src="after.png" alt=""></div>
      <p class="zlab">8px gap above the card</p></div>
    </div>
  </div>
</body>
</html>
