<?xml version="1.0" encoding="UTF-8"?>
<!-- First-download DMG background. The Kiro brand guideline restricts gradients, so
     the ground is a flat light purple and nothing sweeps: the accent is one tone.
     The ghost cast carried over from the opening animation (electron/loading.html)
     stays white on it, as it is there.

     Finder paints DMG icon captions in dark text even under Dark Mode, so captions
     read at ~10:1 on this ground. The app icon's own plate is a mid-dark purple and
     separates at 2.7:1, better than a saturated purple ground gives it, though
     short of 3:1; a lighter tint would clear that if the brand allows one.

     No filters anywhere: the release pipeline rasterises this with sips, whose SVG
     renderer applies them inconsistently and drops filtered text outright. The soft
     shadow under each ghost is therefore a short stack of offset copies at low
     opacity, which ramps instead of drawing one hard edge. -->
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420">
  <defs>
    <!-- Body and eyes are the ghost drawn by electron/loading.html. -->
    <path id="ghost-body"
      d="M398.554 818.914C316.315 1001.03 491.477 1046.74 620.672 940.156C658.687 1059.66 801.052 970.473 852.234 877.795C964.787 673.567 919.318 465.357 907.64 422.374C827.637 129.443 427.623 128.946 358.8 423.865C342.651 475.544 342.402 534.18 333.458 595.051C328.986 625.86 325.507 645.488 313.83 677.785C306.873 696.424 297.68 712.819 282.773 740.645C259.915 783.881 269.604 867.113 387.87 823.883L399.051 818.914H398.554Z"/>
    <g id="ghost-art">
      <path fill="#ffffff"
        d="M398.554 818.914C316.315 1001.03 491.477 1046.74 620.672 940.156C658.687 1059.66 801.052 970.473 852.234 877.795C964.787 673.567 919.318 465.357 907.64 422.374C827.637 129.443 427.623 128.946 358.8 423.865C342.651 475.544 342.402 534.18 333.458 595.051C328.986 625.86 325.507 645.488 313.83 677.785C306.873 696.424 297.68 712.819 282.773 740.645C259.915 783.881 269.604 867.113 387.87 823.883L399.051 818.914H398.554Z"/>
      <path fill="#000000"
        d="M636.123 549.353C603.328 549.353 598.359 510.097 598.359 486.742C598.359 465.623 602.086 448.977 609.293 438.293C615.504 428.852 624.697 424.131 636.123 424.131C647.555 424.131 657.492 428.852 664.447 438.541C672.398 449.474 676.623 466.12 676.623 486.742C676.623 525.998 661.471 549.353 636.375 549.353H636.123Z"/>
      <path fill="#000000"
        d="M771.24 549.353C738.445 549.353 733.477 510.097 733.477 486.742C733.477 465.623 737.203 448.977 744.41 438.293C750.621 428.852 759.814 424.131 771.24 424.131C782.672 424.131 792.609 428.852 799.564 438.541C807.516 449.474 811.74 466.12 811.74 486.742C811.74 525.998 796.588 549.353 771.492 549.353H771.24Z"/>
    </g>

    <clipPath id="window">
      <rect width="660" height="420"/>
    </clipPath>
  </defs>

  <g clip-path="url(#window)">
    <rect width="660" height="420" fill="#c6a0ff"/>

    <!-- Soft shadow: three offset copies at low alpha, so the edge ramps over ~6px
         instead of landing as a single hard line. -->
    <g>
      <g opacity="0.08" fill="#3d1080" transform="translate(0 2)">
        <use href="#ghost-body" transform="translate(96 -68) rotate(176 43 56.3) translate(86 0) scale(-1 1) translate(-29.44 -12.7) scale(0.11544)"/>
        <use href="#ghost-body" transform="translate(430 -86) rotate(185 58 76) translate(-39.7 -17.13) scale(0.1557)"/>
        <use href="#ghost-body" transform="translate(-48 84) rotate(94 50 65.5) translate(-34.23 -14.77) scale(0.13423)"/>
        <use href="#ghost-body" transform="translate(601 129) rotate(-86 54 70.75) translate(-36.97 -15.95) scale(0.14497)"/>
        <use href="#ghost-body" transform="translate(255 302) rotate(-3 75 98.25) translate(-51.34 -22.15) scale(0.20134)"/>
        <use href="#ghost-body" transform="translate(28 340) rotate(8 29 38) translate(58 0) scale(-1 1) translate(-19.85 -8.56) scale(0.07785)"/>
      </g>
      <g opacity="0.07" fill="#3d1080" transform="translate(0 4)">
        <use href="#ghost-body" transform="translate(96 -68) rotate(176 43 56.3) translate(86 0) scale(-1 1) translate(-29.44 -12.7) scale(0.11544)"/>
        <use href="#ghost-body" transform="translate(430 -86) rotate(185 58 76) translate(-39.7 -17.13) scale(0.1557)"/>
        <use href="#ghost-body" transform="translate(-48 84) rotate(94 50 65.5) translate(-34.23 -14.77) scale(0.13423)"/>
        <use href="#ghost-body" transform="translate(601 129) rotate(-86 54 70.75) translate(-36.97 -15.95) scale(0.14497)"/>
        <use href="#ghost-body" transform="translate(255 302) rotate(-3 75 98.25) translate(-51.34 -22.15) scale(0.20134)"/>
        <use href="#ghost-body" transform="translate(28 340) rotate(8 29 38) translate(58 0) scale(-1 1) translate(-19.85 -8.56) scale(0.07785)"/>
      </g>
      <g opacity="0.06" fill="#3d1080" transform="translate(0 6)">
        <use href="#ghost-body" transform="translate(96 -68) rotate(176 43 56.3) translate(86 0) scale(-1 1) translate(-29.44 -12.7) scale(0.11544)"/>
        <use href="#ghost-body" transform="translate(430 -86) rotate(185 58 76) translate(-39.7 -17.13) scale(0.1557)"/>
        <use href="#ghost-body" transform="translate(-48 84) rotate(94 50 65.5) translate(-34.23 -14.77) scale(0.13423)"/>
        <use href="#ghost-body" transform="translate(601 129) rotate(-86 54 70.75) translate(-36.97 -15.95) scale(0.14497)"/>
        <use href="#ghost-body" transform="translate(255 302) rotate(-3 75 98.25) translate(-51.34 -22.15) scale(0.20134)"/>
        <use href="#ghost-body" transform="translate(28 340) rotate(8 29 38) translate(58 0) scale(-1 1) translate(-19.85 -8.56) scale(0.07785)"/>
      </g>
    </g>

    <g>
      <use href="#ghost-art"
        transform="translate(96 -68) rotate(176 43 56.3) translate(86 0) scale(-1 1) translate(-29.44 -12.7) scale(0.11544)"/>
      <use href="#ghost-art"
        transform="translate(430 -86) rotate(185 58 76) translate(-39.7 -17.13) scale(0.1557)"/>
      <use href="#ghost-art"
        transform="translate(-48 84) rotate(94 50 65.5) translate(-34.23 -14.77) scale(0.13423)"/>
      <use href="#ghost-art"
        transform="translate(601 129) rotate(-86 54 70.75) translate(-36.97 -15.95) scale(0.14497)"/>
      <use href="#ghost-art"
        transform="translate(255 302) rotate(-3 75 98.25) translate(-51.34 -22.15) scale(0.20134)"/>
      <use href="#ghost-art"
        transform="translate(28 340) rotate(8 29 38) translate(58 0) scale(-1 1) translate(-19.85 -8.56) scale(0.07785)"/>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
      text-anchor="middle">
      <!-- The dashboard's own header lockup: uppercase, bold, 0.14em tracking
           (App.tsx). Set in black rather than the accent, because the accent does
           not read on this ground. -->
      <!-- x is nudged left by half the tracking: SVG adds letter-spacing after the
           LAST glyph too, so a middle-anchored tracked string sits right of centre. -->
      <!-- The stroke is what makes this heavier than the dashboard's bold: sips
           renders font-weight 700 and 800 identically, so a weight step has to
           be geometry. 1.2 at this size is about one weight grade. -->
      <text x="327.75" y="76" font-size="32" font-weight="700" letter-spacing="4.5"
        fill="#000000" stroke="#000000" stroke-width="1.2"
        stroke-linejoin="round">KIRO CREW</text>
      <text x="330" y="112" font-size="14.5" font-weight="600" fill="#3b2f57">Drag Kiro Crew onto the Applications folder</text>
    </g>

    <path d="M317 225L345 246L317 267" fill="none" stroke="#5b21c7" stroke-width="7"
      stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
