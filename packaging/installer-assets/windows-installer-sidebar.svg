<?xml version="1.0" encoding="UTF-8"?>
<!-- BRIEF: Kiro Signature Windows installer sidebar — light purple, one framed
     app mark, quiet ghost silhouettes, and an equal-weight signature rhythm. -->
<!-- NSIS welcome/finish sidebar. The assisted installer deliberately keeps the
     native Windows controls; this narrow canvas supplies one calm brand moment
     without competing with the localized page title and actions.

     Filters and gradients are avoided because the release asset builder uses
     sips, whose SVG renderer is inconsistent for both. -->
<svg xmlns="http://www.w3.org/2000/svg" width="164" height="314" viewBox="0 0 164 314">
  <defs>
    <!-- Opening-animation ghost, reduced to a quiet shape-only watermark. -->
    <path id="ghost-body"
      d="M398.554 818.914C316.315 1001.03 491.477 1046.74 620.672 940.156C658.687 1059.66 801.052 970.473 852.234 877.795C964.787 673.567 919.318 465.357 907.64 422.374C827.637 129.443 427.623 128.946 358.8 423.865C342.651 475.544 342.402 534.18 333.458 595.051C328.986 625.86 325.507 645.488 313.83 677.785C306.873 696.424 297.68 712.819 282.773 740.645C259.915 783.881 269.604 867.113 387.87 823.883L399.051 818.914H398.554Z"/>
    <clipPath id="panel">
      <rect width="164" height="314"/>
    </clipPath>
    <clipPath id="app-mark">
      <rect x="38" y="74" width="88" height="88" rx="22"/>
    </clipPath>
  </defs>

  <g id="installer-sidebar" clip-path="url(#panel)">
    <rect id="signature-background" width="164" height="314" fill="#c6a0ff"/>

    <!-- Familiar ghost silhouettes become quiet, shape-only framing. -->
    <g id="signature-watermarks">
      <use href="#ghost-body" fill="#ffffff" fill-opacity="0.44"
        transform="translate(91 -70) rotate(10) scale(.105)"/>
      <use href="#ghost-body" fill="#7538e8" fill-opacity="0.09"
        transform="translate(-74 234) rotate(-10) scale(.095)"/>
    </g>

    <g id="signature-wordmark"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <text x="19" y="29" fill="#24142f" font-size="12" font-weight="700"
        letter-spacing="1.65" stroke="#24142f" stroke-width="0.22">KIRO CREW</text>
      <rect x="19" y="42" width="28" height="3" rx="1.5" fill="#ffffff"/>
      <rect x="51" y="42" width="8" height="3" rx="1.5" fill="#8a58ef"
        fill-opacity="0.48"/>
    </g>

    <!-- One framed instance of the exact shipped Kiro Crew app mark. -->
    <g id="signature-app-mark">
      <rect x="29" y="65" width="106" height="106" rx="29"
        fill="#ffffff" fill-opacity="0.34" stroke="#ffffff" stroke-opacity="0.52"/>
      <g clip-path="url(#app-mark)">
      <g transform="translate(38 74) scale(.42597) translate(-37.4 -29.85)">
        <rect x="37.4" y="29.85" width="206.59" height="206.59" rx="53.29" fill="#7538e8"/>
