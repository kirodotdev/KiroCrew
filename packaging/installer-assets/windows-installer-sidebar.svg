      <circle cx="24" cy="261" r="4" fill="#3d2251" fill-opacity="0.24"/>
      <rect x="35" y="259" width="57" height="4" rx="2" fill="#3d2251"
        fill-opacity="0.20"/>
      <circle cx="24" cy="283" r="4" fill="#3d2251" fill-opacity="0.24"/>
      <rect x="35" y="281" width="34" height="4" rx="2" fill="#3d2251"
        fill-opacity="0.20"/>
    </g>
  </g>
</svg>
