        <path d="M67.53 109.37c-1.57-4.01 2.99-6.49 5.84-7.61 2.58-1.01 4.81-1.35 6.45-.98 1.44.32 2.46 1.2 3.01 2.6s.43 2.83-.4 4.14c-.95 1.48-2.78 2.79-5.32 3.79-4.79 1.88-8.37 1.15-9.58-1.93Z"/>
        <path fill="#ffffff" d="M244.6 46.77c24.07-15.57 6.51-34.68-17.35-31.87 4.71-17.36-19.39-17.68-32.74-10.48-29.43 15.86-40.13 44.5-42.06 50.58-13.11 41.53 35.1 72.65 66.3 42.47 5.95-4.97 10.54-12.02 16.37-18.65 2.94-3.35 4.85-5.46 8.8-8.43 2.27-1.71 4.68-2.97 8.62-5.17 6.99-3.11 10.49-16.42-7.93-18.46Z"/>
        <path d="M194.79 60.97c3.96 2.55 1.5 7.66-.31 10.48-1.64 2.54-3.4 4.27-5.09 5-1.49.64-2.94.51-4.33-.38s-2.19-2.24-2.29-3.92c-.11-1.92.68-4.26 2.29-6.76 3.05-4.73 6.68-6.38 9.73-4.41Z"/>
        <path d="M178.51 50.47c3.96 2.55 1.5 7.66-.31 10.48-1.64 2.54-3.4 4.27-5.09 5-1.49.64-2.94.51-4.33-.38s-2.19-2.24-2.29-3.92c-.11-1.92.68-4.26 2.29-6.76 3.05-4.73 6.68-6.38 9.73-4.41Z"/>
      </g>
      </g>
    </g>

    <!-- Equal-weight decorative rhythm: no mark implies installer progress. -->
    <g id="signature-rhythm">
      <rect x="19" y="212" width="126" height="1" fill="#3d2251" fill-opacity="0.18"/>
      <circle cx="24" cy="239" r="4" fill="#3d2251" fill-opacity="0.24"/>
      <rect x="35" y="237" width="43" height="4" rx="2" fill="#3d2251"
