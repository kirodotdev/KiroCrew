<?xml version="1.0" encoding="UTF-8"?>
<!-- NSIS welcome/finish sidebar, staged like the macOS DMG background: a flat light
     purple with no sweep, and the ghost cast stays white on it as it is in the
     opening animation. The Kiro brand guideline restricts gradients.

     Filters are avoided: the release pipeline rasterises with sips, whose SVG
     renderer applies them inconsistently and drops filtered text entirely. The
     ghosts' shadow is a short stack of offset copies at low opacity, which ramps
     over a few pixels rather than drawing one hard edge. -->
<svg xmlns="http://www.w3.org/2000/svg" width="164" height="314" viewBox="0 0 164 314">
  <defs>
    <!-- The opening animation's ghost, as drawn by electron/loading.html. -->
    <path id="ghost-body"
      d="M398.554 818.914C316.315 1001.03 491.477 1046.74 620.672 940.156C658.687 1059.66 801.052 970.473 852.234 877.795C964.787 673.567 919.318 465.357 907.64 422.374C827.637 129.443 427.623 128.946 358.8 423.865C342.651 475.544 342.402 534.18 333.458 595.051C328.986 625.86 325.507 645.488 313.83 677.785C306.873 696.424 297.68 712.819 282.773 740.645C259.915 783.881 269.604 867.113 387.87 823.883L399.051 818.914H398.554Z"/>
    <g id="ghost-art">
      <path fill="#ffffff"
        d="M398.554 818.914C316.315 1001.03 491.477 1046.74 620.672 940.156C658.687 1059.66 801.052 970.473 852.234 877.795C964.787 673.567 919.318 465.357 907.64 422.374C827.637 129.443 427.623 128.946 358.8 423.865C342.651 475.544 342.402 534.18 333.458 595.051C328.986 625.86 325.507 645.488 313.83 677.785C306.873 696.424 297.68 712.819 282.773 740.645C259.915 783.881 269.604 867.113 387.87 823.883L399.051 818.914H398.554Z"/>
      <path fill="#000000"
        d="M636.123 549.353C603.328 549.353 598.359 510.097 598.359 486.742C598.359 465.623 602.086 448.977 609.293 438.293C615.504 428.852 624.697 424.131 636.123 424.131C647.555 424.131 657.492 428.852 664.447 438.541C672.398 449.474 676.623 466.12 676.623 486.742C676.623 525.998 661.471 549.353 636.375 549.353H636.123Z"/>
      <path fill="#000000"
        d="M771.24 549.353C738.445 549.353 733.477 510.097 733.477 486.742C733.477 465.623 737.203 448.977 744.41 438.293C750.621 428.852 759.814 424.131 771.24 424.131C782.672 424.131 792.609 428.852 799.564 438.541C807.516 449.474 811.74 466.12 811.74 486.742C811.74 525.998 796.588 549.353 771.492 549.353H771.24Z"/>
    </g>

    <clipPath id="panel">
      <rect width="164" height="314"/>
    </clipPath>
    <clipPath id="mark-clip">
      <rect x="36" y="52" width="92" height="92" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#panel)">
    <rect width="164" height="314" fill="#c6a0ff"/>

    <g opacity="0.09" fill="#3d1080" transform="translate(0 2)">
      <use href="#ghost-body" transform="translate(126 -30) rotate(182 27 35.4) translate(-18.48 -7.97) scale(0.07248)"/>
      <use href="#ghost-body" transform="translate(-26 236) rotate(-8 34 44.5) translate(-23.28 -10.04) scale(0.09128)"/>
      <use href="#ghost-body" transform="translate(128 262) rotate(12 24 31.45) translate(48 0) scale(-1 1) translate(-16.43 -7.09) scale(0.06443)"/>
    </g>
    <g opacity="0.07" fill="#3d1080" transform="translate(0 4)">
      <use href="#ghost-body" transform="translate(126 -30) rotate(182 27 35.4) translate(-18.48 -7.97) scale(0.07248)"/>
      <use href="#ghost-body" transform="translate(-26 236) rotate(-8 34 44.5) translate(-23.28 -10.04) scale(0.09128)"/>
      <use href="#ghost-body" transform="translate(128 262) rotate(12 24 31.45) translate(48 0) scale(-1 1) translate(-16.43 -7.09) scale(0.06443)"/>
    </g>

    <g>
      <use href="#ghost-art"
        transform="translate(126 -30) rotate(182 27 35.4) translate(-18.48 -7.97) scale(0.07248)"/>
      <use href="#ghost-art"
        transform="translate(-26 236) rotate(-8 34 44.5) translate(-23.28 -10.04) scale(0.09128)"/>
      <use href="#ghost-art"
        transform="translate(128 262) rotate(12 24 31.45) translate(48 0) scale(-1 1) translate(-16.43 -7.09) scale(0.06443)"/>
    </g>

    <!-- This is the existing site/public/kirocrew-logo.svg mark, scaled for NSIS. -->
    <g clip-path="url(#mark-clip)">
      <g transform="translate(36 52) scale(.44532) translate(-37.4 -29.85)">
        <rect x="37.4" y="29.85" width="206.59" height="206.59" rx="53.29" fill="#7538e8"/>
        <path fill="#ffffff" d="M84.76 266.62c-19.2 42.53 21.68 53.2 51.84 28.31 8.86 27.91 42.12 7.09 54.05-14.53 26.29-47.66 15.67-96.28 12.95-106.31-18.69-68.39-112.09-68.46-128.17.35-3.75 12.04-3.82 25.74-5.95 39.96-1.07 7.17-1.83 11.75-4.6 19.29-1.6 4.34-3.79 8.19-7.24 14.68-6.81 10.42.13 31.72 27.13 18.26Z"/>
        <path d="M140.41 203.27c-7.67 0-8.81-9.16-8.81-14.62 0-4.93.88-8.84 2.56-11.33 1.47-2.18 3.58-3.29 6.26-3.29s4.98 1.13 6.6 3.35c1.85 2.53 2.82 6.43 2.82 11.27 0 9.15-3.52 14.62-9.42 14.62Z"/>
        <path d="M171.94 203.27c-7.67 0-8.81-9.16-8.81-14.62 0-4.93.88-8.84 2.56-11.33 1.47-2.18 3.58-3.29 6.26-3.29s4.98 1.13 6.6 3.35c1.85 2.53 2.82 6.43 2.82 11.27 0 9.15-3.52 14.62-9.42 14.62Z"/>
        <path fill="#ffffff" d="M23.47 57.81C-.43 47.02-6.43 70 7.56 86.94c-15.69 4.98-3.99 23.67 8.17 30.38 26.79 14.78 54.11 8.81 59.75 7.28 38.44-10.5 38.48-63-.2-72.04-6.77-2.11-14.47-2.15-22.46-3.34-4.03-.6-6.6-1.03-10.84-2.59-2.44-.9-4.6-2.13-8.25-4.07-5.86-3.83-17.83.07-10.26 15.25Z"/>
        <path d="M61.06 92.87c-1.57-4.01 2.99-6.49 5.84-7.61 2.58-1.01 4.81-1.35 6.45-.98 1.44.32 2.46 1.2 3.01 2.6s.43 2.83-.4 4.14c-.95 1.49-2.78 2.79-5.32 3.79-4.79 1.88-8.37 1.15-9.58-1.93Z"/>
        <path d="M67.53 109.37c-1.57-4.01 2.99-6.49 5.84-7.61 2.58-1.01 4.81-1.35 6.45-.98 1.44.32 2.46 1.2 3.01 2.6s.43 2.83-.4 4.14c-.95 1.48-2.78 2.79-5.32 3.79-4.79 1.88-8.37 1.15-9.58-1.93Z"/>
        <path fill="#ffffff" d="M244.6 46.77c24.07-15.57 6.51-34.68-17.35-31.87 4.71-17.36-19.39-17.68-32.74-10.48-29.43 15.86-40.13 44.5-42.06 50.58-13.11 41.53 35.1 72.65 66.3 42.47 5.95-4.97 10.54-12.02 16.37-18.65 2.94-3.35 4.85-5.46 8.8-8.43 2.27-1.71 4.68-2.97 8.62-5.17 6.99-3.11 10.49-16.42-7.93-18.46Z"/>
        <path d="M194.79 60.97c3.96 2.55 1.5 7.66-.31 10.48-1.64 2.54-3.4 4.27-5.09 5-1.49.64-2.94.51-4.33-.38s-2.19-2.24-2.29-3.92c-.11-1.92.68-4.26 2.29-6.76 3.05-4.73 6.68-6.38 9.73-4.41Z"/>
        <path d="M178.51 50.47c3.96 2.55 1.5 7.66-.31 10.48-1.64 2.54-3.4 4.27-5.09 5-1.49.64-2.94.51-4.33-.38s-2.19-2.24-2.29-3.92c-.11-1.92.68-4.26 2.29-6.76 3.05-4.73 6.68-6.38 9.73-4.41Z"/>
      </g>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      text-anchor="middle">
      <!-- Same lockup as the dashboard header and the DMG background: uppercase,
           0.14em tracking, black. The stroke carries the weight because the
           rasteriser renders font-weight 700 and 800 identically, and x is nudged
           left by half the tracking, which SVG also adds after the last glyph.
           17 fits the 164-wide panel with ~23px of air each side.
           The former SETUP line is gone: it echoed this line's own treatment one
           size down, and the panel already says "Quick setup" below the rule. -->
      <text x="80.81" y="190" font-size="17" font-weight="700" letter-spacing="2.38"
        fill="#000000" stroke="#000000" stroke-width="0.64"
        stroke-linejoin="round">KIRO CREW</text>
    </g>

    <path d="M56 247H108" stroke="#ffffff" stroke-opacity="0.55" stroke-linecap="round" stroke-width="2"/>
    <text x="82" y="274" text-anchor="middle" fill="#3b2f57"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="650">Quick setup</text>
  </g>
</svg>
