# Smoke: the one-box path from anywhere to a setting. The top bar carries a
# wide centre trigger that opens the quick-search slot; on a fresh install the
# Command Bar builtin owns that slot (it is enabled by default), so the trigger
# reads "Run a command" and the surface lists commands, app destinations and
# settings without a network request (docs/system-specs/modules/command-bar.md,
# "the first page issues no network request"). Dashboard PAGES such as Schedule
# are deliberately NOT in that root index -- `ROOT_GROUPS` in
# website/src/apps/command-bar/rootIndex.ts is attention / commands / apps /
# settings -- so the target here is a settings row, which Enter navigates to.
# (An earlier revision typed "Schedule" and expected the Schedule page; the only
# match was the "Cron -- Scheduled job completions" notification setting, so the
# scenario could never pass: #10529.) Ctrl+K (Cmd+K on macOS) opens the same
# surface, but the harness key-chord allowlist in x11.py does not admit it, so
# the scenario uses the visible trigger.
name: search-everywhere-jump-to-setting
tier: smoke
feature: search
user_story: >-
  As a user, I want one search box that covers commands, apps and settings and
  takes me straight to what I typed, so that I can reach any part of the
  dashboard's controls without hunting through the sidebar or the Settings tabs.
docs_url: docs/system-specs/modules/command-bar.md
summary: Open the top-bar search trigger, type Zoom, press Enter and land on the Zoom Level row of Settings > Display
preconditions:
  seed: rich
  members: [nova-sky]
  start_url: /chat
steps:
  - You are on the chat page. Look at the top bar. In its centre is a wide button that reads "Run a command" (or "⌘K — Search for anything…" if the plain search palette owns the slot -- either is fine). Click it once.
  - A search box opens in the middle of the screen; its placeholder reads "Type a command…" (or "Search…" for the plain palette).
  - Type exactly "Zoom" and wait a moment for the result list to filter.
  - A result named "Zoom Level" appears under a "Settings" heading, with the subtitle "Display". If it is not the highlighted row, press the Down arrow until it is. Then press Enter.
  - Wait a second for the page to change.
expectations:
  - The search box has closed.
  - The main area now shows the Settings page on its Display tab (Display is highlighted in the settings navigation).
  - A setting row labelled "Zoom Level" is visible on screen (in a plain browser it shows a keyboard-shortcut hint on the right instead of a stepper -- either is fine).
  - The "Settings" item is highlighted as active in the left rail.
max_steps: 12
max_seconds: 300
