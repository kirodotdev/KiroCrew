# Nightly: create a mate from the Mates page and land in its chat. The
# page sits behind a feature-preview switch (per-device localStorage), so the
# tester turns it on through the GUI first, exactly as a user would.
#
# The target boots once for the whole run with the seeded roster (see
# scripts/gui-user-test/boot.sh), so the page may already list mates when
# this scenario starts. The steps therefore describe BOTH entry points to the
# same dialog: the "New mate" button in the empty-page hero, and the plus
# menu's "New mate" row at the top of the mate list when the roster is
# not empty. The same boot also serves this scenario's retry, which finds the
# mate attempt 1 made: the name is "Radar{attempt_suffix}" (attempt 1
# "Radar", attempt 2 "Radar 2"), so the retry is not refused as a duplicate and
# leaves no refused, dirty "New mate" form for the next scenario to land on.
# The Feature Previews card is titled "Mates" (older builds: "Crew Members"
# or "Crew Members and Crew Mode"); the steps name the current title and
# list the older ones as valid readings.
name: crewmate-create-first
tier: nightly
feature: members
user_story: >-
  As a user opening the Mates page for the first time, I want to create a
  mate by giving it a name and a job, so that I land in its chat and it
  introduces itself without any further setup.
docs_url: docs/system-specs/modules/crew-mode.md
summary: Enable the preview, create a mate named Radar{attempt_suffix} with a job, and see its chat open with a greeting
preconditions:
  seed: rich
  members: []
  start_url: /settings
steps:
  - You are on the Settings page. Open the Developer section and find the Feature Previews list.
  - Turn on the preview whose title starts with "Mates" (older builds may read "Crew Members" or "Crew Members and Crew Mode"; any of those is the right one). Ignore the Webhooks preview.
  - Open the Mates page. After the preview is on, a "Mates" item appears in the left rail, directly under Sessions; click it.
  - If the page shows the heading "No mates yet", click the "New mate" button below it. Otherwise the page already lists mates; click the small plus button at the top of that list (its tooltip reads "Add…") and, in the small menu that opens (its one row reads "New mate"), click "New mate". Either way a dialog titled "New mate" opens.
  - In the dialog, type exactly "Radar{attempt_suffix}" in the "Name" field.
  - In the field labelled "What it looks after" (marked optional), type exactly "Keep release notes up to date". Leave "Built from" and the Advanced section as they are.
  - Click the "Create mate" button and wait about three seconds.
expectations:
  - The "New mate" dialog is closed.
  - A chat conversation is open and "Radar{attempt_suffix}" is visible in its header or on the selected mate card.
  - Without you typing anything, the conversation shows a reply bubble from the mate (on this test build it reads "pong from the fake ACP backend"). The mate speaks first; the note that starts it is hidden, so no bubble from you is expected above it.
max_steps: 18
max_seconds: 480
