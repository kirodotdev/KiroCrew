# Nightly: a crewmate's chat shows only what the crewmate SAYS. The gateway
# writes many machinery rows into a chat (nudges, tool calls, tool results,
# patrol injections); an ordinary chat renders them as cards, a crewmate's chat
# hides them and lays the spoken text out as Slack-style bubble runs with the
# crewmate's avatar and name on the first bubble of each run
# (docs/system-specs/modules/crew-mode.md, "A crewmate's chat").
#
# The seeded state is produced live rather than shipped as a fixture: the
# packaged fake ACP backend emits a tool_call + tool_call_update titled
# "fake demo tool" whenever the prompt contains "[[TOOL]]", so one message
# writes both a tool row and a reply into the same crewmate chat, and the
# expectations check that only the reply is on screen. The same rows in an
# ordinary chat render a tool card, which is what this scenario must NOT see.
#
# The Crew Members page sits behind a feature-preview switch (per-device
# localStorage), so the tester turns it on first, exactly as members-dm-hello
# does; the preview card and the member card are hedged the same way.
name: crewmate-chat-clean
tier: nightly
feature: members
user_story: >-
  As a user talking to a crewmate, I want its chat to show only what it said
  to me, so that tool calls, nudges and other machinery never bury the
  conversation.
docs_url: docs/system-specs/modules/crew-mode.md
summary: Open a crewmate's chat, make it run a tool while replying, confirm only the reply shows as a bubble
preconditions:
  seed: rich
  members: [nova-sky]
  start_url: /settings
steps:
  - You are on the Settings page. Open the Developer section and find the Feature Previews list.
  - Turn on the preview whose title starts with "Crew Members" (it may read "Crew Members" or "Crew Members and Crew Mode"; either is the right one). Ignore the Webhooks preview.
  - Open the Crew Members page. After the preview is on, a "Crew Members" item appears in the left rail, directly under Sessions; click it.
  - Click the member card for Nova Sky (its card may read "nova-sky" instead of a display name; that is the same member, and it may be lower in the list) to open its chat.
  - Type exactly "run a tool then answer [[TOOL]]" in the message box and send it with Enter. Wait about three seconds. Behind the scenes the crewmate runs a tool called "fake demo tool" and then answers; you only need to look at what appears.
  - Type exactly "and again [[TOOL]]" in the message box and send it with Enter. Wait about three seconds.
  - Look at the whole conversation, top to bottom, without scrolling past it.
expectations:
  - Two reply bubbles are visible, each containing "pong from the fake ACP backend", one under each of your messages.
  - Each reply bubble shows the crewmate's avatar and its name (Nova Sky or "nova-sky") above the text, on the first bubble of that reply.
  - Nothing on screen mentions "fake demo tool", "echo hello-from-fake", a tool call or a command; no tool card, spinner or collapsed tool row sits between your messages and the replies.
  - No red error banner or error bubble is visible in the conversation.
max_steps: 18
max_seconds: 480
