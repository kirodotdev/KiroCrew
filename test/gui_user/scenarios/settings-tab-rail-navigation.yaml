# Smoke: every Settings tab is a path, /settings/<tab>, so a tab can be
# bookmarked and deep-linked. The scenario exercises both halves of that: the
# harness opens the page straight at /settings/notifications (a deep link, not
# the default tab), and the tester then clicks two tabs and reads the browser's
# address bar after each -- the window keeps its omnibox exactly so the tester
# can see the URL like a person would. The tabs chosen (Display, Chat) render
# from local state and the live gateway's config alone, so their panes carry no
# network-dependent notice. Chat, Display and Notifications are each a rail of
# groups whose selection is path-backed (SettingsSubNav in path mode, #13661 for
# Chat, #13979 for Display and Notifications): landing on the tab resolves to its
# first group, so the address bar reads /settings/<tab>/<group> (e.g.
# /settings/chat/transcript, /settings/display/view, /settings/notifications/sources),
# and that is the deep-linkable shape this scenario accepts for those tabs. Two clicks and no scroll
# keep the three surviving screenshots one per tab; the final expectations read
# the Chat landing and the screenshot taken right after the Display click.
name: settings-tab-rail-navigation
tier: smoke
feature: settings
user_story: >-
  As a user, I want each Settings tab at /settings/<tab>, so that I can
  bookmark and deep-link settings.
docs_url: docs/feature-map/README.md
summary: Land on a deep-linked Settings tab, click two other tabs and read the address bar change with each
preconditions:
  seed: rich
  members: [nova-sky]
  start_url: /settings/notifications
steps:
  - You are on the Settings page, opened directly at its Notifications tab; the pane heading reads "Notifications" with "Sound effects and per-source alert preferences" beneath it. Notifications is a rail of groups (like Chat) that resolves to its first group, so the address bar contains "/settings/notifications" plus a segment such as "/settings/notifications/sources". Do not scroll.
  - In the settings navigation on the left of the page, under the small "Preferences" heading, click the tab labelled "Display". The pane heading changes to "Display"; Display is also a rail of groups, so the address bar contains "/settings/display" followed by one more segment such as "/settings/display/view".
  - In the same navigation click the tab labelled "Chat". Read the pane heading and the address bar again. The Chat pane has its own inner list of groups on its left (Transcript, Composer, ...); the address bar names the selected group after "/settings/chat/".
expectations:
  - The browser's address bar contains "/settings/chat" and has no "?tab=" query string; it may end there or continue with one more segment naming the selected Chat group, such as "/settings/chat/transcript".
  - The pane heading reads "Chat" with "Message behavior, history, timestamps, and context" beneath it, and "Chat" is the highlighted tab in the settings navigation while "Display" and "Notifications" are not.
  - In the screenshot taken right after you clicked "Display", the pane heading read "Display" and the address bar contained "/settings/display" (it may continue with one more segment naming the first group, such as "/settings/display/view").
  - The "Settings" item is highlighted as active in the left rail and no red error banner is visible.
max_steps: 6
max_seconds: 180
