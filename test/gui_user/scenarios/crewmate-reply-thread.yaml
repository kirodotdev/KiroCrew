# Nightly: screen 07 of the Crewmates launch -- a reply thread on one message of
# a crewmate's chat. The tester talks to a crewmate, then asks a follow-up about
# ONE of its replies from the message's own "Reply in thread" action instead of
# the main chat, and checks the two things a DOM test cannot judge together: the
# thread opens beside the chat showing the message it hangs off, and that message
# then carries a thread footer.
#
# The Crew Members page sits behind a feature-preview switch (per-device
# localStorage), so the tester turns it on first, exactly as members-dm-hello
# does; the page and the member's card are hedged the same way that scenario
# hedges them. There is no second switch: a thread is an ordinary session
# anchored to a message, on every chat surface, with no flag in front of it.
#
# The thread is a full chat session, so its own composer is an ordinary one and
# the follow-up is answered there. The footer reads a count either way, which is
# the feature working.
name: crewmate-reply-thread
tier: nightly
feature: members
user_story: >-
  As a user talking to a crewmate, I want to ask about one thing it said in a
  reply thread on that message, so that the follow-up stays beside the message
  it is about instead of pushing the crewmate's findings up the main chat.
docs_url: docs/system-specs/modules/history.md
summary: Reply in thread on a crewmate's message; the thread opens beside the chat and the message shows a thread footer
preconditions:
  seed: rich
  members: [nova-sky]
  start_url: /settings
steps:
  - You are on the Settings page. Open the Developer section and find the Feature Previews list.
  - Turn on the preview whose title starts with "Crew Members" (it may read "Crew Members" or "Crew Members and Crew Mode"; either is the right one). Ignore the Webhooks preview.
  - Open the Crew Members page. After the preview is on, a "Crew Members" item appears in the left rail, directly under Sessions; click it.
  - Click the member named Nova Sky (its card may read "nova-sky" instead of a display name; that is the same member) to open its chat.
  - Type exactly "what is one thing you can help me with?" in the message box and send it with Enter. Wait about three seconds and confirm a reply bubble from the crewmate appeared under your message.
  - Move the mouse over the crewmate's reply bubble. A small row of icon buttons appears under it; one is titled "Reply in thread" (a speech-bubble icon). Click it.
  - A thread opens on the right, beside the chat, showing the crewmate's reply as the message it hangs off, with its own message box at the bottom.
  - Type exactly "tell me more about that" in the thread's own message box (not the main message box at the bottom of the chat) and send it with Enter. Wait about three seconds.
expectations:
  - The thread is open on the right, and the main chat is still visible to its left.
  - Inside the thread, a bubble containing "tell me more about that" is visible.
  - In the main chat, under the crewmate's reply bubble that the thread was started on, a thread footer is visible.
  - The main chat does not contain a bubble with "tell me more about that"; that text is only in the thread.
max_steps: 20
max_seconds: 480
