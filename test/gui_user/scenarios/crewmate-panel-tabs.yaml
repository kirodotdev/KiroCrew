# Nightly: the crewmate's right-hand panel keeps two standing tabs --
# Dashboard and Files -- and Notes is reached from the crewmate's Profile card,
# not from the panel (#16309; spec: docs/system-specs/modules/crew-mode.md,
# "Crewmate conversation layout: switcher, Profile, Dashboard, Files"). A DOM
# test pins the tab ids (MembersPage.test.tsx "the side panel has Dashboard and
# Files as its two standing tabs"); this scenario checks what a first-time user
# actually sees: Dashboard first and selected, Files beside it, none of the
# removed Notes / Work log / Schedules / Crew summary tabs, no settings copy in
# the panel, and Notes still one click away in Profile.
#
# The Crewmates page sits behind a feature-preview switch (per-device
# localStorage), so the tester turns it on first, exactly as members-dm-hello
# does, and the member card is hedged the same way (it may render as the id
# "nova-sky"). On a wide window the panel is docked beside the conversation and
# open; when it is hidden (or on a narrow window, where it is an overlay) the
# panel button at the right end of the conversation header opens it -- its
# tooltip reads "Dashboard & files". The Profile card opens from the crewmate's
# name pill in the middle of the header.
name: crewmate-panel-tabs
tier: nightly
feature: members
user_story: >-
  As a person managing a crewmate, I want its panel to show what it publishes
  and its files, with its notes one click away in its profile, so that I read
  its work instead of its settings.
docs_url: docs/system-specs/modules/crew-mode.md
summary: Open a crewmate's conversation and check its panel shows Dashboard and Files, no Notes / Work log / Crew summary tab, and Notes opens from Profile
preconditions:
  seed: rich
  members: [nova-sky]
  start_url: /settings
steps:
  - You are on the Settings page. Open the Developer section and find the Feature Previews list.
  - Turn on the preview whose title starts with "Crewmates" (older builds may read "Crew Members" or "Crew Members and Crew Mode"; any of those is the right one). Ignore the Webhooks preview.
  - Open the Crewmates page. After the preview is on, a "Crewmates" item appears in the left rail, directly under Sessions; click it.
  - Click the member named Nova Sky (its card may read "nova-sky" instead of a display name; that is the same member) to open its conversation.
  - Look at the right-hand panel beside the conversation. If no panel is showing, click the panel button at the right end of the conversation header (its tooltip reads "Dashboard & files") to open it.
  - Read the tab labels at the top of the panel, left to right, and note which one is selected.
  - Click the "Files" tab and wait about two seconds.
  - Click the "Dashboard" tab again and wait about two seconds.
  - Click the crewmate's name in the middle of the conversation header (the rounded pill with its face) to open its Profile card.
  - In the Profile card, click the "Notes" row and wait about two seconds.
expectations:
  - The panel's first tab reads exactly "Dashboard", it was the selected tab when the panel first appeared, and a "Files" tab is also in the panel's tab strip.
  - No tab in the panel is labelled "Notes", "Work log", "Schedules" or "Crew summary", and the Dashboard tab shows no "Wake sources", "Built from" or "Memory store" text.
  - The Dashboard tab shows either the crewmate's published page or a sentence saying it has not published a dashboard yet -- never an error.
  - After clicking "Notes" in the Profile card, it shows either the member's notes as formatted text or the sentence that it hasn't written any notes yet -- never an error.
max_steps: 18
max_seconds: 480
