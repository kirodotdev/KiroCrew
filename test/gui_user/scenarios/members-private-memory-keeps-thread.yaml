# Nightly: a member's direct-message thread must survive the user leaving and
# coming back to that member. A member's memory is fixed when the member is
# created and can no longer be switched from the GUI, so this scenario no
# longer touches any memory control; it exercises the still-supported behavior
# that friction issue #11272 was really about -- the conversation history is
# not lost on navigation and the member keeps answering. The tester chats with
# a member, navigates away and returns, and checks two things a DOM test cannot
# judge together: the earlier bubble is still on screen, and a fresh message
# still gets a reply.
#
# The Crew Members page sits behind a feature-preview switch (per-device
# localStorage), so the tester turns it on first, exactly as members-dm-hello
# does. The page is described by its rail label, "Crew Members", so the
# scenario reads the same whether the preview card is titled "Crew Members" or
# "Crew Members and Crew Mode". The member's card is hedged the same way it is
# in members-dm-hello: nightly artifacts show it rendering as the id
# "nova-sky" rather than a display name, and a step that insists on the display
# name files a friction entry every night for a GUI that is behaving.
name: members-private-memory-keeps-thread
tier: nightly
feature: members
user_story: >-
  As a crew operator, I want a member's direct-message thread to survive
  leaving and returning to the member, so that our earlier conversation and
  the member's ability to answer are not lost.
docs_url: docs/system-specs/modules/crew-mode.md
summary: Chat with a member, leave and return to it, confirm the thread keeps its history and still answers
preconditions:
  seed: rich
  members: [nova-sky]
  start_url: /settings
steps:
  - You are on the Settings page. Open the Developer section and find the Feature Previews list.
  - Turn on the preview whose title starts with "Crew Members" (it may read "Crew Members" or "Crew Members and Crew Mode"; either is the right one). Ignore the Webhooks preview.
  - Open the Crew Members page. After the preview is on, a "Crew Members" item appears in the left rail, directly under Sessions; click it.
  - Click the member named Nova Sky (its card may read "nova-sky" instead of a display name; that is the same member) to open a direct-message conversation with it.
  - Type exactly "remember the blue door" in the message box and send it with Enter. Wait about three seconds and confirm a reply bubble appeared under your message.
  - Leave this conversation without touching any memory or edit control. Click another item in the left rail, such as Sessions, so the conversation is no longer showing.
  - Return to the member. Open the Crew Members page again from the left rail and click the same member (Nova Sky, whose card may read "nova-sky") to reopen the direct-message conversation.
  - Type exactly "still there?" in the message box and send it with Enter. Wait about three seconds.
expectations:
  - The earlier bubble containing "remember the blue door" is still visible in the conversation, above the newer messages.
  - A chat bubble containing "still there?" is visible below it, and a reply from the member appears under that bubble.
  - No red error banner or error bubble is visible in the conversation.
  - The member's name is visible in the conversation header or card.
max_steps: 24
max_seconds: 600
