# Nightly: a member's memory store is a configuration knob, and changing it must
# not cost the user the conversation they already had with that member, nor
# stop the member from answering. The tester chats with a member on the shared
# store, switches that member to a private memory through the GUI, comes back
# to the DM thread and checks two things a DOM test cannot judge together: the
# earlier bubble is still on screen, and a fresh message still gets a reply.
#
# The Crew Members page sits behind a feature-preview switch (per-device
# localStorage), so the tester turns it on first, exactly as members-dm-hello
# does. The private-memory control lives in the member's edit panel (a field
# titled "Memory store" with a "Create private memory" button and a confirm
# dialog); the steps describe it by that label, not by where it sits, so the
# scenario survives the panel moving.
name: members-private-memory-keeps-thread
tier: nightly
feature: members
user_story: >-
  As a crew operator, I want to give one member its own private memory after
  we have already been talking, so that its recall is isolated without losing
  the conversation we had or the member's ability to answer.
docs_url: docs/system-specs/modules/crew-mode.md
summary: Chat with a member, switch it to private memory, confirm the thread keeps its history and still answers
preconditions:
  seed: rich
  members: [nova-sky]
  start_url: /settings
steps:
  - You are on the Settings page. Open the Developer section and find the Feature Previews list.
  - Turn on the preview whose title starts with "Crew Members" (it may read "Crew Members" or "Crew Members and Crew Mode"; either is the right one). Ignore the Webhooks preview.
  - Open the Crew Members page. After the preview is on, a "Crew Members" item appears in the left rail, directly under Sessions; click it.
  - Click the member named Nova Sky to open a direct-message conversation with it.
  - Type exactly "remember the blue door" in the message box and send it with Enter. Wait about three seconds and confirm a reply bubble appeared under your message.
  - Open this member's settings. Look for an edit control next to the member's name in the conversation header (a pencil icon that appears on hover, or an "Edit" button in the right-hand panel) and click it.
  - In the member's settings find the field titled "Memory store". It shows the word "default" and a button labelled "Create private memory". Click that button.
  - A confirmation dialog opens. Read it, then click its "Create private memory" button to confirm. Wait about three seconds for the change to save; the field should now describe the memory as private and owned by this member.
  - Close the settings panel and return to the direct-message conversation with Nova Sky (use the Crew Members page and click the member again if the conversation is not already showing).
  - Type exactly "still there?" in the message box and send it with Enter. Wait about three seconds.
expectations:
  - The earlier bubble containing "remember the blue door" is still visible in the conversation, above the newer messages.
  - A chat bubble containing "still there?" is visible below it, and a reply from the member appears under that bubble.
  - No red error banner or error bubble is visible in the conversation (for example nothing that reads "Essential source" or "cannot be a project resource").
  - The member's name is visible in the conversation header or card.
max_steps: 30
max_seconds: 720
